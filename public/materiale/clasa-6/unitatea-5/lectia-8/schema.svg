<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Organizarea textului argumentativ</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V, Lecția 7 · Motive pentru care călătoriile te fac mai bun</text>

  <path d="M 90 180 L 810 180" stroke="#b8944f" stroke-width="3" fill="none" marker-end="url(#arrF)"/>
  <defs>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8944f"/>
    </marker>
  </defs>

  <g>
    <rect x="60" y="110" width="220" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="170" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Ipoteza</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="170" y="164">Ideea pe care autorul</tspan>
      <tspan x="170" y="180">vrea s-o susțină.</tspan>
      <tspan x="170" y="206" font-style="italic">„Călătoriile te fac</tspan>
      <tspan x="170" y="222" font-style="italic">mai bun.”</tspan>
    </text>
  </g>

  <g>
    <rect x="340" y="110" width="220" height="140" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="450" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Argumentele</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="450" y="164">Motivele care susțin</tspan>
      <tspan x="450" y="180">ipoteza, în ordine.</tspan>
      <tspan x="450" y="206" font-style="italic">„Mai întâi... Apoi...”</tspan>
    </text>
  </g>

  <g>
    <rect x="620" y="110" width="220" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="730" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Concluzia</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="730" y="164">Reia ipoteza, întărită</tspan>
      <tspan x="730" y="180">de argumente.</tspan>
    </text>
  </g>

  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 7, p. 169</text>
</svg>
