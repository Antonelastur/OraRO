<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 828" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="828" fill="#faf7f0"/>
<text x="209.5" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="482.1" lengthAdjust="spacing">Vorbirea directă și vorbirea indirectă</text>
<text x="202.5" y="74.4" font-size="14" fill="#5b6b83" textLength="495.0" lengthAdjust="spacing">Clasa a VI-a · Unitatea a V-a, Lecția 18 · Manual, pp. 188-189 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. DOUĂ FELURI DE A REDA SPUSELE</text>
<rect x="40" y="128.6" width="820" height="124.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="380.0" height="88.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="174.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="119.4" lengthAdjust="spacing">vorbirea directă</text>
<text x="78.0" y="197.9" font-size="14.5" fill="#3a3226" textLength="65.8" lengthAdjust="spacing">reproduce</text>
<text x="147.7" y="197.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="59.6" lengthAdjust="spacing">întocmai</text>
<text x="211.3" y="197.9" font-size="14.5" fill="#3a3226" textLength="199.5" lengthAdjust="spacing">cuvintele unei persoane sau ale</text>
<text x="78.0" y="218.9" font-size="14.5" fill="#3a3226" textLength="87.1" lengthAdjust="spacing">unui personaj</text>
<rect x="458.0" y="146.6" width="380.0" height="88.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="174.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="133.6" lengthAdjust="spacing">vorbirea indirectă</text>
<text x="474.0" y="197.9" font-size="14.5" fill="#3a3226" textLength="80.0" lengthAdjust="spacing">redă spusele</text>
<text x="558.0" y="197.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="84.4" lengthAdjust="spacing">prin relatare</text>
<rect x="40" y="273.3" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="296.3" font-size="16" font-weight="700" fill="#ffffff">2. CUM TRANSFORM</text>
<rect x="40" y="307.3" width="820" height="228.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="340.3" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="340.3" font-size="15" fill="#3a3226" textLength="40.0" lengthAdjust="spacing">elimin</text>
<text x="118.3" y="340.3" font-size="15" fill="#3a3226" font-weight="700" textLength="99.9" lengthAdjust="spacing">linia de dialog</text>
<text x="218.2" y="340.3" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="365.0" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="365.0" font-size="15" fill="#3a3226" textLength="53.2" lengthAdjust="spacing">folosesc</text>
<text x="131.5" y="365.0" font-size="15" fill="#3a3226" font-weight="700" textLength="134.5" lengthAdjust="spacing">verbe de declarație</text>
<text x="266.0" y="365.0" font-size="15" fill="#3a3226" textLength="75.3" lengthAdjust="spacing">, urmate de</text>
<text x="345.4" y="365.0" font-size="15" fill="#10233f" font-style="italic" textLength="227.6" lengthAdjust="spacing">că, să, ca să, dacă, unde, când, care</text>
<text x="572.9" y="365.0" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="389.8" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="389.8" font-size="15" fill="#3a3226" textLength="111.5" lengthAdjust="spacing">elimin enunțurile</text>
<text x="189.7" y="389.8" font-size="15" fill="#3a3226" font-weight="700" textLength="262.3" lengthAdjust="spacing">imperative, exclamative, interogative</text>
<text x="452.0" y="389.8" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="414.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="414.5" font-size="15" fill="#3a3226" textLength="354.9" lengthAdjust="spacing">trec verbele și pronumele de la persoanele I și a II-a la</text>
<text x="433.1" y="414.5" font-size="15" fill="#3a3226" font-weight="700" textLength="109.5" lengthAdjust="spacing">persoana a III-a</text>
<text x="542.6" y="414.5" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="439.3" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="439.3" font-size="15" fill="#3a3226" textLength="25.0" lengthAdjust="spacing">trec</text>
<text x="103.3" y="439.3" font-size="15" fill="#3a3226" font-weight="700" textLength="81.0" lengthAdjust="spacing">imperativul</text>
<text x="188.3" y="439.3" font-size="15" fill="#3a3226" textLength="12.2" lengthAdjust="spacing">în</text>
<text x="204.5" y="439.3" font-size="15" fill="#3a3226" font-weight="700" textLength="73.3" lengthAdjust="spacing">conjunctiv</text>
<text x="277.9" y="439.3" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="464.0" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="464.0" font-size="15" fill="#3a3226" textLength="131.7" lengthAdjust="spacing">trec substantivele în</text>
<text x="209.9" y="464.0" font-size="15" fill="#3a3226" font-weight="700" textLength="50.7" lengthAdjust="spacing">vocativ</text>
<text x="264.7" y="464.0" font-size="15" fill="#3a3226" textLength="135.9" lengthAdjust="spacing">în acuzativ sau dativ;</text>
<text x="62.0" y="488.8" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="488.8" font-size="15" fill="#3a3226" textLength="318.3" lengthAdjust="spacing">elimin exclamațiile și cuvintele care imită sunete;</text>
<text x="62.0" y="513.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="513.5" font-size="15" fill="#3a3226" textLength="90.0" lengthAdjust="spacing">redau cât mai</text>
<text x="168.2" y="513.5" font-size="15" fill="#3a3226" font-weight="700" textLength="37.5" lengthAdjust="spacing">exact</text>
<text x="209.8" y="513.5" font-size="15" fill="#3a3226" textLength="137.7" lengthAdjust="spacing">spusele personajului.</text>
<rect x="40" y="556.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="579.0" font-size="16" font-weight="700" fill="#ffffff">3. MODELUL DIN MANUAL</text>
<rect x="40" y="590.0" width="820" height="187.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="608.0" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="629.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="95.2" lengthAdjust="spacing">Vorbire directă</text>
<text x="462.0" y="629.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="107.2" lengthAdjust="spacing">Vorbire indirectă</text>
<line x1="62.0" y1="639.6" x2="838.0" y2="639.6" stroke="#e3dccb"/>
<text x="74.0" y="662.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="221.0" lengthAdjust="spacing">„— Goe! maică! Acolo ești? — Da!”</text>
<text x="462.0" y="662.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="338.3" lengthAdjust="spacing">Bunica îl întreabă pe Goe dacă este în acel loc. Băiatul</text>
<text x="462.0" y="683.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="121.6" lengthAdjust="spacing">răspunde afirmativ.</text>
<line x1="62.0" y1="693.4" x2="838.0" y2="693.4" stroke="#e3dccb"/>
<text x="74.0" y="715.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="326.2" lengthAdjust="spacing">„— Aide! zice mam’ mare, ieși odată! Ne-ai speriat.”</text>
<text x="462.0" y="715.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="297.1" lengthAdjust="spacing">Bunica îi cere să iasă odată, fiindcă le-a speriat.</text>
<line x1="62.0" y1="726.3" x2="838.0" y2="726.3" stroke="#e3dccb"/>
<text x="74.0" y="748.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="217.6" lengthAdjust="spacing">„— Nu pot! zbiară Goe dinăuntru.”</text>
<text x="462.0" y="748.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="223.4" lengthAdjust="spacing">Din interior, Goe strigă că nu poate.</text>
<line x1="62.0" y1="759.1" x2="838.0" y2="759.1" stroke="#e3dccb"/>
<line x1="450.0" y1="608.0" x2="450.0" y2="759.1" stroke="#e3dccb"/>
<text x="220.4" y="808.6" font-size="11.5" fill="#5b6b83" textLength="459.2" lengthAdjust="spacing">Sursa: Manual Art 6, pp. 188-189, rubricile Repere, modelul din Explorare și lista de control.</text>
</svg>
