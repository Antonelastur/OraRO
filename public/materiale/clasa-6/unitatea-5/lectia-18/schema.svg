<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="400" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Vorbirea directă și vorbirea indirectă</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V, Lecția 16 · D-l Goe... de I.L. Caragiale</text>

  <g>
    <rect x="50" y="95" width="380" height="190" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="240" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Vorbire directă</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle">
      <tspan x="240" y="146">— Goe! maică! Acolo ești?</tspan>
      <tspan x="240" y="164">— Da!</tspan>
      <tspan x="240" y="182">— Aide! zice mam’ mare,</tspan>
      <tspan x="240" y="198">ieși odată!</tspan>
      <tspan x="240" y="224">Păstrează linia de dialog,</tspan>
      <tspan x="240" y="240">semnele de exclamare/</tspan>
      <tspan x="240" y="256">întrebare, vocativul.</tspan>
    </text>
  </g>

  <path d="M 440 190 L 470 190" stroke="#b8944f" stroke-width="2.5" fill="none" marker-end="url(#arrG)"/>
  <defs>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b8944f"/>
    </marker>
  </defs>

  <g>
    <rect x="480" y="95" width="380" height="190" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="670" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Vorbire indirectă</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle">
      <tspan x="670" y="146">Bunica îl întreabă pe Goe</tspan>
      <tspan x="670" y="164">dacă este în acel loc.</tspan>
      <tspan x="670" y="182">Băiatul răspunde afirmativ.</tspan>
      <tspan x="670" y="198">Bunica îi cere să iasă odată.</tspan>
      <tspan x="670" y="224">Fără linie de dialog; folosește</tspan>
      <tspan x="670" y="240">verbe de declarație (întreabă,</tspan>
      <tspan x="670" y="256">cere) + conjunctiv/subordonată.</tspan>
    </text>
  </g>

  <rect x="150" y="310" width="600" height="52" rx="14" fill="#fff3da" stroke="#b8944f" stroke-width="1.5"/>
  <text font-size="11.5" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="332">Vorbirea indirectă nu reproduce exact cuvintele personajului,</tspan>
    <tspan x="450" y="349">le reformulează prin verbe de declarație și propoziții subordonate.</tspan>
  </text>

  <text x="450" y="388" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 16, p. 188, partea 1/2</text>
</svg>
