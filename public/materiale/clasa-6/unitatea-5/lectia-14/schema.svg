<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="400" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Adjectivul (actualizare)</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V, Lecția 12</text>

  <rect x="180" y="88" width="540" height="60" rx="14" fill="#6f5ea8"/>
  <text font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <tspan x="450" y="112">Adjectivul se acordă cu substantivul determinat</tspan>
    <tspan x="450" y="132">în gen, număr și caz</tspan>
  </text>

  <g>
    <rect x="60" y="170" width="240" height="150" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="180" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Propriu-zis / din participiu</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="180" y="222" font-style="italic">masivă, întunecat</tspan>
      <tspan x="180" y="238">(propriu-zise)</tspan>
      <tspan x="180" y="260" font-style="italic">deschisă (din verb</tspan>
      <tspan x="180" y="276">la participiu)</tspan>
    </text>
  </g>

  <g>
    <rect x="330" y="170" width="240" height="150" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Poziția și numărul formelor</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="450" y="222">Înainte sau după substantiv.</tspan>
      <tspan x="450" y="248" font-style="italic">drăguț, drăguță,</tspan>
      <tspan x="450" y="264" font-style="italic">drăguți, drăguțe</tspan>
      <tspan x="450" y="286">(patru forme)</tspan>
    </text>
  </g>

  <g>
    <rect x="600" y="170" width="240" height="150" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="720" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Grade de comparație</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="720" y="222">Nu toate adjectivele au</tspan>
      <tspan x="720" y="238">grade de comparație.</tspan>
      <tspan x="720" y="264" font-style="italic">Articolul demonstrativ</tspan>
      <tspan x="720" y="280" font-style="italic">„cel/cea” reia substantivul.</tspan>
    </text>
  </g>

  <text x="450" y="360" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 12, pp. 180-181</text>
</svg>
