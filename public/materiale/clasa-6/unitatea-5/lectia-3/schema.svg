<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Acțiunea, spațiul și timpul</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V, Lecția 2 · D-l Goe... de I.L. Caragiale</text>

  <g>
    <rect x="60" y="100" width="360" height="180" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="240" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Spațiul călătoriei</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="240" y="154">Spațiul inițial (gara de</tspan>
      <tspan x="240" y="170">plecare), spațiul desfășurării</tspan>
      <tspan x="240" y="186">(trenul, compartimentul) și</tspan>
      <tspan x="240" y="202">spațiul final (destinația).</tspan>
      <tspan x="240" y="228" font-style="italic">Localitățile prin care trece</tspan>
      <tspan x="240" y="244" font-style="italic">trenul sunt reale, verificabile.</tspan>
    </text>
  </g>

  <g>
    <rect x="480" y="100" width="360" height="180" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="660" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Timpul călătoriei</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="660" y="154">Se identifică din indicii</tspan>
      <tspan x="660" y="170">temporali: data, momentul</tspan>
      <tspan x="660" y="186">zilei, ora la care trenul</tspan>
      <tspan x="660" y="202">trebuie să ajungă.</tspan>
      <tspan x="660" y="228">Acțiunea nu e un singur</tspan>
      <tspan x="660" y="244">eveniment, ci o succesiune.</tspan>
    </text>
  </g>

  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 2, pp. 158-159</text>
</svg>
