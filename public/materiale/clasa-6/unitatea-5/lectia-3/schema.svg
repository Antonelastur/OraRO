<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 809" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="809" fill="#faf7f0"/>
<text x="195.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="510.1" lengthAdjust="spacing">Acțiunea, spațiul și timpul într-o schiță</text>
<text x="206.3" y="74.4" font-size="14" fill="#5b6b83" textLength="487.5" lengthAdjust="spacing">Clasa a VI-a · Unitatea a V-a, Lecția 3 · Manual, pp. 158-159 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL NARATIV DE DIMENSIUNI REDUSE</text>
<rect x="40" y="128.6" width="820" height="254.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="164.2" lengthAdjust="spacing">Unele texte narative sunt</text>
<text x="230.3" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="42.9" lengthAdjust="spacing">scurte</text>
<text x="277.2" y="161.6" font-size="15" fill="#3a3226" textLength="158.6" lengthAdjust="spacing">și au acțiunea limitată la</text>
<text x="439.9" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="235.0" lengthAdjust="spacing">un singur eveniment semnificativ</text>
<text x="678.9" y="161.6" font-size="15" fill="#3a3226" textLength="145.9" lengthAdjust="spacing">din viața personajelor.</text>
<text x="62.0" y="183.3" font-size="15" fill="#3a3226" textLength="319.2" lengthAdjust="spacing">Multe dintre textele lui I.L. Caragiale din volumul</text>
<text x="385.2" y="183.3" font-size="15" fill="#10233f" font-style="italic" textLength="116.2" lengthAdjust="spacing">Momente și schițe</text>
<text x="505.5" y="183.3" font-size="15" fill="#3a3226" textLength="123.6" lengthAdjust="spacing">au aceste trăsături.</text>
<rect x="62.0" y="201.8" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="223.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="63.5" lengthAdjust="spacing">Elementul</text>
<text x="306.8" y="223.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="58.6" lengthAdjust="spacing">Cum este</text>
<line x1="62.0" y1="233.4" x2="838.0" y2="233.4" stroke="#e3dccb"/>
<text x="74.0" y="255.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="57.9" lengthAdjust="spacing">acțiunea</text>
<text x="306.8" y="255.9" font-size="14.5" fill="#3a3226" textLength="164.1" lengthAdjust="spacing">un singur eveniment; ritm</text>
<text x="474.9" y="255.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="31.2" lengthAdjust="spacing">alert</text>
<line x1="62.0" y1="266.2" x2="838.0" y2="266.2" stroke="#e3dccb"/>
<text x="74.0" y="288.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="45.8" lengthAdjust="spacing">spațiul</text>
<text x="306.8" y="288.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="54.5" lengthAdjust="spacing">restrâns</text>
<line x1="62.0" y1="299.1" x2="838.0" y2="299.1" stroke="#e3dccb"/>
<text x="74.0" y="321.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="45.0" lengthAdjust="spacing">timpul</text>
<text x="306.8" y="321.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="44.7" lengthAdjust="spacing">limitat</text>
<line x1="62.0" y1="332.0" x2="838.0" y2="332.0" stroke="#e3dccb"/>
<text x="74.0" y="354.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="54.4" lengthAdjust="spacing">detaliile</text>
<text x="306.8" y="354.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="44.2" lengthAdjust="spacing">puține</text>
<text x="351.0" y="354.4" font-size="14.5" fill="#3a3226" textLength="28.1" lengthAdjust="spacing">, dar</text>
<text x="383.1" y="354.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="90.2" lengthAdjust="spacing">semnificative</text>
<line x1="62.0" y1="364.8" x2="838.0" y2="364.8" stroke="#e3dccb"/>
<line x1="294.8" y1="201.8" x2="294.8" y2="364.8" stroke="#e3dccb"/>
<rect x="40" y="402.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="425.8" font-size="16" font-weight="700" fill="#ffffff">2. CUM URMĂRESC SPAȚIUL ȘI TIMPUL</text>
<rect x="40" y="436.8" width="820" height="137.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="454.8" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="482.8" font-size="16" fill="#0d9c92" font-weight="700" textLength="97.6" lengthAdjust="spacing">spațiul inițial</text>
<text x="78.0" y="506.1" font-size="14.5" fill="#3a3226" textLength="136.4" lengthAdjust="spacing">unde începe acțiunea</text>
<rect x="326.0" y="454.8" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="482.8" font-size="16" fill="#6f5ea8" font-weight="700" textLength="142.6" lengthAdjust="spacing">spațiul desfășurării</text>
<text x="342.0" y="506.1" font-size="14.5" fill="#3a3226" textLength="173.9" lengthAdjust="spacing">unde se petrec întâmplările</text>
<rect x="590.0" y="454.8" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="606.0" y="482.8" font-size="16" fill="#9a7433" font-weight="700" textLength="88.5" lengthAdjust="spacing">spațiul final</text>
<text x="606.0" y="506.1" font-size="14.5" fill="#3a3226" textLength="188.8" lengthAdjust="spacing">unde se încheie evenimentele</text>
<text x="62.0" y="551.4" font-size="15" fill="#3a3226" textLength="30.6" lengthAdjust="spacing">Caut</text>
<text x="96.6" y="551.4" font-size="15" fill="#3a3226" font-weight="700" textLength="115.3" lengthAdjust="spacing">indicii temporali</text>
<text x="212.0" y="551.4" font-size="15" fill="#3a3226" textLength="459.6" lengthAdjust="spacing">: data, momentul zilei, ora, durata; din ei aflu cât durează întâmplarea.</text>
<rect x="40" y="593.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="616.9" font-size="16" font-weight="700" fill="#ffffff">3. CUM LUCREZ CU TEXTUL</text>
<rect x="40" y="627.9" width="820" height="129.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="660.9" font-size="15" fill="#3a3226" font-weight="700">1.</text>
<text x="81.0" y="660.9" font-size="15" fill="#3a3226" textLength="60.0" lengthAdjust="spacing">delimitez</text>
<text x="145.0" y="660.9" font-size="15" fill="#3a3226" font-weight="700" textLength="132.8" lengthAdjust="spacing">fragmentele logice</text>
<text x="281.8" y="660.9" font-size="15" fill="#3a3226" textLength="236.8" lengthAdjust="spacing">și găsesc cuvântul-cheie al fiecăruia;</text>
<text x="62.0" y="685.7" font-size="15" fill="#3a3226" font-weight="700">2.</text>
<text x="81.0" y="685.7" font-size="15" fill="#3a3226" textLength="58.4" lengthAdjust="spacing">formulez</text>
<text x="143.4" y="685.7" font-size="15" fill="#3a3226" font-weight="700" textLength="112.0" lengthAdjust="spacing">ideile principale</text>
<text x="259.4" y="685.7" font-size="15" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="273.4" y="685.7" font-size="15" fill="#3a3226" font-weight="700" textLength="35.9" lengthAdjust="spacing">tema</text>
<text x="309.2" y="685.7" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="710.4" font-size="15" fill="#3a3226" font-weight="700">3.</text>
<text x="81.0" y="710.4" font-size="15" fill="#3a3226" textLength="226.3" lengthAdjust="spacing">rezum oral, fragment cu fragment;</text>
<text x="62.0" y="735.2" font-size="15" fill="#3a3226" font-weight="700">4.</text>
<text x="81.0" y="735.2" font-size="15" fill="#3a3226" textLength="56.1" lengthAdjust="spacing">stabilesc</text>
<text x="141.1" y="735.2" font-size="15" fill="#3a3226" font-weight="700" textLength="64.5" lengthAdjust="spacing">persoana</text>
<text x="209.7" y="735.2" font-size="15" fill="#3a3226" textLength="150.1" lengthAdjust="spacing">la care se povestește și</text>
<text x="363.8" y="735.2" font-size="15" fill="#3a3226" font-weight="700" textLength="28.6" lengthAdjust="spacing">cine</text>
<text x="396.5" y="735.2" font-size="15" fill="#3a3226" textLength="74.4" lengthAdjust="spacing">povestește.</text>
<text x="139.9" y="789.2" font-size="11.5" fill="#5b6b83" textLength="620.3" lengthAdjust="spacing">Sursa: Manual Art 6, pp. 158-159, rubrica Repere și schemele din Explorare; textul de bază este „D-l Goe...” de I.L. Caragiale.</text>
</svg>
