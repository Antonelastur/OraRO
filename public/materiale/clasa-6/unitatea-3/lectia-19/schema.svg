<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Cazul genitiv</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 14 · articolul genitival</text>

  <rect x="180" y="95" width="540" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="450" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Atributul substantival genitival</text>
  <text font-size="12" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="150" font-weight="700">Întrebare: al, a, ai, ale cui?</tspan>
    <tspan x="450" y="178" font-style="italic">A descoperit cariocile </tspan><tspan font-weight="700" fill="#6f5ea8">surorii</tspan><tspan font-style="italic"> lui.</tspan>
    <tspan x="450" y="198">Articolul genitival (al, a, ai, ale) preia genul și numărul</tspan>
    <tspan x="450" y="216">substantivului determinat, nu ale substantivului în genitiv.</tspan>
  </text>

  <text x="450" y="290" text-anchor="middle" font-size="11.5" fill="#3a3226">Ex.: „pisoii violeți ai bunicii” — ai preia genul și numărul lui „pisoii”.</text>
  <text x="450" y="316" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 14, pp. 113-114</text>
</svg>
