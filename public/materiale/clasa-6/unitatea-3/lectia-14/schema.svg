<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="400" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Substantivul (actualizare)</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 9</text>

  <rect x="330" y="86" width="240" height="46" rx="14" fill="#6f5ea8"/>
  <text x="450" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">SUBSTANTIVUL</text>

  <path d="M 450 132 L 450 155 L 220 155 L 220 178" stroke="#b8944f" stroke-width="2.5" fill="none"/>
  <path d="M 450 132 L 450 155 L 680 155 L 680 178" stroke="#b8944f" stroke-width="2.5" fill="none"/>

  <g>
    <rect x="60" y="178" width="320" height="90" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="220" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Fel</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="220" y="225">comun (schior) sau propriu</tspan>
      <tspan x="220" y="242">(Predeal), cu literă mare</tspan>
      <tspan x="220" y="256">la propriu</tspan>
    </text>
  </g>

  <g>
    <rect x="520" y="178" width="320" height="90" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="680" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Gen și număr</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="680" y="225">masculin, feminin, neutru</tspan>
      <tspan x="680" y="242">singular sau plural</tspan>
      <tspan x="680" y="256" font-style="italic">un brad — doi brazi</tspan>
    </text>
  </g>

  <rect x="150" y="288" width="600" height="60" rx="14" fill="#fff3da" stroke="#b8944f" stroke-width="1.5"/>
  <text font-size="11.5" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="310">Unele substantive nu au forme diferențiate după număr, sau au</tspan>
    <tspan x="450" y="327">două forme de plural cu sensuri diferite (elemente / elemenți).</tspan>
  </text>

  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 9, pp. 102-104</text>
</svg>
