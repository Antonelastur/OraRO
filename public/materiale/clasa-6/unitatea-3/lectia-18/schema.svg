<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Cazul dativ</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 13 · complementul indirect</text>

  <rect x="180" y="95" width="540" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="450" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Complementul indirect</text>
  <text font-size="12" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="150" font-weight="700">Întrebare: cui?</tspan>
    <tspan x="450" y="178" font-style="italic">I-am adus Mariei o carte.</tspan>
    <tspan x="450" y="198" font-style="italic">Lui Carmen i-am scris un e-mail.</tspan>
    <tspan x="450" y="222">Arată ființa în folosul sau în paguba căreia se face acțiunea.</tspan>
  </text>

  <text x="450" y="290" text-anchor="middle" font-size="11.5" fill="#3a3226">Se exprimă des dublat: „I-am adus Mariei...” (i-, apoi Mariei).</text>
  <text x="450" y="316" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 13, p. 112</text>
</svg>
