<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="460" fill="#faf7f0"/>
  <text x="450" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#10233f">Bradul în cultura populară românească (I)</text>
  <text x="450" y="65" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 7 · tradiție și simboluri</text>
  <g>
    <rect x="60" y="95" width="375" height="300" rx="16" fill="#ffffff" stroke="#0d9c92" stroke-width="2.5"/>
    <rect x="60" y="95" width="375" height="46" rx="16" fill="#0d9c92"/>
    <rect x="60" y="119" width="375" height="22" fill="#0d9c92"/>
    <text x="247.5" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">CE SIMBOLIZEAZĂ</text>
    <text font-size="12" fill="#3a3226"><tspan x="82" y="169">• Prin verticalitate, un drum spre veșnicie.</tspan></text>
    <text font-size="12" fill="#3a3226"><tspan x="82" y="193">• Leagă lumea subterană, cea terestră și cea</tspan><tspan x="82" y="211">  cerească.</tspan></text>
    <text font-size="12" fill="#3a3226"><tspan x="82" y="235">• Ocrotește viața omului și îndepărtează teama de</tspan><tspan x="82" y="253">  moarte.</tspan></text>
    <text font-size="12" fill="#3a3226"><tspan x="82" y="277">• În mentalitatea creștină, simbol al Sfintei</tspan><tspan x="82" y="295">  Treimi.</tspan></text>
    <rect x="82" y="337" width="331" height="46" rx="10" fill="#eaf6f4"/>
    <text x="96" y="357" font-size="11.5" fill="#3a3226">Tămâia, o rășină, este element purificator și</text>
    <text x="96" y="372" font-size="11.5" fill="#3a3226">ocrotitor.</text>
  </g>
  <g>
    <rect x="465" y="95" width="375" height="300" rx="16" fill="#ffffff" stroke="#6f5ea8" stroke-width="2.5"/>
    <rect x="465" y="95" width="375" height="46" rx="16" fill="#6f5ea8"/>
    <rect x="465" y="119" width="375" height="22" fill="#6f5ea8"/>
    <text x="652.5" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ÎN RITURILE DE TRECERE</text>
    <text font-size="12" fill="#3a3226"><tspan x="487" y="169">• Apare în toate riturile de trecere românești.</tspan></text>
    <text font-size="12" fill="#3a3226"><tspan x="487" y="193">• Sprijină tânărul în inițiere: putere, inteligență,</tspan><tspan x="487" y="211">  curaj.</tspan></text>
    <text font-size="12" fill="#3a3226"><tspan x="487" y="235">• Puteri ocrotitoare preluate de la romani.</tspan></text>
    <rect x="487" y="337" width="331" height="46" rx="10" fill="#f1ecfa"/>
    <text x="501" y="357" font-size="11.5" fill="#3a3226">Ramuri de brad la coama casei în construcție, la</text>
    <text x="501" y="372" font-size="11.5" fill="#3a3226">hățurile cailor, la căruțe.</text>
  </g>
  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 7, pp. 96-97 (Repere)</text>
</svg>
