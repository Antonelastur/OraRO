<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="460" fill="#faf7f0"/>
  <text x="450" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#10233f">Bradul în cultura populară românească (II)</text>
  <text x="450" y="65" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 7 · artă și design contemporan</text>
  <g>
    <rect x="60" y="95" width="375" height="300" rx="16" fill="#ffffff" stroke="#0d9c92" stroke-width="2.5"/>
    <rect x="60" y="95" width="375" height="46" rx="16" fill="#0d9c92"/>
    <rect x="60" y="119" width="375" height="22" fill="#0d9c92"/>
    <text x="247.5" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ÎN ARTA POPULARĂ</text>
    <text font-size="12" fill="#3a3226"><tspan x="82" y="169">• Imaginea bradului apare stilizată, ca motiv</tspan><tspan x="82" y="187">  decorativ.</tspan></text>
    <text font-size="12" fill="#3a3226"><tspan x="82" y="211">• Se regăsește pe covoare, ștergare, ii, cojoace,</tspan><tspan x="82" y="229">  lăzi de zestre.</tspan></text>
    <text font-size="12" fill="#3a3226"><tspan x="82" y="253">• Motivul trece din obicei în ornament, păstrându-și</tspan><tspan x="82" y="271">  sensul.</tspan></text>
    <rect x="82" y="337" width="331" height="46" rx="10" fill="#eaf6f4"/>
    <text x="96" y="357" font-size="11.5" fill="#3a3226">Bradul de pe o ie sau de pe un ștergar spune</text>
    <text x="96" y="372" font-size="11.5" fill="#3a3226">aceeași poveste ca bradul din ritual.</text>
  </g>
  <g>
    <rect x="465" y="95" width="375" height="300" rx="16" fill="#ffffff" stroke="#6f5ea8" stroke-width="2.5"/>
    <rect x="465" y="95" width="375" height="46" rx="16" fill="#6f5ea8"/>
    <rect x="465" y="119" width="375" height="22" fill="#6f5ea8"/>
    <text x="652.5" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ÎN ARTA MODERNĂ</text>
    <text font-size="12" fill="#3a3226"><tspan x="487" y="169">• Elemente tradiționale sunt reluate în pictură și</tspan><tspan x="487" y="187">  în modă.</tspan></text>
    <text font-size="12" fill="#3a3226"><tspan x="487" y="211">• Ia românească a devenit celebră prin tabloul lui</tspan><tspan x="487" y="229">  Henri Matisse.</tspan></text>
    <text font-size="12" fill="#3a3226"><tspan x="487" y="253">• „La Blouse roumaine” (Ia românească), pictat în</tspan><tspan x="487" y="271">  1940.</tspan></text>
    <rect x="487" y="337" width="331" height="46" rx="10" fill="#f1ecfa"/>
    <text x="501" y="357" font-size="11.5" fill="#3a3226">Motivele populare, între care bradul stilizat,</text>
    <text x="501" y="372" font-size="11.5" fill="#3a3226">inspiră designul vestimentar de azi.</text>
  </g>
  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 7, pp. 96-97 (Repere)</text>
</svg>
