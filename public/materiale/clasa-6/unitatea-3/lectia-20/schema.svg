<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Cazul vocativ</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 15</text>

  <rect x="180" y="95" width="540" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="450" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">O chemare, nu o funcție sintactică</text>
  <text font-size="12" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="150">Arată o chemare sau atrage atenția cuiva.</tspan>
    <tspan x="450" y="176" font-style="italic">Corina, pleci departe în vacanță?</tspan>
    <tspan x="450" y="196" font-style="italic">Ascultă melodia, băiatule!</tspan>
    <tspan x="450" y="222">Formă proprie (-e, -ule, -o, -lor) sau identică cu nominativul.</tspan>
  </text>

  <text x="450" y="290" text-anchor="middle" font-size="11.5" fill="#3a3226">În scris, se separă mereu prin virgulă de restul propoziției.</text>
  <text x="450" y="316" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 15, p. 115</text>
</svg>
