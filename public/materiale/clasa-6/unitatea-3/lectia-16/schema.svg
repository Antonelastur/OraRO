<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1094" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1094" fill="#faf7f0"/>
<text x="97.5" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="706.4" lengthAdjust="spacing">Cazul acuzativ. Complementul direct și complementul</text>
<text x="362.4" y="85.0" font-size="28" fill="#10233f" font-weight="700" textLength="175.3" lengthAdjust="spacing">prepozițional</text>
<text x="201.2" y="109.4" font-size="14" fill="#5b6b83" textLength="497.7" lengthAdjust="spacing">Clasa a VI-a · Unitatea a III-a, Lecția 16 · Manual, pp. 106-108 · notițe pentru caiet</text>
<rect x="40" y="129.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="152.6" font-size="16" font-weight="700" fill="#ffffff">1. ACUZATIVUL</text>
<rect x="40" y="163.6" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="196.6" font-size="15" fill="#3a3226" textLength="170.2" lengthAdjust="spacing">Substantivul cu funcția de</text>
<text x="236.3" y="196.6" font-size="15" fill="#3a3226" font-weight="700" textLength="88.7" lengthAdjust="spacing">complement</text>
<text x="325.0" y="196.6" font-size="15" fill="#3a3226" textLength="199.6" lengthAdjust="spacing">, cu sau fără prepoziție, este în</text>
<text x="528.6" y="196.6" font-size="15" fill="#3a3226" font-weight="700" textLength="57.9" lengthAdjust="spacing">acuzativ</text>
<text x="586.5" y="196.6" font-size="15" fill="#3a3226" textLength="182.1" lengthAdjust="spacing">. La nominativ și la acuzativ,</text>
<text x="62.0" y="218.4" font-size="15" fill="#3a3226" textLength="106.6" lengthAdjust="spacing">substantivele au</text>
<text x="172.7" y="218.4" font-size="15" fill="#3a3226" font-weight="700" textLength="97.3" lengthAdjust="spacing">aceeași formă</text>
<text x="274.1" y="218.4" font-size="15" fill="#3a3226" textLength="132.2" lengthAdjust="spacing">(omonimie cazuală).</text>
<rect x="40" y="260.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="283.9" font-size="16" font-weight="700" fill="#ffffff">2. DOUĂ COMPLEMENTE</text>
<rect x="40" y="294.9" width="820" height="262.0" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="312.9" width="776.0" height="31.6" fill="#efeaf8"/>

<text x="213.7" y="334.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="134.1" lengthAdjust="spacing">Complementul direct</text>
<text x="531.8" y="334.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="182.0" lengthAdjust="spacing">Complementul prepozițional</text>
<line x1="62.0" y1="344.4" x2="838.0" y2="344.4" stroke="#e3dccb"/>
<text x="74.0" y="366.9" font-size="14.5" fill="#3a3226" textLength="50.3" lengthAdjust="spacing">ce arată</text>
<text x="213.7" y="366.9" font-size="14.5" fill="#3a3226" textLength="262.3" lengthAdjust="spacing">obiectul asupra căruia acționează autorul</text>
<text x="213.7" y="387.9" font-size="14.5" fill="#3a3226" textLength="36.4" lengthAdjust="spacing">faptei</text>
<text x="531.8" y="366.9" font-size="14.5" fill="#3a3226" textLength="267.1" lengthAdjust="spacing">obiectul care este ținta acțiunii sau pentru</text>
<text x="531.8" y="387.9" font-size="14.5" fill="#3a3226" textLength="116.3" lengthAdjust="spacing">care se acționează</text>
<line x1="62.0" y1="398.3" x2="838.0" y2="398.3" stroke="#e3dccb"/>
<text x="74.0" y="420.8" font-size="14.5" fill="#3a3226" textLength="64.8" lengthAdjust="spacing">întrebările</text>
<text x="213.7" y="420.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="74.1" lengthAdjust="spacing">pe cine? ce?</text>
<text x="531.8" y="420.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="279.1" lengthAdjust="spacing">pentru cine? de ce? la cine? la ce? de la cine?</text>
<text x="531.8" y="441.8" font-size="14.5" fill="#3a3226" textLength="22.3" lengthAdjust="spacing">etc.</text>
<line x1="62.0" y1="452.2" x2="838.0" y2="452.2" stroke="#e3dccb"/>
<text x="74.0" y="474.7" font-size="14.5" fill="#3a3226" textLength="38.0" lengthAdjust="spacing">forma</text>
<text x="213.7" y="474.7" font-size="14.5" fill="#3a3226" textLength="54.8" lengthAdjust="spacing">acuzativ,</text>
<text x="272.4" y="474.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="74.0" lengthAdjust="spacing">cu sau fără</text>
<text x="350.3" y="474.7" font-size="14.5" fill="#10233f" font-weight="700" font-style="italic" textLength="16.1" lengthAdjust="spacing">pe</text>
<text x="531.8" y="474.7" font-size="14.5" fill="#3a3226" textLength="54.8" lengthAdjust="spacing">acuzativ,</text>
<text x="590.6" y="474.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="88.9" lengthAdjust="spacing">cu prepoziție</text>
<line x1="62.0" y1="485.0" x2="838.0" y2="485.0" stroke="#e3dccb"/>
<text x="74.0" y="507.5" font-size="14.5" fill="#3a3226" textLength="53.8" lengthAdjust="spacing">exemple</text>
<text x="213.7" y="507.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="90.5" lengthAdjust="spacing">Dan colorează</text>
<text x="308.1" y="507.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="52.8" lengthAdjust="spacing">desenul</text>
<text x="360.9" y="507.5" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<text x="368.0" y="507.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="53.6" lengthAdjust="spacing">O zăresc</text>
<text x="425.5" y="507.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="60.3" lengthAdjust="spacing">pe Maria</text>
<text x="485.8" y="507.5" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<text x="531.8" y="507.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="79.2" lengthAdjust="spacing">Nu se satură</text>
<text x="614.9" y="507.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.2" lengthAdjust="spacing">de cărți</text>
<text x="666.1" y="507.5" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<text x="673.2" y="507.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="74.5" lengthAdjust="spacing">Se gândește</text>
<text x="751.7" y="507.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="24.8" lengthAdjust="spacing">la o</text>
<text x="531.8" y="528.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="62.2" lengthAdjust="spacing">expoziție</text>
<text x="594.0" y="528.5" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="538.9" x2="838.0" y2="538.9" stroke="#e3dccb"/>
<line x1="201.7" y1="312.9" x2="201.7" y2="538.9" stroke="#e3dccb"/>
<line x1="519.8" y1="312.9" x2="519.8" y2="538.9" stroke="#e3dccb"/>
<rect x="40" y="576.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="599.9" font-size="16" font-weight="700" fill="#ffffff">3. PE: DIRECT SAU PREPOZIȚIONAL?</text>
<rect x="40" y="610.9" width="820" height="148.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="628.9" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="656.9" font-size="16" fill="#0d9c92" font-weight="700" textLength="142.4" lengthAdjust="spacing">complement direct</text>
<text x="78.0" y="680.2" font-size="14.5" fill="#3a3226" textLength="48.9" lengthAdjust="spacing">poate fi</text>
<text x="130.8" y="680.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="44.4" lengthAdjust="spacing">dublat</text>
<text x="179.1" y="680.2" font-size="14.5" fill="#3a3226" textLength="171.0" lengthAdjust="spacing">de o formă neaccentuată a</text>
<text x="78.0" y="701.2" font-size="14.5" fill="#3a3226" textLength="73.9" lengthAdjust="spacing">pronumelui</text>
<text x="78.0" y="725.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="8.7" lengthAdjust="spacing">Îl</text>
<text x="90.6" y="725.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="36.5" lengthAdjust="spacing">ascult</text>
<text x="131.1" y="725.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="48.3" lengthAdjust="spacing">pe Dan</text>
<text x="179.4" y="725.1" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<rect x="458.0" y="628.9" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="656.9" font-size="16" fill="#6f5ea8" font-weight="700" textLength="199.2" lengthAdjust="spacing">complement prepozițional</text>
<text x="474.0" y="680.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="17.7" lengthAdjust="spacing">nu</text>
<text x="495.6" y="680.2" font-size="14.5" fill="#3a3226" textLength="94.0" lengthAdjust="spacing">poate fi dublat</text>
<text x="474.0" y="704.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="43.5" lengthAdjust="spacing">Contez</text>
<text x="521.4" y="704.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="74.0" lengthAdjust="spacing">pe prieteni</text>
<text x="595.4" y="704.1" font-size="14.5" fill="#3a3226" textLength="31.2" lengthAdjust="spacing">. (nu:</text>
<text x="630.5" y="704.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="122.5" lengthAdjust="spacing">Îi contez pe prieteni</text>
<text x="753.0" y="704.1" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">)</text>
<rect x="40" y="779.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="802.5" font-size="16" font-weight="700" fill="#ffffff">4. ORTOGRAFIA LA PLURAL</text>
<rect x="40" y="813.5" width="820" height="230.0" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="831.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="130.7" y="853.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="56.7" lengthAdjust="spacing">Cuvântul</text>
<text x="285.1" y="853.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="136.2" lengthAdjust="spacing">Face parte din cuvânt</text>
<text x="515.3" y="853.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="63.3" lengthAdjust="spacing">Desinența</text>
<text x="688.5" y="853.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="105.0" lengthAdjust="spacing">Articolul hotărât</text>
<line x1="62.0" y1="863.0" x2="838.0" y2="863.0" stroke="#e3dccb"/>
<text x="142.3" y="885.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="33.3" lengthAdjust="spacing">copiii</text>
<text x="337.2" y="885.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="31.6" lengthAdjust="spacing">copi-</text>
<text x="539.3" y="885.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="15.4" lengthAdjust="spacing">-i-</text>
<text x="736.2" y="885.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="9.6" lengthAdjust="spacing">-i</text>
<line x1="62.0" y1="895.9" x2="838.0" y2="895.9" stroke="#e3dccb"/>
<text x="135.1" y="918.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="47.7" lengthAdjust="spacing">poeziile</text>
<text x="333.6" y="918.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="38.9" lengthAdjust="spacing">poezi-</text>
<text x="539.3" y="918.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="15.4" lengthAdjust="spacing">-i-</text>
<text x="732.7" y="918.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="16.7" lengthAdjust="spacing">-le</text>
<line x1="62.0" y1="928.7" x2="838.0" y2="928.7" stroke="#e3dccb"/>
<line x1="256.0" y1="831.5" x2="256.0" y2="928.7" stroke="#e3dccb"/>
<line x1="450.0" y1="831.5" x2="450.0" y2="928.7" stroke="#e3dccb"/>
<line x1="644.0" y1="831.5" x2="644.0" y2="928.7" stroke="#e3dccb"/>
<rect x="62.0" y="942.7" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="969.2" font-size="14.5" fill="#10233f" font-weight="700" textLength="119.9" lengthAdjust="spacing">Model de analiză:</text>
<text x="78.0" y="988.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="724.5" lengthAdjust="spacing">„pe prietenele” – substantiv comun, genul feminin, numărul plural, cazul acuzativ, articulat cu articolul hotărât „-le”,</text>
<text x="78.0" y="1009.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="469.9" lengthAdjust="spacing">precedat de prepoziția simplă „pe”, funcția sintactică de complement direct.</text>
<text x="268.8" y="1075.0" font-size="11.5" fill="#5b6b83" textLength="362.5" lengthAdjust="spacing">Sursa: Manual Art 6, pp. 106-108, rubricile Repere și modelul de analiză.</text>
</svg>
