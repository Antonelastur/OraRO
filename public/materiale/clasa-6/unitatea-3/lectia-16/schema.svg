<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Cazul acuzativ</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 11 · complementul direct și prepozițional</text>

  <g>
    <rect x="90" y="95" width="330" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="255" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Complement direct</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="255" y="148">Fără prepoziție înainte.</tspan>
      <tspan x="255" y="164" font-weight="700">Întrebări: pe cine? ce?</tspan>
      <tspan x="255" y="196" font-style="italic">Ascult numai melodii</tspan>
      <tspan x="255" y="212" font-style="italic">moderne.</tspan>
    </text>
  </g>

  <g>
    <rect x="480" y="95" width="330" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="645" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Complement prepozițional</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="645" y="148">Cu prepoziție înainte.</tspan>
      <tspan x="645" y="164" font-weight="700">Întrebări: la cine/ce? etc.</tspan>
      <tspan x="645" y="196" font-style="italic">Mă bizui pe sprijinul</tspan>
      <tspan x="645" y="212" font-style="italic">prietenului meu.</tspan>
    </text>
  </g>

  <text x="450" y="290" text-anchor="middle" font-size="11.5" fill="#3a3226">Amândouă determină un verb și stau în cazul acuzativ.</text>
  <text x="450" y="316" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 11, pp. 106-108</text>
</svg>
