<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="420" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Epitetul și alte figuri de stil</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 3 · Iarna de Vasile Alecsandri</text>

  <g>
    <rect x="40" y="95" width="270" height="190" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="175" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Epitetul</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle">
      <tspan x="175" y="146">Un cuvânt (adesea</tspan>
      <tspan x="175" y="161">adjectiv) care arată o</tspan>
      <tspan x="175" y="176">însușire deosebită.</tspan>
      <tspan x="175" y="206" font-style="italic">„soarele rotund</tspan>
      <tspan x="175" y="221" font-style="italic">și palid”</tspan>
      <tspan x="175" y="246" font-style="italic">„sanie ușoară”</tspan>
    </text>
  </g>

  <g>
    <rect x="315" y="95" width="270" height="190" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="450" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Comparația</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle">
      <tspan x="450" y="146">Apropie două elemente</tspan>
      <tspan x="450" y="161">printr-un cuvânt de</tspan>
      <tspan x="450" y="176">legătură (ca, precum).</tspan>
      <tspan x="450" y="206" font-style="italic">„plopii... ca</tspan>
      <tspan x="450" y="221" font-style="italic">fantasme albe”</tspan>
      <tspan x="450" y="246">→ sugerează neliniște</tspan>
    </text>
  </g>

  <g>
    <rect x="590" y="95" width="270" height="190" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="725" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Personificarea</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle">
      <tspan x="725" y="146">Dă însușiri omenești</tspan>
      <tspan x="725" y="161">unor lucruri sau</tspan>
      <tspan x="725" y="176">fenomene ale naturii.</tspan>
      <tspan x="725" y="206" font-style="italic">„cumplita iarnă</tspan>
      <tspan x="725" y="221" font-style="italic">cerne norii”</tspan>
      <tspan x="725" y="246" font-style="italic">„doritul soare... dismiardă”</tspan>
    </text>
  </g>

  <rect x="150" y="310" width="600" height="52" rx="14" fill="#fff3da" stroke="#b8944f" stroke-width="1.5"/>
  <text font-size="12" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="332">Figurile de stil dau expresivitate textului: cuvântul capătă un sens</tspan>
    <tspan x="450" y="349">figurat, diferit de sensul lui propriu, de bază.</tspan>
  </text>

  <text x="450" y="398" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 3, p. 88, partea 1/2</text>
</svg>
