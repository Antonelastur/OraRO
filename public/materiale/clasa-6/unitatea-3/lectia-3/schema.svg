<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 977" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="977" fill="#faf7f0"/>
<text x="200.3" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="500.6" lengthAdjust="spacing">Descrierea în versuri. Tabloul. Pastelul</text>
<text x="212.5" y="74.4" font-size="14" fill="#5b6b83" textLength="475.0" lengthAdjust="spacing">Clasa a VI-a · Unitatea a III-a, Lecția 3 · Manual, pp. 86-87 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL DESCRIPTIV LITERAR</text>
<rect x="40" y="128.6" width="820" height="282.4" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" textLength="56.6" lengthAdjust="spacing">Prezintă</text>
<text x="123.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="61.8" lengthAdjust="spacing">sugestiv</text>
<text x="189.0" y="162.6" font-size="16" fill="#10233f" textLength="620.8" lengthAdjust="spacing">elementele componente și proprietățile particulare ale unui obiect, ale unei ființe sau ale</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="81.8" lengthAdjust="spacing">unui spațiu.</text>
<text x="62.0" y="219.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="219.6" font-size="15" fill="#3a3226" textLength="309.1" lengthAdjust="spacing">Părțile componente pot avea, la rândul lor, alte</text>
<text x="387.4" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="158.6" lengthAdjust="spacing">elemente componente</text>
<text x="545.9" y="219.6" font-size="15" fill="#3a3226" textLength="51.0" lengthAdjust="spacing">, cu alte</text>
<text x="601.0" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="76.0" lengthAdjust="spacing">proprietăți</text>
<text x="677.0" y="219.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="244.3" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="244.3" font-size="15" fill="#3a3226" textLength="281.2" lengthAdjust="spacing">Obiectul descris poate fi pus în legătură cu</text>
<text x="359.5" y="244.3" font-size="15" fill="#3a3226" font-weight="700" textLength="82.3" lengthAdjust="spacing">alte obiecte</text>
<text x="445.9" y="244.3" font-size="15" fill="#3a3226" textLength="98.5" lengthAdjust="spacing">din spațiu și cu</text>
<text x="548.5" y="244.3" font-size="15" fill="#3a3226" font-weight="700" textLength="46.5" lengthAdjust="spacing">timpul</text>
<text x="599.0" y="244.3" font-size="15" fill="#3a3226" textLength="201.3" lengthAdjust="spacing">(momentul în care e observat).</text>
<rect x="62.0" y="262.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="128.2" y="284.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="100.4" lengthAdjust="spacing">Obiectul descris</text>
<text x="347.3" y="284.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="128.0" lengthAdjust="spacing">Element component</text>
<text x="539.6" y="284.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="68.3" lengthAdjust="spacing">Proprietăți</text>
<line x1="62.0" y1="294.4" x2="838.0" y2="294.4" stroke="#e3dccb"/>
<text x="132.4" y="316.9" font-size="14.5" fill="#3a3226" textLength="92.1" lengthAdjust="spacing">peisaj de iarnă</text>
<text x="393.7" y="316.9" font-size="14.5" fill="#3a3226" textLength="35.1" lengthAdjust="spacing">câmp</text>
<text x="539.6" y="316.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="19.4" lengthAdjust="spacing">alb</text>
<line x1="62.0" y1="327.3" x2="838.0" y2="327.3" stroke="#e3dccb"/>

<text x="389.3" y="349.8" font-size="14.5" fill="#3a3226" textLength="43.8" lengthAdjust="spacing">dealuri</text>
<text x="539.6" y="349.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="26.5" lengthAdjust="spacing">albe</text>
<line x1="62.0" y1="360.1" x2="838.0" y2="360.1" stroke="#e3dccb"/>

<text x="394.9" y="382.6" font-size="14.5" fill="#3a3226" textLength="32.6" lengthAdjust="spacing">plopi</text>
<text x="539.6" y="382.6" font-size="14.5" fill="#3a3226" textLength="9.6" lengthAdjust="spacing">...</text>
<line x1="62.0" y1="393.0" x2="838.0" y2="393.0" stroke="#e3dccb"/>
<line x1="294.8" y1="262.9" x2="294.8" y2="393.0" stroke="#e3dccb"/>
<line x1="527.6" y1="262.9" x2="527.6" y2="393.0" stroke="#e3dccb"/>
<rect x="40" y="431.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="454.0" font-size="16" font-weight="700" fill="#ffffff">2. TABLOUL</text>
<rect x="40" y="465.0" width="820" height="123.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="498.0" font-size="15" fill="#3a3226" font-weight="700" textLength="52.9" lengthAdjust="spacing">Tabloul</text>
<text x="119.0" y="498.0" font-size="15" fill="#3a3226" textLength="355.8" lengthAdjust="spacing">este o formă a descrierii care înfățișează un aspect din</text>
<text x="478.8" y="498.0" font-size="15" fill="#3a3226" font-weight="700" textLength="46.4" lengthAdjust="spacing">natură</text>
<text x="525.2" y="498.0" font-size="15" fill="#3a3226" textLength="24.4" lengthAdjust="spacing">, un</text>
<text x="553.7" y="498.0" font-size="15" fill="#3a3226" font-weight="700" textLength="52.6" lengthAdjust="spacing">interior</text>
<text x="610.4" y="498.0" font-size="15" fill="#3a3226" textLength="22.5" lengthAdjust="spacing">sau</text>
<text x="636.9" y="498.0" font-size="15" fill="#3a3226" font-weight="700" textLength="39.1" lengthAdjust="spacing">scene</text>
<text x="680.1" y="498.0" font-size="15" fill="#3a3226" textLength="128.6" lengthAdjust="spacing">din viața de zi cu zi,</text>
<text x="62.0" y="519.7" font-size="15" fill="#3a3226" textLength="154.0" lengthAdjust="spacing">într-o imagine cuprinsă</text>
<text x="220.1" y="519.7" font-size="15" fill="#3a3226" font-weight="700" textLength="99.7" lengthAdjust="spacing">dintr-o privire</text>
<text x="319.8" y="519.7" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="544.5" font-size="15" fill="#3a3226" textLength="186.1" lengthAdjust="spacing">Tabloul literar seamănă cu o</text>
<text x="252.2" y="544.5" font-size="15" fill="#3a3226" font-weight="700" textLength="71.2" lengthAdjust="spacing">fotografie</text>
<text x="327.5" y="544.5" font-size="15" fill="#3a3226" textLength="54.9" lengthAdjust="spacing">sau cu o</text>
<text x="386.4" y="544.5" font-size="15" fill="#3a3226" font-weight="700" textLength="49.8" lengthAdjust="spacing">pictură</text>
<text x="436.2" y="544.5" font-size="15" fill="#3a3226" textLength="19.9" lengthAdjust="spacing">. În</text>
<text x="460.2" y="544.5" font-size="15" fill="#10233f" font-style="italic" textLength="34.0" lengthAdjust="spacing">Iarna</text>
<text x="498.3" y="544.5" font-size="15" fill="#3a3226" textLength="125.2" lengthAdjust="spacing">sunt două tablouri:</text>
<text x="627.6" y="544.5" font-size="15" fill="#3a3226" font-weight="700" textLength="137.2" lengthAdjust="spacing">iarna înfricoșătoare</text>
<text x="768.9" y="544.5" font-size="15" fill="#3a3226" textLength="54.3" lengthAdjust="spacing">(primele</text>
<text x="62.0" y="566.2" font-size="15" fill="#3a3226" textLength="82.2" lengthAdjust="spacing">trei strofe) și</text>
<text x="148.2" y="566.2" font-size="15" fill="#3a3226" font-weight="700" textLength="82.9" lengthAdjust="spacing">iarna veselă</text>
<text x="235.2" y="566.2" font-size="15" fill="#3a3226" textLength="95.5" lengthAdjust="spacing">(ultima strofă).</text>
<rect x="40" y="608.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="631.7" font-size="16" font-weight="700" fill="#ffffff">3. PASTELUL</text>
<rect x="40" y="642.7" width="820" height="99.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="660.7" width="776.0" height="63.9" rx="12" fill="#f3efe4"/><text x="78.0" y="687.2" font-size="14.5" fill="#3a3226" textLength="441.9" lengthAdjust="spacing">Poeziile care descriu natura sau un interior și transmit, în același timp,</text>
<text x="523.9" y="687.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="169.1" lengthAdjust="spacing">sentimentele privitorului</text>
<text x="696.8" y="687.2" font-size="14.5" fill="#3a3226" textLength="75.4" lengthAdjust="spacing">seamănă cu</text>
<text x="78.0" y="708.2" font-size="14.5" fill="#3a3226" textLength="317.8" lengthAdjust="spacing">tablourile făcute cu creioane colorate moi, numite</text>
<text x="399.7" y="708.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="59.4" lengthAdjust="spacing">pasteluri</text>
<text x="459.2" y="708.2" font-size="14.5" fill="#3a3226" textLength="338.1" lengthAdjust="spacing">. De aceea Vasile Alecsandri și-a numit astfel poeziile.</text>
<rect x="40" y="762.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="785.6" font-size="16" font-weight="700" fill="#ffffff">4. CUM CITESC O DESCRIERE ÎN VERSURI</text>
<rect x="40" y="796.6" width="820" height="129.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="829.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="829.6" font-size="15" fill="#3a3226" textLength="79.5" lengthAdjust="spacing">unde se află</text>
<text x="157.8" y="829.6" font-size="15" fill="#3a3226" font-weight="700" textLength="66.2" lengthAdjust="spacing">privitorul</text>
<text x="228.0" y="829.6" font-size="15" fill="#3a3226" textLength="270.6" lengthAdjust="spacing">(aproape, departe, în mijlocul peisajului)?</text>
<text x="62.0" y="854.3" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="854.3" font-size="15" fill="#3a3226" textLength="108.2" lengthAdjust="spacing">cum e imaginea:</text>
<text x="186.4" y="854.3" font-size="15" fill="#3a3226" font-weight="700" textLength="83.1" lengthAdjust="spacing">panoramică</text>
<text x="273.5" y="854.3" font-size="15" fill="#3a3226" textLength="22.5" lengthAdjust="spacing">sau</text>
<text x="300.1" y="854.3" font-size="15" fill="#3a3226" font-weight="700" textLength="61.8" lengthAdjust="spacing">detaliată</text>
<text x="361.9" y="854.3" font-size="15" fill="#3a3226" textLength="6.8" lengthAdjust="spacing">?</text>
<text x="62.0" y="879.1" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="879.1" font-size="15" fill="#3a3226" textLength="181.0" lengthAdjust="spacing">în ce ordine merge privirea:</text>
<text x="259.3" y="879.1" font-size="15" fill="#3a3226" font-weight="700" textLength="104.0" lengthAdjust="spacing">planul terestru</text>
<text x="363.2" y="879.1" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="370.6" y="879.1" font-size="15" fill="#3a3226" font-weight="700" textLength="91.5" lengthAdjust="spacing">planul ceresc</text>
<text x="462.1" y="879.1" font-size="15" fill="#3a3226" textLength="6.8" lengthAdjust="spacing">?</text>
<text x="62.0" y="903.8" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="903.8" font-size="15" fill="#3a3226" textLength="14.7" lengthAdjust="spacing">ce</text>
<text x="93.0" y="903.8" font-size="15" fill="#3a3226" font-weight="700" textLength="51.9" lengthAdjust="spacing">culoare</text>
<text x="148.9" y="903.8" font-size="15" fill="#3a3226" textLength="83.1" lengthAdjust="spacing">domină și ce</text>
<text x="236.0" y="903.8" font-size="15" fill="#3a3226" font-weight="700" textLength="34.6" lengthAdjust="spacing">stare</text>
<text x="274.7" y="903.8" font-size="15" fill="#3a3226" textLength="56.5" lengthAdjust="spacing">creează?</text>
<text x="208.8" y="957.8" font-size="11.5" fill="#5b6b83" textLength="482.4" lengthAdjust="spacing">Sursa: Manual Art 6, pp. 86-87, rubricile Repere; textul de bază este „Iarna” de Vasile Alecsandri.</text>
</svg>
