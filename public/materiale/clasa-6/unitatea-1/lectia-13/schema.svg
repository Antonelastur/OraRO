<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="420" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Cuvântul. Sinonimele și antonimele</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 12 · actualizare din clasa a V-a</text>

  <rect x="350" y="88" width="200" height="48" rx="14" fill="#6f5ea8"/>
  <text x="450" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">CUVÂNTUL</text>

  <text x="330" y="160" text-anchor="end" font-size="12" fill="#3a3226">sens (conținut)</text>
  <text x="570" y="160" text-anchor="start" font-size="12" fill="#3a3226">formă (sunete)</text>

  <path d="M 450 136 L 450 190 L 200 190 L 200 214" stroke="#b8944f" stroke-width="2.5" fill="none"/>
  <path d="M 450 136 L 450 190 L 700 190 L 700 214" stroke="#b8944f" stroke-width="2.5" fill="none"/>

  <g>
    <rect x="80" y="214" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="200" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#10233f">SINONIME</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="200" y="264">Formă diferită,</tspan>
      <tspan x="200" y="281">sens asemănător</tspan>
      <tspan x="200" y="298">sau identic.</tspan>
      <tspan x="200" y="328" font-style="italic">vesel — bucuros</tspan>
      <tspan x="200" y="344" font-style="italic">harnic — silitor</tspan>
    </text>
  </g>

  <g>
    <rect x="580" y="214" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="700" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#10233f">ANTONIME</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="700" y="264">Formă diferită,</tspan>
      <tspan x="700" y="281">sens opus.</tspan>
      <tspan x="700" y="328" font-style="italic">vesel — trist</tspan>
      <tspan x="700" y="344" font-style="italic">harnic — leneș</tspan>
    </text>
  </g>

  <text x="450" y="398" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 12, pp. 28-29</text>
</svg>
