<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="880" fill="#faf7f0"/>
<text x="254.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="392.3" lengthAdjust="spacing">Autorul, naratorul, personajul</text>
<text x="228.1" y="74.4" font-size="14" fill="#5b6b83" textLength="443.8" lengthAdjust="spacing">Clasa a VI-a · Unitatea I, Lecția 3 · Manual, pp. 14-15 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CELE DOUĂ LUMI</text>
<rect x="40" y="128.6" width="820" height="267.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="140.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="77.0" lengthAdjust="spacing">Lumea reală</text>
<text x="362.6" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="175.1" lengthAdjust="spacing">Lumea inventată (ficțiunea)</text>
<text x="683.2" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="77.0" lengthAdjust="spacing">Lumea reală</text>
<line x1="62.0" y1="178.2" x2="838.0" y2="178.2" stroke="#e3dccb"/>
<text x="144.7" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="67.4" lengthAdjust="spacing">AUTORUL</text>
<text x="354.1" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="192.0" lengthAdjust="spacing">NARATORUL, PERSONAJELE</text>
<text x="684.8" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="73.7" lengthAdjust="spacing">CITITORUL</text>
<line x1="62.0" y1="211.0" x2="838.0" y2="211.0" stroke="#e3dccb"/>

<text x="400.6" y="233.5" font-size="14.5" fill="#3a3226" textLength="98.9" lengthAdjust="spacing">în textul narativ</text>

<line x1="62.0" y1="243.8" x2="838.0" y2="243.8" stroke="#e3dccb"/>
<line x1="294.8" y1="146.6" x2="294.8" y2="243.8" stroke="#e3dccb"/>
<line x1="605.2" y1="146.6" x2="605.2" y2="243.8" stroke="#e3dccb"/>
<text x="62.0" y="272.9" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="272.9" font-size="15" fill="#3a3226" font-weight="700" textLength="54.0" lengthAdjust="spacing">Autorul</text>
<text x="132.2" y="272.9" font-size="15" fill="#3a3226" textLength="533.8" lengthAdjust="spacing">este o persoană reală, cu identitate concretă, care construiește o lume imaginară.</text>
<text x="62.0" y="297.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="297.6" font-size="15" fill="#3a3226" font-weight="700" textLength="68.4" lengthAdjust="spacing">Naratorul</text>
<text x="146.7" y="297.6" font-size="15" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="160.6" y="297.6" font-size="15" fill="#3a3226" font-weight="700" textLength="81.0" lengthAdjust="spacing">personajele</text>
<text x="245.7" y="297.6" font-size="15" fill="#3a3226" textLength="345.3" lengthAdjust="spacing">nu există în realitate: trăiesc doar în paginile cărții, în</text>
<text x="595.0" y="297.6" font-size="15" fill="#3a3226" font-weight="700" textLength="53.5" lengthAdjust="spacing">ficțiune</text>
<text x="648.5" y="297.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="316.1" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="316.1" width="6" height="61.7" rx="3" fill="#b4432c"/><text x="84.0" y="342.6" font-size="14.5" fill="#b4432c" font-weight="700" textLength="54.8" lengthAdjust="spacing">Atenție!</text>
<text x="84.0" y="361.5" font-size="14.5" fill="#3a3226" textLength="123.8" lengthAdjust="spacing">Autorul și naratorul</text>
<text x="211.7" y="361.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="104.7" lengthAdjust="spacing">nu se confundă</text>
<text x="316.4" y="361.5" font-size="14.5" fill="#3a3226" textLength="446.2" lengthAdjust="spacing">: autorul face parte din lumea reală, naratorul aparține lumii inventate.</text>
<rect x="40" y="415.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="438.8" font-size="16" font-weight="700" fill="#ffffff">2. NARATORUL</text>
<rect x="40" y="449.8" width="820" height="172.5" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="467.8" width="380.0" height="136.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="495.8" font-size="16" fill="#0d9c92" font-weight="700" textLength="134.4" lengthAdjust="spacing">la persoana a III-a</text>
<text x="78.0" y="519.1" font-size="14.5" fill="#3a3226" textLength="136.0" lengthAdjust="spacing">povestește ce fac alții</text>
<text x="78.0" y="543.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="106.7" lengthAdjust="spacing">El a deschis ușa...</text>
<rect x="458.0" y="467.8" width="380.0" height="136.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="495.8" font-size="16" fill="#6f5ea8" font-weight="700" textLength="96.0" lengthAdjust="spacing">la persoana I</text>
<text x="474.0" y="519.1" font-size="14.5" fill="#3a3226" textLength="26.1" lengthAdjust="spacing">este</text>
<text x="504.0" y="519.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="73.1" lengthAdjust="spacing">și personaj</text>
<text x="474.0" y="543.0" font-size="14.5" fill="#3a3226" textLength="81.5" lengthAdjust="spacing">relatează din</text>
<text x="559.4" y="543.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="96.4" lengthAdjust="spacing">perspectiva sa</text>
<text x="655.8" y="543.0" font-size="14.5" fill="#3a3226" textLength="99.9" lengthAdjust="spacing">: fapte, gânduri,</text>
<text x="474.0" y="564.0" font-size="14.5" fill="#3a3226" textLength="71.0" lengthAdjust="spacing">sentimente</text>
<text x="474.0" y="588.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="123.5" lengthAdjust="spacing">Eu am deschis ușa...</text>
<rect x="40" y="642.3" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="665.3" font-size="16" font-weight="700" fill="#ffffff">3. PERSONAJELE</text>
<rect x="40" y="676.3" width="820" height="152.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="709.3" font-size="15" fill="#3a3226" font-weight="700" textLength="80.8" lengthAdjust="spacing">Personajele</text>
<text x="146.9" y="709.3" font-size="15" fill="#3a3226" textLength="418.8" lengthAdjust="spacing">îndeplinesc acțiunile și au contribuții diferite la întâmplări. Pot fi</text>
<text x="569.7" y="709.3" font-size="15" fill="#3a3226" font-weight="700" textLength="89.7" lengthAdjust="spacing">ființe umane</text>
<text x="659.4" y="709.3" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="666.8" y="709.3" font-size="15" fill="#3a3226" font-weight="700" textLength="151.5" lengthAdjust="spacing">ființe necuvântătoare</text>
<text x="62.0" y="731.1" font-size="15" fill="#3a3226" textLength="22.5" lengthAdjust="spacing">sau</text>
<text x="88.5" y="731.1" font-size="15" fill="#3a3226" font-weight="700" textLength="51.9" lengthAdjust="spacing">obiecte</text>
<text x="140.4" y="731.1" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="749.6" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="776.1" font-size="14.5" fill="#10233f" font-weight="700" textLength="151.2" lengthAdjust="spacing">Profilul unui personaj:</text>
<text x="78.0" y="794.9" font-size="14.5" fill="#3a3226" textLength="660.0" lengthAdjust="spacing">ce face și ce spune? · ce simte? · ce gândesc alte personaje despre el? · care este părerea mea despre el?</text>
<text x="187.7" y="860.8" font-size="11.5" fill="#5b6b83" textLength="524.6" lengthAdjust="spacing">Sursa: Manual Art 6, pp. 14-15, rubrica Repere, schema celor două lumi și schema profilului de personaj.</text>
</svg>
