<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="420" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Descrierea în proză</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 6 · Indescriptibil de Simona Popescu</text>

  <rect x="350" y="88" width="200" height="48" rx="14" fill="#6f5ea8"/>
  <text x="450" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">OBIECTUL DESCRIS</text>

  <path d="M 450 136 L 450 158 L 150 158 L 150 182" stroke="#b8944f" stroke-width="2.5" fill="none"/>
  <path d="M 450 136 L 450 158 L 450 182" stroke="#b8944f" stroke-width="2.5" fill="none"/>
  <path d="M 450 136 L 450 158 L 750 158 L 750 182" stroke="#b8944f" stroke-width="2.5" fill="none"/>

  <g>
    <rect x="30" y="182" width="240" height="120" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="150" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Denumirea</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="150" y="232">Ce este obiectul</tspan>
      <tspan x="150" y="248">descris.</tspan>
      <tspan x="150" y="272" font-style="italic">Ex.: Dicționarul</tspan>
      <tspan x="150" y="288" font-style="italic">școlarului.</tspan>
    </text>
  </g>

  <g>
    <rect x="330" y="182" width="240" height="120" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Proprietăți</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="450" y="232">Cum arată, ce</tspan>
      <tspan x="450" y="248">trăsături are.</tspan>
      <tspan x="450" y="272" font-style="italic">Ex.: mică, galbenă,</tspan>
      <tspan x="450" y="288" font-style="italic">cu multe pagini.</tspan>
    </text>
  </g>

  <g>
    <rect x="630" y="182" width="240" height="120" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="750" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Elemente componente</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="750" y="232">Din ce e alcătuit</tspan>
      <tspan x="750" y="248">obiectul descris.</tspan>
      <tspan x="750" y="272" font-style="italic">Ex.: cuvinte-titlu și</tspan>
      <tspan x="750" y="288" font-style="italic">explicații, pe coloane.</tspan>
    </text>
  </g>

  <rect x="150" y="322" width="600" height="52" rx="14" fill="#fff3da" stroke="#b8944f" stroke-width="1.5"/>
  <text font-size="12" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="343">O descriere poate fi obiectivă (ce vede oricine) sau subiectivă</tspan>
    <tspan x="450" y="360">(cum e perceput obiectul în imaginația celui care descrie).</tspan>
  </text>

  <text x="450" y="400" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 6, p. 19</text>
</svg>
