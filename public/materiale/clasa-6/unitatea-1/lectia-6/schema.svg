<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 816" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="816" fill="#faf7f0"/>
<text x="324.3" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="252.0" lengthAdjust="spacing">Descrierea în proză</text>
<text x="242.6" y="74.4" font-size="14" fill="#5b6b83" textLength="414.8" lengthAdjust="spacing">Clasa a VI-a · Unitatea I, Lecția 6 · Manual, p. 19 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL DESCRIPTIV LITERAR</text>
<rect x="40" y="128.6" width="820" height="80.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="175.0" lengthAdjust="spacing">Textul descriptiv literar</text>
<text x="241.3" y="162.6" font-size="16" fill="#10233f" textLength="57.1" lengthAdjust="spacing">prezintă</text>
<text x="302.8" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="61.8" lengthAdjust="spacing">sugestiv</text>
<text x="368.9" y="162.6" font-size="16" fill="#10233f" textLength="402.9" lengthAdjust="spacing">un obiect, o ființă sau un loc, ca să-l ajute pe cititor să și-l</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="77.0" lengthAdjust="spacing">imagineze</text>
<text x="139.0" y="185.8" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<rect x="40" y="228.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="251.6" font-size="16" font-weight="700" fill="#ffffff">2. CE CUPRINDE O DESCRIERE</text>
<rect x="40" y="262.6" width="820" height="198.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="280.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="302.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="63.5" lengthAdjust="spacing">Elementul</text>
<text x="306.8" y="302.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.9" lengthAdjust="spacing">Ce notez</text>
<line x1="62.0" y1="312.2" x2="838.0" y2="312.2" stroke="#e3dccb"/>
<text x="74.0" y="334.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="73.4" lengthAdjust="spacing">denumirea</text>
<text x="306.8" y="334.7" font-size="14.5" fill="#3a3226" textLength="181.1" lengthAdjust="spacing">ce descriu (obiect, ființă, loc)</text>
<line x1="62.0" y1="345.0" x2="838.0" y2="345.0" stroke="#e3dccb"/>
<text x="74.0" y="367.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="165.2" lengthAdjust="spacing">elementele componente</text>
<text x="306.8" y="367.5" font-size="14.5" fill="#3a3226" textLength="133.7" lengthAdjust="spacing">din ce părți e alcătuit</text>
<line x1="62.0" y1="377.9" x2="838.0" y2="377.9" stroke="#e3dccb"/>
<text x="74.0" y="400.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="85.4" lengthAdjust="spacing">proprietățile</text>
<text x="306.8" y="400.4" font-size="14.5" fill="#3a3226" textLength="272.4" lengthAdjust="spacing">cum sunt: formă, culoare, mărime, material</text>
<line x1="62.0" y1="410.7" x2="838.0" y2="410.7" stroke="#e3dccb"/>
<text x="74.0" y="433.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="66.4" lengthAdjust="spacing">impresiile</text>
<text x="306.8" y="433.2" font-size="14.5" fill="#3a3226" textLength="310.4" lengthAdjust="spacing">sentimente, emoții, gânduri ale celui care descrie</text>
<line x1="62.0" y1="443.6" x2="838.0" y2="443.6" stroke="#e3dccb"/>
<line x1="294.8" y1="280.6" x2="294.8" y2="443.6" stroke="#e3dccb"/>
<rect x="40" y="481.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="504.6" font-size="16" font-weight="700" fill="#ffffff">3. DESCRIEREA CU TOATE SIMȚURILE</text>
<rect x="40" y="515.5" width="820" height="232.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="533.5" width="142.4" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="561.5" font-size="16" fill="#0d9c92" font-weight="700" textLength="25.0" lengthAdjust="spacing">văz</text>
<text x="78.0" y="584.8" font-size="14.5" fill="#3a3226" textLength="61.8" lengthAdjust="spacing">Arată ca...</text>
<rect x="220.4" y="533.5" width="142.4" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="236.4" y="561.5" font-size="16" fill="#6f5ea8" font-weight="700" textLength="26.1" lengthAdjust="spacing">auz</text>
<text x="236.4" y="584.8" font-size="14.5" fill="#3a3226" textLength="59.2" lengthAdjust="spacing">Sună ca...</text>
<rect x="378.8" y="533.5" width="142.4" height="67.7" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="394.8" y="561.5" font-size="16" fill="#9a7433" font-weight="700" textLength="42.4" lengthAdjust="spacing">miros</text>
<text x="394.8" y="584.8" font-size="14.5" fill="#3a3226" textLength="78.7" lengthAdjust="spacing">Miroase ca...</text>
<rect x="537.2" y="533.5" width="142.4" height="67.7" rx="12" fill="#ffffff" stroke="#b4432c" stroke-width="2"/>
<text x="553.2" y="561.5" font-size="16" fill="#b4432c" font-weight="700" textLength="33.0" lengthAdjust="spacing">gust</text>
<text x="553.2" y="584.8" font-size="14.5" fill="#3a3226" textLength="83.4" lengthAdjust="spacing">Are gust de...</text>
<rect x="695.6" y="533.5" width="142.4" height="67.7" rx="12" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
<text x="711.6" y="561.5" font-size="16" fill="#10233f" font-weight="700" textLength="43.7" lengthAdjust="spacing">pipăit</text>
<text x="711.6" y="584.8" font-size="14.5" fill="#3a3226" textLength="81.2" lengthAdjust="spacing">Se simte ca...</text>
<rect x="62.0" y="615.2" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="641.7" font-size="14.5" fill="#10233f" font-weight="700" textLength="62.6" lengthAdjust="spacing">Exemplu:</text>
<text x="78.0" y="660.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="708.8" lengthAdjust="spacing">Caietul meu de lectură are coperte verzi, tari, cu colțurile tocite. Miroase a lipici și a creioane colorate, iar paginile</text>
<text x="78.0" y="681.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="511.1" lengthAdjust="spacing">foșnesc ca frunzele uscate. Când îl deschid, simt că intru într-o casă numai a mea.</text>
<text x="62.0" y="725.9" font-size="14" fill="#5b6b83" textLength="594.9" lengthAdjust="spacing">Observ: proprietăți (verzi, tari), percepții (miroase, foșnesc), o comparație și o impresie personală.</text>
<text x="51.8" y="779.6" font-size="11.5" fill="#5b6b83" textLength="796.5" lengthAdjust="spacing">Sursa: Manual Art 6, p. 19, rubrica Repere și schemele din Explorare; textul de bază este „Indescriptibil” de Simona Popescu. Unele exemple sunt create pentru</text>
<text x="416.3" y="796.3" font-size="11.5" fill="#5b6b83" textLength="67.4" lengthAdjust="spacing">aceste notițe.</text>
</svg>
