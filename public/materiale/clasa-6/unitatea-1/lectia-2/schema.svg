<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 907" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="907" fill="#faf7f0"/>
<text x="170.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="560.3" lengthAdjust="spacing">Acțiunea, timpul și spațiul într-o narațiune</text>
<text x="242.6" y="74.4" font-size="14" fill="#5b6b83" textLength="414.8" lengthAdjust="spacing">Clasa a VI-a · Unitatea I, Lecția 2 · Manual, p. 13 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL NARATIV</text>
<rect x="40" y="128.6" width="820" height="56.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="104.6" lengthAdjust="spacing">Textul narativ</text>
<text x="170.9" y="162.6" font-size="16" fill="#10233f" textLength="281.1" lengthAdjust="spacing">prezintă desfășurarea unor întâmplări în</text>
<text x="456.4" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="196.3" lengthAdjust="spacing">ordine logică și temporală</text>
<text x="652.7" y="162.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<rect x="40" y="205.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="228.4" font-size="16" font-weight="700" fill="#ffffff">2. SECVENȚELE NARATIVE</text>
<rect x="40" y="239.4" width="820" height="158.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="272.4" font-size="15" fill="#3a3226" textLength="129.3" lengthAdjust="spacing">Textul se împarte în</text>
<text x="195.3" y="272.4" font-size="15" fill="#3a3226" font-weight="700" textLength="61.2" lengthAdjust="spacing">secvențe</text>
<text x="260.6" y="272.4" font-size="15" fill="#3a3226" textLength="77.7" lengthAdjust="spacing">distincte, ca</text>
<text x="342.3" y="272.4" font-size="15" fill="#3a3226" font-weight="700" textLength="51.5" lengthAdjust="spacing">scenele</text>
<text x="397.8" y="272.4" font-size="15" fill="#3a3226" textLength="339.4" lengthAdjust="spacing">unui film. O secvență nouă începe când se schimbă:</text>
<rect x="62.0" y="290.9" width="248.0" height="88.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="318.9" font-size="16" fill="#0d9c92" font-weight="700" textLength="50.6" lengthAdjust="spacing">spațiul</text>
<text x="78.0" y="342.2" font-size="14.5" fill="#3a3226" textLength="203.9" lengthAdjust="spacing">locul în care se petrece acțiunea</text>
<rect x="326.0" y="290.9" width="248.0" height="88.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="318.9" font-size="16" fill="#6f5ea8" font-weight="700" textLength="49.6" lengthAdjust="spacing">timpul</text>
<text x="342.0" y="342.2" font-size="14.5" fill="#3a3226" textLength="181.5" lengthAdjust="spacing">momentul în care se petrece</text>
<text x="342.0" y="363.2" font-size="14.5" fill="#3a3226" textLength="53.9" lengthAdjust="spacing">acțiunea</text>
<rect x="590.0" y="290.9" width="248.0" height="88.7" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="606.0" y="318.9" font-size="16" fill="#9a7433" font-weight="700" textLength="86.4" lengthAdjust="spacing">personajele</text>
<text x="606.0" y="342.2" font-size="14.5" fill="#3a3226" textLength="214.7" lengthAdjust="spacing">cine are rolul cel mai important în</text>
<text x="606.0" y="363.2" font-size="14.5" fill="#3a3226" textLength="63.1" lengthAdjust="spacing">prim-plan</text>
<rect x="40" y="417.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="440.6" font-size="16" font-weight="700" fill="#ffffff">3. INDICII DE TIMP ȘI DE SPAȚIU</text>
<rect x="40" y="451.6" width="820" height="204.4" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="484.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="484.6" font-size="15" fill="#3a3226" font-weight="700" textLength="102.0" lengthAdjust="spacing">Indicii de timp</text>
<text x="180.2" y="484.6" font-size="15" fill="#3a3226" textLength="121.8" lengthAdjust="spacing">trimit, de obicei, la</text>
<text x="306.1" y="484.6" font-size="15" fill="#3a3226" font-weight="700" textLength="160.9" lengthAdjust="spacing">acțiunea din prim-plan</text>
<text x="467.1" y="484.6" font-size="15" fill="#3a3226" textLength="232.6" lengthAdjust="spacing">, adică la firul principal al narațiunii.</text>
<text x="62.0" y="509.3" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="509.3" font-size="15" fill="#3a3226" textLength="219.7" lengthAdjust="spacing">Uneori se referă la alte momente,</text>
<text x="298.0" y="509.3" font-size="15" fill="#3a3226" font-weight="700" textLength="48.8" lengthAdjust="spacing">înainte</text>
<text x="350.8" y="509.3" font-size="15" fill="#3a3226" textLength="170.4" lengthAdjust="spacing">(amintiri, rememorări) sau</text>
<text x="525.2" y="509.3" font-size="15" fill="#3a3226" font-weight="700" textLength="35.8" lengthAdjust="spacing">după</text>
<text x="565.1" y="509.3" font-size="15" fill="#3a3226" textLength="153.4" lengthAdjust="spacing">acțiunea din prim-plan.</text>
<text x="62.0" y="534.1" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="534.1" font-size="15" fill="#3a3226" font-weight="700" textLength="112.0" lengthAdjust="spacing">Indicii de spațiu</text>
<text x="190.3" y="534.1" font-size="15" fill="#3a3226" textLength="333.4" lengthAdjust="spacing">arată locurile; îi leg de personajele care apar acolo.</text>
<rect x="62.0" y="552.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="574.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="88.0" lengthAdjust="spacing">Indici de timp</text>
<text x="462.0" y="574.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="97.1" lengthAdjust="spacing">Indici de spațiu</text>
<line x1="62.0" y1="584.1" x2="838.0" y2="584.1" stroke="#e3dccb"/>
<text x="74.0" y="606.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="332.6" lengthAdjust="spacing">într-o seară de toamnă, a doua zi, atunci, cu un an în</text>
<text x="74.0" y="627.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="33.6" lengthAdjust="spacing">urmă</text>
<text x="462.0" y="606.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="268.1" lengthAdjust="spacing">în bucătărie, pe tavan, după dulap, în curte</text>
<line x1="62.0" y1="638.0" x2="838.0" y2="638.0" stroke="#e3dccb"/>
<line x1="450.0" y1="552.6" x2="450.0" y2="638.0" stroke="#e3dccb"/>
<rect x="40" y="676.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="699.0" font-size="16" font-weight="700" fill="#ffffff">4. CUM LUCREZ CU UN TEXT NARATIV</text>
<rect x="40" y="710.0" width="820" height="129.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="743.0" font-size="15" fill="#3a3226" font-weight="700">1.</text>
<text x="81.0" y="743.0" font-size="15" fill="#3a3226" textLength="100.7" lengthAdjust="spacing">împart textul în</text>
<text x="185.7" y="743.0" font-size="15" fill="#3a3226" font-weight="700" textLength="61.2" lengthAdjust="spacing">secvențe</text>
<text x="246.8" y="743.0" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="767.8" font-size="15" fill="#3a3226" font-weight="700">2.</text>
<text x="81.0" y="767.8" font-size="15" fill="#3a3226" textLength="28.2" lengthAdjust="spacing">caut</text>
<text x="113.2" y="767.8" font-size="15" fill="#3a3226" font-weight="700" textLength="106.7" lengthAdjust="spacing">cuvintele-cheie</text>
<text x="223.9" y="767.8" font-size="15" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">din fiecare secvență;</text>
<text x="62.0" y="792.5" font-size="15" fill="#3a3226" font-weight="700">3.</text>
<text x="81.0" y="792.5" font-size="15" fill="#3a3226" textLength="58.4" lengthAdjust="spacing">formulez</text>
<text x="143.4" y="792.5" font-size="15" fill="#3a3226" font-weight="700" textLength="111.7" lengthAdjust="spacing">ideea principală</text>
<text x="259.1" y="792.5" font-size="15" fill="#3a3226" textLength="123.7" lengthAdjust="spacing">a fiecărei secvențe;</text>
<text x="62.0" y="817.2" font-size="15" fill="#3a3226" font-weight="700">4.</text>
<text x="81.0" y="817.2" font-size="15" fill="#3a3226" textLength="112.6" lengthAdjust="spacing">le ordonez: obțin</text>
<text x="197.6" y="817.2" font-size="15" fill="#3a3226" font-weight="700" textLength="147.2" lengthAdjust="spacing">planul simplu de idei</text>
<text x="344.8" y="817.2" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="42.5" y="871.2" font-size="11.5" fill="#5b6b83" textLength="815.0" lengthAdjust="spacing">Sursa: Manual Art 6, p. 13, rubrica Repere; textul de bază este „Un păianjen care se crede Spiderman” de Adina Popescu. Unele exemple sunt create pentru aceste</text>
<text x="433.8" y="887.9" font-size="11.5" fill="#5b6b83" textLength="32.4" lengthAdjust="spacing">notițe.</text>
</svg>
