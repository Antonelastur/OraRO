<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="420" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Acțiunea, timpul și spațiul într-o narațiune</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 2 · Un păianjen care se crede Spiderman</text>

  <rect x="350" y="90" width="200" height="52" rx="14" fill="#6f5ea8"/>
  <text x="450" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">NARAȚIUNEA</text>

  <path d="M 450 142 L 450 165 L 150 165 L 150 190" stroke="#b8944f" stroke-width="2.5" fill="none"/>
  <path d="M 450 142 L 450 165 L 450 190" stroke="#b8944f" stroke-width="2.5" fill="none"/>
  <path d="M 450 142 L 450 165 L 750 165 L 750 190" stroke="#b8944f" stroke-width="2.5" fill="none"/>

  <g>
    <rect x="30" y="190" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="150" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#10233f">ACȚIUNEA</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="150" y="240">Ce se întâmplă,</tspan>
      <tspan x="150" y="257">pas cu pas: evenimentele</tspan>
      <tspan x="150" y="274">relatate de narator.</tspan>
      <tspan x="150" y="304" font-style="italic">Ex.: păianjenul fuge prin</tspan>
      <tspan x="150" y="320" font-style="italic">paginile cărților, ca să</tspan>
      <tspan x="150" y="336" font-style="italic">scape de mama Mariei.</tspan>
    </text>
  </g>

  <g>
    <rect x="330" y="190" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#10233f">TIMPUL</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="450" y="240">Când se petrece</tspan>
      <tspan x="450" y="257">acțiunea: momentul,</tspan>
      <tspan x="450" y="274">durata, anotimpul.</tspan>
      <tspan x="450" y="304" font-style="italic">Cauți în text cuvinte</tspan>
      <tspan x="450" y="320" font-style="italic">și pasaje care indică</tspan>
      <tspan x="450" y="336" font-style="italic">momentul acțiunii.</tspan>
    </text>
  </g>

  <g>
    <rect x="630" y="190" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="750" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#10233f">SPAȚIUL</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="750" y="240">Unde se petrece</tspan>
      <tspan x="750" y="257">acțiunea: locul și</tspan>
      <tspan x="750" y="274">indiciile spațiale.</tspan>
      <tspan x="750" y="304" font-style="italic">Ex.: camera Mariei,</tspan>
      <tspan x="750" y="320" font-style="italic">raftul cu cărți unde</tspan>
      <tspan x="750" y="336" font-style="italic">s-a ascuns păianjenul.</tspan>
    </text>
  </g>

  <text x="450" y="400" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 2, p. 13</text>
</svg>
