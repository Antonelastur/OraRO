<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 762" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="762" fill="#faf7f0"/>
<text x="320.2" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="259.8" lengthAdjust="spacing">Sensurile cuvintelor</text>
<text x="224.3" y="74.4" font-size="14" fill="#5b6b83" textLength="451.4" lengthAdjust="spacing">Clasa a VI-a · Unitatea I, Lecția 14 · Manual, pp. 30-31 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. SENSUL PROPRIU</text>
<rect x="40" y="128.6" width="820" height="182.1" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="102.9" lengthAdjust="spacing">Sensul propriu</text>
<text x="169.0" y="161.6" font-size="15" fill="#3a3226" textLength="635.1" lengthAdjust="spacing">este sensul comun, obișnuit, cunoscut și folosit de toți vorbitorii, legat de un aspect din realitate.</text>
<rect x="62.0" y="180.1" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="208.1" font-size="16" fill="#0d9c92" font-weight="700" textLength="156.0" lengthAdjust="spacing">sens propriu de bază</text>
<text x="78.0" y="231.4" font-size="14.5" fill="#3a3226" textLength="326.5" lengthAdjust="spacing">sensul pe care cuvântul îl păstrează în orice context</text>
<text x="78.0" y="255.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="75.0" lengthAdjust="spacing">Și-a scrântit</text>
<text x="156.9" y="255.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.6" lengthAdjust="spacing">piciorul</text>
<text x="208.5" y="255.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<rect x="458.0" y="180.1" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="208.1" font-size="16" fill="#6f5ea8" font-weight="700" textLength="165.9" lengthAdjust="spacing">sens propriu secundar</text>
<text x="474.0" y="231.4" font-size="14.5" fill="#3a3226" textLength="267.1" lengthAdjust="spacing">sens căpătat într-un context, pe baza unei</text>
<text x="745.0" y="231.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="69.7" lengthAdjust="spacing">asemănări</text>
<text x="474.0" y="252.4" font-size="14.5" fill="#3a3226" textLength="245.2" lengthAdjust="spacing">cu obiectul denumit de sensul de bază</text>
<text x="474.0" y="276.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.5" lengthAdjust="spacing">Piciorul</text>
<text x="529.4" y="276.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="122.4" lengthAdjust="spacing">paharului s-a spart.</text>
<rect x="40" y="330.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="353.7" font-size="16" font-weight="700" fill="#ffffff">2. SENSUL FIGURAT</text>
<rect x="40" y="364.7" width="820" height="90.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="398.7" font-size="16" fill="#10233f" font-weight="700" textLength="104.6" lengthAdjust="spacing">Sensul figurat</text>
<text x="171.0" y="398.7" font-size="16" fill="#10233f" textLength="77.0" lengthAdjust="spacing">este sensul</text>
<text x="252.2" y="398.7" font-size="16" fill="#10233f" font-weight="700" textLength="79.8" lengthAdjust="spacing">neobișnuit</text>
<text x="332.1" y="398.7" font-size="16" fill="#10233f" textLength="127.8" lengthAdjust="spacing">, folosit cu valoare</text>
<text x="464.2" y="398.7" font-size="16" fill="#10233f" font-weight="700" textLength="71.2" lengthAdjust="spacing">expresivă</text>
<text x="535.4" y="398.7" font-size="16" fill="#10233f" textLength="97.6" lengthAdjust="spacing">, pe baza unei</text>
<text x="637.3" y="398.7" font-size="16" fill="#10233f" font-weight="700" textLength="166.1" lengthAdjust="spacing">asemănări subînțelese</text>
<text x="803.4" y="398.7" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<text x="62.0" y="432.5" font-size="15" fill="#10233f" font-style="italic" textLength="78.8" lengthAdjust="spacing">Părinții sunt</text>
<text x="144.8" y="432.5" font-size="15" fill="#3a3226" font-weight="700" textLength="68.5" lengthAdjust="spacing">picioarele</text>
<text x="217.4" y="432.5" font-size="15" fill="#10233f" font-style="italic" textLength="137.5" lengthAdjust="spacing">de sprijin ale copiilor.</text>
<rect x="40" y="475.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="498.0" font-size="16" font-weight="700" fill="#ffffff">3. CUM MĂ AJUTĂ DICȚIONARUL</text>
<rect x="40" y="509.0" width="820" height="201.7" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="542.0" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="542.0" font-size="15" fill="#3a3226" textLength="173.2" lengthAdjust="spacing">Sensurile unui cuvânt sunt</text>
<text x="251.5" y="542.0" font-size="15" fill="#3a3226" font-weight="700" textLength="83.2" lengthAdjust="spacing">numerotate</text>
<text x="338.8" y="542.0" font-size="15" fill="#3a3226" textLength="248.7" lengthAdjust="spacing">în articolul de dicționar (DEX): 1, 2, 3...</text>
<text x="62.0" y="566.8" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="566.8" font-size="15" fill="#3a3226" textLength="171.3" lengthAdjust="spacing">Sensul figurat e marcat cu</text>
<text x="249.5" y="566.8" font-size="15" fill="#3a3226" font-weight="700" textLength="25.4" lengthAdjust="spacing">Fig.</text>
<text x="62.0" y="591.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="591.5" font-size="15" fill="#3a3226" textLength="326.8" lengthAdjust="spacing">Citesc enunțul, apoi aleg sensul care se potrivește</text>
<text x="405.1" y="591.5" font-size="15" fill="#3a3226" font-weight="700" textLength="71.1" lengthAdjust="spacing">în context</text>
<text x="476.2" y="591.5" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="610.0" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="636.5" font-size="14.5" fill="#10233f" font-weight="700" textLength="76.0" lengthAdjust="spacing">Cum decid:</text>
<text x="78.0" y="655.4" font-size="14.5" fill="#3a3226" textLength="719.2" lengthAdjust="spacing">denumește ceva concret, obișnuit? → sens propriu de bază · seamănă ca formă, funcție sau poziție cu obiectul de</text>
<text x="78.0" y="676.4" font-size="14.5" fill="#3a3226" textLength="533.3" lengthAdjust="spacing">bază? → sens propriu secundar · e o imagine expresivă, neobișnuită? → sens figurat.</text>
<text x="241.9" y="742.2" font-size="11.5" fill="#5b6b83" textLength="416.2" lengthAdjust="spacing">Sursa: Manual Art 6, pp. 30-31, rubrica Repere și articolul de dicționar din Aplicații.</text>
</svg>
