<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 747" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="747" fill="#faf7f0"/>
<text x="300.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="300.2" lengthAdjust="spacing">Inteligența emoțională</text>
<text x="218.9" y="74.4" font-size="14" fill="#5b6b83" textLength="462.3" lengthAdjust="spacing">Clasa a VI-a · Unitatea a IV-a, Lecția 10 · Manual, p. 135 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE</text>
<rect x="40" y="128.6" width="820" height="56.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="171.5" lengthAdjust="spacing">Inteligența emoțională</text>
<text x="237.8" y="162.6" font-size="16" fill="#10233f" textLength="163.2" lengthAdjust="spacing">este capacitatea de a-ți</text>
<text x="405.4" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="60.8" lengthAdjust="spacing">înțelege</text>
<text x="470.5" y="162.6" font-size="16" fill="#10233f" textLength="122.7" lengthAdjust="spacing">emoțiile și de a le</text>
<text x="597.5" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="154.9" lengthAdjust="spacing">folosi în mod pozitiv</text>
<text x="752.4" y="162.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<rect x="40" y="205.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="228.4" font-size="16" font-weight="700" fill="#ffffff">2. CELE TREI COMPONENTE</text>
<rect x="40" y="239.4" width="820" height="250.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="257.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="278.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="81.9" lengthAdjust="spacing">Componenta</text>
<text x="306.8" y="278.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="79.9" lengthAdjust="spacing">Ce înseamnă</text>
<line x1="62.0" y1="288.9" x2="838.0" y2="288.9" stroke="#e3dccb"/>
<text x="74.0" y="311.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="155.4" lengthAdjust="spacing">conștientizarea de sine</text>
<text x="306.8" y="311.4" font-size="14.5" fill="#3a3226" textLength="518.7" lengthAdjust="spacing">mă observ, îmi recunosc sentimentele, îmi cunosc punctele tari și slabe, îmi reglez</text>
<text x="306.8" y="332.5" font-size="14.5" fill="#3a3226" textLength="38.0" lengthAdjust="spacing">stările</text>
<line x1="62.0" y1="342.8" x2="838.0" y2="342.8" stroke="#e3dccb"/>
<text x="74.0" y="365.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="55.5" lengthAdjust="spacing">empatia</text>
<text x="306.8" y="365.3" font-size="14.5" fill="#3a3226" textLength="511.4" lengthAdjust="spacing">înțeleg sentimentele și grijile celorlalți, privesc situația din perspectiva lor, știu că</text>
<text x="306.8" y="386.3" font-size="14.5" fill="#3a3226" textLength="423.7" lengthAdjust="spacing">oamenii simt și reacționează diferit și nu-i învinovățesc pentru asta</text>
<line x1="62.0" y1="396.7" x2="838.0" y2="396.7" stroke="#e3dccb"/>
<text x="74.0" y="419.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="166.5" lengthAdjust="spacing">autocontrolul emoțional</text>
<text x="306.8" y="419.2" font-size="14.5" fill="#3a3226" textLength="515.8" lengthAdjust="spacing">înțeleg legătura dintre gânduri, reacții și emoții, dintre fapte și consecințe; găsesc</text>
<text x="306.8" y="440.2" font-size="14.5" fill="#3a3226" textLength="499.1" lengthAdjust="spacing">metode să stăpânesc teama, mânia, tristețea, neliniștea, stresul; rămân motivat</text>
<text x="306.8" y="461.2" font-size="14.5" fill="#3a3226" textLength="42.5" lengthAdjust="spacing">pozitiv</text>
<line x1="62.0" y1="471.6" x2="838.0" y2="471.6" stroke="#e3dccb"/>
<line x1="294.8" y1="257.4" x2="294.8" y2="471.6" stroke="#e3dccb"/>
<rect x="40" y="509.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="532.6" font-size="16" font-weight="700" fill="#ffffff">3. PRIM AJUTOR EMOȚIONAL</text>
<rect x="40" y="543.6" width="820" height="152.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="561.6" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="588.1" font-size="14.5" fill="#10233f" font-weight="700" textLength="143.4" lengthAdjust="spacing">Exemplu din manual:</text>
<text x="78.0" y="607.0" font-size="14.5" fill="#3a3226" textLength="246.1" lengthAdjust="spacing">Cineva cu stima de sine scăzută spune:</text>
<text x="328.0" y="607.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="201.5" lengthAdjust="spacing">„Nimic nu îmi iese cum trebuie.”</text>
<text x="533.4" y="607.0" font-size="14.5" fill="#3a3226" textLength="106.9" lengthAdjust="spacing">Ce îl poate ajuta:</text>
<text x="644.2" y="607.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="170.3" lengthAdjust="spacing">„Amintește-ți ce calități ai.”</text>
<text x="78.0" y="628.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="664.3" lengthAdjust="spacing">„Amintește-ți ce lucruri grozave ai făcut până acum.” „Nimănui nu îi ies toate lucrurile așa cum și-ar dori.”</text>
<text x="62.0" y="673.3" font-size="15" fill="#3a3226" textLength="156.6" lengthAdjust="spacing">Într-un conflict: numesc</text>
<text x="222.6" y="673.3" font-size="15" fill="#3a3226" font-weight="700" textLength="50.0" lengthAdjust="spacing">ce simt</text>
<text x="272.6" y="673.3" font-size="15" fill="#3a3226" textLength="189.4" lengthAdjust="spacing">, ascult ce simte celălalt, caut</text>
<text x="466.1" y="673.3" font-size="15" fill="#3a3226" font-weight="700" textLength="119.0" lengthAdjust="spacing">mai multe soluții</text>
<text x="589.1" y="673.3" font-size="15" fill="#3a3226" textLength="221.8" lengthAdjust="spacing">și aleg una bună pentru amândoi.</text>
<text x="306.3" y="727.3" font-size="11.5" fill="#5b6b83" textLength="287.5" lengthAdjust="spacing">Sursa: Manual Art 6, p. 135, rubricile Repere și Portofoliu.</text>
</svg>
