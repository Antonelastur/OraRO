<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Textul explicativ</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV, Lecția 13</text>

  <g>
    <rect x="60" y="100" width="360" height="180" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="240" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Explicativ cauzal</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="240" y="154">Răspunde la întrebarea</tspan>
      <tspan x="240" y="170">de ce?, explică motivul</tspan>
      <tspan x="240" y="186">unui fenomen sau fapt.</tspan>
      <tspan x="240" y="216" font-style="italic">„De ce au elefanții</tspan>
      <tspan x="240" y="232" font-style="italic">trompă?” — trompa îi</tspan>
      <tspan x="240" y="248" font-style="italic">ajută să mănânce, să bea...</tspan>
    </text>
  </g>

  <g>
    <rect x="480" y="100" width="360" height="180" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="660" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Explicativ procedural</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="660" y="154">Răspunde la întrebarea</tspan>
      <tspan x="660" y="170">cum?, explică pașii unei</tspan>
      <tspan x="660" y="186">activități, o procedură.</tspan>
      <tspan x="660" y="216" font-style="italic">Regulile jocului Uliii și</tspan>
      <tspan x="660" y="232" font-style="italic">porumbeii — cum se joacă,</tspan>
      <tspan x="660" y="248" font-style="italic">pas cu pas</tspan>
    </text>
  </g>

  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 13, p. 148, partea 1/2</text>
</svg>
