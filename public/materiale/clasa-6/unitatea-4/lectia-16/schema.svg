<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="360" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Numeralul (actualizare)</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV, Lecția 11</text>

  <g>
    <rect x="80" y="100" width="340" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="250" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Numeralul cardinal</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="250" y="154">Exprimă un număr exact.</tspan>
      <tspan x="250" y="180" font-style="italic">douăsprezece cărți,</tspan>
      <tspan x="250" y="198" font-style="italic">douăzeci și șapte de colegi</tspan>
      <tspan x="250" y="222">Unele forme au gen</tspan>
      <tspan x="250" y="238">(un, doi / o, două).</tspan>
    </text>
  </g>

  <g>
    <rect x="480" y="100" width="340" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="650" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Numeralul ordinal</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="650" y="154">Arată ordinea prin</tspan>
      <tspan x="650" y="170">numărare, adesea cu</tspan>
      <tspan x="650" y="186">articol demonstrativ.</tspan>
      <tspan x="650" y="212" font-style="italic">primul, al doilea, al treilea</tspan>
      <tspan x="650" y="232" font-style="italic">cea de-a doua acțiune</tspan>
    </text>
  </g>

  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 11, p. 144</text>
</svg>
