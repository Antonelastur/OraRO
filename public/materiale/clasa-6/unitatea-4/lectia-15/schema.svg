<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="360" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Pronumele reflexiv</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV, Lecția 10</text>

  <rect x="150" y="90" width="600" height="80" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">Ce arată</text>
  <text font-size="12" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="142">Identitatea de persoană dintre cel care face acțiunea și cel</tspan>
    <tspan x="450" y="160">asupra căruia se exercită ea. Are forme doar la persoana a III-a.</tspan>
  </text>

  <g>
    <rect x="80" y="195" width="360" height="110" rx="14" fill="#eaf6f4"/>
    <text x="260" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">se — cazul acuzativ</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="260" y="244" font-style="italic">se machiază, se privesc</tspan>
      <tspan x="260" y="264">acțiunea se răsfrânge</tspan>
      <tspan x="260" y="280">direct asupra subiectului</tspan>
    </text>
  </g>

  <g>
    <rect x="460" y="195" width="360" height="110" rx="14" fill="#f1ecfa"/>
    <text x="640" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">își — cazul dativ</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="640" y="244" font-style="italic">își dă cu parfum, își zâmbesc</tspan>
      <tspan x="640" y="264">acțiunea se răsfrânge</tspan>
      <tspan x="640" y="280">indirect asupra subiectului</tspan>
    </text>
  </g>

  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 10, p. 142</text>
</svg>
