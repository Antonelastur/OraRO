<text x="680.2" y="884.1" font-size="14.5" fill="#3a3226" textLength="37.7" lengthAdjust="spacing">(tu ții)</text>
<text x="136.3" y="950.0" font-size="11.5" fill="#5b6b83" textLength="627.3" lengthAdjust="spacing">Sursa: Manual Art 6, pp. 136-137, rubrica Repere și tabelul formelor; pronumele de politețe din exemplele de la pp. 136-140.</text>
