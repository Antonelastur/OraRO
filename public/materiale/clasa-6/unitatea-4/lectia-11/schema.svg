<text x="200.6" y="74.4" font-size="14" fill="#5b6b83" textLength="498.8" lengthAdjust="spacing">Clasa a VI-a · Unitatea a IV-a, Lecția 11 · Manual, pp. 136-137 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. PRONUMELE PERSONAL</text>
<rect x="40" y="128.6" width="820" height="113.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="151.0" lengthAdjust="spacing">Pronumele personal</text>
<text x="217.4" y="162.6" font-size="16" fill="#10233f" textLength="208.3" lengthAdjust="spacing">ține locul unui substantiv. Are</text>
<text x="430.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="99.0" lengthAdjust="spacing">trei persoane</text>
<text x="529.0" y="162.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">,</text>
<text x="536.9" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="100.5" lengthAdjust="spacing">două numere</text>
<text x="637.3" y="162.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">;</text>
<text x="645.2" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="42.6" lengthAdjust="spacing">genul</text>
<text x="692.1" y="162.6" font-size="16" fill="#10233f" textLength="104.3" lengthAdjust="spacing">apare numai la</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="112.8" lengthAdjust="spacing">persoana a III-a.</text>
<text x="62.0" y="219.6" font-size="15" fill="#3a3226" textLength="155.1" lengthAdjust="spacing">Toate cazurile au forme</text>
<text x="221.1" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="76.8" lengthAdjust="spacing">accentuate</text>
<text x="297.9" y="219.6" font-size="15" fill="#3a3226" textLength="225.3" lengthAdjust="spacing">; la acuzativ și dativ există și forme</text>
<text x="527.3" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="94.0" lengthAdjust="spacing">neaccentuate</text>
<text x="625.4" y="219.6" font-size="15" fill="#3a3226" textLength="4.5" lengthAdjust="spacing">(</text>
<text x="629.9" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="41.0" lengthAdjust="spacing">clitice</text>
<text x="670.8" y="219.6" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">).</text>
<rect x="40" y="262.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
