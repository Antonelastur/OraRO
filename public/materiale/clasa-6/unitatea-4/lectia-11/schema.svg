<text x="58" y="623.0" font-size="16" font-weight="700" fill="#ffffff">3. PRONUMELE DE POLITEȚE</text>
<rect x="40" y="634.0" width="820" height="284.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="667.0" font-size="15" fill="#3a3226" textLength="35.4" lengthAdjust="spacing">Arată</text>
<text x="101.5" y="667.0" font-size="15" fill="#3a3226" font-weight="700" textLength="64.5" lengthAdjust="spacing">respectul</text>
<text x="170.0" y="667.0" font-size="15" fill="#3a3226" textLength="322.9" lengthAdjust="spacing">față de persoana cu care sau despre care vorbim.</text>
<rect x="62.0" y="685.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="707.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.9" lengthAdjust="spacing">Persoana</text>
<text x="268.0" y="707.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="40.4" lengthAdjust="spacing">Forme</text>
<line x1="62.0" y1="717.0" x2="838.0" y2="717.0" stroke="#e3dccb"/>
<text x="74.0" y="739.5" font-size="14.5" fill="#3a3226" textLength="32.3" lengthAdjust="spacing">a II-a</text>
<text x="268.0" y="739.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="470.5" lengthAdjust="spacing">dumneata (matale), dumitale; dumneavoastră; domnia-ta, domnia-voastră,</text>
<text x="268.0" y="760.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="105.7" lengthAdjust="spacing">domniile-voastre</text>
<line x1="62.0" y1="770.9" x2="838.0" y2="770.9" stroke="#e3dccb"/>
<text x="74.0" y="793.4" font-size="14.5" fill="#3a3226" textLength="36.2" lengthAdjust="spacing">a III-a</text>
<text x="268.0" y="793.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="481.5" lengthAdjust="spacing">dumnealui, dumneaei, dumnealor; dânsul, dânsa, dânșii, dânsele; domnia-sa,</text>
<text x="268.0" y="814.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="77.3" lengthAdjust="spacing">domniile-lor</text>
