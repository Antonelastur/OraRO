<text x="388.9" y="884.1" font-size="14.5" fill="#3a3226" textLength="84.5" lengthAdjust="spacing">(ne-a spus) ≠</text>
<text x="477.4" y="884.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="23.1" lengthAdjust="spacing">nea</text>
<text x="504.3" y="884.1" font-size="14.5" fill="#3a3226" textLength="61.6" lengthAdjust="spacing">(zăpadă) ·</text>
