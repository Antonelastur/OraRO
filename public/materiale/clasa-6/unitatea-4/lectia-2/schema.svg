<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Acțiunea, timpul și spațiul</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV, Lecția 2 · Ulucul și găinile de Grigore Alexandrescu</text>

  <g>
    <rect x="60" y="100" width="360" height="180" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="240" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Acțiunea</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="240" y="154">Ion prinde uleul, găinile</tspan>
      <tspan x="240" y="170">se obișnuiesc cu el, îl</tspan>
      <tspan x="240" y="186">eliberează, el le răpește.</tspan>
      <tspan x="240" y="212">O succesiune de fapte,</tspan>
      <tspan x="240" y="228">nu doar o descriere.</tspan>
    </text>
  </g>

  <g>
    <rect x="480" y="100" width="360" height="180" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="660" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Timpul și spațiul</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="660" y="154">Fabula nu insistă pe</tspan>
      <tspan x="660" y="170">indici expliciți, e mai</tspan>
      <tspan x="660" y="186">degrabă atemporală.</tspan>
      <tspan x="660" y="212">Spațiul: ograda, lângă</tspan>
      <tspan x="660" y="228">coteț, cerul (zborul uleului).</tspan>
    </text>
  </g>

  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 1-2, pp. 122-125</text>
</svg>
