<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Etapele acțiunii</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 3 · momentele subiectului literar, recapitulare din clasa a V-a</text>

  <path d="M 90 200 L 810 200" stroke="#b8944f" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8944f"/>
    </marker>
  </defs>

  <g>
    <rect x="60" y="130" width="220" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="170" y="158" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10233f">Situația inițială</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="170" y="184">Cadrul de la</tspan>
      <tspan x="170" y="200">începutul poveștii,</tspan>
      <tspan x="170" y="216">înainte să se</tspan>
      <tspan x="170" y="232">întâmple ceva nou.</tspan>
    </text>
  </g>

  <g>
    <rect x="340" y="130" width="220" height="140" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="450" y="158" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10233f">Succesiunea</text>
    <text x="450" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10233f">de întâmplări</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="450" y="202">Evenimentele, în</tspan>
      <tspan x="450" y="218">ordinea în care</tspan>
      <tspan x="450" y="234">se petrec.</tspan>
    </text>
  </g>

  <g>
    <rect x="620" y="130" width="220" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="730" y="158" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10233f">Situația finală</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="730" y="184">Cum rămân lucrurile</tspan>
      <tspan x="730" y="200">după ce s-au</tspan>
      <tspan x="730" y="216">petrecut întâmplările.</tspan>
    </text>
  </g>

  <text x="450" y="340" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 3, p. 49</text>
</svg>
