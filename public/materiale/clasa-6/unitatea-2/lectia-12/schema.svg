<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="420" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Felul verbelor</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 9 · Verbul (actualizare)</text>

  <rect x="350" y="88" width="200" height="48" rx="14" fill="#6f5ea8"/>
  <text x="450" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">VERBUL</text>

  <path d="M 450 136 L 450 160 L 230 160 L 230 184" stroke="#b8944f" stroke-width="2.5" fill="none"/>
  <path d="M 450 136 L 450 160 L 670 160 L 670 184" stroke="#b8944f" stroke-width="2.5" fill="none"/>

  <g>
    <rect x="80" y="184" width="300" height="160" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="230" y="212" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10233f">predicativ</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="230" y="238">Arată singur o acțiune</tspan>
      <tspan x="230" y="255">sau o stare și poate fi,</tspan>
      <tspan x="230" y="272">singur, predicat.</tspan>
      <tspan x="230" y="302" font-style="italic">Petruța citește oracolul.</tspan>
      <tspan x="230" y="318" font-style="italic">culege, pisează, pune</tspan>
    </text>
  </g>

  <g>
    <rect x="520" y="184" width="300" height="160" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="670" y="212" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10233f">auxiliar</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="670" y="238">Ajută la formarea unor</tspan>
      <tspan x="670" y="255">moduri și timpuri compuse:</tspan>
      <tspan x="670" y="272">a fi, a avea, a vrea.</tspan>
      <tspan x="670" y="302" font-style="italic">va culege = a vrea (auxiliar)</tspan>
      <tspan x="670" y="318" font-style="italic">+ culege (predicativ)</tspan>
    </text>
  </g>

  <rect x="150" y="360" width="600" height="40" rx="12" fill="#fff3da" stroke="#b8944f" stroke-width="1.5"/>
  <text x="450" y="385" text-anchor="middle" font-size="11.5" fill="#3a3226">Același verb (a fi, a avea, a vrea) poate fi, în context, și auxiliar, și predicativ.</text>

  <text x="450" y="330" text-anchor="middle" font-size="0" fill="none"/>
  <text x="450" y="412" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 9, p. 64</text>
</svg>
