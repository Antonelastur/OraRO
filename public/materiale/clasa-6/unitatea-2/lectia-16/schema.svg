<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Predicatul nominal</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 12 · verbul copulativ a fi</text>

  <rect x="230" y="95" width="440" height="60" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text font-size="18" font-weight="700" text-anchor="middle" fill="#10233f">
    <tspan x="450" y="132">verb copulativ + nume predicativ</tspan>
  </text>

  <path d="M 340 155 L 340 178" stroke="#b8944f" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
  <path d="M 560 155 L 560 178" stroke="#b8944f" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b8944f"/>
    </marker>
  </defs>

  <g>
    <rect x="90" y="180" width="330" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="255" y="207" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">a fi, copulativ</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="255" y="230">Nu are sens complet singur,</tspan>
      <tspan x="255" y="246">se combină obligatoriu cu</tspan>
      <tspan x="255" y="262">un substantiv sau adjectiv.</tspan>
      <tspan x="255" y="292" font-style="italic">Maria </tspan><tspan font-weight="700" fill="#0d9c92">este</tspan><tspan font-style="italic"> prietena Corinei.</tspan>
      <tspan x="255" y="310" font-style="italic">El </tspan><tspan font-weight="700" fill="#0d9c92">este</tspan><tspan font-style="italic"> talentat.</tspan>
    </text>
  </g>

  <g>
    <rect x="480" y="180" width="330" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="645" y="207" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">numele predicativ</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="645" y="230">Cuvântul care completează</tspan>
      <tspan x="645" y="246">sensul lui a fi, arată o</tspan>
      <tspan x="645" y="262">însușire sau o identitate.</tspan>
      <tspan x="645" y="292" font-style="italic">Maria este </tspan><tspan font-weight="700" fill="#6f5ea8">prietena Corinei</tspan><tspan font-style="italic">.</tspan>
      <tspan x="645" y="310" font-style="italic">El este </tspan><tspan font-weight="700" fill="#6f5ea8">talentat</tspan><tspan font-style="italic">.</tspan>
    </text>
  </g>

  <text x="450" y="360" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 12, p. 72</text>
</svg>
