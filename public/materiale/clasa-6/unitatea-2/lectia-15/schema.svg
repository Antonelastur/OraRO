<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 855" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="855" fill="#faf7f0"/>
<text x="276.0" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="348.3" lengthAdjust="spacing">Modul condițional-optativ</text>
<text x="210.6" y="74.4" font-size="14" fill="#5b6b83" textLength="478.8" lengthAdjust="spacing">Clasa a VI-a · Unitatea a II-a, Lecția 15 · Manual, pp. 70-71 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ARATĂ</text>
<rect x="40" y="128.6" width="820" height="56.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="161.8" lengthAdjust="spacing">Condițional-optativul</text>
<text x="228.1" y="162.6" font-size="16" fill="#10233f" textLength="86.7" lengthAdjust="spacing">arată acțiuni</text>
<text x="319.1" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="58.7" lengthAdjust="spacing">posibile</text>
<text x="377.8" y="162.6" font-size="16" fill="#10233f" textLength="217.9" lengthAdjust="spacing">, a căror realizare depinde de o</text>
<text x="600.1" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="61.0" lengthAdjust="spacing">condiție</text>
<text x="661.0" y="162.6" font-size="16" fill="#10233f" textLength="83.0" lengthAdjust="spacing">, sau acțiuni</text>
<text x="748.4" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="45.4" lengthAdjust="spacing">dorite</text>
<text x="793.8" y="162.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<rect x="40" y="205.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="228.4" font-size="16" font-weight="700" fill="#ffffff">2. TIMPURILE</text>
<rect x="40" y="239.4" width="820" height="208.8" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="257.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="278.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="44.5" lengthAdjust="spacing">Timpul</text>
<text x="182.6" y="278.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="52.0" lengthAdjust="spacing">Ce arată</text>
<text x="415.4" y="278.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="109.3" lengthAdjust="spacing">Cum se formează</text>
<text x="663.8" y="278.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="288.9" x2="838.0" y2="288.9" stroke="#e3dccb"/>
<text x="74.0" y="311.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.9" lengthAdjust="spacing">prezent</text>
<text x="182.6" y="311.4" font-size="14.5" fill="#3a3226" textLength="206.3" lengthAdjust="spacing">acțiune în momentul vorbirii sau</text>
<text x="182.6" y="332.5" font-size="14.5" fill="#3a3226" textLength="32.8" lengthAdjust="spacing">după</text>
<text x="415.4" y="311.4" font-size="14.5" fill="#3a3226" textLength="57.0" lengthAdjust="spacing">auxiliarul</text>
<text x="476.3" y="311.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="41.3" lengthAdjust="spacing">a avea</text>
<text x="521.6" y="311.4" font-size="14.5" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">+</text>
<text x="535.4" y="311.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="52.9" lengthAdjust="spacing">infinitiv</text>
<text x="663.8" y="311.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="52.3" lengthAdjust="spacing">aș cânta</text>
<line x1="62.0" y1="342.8" x2="838.0" y2="342.8" stroke="#e3dccb"/>
<text x="74.0" y="365.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="48.6" lengthAdjust="spacing">perfect</text>
<text x="182.6" y="365.3" font-size="14.5" fill="#3a3226" textLength="183.7" lengthAdjust="spacing">acțiune înainte de momentul</text>
<text x="182.6" y="386.3" font-size="14.5" fill="#3a3226" textLength="44.7" lengthAdjust="spacing">vorbirii</text>
<text x="415.4" y="365.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="41.3" lengthAdjust="spacing">a avea</text>
<text x="460.7" y="365.3" font-size="14.5" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">+</text>
<text x="474.5" y="365.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="8.1" lengthAdjust="spacing">fi</text>
<text x="486.5" y="365.3" font-size="14.5" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">+</text>
<text x="500.3" y="365.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="65.3" lengthAdjust="spacing">participiu</text>
<text x="663.8" y="365.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="69.0" lengthAdjust="spacing">aș fi cântat</text>
<line x1="62.0" y1="396.7" x2="838.0" y2="396.7" stroke="#e3dccb"/>
<line x1="170.6" y1="257.4" x2="170.6" y2="396.7" stroke="#e3dccb"/>
<line x1="403.4" y1="257.4" x2="403.4" y2="396.7" stroke="#e3dccb"/>
<line x1="651.8" y1="257.4" x2="651.8" y2="396.7" stroke="#e3dccb"/>
<text x="62.0" y="425.7" font-size="15" fill="#3a3226" textLength="132.0" lengthAdjust="spacing">Formele auxiliarului:</text>
<text x="198.1" y="425.7" font-size="15" fill="#3a3226" font-weight="700" textLength="136.5" lengthAdjust="spacing">aș, ai, ar, am, ați, ar</text>
<text x="334.5" y="425.7" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="468.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="491.2" font-size="16" font-weight="700" fill="#ffffff">3. DE REȚINUT</text>
<rect x="40" y="502.2" width="820" height="302.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="535.2" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="535.2" font-size="15" fill="#3a3226" textLength="66.9" lengthAdjust="spacing">Negativul:</text>
<text x="145.2" y="535.2" font-size="15" fill="#10233f" font-style="italic" textLength="355.9" lengthAdjust="spacing">nu aș cânta / n-aș cânta; nu ar fi cântat / n-ar fi cântat</text>
<text x="501.1" y="535.2" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="560.0" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="560.0" font-size="15" fill="#3a3226" font-weight="700" textLength="92.5" lengthAdjust="spacing">cam, mai, tot</text>
<text x="170.8" y="560.0" font-size="15" fill="#3a3226" textLength="187.8" lengthAdjust="spacing">stau între auxiliar și infinitiv (</text>
<text x="358.6" y="560.0" font-size="15" fill="#10233f" font-style="italic" textLength="83.1" lengthAdjust="spacing">aș mai cânta</text>
<text x="441.7" y="560.0" font-size="15" fill="#3a3226" textLength="260.4" lengthAdjust="spacing">) și, la perfect, între cele două auxiliare (</text>
<text x="702.1" y="560.0" font-size="15" fill="#10233f" font-style="italic" textLength="100.3" lengthAdjust="spacing">aș mai fi cântat</text>
<text x="802.4" y="560.0" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">).</text>
<text x="62.0" y="584.7" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="584.7" font-size="15" fill="#3a3226" textLength="163.3" lengthAdjust="spacing">În limbajul familiar există</text>
<text x="241.6" y="584.7" font-size="15" fill="#3a3226" font-weight="700" textLength="97.2" lengthAdjust="spacing">forme inverse</text>
<text x="338.8" y="584.7" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="346.1" y="584.7" font-size="15" fill="#10233f" font-style="italic" textLength="175.2" lengthAdjust="spacing">Cântare-aș, dar n-am glas!</text>
<text x="62.0" y="609.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="609.5" font-size="15" fill="#3a3226" textLength="305.4" lengthAdjust="spacing">Verbele predicative la condițional-optativ sunt</text>
<text x="383.6" y="609.5" font-size="15" fill="#3a3226" font-weight="700" textLength="122.2" lengthAdjust="spacing">predicate verbale</text>
<text x="505.9" y="609.5" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="628.0" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="628.0" width="6" height="61.7" rx="3" fill="#b4432c"/><text x="84.0" y="654.5" font-size="14.5" fill="#b4432c" font-weight="700" textLength="75.1" lengthAdjust="spacing">Ortograme</text>
<text x="84.0" y="673.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="27.6" lengthAdjust="spacing">n-aș</text>
<text x="115.5" y="673.3" font-size="14.5" fill="#3a3226" textLength="56.5" lengthAdjust="spacing">(nu aș) ≠</text>
<text x="175.9" y="673.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="21.8" lengthAdjust="spacing">naș</text>
<text x="201.6" y="673.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">·</text>
<text x="208.7" y="673.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="24.6" lengthAdjust="spacing">s-ar</text>
<text x="237.3" y="673.3" font-size="14.5" fill="#3a3226" textLength="52.6" lengthAdjust="spacing">(se ar) ≠</text>
<text x="293.8" y="673.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="18.8" lengthAdjust="spacing">sar</text>
<text x="316.6" y="673.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">·</text>
<text x="323.7" y="673.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="23.8" lengthAdjust="spacing">c-ai</text>
<text x="351.4" y="673.3" font-size="14.5" fill="#3a3226" textLength="51.5" lengthAdjust="spacing">(că ai) ≠</text>
<text x="406.8" y="673.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="18.0" lengthAdjust="spacing">cai</text>
<text x="428.7" y="673.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">·</text>
<text x="435.8" y="673.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="29.9" lengthAdjust="spacing">m-ai</text>
<text x="469.6" y="673.3" font-size="14.5" fill="#3a3226" textLength="57.3" lengthAdjust="spacing">(mă ai) ≠</text>
<text x="530.7" y="673.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="24.1" lengthAdjust="spacing">mai</text>
<rect x="62.0" y="703.7" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="730.2" font-size="14.5" fill="#10233f" font-weight="700" textLength="119.9" lengthAdjust="spacing">Model de analiză:</text>
<text x="78.0" y="749.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="708.4" lengthAdjust="spacing">„ar fi trăit” – verb predicativ, modul condițional-optativ, timpul perfect, persoana a III-a, numărul singular, funcția</text>
<text x="78.0" y="770.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="178.2" lengthAdjust="spacing">sintactică de predicat verbal.</text>
<text x="217.4" y="835.9" font-size="11.5" fill="#5b6b83" textLength="465.3" lengthAdjust="spacing">Sursa: Manual Art 6, pp. 70-71, rubricile Repere, tabelele de conjugare și modelul de analiză.</text>
</svg>
