<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="420" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Subiectul</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 13</text>

  <g>
    <rect x="60" y="95" width="360" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="240" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Subiectul exprimat</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="240" y="148">Apare direct în propoziție,</tspan>
      <tspan x="240" y="164">simplu (un termen) sau</tspan>
      <tspan x="240" y="180">multiplu (mai mulți termeni).</tspan>
      <tspan x="240" y="210" font-style="italic">Copilul aleargă. (simplu)</tspan>
      <tspan x="240" y="228" font-style="italic">Corina, Mirela și Cornel</tspan>
      <tspan x="240" y="244" font-style="italic">joacă șah. (multiplu)</tspan>
    </text>
  </g>

  <g>
    <rect x="480" y="95" width="360" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="660" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Subiectul neexprimat</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="660" y="148">Nu apare în propoziție, dar</tspan>
      <tspan x="660" y="164">se subînțelege din forma</tspan>
      <tspan x="660" y="180">verbului sau din context.</tspan>
      <tspan x="660" y="210" font-style="italic">Aerisesc sala de clasă.</tspan>
      <tspan x="660" y="228" font-style="italic">(ele, subînțeles)</tspan>
    </text>
  </g>

  <rect x="150" y="270" width="600" height="60" rx="14" fill="#fff3da" stroke="#b8944f" stroke-width="1.5"/>
  <text font-size="12" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="294">Unele verbe impersonale nu au subiect deloc:</tspan>
    <tspan x="450" y="312" font-style="italic">Burnițează de ieri. Azi, a nins puțin.</tspan>
  </text>

  <text x="450" y="398" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual, Lecția 13, p. 74</text>
</svg>
