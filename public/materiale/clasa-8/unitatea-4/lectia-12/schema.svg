<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 937" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="937" fill="#faf7f0"/>
<text x="287.9" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="324.8" lengthAdjust="spacing">Circumstanțialul de timp</text>
<text x="215.1" y="74.4" font-size="14" fill="#5b6b83" textLength="469.8" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a IV-a, Lecția 12 · Manual, p. 152 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE</text>
<rect x="40" y="128.6" width="820" height="80.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="185.6" lengthAdjust="spacing">Circumstanțialul de timp</text>
<text x="251.9" y="162.6" font-size="16" fill="#10233f" textLength="35.5" lengthAdjust="spacing">arată</text>
<text x="291.8" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="49.6" lengthAdjust="spacing">timpul</text>
<text x="345.7" y="162.6" font-size="16" fill="#10233f" textLength="24.0" lengthAdjust="spacing">sau</text>
<text x="374.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="70.7" lengthAdjust="spacing">frecvența</text>
<text x="449.0" y="162.6" font-size="16" fill="#10233f" textLength="255.0" lengthAdjust="spacing">unei acțiuni. Răspunde la întrebările:</text>
<text x="708.4" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="113.6" lengthAdjust="spacing">când? de când?</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="84.5" lengthAdjust="spacing">până când?</text>
<rect x="40" y="228.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="251.6" font-size="16" font-weight="700" fill="#ffffff">2. DE CE DEPINDE</text>
<rect x="40" y="262.6" width="820" height="166.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="280.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="302.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.2" lengthAdjust="spacing">Regentul</text>
<text x="345.6" y="302.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="312.2" x2="838.0" y2="312.2" stroke="#e3dccb"/>
<text x="74.0" y="334.7" font-size="14.5" fill="#3a3226" textLength="145.0" lengthAdjust="spacing">verb, locuțiune verbală</text>
<text x="345.6" y="334.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="63.1" lengthAdjust="spacing">Am plecat</text>
<text x="412.6" y="334.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="65.8" lengthAdjust="spacing">către ziuă</text>
<text x="478.4" y="334.7" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<text x="485.5" y="334.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="169.2" lengthAdjust="spacing">A băgat de seamă greșeala</text>
<text x="658.7" y="334.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="92.4" lengthAdjust="spacing">după examen</text>
<text x="751.0" y="334.7" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="345.0" x2="838.0" y2="345.0" stroke="#e3dccb"/>
<text x="74.0" y="367.5" font-size="14.5" fill="#3a3226" textLength="136.9" lengthAdjust="spacing">interjecție predicativă</text>
<text x="345.6" y="367.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="21.9" lengthAdjust="spacing">Hai</text>
<text x="371.4" y="367.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="37.0" lengthAdjust="spacing">acum</text>
<text x="408.4" y="367.5" font-size="14.5" fill="#3a3226" textLength="4.1" lengthAdjust="spacing">!</text>
<line x1="62.0" y1="377.9" x2="838.0" y2="377.9" stroke="#e3dccb"/>
<text x="74.0" y="400.4" font-size="14.5" fill="#3a3226" textLength="49.0" lengthAdjust="spacing">adjectiv</text>
<text x="345.6" y="400.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="46.0" lengthAdjust="spacing">Înfrânți</text>
<text x="395.5" y="400.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="21.8" lengthAdjust="spacing">ieri</text>
<text x="417.2" y="400.4" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">,</text>
<text x="424.3" y="400.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="55.8" lengthAdjust="spacing">victorioși</text>
<text x="484.1" y="400.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="38.7" lengthAdjust="spacing">astăzi</text>
<text x="522.8" y="400.4" font-size="14.5" fill="#3a3226" textLength="4.1" lengthAdjust="spacing">!</text>
<line x1="62.0" y1="410.7" x2="838.0" y2="410.7" stroke="#e3dccb"/>
<line x1="333.6" y1="280.6" x2="333.6" y2="410.7" stroke="#e3dccb"/>
<rect x="40" y="448.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="471.7" font-size="16" font-weight="700" fill="#ffffff">3. PRIN CE SE EXPRIMĂ</text>
<rect x="40" y="482.7" width="820" height="403.4" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="500.7" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="522.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="109.8" lengthAdjust="spacing">Partea de vorbire</text>
<text x="399.9" y="522.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="532.2" x2="838.0" y2="532.2" stroke="#e3dccb"/>
<text x="74.0" y="554.8" font-size="14.5" fill="#3a3226" textLength="65.0" lengthAdjust="spacing">substantiv</text>
<text x="399.9" y="554.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="393.8" lengthAdjust="spacing">La bătrânețe a devenit retras. Ne-am lămurit înaintea discuției.</text>
<line x1="62.0" y1="565.1" x2="838.0" y2="565.1" stroke="#e3dccb"/>
<text x="74.0" y="587.6" font-size="14.5" fill="#3a3226" textLength="180.4" lengthAdjust="spacing">adverb, locuțiune adverbială</text>
<text x="399.9" y="587.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="323.2" lengthAdjust="spacing">De alaltăieri îl caut. Vine din când în când pe la noi.</text>
<line x1="62.0" y1="598.0" x2="838.0" y2="598.0" stroke="#e3dccb"/>
<text x="74.0" y="620.5" font-size="14.5" fill="#3a3226" textLength="58.7" lengthAdjust="spacing">pronume</text>
<text x="399.9" y="620.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="359.0" lengthAdjust="spacing">A ajuns la gară după tine. În urma lor au mai sosit și alții.</text>
<line x1="62.0" y1="630.8" x2="838.0" y2="630.8" stroke="#e3dccb"/>
<text x="74.0" y="653.3" font-size="14.5" fill="#3a3226" textLength="298.7" lengthAdjust="spacing">adjectiv pronominal posesiv, după o prepoziție</text>
<text x="74.0" y="674.3" font-size="14.5" fill="#3a3226" textLength="63.2" lengthAdjust="spacing">de genitiv</text>
<text x="399.9" y="653.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="225.9" lengthAdjust="spacing">Am ajuns înaintea voastră la școală.</text>
<line x1="62.0" y1="684.7" x2="838.0" y2="684.7" stroke="#e3dccb"/>
<text x="74.0" y="707.2" font-size="14.5" fill="#3a3226" textLength="207.0" lengthAdjust="spacing">numeral cu valoare pronominală</text>
<text x="399.9" y="707.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="221.5" lengthAdjust="spacing">Va lua cuvântul după doi mai mari.</text>
<line x1="62.0" y1="717.5" x2="838.0" y2="717.5" stroke="#e3dccb"/>
<text x="74.0" y="740.0" font-size="14.5" fill="#3a3226" textLength="164.4" lengthAdjust="spacing">supin / infinitiv / gerunziu</text>
<text x="399.9" y="740.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="391.3" lengthAdjust="spacing">Părul se coafează după spălat. Până a sosi tu, am făcut ordine.</text>
<text x="399.9" y="761.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="221.1" lengthAdjust="spacing">Ascultându-te, mi-am amintit ceva.</text>
<line x1="62.0" y1="771.4" x2="838.0" y2="771.4" stroke="#e3dccb"/>
<line x1="387.9" y1="500.7" x2="387.9" y2="771.4" stroke="#e3dccb"/>
<rect x="62.0" y="785.4" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="785.4" width="6" height="82.7" rx="3" fill="#b4432c"/><text x="84.0" y="811.9" font-size="14.5" fill="#b4432c" font-weight="700" textLength="54.8" lengthAdjust="spacing">Atenție!</text>
<text x="84.0" y="830.8" font-size="14.5" fill="#3a3226" textLength="355.4" lengthAdjust="spacing">Aceeași prepoziție poate introduce un circumstanțial de</text>
<text x="443.3" y="830.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="19.9" lengthAdjust="spacing">loc</text>
<text x="467.1" y="830.8" font-size="14.5" fill="#3a3226" textLength="41.8" lengthAdjust="spacing">sau de</text>
<text x="512.8" y="830.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="32.0" lengthAdjust="spacing">timp</text>
<text x="544.8" y="830.8" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">:</text>
<text x="551.9" y="830.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="62.1" lengthAdjust="spacing">după deal</text>
<text x="617.9" y="830.8" font-size="14.5" fill="#3a3226" textLength="57.4" lengthAdjust="spacing">(unde?) /</text>
<text x="679.2" y="830.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="71.0" lengthAdjust="spacing">după prânz</text>
<text x="754.2" y="830.8" font-size="14.5" fill="#3a3226" textLength="49.3" lengthAdjust="spacing">(când?).</text>
<text x="84.0" y="851.8" font-size="14.5" fill="#3a3226" textLength="154.3" lengthAdjust="spacing">Pun întrebarea potrivită.</text>
<text x="218.9" y="917.6" font-size="11.5" fill="#5b6b83" textLength="462.3" lengthAdjust="spacing">Sursa: Manual Art 8, p. 152, rubrica Repere. Unele exemple sunt create pentru aceste notițe.</text>
</svg>
