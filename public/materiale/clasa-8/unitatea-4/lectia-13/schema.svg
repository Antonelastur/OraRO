<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="320" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Circumstanțialul și circumstanțiala de timp</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV</text>

  <g>
    <rect x="60" y="95" width="360" height="170" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="240" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#6f5ea8">Circumstanțialul de timp</text>
    <text x="240" y="145" text-anchor="middle" font-size="11" fill="#3a3226">parte secundară de propoziție</text>
    <text x="240" y="180" text-anchor="middle" font-size="12" fill="#10233f">A plecat <tspan fill="#6f5ea8" font-weight="700">dimineața</tspan>.</text>
    <text x="240" y="200" text-anchor="middle" font-size="10" fill="#5b6b83">adverb de timp</text>
    <text x="240" y="230" text-anchor="middle" font-size="12" fill="#10233f">A plecat <tspan fill="#6f5ea8" font-weight="700">înainte de masă</tspan>.</text>
    <text x="240" y="250" text-anchor="middle" font-size="10" fill="#5b6b83">grup prepozițional</text>
  </g>

  <g>
    <rect x="480" y="95" width="360" height="170" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="660" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9c92">Circumstanțiala de timp</text>
    <text x="660" y="145" text-anchor="middle" font-size="11" fill="#3a3226">propoziție subordonată, cu același rol</text>
    <text x="660" y="180" text-anchor="middle" font-size="12" fill="#10233f">A plecat <tspan fill="#0d9c92" font-weight="700">când s-a luminat</tspan>.</text>
    <text x="660" y="200" text-anchor="middle" font-size="10" fill="#5b6b83">element de relație: când</text>
    <text x="660" y="230" text-anchor="middle" font-size="12" fill="#10233f"><tspan fill="#0d9c92" font-weight="700">Înainte să plece</tspan>, a mâncat.</text>
    <text x="660" y="250" text-anchor="middle" font-size="10" fill="#5b6b83">locuțiune conjuncțională: înainte să</text>
  </g>

  <text x="450" y="290" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 152-154</text>
</svg>
