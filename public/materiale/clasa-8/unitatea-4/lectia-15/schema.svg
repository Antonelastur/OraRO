<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="400" fill="#faf7f0"/>
  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#10233f">Circumstanțiala de mod</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV · lecția 15 · realizarea propozițională a circumstanțialului de mod · răspunde la cum?</text>

  <rect x="55" y="80" width="390" height="130" rx="14" fill="none" stroke="#0d9c92" stroke-width="2"/>
  <text x="75" y="104" font-size="13" font-weight="700" fill="#10233f">Regentul</text>
  <text font-size="11.5" fill="#3a3226"><tspan x="75" y="128">• un verb sau o locuțiune verbală</tspan><tspan x="75" y="148">• un adjectiv (Bogat cum era,…)</tspan><tspan x="75" y="168">• un adverb (Pășește ușor, de parcă</tspan><tspan x="75" y="186">  n-ar atinge pământul.)</tspan></text>

  <rect x="465" y="80" width="380" height="130" rx="14" fill="none" stroke="#6f5ea8" stroke-width="2"/>
  <text x="485" y="104" font-size="13" font-weight="700" fill="#10233f">Elemente de relație</text>
  <text font-size="11" fill="#3a3226"><tspan x="485" y="126">• adverbe relative (cum, cât) și nehotărâte</tspan><tspan x="485" y="144">  (oricum, oricât)</tspan><tspan x="485" y="162">• conjuncția subordonatoare precum</tspan><tspan x="485" y="180">• locuțiuni conjuncționale: fără să, fără ca…să,</tspan><tspan x="485" y="198">  după cum, ca și cum, ca și când, de parcă</tspan></text>

  <rect x="55" y="226" width="790" height="88" rx="14" fill="none" stroke="#0d9c92" stroke-width="2"/>
  <text x="75" y="250" font-size="12.5" font-weight="700" fill="#10233f">Topica și punctuația</text>
  <text font-size="11" fill="#3a3226"><tspan x="75" y="272">în regentă pot apărea adverbe corelative (așa, astfel, întocmai), care marchează relația dintre propoziții</tspan><tspan x="75" y="292">expansiunea unui circumstanțial de mod dă o circumstanțială de mod, cu păstrarea sensului</tspan></text>

  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 156-157</text>
</svg>
