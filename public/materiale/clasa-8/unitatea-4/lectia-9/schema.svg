<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 711" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="711" fill="#faf7f0"/>
<text x="47.8" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="806.1" lengthAdjust="spacing">Comportamente nonverbale și paraverbale cu efect persuasiv</text>
<text x="200.6" y="74.4" font-size="14" fill="#5b6b83" textLength="498.8" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a IV-a, Lecția 9 · Manual, pp. 147-148 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. PERSUASIUNEA</text>
<rect x="40" y="128.6" width="820" height="113.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="98.6" lengthAdjust="spacing">Persuasiunea</text>
<text x="164.9" y="162.6" font-size="16" fill="#10233f" textLength="228.2" lengthAdjust="spacing">este capacitatea unui mesaj de a</text>
<text x="397.3" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="68.6" lengthAdjust="spacing">convinge</text>
<text x="466.0" y="162.6" font-size="16" fill="#10233f" textLength="294.9" lengthAdjust="spacing">. Pe lângă idei și dovezi, vorbitorul implică</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="76.5" lengthAdjust="spacing">emoțional</text>
<text x="142.8" y="185.8" font-size="16" fill="#10233f" textLength="320.6" lengthAdjust="spacing">publicul prin limbajul nonverbal și paraverbal.</text>
<text x="62.0" y="219.6" font-size="15" fill="#3a3226" textLength="167.7" lengthAdjust="spacing">Conținutul convinge prin:</text>
<text x="233.8" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="143.2" lengthAdjust="spacing">logica argumentelor</text>
<text x="377.0" y="219.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="384.4" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="124.2" lengthAdjust="spacing">puterea dovezilor</text>
<text x="508.5" y="219.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="515.9" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="129.3" lengthAdjust="spacing">consistența ideilor</text>
<text x="645.2" y="219.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="262.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="285.1" font-size="16" font-weight="700" fill="#ffffff">2. CE TRANSMIT PRIN CORP ȘI PRIN VOCE</text>
<rect x="40" y="296.1" width="820" height="180.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="175.6" y="329.1" font-size="15" fill="#10233f" font-weight="700" textLength="150.9" lengthAdjust="spacing">NONVERBAL (corpul)</text>
<text x="62.0" y="354.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="354.6" font-size="15" fill="#3a3226" textLength="109.3" lengthAdjust="spacing">mișcările capului</text>
<text x="62.0" y="379.4" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="379.4" font-size="15" fill="#3a3226" textLength="155.1" lengthAdjust="spacing">mimica (expresiile feței)</text>
<text x="62.0" y="404.1" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="404.1" font-size="15" fill="#3a3226" textLength="46.2" lengthAdjust="spacing">gestica</text>
<text x="62.0" y="428.9" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="428.9" font-size="15" fill="#3a3226" textLength="285.6" lengthAdjust="spacing">postura (cum stau în picioare sau pe scaun)</text>
<text x="62.0" y="453.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="453.6" font-size="15" fill="#3a3226" textLength="227.8" lengthAdjust="spacing">mișcările ochilor și contactul vizual</text>
<text x="566.7" y="329.1" font-size="15" fill="#10233f" font-weight="700" textLength="164.7" lengthAdjust="spacing">PARAVERBAL (rostirea)</text>
<text x="460.0" y="354.6" font-size="15" fill="#3a3226">•</text>
<text x="472.2" y="354.6" font-size="15" fill="#3a3226" textLength="257.1" lengthAdjust="spacing">volumul vocii, adaptat sălii și publicului</text>
<text x="460.0" y="379.4" font-size="15" fill="#3a3226">•</text>
<text x="472.2" y="379.4" font-size="15" fill="#3a3226" textLength="229.3" lengthAdjust="spacing">ritmul: lent, calm, precipitat, teatral</text>
<text x="460.0" y="404.1" font-size="15" fill="#3a3226">•</text>
<text x="472.2" y="404.1" font-size="15" fill="#3a3226" textLength="207.3" lengthAdjust="spacing">pauzele care accentuează ideile</text>
<text x="460.0" y="428.9" font-size="15" fill="#3a3226">•</text>
<text x="472.2" y="428.9" font-size="15" fill="#3a3226" textLength="189.9" lengthAdjust="spacing">accentuarea cuvintelor-cheie</text>
<text x="460.0" y="453.6" font-size="15" fill="#3a3226">•</text>
<text x="472.2" y="453.6" font-size="15" fill="#3a3226" textLength="226.5" lengthAdjust="spacing">intonația: timbrul și înălțimea vocii</text>
<rect x="40" y="496.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="519.1" font-size="16" font-weight="700" fill="#ffffff">3. CÂND ȚIN UN DISCURS</text>
<rect x="40" y="530.1" width="820" height="129.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="563.1" font-size="15" fill="#3a3226" font-weight="700">1.</text>
<text x="81.0" y="563.1" font-size="15" fill="#3a3226" textLength="69.2" lengthAdjust="spacing">îmi schițez</text>
<text x="154.2" y="563.1" font-size="15" fill="#3a3226" font-weight="700" textLength="44.1" lengthAdjust="spacing">planul</text>
<text x="202.3" y="563.1" font-size="15" fill="#3a3226" textLength="64.2" lengthAdjust="spacing">expunerii;</text>
<text x="62.0" y="587.9" font-size="15" fill="#3a3226" font-weight="700">2.</text>
<text x="81.0" y="587.9" font-size="15" fill="#3a3226" textLength="74.2" lengthAdjust="spacing">aleg câteva</text>
<text x="159.2" y="587.9" font-size="15" fill="#3a3226" font-weight="700" textLength="49.2" lengthAdjust="spacing">gesturi</text>
<text x="212.5" y="587.9" font-size="15" fill="#3a3226" textLength="190.4" lengthAdjust="spacing">care susțin ideile importante;</text>
<text x="62.0" y="612.6" font-size="15" fill="#3a3226" font-weight="700">3.</text>
<text x="81.0" y="612.6" font-size="15" fill="#3a3226" textLength="217.0" lengthAdjust="spacing">privesc publicul, variez vocea, fac</text>
<text x="302.0" y="612.6" font-size="15" fill="#3a3226" font-weight="700" textLength="41.8" lengthAdjust="spacing">pauze</text>
<text x="347.9" y="612.6" font-size="15" fill="#3a3226" textLength="142.0" lengthAdjust="spacing">înaintea ideilor-cheie;</text>
<text x="62.0" y="637.4" font-size="15" fill="#3a3226" font-weight="700">4.</text>
<text x="81.0" y="637.4" font-size="15" fill="#3a3226" textLength="607.8" lengthAdjust="spacing">mă autoevaluez: în ce măsură comportamentul nonverbal și paraverbal mi-a subliniat ideile?</text>
<text x="240.1" y="691.4" font-size="11.5" fill="#5b6b83" textLength="419.9" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 147-148, rubrica Repere și schema elementelor persuasive.</text>
</svg>
