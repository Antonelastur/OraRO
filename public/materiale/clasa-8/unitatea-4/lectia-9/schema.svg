<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="960" height="400" fill="#faf7f0"/>
  <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Convingi și cu vocea, și cu corpul</text>
  <text x="480" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV, Lecția 9 · Comportamente cu efect persuasiv</text>
  <rect x="36" y="100" width="432" height="196" rx="16" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="58" y="132" font-size="15" font-weight="700" fill="#3b5fa8">NONVERBAL, corpul</text>
  <circle cx="70" cy="166" r="5" fill="#3b5fa8"/>
  <text x="88" y="171" font-size="12.5" fill="#3d4a5f">contactul vizual cu publicul</text>
  <circle cx="70" cy="200" r="5" fill="#3b5fa8"/>
  <text x="88" y="205" font-size="12.5" fill="#3d4a5f">gesturile care însoțesc ideea</text>
  <circle cx="70" cy="234" r="5" fill="#3b5fa8"/>
  <text x="88" y="239" font-size="12.5" fill="#3d4a5f">postura dreaptă, deschisă</text>
  <circle cx="70" cy="268" r="5" fill="#3b5fa8"/>
  <text x="88" y="273" font-size="12.5" fill="#3d4a5f">expresia feței, potrivită temei</text>
  <rect x="492" y="100" width="432" height="196" rx="16" fill="#ffffff" stroke="#a1417e" stroke-width="2.5"/>
  <text x="514" y="132" font-size="15" font-weight="700" fill="#a1417e">PARAVERBAL, vocea</text>
  <circle cx="526" cy="166" r="5" fill="#a1417e"/>
  <text x="544" y="171" font-size="12.5" fill="#3d4a5f">volumul, ca să te audă toți</text>
  <circle cx="526" cy="200" r="5" fill="#a1417e"/>
  <text x="544" y="205" font-size="12.5" fill="#3d4a5f">ritmul, nici prea repede</text>
  <circle cx="526" cy="234" r="5" fill="#a1417e"/>
  <text x="544" y="239" font-size="12.5" fill="#3d4a5f">pauzele înaintea ideii-cheie</text>
  <circle cx="526" cy="268" r="5" fill="#a1417e"/>
  <text x="544" y="273" font-size="12.5" fill="#3d4a5f">accentul pe cuvintele importante</text>
  <rect x="36" y="312" width="888" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="58" y="337" font-size="13" font-weight="700" fill="#10233f">Pauza, arma cea mai simplă</text>
  <text x="58" y="357" font-size="12" fill="#3d4a5f">o tăcere de o secundă înaintea ideii principale o face să conteze mai mult decât orice cuvânt în plus.</text>
</svg>
