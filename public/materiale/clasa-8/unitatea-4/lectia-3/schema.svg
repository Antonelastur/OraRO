<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="960" height="400" fill="#faf7f0"/>
  <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Povestirea în ramă, o poveste în altă poveste</text>
  <text x="480" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV, Lecția 3 · Textul epic. Structuri textuale</text>
  <rect x="60" y="100" width="840" height="192" rx="18" fill="#ffffff" stroke="#3b5fa8" stroke-width="3"/>
  <text x="84" y="130" font-size="14" font-weight="700" fill="#3b5fa8">RAMA, planul întâi</text>
  <text x="84" y="154" font-size="12.5" fill="#3d4a5f">La Hanu Ancuței. Călătorii se strâng, mănâncă, se pregătesc să asculte.</text>
  <text x="84" y="174" font-size="12.5" fill="#3d4a5f">Un narator descrie locul și pe cei de față.</text>
  <rect x="110" y="188" width="740" height="86" rx="14" fill="#fef8e9" stroke="#a1417e" stroke-width="2.5"/>
  <text x="134" y="216" font-size="14" font-weight="700" fill="#a1417e">POVESTEA DIN INTERIOR, planul al doilea</text>
  <text x="134" y="240" font-size="12.5" fill="#3d4a5f">Unul dintre călători ia cuvântul și spune întâmplarea cu iapa lui Vodă.</text>
  <text x="134" y="260" font-size="12.5" fill="#3d4a5f">Alt narator, alt timp, alte personaje.</text>
  <rect x="60" y="308" width="840" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="82" y="333" font-size="13" font-weight="700" fill="#10233f">Se numește inserție</text>
  <text x="82" y="353" font-size="12" fill="#3d4a5f">o structură cuprinsă în interiorul alteia. Alte moduri de îmbinare: succesiunea și alternanța.</text>
  <text x="480" y="386" text-anchor="middle" font-size="12" font-style="italic" fill="#5b6b83">Același procedeu apare în O mie și una de nopți și în Decameronul.</text>
</svg>
