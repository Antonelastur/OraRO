<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="940" height="400" fill="#faf7f0"/>
  <text x="470" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Antiteza, ce se vede când pui două lucruri alături</text>
  <text x="470" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV, Lecția 4 · Naratorii și personajele</text>
  <rect x="36" y="100" width="420" height="130" rx="16" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="56" y="130" font-size="14" font-weight="700" fill="#10233f">La nivel de enunț</text>
  <text x="56" y="156" font-size="12" fill="#3d4a5f">două cuvinte sau imagini opuse,</text>
  <text x="56" y="176" font-size="12" fill="#3d4a5f">alăturate în aceeași frază</text>
  <text x="56" y="196" font-size="12" fill="#3d4a5f"></text>
  <text x="56" y="216" font-size="12" fill="#3d4a5f">alb și negru, tânăr și bătrân</text>
  <rect x="484" y="100" width="420" height="130" rx="16" fill="#ffffff" stroke="#a1417e" stroke-width="2.5"/>
  <text x="504" y="130" font-size="14" font-weight="700" fill="#10233f">La nivelul operei</text>
  <text x="504" y="156" font-size="12" fill="#3d4a5f">două personaje sau două lumi</text>
  <text x="504" y="176" font-size="12" fill="#3d4a5f">construite ca opuse</text>
  <text x="504" y="196" font-size="12" fill="#3d4a5f"></text>
  <text x="504" y="216" font-size="12" fill="#3d4a5f">planul hanului față de</text>
  <text x="504" y="236" font-size="12" fill="#3d4a5f">planul curții domnești</text>
  <rect x="36" y="254" width="868" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="58" y="279" font-size="13" font-weight="700" fill="#10233f">La ce folosește</text>
  <text x="58" y="299" font-size="12" fill="#3d4a5f">opoziția scoate în evidență. O însușire se vede mai bine când e pusă lângă contrariul ei.</text>
  <rect x="36" y="318" width="868" height="56" rx="14" fill="#ffffff" stroke="#e2d9c4" stroke-width="2"/>
  <text x="58" y="343" font-size="13" font-weight="700" fill="#10233f">Nu confunda</text>
  <text x="58" y="363" font-size="12" fill="#3d4a5f">comparația apropie doi termeni, antiteza îi opune. Ca un leu e comparație; leu și miel alăturați, antiteză.</text>
</svg>
