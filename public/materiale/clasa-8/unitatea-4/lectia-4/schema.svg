<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 823" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="823" fill="#faf7f0"/>
<text x="235.0" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="430.9" lengthAdjust="spacing">Naratorii și personajele. Antiteza</text>
<text x="200.6" y="74.4" font-size="14" fill="#5b6b83" textLength="498.8" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a IV-a, Lecția 4 · Manual, pp. 138-139 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. NARATORII ÎN POVESTIREA ÎN RAMĂ</text>
<rect x="40" y="128.6" width="820" height="216.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="121.6" lengthAdjust="spacing">Povestirea în ramă</text>
<text x="187.7" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="113.4" lengthAdjust="spacing">schimbă rolurile</text>
<text x="305.1" y="161.6" font-size="15" fill="#3a3226" textLength="124.0" lengthAdjust="spacing">narator – personaj:</text>
<rect x="62.0" y="180.1" width="380.0" height="91.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="208.1" font-size="16" fill="#0d9c92" font-weight="700" textLength="141.6" lengthAdjust="spacing">naratorul din ramă</text>
<text x="78.0" y="231.4" font-size="14.5" fill="#3a3226" textLength="42.3" lengthAdjust="spacing">devine</text>
<text x="124.3" y="231.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="67.9" lengthAdjust="spacing">ascultător</text>
<text x="78.0" y="255.3" font-size="14.5" fill="#3a3226" textLength="256.4" lengthAdjust="spacing">nu participă la acțiunea poveștii inserate</text>
<rect x="458.0" y="180.1" width="380.0" height="91.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="208.1" font-size="16" fill="#6f5ea8" font-weight="700" textLength="88.6" lengthAdjust="spacing">un personaj</text>
<text x="474.0" y="231.4" font-size="14.5" fill="#3a3226" textLength="42.3" lengthAdjust="spacing">devine</text>
<text x="520.3" y="231.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="50.6" lengthAdjust="spacing">narator</text>
<text x="474.0" y="255.3" font-size="14.5" fill="#3a3226" textLength="106.7" lengthAdjust="spacing">uneori rămâne și</text>
<text x="584.6" y="255.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="58.6" lengthAdjust="spacing">personaj</text>
<text x="647.1" y="255.3" font-size="14.5" fill="#3a3226" textLength="126.9" lengthAdjust="spacing">în propria narațiune</text>
<text x="62.0" y="300.7" font-size="15" fill="#3a3226" textLength="288.6" lengthAdjust="spacing">Ascultătorii sunt esențiali: fac parte dintr-un</text>
<text x="354.6" y="300.7" font-size="15" fill="#3a3226" font-weight="700" textLength="140.6" lengthAdjust="spacing">ritual al comunicării</text>
<text x="495.2" y="300.7" font-size="15" fill="#3a3226" textLength="282.1" lengthAdjust="spacing">, convenția pe care se sprijină povestirea în</text>
<text x="62.0" y="322.4" font-size="15" fill="#3a3226" textLength="64.0" lengthAdjust="spacing">povestire.</text>
<rect x="40" y="364.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="387.9" font-size="16" font-weight="700" fill="#ffffff">2. ANTITEZA</text>
<rect x="40" y="398.9" width="820" height="209.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="432.9" font-size="16" fill="#10233f" font-weight="700" textLength="62.9" lengthAdjust="spacing">Antiteza</text>
<text x="129.2" y="432.9" font-size="16" fill="#10233f" textLength="654.6" lengthAdjust="spacing">este figura de stil care alătură doi termeni (fenomene, idei, obiecte, personaje, situații, planuri</text>
<text x="62.0" y="456.1" font-size="16" fill="#10233f" textLength="174.2" lengthAdjust="spacing">narative) ca să sublinieze</text>
<text x="240.6" y="456.1" font-size="16" fill="#10233f" font-weight="700" textLength="61.0" lengthAdjust="spacing">opoziția</text>
<text x="305.8" y="456.1" font-size="16" fill="#10233f" textLength="61.8" lengthAdjust="spacing">dintre ei.</text>
<rect x="62.0" y="474.9" width="380.0" height="115.5" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="78.0" y="502.9" font-size="16" fill="#9a7433" font-weight="700" textLength="145.0" lengthAdjust="spacing">la nivelul enunțului</text>
<text x="78.0" y="526.2" font-size="14.5" fill="#3a3226" textLength="150.8" lengthAdjust="spacing">aspecte concrete opuse</text>
<text x="78.0" y="550.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="216.5" lengthAdjust="spacing">alb – negru, înalt – scund, sus – jos</text>
<rect x="458.0" y="474.9" width="380.0" height="115.5" rx="12" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
<text x="474.0" y="502.9" font-size="16" fill="#10233f" font-weight="700" textLength="120.2" lengthAdjust="spacing">la nivelul operei</text>
<text x="474.0" y="526.2" font-size="14.5" fill="#3a3226" textLength="142.4" lengthAdjust="spacing">planuri narative opuse</text>
<text x="474.0" y="550.1" font-size="14.5" fill="#3a3226" textLength="133.7" lengthAdjust="spacing">personaje în opoziție</text>
<text x="474.0" y="574.1" font-size="14.5" fill="#3a3226" textLength="203.0" lengthAdjust="spacing">acțiuni, ipostaze, opinii contrare</text>
<rect x="40" y="628.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="651.4" font-size="16" font-weight="700" fill="#ffffff">3. FIȘA DE CARACTERIZARE</text>
<rect x="40" y="662.4" width="820" height="109.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="695.4" font-size="15" fill="#3a3226" textLength="90.5" lengthAdjust="spacing">Rubricile fișei:</text>
<text x="156.5" y="695.4" font-size="15" fill="#3a3226" font-weight="700" textLength="68.7" lengthAdjust="spacing">identitate</text>
<text x="229.2" y="695.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="236.6" y="695.4" font-size="15" fill="#3a3226" font-weight="700" textLength="100.7" lengthAdjust="spacing">trăsături fizice</text>
<text x="341.3" y="695.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="348.7" y="695.4" font-size="15" fill="#3a3226" font-weight="700" textLength="113.4" lengthAdjust="spacing">trăsături morale</text>
<text x="466.1" y="695.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="473.5" y="695.4" font-size="15" fill="#3a3226" font-weight="700" textLength="125.7" lengthAdjust="spacing">modalități directe</text>
<text x="603.2" y="695.4" font-size="15" fill="#3a3226" textLength="204.7" lengthAdjust="spacing">de caracterizare (naratorul, alte</text>
<text x="62.0" y="717.2" font-size="15" fill="#3a3226" textLength="232.1" lengthAdjust="spacing">personaje, personajul despre sine) ·</text>
<text x="298.1" y="717.2" font-size="15" fill="#3a3226" font-weight="700" textLength="139.1" lengthAdjust="spacing">modalități indirecte</text>
<text x="441.2" y="717.2" font-size="15" fill="#3a3226" textLength="208.6" lengthAdjust="spacing">(fapte, gesturi, limbaj, atitudini).</text>
<text x="62.0" y="749.7" font-size="14" fill="#5b6b83" textLength="608.1" lengthAdjust="spacing">Statutul personajelor: principal, secundar, episodic, figurant, colectiv. Pentru fiecare trăsătură dau o</text>
<text x="673.9" y="749.7" font-size="14" fill="#5b6b83" font-weight="700" textLength="36.8" lengthAdjust="spacing">citare</text>
<text x="714.5" y="749.7" font-size="14" fill="#5b6b83" textLength="49.7" lengthAdjust="spacing">din text.</text>
<text x="239.9" y="803.4" font-size="11.5" fill="#5b6b83" textLength="420.2" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 138-139, rubrica Repere și fișa de identitate a personajului.</text>
</svg>
