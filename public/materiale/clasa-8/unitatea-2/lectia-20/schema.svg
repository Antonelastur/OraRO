<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1233" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1233" fill="#faf7f0"/>
<text x="83.5" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="734.7" lengthAdjust="spacing">Recapitulare: textul dramatic și textele despre spectacol</text>
<text x="180.5" y="74.4" font-size="14" fill="#5b6b83" textLength="539.0" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a II-a, Lecția 20 · Manual, pp. 58-73 și 94-95 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL DRAMATIC</text>
<rect x="40" y="128.6" width="820" height="327.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="59.0" lengthAdjust="spacing">Noțiunea</text>
<text x="283.5" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="50.6" lengthAdjust="spacing">Pe scurt</text>
<line x1="62.0" y1="178.2" x2="838.0" y2="178.2" stroke="#e3dccb"/>
<text x="74.0" y="200.7" font-size="14.5" fill="#3a3226" textLength="80.2" lengthAdjust="spacing">actul / scena</text>
<text x="283.5" y="200.7" font-size="14.5" fill="#3a3226" textLength="529.7" lengthAdjust="spacing">act = cifre romane, separate prin cortină; scenă = cifre arabe, se schimbă la intrarea</text>
<text x="283.5" y="221.7" font-size="14.5" fill="#3a3226" textLength="157.3" lengthAdjust="spacing">sau ieșirea unui personaj</text>
<line x1="62.0" y1="232.0" x2="838.0" y2="232.0" stroke="#e3dccb"/>
<text x="74.0" y="254.5" font-size="14.5" fill="#3a3226" textLength="110.9" lengthAdjust="spacing">indicațiile scenice</text>
<text x="283.5" y="254.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.8" lengthAdjust="spacing">externe</text>
<text x="339.2" y="254.5" font-size="14.5" fill="#3a3226" textLength="186.3" lengthAdjust="spacing">(lista personajelor, decorul) și</text>
<text x="529.4" y="254.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="48.9" lengthAdjust="spacing">interne</text>
<text x="582.2" y="254.5" font-size="14.5" fill="#3a3226" textLength="166.7" lengthAdjust="spacing">(numele din fața replicilor,</text>
<text x="283.5" y="275.5" font-size="14.5" fill="#3a3226" textLength="271.1" lengthAdjust="spacing">parantezele cu gesturi, ton, ritm, atitudine)</text>
<line x1="62.0" y1="285.9" x2="838.0" y2="285.9" stroke="#e3dccb"/>
<text x="74.0" y="308.4" font-size="14.5" fill="#3a3226" textLength="49.3" lengthAdjust="spacing">replicile</text>
<text x="283.5" y="308.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="55.7" lengthAdjust="spacing">dialogul</text>
<text x="343.1" y="308.4" font-size="14.5" fill="#3a3226" textLength="224.7" lengthAdjust="spacing">(principala formă de comunicare) și</text>
<text x="571.8" y="308.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="74.7" lengthAdjust="spacing">monologul</text>
<text x="650.4" y="308.4" font-size="14.5" fill="#3a3226" textLength="119.9" lengthAdjust="spacing">(intervenție amplă)</text>
<line x1="62.0" y1="318.8" x2="838.0" y2="318.8" stroke="#e3dccb"/>
<text x="74.0" y="341.2" font-size="14.5" fill="#3a3226" textLength="96.9" lengthAdjust="spacing">timpul / spațiul</text>
<text x="283.5" y="341.2" font-size="14.5" fill="#3a3226" textLength="468.3" lengthAdjust="spacing">durata reprezentației și momentul ficțiunii; spațiul-scenă și spațiul ficțiunii</text>
<line x1="62.0" y1="351.6" x2="838.0" y2="351.6" stroke="#e3dccb"/>
<text x="74.0" y="374.1" font-size="14.5" fill="#3a3226" textLength="125.7" lengthAdjust="spacing">acțiunea / conflictul</text>
<text x="283.5" y="374.1" font-size="14.5" fill="#3a3226" textLength="472.7" lengthAdjust="spacing">de la situația inițială la cea finală; conflictul = înfruntarea unor interese sau</text>
<text x="283.5" y="395.1" font-size="14.5" fill="#3a3226" textLength="114.0" lengthAdjust="spacing">sentimente opuse</text>
<line x1="62.0" y1="405.5" x2="838.0" y2="405.5" stroke="#e3dccb"/>
<text x="74.0" y="428.0" font-size="14.5" fill="#3a3226" textLength="54.7" lengthAdjust="spacing">comedia</text>
<text x="283.5" y="428.0" font-size="14.5" fill="#3a3226" textLength="382.4" lengthAdjust="spacing">provoacă râsul prin înfățișare, comportament, limbaj, situații</text>
<line x1="62.0" y1="438.3" x2="838.0" y2="438.3" stroke="#e3dccb"/>
<line x1="271.5" y1="146.6" x2="271.5" y2="438.3" stroke="#e3dccb"/>
<rect x="40" y="476.3" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="499.3" font-size="16" font-weight="700" fill="#ffffff">2. PERSONAJUL DRAMATIC</text>
<rect x="40" y="510.3" width="820" height="206.8" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="528.3" width="380.0" height="115.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="556.3" font-size="16" fill="#0d9c92" font-weight="700" textLength="152.6" lengthAdjust="spacing">caracterizare directă</text>
<text x="78.0" y="579.6" font-size="14.5" fill="#3a3226" textLength="169.5" lengthAdjust="spacing">autorul (indicațiile scenice)</text>
<text x="78.0" y="603.5" font-size="14.5" fill="#3a3226" textLength="89.8" lengthAdjust="spacing">alte personaje</text>
<text x="78.0" y="627.5" font-size="14.5" fill="#3a3226" textLength="117.3" lengthAdjust="spacing">autocaracterizarea</text>
<rect x="458.0" y="528.3" width="380.0" height="115.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="556.3" font-size="16" fill="#6f5ea8" font-weight="700" textLength="166.9" lengthAdjust="spacing">caracterizare indirectă</text>
<text x="474.0" y="579.6" font-size="14.5" fill="#3a3226" textLength="196.0" lengthAdjust="spacing">acțiuni, gesturi, comportament</text>
<text x="474.0" y="603.5" font-size="14.5" fill="#3a3226" textLength="132.7" lengthAdjust="spacing">felul în care vorbește</text>
<text x="474.0" y="627.5" font-size="14.5" fill="#3a3226" textLength="56.8" lengthAdjust="spacing">ce spune</text>
<text x="62.0" y="672.8" font-size="15" fill="#3a3226" textLength="56.5" lengthAdjust="spacing">Pentru o</text>
<text x="122.6" y="672.8" font-size="15" fill="#3a3226" font-weight="700" textLength="116.7" lengthAdjust="spacing">fișă comparativă</text>
<text x="243.3" y="672.8" font-size="15" fill="#3a3226" textLength="514.8" lengthAdjust="spacing">a două personaje notez: statutul social, preferințele, idealurile, atitudinea, apoi</text>
<text x="62.0" y="694.6" font-size="15" fill="#3a3226" font-weight="700" textLength="84.5" lengthAdjust="spacing">asemănările</text>
<text x="150.5" y="694.6" font-size="15" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="164.5" y="694.6" font-size="15" fill="#3a3226" font-weight="700" textLength="77.2" lengthAdjust="spacing">deosebirile</text>
<text x="241.7" y="694.6" font-size="15" fill="#3a3226" textLength="227.4" lengthAdjust="spacing">, fiecare cu o replică drept dovadă.</text>
<rect x="40" y="737.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="760.1" font-size="16" font-weight="700" fill="#ffffff">3. TEXTE DESPRE SPECTACOL ȘI FILM</text>
<rect x="40" y="771.1" width="820" height="208.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="789.1" width="776.0" height="31.6" fill="#efeaf8"/>

<text x="229.2" y="810.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="130.1" lengthAdjust="spacing">Cronica de spectacol</text>
<text x="539.6" y="810.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="96.1" lengthAdjust="spacing">Cronica de film</text>
<line x1="62.0" y1="820.6" x2="838.0" y2="820.6" stroke="#e3dccb"/>
<text x="74.0" y="843.1" font-size="14.5" fill="#3a3226" textLength="30.9" lengthAdjust="spacing">când</text>
<text x="229.2" y="843.1" font-size="14.5" fill="#3a3226" textLength="196.6" lengthAdjust="spacing">imediat după punerea în scenă</text>
<text x="539.6" y="843.1" font-size="14.5" fill="#3a3226" textLength="94.0" lengthAdjust="spacing">după vizionare</text>
<line x1="62.0" y1="853.5" x2="838.0" y2="853.5" stroke="#e3dccb"/>
<text x="74.0" y="876.0" font-size="14.5" fill="#3a3226" textLength="63.5" lengthAdjust="spacing">ce discută</text>
<text x="229.2" y="876.0" font-size="14.5" fill="#3a3226" textLength="254.3" lengthAdjust="spacing">regie, scenografie, jocul actorilor, decor,</text>
<text x="229.2" y="897.0" font-size="14.5" fill="#3a3226" textLength="125.6" lengthAdjust="spacing">costume, atmosferă</text>
<text x="539.6" y="876.0" font-size="14.5" fill="#3a3226" textLength="244.2" lengthAdjust="spacing">regie, scenariu, jocul actorilor, coloană</text>
<text x="539.6" y="897.0" font-size="14.5" fill="#3a3226" textLength="89.8" lengthAdjust="spacing">sonoră, efecte</text>
<line x1="62.0" y1="907.4" x2="838.0" y2="907.4" stroke="#e3dccb"/>
<text x="74.0" y="929.9" font-size="14.5" fill="#3a3226" textLength="101.9" lengthAdjust="spacing">ce are în comun</text>
<text x="229.2" y="929.9" font-size="14.5" fill="#3a3226" textLength="254.0" lengthAdjust="spacing">text de opinie, subiectiv, cu un punct de</text>
<text x="229.2" y="950.9" font-size="14.5" fill="#3a3226" textLength="74.2" lengthAdjust="spacing">vedere final</text>
<text x="539.6" y="929.9" font-size="14.5" fill="#3a3226" textLength="123.0" lengthAdjust="spacing">nu dezvăluie finalul</text>
<line x1="62.0" y1="961.2" x2="838.0" y2="961.2" stroke="#e3dccb"/>
<line x1="217.2" y1="789.1" x2="217.2" y2="961.2" stroke="#e3dccb"/>
<line x1="527.6" y1="789.1" x2="527.6" y2="961.2" stroke="#e3dccb"/>
<rect x="40" y="999.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1022.2" font-size="16" font-weight="700" fill="#ffffff">4. COMUNICARE ȘI INTERCULTURALITATE</text>
<rect x="40" y="1033.2" width="820" height="148.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1066.2" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="1066.2" font-size="15" fill="#3a3226" textLength="216.9" lengthAdjust="spacing">Atitudini care ajută comunicarea:</text>
<text x="295.1" y="1066.2" font-size="15" fill="#3a3226" font-weight="700" textLength="427.1" lengthAdjust="spacing">flexibilitatea, asertivitatea, disponibilitatea pentru negociere</text>
<text x="722.2" y="1066.2" font-size="15" fill="#3a3226" textLength="47.7" lengthAdjust="spacing">; opuse</text>
<text x="74.2" y="1088.0" font-size="15" fill="#3a3226" textLength="469.2" lengthAdjust="spacing">asertivității: pasivitatea, agresivitatea, pasivitatea agresivă, manipularea.</text>
<text x="62.0" y="1112.7" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="1112.7" font-size="15" fill="#3a3226" font-weight="700" textLength="194.4" lengthAdjust="spacing">Comunitățile multiculturale</text>
<text x="272.7" y="1112.7" font-size="15" fill="#3a3226" textLength="243.3" lengthAdjust="spacing">conviețuiesc fără schimburi culturale;</text>
<text x="520.0" y="1112.7" font-size="15" fill="#3a3226" font-weight="700" textLength="188.4" lengthAdjust="spacing">comunitățile interculturale</text>
<text x="712.4" y="1112.7" font-size="15" fill="#3a3226" textLength="104.1" lengthAdjust="spacing">interacționează,</text>
<text x="74.2" y="1134.5" font-size="15" fill="#3a3226" textLength="254.5" lengthAdjust="spacing">respectând valorile și tradițiile celuilalt.</text>
<text x="62.0" y="1159.2" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="1159.2" font-size="15" fill="#3a3226" textLength="264.0" lengthAdjust="spacing">Relațiile culturale constructive păstrează</text>
<text x="342.2" y="1159.2" font-size="15" fill="#3a3226" font-weight="700" textLength="123.6" lengthAdjust="spacing">identitatea etnică</text>
<text x="465.8" y="1159.2" font-size="15" fill="#3a3226" textLength="332.8" lengthAdjust="spacing">, chiar când preiau elemente de la altă comunitate.</text>
<text x="106.7" y="1213.2" font-size="11.5" fill="#5b6b83" textLength="686.7" lengthAdjust="spacing">Sursa: Manual Art 8, rubricile Repere din lecțiile 2, 3, 5, 7, 8 și 18; recapitularea de la pp. 94-95 („Citadela sfărâmată” de Horia Lovinescu).</text>
</svg>
