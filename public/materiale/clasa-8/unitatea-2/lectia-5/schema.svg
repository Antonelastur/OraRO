<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="840" fill="#faf7f0"/>
<text x="197.3" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="506.4" lengthAdjust="spacing">Textul nonliterar. Cronica de spectacol</text>
<text x="210.6" y="74.4" font-size="14" fill="#5b6b83" textLength="478.8" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a II-a, Lecția 5 · Manual, pp. 65-67 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL NONLITERAR</text>
<rect x="40" y="128.6" width="820" height="80.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="126.4" lengthAdjust="spacing">Textul nonliterar</text>
<text x="192.7" y="162.6" font-size="16" fill="#10233f" textLength="159.4" lengthAdjust="spacing">se referă la aspecte ale</text>
<text x="356.4" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="62.7" lengthAdjust="spacing">realității</text>
<text x="419.1" y="162.6" font-size="16" fill="#10233f" textLength="169.6" lengthAdjust="spacing">. Poate avea scopul de a</text>
<text x="593.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="59.8" lengthAdjust="spacing">informa</text>
<text x="652.8" y="162.6" font-size="16" fill="#10233f" textLength="38.1" lengthAdjust="spacing">, de a</text>
<text x="695.2" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="68.6" lengthAdjust="spacing">convinge</text>
<text x="763.9" y="162.6" font-size="16" fill="#10233f" textLength="38.1" lengthAdjust="spacing">, de a</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="49.4" lengthAdjust="spacing">amuza</text>
<text x="115.8" y="185.8" font-size="16" fill="#10233f" textLength="24.6" lengthAdjust="spacing">etc.</text>
<rect x="40" y="228.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="251.6" font-size="16" font-weight="700" fill="#ffffff">2. CRONICA DE SPECTACOL</text>
<rect x="40" y="262.6" width="820" height="342.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="295.6" font-size="15" fill="#3a3226" font-weight="700" textLength="144.6" lengthAdjust="spacing">Cronica de spectacol</text>
<text x="210.7" y="295.6" font-size="15" fill="#3a3226" textLength="48.1" lengthAdjust="spacing">este un</text>
<text x="262.8" y="295.6" font-size="15" fill="#3a3226" font-weight="700" textLength="186.3" lengthAdjust="spacing">comentariu de specialitate</text>
<text x="449.1" y="295.6" font-size="15" fill="#3a3226" textLength="357.4" lengthAdjust="spacing">, scris imediat după punerea în scenă a unui spectacol.</text>
<text x="62.0" y="317.4" font-size="15" fill="#3a3226" textLength="497.5" lengthAdjust="spacing">Poate discuta orice element al spectacolului, de la text la realizarea artistică.</text>
<text x="62.0" y="350.9" font-size="15" fill="#3a3226" textLength="121.8" lengthAdjust="spacing">Ce poate examina:</text>
<text x="187.8" y="350.9" font-size="15" fill="#3a3226" font-weight="700" textLength="632.8" lengthAdjust="spacing">regia, scenografia, coregrafia, jocul actorilor, decorul, costumele, coloana sonoră, efectele</text>
<text x="62.0" y="372.6" font-size="15" fill="#3a3226" font-weight="700" textLength="200.7" lengthAdjust="spacing">speciale, atmosfera generală</text>
<text x="262.7" y="372.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="391.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="412.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="60.1" lengthAdjust="spacing">Trăsătura</text>
<text x="306.8" y="412.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="79.9" lengthAdjust="spacing">Ce înseamnă</text>
<line x1="62.0" y1="422.7" x2="838.0" y2="422.7" stroke="#e3dccb"/>
<text x="74.0" y="445.2" font-size="14.5" fill="#3a3226" textLength="44.1" lengthAdjust="spacing">text de</text>
<text x="122.0" y="445.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="42.6" lengthAdjust="spacing">opinie</text>
<text x="306.8" y="445.2" font-size="14.5" fill="#3a3226" textLength="130.4" lengthAdjust="spacing">are un grad mare de</text>
<text x="441.1" y="445.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="91.6" lengthAdjust="spacing">subiectivitate</text>
<line x1="62.0" y1="455.5" x2="838.0" y2="455.5" stroke="#e3dccb"/>
<text x="74.0" y="478.0" font-size="14.5" fill="#3a3226" textLength="46.7" lengthAdjust="spacing">semnat</text>
<text x="306.8" y="478.0" font-size="14.5" fill="#3a3226" textLength="253.7" lengthAdjust="spacing">de cele mai multe ori de o personalitate</text>
<line x1="62.0" y1="488.4" x2="838.0" y2="488.4" stroke="#e3dccb"/>
<text x="74.0" y="510.9" font-size="14.5" fill="#3a3226" textLength="85.1" lengthAdjust="spacing">apare regulat</text>
<text x="306.8" y="510.9" font-size="14.5" fill="#3a3226" textLength="321.8" lengthAdjust="spacing">în aceeași publicație, în aceeași zi a săptămânii etc.</text>
<line x1="62.0" y1="521.2" x2="838.0" y2="521.2" stroke="#e3dccb"/>
<text x="74.0" y="543.7" font-size="14.5" fill="#3a3226" textLength="72.5" lengthAdjust="spacing">unde apare</text>
<text x="306.8" y="543.7" font-size="14.5" fill="#3a3226" textLength="248.2" lengthAdjust="spacing">în reviste de specialitate sau pe bloguri</text>
<line x1="62.0" y1="554.1" x2="838.0" y2="554.1" stroke="#e3dccb"/>
<text x="74.0" y="576.5" font-size="14.5" fill="#3a3226" textLength="38.9" lengthAdjust="spacing">finalul</text>
<text x="306.8" y="576.5" font-size="14.5" fill="#3a3226" textLength="81.9" lengthAdjust="spacing">de obicei, un</text>
<text x="392.6" y="576.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="110.3" lengthAdjust="spacing">punct de vedere</text>
<text x="506.9" y="576.5" font-size="14.5" fill="#3a3226" textLength="188.3" lengthAdjust="spacing">despre valoarea spectacolului</text>
<line x1="62.0" y1="586.9" x2="838.0" y2="586.9" stroke="#e3dccb"/>
<line x1="294.8" y1="391.1" x2="294.8" y2="586.9" stroke="#e3dccb"/>
<rect x="40" y="624.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="647.9" font-size="16" font-weight="700" fill="#ffffff">3. CUM CITESC O CRONICĂ</text>
<rect x="40" y="658.9" width="820" height="129.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="691.9" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="691.9" font-size="15" fill="#3a3226" textLength="49.8" lengthAdjust="spacing">despart</text>
<text x="128.1" y="691.9" font-size="15" fill="#3a3226" font-weight="700" textLength="49.4" lengthAdjust="spacing">faptele</text>
<text x="181.5" y="691.9" font-size="15" fill="#3a3226" textLength="179.6" lengthAdjust="spacing">(ce s-a jucat, cine, unde) de</text>
<text x="365.1" y="691.9" font-size="15" fill="#3a3226" font-weight="700" textLength="40.2" lengthAdjust="spacing">opinii</text>
<text x="409.3" y="691.9" font-size="15" fill="#3a3226" textLength="201.1" lengthAdjust="spacing">(aprecieri, judecăți de valoare);</text>
<text x="62.0" y="716.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="716.6" font-size="15" fill="#3a3226" textLength="28.2" lengthAdjust="spacing">caut</text>
<text x="106.5" y="716.6" font-size="15" fill="#3a3226" font-weight="700" textLength="89.4" lengthAdjust="spacing">punctele tari</text>
<text x="199.9" y="716.6" font-size="15" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="213.9" y="716.6" font-size="15" fill="#3a3226" font-weight="700" textLength="101.5" lengthAdjust="spacing">punctele slabe</text>
<text x="319.5" y="716.6" font-size="15" fill="#3a3226" textLength="253.6" lengthAdjust="spacing">ale spectacolului, în viziunea autorului;</text>
<text x="62.0" y="741.4" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="741.4" font-size="15" fill="#3a3226" textLength="403.8" lengthAdjust="spacing">observ ce interpretează autorul, dincolo de ce e scris în piesă;</text>
<text x="62.0" y="766.1" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="766.1" font-size="15" fill="#3a3226" textLength="58.4" lengthAdjust="spacing">formulez</text>
<text x="136.6" y="766.1" font-size="15" fill="#3a3226" font-weight="700" textLength="89.7" lengthAdjust="spacing">mesajul final</text>
<text x="230.4" y="766.1" font-size="15" fill="#3a3226" textLength="65.8" lengthAdjust="spacing">al cronicii.</text>
<text x="101.9" y="820.1" font-size="11.5" fill="#5b6b83" textLength="696.3" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 65-67, rubrica Repere; textul de bază este cronica „Omenescul personajelor” de Ștefan Popa (Ștefan Aug. Doinaș).</text>
</svg>
