<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 966" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="966" fill="#faf7f0"/>
<text x="193.9" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="513.2" lengthAdjust="spacing">Enunțuri eliptice. Norme de punctuație</text>
<text x="206.8" y="74.4" font-size="14" fill="#5b6b83" textLength="486.4" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a II-a, Lecția 17 · Manual, pp. 90-91 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. ELIPSA</text>
<rect x="40" y="128.6" width="820" height="266.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="43.0" lengthAdjust="spacing">Elipsa</text>
<text x="109.4" y="162.6" font-size="16" fill="#10233f" textLength="280.9" lengthAdjust="spacing">este omiterea unor secvențe care se pot</text>
<text x="394.6" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="156.3" lengthAdjust="spacing">recupera din context</text>
<text x="550.9" y="162.6" font-size="16" fill="#10233f" textLength="276.0" lengthAdjust="spacing">, fiind exprimate anterior. E frecventă în</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="96.5" lengthAdjust="spacing">limba vorbită.</text>
<rect x="62.0" y="204.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="226.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="32.1" lengthAdjust="spacing">Tipul</text>
<text x="229.2" y="226.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="73.4" lengthAdjust="spacing">Ce se omite</text>
<text x="485.3" y="226.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="236.2" x2="838.0" y2="236.2" stroke="#e3dccb"/>
<text x="74.0" y="258.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="93.4" lengthAdjust="spacing">elipsa verbală</text>
<text x="229.2" y="258.6" font-size="14.5" fill="#3a3226" textLength="201.4" lengthAdjust="spacing">predicatul (total sau parțial) sau</text>
<text x="229.2" y="279.7" font-size="14.5" fill="#3a3226" textLength="102.1" lengthAdjust="spacing">verbul copulativ</text>
<text x="485.3" y="258.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="335.2" lengthAdjust="spacing">Eu am fost în parc și tu [ai fost], la film. Regizorul este</text>
<text x="485.3" y="279.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="190.7" lengthAdjust="spacing">talentat, scenograful, ingenios.</text>
<line x1="62.0" y1="290.0" x2="838.0" y2="290.0" stroke="#e3dccb"/>
<text x="74.0" y="312.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="106.9" lengthAdjust="spacing">elipsa nominală</text>
<text x="229.2" y="312.5" font-size="14.5" fill="#3a3226" textLength="165.7" lengthAdjust="spacing">un substantiv, eventual cu</text>
<text x="229.2" y="333.5" font-size="14.5" fill="#3a3226" textLength="104.5" lengthAdjust="spacing">determinanții lui</text>
<text x="485.3" y="312.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="336.4" lengthAdjust="spacing">Eu am vrut o prăjitură cu ciocolată, iar Ioana a vrut [o</text>
<text x="485.3" y="333.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="112.5" lengthAdjust="spacing">prăjitură] cu fistic.</text>
<line x1="62.0" y1="343.9" x2="838.0" y2="343.9" stroke="#e3dccb"/>
<line x1="217.2" y1="204.6" x2="217.2" y2="343.9" stroke="#e3dccb"/>
<line x1="473.3" y1="204.6" x2="473.3" y2="343.9" stroke="#e3dccb"/>
<text x="62.0" y="372.9" font-size="15" fill="#3a3226" textLength="143.7" lengthAdjust="spacing">Omiterea predicatului</text>
<text x="209.7" y="372.9" font-size="15" fill="#3a3226" font-weight="700" textLength="183.8" lengthAdjust="spacing">nu desființează propoziția</text>
<text x="393.5" y="372.9" font-size="15" fill="#3a3226" textLength="175.8" lengthAdjust="spacing">: predicatul se subînțelege.</text>
<rect x="40" y="415.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="438.4" font-size="16" font-weight="700" fill="#ffffff">2. PROPOZIȚIILE FRAGMENTARE</text>
<rect x="40" y="449.4" width="820" height="262.7" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="482.4" font-size="15" fill="#3a3226" textLength="209.2" lengthAdjust="spacing">Sunt o formă de elipsă specifică</text>
<text x="275.3" y="482.4" font-size="15" fill="#3a3226" font-weight="700" textLength="111.9" lengthAdjust="spacing">exprimării orale</text>
<text x="387.2" y="482.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<rect x="62.0" y="500.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="522.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.7" lengthAdjust="spacing">Unde apar</text>
<text x="423.2" y="522.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="532.4" x2="838.0" y2="532.4" stroke="#e3dccb"/>
<text x="74.0" y="554.9" font-size="14.5" fill="#3a3226" textLength="304.6" lengthAdjust="spacing">în structuri coordonate: rămâne doar informația</text>
<text x="74.0" y="576.0" font-size="14.5" fill="#3a3226" textLength="32.5" lengthAdjust="spacing">nouă</text>
<text x="423.2" y="554.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="301.2" lengthAdjust="spacing">Dan preferă spectacolele de teatru, iar Mihai nu.</text>
<line x1="62.0" y1="586.3" x2="838.0" y2="586.3" stroke="#e3dccb"/>
<text x="74.0" y="608.8" font-size="14.5" fill="#3a3226" textLength="323.3" lengthAdjust="spacing">în răspunsuri: rămâne doar cuvântul care răspunde</text>
<text x="74.0" y="629.8" font-size="14.5" fill="#3a3226" textLength="57.3" lengthAdjust="spacing">întrebării</text>
<text x="423.2" y="608.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="254.8" lengthAdjust="spacing">— Când va avea loc premiera? — Vineri.</text>
<line x1="62.0" y1="640.2" x2="838.0" y2="640.2" stroke="#e3dccb"/>
<text x="74.0" y="662.7" font-size="14.5" fill="#3a3226" textLength="258.7" lengthAdjust="spacing">răspunsuri prin adverbe echivalente cu o</text>
<text x="74.0" y="683.7" font-size="14.5" fill="#3a3226" textLength="65.2" lengthAdjust="spacing">propoziție</text>
<text x="423.2" y="662.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="321.7" lengthAdjust="spacing">da, nu, ba da, desigur, bineînțeles, poate, nicidecum</text>
<line x1="62.0" y1="694.1" x2="838.0" y2="694.1" stroke="#e3dccb"/>
<line x1="411.2" y1="500.9" x2="411.2" y2="694.1" stroke="#e3dccb"/>
<rect x="40" y="732.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="755.1" font-size="16" font-weight="700" fill="#ffffff">3. CUM MARCHEZ ELIPSA</text>
<rect x="40" y="766.1" width="820" height="148.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="784.1" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="812.1" font-size="16" fill="#0d9c92" font-weight="700" textLength="51.4" lengthAdjust="spacing">în scris</text>
<text x="78.0" y="835.4" font-size="14.5" fill="#3a3226" textLength="206.3" lengthAdjust="spacing">elipsa verbală se marchează prin</text>
<text x="288.2" y="835.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="47.4" lengthAdjust="spacing">virgulă</text>
<text x="339.6" y="835.4" font-size="14.5" fill="#3a3226" textLength="21.8" lengthAdjust="spacing">sau</text>
<text x="365.2" y="835.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="49.7" lengthAdjust="spacing">linie de</text>
<text x="78.0" y="856.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="40.5" lengthAdjust="spacing">pauză</text>
<text x="78.0" y="880.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="160.9" lengthAdjust="spacing">Ea este cuminte și el – nu.</text>
<rect x="458.0" y="784.1" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="812.1" font-size="16" fill="#6f5ea8" font-weight="700" textLength="73.0" lengthAdjust="spacing">în vorbire</text>
<text x="474.0" y="835.4" font-size="14.5" fill="#3a3226" textLength="180.4" lengthAdjust="spacing">elipsa se marchează printr-o</text>
<text x="658.3" y="835.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="40.5" lengthAdjust="spacing">pauză</text>
<text x="329.5" y="946.2" font-size="11.5" fill="#5b6b83" textLength="240.9" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 90-91, rubricile Repere.</text>
</svg>
