<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#10233f">Construcțiile incidente</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II · lecția 14 · comunicare suplimentară inserată într-un enunț</text>

  <rect x="55" y="80" width="790" height="66" rx="14" fill="none" stroke="#0d9c92" stroke-width="2"/>
  <text x="75" y="104" font-size="13" font-weight="700" fill="#10233f">Ce este</text>
  <text font-size="11.5" fill="#3a3226"><tspan x="75" y="126">o comunicare suplimentară de care enunțul nu este legat sintactic și care nu este esențială pentru</tspan><tspan x="75" y="142">înțelegerea mesajului; se desparte prin virgulă, linii de pauză sau paranteze</tspan></text>

  <rect x="55" y="162" width="390" height="130" rx="14" fill="none" stroke="#6f5ea8" stroke-width="2"/>
  <text x="75" y="186" font-size="13" font-weight="700" fill="#10233f">După întindere</text>
  <text font-size="11" fill="#3a3226"><tspan x="75" y="208">• cuvinte: Vai, nu pot să cred!</tspan><tspan x="75" y="228">• grupuri de cuvinte: de treabă femeie</tspan><tspan x="75" y="248">• propoziții: Dumnezeu să-l ierte</tspan><tspan x="75" y="268">• fraze: le-a șoptit regizorul, înainte să plece</tspan></text>

  <rect x="465" y="162" width="380" height="130" rx="14" fill="none" stroke="#0d9c92" stroke-width="2"/>
  <text x="485" y="186" font-size="13" font-weight="700" fill="#10233f">Ce cuprind</text>
  <text font-size="11" fill="#3a3226"><tspan x="485" y="208">formulele de adresare (Ana, nu uita!)</tspan><tspan x="485" y="226">grupul verbal al contextului (a întrebat Ana)</tspan><tspan x="485" y="244">adverbe de necesitate, probabilitate,</tspan><tspan x="485" y="260">aproximare (probabil, fără îndoială)</tspan><tspan x="485" y="278">stări, sentimente, automatisme verbale</tspan></text>

  <text x="450" y="336" text-anchor="middle" font-size="11.5" fill="#3a3226">Frecvente în comunicarea populară și familiară.</text>
  <text x="450" y="362" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 84-85</text>
</svg>
