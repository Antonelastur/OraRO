<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 970" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="970" fill="#faf7f0"/>
<text x="205.4" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="490.0" lengthAdjust="spacing">Timpul, spațiul, acțiunea, personajele</text>
<text x="210.6" y="74.4" font-size="14" fill="#5b6b83" textLength="478.8" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a II-a, Lecția 3 · Manual, pp. 60-61 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TIMPUL ȘI SPAȚIUL ÎN TEATRU</text>
<rect x="40" y="128.6" width="820" height="154.3" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="31.6" fill="#efeaf8"/>

<text x="213.7" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="105.4" lengthAdjust="spacing">Al reprezentației</text>
<text x="531.8" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.5" lengthAdjust="spacing">Al ficțiunii</text>
<line x1="62.0" y1="178.2" x2="838.0" y2="178.2" stroke="#e3dccb"/>
<text x="74.0" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="45.0" lengthAdjust="spacing">timpul</text>
<text x="213.7" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="45.0" lengthAdjust="spacing">durata</text>
<text x="258.6" y="200.7" font-size="14.5" fill="#3a3226" textLength="129.8" lengthAdjust="spacing">: cât ține spectacolul</text>
<text x="531.8" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="70.8" lengthAdjust="spacing">momentul</text>
<text x="602.6" y="200.7" font-size="14.5" fill="#3a3226" textLength="179.2" lengthAdjust="spacing">: când se petrec întâmplările</text>
<line x1="62.0" y1="211.0" x2="838.0" y2="211.0" stroke="#e3dccb"/>
<text x="74.0" y="233.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="45.8" lengthAdjust="spacing">spațiul</text>
<text x="213.7" y="233.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="89.5" lengthAdjust="spacing">spațiul-scenă</text>
<text x="531.8" y="233.5" font-size="14.5" fill="#3a3226" textLength="286.8" lengthAdjust="spacing">spațiul imaginat de spectator ca un fragment</text>
<text x="531.8" y="254.5" font-size="14.5" fill="#3a3226" textLength="51.8" lengthAdjust="spacing">de lume</text>
<line x1="62.0" y1="264.9" x2="838.0" y2="264.9" stroke="#e3dccb"/>
<line x1="201.7" y1="146.6" x2="201.7" y2="264.9" stroke="#e3dccb"/>
<line x1="519.8" y1="146.6" x2="519.8" y2="264.9" stroke="#e3dccb"/>
<rect x="40" y="302.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="325.9" font-size="16" font-weight="700" fill="#ffffff">2. ACȚIUNEA ȘI CONFLICTUL</text>
<rect x="40" y="336.9" width="820" height="123.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="369.9" font-size="15" fill="#3a3226" font-weight="700" textLength="137.1" lengthAdjust="spacing">Acțiunea dramatică</text>
<text x="203.2" y="369.9" font-size="15" fill="#3a3226" textLength="538.9" lengthAdjust="spacing">este succesiunea de evenimente prezentate sau povestite pe scenă, care duc de la</text>
<text x="746.1" y="369.9" font-size="15" fill="#3a3226" font-weight="700" textLength="52.0" lengthAdjust="spacing">situația</text>
<text x="62.0" y="391.6" font-size="15" fill="#3a3226" font-weight="700" textLength="48.0" lengthAdjust="spacing">inițială</text>
<text x="114.0" y="391.6" font-size="15" fill="#3a3226" textLength="11.2" lengthAdjust="spacing">la</text>
<text x="129.3" y="391.6" font-size="15" fill="#3a3226" font-weight="700" textLength="95.7" lengthAdjust="spacing">situația finală</text>
<text x="225.1" y="391.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="416.4" font-size="15" fill="#3a3226" font-weight="700" textLength="134.8" lengthAdjust="spacing">Conflictul dramatic</text>
<text x="200.9" y="416.4" font-size="15" fill="#3a3226" textLength="607.6" lengthAdjust="spacing">este înfruntarea dintre personaje, idei, situații diferite, cauzată de interese sau de sentimente</text>
<text x="62.0" y="438.1" font-size="15" fill="#3a3226" textLength="153.3" lengthAdjust="spacing">opuse. Este un element</text>
<text x="219.3" y="438.1" font-size="15" fill="#3a3226" font-weight="700" textLength="90.6" lengthAdjust="spacing">fundamental</text>
<text x="314.0" y="438.1" font-size="15" fill="#3a3226" textLength="135.9" lengthAdjust="spacing">al acțiunii dramatice.</text>
<rect x="40" y="480.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="503.6" font-size="16" font-weight="700" fill="#ffffff">3. PERSONAJUL DRAMATIC</text>
<rect x="40" y="514.6" width="820" height="102.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="547.6" font-size="15" fill="#3a3226" textLength="168.1" lengthAdjust="spacing">Personajul dramatic are o</text>
<text x="234.2" y="547.6" font-size="15" fill="#3a3226" font-weight="700" textLength="90.6" lengthAdjust="spacing">dublă natură</text>
<text x="324.8" y="547.6" font-size="15" fill="#3a3226" textLength="84.4" lengthAdjust="spacing">: este o ființă</text>
<text x="413.3" y="547.6" font-size="15" fill="#3a3226" font-weight="700" textLength="65.8" lengthAdjust="spacing">ficțională</text>
<text x="479.1" y="547.6" font-size="15" fill="#3a3226" textLength="355.0" lengthAdjust="spacing">, creată de autor, întruchipată pe scenă de o persoană</text>
<text x="62.0" y="569.4" font-size="15" fill="#3a3226" textLength="35.2" lengthAdjust="spacing">reală,</text>
<text x="101.3" y="569.4" font-size="15" fill="#3a3226" font-weight="700" textLength="49.6" lengthAdjust="spacing">actorul</text>
<text x="150.9" y="569.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="594.1" font-size="15" fill="#3a3226" textLength="621.7" lengthAdjust="spacing">Ca ființă ficțională, are: un statut social, o vârstă, trăsături fizice, o istorie personală și un nume.</text>
<rect x="40" y="636.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="659.6" font-size="16" font-weight="700" fill="#ffffff">4. MIJLOACELE DE CONSTRUCȚIE A PERSONAJULUI</text>
<rect x="40" y="670.6" width="820" height="248.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="688.6" width="380.0" height="136.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="716.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="152.6" lengthAdjust="spacing">caracterizare directă</text>
<text x="78.0" y="739.9" font-size="14.5" fill="#3a3226" textLength="51.6" lengthAdjust="spacing">de către</text>
<text x="133.5" y="739.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="37.0" lengthAdjust="spacing">autor</text>
<text x="170.5" y="739.9" font-size="14.5" fill="#3a3226" textLength="133.7" lengthAdjust="spacing">, în indicațiile scenice</text>
<text x="78.0" y="763.8" font-size="14.5" fill="#3a3226" textLength="51.6" lengthAdjust="spacing">de către</text>
<text x="133.5" y="763.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="95.8" lengthAdjust="spacing">alte personaje</text>
<text x="78.0" y="787.8" font-size="14.5" fill="#3a3226" textLength="134.6" lengthAdjust="spacing">de personajul însuși (</text>
<text x="212.6" y="787.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="118.3" lengthAdjust="spacing">autocaracterizare</text>
<text x="330.9" y="787.8" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">)</text>
<rect x="458.0" y="688.6" width="380.0" height="136.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="716.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="166.9" lengthAdjust="spacing">caracterizare indirectă</text>
<text x="474.0" y="739.9" font-size="14.5" fill="#3a3226" textLength="201.8" lengthAdjust="spacing">din indicațiile scenice care arată</text>
<text x="679.8" y="739.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="129.5" lengthAdjust="spacing">acțiunile, gesturile,</text>
<text x="474.0" y="760.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="114.8" lengthAdjust="spacing">comportamentul</text>
<text x="474.0" y="784.9" font-size="14.5" fill="#3a3226" textLength="20.3" lengthAdjust="spacing">din</text>
<text x="498.2" y="784.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="156.7" lengthAdjust="spacing">modul în care vorbește</text>
<text x="474.0" y="808.8" font-size="14.5" fill="#3a3226" textLength="20.3" lengthAdjust="spacing">din</text>
<text x="498.2" y="808.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="53.6" lengthAdjust="spacing">replicile</text>
<text x="555.8" y="808.8" font-size="14.5" fill="#3a3226" textLength="140.8" lengthAdjust="spacing">lui, adică din ce spune</text>
<rect x="62.0" y="839.1" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="865.6" font-size="14.5" fill="#10233f" font-weight="700" textLength="79.6" lengthAdjust="spacing">Cum lucrez:</text>
<text x="78.0" y="884.5" font-size="14.5" fill="#3a3226" textLength="588.5" lengthAdjust="spacing">numesc trăsătura, indic mijlocul prin care reiese și citez replica sau indicația scenică potrivită.</text>
<text x="329.5" y="950.3" font-size="11.5" fill="#5b6b83" textLength="240.9" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 60-61, rubricile Repere.</text>
</svg>
