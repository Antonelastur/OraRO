<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Relații culturale constructive. Noi și ceilalți</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II · lecția 7</text>

  <rect x="55" y="84" width="385" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="75" y="108" font-size="14" font-weight="700" fill="#10233f">Comunități multiculturale</text>
  <text font-size="11.5" fill="#3a3226"><tspan x="75" y="132">grupuri din culturi diferite conviețuiesc</tspan><tspan x="75" y="150">în același spațiu social, dar nu își propun</tspan><tspan x="75" y="168">schimburi culturale</tspan><tspan x="75" y="194">exemplu: satul Șiria din memoriile lui</tspan><tspan x="75" y="212">Slavici, unde vecinii de multe etnii trăiau</tspan><tspan x="75" y="230">„alături, nu împreună”</tspan></text>

  <rect x="460" y="84" width="385" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="480" y="108" font-size="14" font-weight="700" fill="#10233f">Comunități interculturale</text>
  <text font-size="11.5" fill="#3a3226"><tspan x="480" y="132">grupuri etnice sau religioase care trăiesc</tspan><tspan x="480" y="150">în același spațiu și interacționează,</tspan><tspan x="480" y="168">respectând valorile, tradițiile și modul</tspan><tspan x="480" y="186">de viață al celuilalt</tspan><tspan x="480" y="212">exemplu: Béla Bartók, cu o creație din</tspan><tspan x="480" y="230">trei surse (maghiară, română, slovacă)</tspan></text>

  <text x="450" y="272" text-anchor="middle" font-size="12" fill="#3a3226">Contactele dintre comunități pot duce la preluarea sau la îmbogățirea reciprocă a obiceiurilor.</text>
  <text x="450" y="300" text-anchor="middle" font-size="12" fill="#3a3226">Bartók spunea că muzica lui, provenind din trei surse, ar putea fi „întruchiparea conceptului de integrare”.</text>
  <text x="450" y="356" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 70-71</text>
</svg>
