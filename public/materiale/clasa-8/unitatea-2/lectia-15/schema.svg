<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="320" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Fraza. Coordonarea</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II</text>

  <g>
    <rect x="60" y="100" width="220" height="60" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="170" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Copiii au citit</text>
  </g>
  <g>
    <rect x="620" y="100" width="220" height="60" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="730" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">au jucat teatru</text>
  </g>
  <rect x="380" y="100" width="140" height="60" rx="12" fill="#f4ede0" stroke="#b8944f" stroke-width="2"/>
  <text x="450" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#10233f">și</text>
  <text x="450" y="146" text-anchor="middle" font-size="10" fill="#5b6b83">conjuncție</text>
  <line x1="280" y1="130" x2="380" y2="130" stroke="#b8944f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="130" x2="620" y2="130" stroke="#b8944f" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b8944f"/>
    </marker>
  </defs>
  <text x="450" y="185" text-anchor="middle" font-size="12" fill="#3a3226">Copiii au citit și au jucat teatru.</text>
  <text x="450" y="203" text-anchor="middle" font-size="11" fill="#5b6b83" font-style="italic">două propoziții principale, de același rang, unite prin conjuncție</text>

  <g>
    <rect x="120" y="230" width="200" height="50" rx="10" fill="#ffffff" stroke="#6f5ea8" stroke-width="1.5"/>
    <text x="220" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#10233f">copulativă</text>
    <text x="220" y="267" text-anchor="middle" font-size="10" fill="#5b6b83">și, nici</text>
  </g>
  <g>
    <rect x="350" y="230" width="200" height="50" rx="10" fill="#ffffff" stroke="#6f5ea8" stroke-width="1.5"/>
    <text x="450" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#10233f">adversativă</text>
    <text x="450" y="267" text-anchor="middle" font-size="10" fill="#5b6b83">dar, însă, iar</text>
  </g>
  <g>
    <rect x="580" y="230" width="220" height="50" rx="10" fill="#ffffff" stroke="#6f5ea8" stroke-width="1.5"/>
    <text x="690" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#10233f">disjunctivă / concluzivă</text>
    <text x="690" y="267" text-anchor="middle" font-size="10" fill="#5b6b83">sau, ori / deci, așadar</text>
  </g>

  <text x="450" y="305" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 86-87</text>
</svg>
