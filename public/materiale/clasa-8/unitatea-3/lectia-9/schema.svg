  <rect x="36" y="344" width="888" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="58" y="369" font-size="13" font-weight="700" fill="#10233f">Regula fără de care nu convingi</text>
  <text x="58" y="389" font-size="12" fill="#3d4a5f">orice argument are nevoie de exemplul lui. Un argument fără exemplu rămâne o simplă afirmație, ușor de contrazis.</text>
