  <rect x="560" y="266" width="400" height="60" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2.5"/>
  <text x="760" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">EXEMPLUL 2</text>
  <text x="760" y="314" text-anchor="middle" font-size="12" fill="#3d4a5f">de exemplu..., cum ar fi...</text>
