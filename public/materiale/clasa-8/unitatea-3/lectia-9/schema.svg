  <text x="300" y="230" text-anchor="middle" font-size="12" fill="#3d4a5f">pentru că..., deoarece...</text>
  <path d="M300 244 L300 262" stroke="#b8944f" stroke-width="3"/>
  <rect x="100" y="266" width="400" height="60" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2.5"/>
  <text x="300" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">EXEMPLUL 1</text>
  <text x="300" y="314" text-anchor="middle" font-size="12" fill="#3d4a5f">de exemplu..., cum ar fi...</text>
  <rect x="560" y="182" width="400" height="60" rx="14" fill="#ffffff" stroke="#a1417e" stroke-width="2.5"/>
  <text x="760" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#a1417e">ARGUMENTUL 2</text>
  <text x="760" y="230" text-anchor="middle" font-size="12" fill="#3d4a5f">pentru că..., deoarece...</text>
