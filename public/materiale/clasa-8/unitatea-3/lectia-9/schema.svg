  <text x="480" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 9 · Textul argumentativ, repere</text>
  <rect x="240" y="98" width="480" height="60" rx="14" fill="#3b5fa8"/>
  <text x="480" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">TEZA</text>
  <text x="480" y="146" text-anchor="middle" font-size="12.5" fill="#ffffff">ce susțin, într-o singură propoziție</text>
  <path d="M480 160 L480 178" stroke="#b8944f" stroke-width="3"/>
  <rect x="100" y="182" width="400" height="60" rx="14" fill="#ffffff" stroke="#a1417e" stroke-width="2.5"/>
