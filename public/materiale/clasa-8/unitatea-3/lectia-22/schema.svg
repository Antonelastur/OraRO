<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 951" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="951" fill="#faf7f0"/>
<text x="114.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="672.3" lengthAdjust="spacing">Recapitulare: lumea ficțională și structurile textului</text>
<text x="163.5" y="74.4" font-size="14" fill="#5b6b83" textLength="573.0" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a III-a, Lecția 22 · Manual, pp. 101-111 și 128-129 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. LUMEA FICȚIONALĂ</text>
<rect x="40" y="128.6" width="820" height="80.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="118.5" lengthAdjust="spacing">Ficțiunea literară</text>
<text x="192.7" y="161.6" font-size="15" fill="#3a3226" textLength="221.8" lengthAdjust="spacing">: o lume inventată, construită prin</text>
<text x="418.6" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="43.8" lengthAdjust="spacing">limbaj</text>
<text x="462.4" y="161.6" font-size="15" fill="#3a3226" textLength="110.1" lengthAdjust="spacing">; cititorul face un</text>
<text x="576.5" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="30.4" lengthAdjust="spacing">pact</text>
<text x="611.0" y="161.6" font-size="15" fill="#3a3226" textLength="177.9" lengthAdjust="spacing">și acceptă lumea inventată.</text>
<text x="62.0" y="186.3" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="186.3" font-size="15" fill="#3a3226" textLength="728.2" lengthAdjust="spacing">Limbajul creează lumea: alegerea cuvintelor, enunțurile, paragrafele, așezarea în pagină, ortografia, punctuația.</text>
<rect x="40" y="228.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="251.8" font-size="16" font-weight="700" fill="#ffffff">2. STRUCTURILE TEXTUALE</text>
<rect x="40" y="262.9" width="820" height="286.3" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="280.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="302.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="59.1" lengthAdjust="spacing">Structura</text>
<text x="229.2" y="302.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="104.5" lengthAdjust="spacing">Întrebarea-cheie</text>
<text x="462.0" y="302.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="45.6" lengthAdjust="spacing">Ce face</text>
<line x1="62.0" y1="312.4" x2="838.0" y2="312.4" stroke="#e3dccb"/>
<text x="74.0" y="334.9" font-size="14.5" fill="#3a3226" textLength="50.9" lengthAdjust="spacing">narativă</text>
<text x="229.2" y="334.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="166.5" lengthAdjust="spacing">cine? ce face? când? unde?</text>
<text x="462.0" y="334.9" font-size="14.5" fill="#3a3226" textLength="234.9" lengthAdjust="spacing">prezintă întâmplări, raportate la timp</text>
<line x1="62.0" y1="345.3" x2="838.0" y2="345.3" stroke="#e3dccb"/>
<text x="74.0" y="367.8" font-size="14.5" fill="#3a3226" textLength="68.7" lengthAdjust="spacing">descriptivă</text>
<text x="229.2" y="367.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="175.2" lengthAdjust="spacing">cum arată? ce trăsături are?</text>
<text x="462.0" y="367.8" font-size="14.5" fill="#3a3226" textLength="282.0" lengthAdjust="spacing">prezintă personaje, peisaje, obiecte în spațiu</text>
<line x1="62.0" y1="378.1" x2="838.0" y2="378.1" stroke="#e3dccb"/>
<text x="74.0" y="400.6" font-size="14.5" fill="#3a3226" textLength="59.7" lengthAdjust="spacing">dialogată</text>
<text x="229.2" y="400.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="156.3" lengthAdjust="spacing">cine vorbește? despre ce?</text>
<text x="462.0" y="400.6" font-size="14.5" fill="#3a3226" textLength="165.3" lengthAdjust="spacing">redă replicile personajelor</text>
<line x1="62.0" y1="411.0" x2="838.0" y2="411.0" stroke="#e3dccb"/>
<text x="74.0" y="433.5" font-size="14.5" fill="#3a3226" textLength="66.6" lengthAdjust="spacing">explicativă</text>
<text x="229.2" y="433.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="97.3" lengthAdjust="spacing">cum se explică?</text>
<text x="462.0" y="433.5" font-size="14.5" fill="#3a3226" textLength="343.1" lengthAdjust="spacing">lămurește acțiuni, comportamente, elemente ale lumii</text>
<text x="462.0" y="454.5" font-size="14.5" fill="#3a3226" textLength="58.3" lengthAdjust="spacing">ficționale</text>
<line x1="62.0" y1="464.8" x2="838.0" y2="464.8" stroke="#e3dccb"/>
<text x="74.0" y="487.3" font-size="14.5" fill="#3a3226" textLength="92.6" lengthAdjust="spacing">argumentativă</text>
<text x="229.2" y="487.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="38.6" lengthAdjust="spacing">de ce?</text>
<text x="462.0" y="487.3" font-size="14.5" fill="#3a3226" textLength="336.8" lengthAdjust="spacing">susține un punct de vedere cu argumente și exemple</text>
<line x1="62.0" y1="497.7" x2="838.0" y2="497.7" stroke="#e3dccb"/>
<line x1="217.2" y1="280.9" x2="217.2" y2="497.7" stroke="#e3dccb"/>
<line x1="450.0" y1="280.9" x2="450.0" y2="497.7" stroke="#e3dccb"/>
<text x="62.0" y="526.7" font-size="15" fill="#3a3226" textLength="330.1" lengthAdjust="spacing">Sensul global al textului depinde de structura care</text>
<text x="396.2" y="526.7" font-size="15" fill="#3a3226" font-weight="700" textLength="77.1" lengthAdjust="spacing">predomină</text>
<text x="473.3" y="526.7" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="569.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="592.2" font-size="16" font-weight="700" fill="#ffffff">3. TEXTE DUPĂ FORMAT</text>
<rect x="40" y="603.2" width="820" height="55.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="636.2" font-size="15" fill="#3a3226" font-weight="700" textLength="62.0" lengthAdjust="spacing">continue</text>
<text x="128.0" y="636.2" font-size="15" fill="#3a3226" textLength="79.9" lengthAdjust="spacing">(paragrafe) ·</text>
<text x="212.0" y="636.2" font-size="15" fill="#3a3226" font-weight="700" textLength="82.0" lengthAdjust="spacing">discontinue</text>
<text x="298.1" y="636.2" font-size="15" fill="#3a3226" textLength="277.1" lengthAdjust="spacing">(tabele, hărți, diagrame; lectură neliniară) ·</text>
<text x="579.2" y="636.2" font-size="15" fill="#3a3226" font-weight="700" textLength="40.2" lengthAdjust="spacing">mixte</text>
<text x="623.4" y="636.2" font-size="15" fill="#3a3226" textLength="100.9" lengthAdjust="spacing">(text + imagini)</text>
<rect x="40" y="678.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="701.7" font-size="16" font-weight="700" fill="#ffffff">4. TEXTUL ARGUMENTATIV</text>
<rect x="40" y="712.7" width="820" height="187.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="730.7" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="752.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="40.8" lengthAdjust="spacing">Partea</text>
<text x="213.7" y="752.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="49.4" lengthAdjust="spacing">Conține</text>
<text x="524.1" y="752.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="61.3" lengthAdjust="spacing">Conectori</text>
<line x1="62.0" y1="762.2" x2="838.0" y2="762.2" stroke="#e3dccb"/>
<text x="74.0" y="784.7" font-size="14.5" fill="#3a3226" textLength="73.9" lengthAdjust="spacing">introducere</text>
<text x="213.7" y="784.7" font-size="14.5" fill="#3a3226" textLength="114.1" lengthAdjust="spacing">teza / poziția mea</text>
<text x="524.1" y="784.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="203.4" lengthAdjust="spacing">consider că, părerea mea este că</text>
<line x1="62.0" y1="795.1" x2="838.0" y2="795.1" stroke="#e3dccb"/>
<text x="74.0" y="817.6" font-size="14.5" fill="#3a3226" textLength="46.4" lengthAdjust="spacing">cuprins</text>
<text x="213.7" y="817.6" font-size="14.5" fill="#3a3226" textLength="249.0" lengthAdjust="spacing">argumente, contraargumente, exemple</text>
<text x="524.1" y="817.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="297.2" lengthAdjust="spacing">pentru că, deoarece; totuși, deși; de exemplu, de</text>
<text x="524.1" y="838.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="31.0" lengthAdjust="spacing">pildă</text>
<line x1="62.0" y1="848.9" x2="838.0" y2="848.9" stroke="#e3dccb"/>
<text x="74.0" y="871.4" font-size="14.5" fill="#3a3226" textLength="57.9" lengthAdjust="spacing">încheiere</text>
<text x="213.7" y="871.4" font-size="14.5" fill="#3a3226" textLength="59.3" lengthAdjust="spacing">concluzia</text>
<text x="524.1" y="871.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="205.2" lengthAdjust="spacing">așadar, în concluzie, prin urmare</text>
<line x1="62.0" y1="881.8" x2="838.0" y2="881.8" stroke="#e3dccb"/>
<line x1="201.7" y1="730.7" x2="201.7" y2="881.8" stroke="#e3dccb"/>
<line x1="512.1" y1="730.7" x2="512.1" y2="881.8" stroke="#e3dccb"/>
<text x="76.4" y="931.3" font-size="11.5" fill="#5b6b83" textLength="747.1" lengthAdjust="spacing">Sursa: Manual Art 8, rubricile Repere din lecțiile 2, 3, 5 și 7; recapitularea de la pp. 128-129 (fragment din „Micul Prinț” de Antoine de Saint-Exupéry).</text>
</svg>
