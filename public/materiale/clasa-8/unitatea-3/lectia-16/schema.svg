<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1087" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1087" fill="#faf7f0"/>
<text x="298.7" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="303.0" lengthAdjust="spacing">Complementul indirect</text>
<text x="215.6" y="74.4" font-size="14" fill="#5b6b83" textLength="468.7" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a III-a, Lecția 16 · Manual, p. 120 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE</text>
<rect x="40" y="128.6" width="820" height="80.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="173.1" lengthAdjust="spacing">Complementul indirect</text>
<text x="239.4" y="162.6" font-size="16" fill="#10233f" textLength="267.4" lengthAdjust="spacing">determină cel mai des un verb și arată</text>
<text x="511.1" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="89.0" lengthAdjust="spacing">beneficiarul</text>
<text x="604.4" y="162.6" font-size="16" fill="#10233f" textLength="175.7" lengthAdjust="spacing">unei acțiuni. Răspunde la</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="72.0" lengthAdjust="spacing">întrebarea</text>
<text x="138.3" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="29.0" lengthAdjust="spacing">cui?</text>
<text x="171.6" y="185.8" font-size="16" fill="#10233f" textLength="79.4" lengthAdjust="spacing">Stă în cazul</text>
<text x="255.3" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="37.9" lengthAdjust="spacing">dativ</text>
<text x="293.2" y="185.8" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<rect x="40" y="228.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="251.6" font-size="16" font-weight="700" fill="#ffffff">2. DE CE DEPINDE</text>
<rect x="40" y="262.6" width="820" height="264.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="280.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="302.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.2" lengthAdjust="spacing">Regentul</text>
<text x="345.6" y="302.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="312.2" x2="838.0" y2="312.2" stroke="#e3dccb"/>
<text x="74.0" y="334.7" font-size="14.5" fill="#3a3226" textLength="155.7" lengthAdjust="spacing">verb la un mod personal</text>
<text x="345.6" y="334.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="94.4" lengthAdjust="spacing">El le povestește</text>
<text x="443.9" y="334.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.6" lengthAdjust="spacing">copiilor</text>
<text x="499.4" y="334.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="83.5" lengthAdjust="spacing">o întâmplare.</text>
<line x1="62.0" y1="345.0" x2="838.0" y2="345.0" stroke="#e3dccb"/>
<text x="74.0" y="367.5" font-size="14.5" fill="#3a3226" textLength="170.4" lengthAdjust="spacing">formă verbală nepersonală</text>
<text x="345.6" y="367.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="239.5" lengthAdjust="spacing">L-am auzit spunându-i ceva la ureche.</text>
<text x="589.1" y="367.5" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">(</text>
<text x="593.4" y="367.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="9.9" lengthAdjust="spacing">-i</text>
<text x="603.3" y="367.5" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">)</text>
<line x1="62.0" y1="377.9" x2="838.0" y2="377.9" stroke="#e3dccb"/>
<text x="74.0" y="400.4" font-size="14.5" fill="#3a3226" textLength="109.8" lengthAdjust="spacing">locuțiune verbală</text>
<text x="345.6" y="400.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="115.6" lengthAdjust="spacing">Ea îi aduce aminte</text>
<text x="465.1" y="400.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.6" lengthAdjust="spacing">lui Vlad</text>
<text x="520.6" y="400.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="92.1" lengthAdjust="spacing">de promisiune.</text>
<line x1="62.0" y1="410.7" x2="838.0" y2="410.7" stroke="#e3dccb"/>
<text x="74.0" y="433.2" font-size="14.5" fill="#3a3226" textLength="49.0" lengthAdjust="spacing">adjectiv</text>
<text x="345.6" y="433.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="124.3" lengthAdjust="spacing">O decizie favorabilă</text>
<text x="473.8" y="433.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="25.2" lengthAdjust="spacing">mie</text>
<text x="499.0" y="433.2" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="443.6" x2="838.0" y2="443.6" stroke="#e3dccb"/>
<text x="74.0" y="466.1" font-size="14.5" fill="#3a3226" textLength="44.1" lengthAdjust="spacing">adverb</text>
<text x="345.6" y="466.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="110.2" lengthAdjust="spacing">A răspuns potrivit</text>
<text x="459.7" y="466.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="78.7" lengthAdjust="spacing">așteptărilor</text>
<text x="538.4" y="466.1" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="476.4" x2="838.0" y2="476.4" stroke="#e3dccb"/>
<text x="74.0" y="498.9" font-size="14.5" fill="#3a3226" textLength="136.9" lengthAdjust="spacing">interjecție predicativă</text>
<text x="345.6" y="498.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="36.0" lengthAdjust="spacing">Bravo</text>
<text x="385.5" y="498.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="33.3" lengthAdjust="spacing">vouă</text>
<text x="418.8" y="498.9" font-size="14.5" fill="#3a3226" textLength="4.1" lengthAdjust="spacing">!</text>
<line x1="62.0" y1="509.2" x2="838.0" y2="509.2" stroke="#e3dccb"/>
<line x1="333.6" y1="280.6" x2="333.6" y2="509.2" stroke="#e3dccb"/>
<rect x="40" y="547.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="570.2" font-size="16" font-weight="700" fill="#ffffff">3. PRIN CE SE EXPRIMĂ</text>
<rect x="40" y="581.2" width="820" height="223.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="614.2" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="614.2" font-size="15" fill="#3a3226" font-weight="700" textLength="81.0" lengthAdjust="spacing">substantive</text>
<text x="155.2" y="614.2" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="162.5" y="614.2" font-size="15" fill="#10233f" font-style="italic" textLength="172.3" lengthAdjust="spacing">Le spun colegilor adevărul.</text>
<text x="62.0" y="639.0" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="639.0" font-size="15" fill="#3a3226" font-weight="700" textLength="64.7" lengthAdjust="spacing">pronume</text>
<text x="142.9" y="639.0" font-size="15" fill="#3a3226" textLength="553.0" lengthAdjust="spacing">(personal, de politețe, posesiv, demonstrativ, nehotărât, interogativ, relativ, negativ):</text>
<text x="699.9" y="639.0" font-size="15" fill="#10233f" font-style="italic" textLength="104.8" lengthAdjust="spacing">I-am dat atenție</text>
<text x="74.2" y="660.8" font-size="15" fill="#10233f" font-style="italic" textLength="59.5" lengthAdjust="spacing">fiecăruia.</text>
<text x="62.0" y="685.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="685.5" font-size="15" fill="#3a3226" font-weight="700" textLength="66.6" lengthAdjust="spacing">numerale</text>
<text x="144.9" y="685.5" font-size="15" fill="#3a3226" textLength="159.1" lengthAdjust="spacing">cu valoare pronominală:</text>
<text x="308.0" y="685.5" font-size="15" fill="#10233f" font-style="italic" textLength="165.3" lengthAdjust="spacing">I-a cerut primului un sfat.</text>
<rect x="62.0" y="704.0" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="704.0" width="6" height="82.7" rx="3" fill="#b4432c"/><text x="84.0" y="730.5" font-size="14.5" fill="#b4432c" font-weight="700" textLength="86.1" lengthAdjust="spacing">la + nominal</text>
<text x="84.0" y="749.4" font-size="14.5" fill="#3a3226" textLength="74.8" lengthAdjust="spacing">se folosește</text>
<text x="162.7" y="749.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="31.5" lengthAdjust="spacing">doar</text>
<text x="198.1" y="749.4" font-size="14.5" fill="#3a3226" textLength="290.9" lengthAdjust="spacing">când cuvântul nu are formă de dativ: după un</text>
<text x="492.9" y="749.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="56.5" lengthAdjust="spacing">numeral</text>
<text x="553.4" y="749.4" font-size="14.5" fill="#3a3226" textLength="42.2" lengthAdjust="spacing">sau un</text>
<text x="599.5" y="749.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="120.6" lengthAdjust="spacing">adjectiv invariabil</text>
<text x="724.0" y="749.4" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">(</text>
<text x="728.4" y="749.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="61.2" lengthAdjust="spacing">Am trimis</text>
<text x="84.0" y="770.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="317.1" lengthAdjust="spacing">mesajul la trei / la al treilea / la ditamai profesorul</text>
<text x="401.1" y="770.4" font-size="14.5" fill="#3a3226" textLength="109.8" lengthAdjust="spacing">). În rest, folosesc</text>
<text x="514.8" y="770.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="47.3" lengthAdjust="spacing">dativul</text>
<text x="562.1" y="770.4" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<rect x="40" y="824.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="847.7" font-size="16" font-weight="700" fill="#ffffff">4. DUBLAREA ȘI MODELUL</text>
<rect x="40" y="858.7" width="820" height="177.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="891.7" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="891.7" font-size="15" fill="#3a3226" textLength="50.1" lengthAdjust="spacing">Poate fi</text>
<text x="128.3" y="891.7" font-size="15" fill="#3a3226" font-weight="700" textLength="61.9" lengthAdjust="spacing">anticipat</text>
<text x="194.3" y="891.7" font-size="15" fill="#3a3226" textLength="22.5" lengthAdjust="spacing">sau</text>
<text x="220.9" y="891.7" font-size="15" fill="#3a3226" font-weight="700" textLength="41.4" lengthAdjust="spacing">reluat</text>
<text x="266.3" y="891.7" font-size="15" fill="#3a3226" textLength="96.7" lengthAdjust="spacing">printr-un clitic:</text>
<text x="367.1" y="891.7" font-size="15" fill="#10233f" font-style="italic" textLength="172.5" lengthAdjust="spacing">I-am spus Soniei un secret.</text>
<text x="62.0" y="916.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="916.5" font-size="15" fill="#3a3226" textLength="198.3" lengthAdjust="spacing">Uneori dublarea nu e posibilă:</text>
<text x="276.5" y="916.5" font-size="15" fill="#10233f" font-style="italic" textLength="371.6" lengthAdjust="spacing">Consumul de zahăr dăunează sănătății. Bravo sportivilor!</text>
<rect x="62.0" y="935.0" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="961.5" font-size="14.5" fill="#10233f" font-weight="700" textLength="119.9" lengthAdjust="spacing">Model de analiză:</text>
<text x="78.0" y="980.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="730.3" lengthAdjust="spacing">„i” – complement indirect, exprimat prin pronume personal, persoana a III-a, numărul singular, genul masculin, cazul</text>
<text x="78.0" y="1001.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="166.9" lengthAdjust="spacing">dativ, formă neaccentuată.</text>
<text x="286.6" y="1067.2" font-size="11.5" fill="#5b6b83" textLength="326.8" lengthAdjust="spacing">Sursa: Manual Art 8, p. 120, rubrica Repere și modelul de analiză.</text>
</svg>
