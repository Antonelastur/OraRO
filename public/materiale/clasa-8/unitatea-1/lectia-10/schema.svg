<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="980" height="410" fill="#faf7f0"/>
  <text x="490" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Trei poezii, un secol de schimbare</text>
  <text x="490" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 10 · Compararea textelor</text>
  <rect x="216" y="94" width="236" height="38" rx="12" fill="#3b5fa8"/>
  <text x="334" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Eminescu, O, rămâi...</text>
  <rect x="468" y="94" width="236" height="38" rx="12" fill="#a1417e"/>
  <text x="586" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Blaga, Izvorul nopții</text>
  <rect x="720" y="94" width="236" height="38" rx="12" fill="#1c7f5e"/>
  <text x="838" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Stănescu, Lecția de citire</text>
  <text x="40" y="174" font-size="12.5" font-weight="700" fill="#10233f">Tema</text>
  <rect x="216" y="146" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="334" y="174" text-anchor="middle" font-size="12" fill="#3d4a5f">Frumusețea naturii</text>
  <rect x="468" y="146" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="586" y="174" text-anchor="middle" font-size="12" fill="#3d4a5f">Frumusețea misterului</text>
  <rect x="720" y="146" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="838" y="174" text-anchor="middle" font-size="12" fill="#3d4a5f">Frumusețea limbajului</text>
  <text x="40" y="232" font-size="12.5" font-weight="700" fill="#10233f">Versificația</text>
  <rect x="216" y="204" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="334" y="232" text-anchor="middle" font-size="12" fill="#3d4a5f">rimă, măsură fixă</text>
  <rect x="468" y="204" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="586" y="232" text-anchor="middle" font-size="12" fill="#3d4a5f">vers liber</text>
  <rect x="720" y="204" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="838" y="232" text-anchor="middle" font-size="12" fill="#3d4a5f">vers liber</text>
  <text x="40" y="290" font-size="12.5" font-weight="700" fill="#10233f">Figuri dominante</text>
  <rect x="216" y="262" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="334" y="290" text-anchor="middle" font-size="12" fill="#3d4a5f">epitet, personificare</text>
  <rect x="468" y="262" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="586" y="290" text-anchor="middle" font-size="12" fill="#3d4a5f">metaforă, hiperbolă</text>
  <rect x="720" y="262" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="838" y="290" text-anchor="middle" font-size="12" fill="#3d4a5f">imagini neobișnuite</text>
  <text x="40" y="348" font-size="12.5" font-weight="700" fill="#10233f">Epoca</text>
  <rect x="216" y="320" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="334" y="348" text-anchor="middle" font-size="12" fill="#3d4a5f">secolul al XIX-lea</text>
  <rect x="468" y="320" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="586" y="348" text-anchor="middle" font-size="12" fill="#3d4a5f">începutul sec. XX</text>
  <rect x="720" y="320" width="236" height="46" rx="10" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="838" y="348" text-anchor="middle" font-size="12" fill="#3d4a5f">a doua jumătate a sec. XX</text>
  <rect x="40" y="386" width="900" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="62" y="411" font-size="13" font-weight="700" fill="#10233f">Ce rămâne la fel</text>
  <text x="62" y="431" font-size="12" fill="#3d4a5f">tema frumuseții. Ce se schimbă: mijloacele prin care poetul o spune.</text>
</svg>
