<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="960" height="400" fill="#faf7f0"/>
  <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Diftong, triftong, hiat</text>
  <text x="480" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 19 · Fonetica</text>
  <rect x="36" y="100" width="290" height="168" rx="16" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="56" y="130" font-size="14" font-weight="700" fill="#10233f">Diftong</text>
  <text x="56" y="156" font-size="12" fill="#3d4a5f">O vocală și o semivocală,</text>
  <text x="56" y="176" font-size="12" fill="#3d4a5f">în ACEEAȘI silabă.</text>
  <text x="56" y="196" font-size="12" fill="#3d4a5f"></text>
  <text x="56" y="216" font-size="12" fill="#3d4a5f">mai, seară, ploaie</text>
  <text x="56" y="236" font-size="12" fill="#3d4a5f"></text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">2 vocale, 1 silabă</text>
  <rect x="340" y="100" width="290" height="168" rx="16" fill="#ffffff" stroke="#a1417e" stroke-width="2.5"/>
  <text x="360" y="130" font-size="14" font-weight="700" fill="#10233f">Triftong</text>
  <text x="360" y="156" font-size="12" fill="#3d4a5f">O vocală și două semivocale,</text>
  <text x="360" y="176" font-size="12" fill="#3d4a5f">în ACEEAȘI silabă.</text>
  <text x="360" y="196" font-size="12" fill="#3d4a5f"></text>
  <text x="360" y="216" font-size="12" fill="#3d4a5f">aripioară, leoaică</text>
  <text x="360" y="236" font-size="12" fill="#3d4a5f"></text>
  <text x="360" y="256" font-size="12" fill="#3d4a5f">3 vocale, 1 silabă</text>
  <rect x="644" y="100" width="280" height="168" rx="16" fill="#ffffff" stroke="#1c7f5e" stroke-width="2.5"/>
  <text x="664" y="130" font-size="14" font-weight="700" fill="#10233f">Hiat</text>
  <text x="664" y="156" font-size="12" fill="#3d4a5f">Două vocale alăturate, în</text>
  <text x="664" y="176" font-size="12" fill="#3d4a5f">SILABE DIFERITE.</text>
  <text x="664" y="196" font-size="12" fill="#3d4a5f"></text>
  <text x="664" y="216" font-size="12" fill="#3d4a5f">a-er, po-et, fi-in-ță</text>
  <text x="664" y="236" font-size="12" fill="#3d4a5f"></text>
  <text x="664" y="256" font-size="12" fill="#3d4a5f">2 vocale, 2 silabe</text>
  <rect x="36" y="288" width="888" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="58" y="313" font-size="13" font-weight="700" fill="#10233f">Proba sigură</text>
  <text x="58" y="333" font-size="12" fill="#3d4a5f">desparte cuvântul în silabe. Dacă vocalele rămân împreună, e diftong sau triftong. Dacă se despart, e hiat.</text>
</svg>
