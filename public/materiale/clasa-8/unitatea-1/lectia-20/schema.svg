<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 927" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="927" fill="#faf7f0"/>
<text x="182.0" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="537.0" lengthAdjust="spacing">Organizarea coerentă a textului. Anafora</text>
<text x="220.5" y="74.4" font-size="14" fill="#5b6b83" textLength="458.9" lengthAdjust="spacing">Clasa a VIII-a · Unitatea I, Lecția 20 · Manual, pp. 42-43 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. COERENȚA</text>
<rect x="40" y="128.6" width="820" height="302.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="68.0" lengthAdjust="spacing">Coerența</text>
<text x="134.3" y="162.6" font-size="16" fill="#10233f" textLength="278.9" lengthAdjust="spacing">este ansamblul de trăsături care asigură</text>
<text x="417.5" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="45.0" lengthAdjust="spacing">logica</text>
<text x="466.8" y="162.6" font-size="16" fill="#10233f" textLength="10.6" lengthAdjust="spacing">și</text>
<text x="481.7" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="84.5" lengthAdjust="spacing">înțelegerea</text>
<text x="570.5" y="162.6" font-size="16" fill="#10233f" textLength="65.6" lengthAdjust="spacing">unui text.</text>
<text x="62.0" y="196.4" font-size="15" fill="#3a3226" textLength="132.4" lengthAdjust="spacing">Un text are o ordine</text>
<text x="198.5" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="42.1" lengthAdjust="spacing">logică</text>
<text x="244.7" y="196.4" font-size="15" fill="#3a3226" textLength="238.9" lengthAdjust="spacing">(fiecare secvență se leagă de întreg),</text>
<text x="487.7" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="72.6" lengthAdjust="spacing">temporală</text>
<text x="564.3" y="196.4" font-size="15" fill="#3a3226" textLength="246.0" lengthAdjust="spacing">(succesiunea acțiunilor, prin timpurile</text>
<text x="62.0" y="218.1" font-size="15" fill="#3a3226" textLength="66.6" lengthAdjust="spacing">verbale) și</text>
<text x="132.6" y="218.1" font-size="15" fill="#3a3226" font-weight="700" textLength="54.4" lengthAdjust="spacing">spațială</text>
<text x="191.1" y="218.1" font-size="15" fill="#3a3226" textLength="212.2" lengthAdjust="spacing">(așezarea enunțurilor în pagină).</text>
<text x="62.0" y="242.9" font-size="15" fill="#3a3226" textLength="217.6" lengthAdjust="spacing">Fiecare enunț poate fi corect (are</text>
<text x="283.7" y="242.9" font-size="15" fill="#3a3226" font-weight="700" textLength="62.2" lengthAdjust="spacing">coeziune</text>
<text x="345.9" y="242.9" font-size="15" fill="#3a3226" textLength="424.3" lengthAdjust="spacing">), dar textul să nu aibă sens, dacă lipsesc legăturile logice (nu are</text>
<text x="62.0" y="264.6" font-size="15" fill="#3a3226" font-weight="700" textLength="61.6" lengthAdjust="spacing">coerență</text>
<text x="123.7" y="264.6" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">).</text>
<rect x="62.0" y="283.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="304.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="43.7" lengthAdjust="spacing">Regula</text>
<text x="306.8" y="304.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="45.9" lengthAdjust="spacing">Ce cere</text>
<line x1="62.0" y1="314.7" x2="838.0" y2="314.7" stroke="#e3dccb"/>
<text x="74.0" y="337.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="83.4" lengthAdjust="spacing">continuității</text>
<text x="306.8" y="337.2" font-size="14.5" fill="#3a3226" textLength="400.1" lengthAdjust="spacing">enunțurile au în comun un minimum de informație, prin reluări</text>
<line x1="62.0" y1="347.6" x2="838.0" y2="347.6" stroke="#e3dccb"/>
<text x="74.0" y="370.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="68.6" lengthAdjust="spacing">progresiei</text>
<text x="306.8" y="370.0" font-size="14.5" fill="#3a3226" textLength="482.6" lengthAdjust="spacing">fiecare enunț aduce o informație nouă; nu repet aceeași idee cu alte cuvinte</text>
<line x1="62.0" y1="380.4" x2="838.0" y2="380.4" stroke="#e3dccb"/>
<text x="74.0" y="402.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="112.1" lengthAdjust="spacing">noncontradicției</text>
<text x="306.8" y="402.9" font-size="14.5" fill="#3a3226" textLength="447.6" lengthAdjust="spacing">fără informații contradictorii; nu schimb persoana sau timpul povestirii</text>
<line x1="62.0" y1="413.2" x2="838.0" y2="413.2" stroke="#e3dccb"/>
<line x1="294.8" y1="283.1" x2="294.8" y2="413.2" stroke="#e3dccb"/>
<rect x="40" y="451.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="474.2" font-size="16" font-weight="700" fill="#ffffff">2. ANAFORA</text>
<rect x="40" y="485.2" width="820" height="390.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="519.2" font-size="16" fill="#10233f" font-weight="700" textLength="60.5" lengthAdjust="spacing">Anafora</text>
<text x="126.8" y="519.2" font-size="16" fill="#10233f" textLength="186.1" lengthAdjust="spacing">este reluarea unui cuvânt (</text>
<text x="312.9" y="519.2" font-size="16" fill="#10233f" font-weight="700" textLength="98.4" lengthAdjust="spacing">antecedentul</text>
<text x="411.3" y="519.2" font-size="16" fill="#10233f" textLength="154.9" lengthAdjust="spacing">) printr-un alt cuvânt (</text>
<text x="566.1" y="519.2" font-size="16" fill="#10233f" font-weight="700" textLength="75.7" lengthAdjust="spacing">anaforicul</text>
<text x="641.8" y="519.2" font-size="16" fill="#10233f" textLength="178.2" lengthAdjust="spacing">), care se referă la aceeași</text>
<text x="62.0" y="542.5" font-size="16" fill="#10233f" textLength="60.6" lengthAdjust="spacing">realitate.</text>
<text x="62.0" y="577.2" font-size="16" fill="#0d9c92" font-style="italic" textLength="27.7" lengthAdjust="spacing">Ana</text>
<text x="94.0" y="577.2" font-size="16" fill="#10233f" font-style="italic" textLength="191.0" lengthAdjust="spacing">merge la cenaclu, pentru că</text>
<text x="289.4" y="577.2" font-size="16" fill="#6f5ea8" font-style="italic" textLength="16.5" lengthAdjust="spacing">ea</text>
<text x="310.2" y="577.2" font-size="16" fill="#10233f" font-style="italic" textLength="79.7" lengthAdjust="spacing">scrie poezii.</text>
<text x="62.0" y="611.0" font-size="15" fill="#3a3226" textLength="104.1" lengthAdjust="spacing">Anafora elimină</text>
<text x="170.2" y="611.0" font-size="15" fill="#3a3226" font-weight="700" textLength="156.7" lengthAdjust="spacing">repetițiile supărătoare</text>
<text x="330.9" y="611.0" font-size="15" fill="#3a3226" textLength="209.4" lengthAdjust="spacing">și asigură continuitatea textului.</text>
<rect x="62.0" y="629.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="651.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="118.9" lengthAdjust="spacing">Anaforicul poate fi</text>
<text x="384.4" y="651.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="661.1" x2="838.0" y2="661.1" stroke="#e3dccb"/>
<text x="74.0" y="683.6" font-size="14.5" fill="#3a3226" textLength="58.7" lengthAdjust="spacing">pronume</text>
<text x="384.4" y="683.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="34.7" lengthAdjust="spacing">Ana...</text>
<text x="423.0" y="683.6" font-size="14.5" fill="#10233f" font-weight="700" font-style="italic" textLength="16.1" lengthAdjust="spacing">ea</text>
<text x="439.1" y="683.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="9.6" lengthAdjust="spacing">...</text>
<line x1="62.0" y1="693.9" x2="838.0" y2="693.9" stroke="#e3dccb"/>
<text x="74.0" y="716.4" font-size="14.5" fill="#3a3226" textLength="207.0" lengthAdjust="spacing">numeral cu valoare pronominală</text>
<text x="384.4" y="716.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="140.9" lengthAdjust="spacing">Am scris câteva poezii.</text>
<text x="529.3" y="716.4" font-size="14.5" fill="#10233f" font-weight="700" font-style="italic" textLength="36.5" lengthAdjust="spacing">Două</text>
<text x="569.7" y="716.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="106.9" lengthAdjust="spacing">au fost publicate.</text>
<line x1="62.0" y1="726.8" x2="838.0" y2="726.8" stroke="#e3dccb"/>
<text x="74.0" y="749.3" font-size="14.5" fill="#3a3226" textLength="44.1" lengthAdjust="spacing">adverb</text>
<text x="384.4" y="749.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="115.0" lengthAdjust="spacing">...la cenaclul școlii.</text>
<text x="503.3" y="749.3" font-size="14.5" fill="#10233f" font-weight="700" font-style="italic" textLength="38.3" lengthAdjust="spacing">Acolo</text>
<text x="541.6" y="749.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="9.6" lengthAdjust="spacing">...</text>
<line x1="62.0" y1="759.6" x2="838.0" y2="759.6" stroke="#e3dccb"/>
<text x="74.0" y="782.1" font-size="14.5" fill="#3a3226" textLength="180.8" lengthAdjust="spacing">substantiv sau grup nominal</text>
<text x="384.4" y="782.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="102.8" lengthAdjust="spacing">Un băiat blond...</text>
<text x="491.1" y="782.1" font-size="14.5" fill="#10233f" font-weight="700" font-style="italic" textLength="53.5" lengthAdjust="spacing">Tânărul</text>
<text x="544.6" y="782.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="9.6" lengthAdjust="spacing">...</text>
<line x1="62.0" y1="792.5" x2="838.0" y2="792.5" stroke="#e3dccb"/>
<text x="74.0" y="815.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="15.7" lengthAdjust="spacing">da</text>
<text x="89.7" y="815.0" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">,</text>
<text x="96.8" y="815.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="16.2" lengthAdjust="spacing">nu</text>
<text x="113.0" y="815.0" font-size="14.5" fill="#3a3226" textLength="179.6" lengthAdjust="spacing">, echivalente cu o propoziție</text>
<text x="384.4" y="815.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="103.7" lengthAdjust="spacing">– Mă însoțești? –</text>
<text x="492.0" y="815.0" font-size="14.5" fill="#10233f" font-weight="700" font-style="italic" textLength="19.4" lengthAdjust="spacing">Da</text>
<text x="511.4" y="815.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="3.2" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="825.4" x2="838.0" y2="825.4" stroke="#e3dccb"/>
<text x="74.0" y="847.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="37.4" lengthAdjust="spacing">a face</text>
<text x="115.3" y="847.8" font-size="14.5" fill="#3a3226" textLength="118.8" lengthAdjust="spacing">+ pronume neutru</text>
<text x="384.4" y="847.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="190.5" lengthAdjust="spacing">Ar fi putut comenta poezia. N-</text>
<text x="574.9" y="847.8" font-size="14.5" fill="#10233f" font-weight="700" font-style="italic" textLength="61.6" lengthAdjust="spacing">a făcut-o</text>
<text x="636.5" y="847.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="3.2" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="858.2" x2="838.0" y2="858.2" stroke="#e3dccb"/>
<line x1="372.4" y1="629.5" x2="372.4" y2="858.2" stroke="#e3dccb"/>
<text x="207.2" y="907.7" font-size="11.5" fill="#5b6b83" textLength="485.5" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 42-43, rubricile Repere. Unele exemple sunt create pentru aceste notițe.</text>
</svg>
