<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="940" height="390" fill="#faf7f0"/>
  <text x="470" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Hiperbola, exagerarea care spune adevărul</text>
  <text x="470" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 6 · Figurile de stil</text>
  <rect x="36" y="100" width="420" height="150" rx="16" fill="#ffffff" stroke="#a1417e" stroke-width="2.5"/>
  <text x="56" y="130" font-size="14" font-weight="700" fill="#10233f">Ce face</text>
  <text x="56" y="156" font-size="12" fill="#3d4a5f">Mărește sau micșorează peste</text>
  <text x="56" y="176" font-size="12" fill="#3d4a5f">măsură o însușire, ca să</text>
  <text x="56" y="196" font-size="12" fill="#3d4a5f">impresioneze cititorul.</text>
  <text x="56" y="216" font-size="12" fill="#3d4a5f"></text>
  <text x="56" y="236" font-size="12" fill="#3d4a5f">Nu minte: exagerează ca să</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">scoată în evidență.</text>
  <rect x="480" y="100" width="424" height="150" rx="16" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="500" y="130" font-size="14" font-weight="700" fill="#10233f">Unde o găsești</text>
  <text x="500" y="156" font-size="12" fill="#3d4a5f">În vorbirea de zi cu zi:</text>
  <text x="500" y="176" font-size="12" fill="#3d4a5f">ți-am spus de un milion de ori.</text>
  <text x="500" y="196" font-size="12" fill="#3d4a5f"></text>
  <text x="500" y="216" font-size="12" fill="#3d4a5f">În literatură, aproape mereu</text>
  <text x="500" y="236" font-size="12" fill="#3d4a5f">combinată cu metafora sau</text>
  <text x="500" y="256" font-size="12" fill="#3d4a5f">cu comparația.</text>
  <rect x="36" y="272" width="868" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="58" y="297" font-size="13" font-weight="700" fill="#10233f">Cum o recunoști</text>
  <text x="58" y="317" font-size="12" fill="#3d4a5f">întreabă-te dacă afirmația e posibilă la propriu. Dacă nu e, și autorul știe asta, e hiperbolă.</text>
  <rect x="36" y="336" width="868" height="56" rx="14" fill="#ffffff" stroke="#e2d9c4" stroke-width="2"/>
  <text x="58" y="361" font-size="13" font-weight="700" fill="#10233f">Atenție la examen</text>
  <text x="58" y="381" font-size="12" fill="#3d4a5f">nu confunda hiperbola cu metafora. Metafora înlocuiește, hiperbola amplifică.</text>
</svg>
