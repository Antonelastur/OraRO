<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="400" fill="#faf7f0"/>
  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#10233f">Împrumuturile</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I · lecția 17 · împrumutul lexical = mijloc extern de îmbogățire a vocabularului</text>

  <g font-size="11" fill="#3a3226">
    <rect x="55" y="80" width="255" height="110" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="182" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#10233f">Cuvinte moștenite</text>
    <text x="182" y="126" text-anchor="middle">din latina populară;</text>
    <text x="182" y="144" text-anchor="middle">continuitate între formele</text>
    <text x="182" y="162" text-anchor="middle">latine și cele actuale</text>
    <text x="182" y="180" text-anchor="middle">an, a crede, drept, el, jos</text>

    <rect x="322" y="80" width="255" height="110" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#10233f">Formate în limbă</text>
    <text x="450" y="126" text-anchor="middle">prin derivare, compunere</text>
    <text x="450" y="144" text-anchor="middle">sau conversiune</text>
    <text x="450" y="168" text-anchor="middle">străvechi, despre, ars</text>

    <rect x="589" y="80" width="256" height="110" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="717" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#10233f">Împrumutate</text>
    <text x="717" y="126" text-anchor="middle">luate din alte limbi,</text>
    <text x="717" y="144" text-anchor="middle">pe cale directă sau indirectă</text>
    <text x="717" y="168" text-anchor="middle">funcționar, inițial, a remarca</text>
  </g>

  <rect x="55" y="206" width="790" height="106" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="75" y="228" font-size="12.5" font-weight="700" fill="#10233f">Vechi și noi. Neologismele</text>
  <text font-size="11" fill="#3a3226"><tspan x="75" y="250">împrumuturi vechi: din slavă (prieten), turcă (iaurt), greacă (a agonisi), maghiară (oraș)</tspan><tspan x="75" y="268">împrumuturi noi: din franceză (hiperbolă), engleză (weekend), italiană (pizza), germană (rucsac), latină (fabulă)</tspan><tspan x="75" y="290">neologismele = împrumuturi recente sau formate cu un component nou; din sec. XIX, din franceză și latină</tspan></text>

  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 36-37</text>
</svg>
