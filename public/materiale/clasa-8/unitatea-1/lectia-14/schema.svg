<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1247" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1247" fill="#faf7f0"/>
<text x="319.9" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="260.4" lengthAdjust="spacing">Categorii semantice</text>
<text x="220.5" y="74.4" font-size="14" fill="#5b6b83" textLength="458.9" lengthAdjust="spacing">Clasa a VIII-a · Unitatea I, Lecția 14 · Manual, pp. 28-30 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CONTEXTUL</text>
<rect x="40" y="128.6" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="224.5" lengthAdjust="spacing">Sensul unui cuvânt se stabilește în</text>
<text x="290.6" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="53.5" lengthAdjust="spacing">context</text>
<text x="344.1" y="161.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="351.5" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="43.8" lengthAdjust="spacing">verbal</text>
<text x="399.3" y="161.6" font-size="15" fill="#3a3226" textLength="240.1" lengthAdjust="spacing">(îmbinare, propoziție, frază, text) sau</text>
<text x="643.5" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="74.5" lengthAdjust="spacing">situațional</text>
<text x="722.1" y="161.6" font-size="15" fill="#3a3226" textLength="112.9" lengthAdjust="spacing">(o situație în care</text>
<text x="62.0" y="183.3" font-size="15" fill="#3a3226" textLength="148.8" lengthAdjust="spacing">apare doar un cuvânt).</text>
<rect x="40" y="225.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="248.8" font-size="16" font-weight="700" fill="#ffffff">2. SINONIMELE ȘI ANTONIMELE</text>
<rect x="40" y="259.9" width="820" height="252.5" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="277.9" width="380.0" height="136.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="305.9" font-size="16" fill="#0d9c92" font-weight="700" textLength="81.8" lengthAdjust="spacing">sinonimele</text>
<text x="78.0" y="329.2" font-size="14.5" fill="#3a3226" textLength="273.5" lengthAdjust="spacing">formă diferită, sens asemănător sau identic</text>
<text x="78.0" y="353.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="52.1" lengthAdjust="spacing">parțiale</text>
<text x="130.1" y="353.1" font-size="14.5" fill="#3a3226" textLength="242.6" lengthAdjust="spacing">: se înlocuiesc doar în unele contexte (</text>
<text x="372.6" y="353.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="34.8" lengthAdjust="spacing">iute –</text>
<text x="78.0" y="374.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="87.9" lengthAdjust="spacing">repede, picant</text>
<text x="165.9" y="374.1" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">)</text>
<text x="78.0" y="398.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="58.4" lengthAdjust="spacing">absolute</text>
<text x="136.4" y="398.0" font-size="14.5" fill="#3a3226" textLength="113.8" lengthAdjust="spacing">: în orice context (</text>
<text x="250.3" y="398.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="91.5" lengthAdjust="spacing">potasiu – kaliu</text>
<text x="341.7" y="398.0" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">)</text>
<rect x="458.0" y="277.9" width="380.0" height="136.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="305.9" font-size="16" fill="#6f5ea8" font-weight="700" textLength="85.1" lengthAdjust="spacing">antonimele</text>
<text x="474.0" y="329.2" font-size="14.5" fill="#3a3226" textLength="152.0" lengthAdjust="spacing">sensuri diametral opuse</text>
<text x="474.0" y="353.1" font-size="14.5" fill="#3a3226" textLength="151.2" lengthAdjust="spacing">formă complet diferită (</text>
<text x="625.2" y="353.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="84.7" lengthAdjust="spacing">frumos – urât</text>
<text x="709.9" y="353.1" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">)</text>
<text x="474.0" y="377.0" font-size="14.5" fill="#3a3226" textLength="150.9" lengthAdjust="spacing">sau diferență de prefix (</text>
<text x="624.9" y="377.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="162.4" lengthAdjust="spacing">atent – neatent, a face – a</text>
<text x="474.0" y="398.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="46.4" lengthAdjust="spacing">desface</text>
<text x="520.4" y="398.0" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">)</text>
<text x="62.0" y="443.4" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="443.4" font-size="15" fill="#3a3226" textLength="180.4" lengthAdjust="spacing">Sunt perechi de cuvinte din</text>
<text x="258.7" y="443.4" font-size="15" fill="#3a3226" font-weight="700" textLength="168.6" lengthAdjust="spacing">aceeași parte de vorbire</text>
<text x="427.3" y="443.4" font-size="15" fill="#3a3226" textLength="360.3" lengthAdjust="spacing">; relația poate fi între două cuvinte, între un cuvânt și o</text>
<text x="74.2" y="465.1" font-size="15" fill="#3a3226" textLength="210.6" lengthAdjust="spacing">expresie sau între două expresii.</text>
<text x="62.0" y="489.9" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="489.9" font-size="15" fill="#3a3226" textLength="421.2" lengthAdjust="spacing">La un cuvânt polisemantic, sinonimele și antonimele se stabilesc</text>
<text x="499.4" y="489.9" font-size="15" fill="#3a3226" font-weight="700" textLength="133.8" lengthAdjust="spacing">pentru fiecare sens</text>
<text x="633.2" y="489.9" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="532.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="555.4" font-size="16" font-weight="700" fill="#ffffff">3. OMONIMELE ȘI CUVINTELE POLISEMANTICE</text>
<rect x="40" y="566.4" width="820" height="299.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="599.4" font-size="15" fill="#3a3226" font-weight="700" textLength="81.9" lengthAdjust="spacing">Omonimele</text>
<text x="148.0" y="599.4" font-size="15" fill="#3a3226" textLength="175.7" lengthAdjust="spacing">au aceeași formă și sensuri</text>
<text x="327.7" y="599.4" font-size="15" fill="#3a3226" font-weight="700" textLength="113.2" lengthAdjust="spacing">complet diferite</text>
<text x="440.9" y="599.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<rect x="62.0" y="617.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="639.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="32.1" lengthAdjust="spacing">Tipul</text>
<text x="423.2" y="639.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="649.4" x2="838.0" y2="649.4" stroke="#e3dccb"/>
<text x="74.0" y="671.9" font-size="14.5" fill="#3a3226" textLength="46.3" lengthAdjust="spacing">lexicale</text>
<text x="124.2" y="671.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="39.9" lengthAdjust="spacing">totale</text>
<text x="168.0" y="671.9" font-size="14.5" fill="#3a3226" textLength="213.7" lengthAdjust="spacing">(aceeași parte de vorbire, aceleași</text>
<text x="74.0" y="692.9" font-size="14.5" fill="#3a3226" textLength="42.5" lengthAdjust="spacing">forme)</text>
<text x="423.2" y="671.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="48.7" lengthAdjust="spacing">broască</text>
<text x="475.8" y="671.9" font-size="14.5" fill="#3a3226" textLength="169.1" lengthAdjust="spacing">(animal / mecanism al ușii)</text>
<line x1="62.0" y1="703.3" x2="838.0" y2="703.3" stroke="#e3dccb"/>
<text x="74.0" y="725.8" font-size="14.5" fill="#3a3226" textLength="46.3" lengthAdjust="spacing">lexicale</text>
<text x="124.2" y="725.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="52.1" lengthAdjust="spacing">parțiale</text>
<text x="180.1" y="725.8" font-size="14.5" fill="#3a3226" textLength="202.3" lengthAdjust="spacing">(aceeași parte de vorbire, forme</text>
<text x="74.0" y="746.8" font-size="14.5" fill="#3a3226" textLength="49.4" lengthAdjust="spacing">diferite)</text>
<text x="423.2" y="725.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="48.6" lengthAdjust="spacing">romane</text>
<text x="475.7" y="725.8" font-size="14.5" fill="#3a3226" textLength="74.8" lengthAdjust="spacing">(narațiuni) /</text>
<text x="554.4" y="725.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="45.2" lengthAdjust="spacing">romani</text>
<text x="603.6" y="725.8" font-size="14.5" fill="#3a3226" textLength="61.2" lengthAdjust="spacing">(locuitori)</text>
<line x1="62.0" y1="757.2" x2="838.0" y2="757.2" stroke="#e3dccb"/>
<text x="74.0" y="779.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="125.7" lengthAdjust="spacing">lexico-gramaticale</text>
<text x="203.6" y="779.7" font-size="14.5" fill="#3a3226" textLength="156.3" lengthAdjust="spacing">(părți de vorbire diferite)</text>
<text x="423.2" y="779.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="19.4" lengthAdjust="spacing">car</text>
<text x="446.5" y="779.7" font-size="14.5" fill="#3a3226" textLength="83.2" lengthAdjust="spacing">(substantiv) /</text>
<text x="533.7" y="779.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="19.4" lengthAdjust="spacing">car</text>
<text x="557.0" y="779.7" font-size="14.5" fill="#3a3226" textLength="44.2" lengthAdjust="spacing">(verbul</text>
<text x="605.2" y="779.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="39.0" lengthAdjust="spacing">a căra</text>
<text x="644.2" y="779.7" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">)</text>
<line x1="62.0" y1="790.0" x2="838.0" y2="790.0" stroke="#e3dccb"/>
<line x1="411.2" y1="617.9" x2="411.2" y2="790.0" stroke="#e3dccb"/>
<text x="62.0" y="819.0" font-size="15" fill="#3a3226" font-weight="700" textLength="78.7" lengthAdjust="spacing">Omofonele</text>
<text x="144.8" y="819.0" font-size="15" fill="#3a3226" textLength="118.2" lengthAdjust="spacing">se pronunță la fel,</text>
<text x="267.0" y="819.0" font-size="15" fill="#3a3226" font-weight="700" textLength="81.6" lengthAdjust="spacing">omografele</text>
<text x="352.7" y="819.0" font-size="15" fill="#3a3226" textLength="463.2" lengthAdjust="spacing">se scriu la fel. Omonimele sunt obligatoriu omofone, cu același accent.</text>
<text x="62.0" y="843.8" font-size="15" fill="#3a3226" font-weight="700" textLength="157.0" lengthAdjust="spacing">Cuvântul polisemantic</text>
<text x="223.1" y="843.8" font-size="15" fill="#3a3226" textLength="141.3" lengthAdjust="spacing">are mai multe sensuri</text>
<text x="368.4" y="843.8" font-size="15" fill="#3a3226" font-weight="700" textLength="105.8" lengthAdjust="spacing">legate între ele</text>
<text x="474.2" y="843.8" font-size="15" fill="#3a3226" textLength="299.7" lengthAdjust="spacing">; la omonime nu există nicio legătură de sens.</text>
<rect x="40" y="886.3" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="909.3" font-size="16" font-weight="700" fill="#ffffff">4. PARONIMELE</text>
<rect x="40" y="920.3" width="820" height="275.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="953.3" font-size="15" fill="#3a3226" font-weight="700" textLength="79.9" lengthAdjust="spacing">Paronimele</text>
<text x="146.0" y="953.3" font-size="15" fill="#3a3226" textLength="346.5" lengthAdjust="spacing">au formă asemănătoare și sens diferit. Se deosebesc:</text>
<rect x="62.0" y="971.8" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="993.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="25.6" lengthAdjust="spacing">Prin</text>
<text x="345.6" y="993.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="1003.3" x2="838.0" y2="1003.3" stroke="#e3dccb"/>
<text x="74.0" y="1025.8" font-size="14.5" fill="#3a3226" textLength="55.5" lengthAdjust="spacing">un sunet</text>
<text x="345.6" y="1025.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="49.0" lengthAdjust="spacing">familiar</text>
<text x="398.5" y="1025.8" font-size="14.5" fill="#3a3226" textLength="76.0" lengthAdjust="spacing">(cunoscut) /</text>
<text x="478.4" y="1025.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="47.6" lengthAdjust="spacing">familial</text>
<text x="529.9" y="1025.8" font-size="14.5" fill="#3a3226" textLength="71.0" lengthAdjust="spacing">(de familie)</text>
<line x1="62.0" y1="1036.2" x2="838.0" y2="1036.2" stroke="#e3dccb"/>
<text x="74.0" y="1058.7" font-size="14.5" fill="#3a3226" textLength="79.3" lengthAdjust="spacing">două sunete</text>
<text x="345.6" y="1058.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="66.3" lengthAdjust="spacing">a colabora</text>
<text x="415.8" y="1058.7" font-size="14.5" fill="#3a3226" textLength="125.4" lengthAdjust="spacing">(a lucra împreună) /</text>
<text x="545.1" y="1058.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="67.7" lengthAdjust="spacing">a corobora</text>
<text x="616.7" y="1058.7" font-size="14.5" fill="#3a3226" textLength="126.3" lengthAdjust="spacing">(a sprijini cu dovezi)</text>
<line x1="62.0" y1="1069.0" x2="838.0" y2="1069.0" stroke="#e3dccb"/>
<text x="74.0" y="1091.5" font-size="14.5" fill="#3a3226" textLength="112.5" lengthAdjust="spacing">ordinea sunetelor</text>
<text x="345.6" y="1091.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="49.6" lengthAdjust="spacing">a revela</text>
<text x="399.1" y="1091.5" font-size="14.5" fill="#3a3226" textLength="81.8" lengthAdjust="spacing">(a dezvălui) /</text>
<text x="484.8" y="1091.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="49.6" lengthAdjust="spacing">a releva</text>
<text x="538.3" y="1091.5" font-size="14.5" fill="#3a3226" textLength="78.2" lengthAdjust="spacing">(a evidenția)</text>
<line x1="62.0" y1="1101.9" x2="838.0" y2="1101.9" stroke="#e3dccb"/>
<line x1="333.6" y1="971.8" x2="333.6" y2="1101.9" stroke="#e3dccb"/>
<rect x="62.0" y="1115.9" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="1115.9" width="6" height="61.7" rx="3" fill="#b4432c"/><text x="84.0" y="1142.4" font-size="14.5" fill="#b4432c" font-weight="700" textLength="54.8" lengthAdjust="spacing">Atenție!</text>
<text x="84.0" y="1161.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="140.5" lengthAdjust="spacing">Confuzia paronimică</text>
<text x="228.4" y="1161.2" font-size="14.5" fill="#3a3226" textLength="501.1" lengthAdjust="spacing">este o greșeală de exprimare, din necunoașterea exactă a sensului unui cuvânt.</text>
<text x="329.5" y="1227.1" font-size="11.5" fill="#5b6b83" textLength="240.9" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 28-30, rubricile Repere.</text>
</svg>
