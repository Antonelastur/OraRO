<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="360" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Conversiunea. Familia de cuvinte</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I</text>

  <text x="230" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#6f5ea8">Conversiunea</text>
  <text x="230" y="110" text-anchor="middle" font-size="11" fill="#3a3226">schimbarea categoriei gramaticale, fără afix</text>

  <g>
    <rect x="60" y="130" width="340" height="58" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="80" y="153" font-size="12" fill="#10233f"><tspan font-weight="700">frumos</tspan> (adjectiv) → <tspan font-weight="700">frumos</tspan> (adverb)</text>
    <text x="80" y="173" font-size="11" fill="#5b6b83" font-style="italic">Cântă frumos.</text>
  </g>
  <g>
    <rect x="60" y="198" width="340" height="58" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="80" y="221" font-size="12" fill="#10233f"><tspan font-weight="700">obosit</tspan> (participiu) → <tspan font-weight="700">obosit</tspan> (adjectiv)</text>
    <text x="80" y="241" font-size="11" fill="#5b6b83" font-style="italic">Copilul obosit a adormit.</text>
  </g>
  <g>
    <rect x="60" y="266" width="340" height="58" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="80" y="289" font-size="12" fill="#10233f"><tspan font-weight="700">bine</tspan> (adverb) → <tspan font-weight="700">binele</tspan> (substantiv)</text>
    <text x="80" y="309" font-size="11" fill="#5b6b83" font-style="italic">Face binele fără să ceară nimic.</text>
  </g>

  <line x1="440" y1="90" x2="440" y2="330" stroke="#0d9c92" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="670" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9c92">Familia de cuvinte</text>
  <text x="670" y="110" text-anchor="middle" font-size="11" fill="#3a3226">cuvinte cu aceeași rădăcină, sensuri înrudite</text>

  <g>
    <circle cx="670" cy="180" r="42" fill="#ffffff" stroke="#0d9c92" stroke-width="2.5"/>
    <text x="670" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">floare</text>
  </g>
  <g>
    <circle cx="560" cy="270" r="34" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="560" y="266" text-anchor="middle" font-size="11" fill="#10233f">floral</text>
    <text x="560" y="280" text-anchor="middle" font-size="9" fill="#5b6b83">adjectiv</text>
  </g>
  <g>
    <circle cx="670" cy="290" r="34" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="670" y="286" text-anchor="middle" font-size="11" fill="#10233f">înflori</text>
    <text x="670" y="300" text-anchor="middle" font-size="9" fill="#5b6b83">verb</text>
  </g>
  <g>
    <circle cx="780" cy="270" r="34" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="780" y="266" text-anchor="middle" font-size="11" fill="#10233f">floricea</text>
    <text x="780" y="280" text-anchor="middle" font-size="9" fill="#5b6b83">diminutiv</text>
  </g>
  <line x1="670" y1="222" x2="560" y2="240" stroke="#0d9c92" stroke-width="1.5"/>
  <line x1="670" y1="222" x2="670" y2="256" stroke="#0d9c92" stroke-width="1.5"/>
  <line x1="670" y1="222" x2="780" y2="240" stroke="#0d9c92" stroke-width="1.5"/>

  <text x="450" y="345" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 34-35</text>
</svg>
