<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 868" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="868" fill="#faf7f0"/>
<text x="229.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="443.0" lengthAdjust="spacing">Structuri textuale și îmbinarea lor</text>
<text x="202.5" y="74.4" font-size="14" fill="#5b6b83" textLength="495.0" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a V-a, Lecția 3 · Manual, pp. 172-173 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. SECVENȚELE DE BAZĂ</text>
<rect x="40" y="128.6" width="820" height="287.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="426.0" lengthAdjust="spacing">Textul epic are o structură complexă, în care recunosc secvențele</text>
<text x="492.0" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="316.2" lengthAdjust="spacing">narative, descriptive, dialogate, explicative și</text>
<text x="62.0" y="183.3" font-size="15" fill="#3a3226" font-weight="700" textLength="103.8" lengthAdjust="spacing">argumentative</text>
<text x="165.8" y="183.3" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="201.8" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="223.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="59.1" lengthAdjust="spacing">Structura</text>
<text x="244.7" y="223.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="123.5" lengthAdjust="spacing">După ce o recunosc</text>
<line x1="62.0" y1="233.4" x2="838.0" y2="233.4" stroke="#e3dccb"/>
<text x="74.0" y="255.9" font-size="14.5" fill="#3a3226" textLength="59.7" lengthAdjust="spacing">dialogată</text>
<text x="244.7" y="255.9" font-size="14.5" fill="#3a3226" textLength="499.8" lengthAdjust="spacing">adresare la persoana a II-a, substantive în vocativ, enunțuri interogative, replici</text>
<line x1="62.0" y1="266.2" x2="838.0" y2="266.2" stroke="#e3dccb"/>
<text x="74.0" y="288.8" font-size="14.5" fill="#3a3226" textLength="50.9" lengthAdjust="spacing">narativă</text>
<text x="244.7" y="288.8" font-size="14.5" fill="#3a3226" textLength="357.7" lengthAdjust="spacing">o acțiune cu personaje, într-o ordine logică și temporală</text>
<line x1="62.0" y1="299.1" x2="838.0" y2="299.1" stroke="#e3dccb"/>
<text x="74.0" y="321.6" font-size="14.5" fill="#3a3226" textLength="68.7" lengthAdjust="spacing">descriptivă</text>
<text x="244.7" y="321.6" font-size="14.5" fill="#3a3226" textLength="407.7" lengthAdjust="spacing">trăsăturile unui obiect, ale unui personaj, cadrul în timp și spațiu</text>
<line x1="62.0" y1="332.0" x2="838.0" y2="332.0" stroke="#e3dccb"/>
<text x="74.0" y="354.4" font-size="14.5" fill="#3a3226" textLength="66.6" lengthAdjust="spacing">explicativă</text>
<text x="244.7" y="354.4" font-size="14.5" fill="#3a3226" textLength="378.9" lengthAdjust="spacing">lămurește împrejurări, cauze, felul în care funcționează ceva</text>
<line x1="62.0" y1="364.8" x2="838.0" y2="364.8" stroke="#e3dccb"/>
<text x="74.0" y="387.3" font-size="14.5" fill="#3a3226" textLength="92.6" lengthAdjust="spacing">argumentativă</text>
<text x="244.7" y="387.3" font-size="14.5" fill="#3a3226" textLength="265.6" lengthAdjust="spacing">susține un punct de vedere cu argumente</text>
<line x1="62.0" y1="397.6" x2="838.0" y2="397.6" stroke="#e3dccb"/>
<line x1="232.7" y1="201.8" x2="232.7" y2="397.6" stroke="#e3dccb"/>
<rect x="40" y="435.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="458.6" font-size="16" font-weight="700" fill="#ffffff">2. CUM SE ÎMBINĂ STRUCTURILE</text>
<rect x="40" y="469.6" width="820" height="148.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="487.6" width="248.0" height="112.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="515.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="80.5" lengthAdjust="spacing">succesiune</text>
<text x="78.0" y="538.9" font-size="14.5" fill="#3a3226" textLength="176.8" lengthAdjust="spacing">o structură îi urmează alteia</text>
<text x="78.0" y="562.9" font-size="14.5" fill="#3a3226" textLength="38.0" lengthAdjust="spacing">A → B</text>
<rect x="326.0" y="487.6" width="248.0" height="112.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="515.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="77.4" lengthAdjust="spacing">alternanță</text>
<text x="342.0" y="538.9" font-size="14.5" fill="#3a3226" textLength="204.3" lengthAdjust="spacing">structurile revin rând pe rând, în</text>
<text x="342.0" y="560.0" font-size="14.5" fill="#3a3226" textLength="48.9" lengthAdjust="spacing">grupaje</text>
<text x="342.0" y="583.9" font-size="14.5" fill="#3a3226" textLength="96.3" lengthAdjust="spacing">A → B → A → B</text>
<rect x="590.0" y="487.6" width="248.0" height="112.6" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="606.0" y="515.6" font-size="16" fill="#9a7433" font-weight="700" textLength="55.7" lengthAdjust="spacing">inserție</text>
<text x="606.0" y="538.9" font-size="14.5" fill="#3a3226" textLength="186.8" lengthAdjust="spacing">o structură apare în interiorul</text>
<text x="606.0" y="560.0" font-size="14.5" fill="#3a3226" textLength="34.2" lengthAdjust="spacing">alteia</text>
<text x="606.0" y="583.9" font-size="14.5" fill="#3a3226" textLength="51.5" lengthAdjust="spacing">A [ B ] A</text>
<rect x="40" y="638.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="661.2" font-size="16" font-weight="700" fill="#ffffff">3. MODELUL DIN MANUAL</text>
<rect x="40" y="672.2" width="820" height="144.8" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="690.2" width="776.0" height="108.8" rx="12" fill="#f3efe4"/><text x="78.0" y="716.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="736.0" lengthAdjust="spacing">„Cu simbolica lui cască numerotată «451» trasă peste figura flegmatică, ai cărei ochi ardeau cu o flacără portocalie la</text>
<text x="78.0" y="737.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="708.5" lengthAdjust="spacing">gândul dezastrului iminent – scăpără aprinzătorul, iar casa fu înghițită de o vâlvătaie enormă, care mistui și cerul</text>
<text x="78.0" y="758.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="309.5" lengthAdjust="spacing">nocturn, vopsindu-l în roșu, în galben și-n negru.”</text>
<text x="78.0" y="782.7" font-size="14.5" fill="#3a3226" textLength="386.4" lengthAdjust="spacing">descriptivă – (narativă) – descriptivă = structura narativă este</text>
<text x="468.3" y="782.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="54.2" lengthAdjust="spacing">inserată</text>
<text x="526.5" y="782.7" font-size="14.5" fill="#3a3226" textLength="113.1" lengthAdjust="spacing">în cea descriptivă.</text>
<text x="219.0" y="848.6" font-size="11.5" fill="#5b6b83" textLength="462.1" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 172-173, rubrica Repere, modelul din Explorare și grila de evaluare.</text>
</svg>
