<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="596" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Cum se îmbină structurile textuale</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Lectură</text>
  <rect x="36" y="96" width="928" height="58" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="56" y="120" font-size="13" font-weight="700" fill="#10233f">Textul epic îmbină mai multe secvențe textuale</text>
  <text x="56" y="140" font-size="12" fill="#3d4a5f">Una dintre ele e dominantă, dar poate conține și alte structuri.</text>
  <rect x="36" y="166" width="458" height="34" rx="10" fill="#3b5fa8"/>
  <text x="265" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SECVENȚELE</text>
  <rect x="36" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Narativă</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">relatează o acțiune, într-o ordine logică și temporală</text>
  <rect x="36" y="282" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="306" font-size="13" font-weight="700" fill="#10233f">Descriptivă</text>
  <text x="56" y="326" font-size="12" fill="#3d4a5f">arată trăsături: ale unui loc, personaj, obiect</text>
  <rect x="36" y="352" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="376" font-size="13" font-weight="700" fill="#10233f">Dialogată</text>
  <text x="56" y="396" font-size="12" fill="#3d4a5f">replici, adresare la persoana a II-a, vocativ, întrebări</text>
  <rect x="36" y="422" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="446" font-size="13" font-weight="700" fill="#10233f">Explicativă</text>
  <text x="56" y="466" font-size="12" fill="#3d4a5f">lămurește împrejurările, cum și de ce</text>
  <rect x="36" y="492" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="516" font-size="13" font-weight="700" fill="#10233f">Argumentativă</text>
  <text x="56" y="536" font-size="12" fill="#3d4a5f">susține o idee cu argumente</text>
  <rect x="506" y="166" width="458" height="34" rx="10" fill="#a1417e"/>
  <text x="735" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CUM SE ÎMBINĂ</text>
  <rect x="506" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="236" font-size="13" font-weight="700" fill="#10233f">Succesiune</text>
  <text x="526" y="256" font-size="12" fill="#3d4a5f">o structură o urmează pe alta</text>
  <rect x="506" y="282" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="306" font-size="13" font-weight="700" fill="#10233f">Alternanță</text>
  <text x="526" y="326" font-size="12" fill="#3d4a5f">grupaje care revin, rând pe rând</text>
  <rect x="506" y="352" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="376" font-size="13" font-weight="700" fill="#10233f">Inserție</text>
  <text x="526" y="396" font-size="12" fill="#3d4a5f">o structură apare în interiorul alteia</text>
  <rect x="512" y="422" width="452" height="115" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="532" y="446" font-size="13" font-weight="700" fill="#10233f">Exemplul din manual</text>
  <text x="532" y="466" font-size="12" fill="#3d4a5f">Casca numerotată „451” (descriere)</text>
  <text x="532" y="485" font-size="12" fill="#3d4a5f">– scăpără aprinzătorul (narațiune) –</text>
  <text x="532" y="504" font-size="12" fill="#3d4a5f">cerul vopsit în roșu, galben și negru (descriere)</text>
  <text x="532" y="523" font-size="12" fill="#3d4a5f">= narațiune inserată în descriere</text>
  <text x="500" y="582" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 172-173</text>
</svg>
