<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 634" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="634" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Romanul și lumile posibile</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Lectură</text>
  <rect x="36" y="96" width="928" height="58" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="56" y="120" font-size="13" font-weight="700" fill="#10233f">Romanul: în general, cel mai amplu text epic</text>
  <text x="56" y="140" font-size="12" fill="#3d4a5f">personaje numeroase, acțiune complexă, mai multe fire narative; poate avea părți, capitole și blancuri</text>
  <rect x="36" y="166" width="458" height="34" rx="10" fill="#3b5fa8"/>
  <text x="265" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CUM E ÎMPĂRȚIT</text>
  <rect x="36" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Părți și capitole</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">cu titlu sau marcate prin numere</text>
  <rect x="36" y="282" width="458" height="77" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="306" font-size="13" font-weight="700" fill="#10233f">Blancurile</text>
  <text x="56" y="326" font-size="12" fill="#3d4a5f">reper de lectură; delimitează un episod;</text>
  <text x="56" y="345" font-size="12" fill="#3d4a5f">întrețin suspansul</text>
  <rect x="36" y="371" width="458" height="77" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="395" font-size="13" font-weight="700" fill="#10233f">După temă, romanele pot fi</text>
  <text x="56" y="415" font-size="12" fill="#3d4a5f">sociale, istorice, de aventuri, polițiste,</text>
  <text x="56" y="434" font-size="12" fill="#3d4a5f">de dragoste, de anticipație (SF)</text>
  <rect x="506" y="166" width="458" height="34" rx="10" fill="#a1417e"/>
  <text x="735" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">LUMI IMAGINATE</text>
  <rect x="506" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="236" font-size="13" font-weight="700" fill="#10233f">Utopia</text>
  <text x="526" y="256" font-size="12" fill="#3d4a5f">„loc care nu există”: o societate ideală</text>
  <rect x="506" y="282" width="458" height="77" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="306" font-size="13" font-weight="700" fill="#10233f">Distopia</text>
  <text x="526" y="326" font-size="12" fill="#3d4a5f">opusul utopiei: un viitor dezumanizat de un</text>
  <text x="526" y="345" font-size="12" fill="#3d4a5f">control politic, tehnologic sau religios</text>
  <rect x="506" y="371" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="395" font-size="13" font-weight="700" fill="#10233f">SF-ul</text>
  <text x="526" y="415" font-size="12" fill="#3d4a5f">lumi posibile, pornite de la ipoteze științifice</text>
  <rect x="506" y="441" width="458" height="77" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="465" font-size="13" font-weight="700" fill="#10233f">Fantasticul și fantasy</text>
  <text x="526" y="485" font-size="12" fill="#3d4a5f">fantasticul are ceva inexplicabil;</text>
  <text x="526" y="504" font-size="12" fill="#3d4a5f">în fantasy intervine magia</text>
  <rect x="36" y="530" width="928" height="58" rx="12" fill="#ffffff" stroke="#c1503a" stroke-width="2"/>
  <text x="56" y="554" font-size="13" font-weight="700" fill="#10233f">Capcana</text>
  <text x="56" y="574" font-size="12" fill="#3d4a5f">Nu orice poveste despre viitor e SF. SF-ul pornește de la știință; dacă intervine magia, e fantasy.</text>
  <text x="500" y="620" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 170-171</text>
</svg>
