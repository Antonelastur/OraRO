<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1076" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1076" fill="#faf7f0"/>
<text x="128.2" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="645.4" lengthAdjust="spacing">Textul epic de mare întindere. Romanul. Distopia</text>
<text x="202.5" y="74.4" font-size="14" fill="#5b6b83" textLength="495.0" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a V-a, Lecția 2 · Manual, pp. 170-171 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CUM E ORGANIZAT UN TEXT EPIC AMPLU</text>
<rect x="40" y="128.6" width="820" height="193.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="521.2" lengthAdjust="spacing">Textul epic poate fi scurt, de lungime medie sau de mari dimensiuni, împărțit în</text>
<text x="587.3" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="33.4" lengthAdjust="spacing">părți</text>
<text x="620.7" y="161.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="628.1" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="56.1" lengthAdjust="spacing">capitole</text>
<text x="684.2" y="161.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="691.5" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="81.2" lengthAdjust="spacing">subcapitole</text>
<text x="772.7" y="161.6" font-size="15" fill="#3a3226" textLength="60.6" lengthAdjust="spacing">, marcate</text>
<text x="62.0" y="183.3" font-size="15" fill="#3a3226" textLength="149.8" lengthAdjust="spacing">prin titluri, numere sau</text>
<text x="215.9" y="183.3" font-size="15" fill="#3a3226" font-weight="700" textLength="57.3" lengthAdjust="spacing">blancuri</text>
<text x="277.2" y="183.3" font-size="15" fill="#3a3226" textLength="79.3" lengthAdjust="spacing">(spații albe).</text>
<text x="62.0" y="216.8" font-size="15" fill="#3a3226" textLength="67.3" lengthAdjust="spacing">Blancurile:</text>
<text x="62.0" y="250.3" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="250.3" font-size="15" fill="#3a3226" textLength="122.1" lengthAdjust="spacing">oferă cititorului un</text>
<text x="200.3" y="250.3" font-size="15" fill="#3a3226" font-weight="700" textLength="104.0" lengthAdjust="spacing">punct de reper</text>
<text x="308.3" y="250.3" font-size="15" fill="#3a3226" textLength="64.3" lengthAdjust="spacing">în lectură;</text>
<text x="62.0" y="275.1" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="275.1" font-size="15" fill="#3a3226" textLength="96.4" lengthAdjust="spacing">delimitează un</text>
<text x="174.7" y="275.1" font-size="15" fill="#3a3226" font-weight="700" textLength="136.1" lengthAdjust="spacing">episod semnificativ</text>
<text x="314.8" y="275.1" font-size="15" fill="#3a3226" textLength="146.0" lengthAdjust="spacing">din viața personajelor;</text>
<text x="62.0" y="299.9" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="299.9" font-size="15" fill="#3a3226" textLength="47.5" lengthAdjust="spacing">întrețin</text>
<text x="125.8" y="299.9" font-size="15" fill="#3a3226" font-weight="700" textLength="68.8" lengthAdjust="spacing">suspansul</text>
<text x="198.7" y="299.9" font-size="15" fill="#3a3226" textLength="149.5" lengthAdjust="spacing">prin decupajul acțiunii.</text>
<rect x="40" y="342.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="365.4" font-size="16" font-weight="700" fill="#ffffff">2. ROMANUL</text>
<rect x="40" y="376.4" width="820" height="160.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="410.4" font-size="16" fill="#10233f" font-weight="700" textLength="67.5" lengthAdjust="spacing">Romanul</text>
<text x="133.8" y="410.4" font-size="16" fill="#10233f" textLength="280.5" lengthAdjust="spacing">este, în general, cel mai amplu text epic:</text>
<text x="418.6" y="410.4" font-size="16" fill="#10233f" font-weight="700" textLength="161.1" lengthAdjust="spacing">personaje numeroase</text>
<text x="579.8" y="410.4" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">,</text>
<text x="587.6" y="410.4" font-size="16" fill="#10233f" font-weight="700" textLength="132.3" lengthAdjust="spacing">acțiune complexă</text>
<text x="719.9" y="410.4" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">,</text>
<text x="727.8" y="410.4" font-size="16" fill="#10233f" font-weight="700" textLength="106.2" lengthAdjust="spacing">mai multe fire</text>
<text x="62.0" y="433.6" font-size="16" fill="#10233f" font-weight="700" textLength="61.4" lengthAdjust="spacing">narative</text>
<text x="123.4" y="433.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<text x="62.0" y="467.4" font-size="15" fill="#3a3226" textLength="656.0" lengthAdjust="spacing">E cel mai puțin supus constrângerilor: există și romane scurte, cu puține personaje și acțiune simplă.</text>
<text x="62.0" y="492.1" font-size="15" fill="#3a3226" textLength="185.4" lengthAdjust="spacing">După teme, romanele pot fi:</text>
<text x="251.4" y="492.1" font-size="15" fill="#3a3226" font-weight="700" textLength="457.6" lengthAdjust="spacing">sociale, istorice, de aventuri, polițiste, de dragoste, de anticipație</text>
<text x="713.1" y="492.1" font-size="15" fill="#3a3226" textLength="102.9" lengthAdjust="spacing">(science-fiction,</text>
<text x="62.0" y="513.9" font-size="15" fill="#3a3226" textLength="23.1" lengthAdjust="spacing">SF).</text>
<rect x="40" y="556.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="579.4" font-size="16" font-weight="700" fill="#ffffff">3. UTOPIA ȘI DISTOPIA</text>
<rect x="40" y="590.4" width="820" height="148.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="608.4" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="636.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="48.8" lengthAdjust="spacing">utopia</text>
<text x="78.0" y="659.6" font-size="14.5" fill="#3a3226" textLength="194.7" lengthAdjust="spacing">din greacă, „loc care nu există”</text>
<text x="78.0" y="683.6" font-size="14.5" fill="#3a3226" textLength="69.6" lengthAdjust="spacing">o societate</text>
<text x="151.5" y="683.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="40.6" lengthAdjust="spacing">ideală</text>
<text x="192.1" y="683.6" font-size="14.5" fill="#3a3226" textLength="70.6" lengthAdjust="spacing">, imaginară</text>
<rect x="458.0" y="608.4" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#b4432c" stroke-width="2"/>
<text x="474.0" y="636.4" font-size="16" fill="#b4432c" font-weight="700" textLength="60.5" lengthAdjust="spacing">distopia</text>
<text x="474.0" y="659.6" font-size="14.5" fill="#3a3226" textLength="58.6" lengthAdjust="spacing">imaginea</text>
<text x="536.5" y="659.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="40.9" lengthAdjust="spacing">opusă</text>
<text x="581.3" y="659.6" font-size="14.5" fill="#3a3226" textLength="44.8" lengthAdjust="spacing">utopiei</text>
<text x="474.0" y="683.6" font-size="14.5" fill="#3a3226" textLength="135.3" lengthAdjust="spacing">societăți ale viitorului</text>
<text x="613.2" y="683.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="95.0" lengthAdjust="spacing">dezumanizate</text>
<text x="712.1" y="683.6" font-size="14.5" fill="#3a3226" textLength="86.0" lengthAdjust="spacing">de un control</text>
<text x="474.0" y="704.6" font-size="14.5" fill="#3a3226" textLength="190.4" lengthAdjust="spacing">politic, tehnologic sau religios</text>
<rect x="40" y="759.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="782.0" font-size="16" font-weight="700" fill="#ffffff">4. LITERATURA SF</text>
<rect x="40" y="793.0" width="820" height="231.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="826.0" font-size="15" fill="#3a3226" font-weight="700" textLength="35.5" lengthAdjust="spacing">SF-ul</text>
<text x="101.6" y="826.0" font-size="15" fill="#3a3226" textLength="70.6" lengthAdjust="spacing">inventează</text>
<text x="176.3" y="826.0" font-size="15" fill="#3a3226" font-weight="700" textLength="90.6" lengthAdjust="spacing">lumi posibile</text>
<text x="266.9" y="826.0" font-size="15" fill="#3a3226" textLength="332.4" lengthAdjust="spacing">, într-un timp și un spațiu imaginare, pornind de la</text>
<text x="603.3" y="826.0" font-size="15" fill="#3a3226" font-weight="700" textLength="121.3" lengthAdjust="spacing">ipoteze științifice</text>
<text x="728.7" y="826.0" font-size="15" fill="#3a3226" textLength="45.9" lengthAdjust="spacing">și de la</text>
<text x="62.0" y="847.7" font-size="15" fill="#3a3226" textLength="187.6" lengthAdjust="spacing">cunoștințele tehnice actuale.</text>
<rect x="62.0" y="866.2" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="186.6" y="887.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="14.6" lengthAdjust="spacing">SF</text>
<text x="425.6" y="887.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="56.6" lengthAdjust="spacing">Fantastic</text>
<text x="685.8" y="887.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="48.3" lengthAdjust="spacing">Fantasy</text>
<line x1="62.0" y1="897.8" x2="838.0" y2="897.8" stroke="#e3dccb"/>
<text x="135.7" y="920.2" font-size="14.5" fill="#3a3226" textLength="116.4" lengthAdjust="spacing">explicații științifice</text>
<text x="360.3" y="920.2" font-size="14.5" fill="#3a3226" textLength="86.4" lengthAdjust="spacing">o dimensiune</text>
<text x="450.6" y="920.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="85.5" lengthAdjust="spacing">inexplicabilă</text>
<text x="540.1" y="920.2" font-size="14.5" fill="#3a3226" textLength="7.4" lengthAdjust="spacing">a</text>
<text x="408.1" y="941.3" font-size="14.5" fill="#3a3226" textLength="91.6" lengthAdjust="spacing">evenimentelor</text>
<text x="659.2" y="920.2" font-size="14.5" fill="#3a3226" textLength="55.5" lengthAdjust="spacing">intervine</text>
<text x="718.7" y="920.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="42.0" lengthAdjust="spacing">magia</text>
<line x1="62.0" y1="951.6" x2="838.0" y2="951.6" stroke="#e3dccb"/>
<line x1="325.8" y1="866.2" x2="325.8" y2="951.6" stroke="#e3dccb"/>
<line x1="581.9" y1="866.2" x2="581.9" y2="951.6" stroke="#e3dccb"/>
<text x="62.0" y="980.6" font-size="15" fill="#3a3226" textLength="567.4" lengthAdjust="spacing">Dincolo de temele frecvente (invazia extraterestră, inteligența artificială), SF-ul invită la</text>
<text x="633.5" y="980.6" font-size="15" fill="#3a3226" font-weight="700" textLength="57.5" lengthAdjust="spacing">reflecție</text>
<text x="695.0" y="980.6" font-size="15" fill="#3a3226" textLength="94.6" lengthAdjust="spacing">despre viitorul</text>
<text x="62.0" y="1002.4" font-size="15" fill="#3a3226" textLength="297.7" lengthAdjust="spacing">umanității: teme politice, culturale, ecologice.</text>
<text x="189.0" y="1056.4" font-size="11.5" fill="#5b6b83" textLength="522.1" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 170-171, rubrica Repere; textul de bază este „Fahrenheit 451” de Ray Bradbury.</text>
</svg>
