<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 583" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="583" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Circumstanțialele, tot la un loc</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Recapitulare, gramatică</text>
  <rect x="36" y="96" width="223" height="34" rx="10" fill="#0d9c92"/>
  <text x="147.5" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CAUZĂ</text>
  <rect x="36" y="142" width="223" height="58" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="56" y="166" font-size="13" font-weight="700" fill="#10233f">Întrebarea</text>
  <text x="56" y="186" font-size="12" fill="#3d4a5f">din ce cauză?</text>
  <rect x="36" y="212" width="223" height="58" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">În propoziție</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">Am înghețat de frig.</text>
  <rect x="36" y="282" width="223" height="77" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="56" y="306" font-size="13" font-weight="700" fill="#10233f">În frază</text>
  <text x="56" y="326" font-size="12" fill="#3d4a5f">fiindcă, deoarece,</text>
  <text x="56" y="345" font-size="12" fill="#3d4a5f">pentru că, din cauză că</text>
  <rect x="36" y="371" width="223" height="77" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="56" y="395" font-size="13" font-weight="700" fill="#10233f">Virgula</text>
  <text x="56" y="415" font-size="12" fill="#3d4a5f">de obicei, da;</text>
  <text x="56" y="434" font-size="12" fill="#3d4a5f">nu, dacă e singura cauză</text>
  <rect x="271" y="96" width="223" height="34" rx="10" fill="#3b5fa8"/>
  <text x="382.5" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SCOP</text>
  <rect x="271" y="142" width="223" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="291" y="166" font-size="13" font-weight="700" fill="#10233f">Întrebarea</text>
  <text x="291" y="186" font-size="12" fill="#3d4a5f">cu ce scop?</text>
  <rect x="271" y="212" width="223" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="291" y="236" font-size="13" font-weight="700" fill="#10233f">În propoziție</text>
  <text x="291" y="256" font-size="12" fill="#3d4a5f">Mergem la cumpărături.</text>
  <rect x="271" y="282" width="223" height="77" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="291" y="306" font-size="13" font-weight="700" fill="#10233f">În frază</text>
  <text x="291" y="326" font-size="12" fill="#3d4a5f">ca să, să, de,</text>
  <text x="291" y="345" font-size="12" fill="#3d4a5f">pentru ca … să</text>
  <rect x="271" y="371" width="223" height="77" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="291" y="395" font-size="13" font-weight="700" fill="#10233f">Virgula</text>
  <text x="291" y="415" font-size="12" fill="#3d4a5f">nu, după să și de;</text>
  <text x="291" y="434" font-size="12" fill="#3d4a5f">da, cu un corelativ</text>
  <rect x="506" y="96" width="223" height="34" rx="10" fill="#6f5ea8"/>
  <text x="617.5" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CONCESIV</text>
  <rect x="506" y="142" width="223" height="58" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="526" y="166" font-size="13" font-weight="700" fill="#10233f">Întrebarea</text>
  <text x="526" y="186" font-size="12" fill="#3d4a5f">în ciuda cărui fapt?</text>
  <rect x="506" y="212" width="223" height="58" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="526" y="236" font-size="13" font-weight="700" fill="#10233f">În propoziție</text>
  <text x="526" y="256" font-size="12" fill="#3d4a5f">În ciuda ploii, a ieșit.</text>
  <rect x="506" y="282" width="223" height="77" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="526" y="306" font-size="13" font-weight="700" fill="#10233f">În frază</text>
  <text x="526" y="326" font-size="12" fill="#3d4a5f">deși, cu toate că,</text>
  <text x="526" y="345" font-size="12" fill="#3d4a5f">chiar dacă, chit că</text>
  <rect x="506" y="371" width="223" height="58" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="526" y="395" font-size="13" font-weight="700" fill="#10233f">Virgula</text>
  <text x="526" y="415" font-size="12" fill="#3d4a5f">întotdeauna</text>
  <rect x="741" y="96" width="223" height="34" rx="10" fill="#a1417e"/>
  <text x="852.5" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CONDIȚIONAL</text>
  <rect x="741" y="142" width="223" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="761" y="166" font-size="13" font-weight="700" fill="#10233f">Întrebarea</text>
  <text x="761" y="186" font-size="12" fill="#3d4a5f">cu ce condiție?</text>
  <rect x="741" y="212" width="223" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="761" y="236" font-size="13" font-weight="700" fill="#10233f">În propoziție</text>
  <text x="761" y="256" font-size="12" fill="#3d4a5f">Fără materiale, nu lucrezi.</text>
  <rect x="741" y="282" width="223" height="77" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="761" y="306" font-size="13" font-weight="700" fill="#10233f">În frază</text>
  <text x="761" y="326" font-size="12" fill="#3d4a5f">dacă, de, să,</text>
  <text x="761" y="345" font-size="12" fill="#3d4a5f">în caz că, fără să</text>
  <rect x="741" y="371" width="223" height="77" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="761" y="395" font-size="13" font-weight="700" fill="#10233f">Virgula</text>
  <text x="761" y="415" font-size="12" fill="#3d4a5f">mai ales când</text>
  <text x="761" y="434" font-size="12" fill="#3d4a5f">stă înaintea regentului</text>
  <rect x="36" y="460" width="928" height="77" rx="12" fill="#ffffff" stroke="#c1503a" stroke-width="2"/>
  <text x="56" y="484" font-size="13" font-weight="700" fill="#10233f">Capcanele</text>
  <text x="56" y="504" font-size="12" fill="#3d4a5f">din cauza = efect rău, datorită = efect bun · „ca să”, niciodată „că să”</text>
  <text x="56" y="523" font-size="12" fill="#3d4a5f">„dacă” poate introduce și o completivă: Ne-a întrebat dacă avem încredere. · „cum” cauzal stă mereu înainte</text>
  <text x="500" y="569" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 188-197</text>
</svg>
