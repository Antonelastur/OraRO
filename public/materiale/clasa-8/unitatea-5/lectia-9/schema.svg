<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="545" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Logos, patos, etos: cum convingi</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Comunicare orală</text>
  <rect x="36" y="96" width="928" height="58" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="56" y="120" font-size="13" font-weight="700" fill="#10233f">O argumentare e bună dacă e eficace: dacă îl convinge pe cel care ascultă</text>
  <text x="56" y="140" font-size="12" fill="#3d4a5f">Pentru asta, apelează la trei elemente deodată.</text>
  <rect x="36" y="166" width="301" height="34" rx="10" fill="#3b5fa8"/>
  <text x="186.5" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">LOGOS</text>
  <rect x="36" y="212" width="301" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Logica</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">argumente corecte logic</text>
  <rect x="349" y="166" width="301" height="34" rx="10" fill="#a1417e"/>
  <text x="499.5" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PATOS</text>
  <rect x="349" y="212" width="301" height="77" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="369" y="236" font-size="13" font-weight="700" fill="#10233f">Emoția</text>
  <text x="369" y="256" font-size="12" fill="#3d4a5f">implicarea emoțională</text>
  <text x="369" y="275" font-size="12" fill="#3d4a5f">a celor care ascultă</text>
  <rect x="662" y="166" width="301" height="34" rx="10" fill="#0d9c92"/>
  <text x="812.5" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ETOS</text>
  <rect x="662" y="212" width="301" height="77" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="682" y="236" font-size="13" font-weight="700" fill="#10233f">Credibilitatea</text>
  <text x="682" y="256" font-size="12" fill="#3d4a5f">vorbitorului: valori comune,</text>
  <text x="682" y="275" font-size="12" fill="#3d4a5f">argumente de calitate</text>
  <rect x="36" y="301" width="928" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="325" font-size="13" font-weight="700" fill="#10233f">Forța unui argument vine din două lucruri</text>
  <text x="56" y="345" font-size="12" fill="#3d4a5f">premise juste (fapte, exemple, dovezi adevărate sau credibile) și o legătură corectă între argument și concluzie</text>
  <rect x="36" y="371" width="928" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="56" y="395" font-size="13" font-weight="700" fill="#10233f">Receptorul contează</text>
  <text x="56" y="415" font-size="12" fill="#3d4a5f">Ce știe despre temă? Are convingeri ferme? Are idei preconcepute? După răspuns îți alegi argumentele.</text>
  <rect x="36" y="441" width="928" height="58" rx="12" fill="#ffffff" stroke="#c1503a" stroke-width="2"/>
  <text x="56" y="465" font-size="13" font-weight="700" fill="#10233f">Capcana</text>
  <text x="56" y="485" font-size="12" fill="#3d4a5f">Fără legătură între argument și concluzie nu convingi: „Gulliver vizitează școala, deci e elev al ei.”</text>
  <text x="500" y="531" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 186-187</text>
</svg>
