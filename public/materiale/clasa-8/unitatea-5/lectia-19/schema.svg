<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="766" fill="#faf7f0"/>
<text x="160.5" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="579.9" lengthAdjust="spacing">Recapitulare: romanul, structurile, conflictul</text>
<text x="164.8" y="74.4" font-size="14" fill="#5b6b83" textLength="570.4" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a V-a, Lecția 19 · Manual, pp. 170-175 și 200-201 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. ROMANUL ȘI SPECIILE LUI</text>
<rect x="40" y="128.6" width="820" height="126.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="63.3" lengthAdjust="spacing">Romanul</text>
<text x="137.5" y="161.6" font-size="15" fill="#3a3226" textLength="663.6" lengthAdjust="spacing">: cel mai amplu text epic, personaje numeroase, acțiune complexă, mai multe fire narative; împărțit în</text>
<text x="74.2" y="183.3" font-size="15" fill="#3a3226" textLength="153.7" lengthAdjust="spacing">părți, capitole, blancuri.</text>
<text x="62.0" y="208.1" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="208.1" font-size="15" fill="#3a3226" font-weight="700" textLength="47.4" lengthAdjust="spacing">Utopia</text>
<text x="125.6" y="208.1" font-size="15" fill="#3a3226" textLength="125.7" lengthAdjust="spacing">(societate ideală) ≠</text>
<text x="255.4" y="208.1" font-size="15" fill="#3a3226" font-weight="700" textLength="56.7" lengthAdjust="spacing">distopia</text>
<text x="316.1" y="208.1" font-size="15" fill="#3a3226" textLength="490.5" lengthAdjust="spacing">(societate a viitorului dezumanizată de control politic, tehnologic, religios).</text>
<text x="62.0" y="232.8" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="232.8" font-size="15" fill="#3a3226" font-weight="700" textLength="16.2" lengthAdjust="spacing">SF</text>
<text x="90.4" y="232.8" font-size="15" fill="#3a3226" textLength="604.8" lengthAdjust="spacing">: lumi posibile, pornind de la ipoteze științifice; ≠ fantastic (inexplicabilul), ≠ fantasy (magia).</text>
<rect x="40" y="275.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="298.4" font-size="16" font-weight="700" fill="#ffffff">2. STRUCTURILE TEXTUALE</text>
<rect x="40" y="309.4" width="820" height="55.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="342.4" font-size="15" fill="#3a3226" textLength="491.5" lengthAdjust="spacing">narativă · descriptivă · dialogată · explicativă · argumentativă, îmbinate prin</text>
<text x="557.6" y="342.4" font-size="15" fill="#3a3226" font-weight="700" textLength="75.5" lengthAdjust="spacing">succesiune</text>
<text x="633.0" y="342.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="640.4" y="342.4" font-size="15" fill="#3a3226" font-weight="700" textLength="72.6" lengthAdjust="spacing">alternanță</text>
<text x="717.0" y="342.4" font-size="15" fill="#3a3226" textLength="22.5" lengthAdjust="spacing">sau</text>
<text x="743.6" y="342.4" font-size="15" fill="#3a3226" font-weight="700" textLength="52.2" lengthAdjust="spacing">inserție</text>
<text x="795.8" y="342.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="384.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="407.9" font-size="16" font-weight="700" fill="#ffffff">3. PERSONAJELE ȘI CONFLICTUL</text>
<rect x="40" y="418.9" width="820" height="187.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="436.9" width="776.0" height="31.6" fill="#efeaf8"/>

<text x="268.0" y="458.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="50.6" lengthAdjust="spacing">Pe scurt</text>
<line x1="62.0" y1="468.4" x2="838.0" y2="468.4" stroke="#e3dccb"/>
<text x="74.0" y="490.9" font-size="14.5" fill="#3a3226" textLength="73.5" lengthAdjust="spacing">personajele</text>
<text x="268.0" y="490.9" font-size="14.5" fill="#3a3226" textLength="530.8" lengthAdjust="spacing">principal / secundar; protagonist / antagonist; individual / colectiv; care evoluează /</text>
<text x="268.0" y="511.9" font-size="14.5" fill="#3a3226" textLength="105.4" lengthAdjust="spacing">care rămân la fel</text>
<line x1="62.0" y1="522.3" x2="838.0" y2="522.3" stroke="#e3dccb"/>
<text x="74.0" y="544.8" font-size="14.5" fill="#3a3226" textLength="111.1" lengthAdjust="spacing">conflictul exterior</text>
<text x="268.0" y="544.8" font-size="14.5" fill="#3a3226" textLength="423.0" lengthAdjust="spacing">cu altă persoană, cu societatea, cu natura, cu tehnologia, cu soarta</text>
<line x1="62.0" y1="555.1" x2="838.0" y2="555.1" stroke="#e3dccb"/>
<text x="74.0" y="577.6" font-size="14.5" fill="#3a3226" textLength="108.6" lengthAdjust="spacing">conflictul interior</text>
<text x="268.0" y="577.6" font-size="14.5" fill="#3a3226" textLength="352.8" lengthAdjust="spacing">cu sine însuși: idei, porniri contradictorii, propriile limite</text>
<line x1="62.0" y1="588.0" x2="838.0" y2="588.0" stroke="#e3dccb"/>
<line x1="256.0" y1="436.9" x2="256.0" y2="588.0" stroke="#e3dccb"/>
<rect x="40" y="626.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="649.0" font-size="16" font-weight="700" fill="#ffffff">4. CUBUL (METODA DIN RECAPITULARE)</text>
<rect x="40" y="660.0" width="820" height="55.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="693.0" font-size="15" fill="#3a3226" font-weight="700" textLength="49.5" lengthAdjust="spacing">descrie</text>
<text x="115.5" y="693.0" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="122.9" y="693.0" font-size="15" fill="#3a3226" font-weight="700" textLength="61.6" lengthAdjust="spacing">compară</text>
<text x="188.6" y="693.0" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="195.9" y="693.0" font-size="15" fill="#3a3226" font-weight="700" textLength="58.6" lengthAdjust="spacing">asociază</text>
<text x="258.6" y="693.0" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="266.0" y="693.0" font-size="15" fill="#3a3226" font-weight="700" textLength="72.5" lengthAdjust="spacing">analizează</text>
<text x="342.5" y="693.0" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="349.8" y="693.0" font-size="15" fill="#3a3226" font-weight="700" textLength="41.1" lengthAdjust="spacing">aplică</text>
<text x="395.0" y="693.0" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="402.3" y="693.0" font-size="15" fill="#3a3226" font-weight="700" textLength="101.0" lengthAdjust="spacing">argumentează</text>
<text x="503.3" y="693.0" font-size="15" fill="#3a3226" textLength="217.6" lengthAdjust="spacing">: șase feluri de a privi același text.</text>
<text x="121.2" y="747.0" font-size="11.5" fill="#5b6b83" textLength="657.6" lengthAdjust="spacing">Sursa: Manual Art 8, rubricile Repere din lecțiile 2-4; recapitularea de la pp. 200-201 (fragment din „Darul lui Jonas” de Lois Lowry).</text>
</svg>
