<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 526" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="526" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Lectura unității, tot la un loc</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Recapitulare, lectură</text>
  <rect x="36" y="96" width="458" height="34" rx="10" fill="#3b5fa8"/>
  <text x="265" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">FAHRENHEIT 451 ȘI ROMANUL</text>
  <rect x="36" y="142" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="166" font-size="13" font-weight="700" fill="#10233f">Romanul</text>
  <text x="56" y="186" font-size="12" fill="#3d4a5f">amplu, cu multe personaje și fire narative</text>
  <rect x="36" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Distopia</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">un viitor dezumanizat de control</text>
  <rect x="36" y="282" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="306" font-size="13" font-weight="700" fill="#10233f">Structurile textuale</text>
  <text x="56" y="326" font-size="12" fill="#3d4a5f">se îmbină prin succesiune, alternanță, inserție</text>
  <rect x="36" y="352" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="376" font-size="13" font-weight="700" fill="#10233f">Conflictul</text>
  <text x="56" y="396" font-size="12" fill="#3d4a5f">exterior sau interior</text>
  <rect x="506" y="96" width="458" height="34" rx="10" fill="#0d9c92"/>
  <text x="735" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CELELALTE TEXTE</text>
  <rect x="506" y="142" width="458" height="58" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="526" y="166" font-size="13" font-weight="700" fill="#10233f">Textul de opinie, Harari</text>
  <text x="526" y="186" font-size="12" fill="#3d4a5f">argumente, strategii, conectori</text>
  <rect x="506" y="212" width="458" height="77" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="526" y="236" font-size="13" font-weight="700" fill="#10233f">Prima lecție de geometrie</text>
  <text x="526" y="256" font-size="12" fill="#3d4a5f">Crohmălniceanu: o lume ca a noastră,</text>
  <text x="526" y="275" font-size="12" fill="#3d4a5f">schimbată de un fenomen neobișnuit</text>
  <rect x="506" y="301" width="458" height="77" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="526" y="325" font-size="13" font-weight="700" fill="#10233f">Prometeu</text>
  <text x="526" y="345" font-size="12" fill="#3d4a5f">erou civilizator, simbol al progresului</text>
  <text x="526" y="364" font-size="12" fill="#3d4a5f">și al revoltei împotriva tiraniei</text>
  <rect x="36" y="422" width="928" height="58" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="56" y="446" font-size="13" font-weight="700" fill="#10233f">Cele trei părți din Fahrenheit 451</text>
  <text x="56" y="466" font-size="12" fill="#3d4a5f">Vatra și salamandra · Ciurul și nisipul · Strălucirea focului</text>
  <text x="500" y="512" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 164-185</text>
</svg>
