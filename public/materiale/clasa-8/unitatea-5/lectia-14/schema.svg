<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 854" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="854" fill="#faf7f0"/>
<text x="293.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="313.3" lengthAdjust="spacing">Circumstanțiala de scop</text>
<text x="198.7" y="74.4" font-size="14" fill="#5b6b83" textLength="502.6" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a V-a, Lecția 14 · Manual, pp. 192-193 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE</text>
<rect x="40" y="128.6" width="820" height="135.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="179.0" lengthAdjust="spacing">Circumstanțiala de scop</text>
<text x="245.4" y="162.6" font-size="16" fill="#10233f" textLength="328.6" lengthAdjust="spacing">este circumstanțialul de scop exprimat printr-o</text>
<text x="578.3" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="77.3" lengthAdjust="spacing">propoziție</text>
<text x="655.6" y="162.6" font-size="16" fill="#10233f" textLength="97.6" lengthAdjust="spacing">. Răspunde la:</text>
<text x="757.5" y="162.6" font-size="16" fill="#10233f" font-style="italic" textLength="77.1" lengthAdjust="spacing">cu ce scop?</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" font-style="italic" textLength="74.2" lengthAdjust="spacing">în ce scop?</text>
<text x="62.0" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="63.6" lengthAdjust="spacing">Regentul</text>
<text x="125.6" y="219.6" font-size="15" fill="#3a3226" textLength="189.1" lengthAdjust="spacing">: verb sau locuțiune verbală (</text>
<text x="314.7" y="219.6" font-size="15" fill="#10233f" font-style="italic" textLength="205.2" lengthAdjust="spacing">L-am chemat 1/ să mă ajute. 2/</text>
<text x="519.9" y="219.6" font-size="15" fill="#3a3226" textLength="71.1" lengthAdjust="spacing">), adjectiv (</text>
<text x="591.0" y="219.6" font-size="15" fill="#10233f" font-style="italic" textLength="213.3" lengthAdjust="spacing">Era amabil cu toți 1/ ca să facă o</text>
<text x="62.0" y="241.3" font-size="15" fill="#10233f" font-style="italic" textLength="113.4" lengthAdjust="spacing">impresie bună. 2/</text>
<text x="175.4" y="241.3" font-size="15" fill="#3a3226" textLength="162.0" lengthAdjust="spacing">), interjecție predicativă (</text>
<text x="337.4" y="241.3" font-size="15" fill="#10233f" font-style="italic" textLength="250.2" lengthAdjust="spacing">Poftim un ceai 1/ ca să te încălzești. 2/</text>
<text x="587.6" y="241.3" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">).</text>
<rect x="40" y="283.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="306.9" font-size="16" font-weight="700" fill="#ffffff">2. ELEMENTELE DE RELAȚIE</text>
<rect x="40" y="317.9" width="820" height="166.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="335.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="357.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="63.5" lengthAdjust="spacing">Elementul</text>
<text x="384.4" y="357.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="367.4" x2="838.0" y2="367.4" stroke="#e3dccb"/>
<text x="74.0" y="389.9" font-size="14.5" fill="#3a3226" textLength="65.2" lengthAdjust="spacing">conjuncții:</text>
<text x="143.2" y="389.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="133.4" lengthAdjust="spacing">ca să / ca ... să, să, de</text>
<text x="384.4" y="389.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="399.3" lengthAdjust="spacing">S-a dus la munte 1/ ca să se relaxeze. 2/ Hai 1/ de mănâncă! 2/</text>
<line x1="62.0" y1="400.3" x2="838.0" y2="400.3" stroke="#e3dccb"/>
<text x="74.0" y="422.8" font-size="14.5" fill="#3a3226" textLength="66.8" lengthAdjust="spacing">locuțiunea</text>
<text x="144.8" y="422.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="90.2" lengthAdjust="spacing">pentru ca ... să</text>
<text x="384.4" y="422.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="423.8" lengthAdjust="spacing">Am urmat sfaturile grădinarului 1/ pentru ca planta să se prindă. 2/</text>
<line x1="62.0" y1="433.1" x2="838.0" y2="433.1" stroke="#e3dccb"/>
<text x="74.0" y="455.6" font-size="14.5" fill="#3a3226" textLength="192.0" lengthAdjust="spacing">pronume relative cu prepoziții</text>
<text x="384.4" y="455.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="287.7" lengthAdjust="spacing">Muncise mult 1/ pentru ce avea de realizat. 2/</text>
<line x1="62.0" y1="466.0" x2="838.0" y2="466.0" stroke="#e3dccb"/>
<line x1="372.4" y1="335.9" x2="372.4" y2="466.0" stroke="#e3dccb"/>
<rect x="40" y="504.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="527.0" font-size="16" font-weight="700" fill="#ffffff">3. CORELATIVE, TOPICĂ, VIRGULĂ</text>
<rect x="40" y="538.0" width="820" height="265.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="571.0" font-size="15" fill="#3a3226" textLength="140.7" lengthAdjust="spacing">Corelative în regentă:</text>
<text x="206.7" y="571.0" font-size="15" fill="#10233f" font-style="italic" textLength="413.1" lengthAdjust="spacing">de aceea, de asta, de aia, anume, înadins, într-adins, intenționat</text>
<text x="619.8" y="571.0" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="589.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="611.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="48.5" lengthAdjust="spacing">Situația</text>
<text x="423.2" y="611.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="43.7" lengthAdjust="spacing">Regula</text>
<line x1="62.0" y1="621.0" x2="838.0" y2="621.0" stroke="#e3dccb"/>
<text x="74.0" y="643.5" font-size="14.5" fill="#3a3226" textLength="89.9" lengthAdjust="spacing">introdusă prin</text>
<text x="167.8" y="643.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="14.2" lengthAdjust="spacing">să</text>
<text x="182.0" y="643.5" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">,</text>
<text x="189.1" y="643.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="16.8" lengthAdjust="spacing">de</text>
<text x="423.2" y="643.5" font-size="14.5" fill="#3a3226" textLength="18.4" lengthAdjust="spacing">stă</text>
<text x="445.5" y="643.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="34.7" lengthAdjust="spacing">după</text>
<text x="484.1" y="643.5" font-size="14.5" fill="#3a3226" textLength="52.5" lengthAdjust="spacing">regentă,</text>
<text x="540.5" y="643.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="27.0" lengthAdjust="spacing">fără</text>
<text x="571.4" y="643.5" font-size="14.5" fill="#3a3226" textLength="43.2" lengthAdjust="spacing">virgulă</text>
<line x1="62.0" y1="653.9" x2="838.0" y2="653.9" stroke="#e3dccb"/>
<text x="74.0" y="676.4" font-size="14.5" fill="#3a3226" textLength="89.9" lengthAdjust="spacing">introdusă prin</text>
<text x="167.8" y="676.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="33.1" lengthAdjust="spacing">ca să</text>
<text x="200.9" y="676.4" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">,</text>
<text x="208.0" y="676.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="98.9" lengthAdjust="spacing">pentru ca ... să</text>
<text x="423.2" y="676.4" font-size="14.5" fill="#3a3226" textLength="72.8" lengthAdjust="spacing">poate sta și</text>
<text x="499.9" y="676.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="55.0" lengthAdjust="spacing">înaintea</text>
<text x="558.8" y="676.4" font-size="14.5" fill="#3a3226" textLength="52.9" lengthAdjust="spacing">regentei</text>
<line x1="62.0" y1="686.7" x2="838.0" y2="686.7" stroke="#e3dccb"/>
<text x="74.0" y="709.2" font-size="14.5" fill="#3a3226" textLength="107.6" lengthAdjust="spacing">înaintea regentei</text>
<text x="423.2" y="709.2" font-size="14.5" fill="#3a3226" textLength="58.3" lengthAdjust="spacing">de obicei</text>
<text x="485.4" y="709.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="15.8" lengthAdjust="spacing">cu</text>
<text x="505.1" y="709.2" font-size="14.5" fill="#3a3226" textLength="43.2" lengthAdjust="spacing">virgulă</text>
<line x1="62.0" y1="719.6" x2="838.0" y2="719.6" stroke="#e3dccb"/>
<text x="74.0" y="742.1" font-size="14.5" fill="#3a3226" textLength="86.0" lengthAdjust="spacing">după regentă</text>
<text x="423.2" y="742.1" font-size="14.5" fill="#3a3226" textLength="316.0" lengthAdjust="spacing">cu sau fără virgulă, după cât de strânsă e legătura</text>
<line x1="62.0" y1="752.4" x2="838.0" y2="752.4" stroke="#e3dccb"/>
<text x="74.0" y="774.9" font-size="14.5" fill="#3a3226" textLength="35.4" lengthAdjust="spacing">cu un</text>
<text x="113.3" y="774.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="58.9" lengthAdjust="spacing">corelativ</text>
<text x="176.1" y="774.9" font-size="14.5" fill="#3a3226" textLength="65.0" lengthAdjust="spacing">în regentă</text>
<text x="423.2" y="774.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="115.0" lengthAdjust="spacing">mereu cu virgulă</text>
<text x="538.2" y="774.9" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">:</text>
<text x="545.3" y="774.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="279.8" lengthAdjust="spacing">De aceea stă la umbră, ca să nu se bronzeze.</text>
<line x1="62.0" y1="785.3" x2="838.0" y2="785.3" stroke="#e3dccb"/>
<line x1="411.2" y1="589.5" x2="411.2" y2="785.2" stroke="#e3dccb"/>
<text x="323.3" y="834.8" font-size="11.5" fill="#5b6b83" textLength="253.3" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 192-193, rubricile Repere.</text>
</svg>
