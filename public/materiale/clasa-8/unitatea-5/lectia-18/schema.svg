<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="545" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Cum scriu un text de opinie</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Redactare</text>
  <rect x="36" y="96" width="458" height="34" rx="10" fill="#3b5fa8"/>
  <text x="265" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PLANUL</text>
  <rect x="36" y="142" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="166" font-size="13" font-weight="700" fill="#10233f">Introducerea</text>
  <text x="56" y="186" font-size="12" fill="#3d4a5f">captezi atenția și îți formulezi opinia</text>
  <rect x="36" y="212" width="458" height="77" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Cuprinsul</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">două argumente diferite,</text>
  <text x="56" y="275" font-size="12" fill="#3d4a5f">sprijinite pe exemple</text>
  <rect x="36" y="301" width="458" height="77" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="325" font-size="13" font-weight="700" fill="#10233f">Încheierea</text>
  <text x="56" y="345" font-size="12" fill="#3d4a5f">concluzia: reafirmi opinia și reiei</text>
  <text x="56" y="364" font-size="12" fill="#3d4a5f">pe scurt argumentele</text>
  <rect x="506" y="96" width="458" height="34" rx="10" fill="#a1417e"/>
  <text x="735" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PAȘII</text>
  <rect x="506" y="142" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="166" font-size="13" font-weight="700" fill="#10233f">1. Îmi aleg atitudinea</text>
  <text x="526" y="186" font-size="12" fill="#3d4a5f">sigură sau prudentă</text>
  <rect x="506" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="236" font-size="13" font-weight="700" fill="#10233f">2. Mă documentez</text>
  <text x="526" y="256" font-size="12" fill="#3d4a5f">și îmi ordonez informațiile</text>
  <rect x="506" y="282" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="306" font-size="13" font-weight="700" fill="#10233f">3. Scriu după plan</text>
  <text x="526" y="326" font-size="12" fill="#3d4a5f">cu conectori între opinie și argumente</text>
  <rect x="506" y="352" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="376" font-size="13" font-weight="700" fill="#10233f">4. Recitesc</text>
  <text x="526" y="396" font-size="12" fill="#3d4a5f">corectez, completez, tai ce nu contează</text>
  <rect x="36" y="422" width="928" height="77" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="56" y="446" font-size="13" font-weight="700" fill="#10233f">Lista de control</text>
  <text x="56" y="466" font-size="12" fill="#3d4a5f">opinia e limpede · două argumente diferite și relevante · exemple potrivite</text>
  <text x="56" y="485" font-size="12" fill="#3d4a5f">introducere, cuprins, încheiere, marcate prin paragrafe · formule potrivite de exprimare a opiniei</text>
  <text x="500" y="531" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, p. 199</text>
</svg>
