<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="400" fill="#faf7f0"/>
  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#10233f">Circumstanțialul de cauză</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · lecția 11 · exprimă cauza sau motivul realizării unei acțiuni sau al prezenței unei însușiri</text>

  <rect x="55" y="80" width="790" height="60" rx="14" fill="none" stroke="#0d9c92" stroke-width="2"/>
  <text x="75" y="102" font-size="13" font-weight="700" fill="#10233f">Întrebări</text>
  <text font-size="11.5" fill="#3a3226"><tspan x="75" y="124">din ce cauză?, din ce pricină?, din ce motiv?  ·  cauza e obligatoriu anterioară acțiunii din regentă</tspan></text>

  <rect x="55" y="156" width="390" height="128" rx="14" fill="none" stroke="#6f5ea8" stroke-width="2"/>
  <text x="75" y="180" font-size="13" font-weight="700" fill="#10233f">Regentul</text>
  <text font-size="11" fill="#3a3226"><tspan x="75" y="202">un verb, o locuțiune verbală</tspan><tspan x="75" y="220">(Am înghețat de frig.)</tspan><tspan x="75" y="240">sau un adjectiv (Era roșu de furie.)</tspan></text>

  <rect x="465" y="156" width="380" height="128" rx="14" fill="none" stroke="#0d9c92" stroke-width="2"/>
  <text x="485" y="180" font-size="13" font-weight="700" fill="#10233f">Se exprimă prin</text>
  <text font-size="11" fill="#3a3226"><tspan x="485" y="202">substantiv, pronume, numeral în acuzativ cu</tspan><tspan x="485" y="220">de, din, pentru, din cauză de, din pricină de;</tspan><tspan x="485" y="238">adjectiv cu prepoziție, adverb, gerunziu,</tspan><tspan x="485" y="256">infinitiv</tspan></text>

  <text x="450" y="326" text-anchor="middle" font-size="11.5" fill="#3a3226">„din cauza / din pricina” = efect nefavorabil; „datorită” = efect pozitiv.</text>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, p. 188</text>
</svg>
