<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1015" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1015" fill="#faf7f0"/>
<text x="281.7" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="337.1" lengthAdjust="spacing">Circumstanțialul de cauză</text>
<text x="217.0" y="74.4" font-size="14" fill="#5b6b83" textLength="466.1" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a V-a, Lecția 11 · Manual, p. 188 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE</text>
<rect x="40" y="128.6" width="820" height="210.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="192.6" lengthAdjust="spacing">Circumstanțialul de cauză</text>
<text x="259.0" y="162.6" font-size="16" fill="#10233f" textLength="35.5" lengthAdjust="spacing">arată</text>
<text x="298.8" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="42.4" lengthAdjust="spacing">cauza</text>
<text x="345.5" y="162.6" font-size="16" fill="#10233f" textLength="24.0" lengthAdjust="spacing">sau</text>
<text x="373.8" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="58.1" lengthAdjust="spacing">motivul</text>
<text x="436.2" y="162.6" font-size="16" fill="#10233f" textLength="382.4" lengthAdjust="spacing">unei acțiuni ori al unei însușiri. Răspunde la întrebările:</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="316.0" lengthAdjust="spacing">din ce cauză? din ce pricină? din ce motiv?</text>
<rect x="62.0" y="204.6" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="204.6" width="6" height="61.7" rx="3" fill="#b4432c"/><text x="84.0" y="231.1" font-size="14.5" fill="#b4432c" font-weight="700" textLength="112.8" lengthAdjust="spacing">Regula timpului:</text>
<text x="84.0" y="249.9" font-size="14.5" fill="#3a3226" textLength="66.3" lengthAdjust="spacing">cauza este</text>
<text x="154.2" y="249.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="150.4" lengthAdjust="spacing">obligatoriu anterioară</text>
<text x="308.5" y="249.9" font-size="14.5" fill="#3a3226" textLength="259.8" lengthAdjust="spacing">acțiunii sau însușirii exprimate de regent.</text>
<text x="62.0" y="295.3" font-size="15" fill="#3a3226" font-weight="700" textLength="63.6" lengthAdjust="spacing">Regentul</text>
<text x="125.6" y="295.3" font-size="15" fill="#3a3226" textLength="165.9" lengthAdjust="spacing">: verb, locuțiune verbală (</text>
<text x="291.5" y="295.3" font-size="15" fill="#10233f" font-style="italic" textLength="80.2" lengthAdjust="spacing">Am înghețat</text>
<text x="375.8" y="295.3" font-size="15" fill="#3a3226" font-weight="700" textLength="46.8" lengthAdjust="spacing">de frig</text>
<text x="422.6" y="295.3" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="429.9" y="295.3" font-size="15" fill="#10233f" font-style="italic" textLength="116.7" lengthAdjust="spacing">A băgat de seamă</text>
<text x="550.7" y="295.3" font-size="15" fill="#3a3226" font-weight="700" textLength="103.7" lengthAdjust="spacing">din întâmplare</text>
<text x="654.3" y="295.3" font-size="15" fill="#3a3226" textLength="97.7" lengthAdjust="spacing">.) sau adjectiv (</text>
<text x="752.0" y="295.3" font-size="15" fill="#10233f" font-style="italic" textLength="52.9" lengthAdjust="spacing">Era roșu</text>
<text x="809.0" y="295.3" font-size="15" fill="#3a3226" font-weight="700" textLength="17.4" lengthAdjust="spacing">de</text>
<text x="62.0" y="317.0" font-size="15" fill="#3a3226" font-weight="700" textLength="33.1" lengthAdjust="spacing">furie</text>
<text x="95.2" y="317.0" font-size="15" fill="#3a3226" textLength="11.1" lengthAdjust="spacing">.).</text>
<rect x="40" y="359.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="382.5" font-size="16" font-weight="700" fill="#ffffff">2. PRIN CE SE EXPRIMĂ</text>
<rect x="40" y="393.5" width="820" height="315.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="411.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="433.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="109.8" lengthAdjust="spacing">Partea de vorbire</text>
<text x="423.2" y="433.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="443.1" x2="838.0" y2="443.1" stroke="#e3dccb"/>
<text x="74.0" y="465.6" font-size="14.5" fill="#3a3226" textLength="248.1" lengthAdjust="spacing">substantiv, pronume, numeral în Ac. cu</text>
<text x="326.0" y="465.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="45.0" lengthAdjust="spacing">de, din,</text>
<text x="74.0" y="486.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="264.6" lengthAdjust="spacing">dintru, pentru, din cauză de, din pricină de</text>
<text x="423.2" y="465.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="393.5" lengthAdjust="spacing">Plecase din această cauză. Să nu fii supărat pentru mine. De ce</text>
<text x="423.2" y="486.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="29.6" lengthAdjust="spacing">râzi?</text>
<line x1="62.0" y1="497.0" x2="838.0" y2="497.0" stroke="#e3dccb"/>
<text x="74.0" y="519.5" font-size="14.5" fill="#3a3226" textLength="320.0" lengthAdjust="spacing">pronume personal în G. sau adjectiv posesiv, după</text>
<text x="74.0" y="540.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="134.0" lengthAdjust="spacing">din cauza, din pricina</text>
<text x="423.2" y="519.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="175.0" lengthAdjust="spacing">Întârziase din cauza lui / sa.</text>
<line x1="62.0" y1="550.8" x2="838.0" y2="550.8" stroke="#e3dccb"/>
<text x="74.0" y="573.3" font-size="14.5" fill="#3a3226" textLength="136.0" lengthAdjust="spacing">adjectiv cu prepoziție</text>
<text x="423.2" y="573.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="137.3" lengthAdjust="spacing">A plâns de bucuroasă.</text>
<line x1="62.0" y1="583.7" x2="838.0" y2="583.7" stroke="#e3dccb"/>
<text x="74.0" y="606.2" font-size="14.5" fill="#3a3226" textLength="180.4" lengthAdjust="spacing">adverb, locuțiune adverbială</text>
<text x="423.2" y="606.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="378.3" lengthAdjust="spacing">De repede ce vorbea, nu-l înțelegeau. Plouă și de aceea mi-e</text>
<text x="423.2" y="627.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="24.4" lengthAdjust="spacing">frig.</text>
<line x1="62.0" y1="637.6" x2="838.0" y2="637.6" stroke="#e3dccb"/>
<text x="74.0" y="660.1" font-size="14.5" fill="#3a3226" textLength="116.3" lengthAdjust="spacing">gerunziu / infinitiv</text>
<text x="423.2" y="660.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="377.4" lengthAdjust="spacing">Lăudându-l prea mult, s-a obrăznicit. Este amendat pentru a</text>
<text x="423.2" y="681.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="130.9" lengthAdjust="spacing">nu-și fi făcut datoria.</text>
<line x1="62.0" y1="691.4" x2="838.0" y2="691.4" stroke="#e3dccb"/>
<line x1="411.2" y1="411.5" x2="411.2" y2="691.4" stroke="#e3dccb"/>
<rect x="40" y="729.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="752.4" font-size="16" font-weight="700" fill="#ffffff">3. DIN CAUZA SAU DATORITĂ?</text>
<rect x="40" y="763.4" width="820" height="200.4" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="781.4" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#b4432c" stroke-width="2"/>
<text x="78.0" y="809.4" font-size="16" fill="#b4432c" font-weight="700" textLength="159.8" lengthAdjust="spacing">din cauza, din pricina</text>
<text x="78.0" y="832.7" font-size="14.5" fill="#3a3226" textLength="31.2" lengthAdjust="spacing">efect</text>
<text x="113.1" y="832.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="77.4" lengthAdjust="spacing">nefavorabil</text>
<rect x="458.0" y="781.4" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#2f7d4f" stroke-width="2"/>
<text x="474.0" y="809.4" font-size="16" fill="#2f7d4f" font-weight="700" textLength="60.3" lengthAdjust="spacing">datorită</text>
<text x="474.0" y="832.7" font-size="14.5" fill="#3a3226" textLength="31.2" lengthAdjust="spacing">efect</text>
<text x="509.1" y="832.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="46.4" lengthAdjust="spacing">pozitiv</text>
<rect x="62.0" y="863.1" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="889.6" font-size="14.5" fill="#10233f" font-weight="700" textLength="119.9" lengthAdjust="spacing">Model de analiză:</text>
<text x="78.0" y="908.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="725.8" lengthAdjust="spacing">„din neglijență” – circumstanțial de cauză, exprimat prin substantiv comun, simplu, genul feminin, numărul singular,</text>
<text x="78.0" y="929.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="392.1" lengthAdjust="spacing">cazul acuzativ, nearticulat, precedat de prepoziția simplă „din”.</text>
<text x="286.6" y="995.3" font-size="11.5" fill="#5b6b83" textLength="326.8" lengthAdjust="spacing">Sursa: Manual Art 8, p. 188, rubrica Repere și modelul de analiză.</text>
</svg>
