<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="456" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Cum convingi, oral și în scris</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Recapitulare, comunicare și redactare</text>
  <rect x="36" y="96" width="458" height="34" rx="10" fill="#3b5fa8"/>
  <text x="265" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ORAL: ARGUMENTAREA</text>
  <rect x="36" y="142" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="166" font-size="13" font-weight="700" fill="#10233f">Logos, patos, etos</text>
  <text x="56" y="186" font-size="12" fill="#3d4a5f">logică, emoție, credibilitate</text>
  <rect x="36" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Argumentul puternic</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">premise juste și o concluzie care decurge din ele</text>
  <rect x="36" y="282" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="306" font-size="13" font-weight="700" fill="#10233f">Receptorul</text>
  <text x="56" y="326" font-size="12" fill="#3d4a5f">îți alegi argumentele după cel care ascultă</text>
  <rect x="506" y="96" width="458" height="34" rx="10" fill="#a1417e"/>
  <text x="735" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SCRIS: TEXTUL DE OPINIE</text>
  <rect x="506" y="142" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="166" font-size="13" font-weight="700" fill="#10233f">Planul</text>
  <text x="526" y="186" font-size="12" fill="#3d4a5f">opinia, două argumente, concluzia</text>
  <rect x="506" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="236" font-size="13" font-weight="700" fill="#10233f">Strategiile</text>
  <text x="526" y="256" font-size="12" fill="#3d4a5f">obiecție, concesie, analogie</text>
  <rect x="506" y="282" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="306" font-size="13" font-weight="700" fill="#10233f">Formulele</text>
  <text x="526" y="326" font-size="12" fill="#3d4a5f">certitudine, probabilitate, necesitate</text>
  <rect x="36" y="352" width="928" height="58" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="56" y="376" font-size="13" font-weight="700" fill="#10233f">Grila de verificare, oral sau în scris</text>
  <text x="56" y="396" font-size="12" fill="#3d4a5f">Opinia reiese clar? Argumentele sunt logice și sprijinite pe exemple? Stilul e atractiv?</text>
  <text x="500" y="442" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 186-199</text>
</svg>
