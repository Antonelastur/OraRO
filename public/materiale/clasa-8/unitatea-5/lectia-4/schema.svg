<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 615" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="615" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Personajele și tipurile de conflict</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Lectură</text>
  <rect x="36" y="96" width="458" height="34" rx="10" fill="#3b5fa8"/>
  <text x="265" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CONFLICTUL EXTERIOR</text>
  <rect x="36" y="142" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="166" font-size="13" font-weight="700" fill="#10233f">Omul și altă persoană</text>
  <text x="56" y="186" font-size="12" fill="#3d4a5f">ciocnire de interese sau de valori</text>
  <rect x="36" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Omul și societatea</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">personajul încalcă normele comunității</text>
  <rect x="36" y="282" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="306" font-size="13" font-weight="700" fill="#10233f">Omul și natura</text>
  <text x="56" y="326" font-size="12" fill="#3d4a5f">înfruntă forțele dezlănțuite ale naturii</text>
  <rect x="36" y="352" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="376" font-size="13" font-weight="700" fill="#10233f">Omul și tehnologia</text>
  <text x="56" y="396" font-size="12" fill="#3d4a5f">roboți, androizi, inteligență artificială</text>
  <rect x="36" y="422" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="446" font-size="13" font-weight="700" fill="#10233f">Omul și soarta</text>
  <text x="56" y="466" font-size="12" fill="#3d4a5f">sau forțele supranaturale</text>
  <rect x="506" y="96" width="458" height="34" rx="10" fill="#a1417e"/>
  <text x="735" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CONFLICTUL INTERIOR · PERSONAJELE</text>
  <rect x="506" y="142" width="458" height="77" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="166" font-size="13" font-weight="700" fill="#10233f">Omul și sine însuși</text>
  <text x="526" y="186" font-size="12" fill="#3d4a5f">porniri, idei, atitudini contradictorii,</text>
  <text x="526" y="205" font-size="12" fill="#3d4a5f">confruntarea cu propriile limite</text>
  <rect x="506" y="231" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="255" font-size="13" font-weight="700" fill="#10233f">Personajele, după rol</text>
  <text x="526" y="275" font-size="12" fill="#3d4a5f">principal sau secundar</text>
  <rect x="506" y="301" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="325" font-size="13" font-weight="700" fill="#10233f">După poziția în conflict</text>
  <text x="526" y="345" font-size="12" fill="#3d4a5f">protagonist sau antagonist</text>
  <rect x="506" y="371" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="395" font-size="13" font-weight="700" fill="#10233f">După număr</text>
  <text x="526" y="415" font-size="12" fill="#3d4a5f">individual sau colectiv</text>
  <rect x="506" y="441" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="465" font-size="13" font-weight="700" fill="#10233f">După evoluție</text>
  <text x="526" y="485" font-size="12" fill="#3d4a5f">care se schimbă sau care rămân la fel</text>
  <rect x="36" y="511" width="928" height="58" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="56" y="535" font-size="13" font-weight="700" fill="#10233f">Cum lucrezi cu tabelul</text>
  <text x="56" y="555" font-size="12" fill="#3d4a5f">Pentru fiecare conflict din roman, întreabă: cine se ciocnește cu cine sau cu ce? Răspunsul îți dă tipul.</text>
  <text x="500" y="601" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 8, pp. 174-175</text>
</svg>
