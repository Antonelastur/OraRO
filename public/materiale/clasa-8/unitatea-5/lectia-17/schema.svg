<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 829" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="829" fill="#faf7f0"/>
<text x="203.3" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="494.5" lengthAdjust="spacing">Exprimarea preferințelor și a opiniilor</text>
<text x="198.7" y="74.4" font-size="14" fill="#5b6b83" textLength="502.6" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a V-a, Lecția 17 · Manual, pp. 198-199 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. ATITUDINEA VORBITORULUI</text>
<rect x="40" y="128.6" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="287.4" lengthAdjust="spacing">Când îmi exprim preferințele și opiniile, arăt</text>
<text x="353.4" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="147.0" lengthAdjust="spacing">atitudinea subiectivă</text>
<text x="504.5" y="161.6" font-size="15" fill="#3a3226" textLength="247.5" lengthAdjust="spacing">față de temă sau față de realitate prin</text>
<text x="756.0" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="61.2" lengthAdjust="spacing">verbe de</text>
<text x="62.0" y="183.3" font-size="15" fill="#3a3226" font-weight="700" textLength="314.2" lengthAdjust="spacing">opinie, adverbe, adjective, locuțiuni, expresii</text>
<text x="376.2" y="183.3" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="225.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="248.8" font-size="16" font-weight="700" fill="#ffffff">2. VALORILE ȘI MIJLOACELE</text>
<rect x="40" y="259.9" width="820" height="360.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="277.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="299.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="55.6" lengthAdjust="spacing">Valoarea</text>
<text x="244.7" y="299.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="53.6" lengthAdjust="spacing">Mijloace</text>
<line x1="62.0" y1="309.4" x2="838.0" y2="309.4" stroke="#e3dccb"/>
<text x="74.0" y="331.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="82.4" lengthAdjust="spacing">certitudinea</text>
<text x="244.7" y="331.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="561.4" lengthAdjust="spacing">știu că, am convingerea că, e limpede că, adevărul e că, nu încape îndoială că; bineînțeles,</text>
<text x="244.7" y="352.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="138.3" lengthAdjust="spacing">firește, în mod evident</text>
<line x1="62.0" y1="363.3" x2="838.0" y2="363.3" stroke="#e3dccb"/>
<text x="74.0" y="385.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="95.3" lengthAdjust="spacing">incertitudinea</text>
<text x="244.7" y="385.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="577.9" lengthAdjust="spacing">bănuiesc că, presupun / cred că, îmi imaginez că, mă îndoiesc că, m-aș mira să; aproximativ,</text>
<text x="244.7" y="406.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="55.0" lengthAdjust="spacing">oarecum</text>
<line x1="62.0" y1="417.2" x2="838.0" y2="417.2" stroke="#e3dccb"/>
<text x="74.0" y="439.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="96.4" lengthAdjust="spacing">probabilitatea</text>
<text x="244.7" y="439.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="540.3" lengthAdjust="spacing">s-ar părea că, s-ar putea să, nu e exclus să; după cât se pare; eventual, poate, probabil,</text>
<text x="244.7" y="460.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="97.7" lengthAdjust="spacing">pesemne, parcă</text>
<line x1="62.0" y1="471.0" x2="838.0" y2="471.0" stroke="#e3dccb"/>
<text x="74.0" y="493.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="76.7" lengthAdjust="spacing">necesitatea</text>
<text x="244.7" y="493.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="475.9" lengthAdjust="spacing">trebuie să, se cuvine să, se impune să, e nevoie să, am obligația să; neapărat</text>
<line x1="62.0" y1="503.9" x2="838.0" y2="503.9" stroke="#e3dccb"/>
<text x="74.0" y="526.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="50.0" lengthAdjust="spacing">dorința</text>
<text x="244.7" y="526.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="214.3" lengthAdjust="spacing">doresc să, vreau să, am intenția să</text>
<line x1="62.0" y1="536.7" x2="838.0" y2="536.7" stroke="#e3dccb"/>
<text x="74.0" y="559.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="129.0" lengthAdjust="spacing">aprecierea pozitivă</text>
<text x="244.7" y="559.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="520.5" lengthAdjust="spacing">apreciez, merită să, sunt bucuros că, am plăcerea să, e bine / util / recomandabil să</text>
<line x1="62.0" y1="569.6" x2="838.0" y2="569.6" stroke="#e3dccb"/>
<text x="74.0" y="592.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="133.7" lengthAdjust="spacing">aprecierea negativă</text>
<text x="244.7" y="592.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="566.1" lengthAdjust="spacing">detest să, îmi displace că, regret că, nu e indicat să; din păcate, din nefericire, e greșit / trist</text>
<line x1="62.0" y1="602.4" x2="838.0" y2="602.4" stroke="#e3dccb"/>
<line x1="232.7" y1="277.9" x2="232.7" y2="602.4" stroke="#e3dccb"/>
<rect x="40" y="640.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="663.4" font-size="16" font-weight="700" fill="#ffffff">3. ATITUDINE SIGURĂ SAU PRUDENTĂ</text>
<rect x="40" y="674.4" width="820" height="103.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="692.4" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="720.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="46.2" lengthAdjust="spacing">sigură</text>
<text x="78.0" y="743.7" font-size="14.5" fill="#3a3226" textLength="69.9" lengthAdjust="spacing">formule de</text>
<text x="151.8" y="743.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="74.5" lengthAdjust="spacing">certitudine</text>
<text x="230.3" y="743.7" font-size="14.5" fill="#3a3226" textLength="29.6" lengthAdjust="spacing">și de</text>
<text x="263.8" y="743.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="68.9" lengthAdjust="spacing">necesitate</text>
<rect x="458.0" y="692.4" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="720.4" font-size="16" fill="#6f5ea8" font-weight="700" textLength="69.3" lengthAdjust="spacing">prudentă</text>
<text x="474.0" y="743.7" font-size="14.5" fill="#3a3226" textLength="83.4" lengthAdjust="spacing">și formule de</text>
<text x="561.3" y="743.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="87.4" lengthAdjust="spacing">incertitudine</text>
<text x="652.6" y="743.7" font-size="14.5" fill="#3a3226" textLength="41.8" lengthAdjust="spacing">sau de</text>
<text x="698.3" y="743.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="88.6" lengthAdjust="spacing">probabilitate</text>
<text x="326.1" y="809.6" font-size="11.5" fill="#5b6b83" textLength="247.7" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 198-199, rubrica Repere.</text>
</svg>
