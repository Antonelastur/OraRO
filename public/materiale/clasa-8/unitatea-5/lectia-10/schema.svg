<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 763" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="763" fill="#faf7f0"/>
<text x="118.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="665.0" lengthAdjust="spacing">Argumentare și persuasiune: discuția argumentată</text>
<text x="198.7" y="74.4" font-size="14" fill="#5b6b83" textLength="502.6" lengthAdjust="spacing">Clasa a VIII-a · Unitatea a V-a, Lecția 10 · Manual, pp. 186-187 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TIPURI DE ARGUMENTE</text>
<rect x="40" y="128.6" width="820" height="166.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="163.5" lengthAdjust="spacing">Argumentul se sprijină pe</text>
<text x="500.8" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="55.8" lengthAdjust="spacing">Apelul la</text>
<line x1="62.0" y1="178.2" x2="838.0" y2="178.2" stroke="#e3dccb"/>
<text x="74.0" y="200.7" font-size="14.5" fill="#3a3226" textLength="331.3" lengthAdjust="spacing">dovezi: fapte, informații, exemple, statistici, cercetări</text>
<text x="500.8" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="37.1" lengthAdjust="spacing">logos</text>
<text x="541.8" y="200.7" font-size="14.5" fill="#3a3226" textLength="53.6" lengthAdjust="spacing">(rațiune)</text>
<line x1="62.0" y1="211.0" x2="838.0" y2="211.0" stroke="#e3dccb"/>
<text x="74.0" y="233.5" font-size="14.5" fill="#3a3226" textLength="244.8" lengthAdjust="spacing">stări emoționale, experiențe subiective</text>
<text x="500.8" y="233.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="37.7" lengthAdjust="spacing">patos</text>
<text x="542.4" y="233.5" font-size="14.5" fill="#3a3226" textLength="53.2" lengthAdjust="spacing">(emoție)</text>
<line x1="62.0" y1="243.8" x2="838.0" y2="243.8" stroke="#e3dccb"/>
<text x="74.0" y="266.4" font-size="14.5" fill="#3a3226" textLength="318.8" lengthAdjust="spacing">idei consacrate, valori morale, propria credibilitate</text>
<text x="500.8" y="266.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="28.7" lengthAdjust="spacing">etos</text>
<text x="533.4" y="266.4" font-size="14.5" fill="#3a3226" textLength="110.5" lengthAdjust="spacing">(valori, încredere)</text>
<line x1="62.0" y1="276.7" x2="838.0" y2="276.7" stroke="#e3dccb"/>
<line x1="488.8" y1="146.6" x2="488.8" y2="276.7" stroke="#e3dccb"/>
<rect x="40" y="314.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="337.7" font-size="16" font-weight="700" fill="#ffffff">2. PAȘII UNEI DISCUȚII ARGUMENTATE</text>
<rect x="40" y="348.7" width="820" height="129.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="381.7" font-size="15" fill="#3a3226" font-weight="700">1.</text>
<text x="81.0" y="381.7" font-size="15" fill="#3a3226" textLength="257.7" lengthAdjust="spacing">notăm ideile despre temă (de exemplu,</text>
<text x="342.7" y="381.7" font-size="15" fill="#10233f" font-style="italic" textLength="104.1" lengthAdjust="spacing">Școala viitorului</text>
<text x="446.8" y="381.7" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">);</text>
<text x="62.0" y="406.4" font-size="15" fill="#3a3226" font-weight="700">2.</text>
<text x="81.0" y="406.4" font-size="15" fill="#3a3226" textLength="249.3" lengthAdjust="spacing">alegem prin vot 2-3 aspecte concrete;</text>
<text x="62.0" y="431.2" font-size="15" fill="#3a3226" font-weight="700">3.</text>
<text x="81.0" y="431.2" font-size="15" fill="#3a3226" textLength="111.6" lengthAdjust="spacing">în grupe, căutăm</text>
<text x="196.6" y="431.2" font-size="15" fill="#3a3226" font-weight="700" textLength="270.5" lengthAdjust="spacing">cele mai bune strategii de persuasiune</text>
<text x="467.1" y="431.2" font-size="15" fill="#3a3226" textLength="317.2" lengthAdjust="spacing">, cu argumente logice, bazate pe fapte și dovezi;</text>
<text x="62.0" y="455.9" font-size="15" fill="#3a3226" font-weight="700">4.</text>
<text x="81.0" y="455.9" font-size="15" fill="#3a3226" textLength="443.2" lengthAdjust="spacing">un reprezentant prezintă argumentele; ceilalți evaluează după grilă.</text>
<rect x="40" y="498.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="521.5" font-size="16" font-weight="700" fill="#ffffff">3. GRILA DE EVALUARE</text>
<rect x="40" y="532.5" width="820" height="179.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="565.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="565.5" font-size="15" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">ideea argumentată (</text>
<text x="207.5" y="565.5" font-size="15" fill="#3a3226" font-weight="700" textLength="56.1" lengthAdjust="spacing">premisa</text>
<text x="263.6" y="565.5" font-size="15" fill="#3a3226" textLength="77.9" lengthAdjust="spacing">) reiese clar;</text>
<text x="62.0" y="590.2" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="590.2" font-size="15" fill="#3a3226" textLength="191.1" lengthAdjust="spacing">argumentele sunt prezentate</text>
<text x="269.3" y="590.2" font-size="15" fill="#3a3226" font-weight="700" textLength="34.0" lengthAdjust="spacing">logic</text>
<text x="303.4" y="590.2" font-size="15" fill="#3a3226" textLength="112.7" lengthAdjust="spacing">, ușor de urmărit;</text>
<text x="62.0" y="615.0" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="615.0" font-size="15" fill="#3a3226" textLength="86.2" lengthAdjust="spacing">se sprijină pe</text>
<text x="164.5" y="615.0" font-size="15" fill="#3a3226" font-weight="700" textLength="310.9" lengthAdjust="spacing">exemple relevante, fapte, statistici, cercetări</text>
<text x="475.4" y="615.0" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="639.7" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="639.7" font-size="15" fill="#3a3226" textLength="47.1" lengthAdjust="spacing">implică</text>
<text x="125.4" y="639.7" font-size="15" fill="#3a3226" font-weight="700" textLength="93.3" lengthAdjust="spacing">valori morale</text>
<text x="218.6" y="639.7" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="664.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="664.5" font-size="15" fill="#3a3226" textLength="105.9" lengthAdjust="spacing">se bazează și pe</text>
<text x="184.1" y="664.5" font-size="15" fill="#3a3226" font-weight="700" textLength="139.7" lengthAdjust="spacing">experiențe și emoții</text>
<text x="323.8" y="664.5" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="689.2" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="689.2" font-size="15" fill="#3a3226" font-weight="700" textLength="34.2" lengthAdjust="spacing">stilul</text>
<text x="112.5" y="689.2" font-size="15" fill="#3a3226" textLength="152.4" lengthAdjust="spacing">argumentării e atractiv.</text>
<text x="251.6" y="743.2" font-size="11.5" fill="#5b6b83" textLength="396.9" lengthAdjust="spacing">Sursa: Manual Art 8, pp. 186-187, rubricile Repere și Aplicații, grila de evaluare.</text>
</svg>
