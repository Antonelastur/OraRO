<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1107" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1107" fill="#faf7f0"/>
<text x="97.2" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="699.6" lengthAdjust="spacing">Modele comportamentale eroice de-a lungul timpului</text>
<text x="209.7" y="74.4" font-size="14" fill="#5b6b83" textLength="480.6" lengthAdjust="spacing">Clasa a V-a · Unitatea IV, Lecția 9 · Manual, pp. 122-123 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. EROUL</text>
<rect x="40" y="128.6" width="820" height="80.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="38.6" lengthAdjust="spacing">Eroul</text>
<text x="105.0" y="162.6" font-size="16" fill="#10233f" textLength="720.4" lengthAdjust="spacing">este o ființă excepțională în care sunt proiectate valori și aspirații umane permanente (curaj, putere</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="337.8" lengthAdjust="spacing">de sacrificiu, bunătate, spirit de dreptate etc.).</text>
<rect x="40" y="228.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="251.6" font-size="16" font-weight="700" fill="#ffffff">2. CUM S-A SCHIMBAT MODELUL EROIC</text>
<rect x="40" y="262.6" width="820" height="191.7" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="295.6" font-size="15" fill="#3a3226" textLength="471.4" lengthAdjust="spacing">Modelul comportamental eroic s-a transformat de-a lungul secolelor.</text>
<rect x="62.0" y="314.1" width="380.0" height="88.7" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="78.0" y="342.1" font-size="16" fill="#9a7433" font-weight="700" textLength="51.5" lengthAdjust="spacing">Înainte</text>
<text x="78.0" y="365.4" font-size="14.5" fill="#3a3226" textLength="305.9" lengthAdjust="spacing">Eroul grec era caracterizat de noblețea originii</text>
<text x="78.0" y="386.4" font-size="14.5" fill="#3a3226" textLength="324.1" lengthAdjust="spacing">divine, de unicitate, fiind idealizat de către artiști.</text>
<rect x="458.0" y="314.1" width="380.0" height="88.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="474.0" y="342.1" font-size="16" fill="#0d9c92" font-weight="700" textLength="47.8" lengthAdjust="spacing">Astăzi</text>
<text x="474.0" y="365.4" font-size="14.5" fill="#3a3226" textLength="179.7" lengthAdjust="spacing">Eroul contemporan poate fi</text>
<text x="657.6" y="365.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="92.7" lengthAdjust="spacing">omul obișnuit</text>
<text x="750.3" y="365.4" font-size="14.5" fill="#3a3226" textLength="32.3" lengthAdjust="spacing">, sub</text>
<text x="474.0" y="386.4" font-size="14.5" fill="#3a3226" textLength="117.0" lengthAdjust="spacing">multiple înfățișări.</text>
<text x="62.0" y="431.8" font-size="15" fill="#3a3226" font-weight="700" textLength="224.9" lengthAdjust="spacing">Televiziunea, ziarele și revistele</text>
<text x="291.0" y="431.8" font-size="15" fill="#3a3226" textLength="372.7" lengthAdjust="spacing">au un rol important în impunerea eroilor contemporani.</text>
<rect x="40" y="474.3" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="497.3" font-size="16" font-weight="700" fill="#ffffff">3. AXA CRONOLOGICĂ</text>
<rect x="40" y="508.3" width="820" height="277.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="541.3" font-size="15" fill="#3a3226" textLength="754.5" lengthAdjust="spacing">Copiez axa în caiet și notez eroii specifici fiecărei epoci, pe care i-am descoperit în textul de la Explorare, ex. 1</text>
<text x="62.0" y="563.0" font-size="15" fill="#3a3226" textLength="47.9" lengthAdjust="spacing">(ex. 3).</text>
<rect x="62.0" y="581.5" width="248.0" height="85.2" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="609.5" font-size="16" fill="#0d9c92" font-weight="700" textLength="71.0" lengthAdjust="spacing">3000 î.H.</text>
<text x="78.0" y="627.8" font-size="13.5" fill="#5b6b83" textLength="83.5" lengthAdjust="spacing">Mesopotamia</text>
<text x="78.0" y="650.4" font-size="14.5" fill="#3a3226" textLength="97.0" lengthAdjust="spacing">eroii: ……………</text>
<rect x="326.0" y="581.5" width="248.0" height="85.2" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="342.0" y="609.5" font-size="16" fill="#0d9c92" font-weight="700" textLength="136.3" lengthAdjust="spacing">sec. al VIII-lea î.H.</text>
<text x="342.0" y="627.8" font-size="13.5" fill="#5b6b83" textLength="40.0" lengthAdjust="spacing">Grecia</text>
<text x="342.0" y="650.4" font-size="14.5" fill="#3a3226" textLength="97.0" lengthAdjust="spacing">eroii: ……………</text>
<rect x="590.0" y="581.5" width="248.0" height="85.2" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="606.0" y="609.5" font-size="16" fill="#0d9c92" font-weight="700" textLength="69.4" lengthAdjust="spacing">sec. I î.H.</text>
<text x="606.0" y="627.8" font-size="13.5" fill="#5b6b83" textLength="34.8" lengthAdjust="spacing">Roma</text>
<text x="606.0" y="650.4" font-size="14.5" fill="#3a3226" textLength="97.0" lengthAdjust="spacing">eroii: ……………</text>
<rect x="62.0" y="682.7" width="248.0" height="85.2" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="78.0" y="710.7" font-size="16" fill="#9a7433" font-weight="700" textLength="83.4" lengthAdjust="spacing">Evul Mediu</text>
<text x="78.0" y="729.0" font-size="13.5" fill="#5b6b83" textLength="43.5" lengthAdjust="spacing">Europa</text>
<text x="78.0" y="751.6" font-size="14.5" fill="#3a3226" textLength="97.0" lengthAdjust="spacing">eroii: ……………</text>
<rect x="326.0" y="682.7" width="248.0" height="85.2" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="710.7" font-size="16" fill="#6f5ea8" font-weight="700" textLength="108.5" lengthAdjust="spacing">sec. al XIX-lea</text>
<text x="342.0" y="729.0" font-size="13.5" fill="#5b6b83" textLength="43.5" lengthAdjust="spacing">Europa</text>
<text x="342.0" y="751.6" font-size="14.5" fill="#3a3226" textLength="97.0" lengthAdjust="spacing">eroii: ……………</text>
<rect x="590.0" y="682.7" width="248.0" height="85.2" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="606.0" y="710.7" font-size="16" fill="#6f5ea8" font-weight="700" textLength="104.2" lengthAdjust="spacing">sec. al XX-lea</text>
<text x="606.0" y="729.0" font-size="13.5" fill="#5b6b83" textLength="136.1" lengthAdjust="spacing">America, Europa, Asia</text>
<text x="606.0" y="751.6" font-size="14.5" fill="#3a3226" textLength="97.0" lengthAdjust="spacing">eroii: ……………</text>
<rect x="40" y="805.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="828.9" font-size="16" font-weight="700" fill="#ffffff">4. EROUL ANTIC, NAȚIONAL ȘI UNIVERSAL</text>
<rect x="40" y="839.9" width="820" height="199.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="872.9" font-size="15" fill="#3a3226" textLength="566.9" lengthAdjust="spacing">Completăm tabelul pe grupe (Aplicații, ex. 2) și prezentăm rezultatele în fața clasei.</text>
<rect x="62.0" y="891.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="912.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="83.2" lengthAdjust="spacing">Tipul de erou</text>
<text x="229.2" y="912.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="60.3" lengthAdjust="spacing">Înfățișare</text>
<text x="399.9" y="912.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="35.7" lengthAdjust="spacing">Fapte</text>
<text x="617.2" y="912.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="187.3" lengthAdjust="spacing">Ce le inspiră celorlalți oameni</text>
<line x1="62.0" y1="923.0" x2="838.0" y2="923.0" stroke="#e3dccb"/>
<text x="74.0" y="945.5" font-size="14.5" fill="#3a3226" textLength="69.7" lengthAdjust="spacing">Eroul antic</text>



<line x1="62.0" y1="955.8" x2="838.0" y2="955.8" stroke="#e3dccb"/>
<text x="74.0" y="978.3" font-size="14.5" fill="#3a3226" textLength="89.6" lengthAdjust="spacing">Eroul național</text>



<line x1="62.0" y1="988.7" x2="838.0" y2="988.7" stroke="#e3dccb"/>
<text x="74.0" y="1011.2" font-size="14.5" fill="#3a3226" textLength="97.2" lengthAdjust="spacing">Eroul universal</text>



<line x1="62.0" y1="1021.5" x2="838.0" y2="1021.5" stroke="#e3dccb"/>
<line x1="217.2" y1="891.4" x2="217.2" y2="1021.5" stroke="#e3dccb"/>
<line x1="387.9" y1="891.4" x2="387.9" y2="1021.5" stroke="#e3dccb"/>
<line x1="605.2" y1="891.4" x2="605.2" y2="1021.5" stroke="#e3dccb"/>
<text x="47.9" y="1071.0" font-size="11.5" fill="#5b6b83" textLength="804.1" lengthAdjust="spacing">Sursa: Manual Art 5, p. 123, rubrica Repere (cuvânt cu cuvânt), Explorare ex. 3 (axa cronologică) și Aplicații ex. 2 (tabelul). Interculturalitate. Coloanele de</text>
<text x="384.0" y="1087.7" font-size="11.5" fill="#5b6b83" textLength="132.0" lengthAdjust="spacing">completat rămân elevilor.</text>
</svg>
