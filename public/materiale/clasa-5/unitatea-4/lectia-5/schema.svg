<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 813" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="813" fill="#faf7f0"/>
<text x="373.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="152.9" lengthAdjust="spacing">Comparația</text>
<text x="236.4" y="74.4" font-size="14" fill="#5b6b83" textLength="427.3" lengthAdjust="spacing">Clasa a V-a · Unitatea IV, Lecția 5 · Manual, p. 115 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE COMPARAȚIA</text>
<rect x="40" y="128.6" width="820" height="80.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="87.4" lengthAdjust="spacing">Comparația</text>
<text x="153.7" y="162.6" font-size="16" fill="#10233f" textLength="237.6" lengthAdjust="spacing">este figura de stil care exprimă un</text>
<text x="395.6" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="156.0" lengthAdjust="spacing">raport de asemănare</text>
<text x="555.9" y="162.6" font-size="16" fill="#10233f" textLength="260.5" lengthAdjust="spacing">între două persoane, obiecte, acțiuni,</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="271.8" lengthAdjust="spacing">pentru a evidenția unul dintre termeni.</text>
<rect x="40" y="228.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="251.6" font-size="16" font-weight="700" fill="#ffffff">2. CUM ESTE ALCĂTUITĂ</text>
<rect x="40" y="262.6" width="820" height="203.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="280.6" width="248.0" height="109.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="308.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="86.2" lengthAdjust="spacing">comparatul</text>
<text x="78.0" y="331.9" font-size="14.5" fill="#3a3226" textLength="57.6" lengthAdjust="spacing">termenul</text>
<text x="139.5" y="331.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="46.4" lengthAdjust="spacing">descris</text>
<text x="78.0" y="355.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="45.0" lengthAdjust="spacing">labirint</text>
<rect x="326.0" y="280.6" width="248.0" height="109.7" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="342.0" y="308.6" font-size="16" fill="#9a7433" font-weight="700" textLength="165.6" lengthAdjust="spacing">elementul de legătură</text>
<text x="342.0" y="331.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="186.5" lengthAdjust="spacing">ca, precum, cât, asemenea cu,</text>
<text x="342.0" y="352.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="149.2" lengthAdjust="spacing">aidoma cu, întocmai ca,</text>
<text x="342.0" y="374.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="149.1" lengthAdjust="spacing">asemănător cu, la fel ca</text>
<rect x="590.0" y="280.6" width="248.0" height="109.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="606.0" y="308.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="96.0" lengthAdjust="spacing">comparantul</text>
<text x="606.0" y="331.9" font-size="14.5" fill="#3a3226" textLength="88.2" lengthAdjust="spacing">termenul care</text>
<text x="698.1" y="331.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="115.7" lengthAdjust="spacing">ajută la descriere</text>
<text x="606.0" y="355.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="62.9" lengthAdjust="spacing">păienjeniș</text>
<text x="62.0" y="419.3" font-size="15" fill="#3a3226" textLength="121.3" lengthAdjust="spacing">Cei doi termeni au</text>
<text x="187.4" y="419.3" font-size="15" fill="#3a3226" font-weight="700" textLength="120.6" lengthAdjust="spacing">trăsături comune</text>
<text x="308.0" y="419.3" font-size="15" fill="#3a3226" textLength="194.7" lengthAdjust="spacing">: labirintul și păienjenișul sunt</text>
<text x="506.7" y="419.3" font-size="15" fill="#10233f" font-style="italic" textLength="294.8" lengthAdjust="spacing">întortocheate, încâlcite, complicate, derutante</text>
<text x="801.5" y="419.3" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="444.1" font-size="15" fill="#3a3226" textLength="153.4" lengthAdjust="spacing">Comparatul poate fi un</text>
<text x="219.5" y="444.1" font-size="15" fill="#3a3226" font-weight="700" textLength="72.9" lengthAdjust="spacing">substantiv</text>
<text x="292.4" y="444.1" font-size="15" fill="#3a3226" textLength="24.4" lengthAdjust="spacing">, un</text>
<text x="320.9" y="444.1" font-size="15" fill="#3a3226" font-weight="700" textLength="55.0" lengthAdjust="spacing">adjectiv</text>
<text x="380.0" y="444.1" font-size="15" fill="#3a3226" textLength="43.6" lengthAdjust="spacing">sau un</text>
<text x="427.7" y="444.1" font-size="15" fill="#3a3226" font-weight="700" textLength="31.5" lengthAdjust="spacing">verb</text>
<text x="459.2" y="444.1" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="486.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="509.6" font-size="16" font-weight="700" fill="#ffffff">3. EXEMPLE</text>
<rect x="40" y="520.5" width="820" height="241.8" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="538.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="560.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="73.7" lengthAdjust="spacing">Comparația</text>
<text x="462.0" y="560.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="74.7" lengthAdjust="spacing">Comparatul</text>
<text x="656.0" y="560.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="82.9" lengthAdjust="spacing">Comparantul</text>
<line x1="62.0" y1="570.1" x2="838.0" y2="570.1" stroke="#e3dccb"/>
<text x="74.0" y="592.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="214.9" lengthAdjust="spacing">Coada lui puternică șfichiuia aerul</text>
<text x="292.8" y="592.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="64.7" lengthAdjust="spacing">ca un bici</text>
<text x="357.5" y="592.6" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<text x="462.0" y="592.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="51.9" lengthAdjust="spacing">șfichiuia</text>
<text x="517.8" y="592.6" font-size="14.5" fill="#3a3226" textLength="36.8" lengthAdjust="spacing">(verb)</text>
<text x="656.0" y="592.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="41.9" lengthAdjust="spacing">un bici</text>
<line x1="62.0" y1="602.9" x2="838.0" y2="602.9" stroke="#e3dccb"/>
<text x="74.0" y="625.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="201.4" lengthAdjust="spacing">Minotaurul avea coarne ascuțite</text>
<text x="279.3" y="625.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="68.6" lengthAdjust="spacing">ca o suliță</text>
<text x="347.9" y="625.4" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<text x="462.0" y="625.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="48.3" lengthAdjust="spacing">ascuțite</text>
<text x="514.2" y="625.4" font-size="14.5" fill="#3a3226" textLength="57.7" lengthAdjust="spacing">(adjectiv)</text>
<text x="656.0" y="625.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="45.7" lengthAdjust="spacing">o suliță</text>
<line x1="62.0" y1="635.8" x2="838.0" y2="635.8" stroke="#e3dccb"/>
<text x="74.0" y="658.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="136.4" lengthAdjust="spacing">Labirintul avea galerii</text>
<text x="214.4" y="658.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="109.3" lengthAdjust="spacing">ca un păienjeniș</text>
<text x="323.7" y="658.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<text x="462.0" y="658.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="39.3" lengthAdjust="spacing">galerii</text>
<text x="505.2" y="658.3" font-size="14.5" fill="#3a3226" textLength="73.7" lengthAdjust="spacing">(substantiv)</text>
<text x="656.0" y="658.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="83.1" lengthAdjust="spacing">un păienjeniș</text>
<line x1="62.0" y1="668.6" x2="838.0" y2="668.6" stroke="#e3dccb"/>
<line x1="450.0" y1="538.5" x2="450.0" y2="668.6" stroke="#e3dccb"/>
<line x1="644.0" y1="538.5" x2="644.0" y2="668.6" stroke="#e3dccb"/>
<rect x="62.0" y="682.6" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="709.1" font-size="14.5" fill="#10233f" font-weight="700" textLength="242.7" lengthAdjust="spacing">Comparații pe care le folosim zilnic:</text>
<text x="78.0" y="728.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="285.9" lengthAdjust="spacing">albastru ca cerul, roșu ca focul, verde ca iarba</text>
<text x="363.9" y="728.0" font-size="14.5" fill="#3a3226" textLength="257.4" lengthAdjust="spacing">: le recunosc, dar în scris caut comparații</text>
<text x="625.2" y="728.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="21.8" lengthAdjust="spacing">noi</text>
<text x="647.0" y="728.0" font-size="14.5" fill="#3a3226" textLength="102.5" lengthAdjust="spacing">, surprinzătoare.</text>
<text x="161.2" y="793.8" font-size="11.5" fill="#5b6b83" textLength="577.5" lengthAdjust="spacing">Sursa: Manual Art 5, p. 115, rubrica Repere și schema comparației. Unele exemple sunt create pentru aceste notițe.</text>
</svg>
