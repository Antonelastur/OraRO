<line x1="294.8" y1="1095.0" x2="294.8" y2="1422.2" stroke="#e3dccb"/>
<text x="44.2" y="1471.7" font-size="11.5" fill="#5b6b83" textLength="811.6" lengthAdjust="spacing">Sursa: Manual Art 5, p. 112, rubrica Repere (cuvânt cu cuvânt), Explorare ex. 1 (harta), ex. 3 (sensul cuvântului „erou”) și ex. 4 (trăsăturile). Harta și coloana</text>
<text x="283.5" y="1488.4" font-size="11.5" fill="#5b6b83" textLength="332.9" lengthAdjust="spacing">„Fragmentul din text” sunt modele goale, de completat de elevi.</text>
