<rect x="40" y="1009.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1032.5" font-size="16" font-weight="700" fill="#ffffff">4. TRĂSĂTURILE LUI TEZEU</text>
<rect x="40" y="1043.5" width="820" height="396.7" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1076.5" font-size="15" fill="#3a3226" textLength="602.8" lengthAdjust="spacing">Lucrez în perechi: găsesc în text fragmentul care ilustrează fiecare trăsătură a lui Tezeu.</text>
<rect x="62.0" y="1095.0" width="776.0" height="31.6" fill="#efeaf8"/>
