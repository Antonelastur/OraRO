<text x="306.8" y="1116.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="123.4" lengthAdjust="spacing">Fragmentul din text</text>
<line x1="62.0" y1="1126.6" x2="838.0" y2="1126.6" stroke="#e3dccb"/>
