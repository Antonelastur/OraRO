<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1508" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1508" fill="#faf7f0"/>
<text x="372.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="155.8" lengthAdjust="spacing">Personajele</text>
<text x="212.5" y="74.4" font-size="14" fill="#5b6b83" textLength="475.1" lengthAdjust="spacing">Clasa a V-a · Unitatea IV, Lecția 3 · Manual, pp. 112-113 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. PERSONAJELE LEGENDELOR GRECEȘTI</text>
<rect x="40" y="128.6" width="820" height="254.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" textLength="282.4" lengthAdjust="spacing">În legendele grecești, personajele sunt</text>
<text x="348.7" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="22.0" lengthAdjust="spacing">zei</text>
<text x="370.7" y="162.6" font-size="16" fill="#10233f" textLength="4.5" lengthAdjust="spacing">,</text>
<text x="379.5" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="102.3" lengthAdjust="spacing">eroi (semizei)</text>
<text x="486.2" y="162.6" font-size="16" fill="#10233f" textLength="11.9" lengthAdjust="spacing">și</text>
<text x="502.4" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="124.9" lengthAdjust="spacing">oameni obișnuiți</text>
<text x="627.3" y="162.6" font-size="16" fill="#10233f" textLength="4.5" lengthAdjust="spacing">.</text>
<rect x="62.0" y="181.4" width="776.0" height="63.9" rx="12" fill="#f3efe4"/><text x="78.0" y="207.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="25.3" lengthAdjust="spacing">Zeii</text>
<text x="107.2" y="207.9" font-size="14.5" fill="#3a3226" textLength="671.3" lengthAdjust="spacing">sunt divinități adorate de greci și trăiesc pe cel mai înalt munte din Grecia, Olimp. Aceștia seamănă cu</text>
<text x="78.0" y="228.9" font-size="14.5" fill="#3a3226" textLength="614.2" lengthAdjust="spacing">oamenii, se amestecă printre ei, îi pot transforma pe muritori în monștri și sunt părinții eroilor.</text>
<rect x="62.0" y="259.3" width="776.0" height="105.9" rx="12" fill="#f3efe4"/><text x="78.0" y="285.8" font-size="14.5" fill="#3a3226" textLength="147.6" lengthAdjust="spacing">Eroii mai sunt numiți și</text>
<text x="229.5" y="285.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="52.7" lengthAdjust="spacing">semizei</text>
<text x="282.2" y="285.8" font-size="14.5" fill="#3a3226" textLength="511.2" lengthAdjust="spacing">, pentru că provin din unirea unui zeu cu o muritoare. Nobili prin naștere, eroii</text>
<text x="78.0" y="306.8" font-size="14.5" fill="#3a3226" textLength="732.6" lengthAdjust="spacing">sunt recunoscuți de ceilalți abia după o faptă excepțională, imposibil de îndeplinit de către un om obișnuit, cum</text>
<text x="78.0" y="327.8" font-size="14.5" fill="#3a3226" textLength="713.6" lengthAdjust="spacing">ar fi uciderea unui monstru care înspăimântă lumea. Deși probează calități neobișnuite, de multe ori destinul</text>
<text x="78.0" y="348.8" font-size="14.5" fill="#3a3226" textLength="337.8" lengthAdjust="spacing">eroilor este nefericit, depinzând de capriciile zeilor.</text>
<rect x="40" y="403.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="426.2" font-size="16" font-weight="700" fill="#ffffff">2. EROUL GREC</text>
<rect x="40" y="437.2" width="820" height="176.7" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="471.2" font-size="16" fill="#10233f" font-weight="700" textLength="76.3" lengthAdjust="spacing">Eroul grec</text>
<text x="142.7" y="471.2" font-size="16" fill="#10233f" textLength="679.9" lengthAdjust="spacing">este un simbol civilizator, acela al luptei contra dezordinii și a barbariei. Tezeu și Heracle sunt</text>
<text x="62.0" y="494.4" font-size="16" fill="#10233f" textLength="318.4" lengthAdjust="spacing">singurii eroi recunoscuți de toți vechii greci.</text>
<rect x="62.0" y="513.2" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="539.7" font-size="14.5" fill="#10233f" font-weight="700" textLength="118.8" lengthAdjust="spacing">Istoria cuvântului</text>
<text x="78.0" y="558.5" font-size="14.5" fill="#3a3226" textLength="58.8" lengthAdjust="spacing">Cuvântul</text>
<text x="140.7" y="558.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="29.8" lengthAdjust="spacing">erou</text>
<text x="174.5" y="558.5" font-size="14.5" fill="#3a3226" textLength="227.1" lengthAdjust="spacing">vine în română din limba franceză,</text>
<text x="405.5" y="558.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="37.2" lengthAdjust="spacing">héros</text>
<text x="442.8" y="558.5" font-size="14.5" fill="#3a3226" textLength="187.6" lengthAdjust="spacing">, dar și din limba latină, de la</text>
<text x="634.3" y="558.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="37.2" lengthAdjust="spacing">heros</text>
<text x="671.5" y="558.5" font-size="14.5" fill="#3a3226" textLength="109.0" lengthAdjust="spacing">, unde înseamnă</text>
<text x="78.0" y="579.6" font-size="14.5" fill="#3a3226" textLength="527.4" lengthAdjust="spacing">„semizeu sau persoană care s-a distins într-o bătălie, într-o împrejurare dificilă”.</text>
<rect x="40" y="633.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="656.9" font-size="16" font-weight="700" fill="#ffffff">3. HARTA PERSONAJELOR</text>
<rect x="40" y="667.9" width="820" height="321.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="700.9" font-size="15" fill="#3a3226" textLength="259.1" lengthAdjust="spacing">Desenez în caiet harta: scriu în centru</text>
<text x="325.2" y="700.9" font-size="15" fill="#3a3226" font-weight="700" textLength="42.6" lengthAdjust="spacing">Tezeu</text>
<text x="371.9" y="700.9" font-size="15" fill="#3a3226" textLength="11.2" lengthAdjust="spacing">și</text>
<text x="387.1" y="700.9" font-size="15" fill="#3a3226" font-weight="700" textLength="43.5" lengthAdjust="spacing">Minos</text>
<text x="430.6" y="700.9" font-size="15" fill="#3a3226" textLength="394.2" lengthAdjust="spacing">, notez în jur celelalte personaje din text și arăt prin săgeți</text>
<text x="62.0" y="722.7" font-size="15" fill="#3a3226" textLength="135.6" lengthAdjust="spacing">legăturile dintre ele.</text>
<rect x="62.0" y="741.2" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="769.2" font-size="16" fill="#0d9c92" font-weight="700" textLength="50.7" lengthAdjust="spacing">TEZEU</text>
<text x="78.0" y="792.5" font-size="14.5" fill="#3a3226" textLength="98.6" lengthAdjust="spacing">în centrul hărții</text>
<rect x="458.0" y="741.2" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="769.2" font-size="16" fill="#6f5ea8" font-weight="700" textLength="52.6" lengthAdjust="spacing">MINOS</text>
<text x="474.0" y="792.5" font-size="14.5" fill="#3a3226" textLength="98.6" lengthAdjust="spacing">în centrul hărții</text>
<rect x="62.0" y="822.8" width="248.0" height="66.3" rx="12" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
<text x="78.0" y="849.8" font-size="15" fill="#10233f" font-weight="700" textLength="156.0" lengthAdjust="spacing">personajul: ……………</text>
<text x="78.0" y="872.8" font-size="14.5" fill="#3a3226" textLength="122.6" lengthAdjust="spacing">legătura: ……………</text>
