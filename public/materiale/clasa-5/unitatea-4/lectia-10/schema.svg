<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="960" height="400" fill="#faf7f0"/>
  <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">A întreba, a solicita, a felicita</text>
  <text x="480" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV, Lecția 10 · Atitudini comunicative. Acte de limbaj</text>
  <rect x="36" y="100" width="170" height="76" rx="12" fill="#3b5fa8"/>
  <text x="121" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A ÎNTREBA</text>
  <rect x="220" y="100" width="240" height="76" rx="12" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="240" y="128" font-size="11.5" fill="#5b6b83">ce fac</text>
  <text x="240" y="152" font-size="13" fill="#10233f">Cer o informație.</text>
  <rect x="474" y="100" width="450" height="76" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="1.5"/>
  <text x="494" y="128" font-size="11.5" fill="#5b6b83">cum sună</text>
  <text x="494" y="152" font-size="12.5" fill="#10233f">Unde e sala de sport? Ai văzut filmul?</text>
  <rect x="36" y="192" width="170" height="76" rx="12" fill="#a1417e"/>
  <text x="121" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A SOLICITA</text>
  <rect x="220" y="192" width="240" height="76" rx="12" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="240" y="220" font-size="11.5" fill="#5b6b83">ce fac</text>
  <text x="240" y="244" font-size="13" fill="#10233f">Cer ceva sau ajutor.</text>
  <rect x="474" y="192" width="450" height="76" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="1.5"/>
  <text x="494" y="220" font-size="11.5" fill="#5b6b83">cum sună</text>
  <text x="494" y="244" font-size="12.5" fill="#10233f">Poți să mă ajuți? Vă rog să îmi explicați.</text>
  <rect x="36" y="284" width="170" height="76" rx="12" fill="#1c7f5e"/>
  <text x="121" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A FELICITA</text>
  <rect x="220" y="284" width="240" height="76" rx="12" fill="#ffffff" stroke="#e2d9c4" stroke-width="1.5"/>
  <text x="240" y="312" font-size="11.5" fill="#5b6b83">ce fac</text>
  <text x="240" y="336" font-size="13" fill="#10233f">Apreciez o reușită.</text>
  <rect x="474" y="284" width="450" height="76" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="1.5"/>
  <text x="494" y="312" font-size="11.5" fill="#5b6b83">cum sună</text>
  <text x="494" y="336" font-size="12.5" fill="#10233f">Te felicit! Bravo, ai muncit pentru asta.</text>
  <rect x="36" y="372" width="888" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="58" y="397" font-size="13" font-weight="700" fill="#10233f">Ce le face politicoase</text>
  <text x="58" y="417" font-size="12" fill="#3d4a5f">formula de adresare și tonul. Aceeași cerere poate suna a rugăminte sau a poruncă.</text>
</svg>
