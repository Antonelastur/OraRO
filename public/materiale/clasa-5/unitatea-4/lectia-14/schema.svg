<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Adjectivul. Articolul demonstrativ</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV, Lecția 13</text>

  <rect x="150" y="95" width="600" height="80" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="450" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Adjectivul</text>
  <text font-size="12" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="147">Arată o însușire a substantivului și se acordă cu el în gen și</tspan>
    <tspan x="450" y="164">număr. Ex.: erou curajos, eroi curajoși.</tspan>
  </text>

  <rect x="180" y="195" width="540" height="70" rx="14" fill="#f1ecfa"/>
  <text x="450" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Articolul demonstrativ (cel, cea, cei, cele)</text>
  <text x="450" y="242" text-anchor="middle" font-size="11.5" fill="#3a3226" font-style="italic">reia substantivul, stă înaintea adjectivului: eroul cel curajos</text>

  <text x="450" y="304" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 13, p. 130</text>
</svg>
