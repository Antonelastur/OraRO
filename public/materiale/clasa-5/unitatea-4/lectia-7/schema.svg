<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="960" height="400" fill="#faf7f0"/>
  <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Cum e construit un text care te învață să faci ceva</text>
  <text x="480" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV, Lecția 7 · Textul explicativ</text>
  <rect x="36" y="100" width="290" height="152" rx="16" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="56" y="130" font-size="14" font-weight="700" fill="#10233f">Ce îți trebuie</text>
  <text x="56" y="156" font-size="12" fill="#3d4a5f">lista de la început:</text>
  <text x="56" y="176" font-size="12" fill="#3d4a5f">ingrediente, materiale,</text>
  <text x="56" y="196" font-size="12" fill="#3d4a5f">unelte</text>
  <text x="56" y="216" font-size="12" fill="#3d4a5f"></text>
  <text x="56" y="236" font-size="12" fill="#3d4a5f">ca să știi înainte</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">să te apuci</text>
  <rect x="340" y="100" width="290" height="152" rx="16" fill="#ffffff" stroke="#a1417e" stroke-width="2.5"/>
  <text x="360" y="130" font-size="14" font-weight="700" fill="#10233f">Pașii, în ordine</text>
  <text x="360" y="156" font-size="12" fill="#3d4a5f">numerotați sau marcați</text>
  <text x="360" y="176" font-size="12" fill="#3d4a5f"></text>
  <text x="360" y="196" font-size="12" fill="#3d4a5f">ordinea nu e opțională:</text>
  <text x="360" y="216" font-size="12" fill="#3d4a5f">nu poți coace înainte</text>
  <text x="360" y="236" font-size="12" fill="#3d4a5f">să amesteci</text>
  <rect x="644" y="100" width="280" height="152" rx="16" fill="#ffffff" stroke="#1c7f5e" stroke-width="2.5"/>
  <text x="664" y="130" font-size="14" font-weight="700" fill="#10233f">Verbele care comandă</text>
  <text x="664" y="156" font-size="12" fill="#3d4a5f">la imperativ:</text>
  <text x="664" y="176" font-size="12" fill="#3d4a5f">taie, amestecă, adaugă</text>
  <text x="664" y="196" font-size="12" fill="#3d4a5f"></text>
  <text x="664" y="216" font-size="12" fill="#3d4a5f">sau la infinitiv:</text>
  <text x="664" y="236" font-size="12" fill="#3d4a5f">a se amesteca bine</text>
  <rect x="36" y="274" width="888" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="58" y="299" font-size="13" font-weight="700" fill="#10233f">Cum îl recunoști</text>
  <text x="58" y="319" font-size="12" fill="#3d4a5f">răspunde la întrebarea „cum se face?”. Dacă poți urma textul ca pe o rețetă, e explicativ.</text>
  <rect x="36" y="338" width="888" height="56" rx="14" fill="#ffffff" stroke="#e2d9c4" stroke-width="2"/>
  <text x="58" y="363" font-size="13" font-weight="700" fill="#10233f">Unde îl întâlnești</text>
  <text x="58" y="383" font-size="12" fill="#3d4a5f">rețete, instrucțiuni de montaj, reguli de joc, indicații pentru un experiment.</text>
</svg>
