<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2008" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="2008" fill="#faf7f0"/>
<text x="250.5" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="393.5" lengthAdjust="spacing">Text auxiliar. „Eu sunt Malala”</text>
<text x="211.0" y="74.4" font-size="14" fill="#5b6b83" textLength="478.0" lengthAdjust="spacing">Clasa a V-a · Unitatea IV, Lecția 8 · Manual, pp. 120-121 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. AUTOAREA ȘI CARTEA</text>
<rect x="40" y="128.6" width="820" height="420.8" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="380.0" height="154.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="174.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="86.3" lengthAdjust="spacing">AUTOAREA</text>
<text x="78.0" y="197.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="116.0" lengthAdjust="spacing">Malala Yousafzai</text>
<text x="194.0" y="197.9" font-size="14.5" fill="#3a3226" textLength="190.4" lengthAdjust="spacing">, născută în 1997 în Pakistan.</text>
<text x="78.0" y="221.8" font-size="14.5" fill="#3a3226" textLength="336.4" lengthAdjust="spacing">A început încă de la vârsta de zece ani o campanie</text>
<text x="78.0" y="242.8" font-size="14.5" fill="#3a3226" textLength="273.1" lengthAdjust="spacing">pentru educația fetelor, fiindcă talibanii le</text>
<text x="78.0" y="263.9" font-size="14.5" fill="#3a3226" textLength="305.1" lengthAdjust="spacing">interziseseră acestora accesul la învățământul</text>
<text x="78.0" y="284.9" font-size="14.5" fill="#3a3226" textLength="44.3" lengthAdjust="spacing">public.</text>
<rect x="458.0" y="146.6" width="380.0" height="154.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="474.0" y="174.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="64.0" lengthAdjust="spacing">CARTEA</text>
<text x="474.0" y="197.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="98.5" lengthAdjust="spacing">Eu sunt Malala</text>
<text x="576.4" y="197.9" font-size="14.5" fill="#3a3226" textLength="157.8" lengthAdjust="spacing">este scrisă împreună cu</text>
<text x="738.2" y="197.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="52.0" lengthAdjust="spacing">Patricia</text>
<text x="474.0" y="218.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="79.1" lengthAdjust="spacing">McCormick</text>
<text x="553.1" y="218.9" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<text x="474.0" y="242.8" font-size="14.5" fill="#3a3226" textLength="344.7" lengthAdjust="spacing">Fragmentul din manual face parte din această carte.</text>
<rect x="62.0" y="315.2" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="336.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="29.5" lengthAdjust="spacing">Anul</text>
<text x="198.2" y="336.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="94.1" lengthAdjust="spacing">Ce se întâmplă</text>
<line x1="62.0" y1="346.8" x2="838.0" y2="346.8" stroke="#e3dccb"/>
<text x="74.0" y="369.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="36.8" lengthAdjust="spacing">2009</text>
<text x="198.2" y="369.3" font-size="14.5" fill="#3a3226" textLength="616.9" lengthAdjust="spacing">Toate școlile de fete din Pakistan trebuiau închise. Malala merge la școala particulară a tatălui</text>
<text x="198.2" y="390.3" font-size="14.5" fill="#3a3226" textLength="15.6" lengthAdjust="spacing">ei.</text>
<line x1="62.0" y1="400.7" x2="838.0" y2="400.7" stroke="#e3dccb"/>
<text x="74.0" y="423.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="33.2" lengthAdjust="spacing">2012</text>
<text x="198.2" y="423.2" font-size="14.5" fill="#3a3226" textLength="620.3" lengthAdjust="spacing">În timp ce se întorcea acasă cu autobuzul școlar, este împușcată. Din fericire, supraviețuiește.</text>
<line x1="62.0" y1="433.5" x2="838.0" y2="433.5" stroke="#e3dccb"/>
<text x="74.0" y="456.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="33.8" lengthAdjust="spacing">2014</text>
<text x="198.2" y="456.0" font-size="14.5" fill="#3a3226" textLength="573.4" lengthAdjust="spacing">Primește Premiul Nobel pentru Pace, fiind cea mai tânără deținătoare a acestui premiu.</text>
<line x1="62.0" y1="466.4" x2="838.0" y2="466.4" stroke="#e3dccb"/>
<text x="74.0" y="488.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="33.3" lengthAdjust="spacing">2015</text>
<text x="198.2" y="488.9" font-size="14.5" fill="#3a3226" textLength="326.5" lengthAdjust="spacing">În semn de omagiu, numele ei este dat unei stele.</text>
<line x1="62.0" y1="499.2" x2="838.0" y2="499.2" stroke="#e3dccb"/>
<line x1="186.2" y1="315.2" x2="186.2" y2="499.2" stroke="#e3dccb"/>
<text x="62.0" y="527.2" font-size="14" fill="#5b6b83" textLength="690.1" lengthAdjust="spacing">Pentru că talibanii au continuat cu amenințările, Malala și, mai apoi, familia ei s-au refugiat în Marea Britanie.</text>
<rect x="40" y="569.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="592.4" font-size="16" font-weight="700" fill="#ffffff">2. FIȘA FRAGMENTULUI</text>
<rect x="40" y="603.4" width="820" height="262.0" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="621.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="642.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.8" lengthAdjust="spacing">Întrebarea</text>
<text x="283.5" y="642.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="109.0" lengthAdjust="spacing">Ce găsesc în text</text>
<line x1="62.0" y1="653.0" x2="838.0" y2="653.0" stroke="#e3dccb"/>
<text x="74.0" y="675.5" font-size="14.5" fill="#3a3226" textLength="147.6" lengthAdjust="spacing">Cine sunt persoanele?</text>
<text x="74.0" y="696.5" font-size="14.5" fill="#3a3226" textLength="39.3" lengthAdjust="spacing">(ex. 1)</text>
<text x="283.5" y="675.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="45.1" lengthAdjust="spacing">Malala</text>
<text x="328.6" y="675.5" font-size="14.5" fill="#3a3226" textLength="118.0" lengthAdjust="spacing">, care povestește;</text>
<text x="450.5" y="675.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="46.0" lengthAdjust="spacing">tatăl ei</text>
<text x="496.5" y="675.5" font-size="14.5" fill="#3a3226" textLength="44.8" lengthAdjust="spacing">, numit</text>
<text x="545.2" y="675.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="26.9" lengthAdjust="spacing">Aba</text>
<text x="572.1" y="675.5" font-size="14.5" fill="#3a3226" textLength="16.6" lengthAdjust="spacing">; o</text>
<text x="592.6" y="675.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="150.5" lengthAdjust="spacing">jurnalistă pakistaneză</text>
<text x="747.1" y="675.5" font-size="14.5" fill="#3a3226" textLength="62.2" lengthAdjust="spacing">care trăia</text>
<text x="283.5" y="696.5" font-size="14.5" fill="#3a3226" textLength="291.6" lengthAdjust="spacing">în Alaska; talibanii, despre care se vorbește.</text>
<line x1="62.0" y1="706.8" x2="838.0" y2="706.8" stroke="#e3dccb"/>
<text x="74.0" y="729.3" font-size="14.5" fill="#3a3226" textLength="140.3" lengthAdjust="spacing">Unde și când? (ex. 2)</text>
<text x="283.5" y="729.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="136.1" lengthAdjust="spacing">La începutul lui 2012</text>
<text x="419.6" y="729.3" font-size="14.5" fill="#3a3226" textLength="19.7" lengthAdjust="spacing">, în</text>
<text x="443.2" y="729.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="52.7" lengthAdjust="spacing">Karachi</text>
<text x="495.9" y="729.3" font-size="14.5" fill="#3a3226" textLength="294.1" lengthAdjust="spacing">, unde Malala și tatăl ei erau invitații GEO TV.</text>
<line x1="62.0" y1="739.7" x2="838.0" y2="739.7" stroke="#e3dccb"/>
<text x="74.0" y="762.2" font-size="14.5" fill="#3a3226" textLength="154.6" lengthAdjust="spacing">Pentru ce luptă Malala?</text>
<text x="74.0" y="783.2" font-size="14.5" fill="#3a3226" textLength="42.2" lengthAdjust="spacing">(ex. 3)</text>
<text x="283.5" y="762.2" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="793.6" x2="838.0" y2="793.6" stroke="#e3dccb"/>
<text x="74.0" y="816.1" font-size="14.5" fill="#3a3226" textLength="158.7" lengthAdjust="spacing">La ce pericole o expune</text>
<text x="74.0" y="837.1" font-size="14.5" fill="#3a3226" textLength="102.1" lengthAdjust="spacing">lupta ei? (ex. 4)</text>
<text x="283.5" y="816.1" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="847.4" x2="838.0" y2="847.4" stroke="#e3dccb"/>
<line x1="271.5" y1="621.4" x2="271.5" y2="847.4" stroke="#e3dccb"/>
<rect x="40" y="885.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="908.4" font-size="16" font-weight="700" fill="#ffffff">3. IDEEA PRINCIPALĂ A FIECĂRUI FRAGMENT</text>
<rect x="40" y="919.4" width="820" height="319.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="952.4" font-size="15" fill="#3a3226" textLength="758.5" lengthAdjust="spacing">Textul se împarte în șase fragmente (ex. 5). Elevul care joacă rolul profesorului scrie pe tablă ideea principală a</text>
<text x="62.0" y="974.2" font-size="15" fill="#3a3226" textLength="227.2" lengthAdjust="spacing">fragmentului, iar eu o copiez aici.</text>
<rect x="62.0" y="992.7" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1014.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="72.6" lengthAdjust="spacing">Fragmentul</text>
<text x="229.2" y="1014.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="101.8" lengthAdjust="spacing">Ideea principală</text>
<line x1="62.0" y1="1024.2" x2="838.0" y2="1024.2" stroke="#e3dccb"/>
<text x="74.0" y="1046.8" font-size="14.5" fill="#3a3226" textLength="5.7" lengthAdjust="spacing">1</text>
<text x="229.2" y="1046.8" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1057.1" x2="838.0" y2="1057.1" stroke="#e3dccb"/>
<text x="74.0" y="1079.6" font-size="14.5" fill="#3a3226" textLength="8.6" lengthAdjust="spacing">2</text>
<text x="229.2" y="1079.6" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1089.9" x2="838.0" y2="1089.9" stroke="#e3dccb"/>
<text x="74.0" y="1112.4" font-size="14.5" fill="#3a3226" textLength="8.7" lengthAdjust="spacing">3</text>
<text x="229.2" y="1112.4" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1122.8" x2="838.0" y2="1122.8" stroke="#e3dccb"/>
<text x="74.0" y="1145.3" font-size="14.5" fill="#3a3226" textLength="9.1" lengthAdjust="spacing">4</text>
<text x="229.2" y="1145.3" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1155.6" x2="838.0" y2="1155.6" stroke="#e3dccb"/>
<text x="74.0" y="1178.1" font-size="14.5" fill="#3a3226" textLength="8.5" lengthAdjust="spacing">5</text>
<text x="229.2" y="1178.1" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1188.5" x2="838.0" y2="1188.5" stroke="#e3dccb"/>
<text x="74.0" y="1211.0" font-size="14.5" fill="#3a3226" textLength="8.7" lengthAdjust="spacing">6</text>
<text x="229.2" y="1211.0" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1221.3" x2="838.0" y2="1221.3" stroke="#e3dccb"/>
<line x1="217.2" y1="992.7" x2="217.2" y2="1221.3" stroke="#e3dccb"/>
<rect x="40" y="1259.3" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1282.3" font-size="16" font-weight="700" fill="#ffffff">4. CUVINTE NOI DIN NOTELE DE SUBSOL</text>
<rect x="40" y="1293.3" width="820" height="327.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="1311.3" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1332.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">Cuvântul</text>
<text x="260.2" y="1332.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="135.0" lengthAdjust="spacing">Explicația din manual</text>
<line x1="62.0" y1="1342.9" x2="838.0" y2="1342.9" stroke="#e3dccb"/>
<text x="74.0" y="1365.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="45.4" lengthAdjust="spacing">taliban</text>
<text x="123.3" y="1365.4" font-size="14.5" fill="#3a3226" textLength="41.9" lengthAdjust="spacing">(s. m.)</text>
<text x="260.2" y="1365.4" font-size="14.5" fill="#3a3226" textLength="522.1" lengthAdjust="spacing">membru al unui grup care militează pentru mișcarea religioasă fundamentalistă</text>
<text x="260.2" y="1386.4" font-size="14.5" fill="#3a3226" textLength="548.6" lengthAdjust="spacing">islamică, în care femeilor le este interzis să studieze, să iasă neînsoțite în public, să</text>
<text x="260.2" y="1407.4" font-size="14.5" fill="#3a3226" textLength="142.9" lengthAdjust="spacing">umble fără văl pe cap</text>
<line x1="62.0" y1="1417.8" x2="838.0" y2="1417.8" stroke="#e3dccb"/>
<text x="74.0" y="1440.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="50.8" lengthAdjust="spacing">Karachi</text>
<text x="260.2" y="1440.3" font-size="14.5" fill="#3a3226" textLength="176.5" lengthAdjust="spacing">oraș din sudul Pakistanului</text>
<line x1="62.0" y1="1450.6" x2="838.0" y2="1450.6" stroke="#e3dccb"/>
<text x="74.0" y="1473.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="108.0" lengthAdjust="spacing">New York Times</text>
<text x="260.2" y="1473.1" font-size="14.5" fill="#3a3226" textLength="158.0" lengthAdjust="spacing">grup de presă american</text>
<line x1="62.0" y1="1483.5" x2="838.0" y2="1483.5" stroke="#e3dccb"/>
<text x="74.0" y="1506.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="23.7" lengthAdjust="spacing">jani</text>
<text x="260.2" y="1506.0" font-size="14.5" fill="#3a3226" textLength="184.1" lengthAdjust="spacing">„draga mea”, în pakistaneză</text>
<line x1="62.0" y1="1516.3" x2="838.0" y2="1516.3" stroke="#e3dccb"/>
<text x="74.0" y="1538.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="25.8" lengthAdjust="spacing">aba</text>
<text x="260.2" y="1538.8" font-size="14.5" fill="#3a3226" textLength="303.4" lengthAdjust="spacing">termen afectuos, în pakistaneză, pentru „tată”</text>
<line x1="62.0" y1="1549.2" x2="838.0" y2="1549.2" stroke="#e3dccb"/>
<text x="74.0" y="1571.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="45.8" lengthAdjust="spacing">paștun</text>
<text x="123.7" y="1571.7" font-size="14.5" fill="#3a3226" textLength="41.9" lengthAdjust="spacing">(s. m.)</text>
<text x="260.2" y="1571.7" font-size="14.5" fill="#3a3226" textLength="553.5" lengthAdjust="spacing">locuitor al unei provincii din nord-vestul Pakistanului; Malala precizează în cartea sa</text>
<text x="260.2" y="1592.7" font-size="14.5" fill="#3a3226" textLength="505.6" lengthAdjust="spacing">că paștunii sunt un popor pentru care onoarea reprezintă o valoare esențială</text>
<line x1="62.0" y1="1603.1" x2="838.0" y2="1603.1" stroke="#e3dccb"/>
<line x1="248.2" y1="1311.3" x2="248.2" y2="1603.1" stroke="#e3dccb"/>
<rect x="40" y="1641.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1664.1" font-size="16" font-weight="700" fill="#ffffff">5. TRĂSĂTURILE MALALEI</text>
<rect x="40" y="1675.1" width="820" height="265.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1708.1" font-size="15" fill="#3a3226" textLength="564.1" lengthAdjust="spacing">Recitesc ultimele opt alineate și justific fiecare trăsătură printr-un fragment (ex. 9).</text>
<rect x="62.0" y="1726.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1748.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="61.2" lengthAdjust="spacing">Trăsătura</text>
<text x="291.3" y="1748.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="99.1" lengthAdjust="spacing">Dovada din text</text>
<line x1="62.0" y1="1758.1" x2="838.0" y2="1758.1" stroke="#e3dccb"/>
<text x="74.0" y="1780.6" font-size="14.5" fill="#3a3226" textLength="32.8" lengthAdjust="spacing">curaj</text>
<text x="291.3" y="1780.6" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1791.0" x2="838.0" y2="1791.0" stroke="#e3dccb"/>
<text x="74.0" y="1813.5" font-size="14.5" fill="#3a3226" textLength="82.8" lengthAdjust="spacing">generozitate</text>
<text x="291.3" y="1813.5" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1823.8" x2="838.0" y2="1823.8" stroke="#e3dccb"/>
<text x="74.0" y="1846.3" font-size="14.5" fill="#3a3226" textLength="56.3" lengthAdjust="spacing">pacifism</text>
<text x="291.3" y="1846.3" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1856.7" x2="838.0" y2="1856.7" stroke="#e3dccb"/>
<text x="74.0" y="1879.2" font-size="14.5" fill="#3a3226" textLength="55.6" lengthAdjust="spacing">hotărâre</text>
<text x="291.3" y="1879.2" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1889.5" x2="838.0" y2="1889.5" stroke="#e3dccb"/>
<text x="74.0" y="1912.0" font-size="14.5" fill="#3a3226" textLength="73.1" lengthAdjust="spacing">solidaritate</text>
<text x="291.3" y="1912.0" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
