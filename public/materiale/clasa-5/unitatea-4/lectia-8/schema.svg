<line x1="279.3" y1="1726.6" x2="279.3" y2="1922.4" stroke="#e3dccb"/>
<text x="50.4" y="1971.9" font-size="11.5" fill="#5b6b83" textLength="799.2" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 120-121 (caseta de prezentare, notele de subsol cuvânt cu cuvânt, Discutarea textului ex. 1-5 și 9). Lecția nu are rubrica Repere.</text>
<text x="125.6" y="1988.5" font-size="11.5" fill="#5b6b83" textLength="648.8" lengthAdjust="spacing">Datele din tabel sunt reformulate după caseta de la p. 120. Locurile goale rămân elevilor, ideile principale se stabilesc la oră.</text>
