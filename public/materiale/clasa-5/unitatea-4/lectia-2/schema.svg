<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 996" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="996" fill="#faf7f0"/>
<text x="239.2" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="422.8" lengthAdjust="spacing">Timp, spațiu și acțiune. Legenda</text>
<text x="218.1" y="74.4" font-size="14" fill="#5b6b83" textLength="463.8" lengthAdjust="spacing">Clasa a V-a · Unitatea IV, Lecția 2 · Manual, pp. 110-111 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. LEGENDA</text>
<rect x="40" y="128.6" width="820" height="235.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="76.8" lengthAdjust="spacing">Legendele</text>
<text x="143.1" y="162.6" font-size="16" fill="#10233f" textLength="102.2" lengthAdjust="spacing">oferă explicații</text>
<text x="249.7" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="75.7" lengthAdjust="spacing">imaginare</text>
<text x="329.7" y="162.6" font-size="16" fill="#10233f" textLength="439.5" lengthAdjust="spacing">pentru originea universului, apariția plantelor și a animalelor, a</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="155.8" lengthAdjust="spacing">fenomenelor naturale.</text>
<text x="62.0" y="219.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="219.6" font-size="15" fill="#3a3226" textLength="190.7" lengthAdjust="spacing">La început s-au transmis prin</text>
<text x="268.9" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="53.2" lengthAdjust="spacing">viu grai</text>
<text x="322.2" y="219.6" font-size="15" fill="#3a3226" textLength="344.8" lengthAdjust="spacing">; apoi au fost culese de specialiști și circulă și în scris.</text>
<text x="62.0" y="244.3" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="244.3" font-size="15" fill="#3a3226" textLength="284.7" lengthAdjust="spacing">Când sunt povestite oral, povestitorii le pot</text>
<text x="362.9" y="244.3" font-size="15" fill="#3a3226" font-weight="700" textLength="61.6" lengthAdjust="spacing">modifica</text>
<text x="424.6" y="244.3" font-size="15" fill="#3a3226" textLength="390.4" lengthAdjust="spacing">; de aceea există mai multe variante ale aceleiași întâmplări.</text>
<rect x="62.0" y="262.9" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="289.4" font-size="14.5" fill="#10233f" font-weight="700" textLength="114.8" lengthAdjust="spacing">Legendele antice</text>
<text x="78.0" y="308.2" font-size="14.5" fill="#3a3226" textLength="134.3" lengthAdjust="spacing">sunt narațiuni în care</text>
<text x="216.2" y="308.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="222.9" lengthAdjust="spacing">zeii intervin în mod supranatural</text>
<text x="443.0" y="308.2" font-size="14.5" fill="#3a3226" textLength="335.8" lengthAdjust="spacing">în lumea oamenilor, iar întâmplările se petrec într-un</text>
<text x="782.7" y="308.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="32.0" lengthAdjust="spacing">timp</text>
<text x="78.0" y="329.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="117.0" lengthAdjust="spacing">foarte îndepărtat</text>
<text x="195.0" y="329.2" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<rect x="40" y="383.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="406.6" font-size="16" font-weight="700" fill="#ffffff">2. PERSONAJELE LEGENDEI</text>
<rect x="40" y="417.6" width="820" height="264.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="435.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="457.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="66.4" lengthAdjust="spacing">Personajul</text>
<text x="268.0" y="457.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.2" lengthAdjust="spacing">Cine este</text>
<line x1="62.0" y1="467.1" x2="838.0" y2="467.1" stroke="#e3dccb"/>
<text x="74.0" y="489.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="40.0" lengthAdjust="spacing">Tezeu</text>
<text x="268.0" y="489.6" font-size="14.5" fill="#3a3226" textLength="230.1" lengthAdjust="spacing">eroul; fiul regelui Atenei, dar de fapt</text>
<text x="502.0" y="489.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="55.2" lengthAdjust="spacing">semizeu</text>
<text x="557.3" y="489.6" font-size="14.5" fill="#3a3226" textLength="109.0" lengthAdjust="spacing">, fiul lui Poseidon</text>
<line x1="62.0" y1="500.0" x2="838.0" y2="500.0" stroke="#e3dccb"/>
<text x="74.0" y="522.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="33.4" lengthAdjust="spacing">Egeu</text>
<text x="268.0" y="522.5" font-size="14.5" fill="#3a3226" textLength="84.8" lengthAdjust="spacing">regele Atenei</text>
<line x1="62.0" y1="532.8" x2="838.0" y2="532.8" stroke="#e3dccb"/>
<text x="74.0" y="555.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="42.0" lengthAdjust="spacing">Minos</text>
<text x="268.0" y="555.3" font-size="14.5" fill="#3a3226" textLength="304.1" lengthAdjust="spacing">regele Cretei, care închide Minotaurul în labirint</text>
<line x1="62.0" y1="565.7" x2="838.0" y2="565.7" stroke="#e3dccb"/>
<text x="74.0" y="588.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="53.5" lengthAdjust="spacing">Ariadna</text>
<text x="268.0" y="588.2" font-size="14.5" fill="#3a3226" textLength="337.1" lengthAdjust="spacing">fiica lui Minos, care îi dă lui Tezeu un ghem de sfoară</text>
<line x1="62.0" y1="598.5" x2="838.0" y2="598.5" stroke="#e3dccb"/>
<text x="74.0" y="621.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="76.7" lengthAdjust="spacing">Minotaurul</text>
<text x="268.0" y="621.0" font-size="14.5" fill="#3a3226" textLength="333.4" lengthAdjust="spacing">monstrul din labirint, hrănit cu tineri aduși din Atena</text>
<line x1="62.0" y1="631.4" x2="838.0" y2="631.4" stroke="#e3dccb"/>
<text x="74.0" y="653.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="62.6" lengthAdjust="spacing">Poseidon</text>
<text x="268.0" y="653.9" font-size="14.5" fill="#3a3226" textLength="61.6" lengthAdjust="spacing">zeul mării</text>
<line x1="62.0" y1="664.2" x2="838.0" y2="664.2" stroke="#e3dccb"/>
<line x1="256.0" y1="435.6" x2="256.0" y2="664.2" stroke="#e3dccb"/>
<rect x="40" y="702.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="725.2" font-size="16" font-weight="700" fill="#ffffff">3. ÎNTREBĂRILE INVESTIGATORULUI</text>
<rect x="40" y="736.2" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="769.2" font-size="15" fill="#3a3226" textLength="274.9" lengthAdjust="spacing">Pentru orice legendă sau narațiune notez:</text>
<text x="341.0" y="769.2" font-size="15" fill="#3a3226" font-weight="700" textLength="30.8" lengthAdjust="spacing">Cine</text>
<text x="375.8" y="769.2" font-size="15" fill="#3a3226" textLength="373.6" lengthAdjust="spacing">e personajul principal? Care sunt personajele secundare?</text>
<text x="753.5" y="769.2" font-size="15" fill="#3a3226" font-weight="700" textLength="37.4" lengthAdjust="spacing">Unde</text>
<text x="794.9" y="769.2" font-size="15" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="62.0" y="791.0" font-size="15" fill="#3a3226" font-weight="700" textLength="33.8" lengthAdjust="spacing">când</text>
<text x="99.8" y="791.0" font-size="15" fill="#3a3226" textLength="148.8" lengthAdjust="spacing">se petrec întâmplările?</text>
<text x="252.6" y="791.0" font-size="15" fill="#3a3226" font-weight="700" textLength="17.4" lengthAdjust="spacing">Ce</text>
<text x="274.1" y="791.0" font-size="15" fill="#3a3226" textLength="146.1" lengthAdjust="spacing">declanșează acțiunea?</text>
<text x="424.2" y="791.0" font-size="15" fill="#3a3226" font-weight="700" textLength="38.7" lengthAdjust="spacing">De ce</text>
<text x="467.0" y="791.0" font-size="15" fill="#3a3226" textLength="148.2" lengthAdjust="spacing">pleacă eroul de acasă?</text>
<rect x="40" y="833.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="856.5" font-size="16" font-weight="700" fill="#ffffff">4. O EXPRESIE NĂSCUTĂ DIN LEGENDĂ</text>
<rect x="40" y="867.5" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="900.5" font-size="15" fill="#3a3226" font-weight="700" textLength="93.0" lengthAdjust="spacing">firul Ariadnei</text>
<text x="159.1" y="900.5" font-size="15" fill="#3a3226" textLength="637.3" lengthAdjust="spacing">= ceea ce te ajută să găsești ieșirea dintr-o situație încâlcită, ca ghemul de sfoară care l-a scos pe</text>
<text x="62.0" y="922.2" font-size="15" fill="#3a3226" textLength="117.3" lengthAdjust="spacing">Tezeu din labirint.</text>
<text x="108.5" y="976.2" font-size="11.5" fill="#5b6b83" textLength="682.9" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 110-111, rubrica Repere și povestea originii lui Tezeu; textul de bază este „Tezeu și Minotaurul” de Florin Bican.</text>
</svg>
