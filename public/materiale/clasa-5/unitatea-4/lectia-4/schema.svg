<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1412" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1412" fill="#faf7f0"/>
<text x="305.8" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="287.1" lengthAdjust="spacing">Semnificațiile textului</text>
<text x="229.0" y="74.4" font-size="14" fill="#5b6b83" textLength="442.1" lengthAdjust="spacing">Clasa a V-a · Unitatea IV, Lecția 4 · Manual, p. 114 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. ÎNTREBĂRILE INTERPRETĂRII</text>
<rect x="40" y="128.6" width="820" height="187.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.8" lengthAdjust="spacing">Întrebarea</text>
<text x="462.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="221.6" lengthAdjust="spacing">Răspunsul meu, cu dovada din text</text>
<line x1="62.0" y1="178.2" x2="838.0" y2="178.2" stroke="#e3dccb"/>
<text x="74.0" y="200.7" font-size="14.5" fill="#3a3226" textLength="63.5" lengthAdjust="spacing">Care este</text>
<text x="141.4" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="34.3" lengthAdjust="spacing">tema</text>
<text x="179.7" y="200.7" font-size="14.5" fill="#3a3226" textLength="48.2" lengthAdjust="spacing">textului</text>
<text x="231.8" y="200.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="129.5" lengthAdjust="spacing">Tezeu și Minotaurul</text>
<text x="361.4" y="200.7" font-size="14.5" fill="#3a3226" textLength="50.4" lengthAdjust="spacing">? (ex. 1)</text>
<text x="462.0" y="200.7" font-size="14.5" fill="#3a3226" textLength="169.6" lengthAdjust="spacing">……………………………………</text>
<line x1="62.0" y1="211.0" x2="838.0" y2="211.0" stroke="#e3dccb"/>
<text x="74.0" y="233.5" font-size="14.5" fill="#3a3226" textLength="207.1" lengthAdjust="spacing">Pentru cine luptă Tezeu: pentru</text>
<text x="285.0" y="233.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="58.7" lengthAdjust="spacing">gloria lui</text>
<text x="347.6" y="233.5" font-size="14.5" fill="#3a3226" textLength="70.7" lengthAdjust="spacing">sau pentru</text>
<text x="74.0" y="254.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="45.3" lengthAdjust="spacing">ceilalți</text>
<text x="119.3" y="254.5" font-size="14.5" fill="#3a3226" textLength="109.5" lengthAdjust="spacing">? Justific. (ex. 2)</text>
<text x="462.0" y="233.5" font-size="14.5" fill="#3a3226" textLength="169.6" lengthAdjust="spacing">……………………………………</text>
<line x1="62.0" y1="264.9" x2="838.0" y2="264.9" stroke="#e3dccb"/>
<text x="74.0" y="287.4" font-size="14.5" fill="#3a3226" textLength="18.4" lengthAdjust="spacing">Ce</text>
<text x="96.4" y="287.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="97.1" lengthAdjust="spacing">obțin atenienii</text>
<text x="197.4" y="287.4" font-size="14.5" fill="#3a3226" textLength="194.9" lengthAdjust="spacing">prin victoria lui Tezeu? (ex. 3)</text>
<text x="462.0" y="287.4" font-size="14.5" fill="#3a3226" textLength="169.6" lengthAdjust="spacing">……………………………………</text>
<line x1="62.0" y1="297.7" x2="838.0" y2="297.7" stroke="#e3dccb"/>
<line x1="450.0" y1="146.6" x2="450.0" y2="297.7" stroke="#e3dccb"/>
<rect x="40" y="335.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="358.7" font-size="16" font-weight="700" fill="#ffffff">2. TREI SEMNIFICAȚII ALE LABIRINTULUI</text>
<rect x="40" y="369.7" width="820" height="155.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="402.7" font-size="15" fill="#3a3226" textLength="298.0" lengthAdjust="spacing">Completez în caiet cele trei enunțuri (ex. 7):</text>
<text x="62.0" y="437.2" font-size="17" font-weight="700" fill="#6f5ea8">a</text>
<text x="96.0" y="435.7" font-size="14.5" fill="#3a3226" textLength="131.9" lengthAdjust="spacing">Labirintul reprezintă</text>
<text x="231.9" y="435.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="119.9" lengthAdjust="spacing">dificultatea luptei</text>
<text x="351.8" y="435.7" font-size="14.5" fill="#3a3226" textLength="95.2" lengthAdjust="spacing">, pentru că ... .</text>
<text x="62.0" y="469.2" font-size="17" font-weight="700" fill="#6f5ea8">b</text>
<text x="96.0" y="467.7" font-size="14.5" fill="#3a3226" textLength="131.9" lengthAdjust="spacing">Labirintul reprezintă</text>
<text x="231.9" y="467.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="138.3" lengthAdjust="spacing">un mijloc de apărare</text>
<text x="370.2" y="467.7" font-size="14.5" fill="#3a3226" textLength="95.2" lengthAdjust="spacing">, pentru că ... .</text>
<text x="62.0" y="501.2" font-size="17" font-weight="700" fill="#6f5ea8">c</text>
<text x="96.0" y="499.7" font-size="14.5" fill="#3a3226" textLength="131.9" lengthAdjust="spacing">Labirintul reprezintă</text>
<text x="231.9" y="499.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="234.4" lengthAdjust="spacing">victoria rațiunii asupra instinctelor</text>
<text x="466.3" y="499.7" font-size="14.5" fill="#3a3226" textLength="95.2" lengthAdjust="spacing">, pentru că ... .</text>
<rect x="40" y="545.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="568.2" font-size="16" font-weight="700" fill="#ffffff">3. PERSONAJE ȘI SEMNIFICAȚII</text>
<rect x="40" y="579.2" width="820" height="247.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="612.2" font-size="15" fill="#3a3226" textLength="646.4" lengthAdjust="spacing">Asociez fiecare personaj cu semnificația lui și justific alegerea cu un fragment din text (ex. 10).</text>
<text x="209.3" y="645.7" font-size="15" fill="#10233f" font-weight="700" textLength="83.4" lengthAdjust="spacing">Personajele</text>
<text x="62.0" y="671.2" font-size="15" fill="#3a3226" font-weight="700">1.</text>
<text x="78.1" y="671.2" font-size="15" fill="#3a3226" textLength="41.3" lengthAdjust="spacing">Tezeu</text>
<text x="62.0" y="696.0" font-size="15" fill="#3a3226" font-weight="700">2.</text>
<text x="81.0" y="696.0" font-size="15" fill="#3a3226" textLength="41.5" lengthAdjust="spacing">Minos</text>
<text x="62.0" y="720.7" font-size="15" fill="#3a3226" font-weight="700">3.</text>
<text x="80.9" y="720.7" font-size="15" fill="#3a3226" textLength="73.0" lengthAdjust="spacing">Minotaurul</text>
<text x="62.0" y="745.5" font-size="15" fill="#3a3226" font-weight="700">4.</text>
<text x="81.2" y="745.5" font-size="15" fill="#3a3226" textLength="53.0" lengthAdjust="spacing">Ariadna</text>
<text x="62.0" y="770.2" font-size="15" fill="#3a3226" font-weight="700">5.</text>
<text x="80.8" y="770.2" font-size="15" fill="#3a3226" textLength="34.6" lengthAdjust="spacing">Egeu</text>
<text x="600.5" y="645.7" font-size="15" fill="#10233f" font-weight="700" textLength="97.0" lengthAdjust="spacing">Semnificațiile</text>
<text x="460.0" y="671.2" font-size="15" fill="#3a3226" font-weight="700" textLength="8.4" lengthAdjust="spacing">a</text>
<text x="472.5" y="671.2" font-size="15" fill="#3a3226" textLength="103.2" lengthAdjust="spacing">iubirea paternă</text>
<text x="460.0" y="696.0" font-size="15" fill="#3a3226" font-weight="700" textLength="9.1" lengthAdjust="spacing">b</text>
<text x="473.2" y="696.0" font-size="15" fill="#3a3226" textLength="53.9" lengthAdjust="spacing">violența</text>
<text x="460.0" y="720.7" font-size="15" fill="#3a3226" font-weight="700" textLength="8.5" lengthAdjust="spacing">c</text>
<text x="472.6" y="720.7" font-size="15" fill="#3a3226" textLength="107.4" lengthAdjust="spacing">forța și rațiunea</text>
<text x="460.0" y="745.5" font-size="15" fill="#3a3226" font-weight="700" textLength="9.1" lengthAdjust="spacing">d</text>
<text x="473.2" y="745.5" font-size="15" fill="#3a3226" textLength="50.5" lengthAdjust="spacing">rușinea</text>
<text x="460.0" y="770.2" font-size="15" fill="#3a3226" font-weight="700" textLength="8.6" lengthAdjust="spacing">e</text>
<text x="472.7" y="770.2" font-size="15" fill="#3a3226" textLength="191.3" lengthAdjust="spacing">iubirea capabilă de sacrificii</text>
<text x="62.0" y="803.7" font-size="15" fill="#3a3226" textLength="423.6" lengthAdjust="spacing">Perechile mele: 1 + …… ; 2 + …… ; 3 + …… ; 4 + …… ; 5 + …… .</text>
<rect x="40" y="846.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="869.2" font-size="16" font-weight="700" fill="#ffffff">4. CVINTETUL</text>
<rect x="40" y="880.2" width="820" height="464.4" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="913.2" font-size="15" fill="#3a3226" textLength="721.4" lengthAdjust="spacing">Alcătuiește o poezie de cinci versuri în care să sintetizezi ideile și sentimentele tale despre erou, ca tip de</text>
<text x="62.0" y="935.0" font-size="15" fill="#3a3226" textLength="63.6" lengthAdjust="spacing">personaj.</text>
<rect x="62.0" y="953.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="975.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="41.0" lengthAdjust="spacing">Versul</text>
<text x="174.9" y="975.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="116.6" lengthAdjust="spacing">Regula din manual</text>
<line x1="62.0" y1="985.0" x2="838.0" y2="985.0" stroke="#e3dccb"/>
<text x="74.0" y="1007.5" font-size="14.5" fill="#3a3226" textLength="5.7" lengthAdjust="spacing">1</text>
<text x="174.9" y="1007.5" font-size="14.5" fill="#3a3226" textLength="308.2" lengthAdjust="spacing">Primul vers trebuie să fie chiar cuvântul-cheie:</text>
<text x="487.0" y="1007.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="33.2" lengthAdjust="spacing">eroul</text>
<text x="520.2" y="1007.5" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="1017.9" x2="838.0" y2="1017.9" stroke="#e3dccb"/>
<text x="74.0" y="1040.4" font-size="14.5" fill="#3a3226" textLength="8.6" lengthAdjust="spacing">2</text>
<text x="174.9" y="1040.4" font-size="14.5" fill="#3a3226" textLength="616.4" lengthAdjust="spacing">Al doilea vers este alcătuit din două cuvinte care sunt adjective și prezintă însușiri ale eroului.</text>
<line x1="62.0" y1="1050.7" x2="838.0" y2="1050.7" stroke="#e3dccb"/>
<text x="74.0" y="1073.2" font-size="14.5" fill="#3a3226" textLength="8.7" lengthAdjust="spacing">3</text>
<text x="174.9" y="1073.2" font-size="14.5" fill="#3a3226" textLength="495.4" lengthAdjust="spacing">Al treilea vers are trei cuvinte care arată ce poate face un erou, fiind verbe.</text>
<line x1="62.0" y1="1083.6" x2="838.0" y2="1083.6" stroke="#e3dccb"/>
<text x="74.0" y="1106.1" font-size="14.5" fill="#3a3226" textLength="9.1" lengthAdjust="spacing">4</text>
<text x="174.9" y="1106.1" font-size="14.5" fill="#3a3226" textLength="524.5" lengthAdjust="spacing">Al patrulea vers conține patru cuvinte și exprimă sentimentele tale față de erou.</text>
<line x1="62.0" y1="1116.4" x2="838.0" y2="1116.4" stroke="#e3dccb"/>
<text x="74.0" y="1138.9" font-size="14.5" fill="#3a3226" textLength="8.5" lengthAdjust="spacing">5</text>
<text x="174.9" y="1138.9" font-size="14.5" fill="#3a3226" textLength="616.3" lengthAdjust="spacing">Al cincilea vers conține un singur cuvânt, un substantiv, care sintetizează ce reprezintă eroul.</text>
<line x1="62.0" y1="1149.3" x2="838.0" y2="1149.3" stroke="#e3dccb"/>
<line x1="162.9" y1="953.5" x2="162.9" y2="1149.3" stroke="#e3dccb"/>
<rect x="62.0" y="1163.3" width="380.0" height="163.4" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="1191.3" font-size="16" fill="#6f5ea8" font-weight="700" textLength="137.7" lengthAdjust="spacing">Modelul: Monstrul</text>
<text x="78.0" y="1214.6" font-size="14.5" fill="#3a3226" textLength="58.3" lengthAdjust="spacing">Monstrul</text>
<text x="78.0" y="1238.5" font-size="14.5" fill="#3a3226" textLength="120.4" lengthAdjust="spacing">ascuns, periculos,</text>
<text x="78.0" y="1262.4" font-size="14.5" fill="#3a3226" textLength="154.9" lengthAdjust="spacing">atacă, lovește, doboară</text>
<text x="78.0" y="1286.4" font-size="14.5" fill="#3a3226" textLength="241.2" lengthAdjust="spacing">fiară îngenuncheată de înțelepciune,</text>
<text x="78.0" y="1310.3" font-size="14.5" fill="#3a3226" textLength="57.2" lengthAdjust="spacing">cruzime.</text>
<rect x="458.0" y="1163.3" width="380.0" height="163.4" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="474.0" y="1191.3" font-size="16" fill="#0d9c92" font-weight="700" textLength="144.8" lengthAdjust="spacing">Schema mea: Eroul</text>
<text x="474.0" y="1214.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="34.8" lengthAdjust="spacing">eroul</text>
<text x="474.0" y="1238.5" font-size="14.5" fill="#3a3226" textLength="129.2" lengthAdjust="spacing">……………, ……………</text>
<text x="474.0" y="1262.4" font-size="14.5" fill="#3a3226" textLength="197.7" lengthAdjust="spacing">……………, ……………, ……………</text>
<text x="474.0" y="1286.4" font-size="14.5" fill="#3a3226" textLength="266.3" lengthAdjust="spacing">……………, ……………, ……………, ……………</text>
<text x="474.0" y="1310.3" font-size="14.5" fill="#3a3226" textLength="60.6" lengthAdjust="spacing">……………</text>
<text x="41.8" y="1376.1" font-size="11.5" fill="#5b6b83" textLength="816.5" lengthAdjust="spacing">Sursa: Manual Art 5, p. 114 (Interpretare ex. 1-3, 7 și 10; Portofoliu: Cvintetul, cuvânt cu cuvânt). Lecția nu are rubrica Repere. Răspunsurile și legăturile de la</text>
<text x="211.6" y="1392.8" font-size="11.5" fill="#5b6b83" textLength="476.8" lengthAdjust="spacing">ex. 10 rămân elevilor; ordinea semnificațiilor din ex. 10 este schimbată pentru aceste notițe.</text>
</svg>
