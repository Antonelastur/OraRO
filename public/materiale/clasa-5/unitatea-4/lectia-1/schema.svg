<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1293" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1293" fill="#faf7f0"/>
<text x="165.5" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="562.1" lengthAdjust="spacing">Textul narativ literar. „Tezeu și Minotaurul”</text>
<text x="210.8" y="74.4" font-size="14" fill="#5b6b83" textLength="478.5" lengthAdjust="spacing">Clasa a V-a · Unitatea IV, Lecția 1 · Manual, pp. 108-109 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. AUTORUL ȘI TEXTUL</text>
<rect x="40" y="128.6" width="820" height="172.5" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="380.0" height="136.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="174.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="74.6" lengthAdjust="spacing">AUTORUL</text>
<text x="78.0" y="197.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="80.6" lengthAdjust="spacing">Florin Bican</text>
<text x="162.6" y="197.9" font-size="14.5" fill="#3a3226" textLength="58.1" lengthAdjust="spacing">(n. 1956)</text>
<text x="78.0" y="221.8" font-size="14.5" fill="#3a3226" textLength="168.9" lengthAdjust="spacing">Este scriitor și traducător.</text>
<text x="78.0" y="245.8" font-size="14.5" fill="#3a3226" textLength="242.3" lengthAdjust="spacing">În 2013 a publicat volumul de versuri</text>
<text x="324.2" y="245.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="85.4" lengthAdjust="spacing">Reciclopedia</text>
<text x="78.0" y="266.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="197.2" lengthAdjust="spacing">de povești cu rimă și fără tâlc</text>
<text x="275.2" y="266.8" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<rect x="458.0" y="146.6" width="380.0" height="136.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="474.0" y="174.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="60.9" lengthAdjust="spacing">TEXTUL</text>
<text x="474.0" y="197.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="129.5" lengthAdjust="spacing">Tezeu și Minotaurul</text>
<text x="607.5" y="197.9" font-size="14.5" fill="#3a3226" textLength="40.6" lengthAdjust="spacing">este o</text>
<text x="652.0" y="197.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="77.9" lengthAdjust="spacing">repovestire</text>
<text x="733.9" y="197.9" font-size="14.5" fill="#3a3226" textLength="68.6" lengthAdjust="spacing">a legendei</text>
<text x="474.0" y="218.9" font-size="14.5" fill="#3a3226" textLength="170.5" lengthAdjust="spacing">despre Tezeu și Minotaur.</text>
<text x="474.0" y="242.8" font-size="14.5" fill="#3a3226" textLength="320.8" lengthAdjust="spacing">A fost scrisă special pentru elevii care vor studia</text>
<text x="474.0" y="263.9" font-size="14.5" fill="#3a3226" textLength="129.4" lengthAdjust="spacing">după acest manual.</text>
<rect x="40" y="321.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="344.1" font-size="16" font-weight="700" fill="#ffffff">2. FIȘA TEXTULUI</text>
<rect x="40" y="355.1" width="820" height="357.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="373.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="394.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.8" lengthAdjust="spacing">Întrebarea</text>
<text x="283.5" y="394.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="109.0" lengthAdjust="spacing">Ce găsesc în text</text>
<line x1="62.0" y1="404.7" x2="838.0" y2="404.7" stroke="#e3dccb"/>
<text x="74.0" y="427.2" font-size="14.5" fill="#3a3226" textLength="150.9" lengthAdjust="spacing">Cine sunt personajele?</text>
<text x="283.5" y="427.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="42.0" lengthAdjust="spacing">Minos</text>
<text x="325.6" y="427.2" font-size="14.5" fill="#3a3226" textLength="170.4" lengthAdjust="spacing">, regele Cretei, și soția lui,</text>
<text x="499.9" y="427.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="50.5" lengthAdjust="spacing">Pasifae</text>
<text x="550.4" y="427.2" font-size="14.5" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">;</text>
<text x="558.6" y="427.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="74.5" lengthAdjust="spacing">Minotaurul</text>
<text x="633.1" y="427.2" font-size="14.5" fill="#3a3226" textLength="188.1" lengthAdjust="spacing">, născut din iubirea ei pentru</text>
<text x="283.5" y="448.2" font-size="14.5" fill="#3a3226" textLength="114.3" lengthAdjust="spacing">un taur fermecat;</text>
<text x="401.8" y="448.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="39.3" lengthAdjust="spacing">Dedal</text>
<text x="441.0" y="448.2" font-size="14.5" fill="#3a3226" textLength="191.1" lengthAdjust="spacing">, renumit pentru iscusința lui;</text>
<text x="636.1" y="448.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="34.5" lengthAdjust="spacing">Egeu</text>
<text x="670.5" y="448.2" font-size="14.5" fill="#3a3226" textLength="99.6" lengthAdjust="spacing">, regele Atenei;</text>
<text x="774.1" y="448.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="41.2" lengthAdjust="spacing">Tezeu</text>
<text x="815.2" y="448.2" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="283.5" y="469.2" font-size="14.5" fill="#3a3226" textLength="95.4" lengthAdjust="spacing">viteazul lui fiu;</text>
<text x="382.9" y="469.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="53.9" lengthAdjust="spacing">Ariadna</text>
<text x="436.8" y="469.2" font-size="14.5" fill="#3a3226" textLength="103.3" lengthAdjust="spacing">, fiica lui Minos;</text>
<text x="544.1" y="469.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="63.8" lengthAdjust="spacing">Dionysos</text>
<text x="607.9" y="469.2" font-size="14.5" fill="#3a3226" textLength="215.8" lengthAdjust="spacing">, zeul vinului și al fertilității. Zeii îl</text>
<text x="283.5" y="490.2" font-size="14.5" fill="#3a3226" textLength="141.9" lengthAdjust="spacing">pedepsesc pe Minos.</text>
<line x1="62.0" y1="500.6" x2="838.0" y2="500.6" stroke="#e3dccb"/>
<text x="74.0" y="523.1" font-size="14.5" fill="#3a3226" textLength="101.5" lengthAdjust="spacing">Unde se petrec</text>
<text x="74.0" y="544.1" font-size="14.5" fill="#3a3226" textLength="84.0" lengthAdjust="spacing">întâmplările?</text>
<text x="283.5" y="523.1" font-size="14.5" fill="#3a3226" textLength="12.0" lengthAdjust="spacing">În</text>
<text x="299.5" y="523.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="37.4" lengthAdjust="spacing">Creta</text>
<text x="337.0" y="523.1" font-size="14.5" fill="#3a3226" textLength="153.4" lengthAdjust="spacing">, unde este labirintul, la</text>
<text x="494.3" y="523.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="40.3" lengthAdjust="spacing">Atena</text>
<text x="538.5" y="523.1" font-size="14.5" fill="#3a3226" textLength="109.7" lengthAdjust="spacing">și pe mica insulă</text>
<text x="652.2" y="523.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="43.1" lengthAdjust="spacing">Naxos</text>
<text x="695.3" y="523.1" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="554.5" x2="838.0" y2="554.5" stroke="#e3dccb"/>
<text x="74.0" y="577.0" font-size="14.5" fill="#3a3226" textLength="42.2" lengthAdjust="spacing">Când?</text>
<text x="283.5" y="577.0" font-size="14.5" fill="#3a3226" textLength="258.6" lengthAdjust="spacing">Timpul nu e precizat; textul spune doar</text>
<text x="546.1" y="577.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="51.0" lengthAdjust="spacing">într-o zi</text>
<text x="597.0" y="577.0" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="587.3" x2="838.0" y2="587.3" stroke="#e3dccb"/>
<text x="74.0" y="609.8" font-size="14.5" fill="#3a3226" textLength="124.2" lengthAdjust="spacing">Ce plătește Atena?</text>
<text x="283.5" y="609.8" font-size="14.5" fill="#3a3226" textLength="323.6" lengthAdjust="spacing">În fiecare an, Egeu era obligat să plătească tribut</text>
<text x="611.1" y="609.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="199.7" lengthAdjust="spacing">câte șapte băieți și șapte fete</text>
<text x="810.8" y="609.8" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="283.5" y="630.8" font-size="14.5" fill="#3a3226" textLength="158.0" lengthAdjust="spacing">pentru a hrăni monstrul.</text>
<line x1="62.0" y1="641.2" x2="838.0" y2="641.2" stroke="#e3dccb"/>
<text x="74.0" y="663.7" font-size="14.5" fill="#3a3226" textLength="109.2" lengthAdjust="spacing">Cum se încheie?</text>
<text x="283.5" y="663.7" font-size="14.5" fill="#3a3226" textLength="325.8" lengthAdjust="spacing">Tezeu devine regele Atenei și rătăcește prin lume</text>
<text x="613.2" y="663.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="166.7" lengthAdjust="spacing">„ca printr-un labirint fără</text>
<text x="283.5" y="684.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="43.7" lengthAdjust="spacing">ziduri”</text>
<text x="327.2" y="684.7" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="695.1" x2="838.0" y2="695.1" stroke="#e3dccb"/>
<line x1="271.5" y1="373.1" x2="271.5" y2="695.1" stroke="#e3dccb"/>
<rect x="40" y="733.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="756.1" font-size="16" font-weight="700" fill="#ffffff">3. EVENIMENTELE ÎN ORDINE</text>
<rect x="40" y="767.1" width="820" height="250.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="800.1" font-size="15" fill="#3a3226" font-weight="700">1.</text>
<text x="78.1" y="800.1" font-size="15" fill="#3a3226" textLength="575.2" lengthAdjust="spacing">Zeii îl pedepsesc pe Minos: Pasifae se îndrăgostește de un taur fermecat și se naște</text>
<text x="657.4" y="800.1" font-size="15" fill="#3a3226" font-weight="700" textLength="77.1" lengthAdjust="spacing">Minotaurul</text>
<text x="734.4" y="800.1" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">.</text>
<text x="62.0" y="824.8" font-size="15" fill="#3a3226" font-weight="700">2.</text>
<text x="81.0" y="824.8" font-size="15" fill="#3a3226" font-weight="700" textLength="40.6" lengthAdjust="spacing">Dedal</text>
<text x="125.7" y="824.8" font-size="15" fill="#3a3226" textLength="372.9" lengthAdjust="spacing">construiește labirintul, iar Minotaurul este închis acolo.</text>
<text x="62.0" y="849.6" font-size="15" fill="#3a3226" font-weight="700">3.</text>
<text x="80.9" y="849.6" font-size="15" fill="#3a3226" font-weight="700" textLength="42.6" lengthAdjust="spacing">Tezeu</text>
<text x="127.6" y="849.6" font-size="15" fill="#3a3226" textLength="691.4" lengthAdjust="spacing">pleacă în Creta, cu tinerii sortiți monstrului. Egeu îl roagă să schimbe pânza neagră cu una albă, dacă</text>
<text x="80.9" y="871.3" font-size="15" fill="#3a3226" textLength="133.0" lengthAdjust="spacing">se întoarce în viață.</text>
<text x="62.0" y="896.1" font-size="15" fill="#3a3226" font-weight="700">4.</text>
<text x="81.2" y="896.1" font-size="15" fill="#3a3226" font-weight="700" textLength="55.8" lengthAdjust="spacing">Ariadna</text>
<text x="141.0" y="896.1" font-size="15" fill="#3a3226" textLength="335.5" lengthAdjust="spacing">se îndrăgostește de el și îi dă un ghem de sfoară.</text>
<text x="62.0" y="920.8" font-size="15" fill="#3a3226" font-weight="700">5.</text>
<text x="80.8" y="920.8" font-size="15" fill="#3a3226" textLength="467.6" lengthAdjust="spacing">Tezeu îl învinge pe Minotaur și iese din labirint urmând firul Ariadnei.</text>
<text x="62.0" y="945.6" font-size="15" fill="#3a3226" font-weight="700">6.</text>
<text x="80.8" y="945.6" font-size="15" fill="#3a3226" textLength="298.0" lengthAdjust="spacing">Scufundă navele Cretei și face un popas pe</text>
<text x="382.9" y="945.6" font-size="15" fill="#3a3226" font-weight="700" textLength="44.6" lengthAdjust="spacing">Naxos</text>
<text x="427.5" y="945.6" font-size="15" fill="#3a3226" textLength="384.1" lengthAdjust="spacing">. La plecare o uită pe Ariadna, iar Dionysos o ia de soție.</text>
<text x="62.0" y="970.3" font-size="15" fill="#3a3226" font-weight="700">7.</text>
<text x="78.5" y="970.3" font-size="15" fill="#3a3226" textLength="649.1" lengthAdjust="spacing">Tezeu uită să schimbe pânza neagră. Egeu se aruncă în mare, iar Marea Egee îi poartă numele.</text>
<text x="62.0" y="995.1" font-size="15" fill="#3a3226" font-weight="700">8.</text>
<text x="81.0" y="995.1" font-size="15" fill="#3a3226" textLength="189.8" lengthAdjust="spacing">Tezeu devine regele Atenei.</text>
<rect x="40" y="1037.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1060.6" font-size="16" font-weight="700" fill="#ffffff">4. CUVÂNT DIN NOTA DE SUBSOL</text>
<rect x="40" y="1071.6" width="820" height="154.3" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="1089.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1111.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">Cuvântul</text>
<text x="384.4" y="1111.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="135.0" lengthAdjust="spacing">Explicația din manual</text>
<line x1="62.0" y1="1121.1" x2="838.0" y2="1121.1" stroke="#e3dccb"/>
<text x="74.0" y="1143.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="61.7" lengthAdjust="spacing">a hălădui</text>
<text x="139.7" y="1143.6" font-size="14.5" fill="#3a3226" textLength="59.1" lengthAdjust="spacing">(vb.), din</text>
<text x="202.7" y="1143.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="122.3" lengthAdjust="spacing">„pe unde hălăduia</text>
<text x="74.0" y="1164.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="77.9" lengthAdjust="spacing">Minotaurul”</text>
<text x="384.4" y="1143.6" font-size="14.5" fill="#3a3226" textLength="272.7" lengthAdjust="spacing">a trăi undeva în voie, în libertate, în liniște</text>
<line x1="62.0" y1="1175.0" x2="838.0" y2="1175.0" stroke="#e3dccb"/>
<text x="74.0" y="1197.5" font-size="14.5" fill="#3a3226" textLength="185.9" lengthAdjust="spacing">un cuvânt nou, ales de mine</text>
<text x="384.4" y="1197.5" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1207.8" x2="838.0" y2="1207.8" stroke="#e3dccb"/>
<line x1="372.4" y1="1089.6" x2="372.4" y2="1207.8" stroke="#e3dccb"/>
<text x="56.7" y="1257.3" font-size="11.5" fill="#5b6b83" textLength="786.5" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 108-109 (textul „Tezeu și Minotaurul”, caseta autorului, nota de subsol cuvânt cu cuvânt). Lecția nu are rubrica Repere. Datele</text>
<text x="72.7" y="1274.0" font-size="11.5" fill="#5b6b83" textLength="754.6" lengthAdjust="spacing">despre text sunt reformulate după manual. Întrebările din fișă și rândul pentru cuvântul ales sunt create pentru aceste notițe, faptele vin din text.</text>
</svg>
