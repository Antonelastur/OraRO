<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Textul multimodal. Banda desenată</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV, Lecția 6 · Hoțul fulgerului de Rick Riordan</text>
  <g>
    <rect x="60" y="95" width="240" height="170" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="180" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Caseta (vinieta)</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="180" y="150">Un cadru din</tspan><tspan x="180" y="166">poveste, cu imagine</tspan><tspan x="180" y="182">și, adesea, text.</tspan></text>
  </g>
  <g>
    <rect x="330" y="95" width="240" height="170" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Balonul de vorbire</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="450" y="150">Conține replicile</tspan><tspan x="450" y="166">personajelor, ca într-un</tspan><tspan x="450" y="182">dialog.</tspan></text>
  </g>
  <g>
    <rect x="600" y="95" width="240" height="170" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="720" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Onomatopeea</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="720" y="150">Cuvânt care imită</tspan><tspan x="720" y="166">un sunet: BUM!,</tspan><tspan x="720" y="182">ZBANG!</tspan></text>
  </g>
  <text x="450" y="300" text-anchor="middle" font-size="11.5" fill="#3a3226">Un text multimodal combină imaginea și cuvântul pentru a construi sensul.</text>
  <text x="450" y="336" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 6, pp. 116-118</text>
</svg>
