<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1281" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1281" fill="#faf7f0"/>
<text x="216.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="463.3" lengthAdjust="spacing">Textul multimodal. Banda desenată</text>
<text x="212.4" y="74.4" font-size="14" fill="#5b6b83" textLength="475.3" lengthAdjust="spacing">Clasa a V-a · Unitatea IV, Lecția 6 · Manual, pp. 116-118 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL MULTIMODAL</text>
<rect x="40" y="128.6" width="820" height="80.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="134.9" lengthAdjust="spacing">Textul multimodal</text>
<text x="201.3" y="162.6" font-size="16" fill="#10233f" textLength="612.6" lengthAdjust="spacing">combină două sau mai multe modalități de comunicare pentru a transmite informații:</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="643.7" lengthAdjust="spacing">cuvinte, imagini, culoare, sunete, gesturi, mimică, lumină, mișcare, așezare în spațiu etc.</text>
<rect x="40" y="228.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="251.6" font-size="16" font-weight="700" fill="#ffffff">2. CELE CINCI CODURI</text>
<rect x="40" y="262.6" width="820" height="265.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="295.6" font-size="15" fill="#3a3226" textLength="379.7" lengthAdjust="spacing">Într-un text multimodal, se folosesc următoarele coduri:</text>
<rect x="62.0" y="314.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="335.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="37.6" lengthAdjust="spacing">Codul</text>
<text x="268.0" y="335.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="77.6" lengthAdjust="spacing">Ce cuprinde</text>
<line x1="62.0" y1="345.7" x2="838.0" y2="345.7" stroke="#e3dccb"/>
<text x="74.0" y="368.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="62.4" lengthAdjust="spacing">lingvistic</text>
<text x="268.0" y="368.2" font-size="14.5" fill="#3a3226" textLength="240.4" lengthAdjust="spacing">vocabular, gramatică, ortografie etc.</text>
<line x1="62.0" y1="378.5" x2="838.0" y2="378.5" stroke="#e3dccb"/>
<text x="74.0" y="401.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="40.9" lengthAdjust="spacing">vizual</text>
<text x="268.0" y="401.0" font-size="14.5" fill="#3a3226" textLength="239.9" lengthAdjust="spacing">culoare, forme, mișcare, grafice etc.</text>
<line x1="62.0" y1="411.4" x2="838.0" y2="411.4" stroke="#e3dccb"/>
<text x="74.0" y="433.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="46.8" lengthAdjust="spacing">auditiv</text>
<text x="268.0" y="433.9" font-size="14.5" fill="#3a3226" textLength="230.9" lengthAdjust="spacing">ton, volum, ritm, efecte sonore etc.</text>
<line x1="62.0" y1="444.2" x2="838.0" y2="444.2" stroke="#e3dccb"/>
<text x="74.0" y="466.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="50.9" lengthAdjust="spacing">gestual</text>
<text x="268.0" y="466.7" font-size="14.5" fill="#3a3226" textLength="231.5" lengthAdjust="spacing">gest, mimică, postură, mișcare etc.</text>
<line x1="62.0" y1="477.1" x2="838.0" y2="477.1" stroke="#e3dccb"/>
<text x="74.0" y="499.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="45.8" lengthAdjust="spacing">spațial</text>
<text x="268.0" y="499.6" font-size="14.5" fill="#3a3226" textLength="221.8" lengthAdjust="spacing">direcție, apropiere, depărtare etc.</text>
<line x1="62.0" y1="509.9" x2="838.0" y2="509.9" stroke="#e3dccb"/>
<line x1="256.0" y1="314.1" x2="256.0" y2="509.9" stroke="#e3dccb"/>
<rect x="40" y="547.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="570.9" font-size="16" font-weight="700" fill="#ffffff">3. SUPORTUL</text>
<rect x="40" y="581.9" width="820" height="158.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="614.9" font-size="15" fill="#3a3226" textLength="333.9" lengthAdjust="spacing">Suportul folosit pentru textul multimodal poate fi:</text>
<rect x="62.0" y="633.4" width="248.0" height="88.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="661.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="44.1" lengthAdjust="spacing">hârtia</text>
<text x="78.0" y="684.7" font-size="14.5" fill="#3a3226" textLength="207.4" lengthAdjust="spacing">cărți, afișe, benzi desenate etc.</text>
<rect x="326.0" y="633.4" width="248.0" height="88.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="661.4" font-size="16" fill="#6f5ea8" font-weight="700" textLength="46.8" lengthAdjust="spacing">digital</text>
<text x="342.0" y="684.7" font-size="14.5" fill="#3a3226" textLength="214.9" lengthAdjust="spacing">film, animații, spoturi publicitare,</text>
<text x="342.0" y="705.7" font-size="14.5" fill="#3a3226" textLength="83.2" lengthAdjust="spacing">slide-uri etc.</text>
<rect x="590.0" y="633.4" width="248.0" height="88.7" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="606.0" y="661.4" font-size="16" fill="#9a7433" font-weight="700" textLength="26.6" lengthAdjust="spacing">live</text>
<text x="606.0" y="684.7" font-size="14.5" fill="#3a3226" textLength="186.5" lengthAdjust="spacing">spectacole de teatru, operă,</text>
<text x="606.0" y="705.7" font-size="14.5" fill="#3a3226" textLength="120.3" lengthAdjust="spacing">operetă, balet etc.</text>
<rect x="40" y="760.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="783.1" font-size="16" font-weight="700" fill="#ffffff">4. SIMPLU ȘI COMPLEX</text>
<rect x="40" y="794.1" width="820" height="158.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="827.1" font-size="15" fill="#3a3226" textLength="533.8" lengthAdjust="spacing">După numărul de modalități de comunicare folosite, textele multimodale pot fi:</text>
<rect x="62.0" y="845.6" width="380.0" height="88.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="873.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="50.1" lengthAdjust="spacing">simple</text>
<text x="78.0" y="896.9" font-size="14.5" fill="#3a3226" textLength="323.7" lengthAdjust="spacing">când îmbină doar două modalități (afișe, postere,</text>
<text x="78.0" y="917.9" font-size="14.5" fill="#3a3226" textLength="88.3" lengthAdjust="spacing">slide-uri etc.)</text>
<rect x="458.0" y="845.6" width="380.0" height="88.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="873.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="73.5" lengthAdjust="spacing">complexe</text>
<text x="474.0" y="896.9" font-size="14.5" fill="#3a3226" textLength="315.5" lengthAdjust="spacing">când îmbină trei sau mai multe modalități (filme,</text>
<text x="474.0" y="917.9" font-size="14.5" fill="#3a3226" textLength="118.8" lengthAdjust="spacing">teatru, operă etc.)</text>
<rect x="40" y="972.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="995.2" font-size="16" font-weight="700" fill="#ffffff">5. BANDA DESENATĂ</text>
<rect x="40" y="1006.2" width="820" height="206.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1040.2" font-size="16" fill="#10233f" font-weight="700" textLength="121.4" lengthAdjust="spacing">Banda desenată</text>
<text x="187.8" y="1040.2" font-size="16" fill="#10233f" textLength="630.2" lengthAdjust="spacing">este un text multimodal simplu în care se narează cu ajutorul imaginilor și al cuvintelor.</text>
<rect x="62.0" y="1059.0" width="776.0" height="103.8" rx="12" fill="#f3efe4"/><text x="78.0" y="1085.5" font-size="14.5" fill="#10233f" font-weight="700" textLength="121.5" lengthAdjust="spacing">Banda din manual</text>
<text x="78.0" y="1104.4" font-size="14.5" fill="#3a3226" textLength="222.4" lengthAdjust="spacing">Este realizată după fragmente din</text>
<text x="304.4" y="1104.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="101.4" lengthAdjust="spacing">Hoțul fulgerului</text>
<text x="409.7" y="1104.4" font-size="14.5" fill="#3a3226" textLength="10.8" lengthAdjust="spacing">și</text>
<text x="424.4" y="1104.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="125.0" lengthAdjust="spacing">Bătălia din Labirint</text>
<text x="553.3" y="1104.4" font-size="14.5" fill="#3a3226" textLength="16.8" lengthAdjust="spacing">de</text>
<text x="574.0" y="1104.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="85.4" lengthAdjust="spacing">Rick Riordan</text>
<text x="659.4" y="1104.4" font-size="14.5" fill="#3a3226" textLength="119.3" lengthAdjust="spacing">, scriitor american</text>
<text x="78.0" y="1125.4" font-size="14.5" fill="#3a3226" textLength="646.0" lengthAdjust="spacing">pasionat de legendele antice. El a plasat în lumea de astăzi zei și semizei și astfel s-a născut seria</text>
<text x="728.0" y="1125.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="37.6" lengthAdjust="spacing">Percy</text>
<text x="78.0" y="1146.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="137.8" lengthAdjust="spacing">Jackson și olimpienii</text>
<text x="215.8" y="1146.4" font-size="14.5" fill="#3a3226" textLength="364.8" lengthAdjust="spacing">. Percy este, de fapt, întruchiparea eroului grec Perseu.</text>
<text x="62.0" y="1190.8" font-size="14" fill="#5b6b83" textLength="633.0" lengthAdjust="spacing">Elementele benzii desenate (planșa, banda, vinieta, bulele și celelalte) le notez din schema lecției 7.</text>
<text x="65.0" y="1244.5" font-size="11.5" fill="#5b6b83" textLength="769.9" lengthAdjust="spacing">Sursa: Manual Art 5, p. 118, rubrica Repere (definițiile sunt cuvânt cu cuvânt) și p. 116 (prezentarea benzii desenate, reformulată). Elementele benzii</text>
<text x="361.8" y="1261.2" font-size="11.5" fill="#5b6b83" textLength="176.4" lengthAdjust="spacing">desenate sunt în schema lecției 7.</text>
</svg>
