<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 819" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="819" fill="#faf7f0"/>
<text x="247.0" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="406.6" lengthAdjust="spacing">Numeralul. Numeralul cardinal</text>
<text x="216.2" y="74.4" font-size="14" fill="#5b6b83" textLength="467.6" lengthAdjust="spacing">Clasa a V-a · Unitatea V, Lecția 10 · Manual, pp. 158-159 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. NUMERALUL</text>
<rect x="40" y="128.6" width="820" height="90.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="79.5" lengthAdjust="spacing">Numeralul</text>
<text x="145.8" y="162.6" font-size="16" fill="#10233f" textLength="271.7" lengthAdjust="spacing">este partea de vorbire care exprimă un</text>
<text x="421.8" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="49.3" lengthAdjust="spacing">număr</text>
<text x="475.4" y="162.6" font-size="16" fill="#10233f" textLength="24.0" lengthAdjust="spacing">sau</text>
<text x="503.8" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">ordinea</text>
<text x="565.7" y="162.6" font-size="16" fill="#10233f" textLength="179.0" lengthAdjust="spacing">obiectelor prin numărare.</text>
<text x="62.0" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="135.0" lengthAdjust="spacing">Numeralul cardinal</text>
<text x="201.1" y="196.4" font-size="15" fill="#3a3226" textLength="124.4" lengthAdjust="spacing">exprimă un număr:</text>
<text x="329.5" y="196.4" font-size="15" fill="#10233f" font-style="italic" textLength="168.9" lengthAdjust="spacing">trei luni, patruzeci de vase</text>
<text x="498.4" y="196.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="238.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="261.9" font-size="16" font-weight="700" fill="#ffffff">2. SIMPLE ȘI COMPUSE</text>
<rect x="40" y="272.9" width="820" height="158.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="290.9" width="380.0" height="88.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="318.9" font-size="16" fill="#0d9c92" font-weight="700" textLength="49.3" lengthAdjust="spacing">simple</text>
<text x="78.0" y="342.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="329.6" lengthAdjust="spacing">unu, doi, trei, patru, cinci, șase, șapte, opt, nouă, zece</text>
<rect x="458.0" y="290.9" width="380.0" height="88.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="318.9" font-size="16" fill="#6f5ea8" font-weight="700" textLength="67.5" lengthAdjust="spacing">compuse</text>
<text x="474.0" y="342.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="329.7" lengthAdjust="spacing">unsprezece, doisprezece, patruzeci, o sută cinci, două</text>
<text x="474.0" y="363.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="110.2" lengthAdjust="spacing">mii șaptesprezece</text>
<text x="62.0" y="408.6" font-size="15" fill="#10233f" font-style="italic" textLength="48.0" lengthAdjust="spacing">unu/un</text>
<text x="114.0" y="408.6" font-size="15" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="128.0" y="408.6" font-size="15" fill="#10233f" font-style="italic" textLength="20.1" lengthAdjust="spacing">doi</text>
<text x="152.2" y="408.6" font-size="15" fill="#3a3226" textLength="186.1" lengthAdjust="spacing">își schimbă forma după gen:</text>
<text x="342.3" y="408.6" font-size="15" fill="#10233f" font-style="italic" textLength="105.6" lengthAdjust="spacing">un băiat / o fată</text>
<text x="447.9" y="408.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="455.3" y="408.6" font-size="15" fill="#10233f" font-style="italic" textLength="135.2" lengthAdjust="spacing">doi băieți / două fete</text>
<text x="590.4" y="408.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="451.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="474.1" font-size="16" font-weight="700" fill="#ffffff">3. „UN” ȘI „O”: CE SUNT?</text>
<rect x="40" y="485.1" width="820" height="282.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="518.1" font-size="15" fill="#10233f" font-style="italic" textLength="18.8" lengthAdjust="spacing">Un</text>
<text x="84.8" y="518.1" font-size="15" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="98.8" y="518.1" font-size="15" fill="#10233f" font-style="italic" textLength="8.1" lengthAdjust="spacing">o</text>
<text x="110.9" y="518.1" font-size="15" fill="#3a3226" textLength="28.5" lengthAdjust="spacing">sunt</text>
<text x="143.4" y="518.1" font-size="15" fill="#3a3226" font-weight="700" textLength="135.2" lengthAdjust="spacing">numerale cardinale</text>
<text x="282.7" y="518.1" font-size="15" fill="#3a3226" textLength="79.7" lengthAdjust="spacing">atunci când:</text>
<text x="62.0" y="551.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="551.6" font-size="15" fill="#3a3226" textLength="220.3" lengthAdjust="spacing">sunt în legătură cu alte numerale:</text>
<text x="298.6" y="551.6" font-size="15" fill="#10233f" font-style="italic" textLength="48.8" lengthAdjust="spacing">Adu-mi</text>
<text x="351.4" y="551.6" font-size="15" fill="#3a3226" font-weight="700" textLength="9.2" lengthAdjust="spacing">o</text>
<text x="364.6" y="551.6" font-size="15" fill="#10233f" font-style="italic" textLength="100.0" lengthAdjust="spacing">pungă cu aur și</text>
<text x="468.7" y="551.6" font-size="15" fill="#3a3226" font-weight="700" textLength="35.7" lengthAdjust="spacing">două</text>
<text x="508.4" y="551.6" font-size="15" fill="#10233f" font-style="italic" textLength="90.9" lengthAdjust="spacing">cu nestemate!</text>
<text x="62.0" y="576.3" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="576.3" font-size="15" fill="#3a3226" textLength="102.1" lengthAdjust="spacing">sunt însoțite de</text>
<text x="180.4" y="576.3" font-size="15" fill="#10233f" font-style="italic" textLength="181.9" lengthAdjust="spacing">singur, singură, numai, doar</text>
<text x="362.3" y="576.3" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="369.7" y="576.3" font-size="15" fill="#3a3226" font-weight="700" textLength="19.9" lengthAdjust="spacing">Un</text>
<text x="393.7" y="576.3" font-size="15" fill="#10233f" font-style="italic" textLength="173.7" lengthAdjust="spacing">singur scop avea vrăjitorul.</text>
<text x="62.0" y="601.1" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="601.1" font-size="15" fill="#3a3226" textLength="192.6" lengthAdjust="spacing">exprimă o unitate de măsură:</text>
<text x="270.8" y="601.1" font-size="15" fill="#10233f" font-style="italic" textLength="124.3" lengthAdjust="spacing">Duhul s-a ivit după</text>
<text x="399.2" y="601.1" font-size="15" fill="#3a3226" font-weight="700" textLength="9.2" lengthAdjust="spacing">o</text>
<text x="412.4" y="601.1" font-size="15" fill="#10233f" font-style="italic" textLength="56.2" lengthAdjust="spacing">secundă.</text>
<rect x="62.0" y="619.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="641.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.1" lengthAdjust="spacing">Propoziția</text>
<text x="539.6" y="641.1" font-size="13.5" fill="#10233f" font-weight="700" font-style="italic" textLength="7.8" lengthAdjust="spacing">o</text>
<text x="551.1" y="641.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="25.8" lengthAdjust="spacing">este</text>
<line x1="62.0" y1="651.1" x2="838.0" y2="651.1" stroke="#e3dccb"/>
<text x="74.0" y="673.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="85.8" lengthAdjust="spacing">Am cumpărat</text>
<text x="163.8" y="673.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="8.8" lengthAdjust="spacing">o</text>
<text x="176.5" y="673.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="100.9" lengthAdjust="spacing">carte de povești.</text>
<text x="539.6" y="673.6" font-size="14.5" fill="#3a3226" textLength="105.9" lengthAdjust="spacing">articol nehotărât</text>
<line x1="62.0" y1="684.0" x2="838.0" y2="684.0" stroke="#e3dccb"/>
<text x="74.0" y="706.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="21.6" lengthAdjust="spacing">Am</text>
<text x="99.5" y="706.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="8.8" lengthAdjust="spacing">o</text>
<text x="112.3" y="706.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="151.5" lengthAdjust="spacing">singură carte de povești.</text>
<text x="539.6" y="706.5" font-size="14.5" fill="#3a3226" textLength="106.7" lengthAdjust="spacing">numeral cardinal</text>
<line x1="62.0" y1="716.8" x2="838.0" y2="716.8" stroke="#e3dccb"/>
<text x="74.0" y="739.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="11.0" lengthAdjust="spacing">O</text>
<text x="88.9" y="739.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="136.4" lengthAdjust="spacing">citesc în fiecare seară.</text>
<text x="539.6" y="739.3" font-size="14.5" fill="#3a3226" textLength="117.6" lengthAdjust="spacing">pronume personal</text>
<line x1="62.0" y1="749.7" x2="838.0" y2="749.7" stroke="#e3dccb"/>
<line x1="527.6" y1="619.6" x2="527.6" y2="749.7" stroke="#e3dccb"/>
<text x="201.0" y="799.2" font-size="11.5" fill="#5b6b83" textLength="497.9" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 158-159, rubricile Repere. Unele exemple sunt create pentru aceste notițe.</text>
</svg>
