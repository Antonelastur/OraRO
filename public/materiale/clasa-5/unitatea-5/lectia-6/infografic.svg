<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Diversitate culturală și lingvistică</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V, Lecția 6 · basme din culturi diferite</text>
  <g>
    <rect x="60" y="95" width="240" height="170" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="180" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Basmul românesc</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="180" y="150">Zâna Munților,</tspan><tspan x="180" y="166">Petre Ispirescu</tspan></text>
  </g>
  <g>
    <rect x="330" y="95" width="240" height="170" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="450" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Basmul oriental</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="450" y="150">Aladin, din</tspan><tspan x="450" y="166">O mie și una de nopți</tspan></text>
  </g>
  <g>
    <rect x="600" y="95" width="240" height="170" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="720" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Elemente comune</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="720" y="150">Erou, obstacol,</tspan><tspan x="720" y="166">ajutor magic, izbândă.</tspan></text>
  </g>
  <text x="450" y="300" text-anchor="middle" font-size="11.5" fill="#3a3226">Basmele din culturi diferite împărtășesc adesea aceleași motive.</text>
  <text x="450" y="322" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 6, pp. 151-152</text>
</svg>
