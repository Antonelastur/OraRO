<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1157" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1157" fill="#faf7f0"/>
<text x="228.8" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="438.9" lengthAdjust="spacing">Diversitate culturală și lingvistică</text>
<text x="213.0" y="74.4" font-size="14" fill="#5b6b83" textLength="474.1" lengthAdjust="spacing">Clasa a V-a · Unitatea V, Lecția 6 · Manual, pp. 151-152 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. DIVERSITATEA CULTURALĂ</text>
<rect x="40" y="128.6" width="820" height="99.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="739.3" lengthAdjust="spacing">De-a lungul timpului, orice întâlnire între popoare (vecinătatea, comerțul, migrația, explorarea de noi teritorii,</text>
<text x="62.0" y="183.3" font-size="15" fill="#3a3226" textLength="663.5" lengthAdjust="spacing">războaiele) a dus nu numai la schimburi de bunuri materiale, ci și la schimburi de idei și de valori.</text>
<text x="729.6" y="183.3" font-size="15" fill="#3a3226" font-weight="700" textLength="85.6" lengthAdjust="spacing">Diversitatea</text>
<text x="62.0" y="205.1" font-size="15" fill="#3a3226" font-weight="700" textLength="62.5" lengthAdjust="spacing">culturală</text>
<text x="128.6" y="205.1" font-size="15" fill="#3a3226" textLength="597.8" lengthAdjust="spacing">se referă la existența într-o societate a mai multor culturi, care se influențează reciproc.</text>
<rect x="40" y="247.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="270.6" font-size="16" font-weight="700" fill="#ffffff">2. NASTRATIN HOGEA</text>
<rect x="40" y="281.6" width="820" height="306.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="314.6" font-size="15" fill="#3a3226" textLength="757.6" lengthAdjust="spacing">Un exemplu reprezentativ pentru schimburile culturale care se produc este personajul Nastratin Hogea, comun</text>
<text x="62.0" y="336.4" font-size="15" fill="#3a3226" textLength="761.8" lengthAdjust="spacing">mai multor culturi din Balcani (turcă, greacă, macedoneană, sârbă, bulgară, albaneză, română). La noi a devenit</text>
<text x="62.0" y="358.1" font-size="15" fill="#3a3226" textLength="273.4" lengthAdjust="spacing">cunoscut prin culegerea lui Anton Pann,</text>
<text x="339.4" y="358.1" font-size="15" fill="#10233f" font-style="italic" textLength="231.9" lengthAdjust="spacing">Năzdrăvăniile lui Nastratin Hogea</text>
<text x="571.3" y="358.1" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">.</text>
<rect x="62.0" y="376.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="398.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="101.2" lengthAdjust="spacing">Fișa „Nastratin”</text>
<text x="306.8" y="398.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="49.7" lengthAdjust="spacing">Ce rețin</text>
<line x1="62.0" y1="408.2" x2="838.0" y2="408.2" stroke="#e3dccb"/>
<text x="74.0" y="430.7" font-size="14.5" fill="#3a3226" textLength="60.0" lengthAdjust="spacing">cine este</text>
<text x="306.8" y="430.7" font-size="14.5" fill="#3a3226" textLength="511.1" lengthAdjust="spacing">un învățat din Turcia secolului al XIII-lea, despre care circulă sute de povestiri</text>
<text x="306.8" y="451.7" font-size="14.5" fill="#3a3226" textLength="127.4" lengthAdjust="spacing">și anecdote (p. 151)</text>
<line x1="62.0" y1="462.0" x2="838.0" y2="462.0" stroke="#e3dccb"/>
<text x="74.0" y="484.5" font-size="14.5" fill="#3a3226" textLength="145.3" lengthAdjust="spacing">povestirea din manual</text>
<text x="306.8" y="484.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="116.5" lengthAdjust="spacing">Făgăduiala ținută</text>
<text x="427.2" y="484.5" font-size="14.5" fill="#3a3226" textLength="247.9" lengthAdjust="spacing">de Jean-Claude Carrière, din volumul</text>
<text x="679.0" y="484.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="130.2" lengthAdjust="spacing">Cercul mincinoșilor.</text>
<text x="306.8" y="505.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="220.5" lengthAdjust="spacing">Povești filozofice din toată lumea</text>
<text x="531.2" y="505.6" font-size="14.5" fill="#3a3226" textLength="46.7" lengthAdjust="spacing">(p. 151)</text>
<line x1="62.0" y1="515.9" x2="838.0" y2="515.9" stroke="#e3dccb"/>
<text x="74.0" y="538.4" font-size="14.5" fill="#3a3226" textLength="143.6" lengthAdjust="spacing">tâlcul povestirii, într-o</text>
<text x="74.0" y="559.4" font-size="14.5" fill="#3a3226" textLength="66.1" lengthAdjust="spacing">propoziție</text>
<text x="306.8" y="538.4" font-size="14.5" fill="#3a3226" textLength="278.7" lengthAdjust="spacing">……………………………………………………………</text>
<line x1="62.0" y1="569.8" x2="838.0" y2="569.8" stroke="#e3dccb"/>
<line x1="294.8" y1="376.6" x2="294.8" y2="569.8" stroke="#e3dccb"/>
<rect x="40" y="607.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="630.8" font-size="16" font-weight="700" fill="#ffffff">3. DIVERSITATEA LINGVISTICĂ</text>
<rect x="40" y="641.8" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="674.8" font-size="15" fill="#3a3226" textLength="363.4" lengthAdjust="spacing">Diversitatea culturală este asociată, de obicei, și cu o</text>
<text x="429.5" y="674.8" font-size="15" fill="#3a3226" font-weight="700" textLength="152.3" lengthAdjust="spacing">diversitate lingvistică</text>
<text x="581.8" y="674.8" font-size="15" fill="#3a3226" textLength="250.2" lengthAdjust="spacing">: împreună cu obiectele și ideile care</text>
<text x="62.0" y="696.5" font-size="15" fill="#3a3226" textLength="523.0" lengthAdjust="spacing">se transmit de la un popor la altul, se transmit și cuvintele care le denumesc.</text>
<rect x="40" y="739.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="762.0" font-size="16" font-weight="700" fill="#ffffff">4. CUVINTE CĂLĂTOARE</text>
<rect x="40" y="773.0" width="820" height="316.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="791.0" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="812.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">Cuvântul</text>
<text x="205.9" y="812.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="133.7" lengthAdjust="spacing">Limba de la care vine</text>
<text x="462.0" y="812.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="75.8" lengthAdjust="spacing">Călătoria lui</text>
<line x1="62.0" y1="822.6" x2="838.0" y2="822.6" stroke="#e3dccb"/>
<text x="74.0" y="845.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="40.0" lengthAdjust="spacing">marfă</text>
<text x="205.9" y="845.1" font-size="14.5" fill="#3a3226" textLength="65.5" lengthAdjust="spacing">maghiară,</text>
<text x="275.4" y="845.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="43.3" lengthAdjust="spacing">marha</text>
<text x="462.0" y="845.1" font-size="14.5" fill="#3a3226" textLength="340.9" lengthAdjust="spacing">acolo înseamnă „vită, vite”; la noi înseamnă „produs</text>
<text x="462.0" y="866.1" font-size="14.5" fill="#3a3226" textLength="70.8" lengthAdjust="spacing">comercial”</text>
<line x1="62.0" y1="876.5" x2="838.0" y2="876.5" stroke="#e3dccb"/>
<text x="74.0" y="899.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="54.8" lengthAdjust="spacing">franzelă</text>
<text x="205.9" y="899.0" font-size="14.5" fill="#3a3226" textLength="49.9" lengthAdjust="spacing">greacă,</text>
<text x="259.8" y="899.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="59.7" lengthAdjust="spacing">frantzóla</text>
<text x="462.0" y="899.0" font-size="14.5" fill="#3a3226" textLength="344.7" lengthAdjust="spacing">în greacă înseamnă „pâine franțuzească”; în română</text>
<text x="462.0" y="920.0" font-size="14.5" fill="#3a3226" textLength="251.1" lengthAdjust="spacing">înseamnă doar o pâine albă, lunguiață</text>
<line x1="62.0" y1="930.3" x2="838.0" y2="930.3" stroke="#e3dccb"/>
<text x="74.0" y="952.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="55.0" lengthAdjust="spacing">papagal</text>
<text x="205.9" y="952.8" font-size="14.5" fill="#3a3226" textLength="49.9" lengthAdjust="spacing">greacă,</text>
<text x="259.8" y="952.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="74.2" lengthAdjust="spacing">papagállos</text>
<text x="334.0" y="952.8" font-size="14.5" fill="#3a3226" textLength="73.9" lengthAdjust="spacing">, din arabă,</text>
<text x="205.9" y="973.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="68.5" lengthAdjust="spacing">babbaghâ</text>
<text x="462.0" y="952.8" font-size="14.5" fill="#3a3226" textLength="351.2" lengthAdjust="spacing">în arabă însemna sunetul scos de pasărea respectivă</text>
<line x1="62.0" y1="984.2" x2="838.0" y2="984.2" stroke="#e3dccb"/>
<text x="74.0" y="1006.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="25.1" lengthAdjust="spacing">crai</text>
<text x="205.9" y="1006.7" font-size="14.5" fill="#3a3226" textLength="49.9" lengthAdjust="spacing">bulgară</text>
<text x="259.8" y="1006.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="29.2" lengthAdjust="spacing">kralĭ</text>
<text x="289.0" y="1006.7" font-size="14.5" fill="#3a3226" textLength="45.4" lengthAdjust="spacing">, sârbă</text>
<text x="338.3" y="1006.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="28.2" lengthAdjust="spacing">kralj</text>
<text x="366.4" y="1006.7" font-size="14.5" fill="#3a3226" textLength="69.5" lengthAdjust="spacing">, maghiară</text>
<text x="205.9" y="1027.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="36.3" lengthAdjust="spacing">király</text>
<text x="242.3" y="1027.7" font-size="14.5" fill="#3a3226" textLength="116.8" lengthAdjust="spacing">, cu sensul „rege”</text>
<text x="462.0" y="1006.7" font-size="14.5" fill="#3a3226" textLength="298.9" lengthAdjust="spacing">numele împăratului Carol cel Mare (742-814),</text>
<text x="462.0" y="1027.7" font-size="14.5" fill="#3a3226" textLength="220.5" lengthAdjust="spacing">împrumutat de slavi din germanul</text>
<text x="686.4" y="1027.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="26.4" lengthAdjust="spacing">Karl</text>
<line x1="62.0" y1="1038.1" x2="838.0" y2="1038.1" stroke="#e3dccb"/>
<line x1="193.9" y1="791.0" x2="193.9" y2="1038.1" stroke="#e3dccb"/>
<line x1="450.0" y1="791.0" x2="450.0" y2="1038.1" stroke="#e3dccb"/>
<text x="62.0" y="1067.1" font-size="15" fill="#3a3226" textLength="570.5" lengthAdjust="spacing">Călătoria care m-a surprins cel mai mult: ……………………………………………………………</text>
<text x="55.6" y="1121.1" font-size="11.5" fill="#5b6b83" textLength="788.8" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 151-152, cele trei paragrafe din rubrica Repere; fișa „Nastratin” este din Explorare, ex. 1 (p. 151) și din Repere (p. 152); „Cuvinte</text>
<text x="340.9" y="1137.8" font-size="11.5" fill="#5b6b83" textLength="218.2" lengthAdjust="spacing">călătoare” sunt din Aplicații, ex. 1 (p. 152).</text>
</svg>
