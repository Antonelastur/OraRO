<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 615" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="615" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Cum descriu o ființă imaginară</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Redactare</text>
  <rect x="36" y="96" width="560" height="34" rx="10" fill="#3b5fa8"/>
  <text x="316" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PAȘII</text>
  <rect x="36" y="142" width="560" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="166" font-size="13" font-weight="700" fill="#10233f">1. Aleg ființa</text>
  <text x="56" y="186" font-size="12" fill="#3d4a5f">o inventez sau o iau dintr-un text citit; îi dau un nume</text>
  <rect x="36" y="212" width="560" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">2. Hotărăsc cum e</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">înspăimântătoare, blândă și ocrotitoare, sau înșelătoare</text>
  <rect x="36" y="282" width="560" height="77" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="306" font-size="13" font-weight="700" fill="#10233f">3. Fac o schemă</text>
  <text x="56" y="326" font-size="12" fill="#3d4a5f">părțile corpului, trăsăturile fizice și morale,</text>
  <text x="56" y="345" font-size="12" fill="#3d4a5f">puterile miraculoase, relația cu ceilalți și cu locul unde trăiește</text>
  <rect x="36" y="371" width="560" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="395" font-size="13" font-weight="700" fill="#10233f">4. Scriu</text>
  <text x="56" y="415" font-size="12" fill="#3d4a5f">introducere, cuprins, încheiere; fiecare idee nouă, alineat nou</text>
  <rect x="36" y="441" width="560" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="465" font-size="13" font-weight="700" fill="#10233f">5. Revizuiesc</text>
  <text x="56" y="485" font-size="12" fill="#3d4a5f">șterg ce nu e relevant, verific ortografia și punctuația, pun un titlu</text>
  <rect x="612" y="96" width="352" height="34" rx="10" fill="#a1417e"/>
  <text x="788" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">UNELTELE DE LIMBĂ</text>
  <rect x="612" y="142" width="352" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="632" y="166" font-size="13" font-weight="700" fill="#10233f">Substantivele</text>
  <text x="632" y="186" font-size="12" fill="#3d4a5f">numesc ființa și părțile ei</text>
  <rect x="612" y="212" width="352" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="632" y="236" font-size="13" font-weight="700" fill="#10233f">Adjectivele</text>
  <text x="632" y="256" font-size="12" fill="#3d4a5f">arată trăsăturile</text>
  <rect x="612" y="282" width="352" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="632" y="306" font-size="13" font-weight="700" fill="#10233f">Verbele</text>
  <text x="632" y="326" font-size="12" fill="#3d4a5f">la indicativ, prezent sau imperfect</text>
  <rect x="612" y="352" width="352" height="96" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="632" y="376" font-size="13" font-weight="700" fill="#10233f">Model: Faunul, la C.S. Lewis</text>
  <text x="632" y="396" font-size="12" fill="#3d4a5f">de la mijloc în sus, bărbat</text>
  <text x="632" y="415" font-size="12" fill="#3d4a5f">picioare de țap, cu copite și coadă</text>
  <text x="632" y="434" font-size="12" fill="#3d4a5f">barbă ascuțită, câte un corn pe frunte</text>
  <rect x="36" y="511" width="928" height="58" rx="12" fill="#ffffff" stroke="#c1503a" stroke-width="2"/>
  <text x="56" y="535" font-size="13" font-weight="700" fill="#10233f">Capcana</text>
  <text x="56" y="555" font-size="12" fill="#3d4a5f">Nu te opri la aspect: trăsăturile morale și ce o face fabuloasă contează la fel de mult.</text>
  <text x="500" y="601" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 11, pp. 162-163</text>
</svg>
