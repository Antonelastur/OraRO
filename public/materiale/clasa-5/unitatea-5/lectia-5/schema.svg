<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1696" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1696" fill="#faf7f0"/>
<text x="52.9" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="779.2" lengthAdjust="spacing">Text auxiliar. Aladin și lampa fermecată, din O mie și una de</text>
<text x="416.1" y="85.0" font-size="28" fill="#10233f" font-weight="700" textLength="67.8" lengthAdjust="spacing">nopți</text>
<text x="211.2" y="109.4" font-size="14" fill="#5b6b83" textLength="477.6" lengthAdjust="spacing">Clasa a V-a · Unitatea V, Lecția 5 · Manual, pp. 149-150 · notițe pentru caiet</text>
<rect x="40" y="129.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="152.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL AUXILIAR</text>
<rect x="40" y="163.6" width="820" height="294.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="181.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="203.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="49.7" lengthAdjust="spacing">Ce rețin</text>
<text x="283.5" y="203.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="141.7" lengthAdjust="spacing">Din caseta de la p. 149</text>
<line x1="62.0" y1="213.2" x2="838.0" y2="213.2" stroke="#e3dccb"/>
<text x="74.0" y="235.7" font-size="14.5" fill="#3a3226" textLength="41.7" lengthAdjust="spacing">folclor</text>
<text x="283.5" y="235.7" font-size="14.5" fill="#3a3226" textLength="540.0" lengthAdjust="spacing">Fiecare popor sau comunitate a imaginat propriile basme și legende. Ele fac parte</text>
<text x="283.5" y="256.7" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">din ceea ce specialiștii numesc</text>
<text x="493.5" y="256.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="44.0" lengthAdjust="spacing">folclor</text>
<text x="537.5" y="256.7" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="267.0" x2="838.0" y2="267.0" stroke="#e3dccb"/>
<text x="74.0" y="289.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="140.2" lengthAdjust="spacing">O mie și una de nopți</text>
<text x="283.5" y="289.5" font-size="14.5" fill="#3a3226" textLength="490.4" lengthAdjust="spacing">una dintre cele mai vechi culegeri de basme, care vine din lumea orientală</text>
<line x1="62.0" y1="299.9" x2="838.0" y2="299.9" stroke="#e3dccb"/>
<text x="74.0" y="322.4" font-size="14.5" fill="#3a3226" textLength="148.1" lengthAdjust="spacing">fragmentul din manual</text>
<text x="283.5" y="322.4" font-size="14.5" fill="#3a3226" textLength="68.6" lengthAdjust="spacing">istorisit de</text>
<text x="356.1" y="322.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="110.9" lengthAdjust="spacing">Eusebiu Camilar</text>
<line x1="62.0" y1="332.7" x2="838.0" y2="332.7" stroke="#e3dccb"/>
<text x="74.0" y="355.2" font-size="14.5" fill="#3a3226" textLength="78.7" lengthAdjust="spacing">Șeherezada</text>
<text x="283.5" y="355.2" font-size="14.5" fill="#3a3226" textLength="464.1" lengthAdjust="spacing">povestește timp de o mie și una de nopți, captează interesul sultanului</text>
<text x="751.5" y="355.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="49.5" lengthAdjust="spacing">Șahriar</text>
<text x="805.0" y="355.2" font-size="14.5" fill="#3a3226" textLength="10.8" lengthAdjust="spacing">și</text>
<text x="283.5" y="376.2" font-size="14.5" fill="#3a3226" textLength="111.9" lengthAdjust="spacing">își salvează viața</text>
<line x1="62.0" y1="386.6" x2="838.0" y2="386.6" stroke="#e3dccb"/>
<text x="74.0" y="409.1" font-size="14.5" fill="#3a3226" textLength="41.2" lengthAdjust="spacing">Aladin</text>
<text x="283.5" y="409.1" font-size="14.5" fill="#3a3226" textLength="538.9" lengthAdjust="spacing">un băiat sărac și cam pierde-vară, căutat de un vrăjitor african care are nevoie de</text>
<text x="283.5" y="430.1" font-size="14.5" fill="#3a3226" textLength="427.7" lengthAdjust="spacing">ajutorul lui pentru a obține o lampă în stare să-l facă atotputernic</text>
<line x1="62.0" y1="440.5" x2="838.0" y2="440.5" stroke="#e3dccb"/>
<line x1="271.5" y1="181.6" x2="271.5" y2="440.5" stroke="#e3dccb"/>
<rect x="40" y="478.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="501.5" font-size="16" font-weight="700" fill="#ffffff">2. FIȘA FRAGMENTULUI</text>
<rect x="40" y="512.5" width="820" height="306.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="530.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="552.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.8" lengthAdjust="spacing">Întrebarea</text>
<text x="415.4" y="552.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="44.9" lengthAdjust="spacing">Caut în</text>
<text x="524.1" y="552.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="109.0" lengthAdjust="spacing">Ce găsesc în text</text>
<line x1="62.0" y1="562.0" x2="838.0" y2="562.0" stroke="#e3dccb"/>
<text x="74.0" y="584.5" font-size="14.5" fill="#3a3226" textLength="150.9" lengthAdjust="spacing">Cine sunt personajele?</text>
<text x="415.4" y="584.5" font-size="14.5" fill="#3a3226" textLength="78.1" lengthAdjust="spacing">pp. 149-150</text>
<text x="524.1" y="584.5" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="594.9" x2="838.0" y2="594.9" stroke="#e3dccb"/>
<text x="74.0" y="617.4" font-size="14.5" fill="#3a3226" textLength="183.9" lengthAdjust="spacing">Ce obiecte fermecate apar?</text>
<text x="415.4" y="617.4" font-size="14.5" fill="#3a3226" textLength="40.0" lengthAdjust="spacing">p. 149</text>
<text x="524.1" y="617.4" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="627.7" x2="838.0" y2="627.7" stroke="#e3dccb"/>
<text x="74.0" y="650.2" font-size="14.5" fill="#3a3226" textLength="231.0" lengthAdjust="spacing">Cât timp rămâne Aladin în peșteră?</text>
<text x="415.4" y="650.2" font-size="14.5" fill="#3a3226" textLength="40.0" lengthAdjust="spacing">p. 149</text>
<text x="524.1" y="650.2" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="660.6" x2="838.0" y2="660.6" stroke="#e3dccb"/>
<text x="74.0" y="683.1" font-size="14.5" fill="#3a3226" textLength="296.4" lengthAdjust="spacing">Ce face vrăjitorul când Aladin nu-i dă lampa?</text>
<text x="415.4" y="683.1" font-size="14.5" fill="#3a3226" textLength="40.0" lengthAdjust="spacing">p. 149</text>
<text x="524.1" y="683.1" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="693.4" x2="838.0" y2="693.4" stroke="#e3dccb"/>
<text x="74.0" y="715.9" font-size="14.5" fill="#3a3226" textLength="272.3" lengthAdjust="spacing">Ce se întâmplă acasă, când mama șterge</text>
<text x="74.0" y="736.9" font-size="14.5" fill="#3a3226" textLength="47.3" lengthAdjust="spacing">lampa?</text>
<text x="415.4" y="715.9" font-size="14.5" fill="#3a3226" textLength="78.1" lengthAdjust="spacing">pp. 149-150</text>
<text x="524.1" y="715.9" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="747.3" x2="838.0" y2="747.3" stroke="#e3dccb"/>
<text x="74.0" y="769.8" font-size="14.5" fill="#3a3226" textLength="227.2" lengthAdjust="spacing">Cum se schimbă Aladin la sfârșitul</text>
<text x="74.0" y="790.8" font-size="14.5" fill="#3a3226" textLength="90.8" lengthAdjust="spacing">fragmentului?</text>
<text x="415.4" y="769.8" font-size="14.5" fill="#3a3226" textLength="39.6" lengthAdjust="spacing">p. 150</text>
<text x="524.1" y="769.8" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="801.2" x2="838.0" y2="801.2" stroke="#e3dccb"/>
<line x1="403.4" y1="530.5" x2="403.4" y2="801.2" stroke="#e3dccb"/>
<line x1="512.1" y1="530.5" x2="512.1" y2="801.2" stroke="#e3dccb"/>
<rect x="40" y="839.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="862.2" font-size="16" font-weight="700" fill="#ffffff">3. MUNTELE NARAȚIUNII</text>
<rect x="40" y="873.2" width="820" height="361.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="906.2" font-size="15" fill="#3a3226" textLength="768.9" lengthAdjust="spacing">Desenez în caiet „muntele narațiunii” și plasez răspunsurile mele la întrebări, urmărind desfășurarea poveștii (ex.</text>
<text x="62.0" y="927.9" font-size="15" fill="#3a3226" textLength="335.0" lengthAdjust="spacing">1, p. 150). Urc de la început spre vârf, apoi cobor.</text>
<rect x="62.0" y="946.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="83.6" y="967.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="18.8" lengthAdjust="spacing">Nr.</text>
<text x="136.1" y="967.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="147.7" lengthAdjust="spacing">Întrebarea de pe munte</text>
<text x="524.1" y="967.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="97.8" lengthAdjust="spacing">Răspunsul meu</text>
<line x1="62.0" y1="978.0" x2="838.0" y2="978.0" stroke="#e3dccb"/>
<text x="90.2" y="1000.5" font-size="14.5" fill="#3a3226" textLength="5.7" lengthAdjust="spacing">1</text>
<text x="136.1" y="1000.5" font-size="14.5" fill="#3a3226" textLength="266.9" lengthAdjust="spacing">Ce fac personajele la începutul poveștii?</text>
<text x="524.1" y="1000.5" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="1010.8" x2="838.0" y2="1010.8" stroke="#e3dccb"/>
<text x="88.8" y="1033.3" font-size="14.5" fill="#3a3226" textLength="8.6" lengthAdjust="spacing">2</text>
<text x="136.1" y="1033.3" font-size="14.5" fill="#3a3226" textLength="156.2" lengthAdjust="spacing">Ce doresc personajele?</text>
<text x="524.1" y="1033.3" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="1043.7" x2="838.0" y2="1043.7" stroke="#e3dccb"/>
<text x="88.7" y="1066.2" font-size="14.5" fill="#3a3226" textLength="8.7" lengthAdjust="spacing">3</text>
<text x="136.1" y="1066.2" font-size="14.5" fill="#3a3226" textLength="315.8" lengthAdjust="spacing">Care sunt scopurile lor și problemele cu care se</text>
<text x="136.1" y="1087.2" font-size="14.5" fill="#3a3226" textLength="71.4" lengthAdjust="spacing">confruntă?</text>
<text x="524.1" y="1066.2" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="1097.5" x2="838.0" y2="1097.5" stroke="#e3dccb"/>
<text x="88.5" y="1120.0" font-size="14.5" fill="#3a3226" textLength="9.1" lengthAdjust="spacing">4</text>
<text x="136.1" y="1120.0" font-size="14.5" fill="#3a3226" textLength="319.0" lengthAdjust="spacing">Care este întâmplarea care înrăutățește situația?</text>
<text x="136.1" y="1141.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="109.5" lengthAdjust="spacing">(vârful muntelui)</text>
<text x="524.1" y="1120.0" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="1151.4" x2="838.0" y2="1151.4" stroke="#e3dccb"/>
<text x="88.8" y="1173.9" font-size="14.5" fill="#3a3226" textLength="8.5" lengthAdjust="spacing">5</text>
<text x="136.1" y="1173.9" font-size="14.5" fill="#3a3226" textLength="318.5" lengthAdjust="spacing">Ce alegeri fac în acest nou context personajele?</text>
<text x="524.1" y="1173.9" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="1184.3" x2="838.0" y2="1184.3" stroke="#e3dccb"/>
<text x="88.7" y="1206.8" font-size="14.5" fill="#3a3226" textLength="8.7" lengthAdjust="spacing">6</text>
<text x="136.1" y="1206.8" font-size="14.5" fill="#3a3226" textLength="173.7" lengthAdjust="spacing">Cum se încheie povestea?</text>
<text x="524.1" y="1206.8" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="1217.1" x2="838.0" y2="1217.1" stroke="#e3dccb"/>
<line x1="124.1" y1="946.4" x2="124.1" y2="1217.1" stroke="#e3dccb"/>
<line x1="512.1" y1="946.4" x2="512.1" y2="1217.1" stroke="#e3dccb"/>
<rect x="40" y="1255.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1278.1" font-size="16" font-weight="700" fill="#ffffff">4. CUVINTE NOI DIN NOTELE DE SUBSOL</text>
<rect x="40" y="1289.1" width="820" height="339.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="1307.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1328.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">Cuvântul</text>
<text x="306.8" y="1328.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="135.0" lengthAdjust="spacing">Explicația din manual</text>
<line x1="62.0" y1="1338.7" x2="838.0" y2="1338.7" stroke="#e3dccb"/>
<text x="74.0" y="1361.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="66.9" lengthAdjust="spacing">Mahomed</text>
<text x="306.8" y="1361.2" font-size="14.5" fill="#3a3226" textLength="474.5" lengthAdjust="spacing">în arabă, Muhammad, „preaslăvitul”, „cel demn de laudă”, 570-632 d.H.;</text>
<text x="306.8" y="1382.2" font-size="14.5" fill="#3a3226" textLength="481.2" lengthAdjust="spacing">întemeietorul religiei islamice, considerat de către musulmani profet al lui</text>
<text x="306.8" y="1403.2" font-size="14.5" fill="#3a3226" textLength="427.6" lengthAdjust="spacing">Allah, care i-a transmis prin îngerul Gabriel învățăturile din Coran</text>
<line x1="62.0" y1="1413.6" x2="838.0" y2="1413.6" stroke="#e3dccb"/>
<text x="74.0" y="1436.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="59.9" lengthAdjust="spacing">cutremur</text>
<text x="137.9" y="1436.1" font-size="14.5" fill="#3a3226" textLength="37.9" lengthAdjust="spacing">(s. n.)</text>
<text x="306.8" y="1436.1" font-size="14.5" fill="#3a3226" textLength="228.6" lengthAdjust="spacing">aici, cu glas care provoacă spaima</text>
<line x1="62.0" y1="1446.4" x2="838.0" y2="1446.4" stroke="#e3dccb"/>
<text x="74.0" y="1468.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="48.4" lengthAdjust="spacing">belciug</text>
<text x="126.3" y="1468.9" font-size="14.5" fill="#3a3226" textLength="37.9" lengthAdjust="spacing">(s. n.)</text>
<text x="306.8" y="1468.9" font-size="14.5" fill="#3a3226" textLength="433.5" lengthAdjust="spacing">verigă de metal care servește la fixarea unui lacăt, a unui lanț etc.</text>
<line x1="62.0" y1="1479.3" x2="838.0" y2="1479.3" stroke="#e3dccb"/>
<text x="74.0" y="1501.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="49.8" lengthAdjust="spacing">zăbavă</text>
<text x="127.7" y="1501.8" font-size="14.5" fill="#3a3226" textLength="34.0" lengthAdjust="spacing">(s. f.)</text>
<text x="306.8" y="1501.8" font-size="14.5" fill="#3a3226" textLength="82.1" lengthAdjust="spacing">aici, răbdare</text>
<line x1="62.0" y1="1512.1" x2="838.0" y2="1512.1" stroke="#e3dccb"/>
<text x="74.0" y="1534.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="41.4" lengthAdjust="spacing">petică</text>
<text x="119.4" y="1534.6" font-size="14.5" fill="#3a3226" textLength="67.9" lengthAdjust="spacing">(s. f., reg.)</text>
<text x="306.8" y="1534.6" font-size="14.5" fill="#3a3226" textLength="104.3" lengthAdjust="spacing">cârpă, zdreanță</text>
<line x1="62.0" y1="1545.0" x2="838.0" y2="1545.0" stroke="#e3dccb"/>
<text x="74.0" y="1567.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="29.2" lengthAdjust="spacing">sofa</text>
<text x="107.2" y="1567.5" font-size="14.5" fill="#3a3226" textLength="34.0" lengthAdjust="spacing">(s. f.)</text>
<text x="306.8" y="1567.5" font-size="14.5" fill="#3a3226" textLength="315.3" lengthAdjust="spacing">divan îngust, de obicei cu un căpătâi mai ridicat</text>
<line x1="62.0" y1="1577.8" x2="838.0" y2="1577.8" stroke="#e3dccb"/>
<text x="74.0" y="1600.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="103.3" lengthAdjust="spacing">a bate colburile</text>
<text x="181.3" y="1600.3" font-size="14.5" fill="#3a3226" textLength="76.5" lengthAdjust="spacing">(expr., reg.)</text>
<text x="306.8" y="1600.3" font-size="14.5" fill="#3a3226" textLength="517.4" lengthAdjust="spacing">a bate drumurile, a umbla de colo până colo (fără nicio treabă sau vreun scop)</text>
<line x1="62.0" y1="1610.7" x2="838.0" y2="1610.7" stroke="#e3dccb"/>
<line x1="294.8" y1="1307.1" x2="294.8" y2="1610.7" stroke="#e3dccb"/>
<text x="40.5" y="1660.2" font-size="11.5" fill="#5b6b83" textLength="818.9" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 149-150 (caseta „Text auxiliar”, fragmentul, notele de subsol, „Muntele narațiunii”, ex. 1). Lecția nu are rubrica Repere. Întrebările din</text>
<text x="253.1" y="1676.8" font-size="11.5" fill="#5b6b83" textLength="393.8" lengthAdjust="spacing">fișa fragmentului sunt create pentru aceste notițe, răspunsurile vin din text.</text>
</svg>
