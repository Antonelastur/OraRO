<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 861" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="861" fill="#faf7f0"/>
<text x="217.7" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="466.2" lengthAdjust="spacing">Acte de limbaj: a promite, a declara</text>
<text x="238.3" y="74.4" font-size="14" fill="#5b6b83" textLength="423.5" lengthAdjust="spacing">Clasa a V-a · Unitatea V, Lecția 9 · Manual, p. 157 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. A PROMITE</text>
<rect x="40" y="128.6" width="820" height="187.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="75.8" lengthAdjust="spacing">A promite</text>
<text x="142.2" y="162.6" font-size="16" fill="#10233f" textLength="285.7" lengthAdjust="spacing">este un act de limbaj prin care vorbitorul</text>
<text x="432.2" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="95.2" lengthAdjust="spacing">se angajează</text>
<text x="531.7" y="162.6" font-size="16" fill="#10233f" textLength="218.1" lengthAdjust="spacing">să acționeze într-un anumit fel.</text>
<text x="62.0" y="196.4" font-size="15" fill="#10233f" font-style="italic" textLength="162.9" lengthAdjust="spacing">Promit să te ajut la teme.</text>
<text x="229.0" y="196.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="236.3" y="196.4" font-size="15" fill="#10233f" font-style="italic" textLength="155.2" lengthAdjust="spacing">Îți promit că vin la timp.</text>
<rect x="62.0" y="214.9" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="214.9" width="6" height="82.7" rx="3" fill="#b4432c"/><text x="84.0" y="241.4" font-size="14.5" fill="#b4432c" font-weight="700" textLength="54.8" lengthAdjust="spacing">Atenție!</text>
<text x="84.0" y="260.2" font-size="14.5" fill="#3a3226" textLength="41.6" lengthAdjust="spacing">Nu fac</text>
<text x="129.5" y="260.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="143.4" lengthAdjust="spacing">promisiuni nerealiste</text>
<text x="272.9" y="260.2" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<text x="280.0" y="260.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="164.7" lengthAdjust="spacing">„A promite luna de pe cer”</text>
<text x="448.7" y="260.2" font-size="14.5" fill="#3a3226" textLength="21.8" lengthAdjust="spacing">sau</text>
<text x="474.3" y="260.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="107.3" lengthAdjust="spacing">„marea cu sarea”</text>
<text x="585.6" y="260.2" font-size="14.5" fill="#3a3226" textLength="171.0" lengthAdjust="spacing">înseamnă a promite lucruri</text>
<text x="84.0" y="281.3" font-size="14.5" fill="#3a3226" textLength="68.9" lengthAdjust="spacing">imposibile.</text>
<rect x="40" y="335.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="358.6" font-size="16" font-weight="700" fill="#ffffff">2. A DECLARA</text>
<rect x="40" y="369.6" width="820" height="331.1" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="403.6" font-size="16" fill="#10233f" font-weight="700" textLength="70.1" lengthAdjust="spacing">A declara</text>
<text x="136.4" y="403.6" font-size="16" fill="#10233f" textLength="285.7" lengthAdjust="spacing">este un act de limbaj prin care vorbitorul</text>
<text x="426.5" y="403.6" font-size="16" fill="#10233f" font-weight="700" textLength="52.8" lengthAdjust="spacing">anunță</text>
<text x="479.3" y="403.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">,</text>
<text x="487.1" y="403.6" font-size="16" fill="#10233f" font-weight="700" textLength="82.6" lengthAdjust="spacing">recunoaște</text>
<text x="574.0" y="403.6" font-size="16" fill="#10233f" textLength="24.0" lengthAdjust="spacing">sau</text>
<text x="602.3" y="403.6" font-size="16" fill="#10233f" font-weight="700" textLength="69.3" lengthAdjust="spacing">își asumă</text>
<text x="675.9" y="403.6" font-size="16" fill="#10233f" textLength="35.0" lengthAdjust="spacing">ceva.</text>
<text x="62.0" y="437.4" font-size="15" fill="#3a3226" textLength="209.2" lengthAdjust="spacing">Se folosește mai ales în limbajul</text>
<text x="275.3" y="437.4" font-size="15" fill="#3a3226" font-weight="700" textLength="42.7" lengthAdjust="spacing">oficial</text>
<text x="318.0" y="437.4" font-size="15" fill="#3a3226" textLength="264.7" lengthAdjust="spacing">: administrativ, politic, publicistic, juridic.</text>
<rect x="62.0" y="455.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="477.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="63.9" lengthAdjust="spacing">Declarația</text>
<text x="462.0" y="477.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="87.6" lengthAdjust="spacing">Unde o auzim</text>
<line x1="62.0" y1="487.5" x2="838.0" y2="487.5" stroke="#e3dccb"/>
<text x="74.0" y="510.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="136.0" lengthAdjust="spacing">„Vă declar căsătoriți!”</text>
<text x="462.0" y="510.0" font-size="14.5" fill="#3a3226" textLength="65.5" lengthAdjust="spacing">la cununie</text>
<line x1="62.0" y1="520.3" x2="838.0" y2="520.3" stroke="#e3dccb"/>
<text x="74.0" y="542.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="160.0" lengthAdjust="spacing">„Declar ședința deschisă.”</text>
<text x="462.0" y="542.8" font-size="14.5" fill="#3a3226" textLength="156.0" lengthAdjust="spacing">la începutul unei ședințe</text>
<line x1="62.0" y1="553.2" x2="838.0" y2="553.2" stroke="#e3dccb"/>
<text x="74.0" y="575.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="262.4" lengthAdjust="spacing">„Declar că nu am fost de față la accident.”</text>
<text x="462.0" y="575.7" font-size="14.5" fill="#3a3226" textLength="133.7" lengthAdjust="spacing">în fața unei autorități</text>
<line x1="62.0" y1="586.0" x2="838.0" y2="586.0" stroke="#e3dccb"/>
<line x1="450.0" y1="455.9" x2="450.0" y2="586.0" stroke="#e3dccb"/>
<rect x="62.0" y="600.0" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="626.5" font-size="14.5" fill="#10233f" font-weight="700" textLength="152.4" lengthAdjust="spacing">O declarație din basm:</text>
<text x="78.0" y="645.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="730.3" lengthAdjust="spacing">„Iată, pentru dragostea ta, mă lepăd de puterea mea cea măiastră, numai și tu să mă iubești, precum te iubesc și eu.”</text>
<text x="78.0" y="666.4" font-size="14.5" fill="#3a3226" textLength="428.8" lengthAdjust="spacing">(Zâna Munților): o declarație de intenție și o declarație de dragoste.</text>
<rect x="40" y="720.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="743.8" font-size="16" font-weight="700" fill="#ffffff">3. ACTE DE LIMBAJ ÎNVĂȚATE</text>
<rect x="40" y="754.8" width="820" height="55.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="787.8" font-size="15" fill="#3a3226" textLength="200.5" lengthAdjust="spacing">a întreba · a solicita · a felicita ·</text>
<text x="266.6" y="787.8" font-size="15" fill="#3a3226" font-weight="700" textLength="68.7" lengthAdjust="spacing">a promite</text>
<text x="339.3" y="787.8" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="346.7" y="787.8" font-size="15" fill="#3a3226" font-weight="700" textLength="63.3" lengthAdjust="spacing">a declara</text>
<text x="246.6" y="841.8" font-size="11.5" fill="#5b6b83" textLength="406.8" lengthAdjust="spacing">Sursa: Manual Art 5, p. 157, rubrica Repere și exemplele din Explorare și Aplicații.</text>
</svg>
