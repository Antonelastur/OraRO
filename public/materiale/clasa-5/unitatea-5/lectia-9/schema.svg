<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 494" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="494" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">A promite, a declara</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Acte de limbaj</text>
  <rect x="36" y="96" width="452" height="34" rx="10" fill="#0d9c92"/>
  <text x="262" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A PROMITE</text>
  <rect x="512" y="96" width="452" height="34" rx="10" fill="#6f5ea8"/>
  <text x="738" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A DECLARA</text>
  <rect x="36" y="142" width="452" height="58" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="56" y="166" font-size="13" font-weight="700" fill="#10233f">Ce face vorbitorul</text>
  <text x="56" y="186" font-size="12" fill="#3d4a5f">se angajează să acționeze într-un anumit fel</text>
  <rect x="36" y="212" width="452" height="77" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Exemple</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">Îți promit că voi termina proiectul la timp.</text>
  <text x="56" y="275" font-size="12" fill="#3d4a5f">Taci, fătul meu, că ți-oi da Tinerețe fără bătrânețe...</text>
  <rect x="512" y="142" width="452" height="58" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="532" y="166" font-size="13" font-weight="700" fill="#10233f">Ce face vorbitorul</text>
  <text x="532" y="186" font-size="12" fill="#3d4a5f">anunță, recunoaște sau își asumă ceva</text>
  <rect x="512" y="212" width="452" height="77" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="532" y="236" font-size="13" font-weight="700" fill="#10233f">Unde apare mai ales</text>
  <text x="532" y="256" font-size="12" fill="#3d4a5f">în limbaj oficial: administrativ, politic,</text>
  <text x="532" y="275" font-size="12" fill="#3d4a5f">publicistic, juridic</text>
  <rect x="512" y="301" width="452" height="77" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="532" y="325" font-size="13" font-weight="700" fill="#10233f">Exemple</text>
  <text x="532" y="345" font-size="12" fill="#3d4a5f">Declar ședința deschisă.</text>
  <text x="532" y="364" font-size="12" fill="#3d4a5f">Vă declar căsătoriți!</text>
  <rect x="36" y="390" width="928" height="58" rx="12" fill="#ffffff" stroke="#c1503a" stroke-width="2"/>
  <text x="56" y="414" font-size="13" font-weight="700" fill="#10233f">Capcana</text>
  <text x="56" y="434" font-size="12" fill="#3d4a5f">Nu promite ce nu poți face. „A promite marea cu sarea” înseamnă o promisiune fără acoperire.</text>
  <text x="500" y="480" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 8, p. 157</text>
</svg>
