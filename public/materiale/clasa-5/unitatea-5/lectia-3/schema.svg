<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="320" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Personajele, în basm</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V, Lecția 3 · Zâna Munților</text>
  <g>
    <rect x="60" y="95" width="240" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="180" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Eroul</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="180" y="150">Pornește într-o</tspan><tspan x="180" y="166">încercare, se schimbă.</tspan></text>
  </g>
  <g>
    <rect x="330" y="95" width="240" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Ajutorul fantastic</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="450" y="150">O ființă cu puteri</tspan><tspan x="450" y="166">magice, ca zâna.</tspan></text>
  </g>
  <g>
    <rect x="600" y="95" width="240" height="140" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="720" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Personajul negativ</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="720" y="150">Se opune eroului,</tspan><tspan x="720" y="166">creează obstacole.</tspan></text>
  </g>
  <text x="450" y="270" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 3, pp. 146-147</text>
</svg>
