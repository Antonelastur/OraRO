<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 564" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="564" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Basmul și comunicarea, tot la un loc</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Recapitulare, lectură și comunicare</text>
  <rect x="36" y="96" width="452" height="34" rx="10" fill="#3b5fa8"/>
  <text x="262" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">BASMUL</text>
  <rect x="512" y="96" width="452" height="34" rx="10" fill="#0d9c92"/>
  <text x="738" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">COMUNICARE ȘI INTERCULTURALITATE</text>
  <rect x="36" y="142" width="452" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="166" font-size="13" font-weight="700" fill="#10233f">Lumea basmului</text>
  <text x="56" y="186" font-size="12" fill="#3d4a5f">ireală: întâmplări supranaturale, ființe fabuloase</text>
  <rect x="36" y="212" width="452" height="77" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Firul acțiunii</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">echilibru → tulburare → probe →</text>
  <text x="56" y="275" font-size="12" fill="#3d4a5f">echilibru refăcut, eroul răsplătit</text>
  <rect x="36" y="301" width="452" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="325" font-size="13" font-weight="700" fill="#10233f">Timpul și spațiul</text>
  <text x="56" y="345" font-size="12" fill="#3d4a5f">vagi, imposibil de situat; formule de început și de încheiere</text>
  <rect x="36" y="371" width="452" height="77" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="395" font-size="13" font-weight="700" fill="#10233f">Personajele</text>
  <text x="56" y="415" font-size="12" fill="#3d4a5f">eroul, în slujba binelui, trece probe;</text>
  <text x="56" y="434" font-size="12" fill="#3d4a5f">alături, ființe cu puteri miraculoase</text>
  <rect x="512" y="142" width="452" height="58" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="532" y="166" font-size="13" font-weight="700" fill="#10233f">Paraverbal</text>
  <text x="532" y="186" font-size="12" fill="#3d4a5f">vocea: intensitate, intonație, ritm, pauză</text>
  <rect x="512" y="212" width="452" height="58" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="532" y="236" font-size="13" font-weight="700" fill="#10233f">Nonverbal</text>
  <text x="532" y="256" font-size="12" fill="#3d4a5f">corpul: mimică, gesturi, poziție, privire</text>
  <rect x="512" y="282" width="452" height="58" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="532" y="306" font-size="13" font-weight="700" fill="#10233f">A promite · a declara</text>
  <text x="532" y="326" font-size="12" fill="#3d4a5f">mă angajez să fac · anunț, recunosc, îmi asum</text>
  <rect x="512" y="352" width="452" height="77" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="532" y="376" font-size="13" font-weight="700" fill="#10233f">Diversitatea culturală</text>
  <text x="532" y="396" font-size="12" fill="#3d4a5f">culturi care se influențează;</text>
  <text x="532" y="415" font-size="12" fill="#3d4a5f">cuvintele călătoresc odată cu lucrurile</text>
  <rect x="36" y="460" width="928" height="58" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="56" y="484" font-size="13" font-weight="700" fill="#10233f">Textele unității</text>
  <text x="56" y="504" font-size="12" fill="#3d4a5f">Zâna Munților (Petre Ispirescu) · Aladin, din O mie și una de nopți · Nastratin Hogea · Prințesa și mazărea (Andersen)</text>
  <text x="500" y="550" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, pp. 140-165</text>
</svg>
