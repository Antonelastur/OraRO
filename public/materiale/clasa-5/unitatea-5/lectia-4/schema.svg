<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1173" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1173" fill="#faf7f0"/>
<text x="305.8" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="287.1" lengthAdjust="spacing">Semnificațiile textului</text>
<text x="229.4" y="74.4" font-size="14" fill="#5b6b83" textLength="441.3" lengthAdjust="spacing">Clasa a V-a · Unitatea V, Lecția 4 · Manual, p. 148 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEMA BASMULUI</text>
<rect x="40" y="128.6" width="820" height="223.5" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="173.1" font-size="14.5" fill="#10233f" font-weight="700" textLength="127.6" lengthAdjust="spacing">Din manual (ex. 3):</text>
<text x="78.0" y="191.9" font-size="14.5" fill="#3a3226" textLength="99.9" lengthAdjust="spacing">Tema basmului</text>
<text x="181.8" y="191.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="92.6" lengthAdjust="spacing">Zâna Munților</text>
<text x="278.4" y="191.9" font-size="14.5" fill="#3a3226" textLength="28.2" lengthAdjust="spacing">este</text>
<text x="310.5" y="191.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="365.1" lengthAdjust="spacing">iubirea dintre două ființe aparținând unor lumi diferite</text>
<text x="675.6" y="191.9" font-size="14.5" fill="#3a3226" textLength="132.5" lengthAdjust="spacing">: lumea oamenilor și</text>
<text x="78.0" y="213.0" font-size="14.5" fill="#3a3226" textLength="167.2" lengthAdjust="spacing">lumea ființelor fabuloase.</text>
<text x="62.0" y="258.3" font-size="15" fill="#3a3226" textLength="126.0" lengthAdjust="spacing">Manualul observă:</text>
<text x="192.1" y="258.3" font-size="15" fill="#10233f" font-style="italic" textLength="619.9" lengthAdjust="spacing">„În acest basm nu există o aventură eroică destinată să salveze lumea și să pedepsească</text>
<text x="62.0" y="280.1" font-size="15" fill="#10233f" font-style="italic" textLength="90.8" lengthAdjust="spacing">răufăcătorii.”</text>
<text x="156.8" y="280.1" font-size="15" fill="#3a3226" textLength="141.5" lengthAdjust="spacing">Întrebarea lui (ex. 2):</text>
<text x="302.4" y="280.1" font-size="15" fill="#10233f" font-style="italic" textLength="449.4" lengthAdjust="spacing">Care este ideea centrală în jurul căreia se construiește povestea?</text>
<text x="62.0" y="304.8" font-size="15" fill="#3a3226" textLength="597.7" lengthAdjust="spacing">Ideea centrală, cu cuvintele mele: ……………………………………………………………………………</text>
<text x="62.0" y="329.6" font-size="15" fill="#3a3226" textLength="551.6" lengthAdjust="spacing">……………………………………………………………………………………………………………………</text>
<rect x="40" y="372.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="395.1" font-size="16" font-weight="700" fill="#ffffff">2. CUM SE ÎNCHEIE UN BASM</text>
<rect x="40" y="406.1" width="820" height="177.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="424.1" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="450.6" font-size="14.5" fill="#10233f" font-weight="700" textLength="195.9" lengthAdjust="spacing">Din Repere, Lecția 2 (p. 144):</text>
<text x="78.0" y="469.4" font-size="14.5" fill="#3a3226" textLength="89.0" lengthAdjust="spacing">Situația finală</text>
<text x="170.9" y="469.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="148.0" lengthAdjust="spacing">restabilește echilibrul</text>
<text x="322.9" y="469.4" font-size="14.5" fill="#3a3226" textLength="10.8" lengthAdjust="spacing">și</text>
<text x="337.6" y="469.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="169.6" lengthAdjust="spacing">aduce răsplătirea eroului</text>
<text x="507.2" y="469.4" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<text x="62.0" y="514.8" font-size="15" fill="#3a3226" textLength="197.7" lengthAdjust="spacing">Întrebarea din manual (ex. 1):</text>
<text x="263.8" y="514.8" font-size="15" fill="#10233f" font-style="italic" textLength="510.6" lengthAdjust="spacing">Finalul textului Zâna Munților este, din acest punct de vedere, obișnuit sau</text>
<text x="62.0" y="536.5" font-size="15" fill="#10233f" font-style="italic" textLength="245.8" lengthAdjust="spacing">neobișnuit? Motivează-ți răspunsul.</text>
<text x="62.0" y="561.3" font-size="15" fill="#3a3226" textLength="610.7" lengthAdjust="spacing">Finalul este ………………………………, pentru că ………………………………………………………………</text>
<rect x="40" y="603.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="626.8" font-size="16" font-weight="700" fill="#ffffff">3. POVESTEA DE DRAGOSTE ÎN PATRU SECVENȚE</text>
<rect x="40" y="637.8" width="820" height="275.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="670.8" font-size="15" fill="#3a3226" textLength="750.6" lengthAdjust="spacing">La ex. 4, pe grupe, urmărim stările sufletești ale personajelor în cele patru secvențe. Pentru fiecare alegem un</text>
<text x="62.0" y="692.5" font-size="15" fill="#3a3226" font-weight="700" textLength="27.6" lengthAdjust="spacing">titlu</text>
<text x="93.6" y="692.5" font-size="15" fill="#3a3226" textLength="99.3" lengthAdjust="spacing">și desenăm un</text>
<text x="197.1" y="692.5" font-size="15" fill="#3a3226" font-weight="700" textLength="106.4" lengthAdjust="spacing">simbol al iubirii</text>
<text x="303.4" y="692.5" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">.</text>
<rect x="62.0" y="711.0" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="732.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="59.7" lengthAdjust="spacing">Secvența</text>
<text x="384.4" y="732.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="124.8" lengthAdjust="spacing">Stările personajelor</text>
<text x="617.2" y="732.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="61.6" lengthAdjust="spacing">Titlul ales</text>
<line x1="62.0" y1="742.6" x2="838.0" y2="742.6" stroke="#e3dccb"/>
<text x="74.0" y="765.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="8.1" lengthAdjust="spacing">a</text>
<text x="86.1" y="765.1" font-size="14.5" fill="#3a3226" textLength="251.4" lengthAdjust="spacing">întâlnirea fiului de împărat cu turturica</text>
<text x="74.0" y="786.1" font-size="14.5" fill="#3a3226" textLength="70.9" lengthAdjust="spacing">din pădure</text>
<text x="384.4" y="765.1" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<text x="617.2" y="765.1" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<line x1="62.0" y1="796.4" x2="838.0" y2="796.4" stroke="#e3dccb"/>
<text x="74.0" y="818.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="8.8" lengthAdjust="spacing">b</text>
<text x="86.8" y="818.9" font-size="14.5" fill="#3a3226" textLength="267.8" lengthAdjust="spacing">întâlnirea fiului de împărat cu găinăreasa</text>
<text x="384.4" y="818.9" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<text x="617.2" y="818.9" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<line x1="62.0" y1="829.3" x2="838.0" y2="829.3" stroke="#e3dccb"/>
<text x="74.0" y="851.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="8.3" lengthAdjust="spacing">c</text>
<text x="86.2" y="851.8" font-size="14.5" fill="#3a3226" textLength="267.8" lengthAdjust="spacing">întâlnirea lor la cele trei nunți împărătești</text>
<text x="384.4" y="851.8" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<text x="617.2" y="851.8" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<line x1="62.0" y1="862.1" x2="838.0" y2="862.1" stroke="#e3dccb"/>
<text x="74.0" y="884.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="8.8" lengthAdjust="spacing">d</text>
<text x="86.8" y="884.6" font-size="14.5" fill="#3a3226" textLength="181.2" lengthAdjust="spacing">nunta celor două personaje</text>
<text x="384.4" y="884.6" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<text x="617.2" y="884.6" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<line x1="62.0" y1="895.0" x2="838.0" y2="895.0" stroke="#e3dccb"/>
<line x1="372.4" y1="711.0" x2="372.4" y2="895.0" stroke="#e3dccb"/>
<line x1="605.2" y1="711.0" x2="605.2" y2="895.0" stroke="#e3dccb"/>
<rect x="40" y="933.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="956.0" font-size="16" font-weight="700" fill="#ffffff">4. AUTOEVALUARE L1-L4</text>
<rect x="40" y="967.0" width="820" height="138.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1000.0" font-size="15" fill="#3a3226" textLength="285.6" lengthAdjust="spacing">Completez, în caiet, următoarele afirmații:</text>
<text x="62.0" y="1033.5" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="1033.5" font-size="15" fill="#3a3226" textLength="382.8" lengthAdjust="spacing">Din ceea ce am învățat, cel mai important mi se pare … .</text>
<text x="62.0" y="1058.2" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="1058.2" font-size="15" fill="#3a3226" textLength="265.8" lengthAdjust="spacing">Cel mai mult mi-a plăcut activitatea … .</text>
<text x="62.0" y="1083.0" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="1083.0" font-size="15" fill="#3a3226" textLength="203.4" lengthAdjust="spacing">Cel mai dificil mi s-a părut … .</text>
<text x="60.0" y="1137.0" font-size="11.5" fill="#5b6b83" textLength="779.9" lengthAdjust="spacing">Sursa: Manual Art 5, p. 148 (Interpretare, ex. 1-4, și Autoevaluare L1-L4); definiția situației finale este din Repere, p. 144. Lecția nu are rubrica Repere.</text>
<text x="321.7" y="1153.7" font-size="11.5" fill="#5b6b83" textLength="256.6" lengthAdjust="spacing">Rândurile libere sunt pentru răspunsurile elevilor.</text>
</svg>
