<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1848" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1848" fill="#faf7f0"/>
<text x="73.7" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="741.2" lengthAdjust="spacing">Textul narativ literar. Zâna Munților, basm cules de Petre</text>
<text x="389.2" y="85.0" font-size="28" fill="#10233f" font-weight="700" textLength="121.6" lengthAdjust="spacing">Ispirescu</text>
<text x="212.3" y="109.4" font-size="14" fill="#5b6b83" textLength="475.4" lengthAdjust="spacing">Clasa a V-a · Unitatea V, Lecția 1 · Manual, pp. 140-143 · notițe pentru caiet</text>
<rect x="40" y="129.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="152.6" font-size="16" font-weight="700" fill="#ffffff">1. AUTORUL ȘI CULEGEREA</text>
<rect x="40" y="163.6" width="820" height="211.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="181.6" width="380.0" height="175.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="209.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="74.6" lengthAdjust="spacing">AUTORUL</text>
<text x="78.0" y="232.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="102.5" lengthAdjust="spacing">Petre Ispirescu</text>
<text x="184.4" y="232.9" font-size="14.5" fill="#3a3226" textLength="79.5" lengthAdjust="spacing">(1830-1887)</text>
<text x="78.0" y="256.8" font-size="14.5" fill="#3a3226" textLength="346.6" lengthAdjust="spacing">A fost tipograf de meserie, dar este cunoscut pentru</text>
<text x="78.0" y="277.9" font-size="14.5" fill="#3a3226" textLength="317.3" lengthAdjust="spacing">activitatea de culegător de basme și de legende</text>
<text x="78.0" y="298.9" font-size="14.5" fill="#3a3226" textLength="131.8" lengthAdjust="spacing">populare românești.</text>
<rect x="458.0" y="181.6" width="380.0" height="175.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="474.0" y="209.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="93.0" lengthAdjust="spacing">CULEGEREA</text>
<text x="474.0" y="232.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="224.8" lengthAdjust="spacing">Legendele sau basmele românilor</text>
<text x="702.7" y="232.9" font-size="14.5" fill="#3a3226" textLength="41.1" lengthAdjust="spacing">(1872)</text>
<text x="474.0" y="256.8" font-size="14.5" fill="#3a3226" textLength="309.7" lengthAdjust="spacing">Ispirescu a adunat creațiile de la părinți și de la</text>
<text x="474.0" y="277.9" font-size="14.5" fill="#3a3226" textLength="296.3" lengthAdjust="spacing">angajații tatălui său, frizer de meserie, și le-a</text>
<text x="474.0" y="298.9" font-size="14.5" fill="#3a3226" textLength="265.9" lengthAdjust="spacing">publicat în această culegere. Printre ele:</text>
<text x="743.8" y="298.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="73.7" lengthAdjust="spacing">Prâslea cel</text>
<text x="474.0" y="319.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="149.5" lengthAdjust="spacing">voinic și merele de aur</text>
<text x="623.5" y="319.9" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="631.5" y="319.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="117.9" lengthAdjust="spacing">Pasărea măiastră</text>
<text x="749.4" y="319.9" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="757.4" y="319.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="34.3" lengthAdjust="spacing">Zâna</text>
<text x="474.0" y="340.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="54.4" lengthAdjust="spacing">Munților</text>
<text x="528.4" y="340.9" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<rect x="40" y="395.3" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="418.3" font-size="16" font-weight="700" fill="#ffffff">2. FIȘA TEXTULUI</text>
<rect x="40" y="429.3" width="820" height="465.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="447.3" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="468.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.8" lengthAdjust="spacing">Întrebarea</text>
<text x="283.5" y="468.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="109.0" lengthAdjust="spacing">Ce găsesc în text</text>
<line x1="62.0" y1="478.8" x2="838.0" y2="478.8" stroke="#e3dccb"/>
<text x="74.0" y="501.3" font-size="14.5" fill="#3a3226" textLength="143.7" lengthAdjust="spacing">Cine sunt personajele</text>
<text x="74.0" y="522.4" font-size="14.5" fill="#3a3226" textLength="72.5" lengthAdjust="spacing">principale?</text>
<text x="283.5" y="501.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="100.9" lengthAdjust="spacing">Fiul de împărat</text>
<text x="384.4" y="501.3" font-size="14.5" fill="#3a3226" textLength="184.8" lengthAdjust="spacing">, vânător meșter și viteaz, și</text>
<text x="573.2" y="501.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="95.2" lengthAdjust="spacing">Zâna Munților</text>
<text x="668.4" y="501.3" font-size="14.5" fill="#3a3226" textLength="98.8" lengthAdjust="spacing">, care apare ca</text>
<text x="283.5" y="522.4" font-size="14.5" fill="#3a3226" textLength="366.3" lengthAdjust="spacing">turturică, ca găinăreasă și ca fată necunoscută la nunți.</text>
<line x1="62.0" y1="532.7" x2="838.0" y2="532.7" stroke="#e3dccb"/>
<text x="74.0" y="555.2" font-size="14.5" fill="#3a3226" textLength="106.4" lengthAdjust="spacing">Cine mai apare?</text>
<text x="283.5" y="555.2" font-size="14.5" fill="#3a3226" textLength="66.1" lengthAdjust="spacing">Împăratul,</text>
<text x="353.6" y="555.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="233.6" lengthAdjust="spacing">„judecător drept și iubitor de pace”</text>
<text x="587.2" y="555.2" font-size="14.5" fill="#3a3226" textLength="218.2" lengthAdjust="spacing">, împărăteasa, dascălii și filozofii,</text>
<text x="283.5" y="576.2" font-size="14.5" fill="#3a3226" textLength="373.2" lengthAdjust="spacing">vătaful, credincioșii împăratului, vracii și cititorii de stele.</text>
<line x1="62.0" y1="586.6" x2="838.0" y2="586.6" stroke="#e3dccb"/>
<text x="74.0" y="609.1" font-size="14.5" fill="#3a3226" textLength="168.4" lengthAdjust="spacing">Unde și când se petrece?</text>
<text x="283.5" y="609.1" font-size="14.5" fill="#3a3226" textLength="528.7" lengthAdjust="spacing">Locul și timpul nu sunt precizate. Apar curtea împărătească, pădurea în care fiul</text>
<text x="283.5" y="630.1" font-size="14.5" fill="#3a3226" textLength="310.6" lengthAdjust="spacing">de împărat vânează și nunțile din alte împărății.</text>
<line x1="62.0" y1="640.5" x2="838.0" y2="640.5" stroke="#e3dccb"/>
<text x="74.0" y="663.0" font-size="14.5" fill="#3a3226" textLength="128.1" lengthAdjust="spacing">Ce obstacole apar?</text>
<text x="283.5" y="663.0" font-size="14.5" fill="#3a3226" textLength="365.7" lengthAdjust="spacing">Zâna nu i se poate arăta fiului de împărat așa cum este:</text>
<text x="653.1" y="663.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="157.5" lengthAdjust="spacing">„de va lua de bărbat un</text>
<text x="283.5" y="684.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="273.8" lengthAdjust="spacing">om de pe pământ, toată puterea ei piere”</text>
<text x="557.3" y="684.0" font-size="14.5" fill="#3a3226" textLength="241.6" lengthAdjust="spacing">. La nunți, fata necunoscută piere de</text>
<text x="283.5" y="705.0" font-size="14.5" fill="#3a3226" textLength="290.3" lengthAdjust="spacing">lângă el, iar fiul de împărat se îmbolnăvește.</text>
<line x1="62.0" y1="715.4" x2="838.0" y2="715.4" stroke="#e3dccb"/>
<text x="74.0" y="737.9" font-size="14.5" fill="#3a3226" textLength="185.0" lengthAdjust="spacing">Cum o recunoaște pe zână?</text>
<text x="283.5" y="737.9" font-size="14.5" fill="#3a3226" textLength="537.5" lengthAdjust="spacing">Împăratul pune smoală pe drum, iar fata își pierde un condur. Se potrivește numai</text>
<text x="283.5" y="758.9" font-size="14.5" fill="#3a3226" textLength="301.4" lengthAdjust="spacing">piciorului găinăresei, iar fiul de împărat strigă:</text>
<text x="588.8" y="758.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="128.5" lengthAdjust="spacing">„Asta este, mamă.”</text>
<line x1="62.0" y1="769.2" x2="838.0" y2="769.2" stroke="#e3dccb"/>
<text x="74.0" y="791.7" font-size="14.5" fill="#3a3226" textLength="109.2" lengthAdjust="spacing">Cum se încheie?</text>
<text x="283.5" y="791.7" font-size="14.5" fill="#3a3226" textLength="81.6" lengthAdjust="spacing">Zâna spune:</text>
<text x="369.0" y="791.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="275.4" lengthAdjust="spacing">„mă lepăd de puterea mea cea măiastră”</text>
<text x="644.4" y="791.7" font-size="14.5" fill="#3a3226" textLength="158.5" lengthAdjust="spacing">. Fiul de împărat se face</text>
<text x="283.5" y="812.8" font-size="14.5" fill="#3a3226" textLength="341.9" lengthAdjust="spacing">sănătos, ei fac nuntă și rămân în scaunul împărăției.</text>
<line x1="62.0" y1="823.1" x2="838.0" y2="823.1" stroke="#e3dccb"/>
<text x="74.0" y="845.6" font-size="14.5" fill="#3a3226" textLength="177.0" lengthAdjust="spacing">De la cine a auzit Ispirescu</text>
<text x="74.0" y="866.6" font-size="14.5" fill="#3a3226" textLength="55.1" lengthAdjust="spacing">basmul?</text>
<text x="283.5" y="845.6" font-size="14.5" fill="#3a3226" textLength="256.5" lengthAdjust="spacing">De la o calfă de bărbier, în copilăria lui.</text>
<line x1="62.0" y1="877.0" x2="838.0" y2="877.0" stroke="#e3dccb"/>
<line x1="271.5" y1="447.3" x2="271.5" y2="877.0" stroke="#e3dccb"/>
<rect x="40" y="915.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="938.0" font-size="16" font-weight="700" fill="#ffffff">3. CUVINTE NOI DIN NOTELE DE SUBSOL</text>
<rect x="40" y="949.0" width="820" height="492.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="967.0" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="988.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">Cuvântul</text>
<text x="337.8" y="988.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="135.0" lengthAdjust="spacing">Explicația din manual</text>
<line x1="62.0" y1="998.5" x2="838.0" y2="998.5" stroke="#e3dccb"/>
<text x="74.0" y="1021.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="41.4" lengthAdjust="spacing">filozof</text>
<text x="119.4" y="1021.0" font-size="14.5" fill="#3a3226" textLength="79.5" lengthAdjust="spacing">(s. m., pop.)</text>
<text x="337.8" y="1021.0" font-size="14.5" fill="#3a3226" textLength="277.6" lengthAdjust="spacing">aici, om învățat, priceput în toate; astrolog</text>
<line x1="62.0" y1="1031.4" x2="838.0" y2="1031.4" stroke="#e3dccb"/>
<text x="74.0" y="1053.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="62.5" lengthAdjust="spacing">procopsit</text>
<text x="140.4" y="1053.9" font-size="14.5" fill="#3a3226" textLength="71.7" lengthAdjust="spacing">(adj., pop.)</text>
<text x="337.8" y="1053.9" font-size="14.5" fill="#3a3226" textLength="160.6" lengthAdjust="spacing">învățat, instruit, priceput</text>
<line x1="62.0" y1="1064.2" x2="838.0" y2="1064.2" stroke="#e3dccb"/>
<text x="74.0" y="1086.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="36.1" lengthAdjust="spacing">galeș</text>
<text x="114.0" y="1086.7" font-size="14.5" fill="#3a3226" textLength="34.1" lengthAdjust="spacing">(adj.)</text>
<text x="337.8" y="1086.7" font-size="14.5" fill="#3a3226" textLength="104.7" lengthAdjust="spacing">melancolic, trist</text>
<line x1="62.0" y1="1097.1" x2="838.0" y2="1097.1" stroke="#e3dccb"/>
<text x="74.0" y="1119.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="40.9" lengthAdjust="spacing">a tânji</text>
<text x="118.9" y="1119.6" font-size="14.5" fill="#3a3226" textLength="30.8" lengthAdjust="spacing">(vb.)</text>
<text x="337.8" y="1119.6" font-size="14.5" fill="#3a3226" textLength="437.5" lengthAdjust="spacing">a se afla într-o stare de slăbiciune fizică, a fi bolnăvicios; a lâncezi</text>
<line x1="62.0" y1="1129.9" x2="838.0" y2="1129.9" stroke="#e3dccb"/>
<text x="74.0" y="1152.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="60.6" lengthAdjust="spacing">smerenie</text>
<text x="138.6" y="1152.4" font-size="14.5" fill="#3a3226" textLength="34.0" lengthAdjust="spacing">(s. f.)</text>
<text x="337.8" y="1152.4" font-size="14.5" fill="#3a3226" textLength="218.2" lengthAdjust="spacing">modestie, bună-cuviință, respect</text>
<line x1="62.0" y1="1162.8" x2="838.0" y2="1162.8" stroke="#e3dccb"/>
<text x="74.0" y="1185.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="34.7" lengthAdjust="spacing">vătaf</text>
<text x="112.7" y="1185.3" font-size="14.5" fill="#3a3226" textLength="41.9" lengthAdjust="spacing">(s. m.)</text>
<text x="337.8" y="1185.3" font-size="14.5" fill="#3a3226" textLength="483.8" lengthAdjust="spacing">(în Evul Mediu, în Țara Românească și Moldova) supraveghetor al slugilor</text>
<text x="337.8" y="1206.3" font-size="14.5" fill="#3a3226" textLength="347.4" lengthAdjust="spacing">de la curtea unui boier sau de la o mănăstire; logofăt</text>
<line x1="62.0" y1="1216.7" x2="838.0" y2="1216.7" stroke="#e3dccb"/>
<text x="74.0" y="1239.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="45.4" lengthAdjust="spacing">nălucă</text>
<text x="123.3" y="1239.2" font-size="14.5" fill="#3a3226" textLength="34.0" lengthAdjust="spacing">(s. f.)</text>
<text x="337.8" y="1239.2" font-size="14.5" fill="#3a3226" textLength="429.3" lengthAdjust="spacing">apariție fantastică, imaginară; arătare, fantomă, vedenie, nălucire</text>
<line x1="62.0" y1="1249.5" x2="838.0" y2="1249.5" stroke="#e3dccb"/>
<text x="74.0" y="1272.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="237.5" lengthAdjust="spacing">a prinde / a dobândi lipici de cineva</text>
<text x="74.0" y="1293.0" font-size="14.5" fill="#3a3226" textLength="42.6" lengthAdjust="spacing">(expr.)</text>
<text x="337.8" y="1272.0" font-size="14.5" fill="#3a3226" textLength="165.1" lengthAdjust="spacing">a se îndrăgosti de cineva</text>
<line x1="62.0" y1="1303.4" x2="838.0" y2="1303.4" stroke="#e3dccb"/>
<text x="74.0" y="1325.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="46.9" lengthAdjust="spacing">condur</text>
<text x="124.8" y="1325.9" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">(s. m., înv.)</text>
<text x="337.8" y="1325.9" font-size="14.5" fill="#3a3226" textLength="385.7" lengthAdjust="spacing">pantof femeiesc cu toc înalt, împodobit adesea cu broderii</text>
<line x1="62.0" y1="1336.2" x2="838.0" y2="1336.2" stroke="#e3dccb"/>
<text x="74.0" y="1358.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="33.6" lengthAdjust="spacing">calfă</text>
<text x="111.6" y="1358.7" font-size="14.5" fill="#3a3226" textLength="34.0" lengthAdjust="spacing">(s. f.)</text>
<text x="337.8" y="1358.7" font-size="14.5" fill="#3a3226" textLength="447.0" lengthAdjust="spacing">persoană tânără care, după o perioadă de ucenicie, lucra un timp la</text>
<text x="337.8" y="1379.8" font-size="14.5" fill="#3a3226" textLength="82.1" lengthAdjust="spacing">patronul său</text>
<line x1="62.0" y1="1390.1" x2="838.0" y2="1390.1" stroke="#e3dccb"/>
<line x1="325.8" y1="967.0" x2="325.8" y2="1390.1" stroke="#e3dccb"/>
<text x="62.0" y="1419.1" font-size="15" fill="#3a3226" textLength="663.9" lengthAdjust="spacing">Un cuvânt nou, ales de mine: ……………………………… Explicația lui: ……………………………………………</text>
<rect x="40" y="1461.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1484.6" font-size="16" font-weight="700" fill="#ffffff">4. IMPRESII DUPĂ PRIMA LECTURĂ</text>
<rect x="40" y="1495.6" width="820" height="284.4" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1528.6" font-size="15" fill="#3a3226" textLength="437.1" lengthAdjust="spacing">Înainte de lectură am notat trei lucruri care s-ar putea întâmpla (</text>
<text x="499.1" y="1528.6" font-size="15" fill="#10233f" font-style="italic" textLength="100.0" lengthAdjust="spacing">Pentru început</text>
<text x="599.1" y="1528.6" font-size="15" fill="#3a3226" textLength="220.3" lengthAdjust="spacing">, ex. 2, p. 140). Acum răspund la</text>
<text x="62.0" y="1550.3" font-size="15" fill="#3a3226" textLength="254.7" lengthAdjust="spacing">cele trei întrebări din manual (p. 143).</text>
<rect x="62.0" y="1568.8" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1590.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="138.7" lengthAdjust="spacing">Întrebarea din manual</text>
<text x="462.0" y="1590.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="97.8" lengthAdjust="spacing">Răspunsul meu</text>
<line x1="62.0" y1="1600.4" x2="838.0" y2="1600.4" stroke="#e3dccb"/>
<text x="74.0" y="1622.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="10.7" lengthAdjust="spacing">1.</text>
<text x="88.7" y="1622.9" font-size="14.5" fill="#3a3226" textLength="317.0" lengthAdjust="spacing">S-a confirmat ceea ce ai anticipat în legătură cu</text>
<text x="74.0" y="1643.9" font-size="14.5" fill="#3a3226" textLength="55.1" lengthAdjust="spacing">basmul?</text>
<text x="462.0" y="1622.9" font-size="14.5" fill="#3a3226" textLength="145.4" lengthAdjust="spacing">………………………………</text>
<line x1="62.0" y1="1654.3" x2="838.0" y2="1654.3" stroke="#e3dccb"/>
<text x="74.0" y="1676.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="13.5" lengthAdjust="spacing">2.</text>
<text x="91.5" y="1676.8" font-size="14.5" fill="#3a3226" textLength="328.5" lengthAdjust="spacing">La ce imagini sau sunete te-a făcut să te gândești</text>
<text x="74.0" y="1697.8" font-size="14.5" fill="#3a3226" textLength="244.0" lengthAdjust="spacing">textul? Trimit acestea la lumea reală?</text>
<text x="462.0" y="1676.8" font-size="14.5" fill="#3a3226" textLength="145.4" lengthAdjust="spacing">………………………………</text>
<line x1="62.0" y1="1708.1" x2="838.0" y2="1708.1" stroke="#e3dccb"/>
