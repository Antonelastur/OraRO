<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="596" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Vocea și corpul, când prezinți</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea V · Comunicare orală</text>
  <rect x="36" y="96" width="928" height="58" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="56" y="120" font-size="13" font-weight="700" fill="#10233f">Într-o prezentare orală contează la fel de mult ce spui și cum spui</text>
  <text x="56" y="140" font-size="12" fill="#3d4a5f">Verbal: cuvintele alese.  Paraverbal: cum sună vocea.  Nonverbal: ce arată corpul.</text>
  <rect x="36" y="166" width="452" height="34" rx="10" fill="#3b5fa8"/>
  <text x="262" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PARAVERBALE · VOCEA</text>
  <rect x="512" y="166" width="452" height="34" rx="10" fill="#a1417e"/>
  <text x="738" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">NONVERBALE · CORPUL</text>
  <rect x="36" y="212" width="452" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Intensitatea vocii</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">potrivită publicului și sălii, nici prea tare, nici prea încet</text>
  <rect x="36" y="282" width="452" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="306" font-size="13" font-weight="700" fill="#10233f">Intonația</text>
  <text x="56" y="326" font-size="12" fill="#3d4a5f">accentuează ce e important</text>
  <rect x="36" y="352" width="452" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="376" font-size="13" font-weight="700" fill="#10233f">Ritmul</text>
  <text x="56" y="396" font-size="12" fill="#3d4a5f">mai rar decât în conversație, ca ascultătorii să înțeleagă</text>
  <rect x="36" y="422" width="452" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="446" font-size="13" font-weight="700" fill="#10233f">Pauza</text>
  <text x="56" y="466" font-size="12" fill="#3d4a5f">subliniază o idee importantă</text>
  <rect x="512" y="212" width="452" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="532" y="236" font-size="13" font-weight="700" fill="#10233f">Mimica</text>
  <text x="532" y="256" font-size="12" fill="#3d4a5f">arată deschidere; un chip zâmbitor, nu unul încruntat</text>
  <rect x="512" y="282" width="452" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="532" y="306" font-size="13" font-weight="700" fill="#10233f">Gesturile</text>
  <text x="532" y="326" font-size="12" fill="#3d4a5f">măsurate și firești, întăresc spusele</text>
  <rect x="512" y="352" width="452" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="532" y="376" font-size="13" font-weight="700" fill="#10233f">Poziția corpului</text>
  <text x="532" y="396" font-size="12" fill="#3d4a5f">sigură, dreaptă, dar nu rigidă</text>
  <rect x="512" y="422" width="452" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="532" y="446" font-size="13" font-weight="700" fill="#10233f">Contactul vizual</text>
  <text x="532" y="466" font-size="12" fill="#3d4a5f">arată respect; privești toată sala, nu un singur om</text>
  <rect x="36" y="492" width="928" height="58" rx="12" fill="#ffffff" stroke="#c1503a" stroke-width="2"/>
  <text x="56" y="516" font-size="13" font-weight="700" fill="#10233f">Capcana</text>
  <text x="56" y="536" font-size="12" fill="#3d4a5f">Intonația NU e nonverbală. Tot ce ține de voce e paraverbal, tot ce ține de corp e nonverbal.</text>
  <text x="500" y="582" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 7, pp. 155-156</text>
</svg>
