<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="650" fill="#faf7f0"/>
<text x="290.7" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="318.9" lengthAdjust="spacing">Recapitulare. Numeralul</text>
<text x="216.2" y="74.4" font-size="14" fill="#5b6b83" textLength="467.6" lengthAdjust="spacing">Clasa a V-a · Unitatea V, Lecția 16 · Manual, pp. 158-165 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. FELURILE NUMERALULUI</text>
<rect x="40" y="128.6" width="820" height="166.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="30.1" lengthAdjust="spacing">Felul</text>
<text x="268.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="71.4" lengthAdjust="spacing">Ce exprimă</text>
<text x="500.8" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="53.7" lengthAdjust="spacing">Exemple</text>
<line x1="62.0" y1="178.2" x2="838.0" y2="178.2" stroke="#e3dccb"/>
<text x="74.0" y="200.7" font-size="14.5" fill="#3a3226" textLength="96.6" lengthAdjust="spacing">cardinal simplu</text>
<text x="268.0" y="200.7" font-size="14.5" fill="#3a3226" textLength="61.9" lengthAdjust="spacing">un număr</text>
<text x="500.8" y="200.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="55.0" lengthAdjust="spacing">trei, zece</text>
<line x1="62.0" y1="211.0" x2="838.0" y2="211.0" stroke="#e3dccb"/>
<text x="74.0" y="233.5" font-size="14.5" fill="#3a3226" textLength="104.8" lengthAdjust="spacing">cardinal compus</text>
<text x="268.0" y="233.5" font-size="14.5" fill="#3a3226" textLength="61.9" lengthAdjust="spacing">un număr</text>
<text x="500.8" y="233.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="228.7" lengthAdjust="spacing">șaptesprezece, douăzeci și opt, o mie</text>
<line x1="62.0" y1="243.8" x2="838.0" y2="243.8" stroke="#e3dccb"/>
<text x="74.0" y="266.4" font-size="14.5" fill="#3a3226" textLength="44.8" lengthAdjust="spacing">ordinal</text>
<text x="268.0" y="266.4" font-size="14.5" fill="#3a3226" textLength="48.9" lengthAdjust="spacing">ordinea</text>
<text x="500.8" y="266.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="269.3" lengthAdjust="spacing">primul, întâiul, al doilea, a doua, al cincilea</text>
<line x1="62.0" y1="276.7" x2="838.0" y2="276.7" stroke="#e3dccb"/>
<line x1="256.0" y1="146.6" x2="256.0" y2="276.7" stroke="#e3dccb"/>
<line x1="488.8" y1="146.6" x2="488.8" y2="276.7" stroke="#e3dccb"/>
<rect x="40" y="314.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="337.7" font-size="16" font-weight="700" fill="#ffffff">2. „UN” ȘI „O”</text>
<rect x="40" y="348.7" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="381.7" font-size="15" fill="#3a3226" font-weight="700" textLength="66.6" lengthAdjust="spacing">numerale</text>
<text x="132.7" y="381.7" font-size="15" fill="#3a3226" textLength="202.0" lengthAdjust="spacing">când apar cu alte numerale, cu</text>
<text x="338.7" y="381.7" font-size="15" fill="#10233f" font-style="italic" textLength="126.3" lengthAdjust="spacing">singur, numai, doar</text>
<text x="469.1" y="381.7" font-size="15" fill="#3a3226" textLength="307.8" lengthAdjust="spacing">sau ca unitate de măsură; altfel sunt, de obicei,</text>
<text x="780.9" y="381.7" font-size="15" fill="#3a3226" font-weight="700" textLength="52.8" lengthAdjust="spacing">articole</text>
<text x="62.0" y="403.4" font-size="15" fill="#3a3226" font-weight="700" textLength="77.4" lengthAdjust="spacing">nehotărâte</text>
<text x="139.4" y="403.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="146.8" y="403.4" font-size="15" fill="#10233f" font-style="italic" textLength="8.1" lengthAdjust="spacing">o</text>
<text x="158.9" y="403.4" font-size="15" fill="#3a3226" textLength="64.5" lengthAdjust="spacing">poate fi și</text>
<text x="227.4" y="403.4" font-size="15" fill="#3a3226" font-weight="700" textLength="64.7" lengthAdjust="spacing">pronume</text>
<text x="292.1" y="403.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="299.4" y="403.4" font-size="15" fill="#10233f" font-style="italic" textLength="41.9" lengthAdjust="spacing">O văd.</text>
<rect x="40" y="445.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="468.9" font-size="16" font-weight="700" fill="#ffffff">3. FORME CORECTE</text>
<rect x="40" y="479.9" width="820" height="118.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="497.9" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="497.9" width="6" height="82.7" rx="3" fill="#b4432c"/><text x="84.0" y="524.5" font-size="14.5" fill="#b4432c" font-weight="700" textLength="54.8" lengthAdjust="spacing">Atenție!</text>
<text x="84.0" y="543.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="73.4" lengthAdjust="spacing">optsprezece</text>
<text x="157.4" y="543.3" font-size="14.5" fill="#3a3226" textLength="23.6" lengthAdjust="spacing">, nu</text>
<text x="184.9" y="543.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="81.2" lengthAdjust="spacing">optâsprezece</text>
<text x="270.0" y="543.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">·</text>
<text x="277.1" y="543.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="108.6" lengthAdjust="spacing">douăsprezece mii</text>
<text x="385.7" y="543.3" font-size="14.5" fill="#3a3226" textLength="149.9" lengthAdjust="spacing">, cu substantiv feminin ·</text>
<text x="539.6" y="543.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="140.4" lengthAdjust="spacing">treizeci și una de litere</text>
<text x="683.9" y="543.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">·</text>
<text x="691.0" y="543.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="122.8" lengthAdjust="spacing">unul din patru copii</text>
<text x="817.7" y="543.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">·</text>
<text x="84.0" y="564.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="41.2" lengthAdjust="spacing">șaizeci</text>
<text x="125.2" y="564.3" font-size="14.5" fill="#3a3226" textLength="23.6" lengthAdjust="spacing">, nu</text>
<text x="152.7" y="564.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="50.3" lengthAdjust="spacing">șasezeci</text>
<text x="207.0" y="564.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">·</text>
<text x="214.1" y="564.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="150.1" lengthAdjust="spacing">paisprezece, șaisprezece</text>
<text x="158.9" y="630.2" font-size="11.5" fill="#5b6b83" textLength="582.1" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 158-161, rubricile Repere ale lecțiilor 9-10. Unele exemple sunt create pentru aceste notițe.</text>
</svg>
