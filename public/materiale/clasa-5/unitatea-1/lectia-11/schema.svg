<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Sinonimele. Antonimele</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 11</text>

  <g>
    <rect x="80" y="100" width="330" height="180" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="245" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#10233f">SINONIME</text>
    <text font-size="13" fill="#3a3226" text-anchor="middle">
      <tspan x="245" y="160">Formă diferită,</tspan>
      <tspan x="245" y="180">sens asemănător</tspan>
      <tspan x="245" y="200">sau identic.</tspan>
      <tspan x="245" y="234" font-style="italic">vesel — bucuros</tspan>
      <tspan x="245" y="254" font-style="italic">harnic — silitor</tspan>
    </text>
  </g>

  <g>
    <rect x="490" y="100" width="330" height="180" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="655" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#10233f">ANTONIME</text>
    <text font-size="13" fill="#3a3226" text-anchor="middle">
      <tspan x="655" y="160">Formă diferită,</tspan>
      <tspan x="655" y="180">sens opus.</tspan>
      <tspan x="655" y="234" font-style="italic">vesel — trist</tspan>
      <tspan x="655" y="254" font-style="italic">a coborî — a urca</tspan>
    </text>
  </g>

  <text x="450" y="310" text-anchor="middle" font-size="12" fill="#3a3226">Ambele trebuie să fie aceeași parte de vorbire.</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual Art 5, pp. 28-29 (Repere)</text>
</svg>
