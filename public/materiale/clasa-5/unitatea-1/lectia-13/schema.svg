<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="460" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Sunetele limbii române</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 13 · Tipurile de sunete</text>

  <!-- Vocale -->
  <g>
    <rect x="30" y="90" width="260" height="330" rx="18" fill="#ffffff" stroke="#6f5ea8" stroke-width="2.5"/>
    <text x="160" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#6f5ea8">VOCALE</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="160" y="150">Se pronunță neînsoțite de</tspan>
      <tspan x="160" y="166">alt sunet și pot forma</tspan>
      <tspan x="160" y="182">singure o silabă.</tspan>
    </text>
    <g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
      <circle cx="75" cy="230" r="24" fill="#6f5ea8"/><text x="75" y="236">a</text>
      <circle cx="135" cy="230" r="24" fill="#6f5ea8"/><text x="135" y="236">ă</text>
      <circle cx="195" cy="230" r="24" fill="#6f5ea8"/><text x="195" y="236">î</text>
      <circle cx="255" cy="230" r="24" fill="#6f5ea8"/><text x="255" y="236">e</text>
      <circle cx="105" cy="286" r="24" fill="#6f5ea8"/><text x="105" y="292">i</text>
      <circle cx="165" cy="286" r="24" fill="#6f5ea8"/><text x="165" y="292">o</text>
      <circle cx="225" cy="286" r="24" fill="#6f5ea8"/><text x="225" y="292">u</text>
    </g>
    <text x="160" y="400" text-anchor="middle" font-size="11.5" fill="#5b6b83">a, ă, î sunt întotdeauna vocale</text>
  </g>

  <!-- Consoane -->
  <g>
    <rect x="320" y="90" width="260" height="330" rx="18" fill="#ffffff" stroke="#0d9c92" stroke-width="2.5"/>
    <text x="450" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#0d9c92">CONSOANE</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="450" y="150">Nu pot forma singure</tspan>
      <tspan x="450" y="166">o silabă, se pronunță</tspan>
      <tspan x="450" y="182">cu ajutorul unei vocale.</tspan>
    </text>
    <text x="450" y="215" text-anchor="middle" font-size="13.5" fill="#10233f" font-weight="600">b c d f g h j l m</text>
    <text x="450" y="242" text-anchor="middle" font-size="13.5" fill="#10233f" font-weight="600">n p r s ș t ț v z</text>
    <rect x="360" y="270" width="180" height="120" rx="12" fill="#0d9c9214"/>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="450" y="296">18 consoane redate,</tspan>
      <tspan x="450" y="314">de regulă, printr-o</tspan>
      <tspan x="450" y="332">singură literă.</tspan>
      <tspan x="450" y="358">O silabă conține</tspan>
      <tspan x="450" y="376">o singură vocală.</tspan>
    </text>
  </g>

  <!-- Semivocale -->
  <g>
    <rect x="610" y="90" width="260" height="330" rx="18" fill="#ffffff" stroke="#b8944f" stroke-width="2.5"/>
    <text x="740" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#b8944f">SEMIVOCALE</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle">
      <tspan x="740" y="150">Seamănă cu vocalele,</tspan>
      <tspan x="740" y="166">dar nu pot forma</tspan>
      <tspan x="740" y="182">singure o silabă.</tspan>
    </text>
    <g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
      <circle cx="680" cy="240" r="24" fill="#b8944f"/><text x="680" y="246">ĕ</text>
      <circle cx="740" cy="240" r="24" fill="#b8944f"/><text x="740" y="246">ĭ</text>
      <circle cx="680" cy="296" r="24" fill="#b8944f"/><text x="680" y="302">ŏ</text>
      <circle cx="740" cy="296" r="24" fill="#b8944f"/><text x="740" y="302">ŭ</text>
    </g>
    <text font-size="11.5" fill="#5b6b83" text-anchor="middle">
      <tspan x="740" y="360">Ex.: noi (i = semivocală)</tspan>
      <tspan x="740" y="378">metri (i = vocală)</tspan>
    </text>
  </g>

  <text x="450" y="448" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual Art 5, pp. 32-33 (Repere)</text>
</svg>
