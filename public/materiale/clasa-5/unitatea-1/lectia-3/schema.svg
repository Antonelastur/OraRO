<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1200" fill="#faf7f0"/>
<text x="163.3" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="574.8" lengthAdjust="spacing">Cuvântul-cheie. Tema. Planul simplu de idei</text>
<text x="244.5" y="74.4" font-size="14" fill="#5b6b83" textLength="411.0" lengthAdjust="spacing">Clasa a V-a · Unitatea I, Lecția 3 · Manual, p. 15 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CUVÂNTUL-CHEIE</text>
<rect x="40" y="128.6" width="820" height="113.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="112.6" lengthAdjust="spacing">Cuvântul-cheie</text>
<text x="179.0" y="162.6" font-size="16" fill="#10233f" textLength="645.9" lengthAdjust="spacing">este un substantiv sau un grup de cuvinte care numește aspectul cel mai important dintr-un</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="68.3" lengthAdjust="spacing">fragment.</text>
<text x="62.0" y="219.6" font-size="15" fill="#3a3226" textLength="264.4" lengthAdjust="spacing">Într-un text pot fi identificate, de regulă,</text>
<text x="330.5" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="71.4" lengthAdjust="spacing">mai multe</text>
<text x="405.9" y="219.6" font-size="15" fill="#3a3226" textLength="91.6" lengthAdjust="spacing">cuvinte-cheie.</text>
<rect x="40" y="262.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="285.1" font-size="16" font-weight="700" fill="#ffffff">2. TEMA</text>
<rect x="40" y="296.1" width="820" height="215.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="330.1" font-size="16" fill="#10233f" font-weight="700" textLength="41.4" lengthAdjust="spacing">Tema</text>
<text x="107.7" y="330.1" font-size="16" fill="#10233f" textLength="499.7" lengthAdjust="spacing">unui text oral sau scris este ideea centrală dezvoltată în cadrul acestuia.</text>
<text x="62.0" y="363.9" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="363.9" font-size="15" fill="#3a3226" textLength="245.8" lengthAdjust="spacing">Pentru numirea temei se folosește un</text>
<text x="324.1" y="363.9" font-size="15" fill="#3a3226" font-weight="700" textLength="72.9" lengthAdjust="spacing">substantiv</text>
<text x="397.0" y="363.9" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="388.7" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="388.7" font-size="15" fill="#3a3226" textLength="154.8" lengthAdjust="spacing">Teme literare frecvente:</text>
<text x="233.0" y="388.7" font-size="15" fill="#10233f" font-style="italic" textLength="407.8" lengthAdjust="spacing">călătoria, copilăria, dragostea, familia, natura, prietenia, școala</text>
<text x="640.9" y="388.7" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="413.4" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="413.4" font-size="15" fill="#3a3226" textLength="47.7" lengthAdjust="spacing">Uneori,</text>
<text x="126.0" y="413.4" font-size="15" fill="#3a3226" font-weight="700" textLength="33.5" lengthAdjust="spacing">titlul</text>
<text x="163.5" y="413.4" font-size="15" fill="#3a3226" textLength="188.2" lengthAdjust="spacing">textului poate anticipa tema.</text>
<rect x="62.0" y="431.9" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="458.4" font-size="14.5" fill="#10233f" font-weight="700" textLength="80.0" lengthAdjust="spacing">Deosebirea:</text>
<text x="78.0" y="477.3" font-size="14.5" fill="#3a3226" textLength="327.3" lengthAdjust="spacing">Cuvântul-cheie numește ce e mai important într-un</text>
<text x="409.2" y="477.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="63.8" lengthAdjust="spacing">fragment</text>
<text x="473.0" y="477.3" font-size="14.5" fill="#3a3226" textLength="173.9" lengthAdjust="spacing">; tema este ideea centrală a</text>
<text x="650.7" y="477.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="98.2" lengthAdjust="spacing">întregului text</text>
<text x="748.9" y="477.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<rect x="40" y="531.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="554.6" font-size="16" font-weight="700" fill="#ffffff">3. IDEEA PRINCIPALĂ</text>
<rect x="40" y="565.6" width="820" height="317.4" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="599.6" font-size="16" fill="#10233f" font-weight="700" textLength="119.8" lengthAdjust="spacing">Ideea principală</text>
<text x="186.2" y="599.6" font-size="16" fill="#10233f" textLength="610.4" lengthAdjust="spacing">este comunicarea prin care se transmite informația esențială dintr-un fragment de text.</text>
<text x="62.0" y="633.4" font-size="15" fill="#3a3226" textLength="119.8" lengthAdjust="spacing">Poate fi exprimată</text>
<text x="185.9" y="633.4" font-size="15" fill="#3a3226" font-weight="700" textLength="40.6" lengthAdjust="spacing">direct</text>
<text x="230.6" y="633.4" font-size="15" fill="#3a3226" textLength="122.2" lengthAdjust="spacing">în text sau poate fi</text>
<text x="356.9" y="633.4" font-size="15" fill="#3a3226" font-weight="700" textLength="67.3" lengthAdjust="spacing">desprinsă</text>
<text x="428.3" y="633.4" font-size="15" fill="#3a3226" textLength="331.5" lengthAdjust="spacing">prin punerea în legătură a unor informații din text.</text>
<text x="62.0" y="666.9" font-size="15" fill="#3a3226" font-weight="700" textLength="117.2" lengthAdjust="spacing">Cum o formulez:</text>
<rect x="62.0" y="685.4" width="182.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="713.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="89.3" lengthAdjust="spacing">1. Delimitez</text>
<text x="78.0" y="736.7" font-size="14.5" fill="#3a3226" textLength="105.1" lengthAdjust="spacing">fragmentul logic</text>
<rect x="260.0" y="685.4" width="182.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="276.0" y="713.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="68.5" lengthAdjust="spacing">2. Găsesc</text>
<text x="276.0" y="736.7" font-size="14.5" fill="#3a3226" textLength="93.5" lengthAdjust="spacing">cuvântul-cheie</text>
<rect x="458.0" y="685.4" width="182.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="474.0" y="713.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="67.5" lengthAdjust="spacing">3. Adaug</text>
<text x="474.0" y="736.7" font-size="14.5" fill="#3a3226" textLength="72.6" lengthAdjust="spacing">un predicat</text>
<rect x="656.0" y="685.4" width="182.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="672.0" y="713.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="98.1" lengthAdjust="spacing">4. Completez</text>
<text x="672.0" y="736.7" font-size="14.5" fill="#3a3226" textLength="92.2" lengthAdjust="spacing">cu alte cuvinte</text>
<text x="62.0" y="782.0" font-size="15" fill="#3a3226" textLength="260.7" lengthAdjust="spacing">Ideea principală răspunde la întrebarea:</text>
<text x="326.7" y="782.0" font-size="15" fill="#10233f" font-style="italic" textLength="325.9" lengthAdjust="spacing">Despre ce/cine este vorba în fragmentul delimitat?</text>
<rect x="62.0" y="800.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="822.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="126.6" lengthAdjust="spacing">Delimitarea textului</text>
<text x="368.9" y="822.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="95.0" lengthAdjust="spacing">Cuvântul-cheie</text>
<text x="539.6" y="822.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="101.1" lengthAdjust="spacing">Ideea principală</text>
<line x1="62.0" y1="832.1" x2="838.0" y2="832.1" stroke="#e3dccb"/>
<text x="74.0" y="854.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="238.7" lengthAdjust="spacing">„Nu știu [...] nu cumva să îndrăznești!”</text>
<text x="368.9" y="854.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="33.9" lengthAdjust="spacing">marți</text>
<text x="539.6" y="854.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="146.2" lengthAdjust="spacing">Marți a fost o zi dificilă.</text>
<line x1="62.0" y1="864.9" x2="838.0" y2="864.9" stroke="#e3dccb"/>
<line x1="356.9" y1="800.5" x2="356.9" y2="864.9" stroke="#e3dccb"/>
<line x1="527.6" y1="800.5" x2="527.6" y2="864.9" stroke="#e3dccb"/>
<rect x="40" y="903.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="926.0" font-size="16" font-weight="700" fill="#ffffff">4. PLANUL SIMPLU DE IDEI</text>
<rect x="40" y="937.0" width="820" height="212.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="971.0" font-size="16" fill="#10233f" font-weight="700" textLength="156.8" lengthAdjust="spacing">Planul simplu de idei</text>
<text x="223.1" y="971.0" font-size="16" fill="#10233f" textLength="585.4" lengthAdjust="spacing">cuprinde toate ideile principale ale textului, înlănțuite în ordinea apariției lor în text.</text>
<rect x="62.0" y="989.8" width="776.0" height="109.6" rx="12" fill="#f3efe4"/><text x="78.0" y="1016.2" font-size="14.5" fill="#10233f" font-weight="700" textLength="136.7" lengthAdjust="spacing">Cum îl scriu în caiet:</text>
<text x="78.0" y="1035.1" font-size="14.5" fill="#3a3226" font-weight="700">1.</text>
<text x="96.4" y="1035.1" font-size="14.5" fill="#3a3226" textLength="137.0" lengthAdjust="spacing">Prima idee principală.</text>
<text x="78.0" y="1059.0" font-size="14.5" fill="#3a3226" font-weight="700">2.</text>
<text x="96.4" y="1059.0" font-size="14.5" fill="#3a3226" textLength="146.6" lengthAdjust="spacing">A doua idee principală.</text>
<text x="78.0" y="1083.0" font-size="14.5" fill="#3a3226" font-weight="700">3.</text>
<text x="96.4" y="1083.0" font-size="14.5" fill="#3a3226" textLength="225.9" lengthAdjust="spacing">Și tot așa, până la ultimul fragment.</text>
<text x="62.0" y="1127.3" font-size="14" fill="#0d9c92" textLength="440.7" lengthAdjust="spacing">Identificarea și formularea ideilor principale ajută la înțelegerea textului.</text>
<text x="246.5" y="1181.0" font-size="11.5" fill="#5b6b83" textLength="407.1" lengthAdjust="spacing">Sursa: Manual Art 5, p. 15, rubricile Repere; rândul model din tabel e din manual.</text>
</svg>
