<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="420" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Cuvântul și dicționarul</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 10</text>

  <rect x="350" y="85" width="200" height="48" rx="14" fill="#6f5ea8"/>
  <text x="450" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">CUVÂNTUL</text>

  <text x="290" y="157" text-anchor="end" font-size="12" fill="#3a3226">sens (conținut)</text>
  <text x="610" y="157" text-anchor="start" font-size="12" fill="#3a3226">sunete (formă)</text>
  <path d="M 450 133 L 450 178 L 260 178" stroke="#b8944f" stroke-width="2" fill="none"/>
  <path d="M 450 133 L 450 178 L 640 178" stroke="#b8944f" stroke-width="2" fill="none"/>

  <rect x="150" y="200" width="600" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="450" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Articolul de dicționar</text>
  <text font-size="12" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="256">Cuvintele apar în ordine alfabetică, după prima literă</tspan>
    <tspan x="450" y="276">diferită, nu doar după litera inițială.</tspan>
    <tspan x="450" y="304" font-style="italic">pauză — penar — planetă — prieten</tspan>
    <tspan x="450" y="326">DEX explică sensurile; DOOM arată scrierea și pronunția corectă.</tspan>
  </text>

  <text x="450" y="398" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual Art 5, pp. 26-27 (Repere)</text>
</svg>
