<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="980" height="400" fill="#faf7f0"/>
  <text x="490" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">De la întâmplare la semnificație</text>
  <text x="490" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 4 · Semnificațiile textului „Prietenul meu”</text>

  <g>
    <rect x="34" y="112" width="204" height="176" rx="18" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
    <circle cx="70" cy="150" r="19" fill="#3b5fa8"/>
    <text x="70" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <text x="102" y="157" font-size="16" font-weight="700" fill="#10233f">Ce se întâmplă</text>
    <text x="58" y="196" font-size="13" fill="#3d4a5f">Faptele, în ordine.</text>
    <text x="58" y="220" font-size="13" fill="#3d4a5f">Cine, unde, când, ce face.</text>
    <text x="58" y="256" font-size="12" font-style="italic" fill="#5b6b83">Întreb: ce am citit?</text>
  </g>

  <path d="M246 200 L268 200" stroke="#b8944f" stroke-width="3"/>
  <path d="M262 194 L270 200 L262 206 Z" fill="#b8944f"/>

  <g>
    <rect x="278" y="112" width="204" height="176" rx="18" fill="#ffffff" stroke="#a1417e" stroke-width="2.5"/>
    <circle cx="314" cy="150" r="19" fill="#a1417e"/>
    <text x="314" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="346" y="157" font-size="16" font-weight="700" fill="#10233f">Ce simt ei</text>
    <text x="302" y="196" font-size="13" fill="#3d4a5f">Emoțiile personajelor.</text>
    <text x="302" y="220" font-size="13" fill="#3d4a5f">Ce arată vorbele și gesturile.</text>
    <text x="302" y="256" font-size="12" font-style="italic" fill="#5b6b83">Întreb: ce trăiesc ei?</text>
  </g>

  <path d="M490 200 L512 200" stroke="#b8944f" stroke-width="3"/>
  <path d="M506 194 L514 200 L506 206 Z" fill="#b8944f"/>

  <g>
    <rect x="522" y="112" width="204" height="176" rx="18" fill="#ffffff" stroke="#1c7f5e" stroke-width="2.5"/>
    <circle cx="558" cy="150" r="19" fill="#1c7f5e"/>
    <text x="558" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <text x="590" y="157" font-size="16" font-weight="700" fill="#10233f">Ce transmite</text>
    <text x="546" y="196" font-size="13" fill="#3d4a5f">Mesajul de dincolo</text>
    <text x="546" y="220" font-size="13" fill="#3d4a5f">de întâmplare.</text>
    <text x="546" y="256" font-size="12" font-style="italic" fill="#5b6b83">Întreb: ce vrea să spună?</text>
  </g>

  <path d="M734 200 L756 200" stroke="#b8944f" stroke-width="3"/>
  <path d="M750 194 L758 200 L750 206 Z" fill="#b8944f"/>

  <g>
    <rect x="766" y="112" width="180" height="176" rx="18" fill="#fef8e9" stroke="#b8944f" stroke-width="2.5"/>
    <circle cx="802" cy="150" r="19" fill="#b8944f"/>
    <text x="802" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
    <text x="834" y="157" font-size="16" font-weight="700" fill="#10233f">Ce simt eu</text>
    <text x="790" y="196" font-size="13" fill="#3d4a5f">Răspunsul meu</text>
    <text x="790" y="220" font-size="13" fill="#3d4a5f">personal.</text>
    <text x="790" y="256" font-size="12" font-style="italic" fill="#5b6b83">Textul mă face să...</text>
  </g>

  <rect x="34" y="316" width="912" height="52" rx="14" fill="#ffffff" stroke="#e2d9c4" stroke-width="2"/>
  <text x="56" y="341" font-size="13" font-weight="700" fill="#10233f">Regula de aur:</text>
  <text x="164" y="341" font-size="13" fill="#3d4a5f">orice părere despre semnificație se sprijină pe un cuvânt sau pe un rând din text.</text>
  <text x="56" y="360" font-size="12" font-style="italic" fill="#5b6b83">Fără dovadă din text, rămâne doar o impresie.</text>
</svg>
