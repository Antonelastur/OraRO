<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1043" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1043" fill="#faf7f0"/>
<text x="247.9" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="400.9" lengthAdjust="spacing">Identitatea personală. Emoțiile</text>
<text x="221.1" y="74.4" font-size="14" fill="#5b6b83" textLength="457.8" lengthAdjust="spacing">Clasa a V-a · Unitatea I, Lecția 7 · Manual, pp. 20-21 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. EMOȚIILE, PERSONALITATEA, IDENTITATEA PERSONALĂ</text>
<rect x="40" y="128.6" width="820" height="196.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="60.5" lengthAdjust="spacing">Emoțiile</text>
<text x="126.8" y="162.6" font-size="16" fill="#10233f" textLength="700.3" lengthAdjust="spacing">sunt trăiri de scurtă durată și de o intensitate care variază. Acestea sunt reacții firești la situațiile</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="292.7" lengthAdjust="spacing">și evenimentele din viața unei persoane.</text>
<text x="62.0" y="220.6" font-size="16" fill="#10233f" font-weight="700" textLength="109.2" lengthAdjust="spacing">Personalitatea</text>
<text x="175.5" y="220.6" font-size="16" fill="#10233f" textLength="623.7" lengthAdjust="spacing">unui om este formată din toate însușirile stabile care îl caracterizează: de la ce și cum</text>
<text x="62.0" y="243.8" font-size="16" fill="#10233f" textLength="345.0" lengthAdjust="spacing">gândește ori se comportă, până la valorile sale.</text>
<text x="62.0" y="278.6" font-size="16" fill="#10233f" font-weight="700" textLength="160.3" lengthAdjust="spacing">Identitatea personală</text>
<text x="226.6" y="278.6" font-size="16" fill="#10233f" textLength="540.2" lengthAdjust="spacing">se referă la specificul unui om, reprezentând ceea ce îl caracterizează și îl</text>
<text x="62.0" y="301.8" font-size="16" fill="#10233f" textLength="164.5" lengthAdjust="spacing">diferențiază de ceilalți.</text>
<rect x="40" y="344.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="367.6" font-size="16" font-weight="700" fill="#ffffff">2. CELE CINCI EMOȚII DIN FILMUL „ÎNTORS PE DOS”</text>
<rect x="40" y="378.6" width="820" height="308.1" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="411.6" font-size="15" fill="#10233f" font-style="italic" textLength="89.6" lengthAdjust="spacing">Întors pe dos</text>
<text x="155.6" y="411.6" font-size="15" fill="#3a3226" textLength="5.3" lengthAdjust="spacing">(</text>
<text x="160.9" y="411.6" font-size="15" fill="#10233f" font-style="italic" textLength="69.4" lengthAdjust="spacing">Inside Out</text>
<text x="230.3" y="411.6" font-size="15" fill="#3a3226" textLength="312.0" lengthAdjust="spacing">) este un film de animație din 2015, în regia lui</text>
<text x="546.4" y="411.6" font-size="15" fill="#3a3226" font-weight="700" textLength="82.8" lengthAdjust="spacing">Pete Docter</text>
<text x="629.2" y="411.6" font-size="15" fill="#3a3226" textLength="176.5" lengthAdjust="spacing">. Personajul principal este</text>
<text x="62.0" y="433.4" font-size="15" fill="#3a3226" textLength="657.7" lengthAdjust="spacing">Riley Andersen, o fetiță de unsprezece ani, iar emoțiile ei lucrează în sediul central din mintea ei.</text>
<rect x="62.0" y="451.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="473.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="43.7" lengthAdjust="spacing">Emoția</text>
<text x="260.2" y="473.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="165.6" lengthAdjust="spacing">Ce spune textul despre ea</text>
<line x1="62.0" y1="483.4" x2="838.0" y2="483.4" stroke="#e3dccb"/>
<text x="74.0" y="505.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="52.7" lengthAdjust="spacing">Bucuria</text>
<text x="260.2" y="505.9" font-size="14.5" fill="#3a3226" textLength="233.3" lengthAdjust="spacing">vrea ca Riley să aibă o viață fericită</text>
<line x1="62.0" y1="516.2" x2="838.0" y2="516.2" stroke="#e3dccb"/>
<text x="74.0" y="538.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="61.0" lengthAdjust="spacing">Tristețea</text>
<text x="260.2" y="538.8" font-size="14.5" fill="#3a3226" textLength="514.2" lengthAdjust="spacing">singura emoție căreia Bucuria nu-i găsește vreun rost; rolul ei îl completez eu:</text>
<text x="260.2" y="559.8" font-size="14.5" fill="#3a3226" textLength="60.6" lengthAdjust="spacing">……………</text>
<line x1="62.0" y1="570.1" x2="838.0" y2="570.1" stroke="#e3dccb"/>
<text x="74.0" y="592.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="34.1" lengthAdjust="spacing">Frica</text>
<text x="260.2" y="592.6" font-size="14.5" fill="#3a3226" textLength="384.0" lengthAdjust="spacing">o protejează pe Riley, făcând-o mai atentă și mai precaută</text>
<line x1="62.0" y1="603.0" x2="838.0" y2="603.0" stroke="#e3dccb"/>
<text x="74.0" y="625.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="69.1" lengthAdjust="spacing">Dezgustul</text>
<text x="260.2" y="625.5" font-size="14.5" fill="#3a3226" textLength="346.4" lengthAdjust="spacing">o ajută să nu se apropie de ceea ce este respingător</text>
<line x1="62.0" y1="635.8" x2="838.0" y2="635.8" stroke="#e3dccb"/>
<text x="74.0" y="658.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="34.2" lengthAdjust="spacing">Furia</text>
<text x="260.2" y="658.3" font-size="14.5" fill="#3a3226" textLength="441.1" lengthAdjust="spacing">o ajută să-și apere punctul de vedere și să nu accepte nedreptățile</text>
<line x1="62.0" y1="668.7" x2="838.0" y2="668.7" stroke="#e3dccb"/>
<line x1="248.2" y1="451.9" x2="248.2" y2="668.7" stroke="#e3dccb"/>
<rect x="40" y="706.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="729.7" font-size="16" font-weight="700" fill="#ffffff">3. PORTRETUL EMOȚIILOR MELE</text>
<rect x="40" y="740.7" width="820" height="251.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="773.7" font-size="15" fill="#3a3226" textLength="388.3" lengthAdjust="spacing">Completez în caiet enunțurile de mai jos (Aplicații, ex. 5).</text>
<text x="62.0" y="808.2" font-size="17" font-weight="700" fill="#6f5ea8">a</text>
<text x="96.0" y="806.7" font-size="14.5" fill="#3a3226" textLength="93.0" lengthAdjust="spacing">Mă numesc ...</text>
<text x="62.0" y="840.2" font-size="17" font-weight="700" fill="#6f5ea8">b</text>
<text x="96.0" y="838.7" font-size="14.5" fill="#3a3226" textLength="160.2" lengthAdjust="spacing">Mă bucur atunci când ...</text>
<text x="62.0" y="872.2" font-size="17" font-weight="700" fill="#6f5ea8">c</text>
<text x="96.0" y="870.7" font-size="14.5" fill="#3a3226" textLength="129.7" lengthAdjust="spacing">Mă întristez dacă ...</text>
<text x="62.0" y="904.2" font-size="17" font-weight="700" fill="#6f5ea8">d</text>
<text x="96.0" y="902.7" font-size="14.5" fill="#3a3226" textLength="105.5" lengthAdjust="spacing">Mi-e frică de ....</text>
<text x="62.0" y="936.2" font-size="17" font-weight="700" fill="#6f5ea8">e</text>
<text x="96.0" y="934.7" font-size="14.5" fill="#3a3226" textLength="82.8" lengthAdjust="spacing">Mă înfurie ...</text>
<text x="62.0" y="968.2" font-size="17" font-weight="700" fill="#6f5ea8">f</text>
<text x="96.0" y="966.7" font-size="14.5" fill="#3a3226" textLength="152.3" lengthAdjust="spacing">Simt dezgust față de ...</text>
<text x="151.2" y="1023.7" font-size="11.5" fill="#5b6b83" textLength="597.7" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 20-21 (prezentarea filmului, rubrica Repere, Aplicații ex. 5). Răspunsurile se scriu în caiet.</text>
</svg>
