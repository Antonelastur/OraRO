<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="420" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Scurtă istorie a selfie-ului</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 5 · Textul nonliterar</text>

  <line x1="70" y1="210" x2="930" y2="210" stroke="#0d9c92" stroke-width="3"/>

  <!-- 1524, above -->
  <g>
    <circle cx="130" cy="210" r="10" fill="#0d9c92"/>
    <line x1="130" y1="200" x2="130" y2="150" stroke="#0d9c92" stroke-width="2"/>
    <text x="130" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#b8944f">1524</text>
    <text font-size="12.5" fill="#3a3226" text-anchor="middle">
      <tspan x="130" y="238">Parmigianino</tspan>
      <tspan x="130" y="256">pictează „Autoportret</tspan>
      <tspan x="130" y="274">într-o oglindă convexă”,</tspan>
      <tspan x="130" y="292">prima lucrare de artă</tspan>
      <tspan x="130" y="310">considerată un selfie.</tspan>
    </text>
  </g>

  <!-- 1839, below shorter -->
  <g>
    <circle cx="310" cy="210" r="10" fill="#0d9c92"/>
    <line x1="310" y1="220" x2="310" y2="150" stroke="#0d9c92" stroke-width="2"/>
    <text x="310" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#b8944f">1839</text>
    <text font-size="12.5" fill="#3a3226" text-anchor="middle">
      <tspan x="310" y="238">Robert Cornelius,</tspan>
      <tspan x="310" y="256">fotograf din Philadelphia,</tspan>
      <tspan x="310" y="274">realizează primul</tspan>
      <tspan x="310" y="292">autoportret fotografic</tspan>
      <tspan x="310" y="310">din istorie.</tspan>
    </text>
  </g>

  <!-- 2002 -->
  <g>
    <circle cx="500" cy="210" r="10" fill="#0d9c92"/>
    <line x1="500" y1="200" x2="500" y2="150" stroke="#0d9c92" stroke-width="2"/>
    <text x="500" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#b8944f">2002</text>
    <text font-size="12.5" fill="#3a3226" text-anchor="middle">
      <tspan x="500" y="238">Nathan Hope, un</tspan>
      <tspan x="500" y="256">australian, folosește</tspan>
      <tspan x="500" y="274">prima dată cuvântul</tspan>
      <tspan x="500" y="292">„selfie”, într-un comentariu</tspan>
      <tspan x="500" y="310">pe un forum.</tspan>
    </text>
  </g>

  <!-- 2013 -->
  <g>
    <circle cx="690" cy="210" r="10" fill="#0d9c92"/>
    <line x1="690" y1="220" x2="690" y2="150" stroke="#0d9c92" stroke-width="2"/>
    <text x="690" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#b8944f">2013</text>
    <text font-size="12.5" fill="#3a3226" text-anchor="middle">
      <tspan x="690" y="238">Dicționarele Oxford</tspan>
      <tspan x="690" y="256">declară „selfie” cuvântul</tspan>
      <tspan x="690" y="274">anului și îl includ</tspan>
      <tspan x="690" y="292">în lucrările lor.</tspan>
    </text>
  </g>

  <!-- 2016 -->
  <g>
    <circle cx="870" cy="210" r="10" fill="#0d9c92"/>
    <line x1="870" y1="200" x2="870" y2="150" stroke="#0d9c92" stroke-width="2"/>
    <text x="870" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#b8944f">2016</text>
    <text font-size="12.5" fill="#3a3226" text-anchor="middle">
      <tspan x="870" y="238">Cuvântul „selfie” intră</tspan>
      <tspan x="870" y="256">în Dicționarul explicativ</tspan>
      <tspan x="870" y="274">al limbii române.</tspan>
    </text>
  </g>

  <rect x="330" y="345" width="340" height="46" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="1.5"/>
  <text x="500" y="365" text-anchor="middle" font-size="12" fill="#10233f" font-weight="600">Text nonliterar: informează cititorul</text>
  <text x="500" y="381" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual Art 5, p. 17</text>
</svg>
