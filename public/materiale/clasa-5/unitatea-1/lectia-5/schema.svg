<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 925" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="925" fill="#faf7f0"/>
<text x="163.0" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="567.1" lengthAdjust="spacing">Textul nonliterar, scurtă istorie a selfie-ului</text>
<text x="236.5" y="74.4" font-size="14" fill="#5b6b83" textLength="426.9" lengthAdjust="spacing">Clasa a V-a · Unitatea I, Lecția 5 · Manual, p. 17 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL NONLITERAR</text>
<rect x="40" y="128.6" width="820" height="138.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="123.6" lengthAdjust="spacing">Textul nonliterar</text>
<text x="190.0" y="162.6" font-size="16" fill="#10233f" textLength="638.0" lengthAdjust="spacing">se referă la aspecte din realitate. El poate fi scris cu scopul de a informa, de a convinge</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="178.0" lengthAdjust="spacing">sau de a amuza cititorul.</text>
<rect x="62.0" y="204.6" width="248.0" height="44.8" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="232.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="97.7" lengthAdjust="spacing">să informeze</text>
<rect x="326.0" y="204.6" width="248.0" height="44.8" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="232.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="91.1" lengthAdjust="spacing">să convingă</text>
<rect x="590.0" y="204.6" width="248.0" height="44.8" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="606.0" y="232.6" font-size="16" fill="#9a7433" font-weight="700" textLength="71.8" lengthAdjust="spacing">să amuze</text>
<rect x="40" y="287.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="310.4" font-size="16" font-weight="700" fill="#ffffff">2. CE TEXTE SUNT NONLITERARE</text>
<rect x="40" y="321.4" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="354.4" font-size="15" fill="#3a3226" textLength="733.8" lengthAdjust="spacing">Din categoria textelor nonliterare fac parte: afișul, fluturașul, invitația, articolul de ziar sau de revistă, rețeta,</text>
<text x="62.0" y="376.1" font-size="15" fill="#3a3226" textLength="443.6" lengthAdjust="spacing">instrucțiunile de diverse tipuri, eticheta, articolul de dicționar etc.</text>
<rect x="40" y="418.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="441.6" font-size="16" font-weight="700" fill="#ffffff">3. SCURTĂ ISTORIE A SELFIE-ULUI</text>
<rect x="40" y="452.6" width="820" height="221.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="486.6" font-size="17" font-weight="700" fill="#6f5ea8">1524</text>
<text x="128.0" y="485.1" font-size="14.5" fill="#3a3226" textLength="93.0" lengthAdjust="spacing">Pictorul italian</text>
<text x="224.9" y="485.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="90.1" lengthAdjust="spacing">Parmigianino</text>
<text x="319.0" y="485.1" font-size="14.5" fill="#3a3226" textLength="244.0" lengthAdjust="spacing">realizează, în jurul acestui an, tabloul</text>
<text x="566.9" y="485.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="228.9" lengthAdjust="spacing">Autoportret într-o oglindă convexă</text>
<text x="795.8" y="485.1" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="128.0" y="506.2" font-size="14.5" fill="#3a3226" textLength="388.6" lengthAdjust="spacing">prima lucrare de artă care ar putea fi considerată un selfie.</text>
<text x="62.0" y="536.5" font-size="17" font-weight="700" fill="#6f5ea8">1839</text>
<text x="128.0" y="535.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="115.3" lengthAdjust="spacing">Robert Cornelius</text>
<text x="243.3" y="535.0" font-size="14.5" fill="#3a3226" textLength="518.1" lengthAdjust="spacing">, chimist amator și fotograf din Philadelphia, face primul autoportret fotografic.</text>
<text x="62.0" y="568.5" font-size="17" font-weight="700" fill="#6f5ea8">2002</text>
<text x="128.0" y="567.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="89.2" lengthAdjust="spacing">Nathan Hope</text>
<text x="217.2" y="567.0" font-size="14.5" fill="#3a3226" textLength="343.5" lengthAdjust="spacing">, un australian, folosește pentru prima dată cuvântul</text>
<text x="564.6" y="567.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="35.6" lengthAdjust="spacing">selfie</text>
<text x="600.2" y="567.0" font-size="14.5" fill="#3a3226" textLength="219.1" lengthAdjust="spacing">, într-un comentariu pe un forum.</text>
<text x="62.0" y="600.5" font-size="17" font-weight="700" fill="#6f5ea8">2013</text>
<text x="128.0" y="599.0" font-size="14.5" fill="#3a3226" textLength="45.6" lengthAdjust="spacing">Editorii</text>
<text x="177.5" y="599.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="139.0" lengthAdjust="spacing">Dicționarelor Oxford</text>
<text x="320.4" y="599.0" font-size="14.5" fill="#3a3226" textLength="49.2" lengthAdjust="spacing">declară</text>
<text x="373.5" y="599.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="35.6" lengthAdjust="spacing">selfie</text>
<text x="413.0" y="599.0" font-size="14.5" fill="#3a3226" textLength="104.1" lengthAdjust="spacing">cuvântul anului.</text>
<text x="62.0" y="632.5" font-size="17" font-weight="700" fill="#6f5ea8">2016</text>
<text x="128.0" y="631.0" font-size="14.5" fill="#3a3226" textLength="108.0" lengthAdjust="spacing">Ediția din 2016 a</text>
<text x="240.0" y="631.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="29.0" lengthAdjust="spacing">DEX</text>
<text x="272.9" y="631.0" font-size="14.5" fill="#3a3226" textLength="61.8" lengthAdjust="spacing">definește</text>
<text x="338.7" y="631.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="35.6" lengthAdjust="spacing">selfie</text>
<text x="374.3" y="631.0" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">:</text>
<text x="382.2" y="631.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="410.3" lengthAdjust="spacing">„fotografie pe care o persoană și-o face sieși cu un dispozitiv</text>
<text x="128.0" y="652.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="47.2" lengthAdjust="spacing">digital”</text>
<text x="175.2" y="652.0" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<rect x="40" y="694.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="717.4" font-size="16" font-weight="700" fill="#ffffff">4. AUTOEVALUARE L1-L5</text>
<rect x="40" y="728.4" width="820" height="145.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="746.4" width="776.0" height="109.6" rx="12" fill="#f3efe4"/><text x="78.0" y="772.9" font-size="14.5" fill="#10233f" font-weight="700" textLength="278.5" lengthAdjust="spacing">Completez în caiet următoarele afirmații:</text>
<text x="78.0" y="791.8" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="791.8" font-size="14.5" fill="#3a3226" textLength="370.1" lengthAdjust="spacing">Din ceea ce am învățat, cel mai important mi se pare … .</text>
<text x="78.0" y="815.7" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="815.7" font-size="14.5" fill="#3a3226" textLength="256.9" lengthAdjust="spacing">Cel mai mult mi-a plăcut activitatea … .</text>
<text x="78.0" y="839.6" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="839.6" font-size="14.5" fill="#3a3226" textLength="196.7" lengthAdjust="spacing">Cel mai dificil mi s-a părut … .</text>
<text x="206.0" y="905.5" font-size="11.5" fill="#5b6b83" textLength="487.9" lengthAdjust="spacing">Sursa: Manual Art 5, p. 17 (rubrica Repere, textul despre selfie și rubrica Autoevaluare L1-L5).</text>
</svg>
