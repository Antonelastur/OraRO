<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1209" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1209" fill="#faf7f0"/>
<text x="252.4" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="390.7" lengthAdjust="spacing">Textul literar. „Prietenul meu”</text>
<text x="223.3" y="74.4" font-size="14" fill="#5b6b83" textLength="453.4" lengthAdjust="spacing">Clasa a V-a · Unitatea I, Lecția 1 · Manual, pp. 10-12 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. AUTOAREA ȘI POVESTIREA</text>
<rect x="40" y="128.6" width="820" height="193.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="380.0" height="157.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="174.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="86.3" lengthAdjust="spacing">AUTOAREA</text>
<text x="78.0" y="197.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="118.1" lengthAdjust="spacing">Ioana Pârvulescu</text>
<text x="200.0" y="197.9" font-size="14.5" fill="#3a3226" textLength="58.4" lengthAdjust="spacing">(n. 1960)</text>
<text x="78.0" y="221.8" font-size="14.5" fill="#3a3226" textLength="315.4" lengthAdjust="spacing">Este scriitoare, publicistă, traducătoare și predă</text>
<text x="78.0" y="242.8" font-size="14.5" fill="#3a3226" textLength="286.4" lengthAdjust="spacing">literatură română la Facultatea de Litere din</text>
<text x="78.0" y="263.9" font-size="14.5" fill="#3a3226" textLength="66.4" lengthAdjust="spacing">București.</text>
<text x="78.0" y="287.8" font-size="14.5" fill="#3a3226" textLength="166.0" lengthAdjust="spacing">Printre cărțile ei: romanul</text>
<text x="248.0" y="287.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="56.3" lengthAdjust="spacing">Inocenții</text>
<text x="304.2" y="287.8" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<rect x="458.0" y="146.6" width="380.0" height="157.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="474.0" y="174.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="98.2" lengthAdjust="spacing">POVESTIREA</text>
<text x="474.0" y="197.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="91.1" lengthAdjust="spacing">Prietenul meu</text>
<text x="569.0" y="197.9" font-size="14.5" fill="#3a3226" textLength="247.0" lengthAdjust="spacing">a fost scrisă pentru elevii clasei a V-a</text>
<text x="474.0" y="218.9" font-size="14.5" fill="#3a3226" textLength="231.5" lengthAdjust="spacing">care vor învăța după acest manual.</text>
<rect x="40" y="342.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="365.1" font-size="16" font-weight="700" fill="#ffffff">2. FIȘA TEXTULUI</text>
<rect x="40" y="376.1" width="820" height="285.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="394.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="415.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.8" lengthAdjust="spacing">Întrebarea</text>
<text x="283.5" y="415.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="109.0" lengthAdjust="spacing">Ce găsesc în text</text>
<line x1="62.0" y1="425.7" x2="838.0" y2="425.7" stroke="#e3dccb"/>
<text x="74.0" y="448.2" font-size="14.5" fill="#3a3226" textLength="113.8" lengthAdjust="spacing">Cine povestește?</text>
<text x="283.5" y="448.2" font-size="14.5" fill="#3a3226" textLength="380.7" lengthAdjust="spacing">Bogdan, un băiat din clasa a V-a, care spune despre sine:</text>
<text x="668.2" y="448.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="95.1" lengthAdjust="spacing">„ăsta sunt eu”</text>
<text x="763.3" y="448.2" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="458.6" x2="838.0" y2="458.6" stroke="#e3dccb"/>
<text x="74.0" y="481.0" font-size="14.5" fill="#3a3226" textLength="106.4" lengthAdjust="spacing">Cine mai apare?</text>
<text x="283.5" y="481.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.8" lengthAdjust="spacing">Claudia</text>
<text x="335.3" y="481.0" font-size="14.5" fill="#3a3226" textLength="209.7" lengthAdjust="spacing">, sora lui Bogdan, e într-a VIII-a;</text>
<text x="549.0" y="481.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="22.8" lengthAdjust="spacing">Adi</text>
<text x="571.8" y="481.0" font-size="14.5" fill="#3a3226" textLength="246.1" lengthAdjust="spacing">, prietenul lui, cu care împarte banca;</text>
<text x="283.5" y="502.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="20.6" lengthAdjust="spacing">Joi</text>
<text x="304.1" y="502.1" font-size="14.5" fill="#3a3226" textLength="375.2" lengthAdjust="spacing">, câinele lui, un chihuahua; doamna profesoară și colegii.</text>
<line x1="62.0" y1="512.4" x2="838.0" y2="512.4" stroke="#e3dccb"/>
<text x="74.0" y="534.9" font-size="14.5" fill="#3a3226" textLength="116.4" lengthAdjust="spacing">Când se petrece?</text>
<text x="283.5" y="534.9" font-size="14.5" fill="#3a3226" textLength="72.0" lengthAdjust="spacing">Într-o zi de</text>
<text x="359.5" y="534.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="35.9" lengthAdjust="spacing">marți</text>
<text x="395.3" y="534.9" font-size="14.5" fill="#3a3226" textLength="212.8" lengthAdjust="spacing">, ziua primei teze la matematică.</text>
<line x1="62.0" y1="545.3" x2="838.0" y2="545.3" stroke="#e3dccb"/>
<text x="74.0" y="567.8" font-size="14.5" fill="#3a3226" textLength="161.8" lengthAdjust="spacing">Ce are de scris Bogdan?</text>
<text x="283.5" y="567.8" font-size="14.5" fill="#3a3226" textLength="141.8" lengthAdjust="spacing">O compunere cu titlul</text>
<text x="429.2" y="567.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="185.0" lengthAdjust="spacing">„Prietenul meu cel mai bun”</text>
<text x="614.2" y="567.8" font-size="14.5" fill="#3a3226" textLength="155.1" lengthAdjust="spacing">, pentru ora de română.</text>
<line x1="62.0" y1="578.1" x2="838.0" y2="578.1" stroke="#e3dccb"/>
<text x="74.0" y="600.6" font-size="14.5" fill="#3a3226" textLength="109.2" lengthAdjust="spacing">Cum se încheie?</text>
<text x="283.5" y="600.6" font-size="14.5" fill="#3a3226" textLength="414.3" lengthAdjust="spacing">Bogdan își dă seama că prietenul lui cel mai bun nu este Joi, ci</text>
<text x="701.7" y="600.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="22.8" lengthAdjust="spacing">Adi</text>
<text x="724.5" y="600.6" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="611.0" x2="838.0" y2="611.0" stroke="#e3dccb"/>
<text x="74.0" y="633.5" font-size="14.5" fill="#3a3226" textLength="80.1" lengthAdjust="spacing">Ultima frază</text>
<text x="283.5" y="633.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="368.4" lengthAdjust="spacing">„Până la urmă n-a fost o zi chiar așa de rea, nu-i așa?”</text>
<line x1="62.0" y1="643.8" x2="838.0" y2="643.8" stroke="#e3dccb"/>
<line x1="271.5" y1="394.1" x2="271.5" y2="643.8" stroke="#e3dccb"/>
<rect x="40" y="681.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="704.8" font-size="16" font-weight="700" fill="#ffffff">3. CUVINTE NOI DIN NOTELE DE SUBSOL</text>
<rect x="40" y="715.8" width="820" height="187.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="733.8" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="755.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">Cuvântul</text>
<text x="384.4" y="755.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="135.0" lengthAdjust="spacing">Explicația din manual</text>
<line x1="62.0" y1="765.4" x2="838.0" y2="765.4" stroke="#e3dccb"/>
<text x="74.0" y="787.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="37.9" lengthAdjust="spacing">rigolă</text>
<text x="115.9" y="787.9" font-size="14.5" fill="#3a3226" textLength="34.0" lengthAdjust="spacing">(s. f.)</text>
<text x="384.4" y="787.9" font-size="14.5" fill="#3a3226" textLength="342.9" lengthAdjust="spacing">șanț mic de-a lungul străzii, între carosabil și trotuar</text>
<line x1="62.0" y1="798.2" x2="838.0" y2="798.2" stroke="#e3dccb"/>
<text x="74.0" y="820.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="70.1" lengthAdjust="spacing">chihuahua</text>
<text x="148.0" y="820.7" font-size="14.5" fill="#3a3226" textLength="69.1" lengthAdjust="spacing">[pronunțat</text>
<text x="221.1" y="820.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="58.2" lengthAdjust="spacing">ci-ua-ua</text>
<text x="279.3" y="820.7" font-size="14.5" fill="#3a3226" textLength="51.0" lengthAdjust="spacing">] (s. m.)</text>
<text x="384.4" y="820.7" font-size="14.5" fill="#3a3226" textLength="384.9" lengthAdjust="spacing">rasă de câini de origine controversată (mexicano-chineză,</text>
<text x="384.4" y="841.7" font-size="14.5" fill="#3a3226" textLength="428.6" lengthAdjust="spacing">mediteraneeană, chineză), cu siluetă zveltă și de mici dimensiuni</text>
<line x1="62.0" y1="852.1" x2="838.0" y2="852.1" stroke="#e3dccb"/>
<text x="74.0" y="874.6" font-size="14.5" fill="#3a3226" textLength="185.9" lengthAdjust="spacing">un cuvânt nou, ales de mine</text>
<text x="384.4" y="874.6" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="884.9" x2="838.0" y2="884.9" stroke="#e3dccb"/>
<line x1="372.4" y1="733.8" x2="372.4" y2="884.9" stroke="#e3dccb"/>
<rect x="40" y="922.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="945.9" font-size="16" font-weight="700" fill="#ffffff">4. IMPRESII DUPĂ PRIMA LECTURĂ</text>
<rect x="40" y="956.9" width="820" height="184.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="989.9" font-size="15" fill="#3a3226" textLength="156.8" lengthAdjust="spacing">Împart foaia de caiet în</text>
<text x="222.9" y="989.9" font-size="15" fill="#3a3226" font-weight="700" textLength="99.4" lengthAdjust="spacing">patru cadrane</text>
<text x="326.4" y="989.9" font-size="15" fill="#3a3226" textLength="229.9" lengthAdjust="spacing">și le completez după modelul dat.</text>
<rect x="62.0" y="1008.4" width="182.0" height="114.8" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="1036.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="132.6" lengthAdjust="spacing">Mi-a plăcut textul</text>
<text x="78.0" y="1059.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="99.6" lengthAdjust="spacing">pentru că ... .</text>
<text x="78.0" y="1082.9" font-size="14.5" fill="#3a3226" textLength="145.4" lengthAdjust="spacing">………………………………</text>
<text x="78.0" y="1106.9" font-size="14.5" fill="#3a3226" textLength="145.4" lengthAdjust="spacing">………………………………</text>
<rect x="260.0" y="1008.4" width="182.0" height="114.8" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="276.0" y="1036.4" font-size="16" fill="#6f5ea8" font-weight="700" textLength="128.1" lengthAdjust="spacing">Nu mi-a plăcut în</text>
<text x="276.0" y="1059.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="78.7" lengthAdjust="spacing">text că ... .</text>
<text x="276.0" y="1082.9" font-size="14.5" fill="#3a3226" textLength="145.4" lengthAdjust="spacing">………………………………</text>
<text x="276.0" y="1106.9" font-size="14.5" fill="#3a3226" textLength="145.4" lengthAdjust="spacing">………………………………</text>
<rect x="458.0" y="1008.4" width="182.0" height="114.8" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="474.0" y="1036.4" font-size="16" fill="#9a7433" font-weight="700" textLength="129.7" lengthAdjust="spacing">Nu am înțeles din</text>
<text x="474.0" y="1059.6" font-size="16" fill="#9a7433" font-weight="700" textLength="56.8" lengthAdjust="spacing">text ... .</text>
<text x="474.0" y="1082.9" font-size="14.5" fill="#3a3226" textLength="145.4" lengthAdjust="spacing">………………………………</text>
<text x="474.0" y="1106.9" font-size="14.5" fill="#3a3226" textLength="145.4" lengthAdjust="spacing">………………………………</text>
<rect x="656.0" y="1008.4" width="182.0" height="114.8" rx="12" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
<text x="672.0" y="1036.4" font-size="16" fill="#10233f" font-weight="700" textLength="141.0" lengthAdjust="spacing">Textul mi-a amintit</text>
<text x="672.0" y="1059.6" font-size="16" fill="#10233f" font-weight="700" textLength="46.5" lengthAdjust="spacing">de ... .</text>
<text x="672.0" y="1082.9" font-size="14.5" fill="#3a3226" textLength="145.4" lengthAdjust="spacing">………………………………</text>
<text x="672.0" y="1106.9" font-size="14.5" fill="#3a3226" textLength="145.4" lengthAdjust="spacing">………………………………</text>
<text x="50.9" y="1172.7" font-size="11.5" fill="#5b6b83" textLength="798.3" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 10-12 (textul, caseta autoarei, notele de subsol, „Impresii după prima lectură”, ex. 1). Lecția nu are rubrica Repere. Întrebările din</text>
<text x="287.8" y="1189.4" font-size="11.5" fill="#5b6b83" textLength="324.4" lengthAdjust="spacing">fișă sunt create pentru aceste notițe, răspunsurile vin din text.</text>
</svg>
