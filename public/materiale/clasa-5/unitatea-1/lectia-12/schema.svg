<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 959" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="959" fill="#faf7f0"/>
<text x="354.7" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="191.0" lengthAdjust="spacing">Câmpul lexical</text>
<text x="226.2" y="74.4" font-size="14" fill="#5b6b83" textLength="447.6" lengthAdjust="spacing">Clasa a V-a · Unitatea I, Lecția 12 · Manual, pp. 30-31 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE CÂMPUL LEXICAL</text>
<rect x="40" y="128.6" width="820" height="113.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="109.1" lengthAdjust="spacing">Câmpul lexical</text>
<text x="175.4" y="162.6" font-size="16" fill="#10233f" textLength="320.0" lengthAdjust="spacing">cuprinde toate cuvintele care se raportează la</text>
<text x="499.8" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="89.9" lengthAdjust="spacing">aceeași idee</text>
<text x="589.7" y="162.6" font-size="16" fill="#10233f" textLength="203.4" lengthAdjust="spacing">, putând avea formă complet</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="153.4" lengthAdjust="spacing">diferită sau apropiată.</text>
<text x="62.0" y="219.6" font-size="15" fill="#3a3226" textLength="258.6" lengthAdjust="spacing">Cuvintele aparțin aceluiași domeniu: au</text>
<text x="324.6" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="176.8" lengthAdjust="spacing">trăsături de sens comune</text>
<text x="501.5" y="219.6" font-size="15" fill="#3a3226" textLength="279.1" lengthAdjust="spacing">, dar și trăsături de sens care le deosebesc.</text>
<rect x="40" y="262.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="285.1" font-size="16" font-weight="700" fill="#ffffff">2. EXEMPLU: RELAȚIILE DE RUDENIE</text>
<rect x="40" y="296.1" width="820" height="156.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="314.1" width="380.0" height="88.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="342.1" font-size="16" fill="#0d9c92" font-weight="700" textLength="124.6" lengthAdjust="spacing">rudenie naturală</text>
<text x="78.0" y="365.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="335.5" lengthAdjust="spacing">mamă, tată, fiu, fiică, frate, soră, bunic, bunică, nepot,</text>
<text x="78.0" y="386.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="238.1" lengthAdjust="spacing">nepoată, unchi, mătușă, văr, verișoară</text>
<rect x="458.0" y="314.1" width="380.0" height="88.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="342.1" font-size="16" fill="#6f5ea8" font-weight="700" textLength="112.8" lengthAdjust="spacing">rudenie socială</text>
<text x="474.0" y="365.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="225.3" lengthAdjust="spacing">soț, soție, socru, soacră, ginere, noră</text>
<text x="62.0" y="430.8" font-size="14" fill="#5b6b83" textLength="344.9" lengthAdjust="spacing">Câmpul se poate lărgi cu cuvinte formate de la acestea (</text>
<text x="406.9" y="430.8" font-size="14" fill="#5b6b83" font-style="italic" textLength="52.9" lengthAdjust="spacing">bunicuță</text>
<text x="459.9" y="430.8" font-size="14" fill="#5b6b83" textLength="105.7" lengthAdjust="spacing">) sau cu expresii (</text>
<text x="565.6" y="430.8" font-size="14" fill="#5b6b83" font-style="italic" textLength="66.1" lengthAdjust="spacing">frate vitreg</text>
<text x="631.6" y="430.8" font-size="14" fill="#5b6b83" textLength="7.3" lengthAdjust="spacing">).</text>
<rect x="40" y="473.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="496.0" font-size="16" font-weight="700" fill="#ffffff">3. REGULI</text>
<rect x="40" y="507.0" width="820" height="180.7" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="540.0" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="540.0" font-size="15" fill="#3a3226" textLength="253.9" lengthAdjust="spacing">În câmpul lexical al unui cuvânt intră și</text>
<text x="332.2" y="540.0" font-size="15" fill="#3a3226" font-weight="700" textLength="76.7" lengthAdjust="spacing">sinonimele</text>
<text x="412.9" y="540.0" font-size="15" fill="#3a3226" textLength="67.5" lengthAdjust="spacing">acestuia și</text>
<text x="484.4" y="540.0" font-size="15" fill="#3a3226" font-weight="700" textLength="67.0" lengthAdjust="spacing">expresiile</text>
<text x="555.5" y="540.0" font-size="15" fill="#3a3226" textLength="87.7" lengthAdjust="spacing">care îl conțin.</text>
<text x="62.0" y="564.7" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="564.7" font-size="15" fill="#3a3226" textLength="234.1" lengthAdjust="spacing">Câmpul lexical cuprinde cuvinte din</text>
<text x="312.4" y="564.7" font-size="15" fill="#3a3226" font-weight="700" textLength="168.6" lengthAdjust="spacing">aceeași parte de vorbire</text>
<text x="485.1" y="564.7" font-size="15" fill="#3a3226" textLength="197.4" lengthAdjust="spacing">(substantive, adjective, verbe).</text>
<text x="62.0" y="589.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="589.5" font-size="15" fill="#3a3226" textLength="299.7" lengthAdjust="spacing">Un cuvânt cu mai multe sensuri poate intra în</text>
<text x="377.9" y="589.5" font-size="15" fill="#3a3226" font-weight="700" textLength="169.9" lengthAdjust="spacing">câmpuri lexicale diferite</text>
<text x="547.9" y="589.5" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="608.0" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="634.5" font-size="14.5" fill="#10233f" font-weight="700" textLength="62.6" lengthAdjust="spacing">Exemplu:</text>
<text x="78.0" y="653.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="33.4" lengthAdjust="spacing">amar</text>
<text x="115.3" y="653.3" font-size="14.5" fill="#3a3226" textLength="153.0" lengthAdjust="spacing">intră în câmpul lexical al</text>
<text x="272.2" y="653.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="55.7" lengthAdjust="spacing">gustului</text>
<text x="327.8" y="653.3" font-size="14.5" fill="#3a3226" textLength="93.7" lengthAdjust="spacing">, dar și în cel al</text>
<text x="425.4" y="653.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="95.0" lengthAdjust="spacing">sentimentelor</text>
<text x="520.4" y="653.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">:</text>
<text x="527.5" y="653.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="148.5" lengthAdjust="spacing">Am mult amar în suflet.</text>
<rect x="40" y="707.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="730.7" font-size="16" font-weight="700" fill="#ffffff">4. ALTE CÂMPURI LEXICALE</text>
<rect x="40" y="741.7" width="820" height="166.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="759.7" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="781.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="92.1" lengthAdjust="spacing">Câmpul lexical</text>
<text x="306.8" y="781.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="48.5" lengthAdjust="spacing">Cuvinte</text>
<line x1="62.0" y1="791.2" x2="838.0" y2="791.2" stroke="#e3dccb"/>
<text x="74.0" y="813.7" font-size="14.5" fill="#3a3226" textLength="39.6" lengthAdjust="spacing">școala</text>
<text x="306.8" y="813.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="287.8" lengthAdjust="spacing">elev, profesor, catalog, bancă, pauză, teză, oră</text>
<line x1="62.0" y1="824.1" x2="838.0" y2="824.1" stroke="#e3dccb"/>
<text x="74.0" y="846.6" font-size="14.5" fill="#3a3226" textLength="47.0" lengthAdjust="spacing">vremea</text>
<text x="306.8" y="846.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="268.8" lengthAdjust="spacing">ploaie, vânt, ninsoare, soare, ceață, furtună</text>
<line x1="62.0" y1="856.9" x2="838.0" y2="856.9" stroke="#e3dccb"/>
<text x="74.0" y="879.4" font-size="14.5" fill="#3a3226" textLength="46.5" lengthAdjust="spacing">culorile</text>
<text x="306.8" y="879.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="280.4" lengthAdjust="spacing">roșu, galben, verde, albastru, mov, portocaliu</text>
<line x1="62.0" y1="889.8" x2="838.0" y2="889.8" stroke="#e3dccb"/>
<line x1="294.8" y1="759.7" x2="294.8" y2="889.8" stroke="#e3dccb"/>
<text x="207.2" y="939.3" font-size="11.5" fill="#5b6b83" textLength="485.5" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 30-31, rubricile Repere. Unele exemple sunt create pentru aceste notițe.</text>
</svg>
