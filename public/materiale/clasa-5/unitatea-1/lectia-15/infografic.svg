<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="970" height="380" fill="#faf7f0"/>
  <text x="485" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Cele cinci etape ale scrierii</text>
  <text x="485" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 15 · Etapele scrierii</text>

  <path d="M 180 210 L 220 210" stroke="#b8944f" stroke-width="2.5" fill="none" marker-end="url(#sageata)"/>
  <path d="M 370 210 L 410 210" stroke="#b8944f" stroke-width="2.5" fill="none" marker-end="url(#sageata)"/>
  <path d="M 560 210 L 600 210" stroke="#b8944f" stroke-width="2.5" fill="none" marker-end="url(#sageata)"/>
  <path d="M 750 210 L 790 210" stroke="#b8944f" stroke-width="2.5" fill="none" marker-end="url(#sageata)"/>

  <defs>
    <marker id="sageata" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b8944f"/>
    </marker>
  </defs>

  <g>
    <circle cx="105" cy="112" r="16" fill="#6f5ea8"/>
    <text x="105" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
    <rect x="30" y="140" width="150" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="105" y="165" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10233f">Pregătirea</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle">
      <tspan x="105" y="188">Alegi subiectul,</tspan>
      <tspan x="105" y="203">publicul și scopul.</tspan>
      <tspan x="105" y="222">Răspunzi la cine,</tspan>
      <tspan x="105" y="237">ce, când, unde,</tspan>
      <tspan x="105" y="252">de ce, cum, apoi</tspan>
      <tspan x="105" y="267">faci un plan.</tspan>
    </text>
  </g>

  <g>
    <circle cx="295" cy="112" r="16" fill="#6f5ea8"/>
    <text x="295" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <rect x="220" y="140" width="150" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="295" y="165" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10233f">Scrierea ciornei</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle">
      <tspan x="295" y="188">Scrii textul, pe</tspan>
      <tspan x="295" y="203">baza planului,</tspan>
      <tspan x="295" y="218">fără să te oprești</tspan>
      <tspan x="295" y="233">să corectezi.</tspan>
      <tspan x="295" y="252" font-style="italic">Ideile contează</tspan>
      <tspan x="295" y="267" font-style="italic">mai mult acum.</tspan>
    </text>
  </g>

  <g>
    <circle cx="485" cy="112" r="16" fill="#6f5ea8"/>
    <text x="485" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <rect x="410" y="140" width="150" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="485" y="165" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10233f">Revizuirea</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle">
      <tspan x="485" y="188">Recitești textul,</tspan>
      <tspan x="485" y="203">verifici dacă ideile</tspan>
      <tspan x="485" y="218">au ordine logică.</tspan>
      <tspan x="485" y="237">Un coleg citește</tspan>
      <tspan x="485" y="252">și el, îți dă</tspan>
      <tspan x="485" y="267">sugestii.</tspan>
    </text>
  </g>

  <g>
    <circle cx="675" cy="112" r="16" fill="#6f5ea8"/>
    <text x="675" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
    <rect x="600" y="140" width="150" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="675" y="165" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10233f">Editarea</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle">
      <tspan x="675" y="188">Corectezi ortografia,</tspan>
      <tspan x="675" y="203">punctuația și</tspan>
      <tspan x="675" y="218">așezarea în pagină.</tspan>
      <tspan x="675" y="237">Rescrii forma</tspan>
      <tspan x="675" y="252">finală, curată.</tspan>
    </text>
  </g>

  <g>
    <circle cx="865" cy="112" r="16" fill="#6f5ea8"/>
    <text x="865" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
    <rect x="790" y="140" width="150" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="865" y="165" text-anchor="middle" font-size="14.5" font-weight="700" fill="#10233f">Publicarea</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle">
      <tspan x="865" y="188">Îți prezinți textul</tspan>
      <tspan x="865" y="203">colegilor, de exemplu</tspan>
      <tspan x="865" y="218">din „scaunul</tspan>
      <tspan x="865" y="233">autorului”.</tspan>
    </text>
  </g>

  <text x="485" y="330" text-anchor="middle" font-size="12" fill="#5b6b83">Poți reveni oricând la o etapă anterioară, ca să clarifici sau să îmbunătățești textul.</text>
  <text x="485" y="360" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual Art 5, p. 36 (Repere)</text>
</svg>
