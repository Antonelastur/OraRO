<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1700" fill="#faf7f0"/>
<text x="159.2" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="575.9" lengthAdjust="spacing">Etapele scrierii, pregătirea pentru redactare</text>
<text x="232.0" y="74.4" font-size="14" fill="#5b6b83" textLength="436.0" lengthAdjust="spacing">Clasa a V-a · Unitatea I, Lecția 15 · Manual, p. 36 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. ETAPELE SCRIERII, ETAPA 1</text>
<rect x="40" y="128.6" width="820" height="357.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" textLength="656.0" lengthAdjust="spacing">În redactarea unui text este importantă parcurgerea a cinci etape succesive, ce reprezintă</text>
<text x="722.4" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="56.3" lengthAdjust="spacing">etapele</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="52.4" lengthAdjust="spacing">scrierii</text>
<text x="114.4" y="185.8" font-size="16" fill="#10233f" textLength="4.5" lengthAdjust="spacing">.</text>
<rect x="62.0" y="204.6" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="231.1" font-size="14.5" fill="#10233f" font-weight="700" textLength="48.1" lengthAdjust="spacing">Reține:</text>
<text x="78.0" y="249.9" font-size="14.5" fill="#3a3226" textLength="706.5" lengthAdjust="spacing">Se poate reveni oricând la o etapă anterioară, pentru a clarifica/a îmbunătăți un anumit aspect al redactării.</text>
<rect x="62.0" y="280.3" width="776.0" height="187.3" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="308.3" font-size="16" fill="#0d9c92" font-weight="700" textLength="270.1" lengthAdjust="spacing">Etapa 1. Pregătirea pentru redactare</text>
<text x="78.0" y="331.6" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="331.6" font-size="14.5" fill="#3a3226" textLength="115.0" lengthAdjust="spacing">Alege un subiect.</text>
<text x="78.0" y="355.5" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="355.5" font-size="14.5" fill="#3a3226" textLength="135.8" lengthAdjust="spacing">Identifică-ți publicul.</text>
<text x="78.0" y="379.4" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="379.4" font-size="14.5" fill="#3a3226" textLength="131.6" lengthAdjust="spacing">Stabilește-ți scopul.</text>
<text x="78.0" y="403.4" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="403.4" font-size="14.5" fill="#3a3226" textLength="462.4" lengthAdjust="spacing">Răspunde la cele șase întrebări esențiale referitoare la subiectul ales (</text>
<text x="554.2" y="403.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="238.8" lengthAdjust="spacing">cine? ce? când? unde? de ce? cum?</text>
<text x="793.0" y="403.4" font-size="14.5" fill="#3a3226" textLength="9.2" lengthAdjust="spacing">).</text>
<text x="78.0" y="427.3" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="427.3" font-size="14.5" fill="#3a3226" textLength="170.4" lengthAdjust="spacing">Elaborează planul lucrării.</text>
<text x="78.0" y="451.2" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="451.2" font-size="14.5" fill="#3a3226" textLength="250.9" lengthAdjust="spacing">Strânge informațiile și organizează-le.</text>
<rect x="40" y="505.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="528.6" font-size="16" font-weight="700" fill="#ffffff">2. ETAPELE 2 ȘI 3</text>
<rect x="40" y="539.6" width="820" height="280.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="557.6" width="776.0" height="91.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="585.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="184.0" lengthAdjust="spacing">Etapa 2. Scrierea ciornei</text>
<text x="78.0" y="608.9" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="608.9" font-size="14.5" fill="#3a3226" textLength="210.1" lengthAdjust="spacing">Scrie o primă variantă a lucrării.</text>
<text x="78.0" y="632.8" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="632.8" font-size="14.5" fill="#3a3226" textLength="696.1" lengthAdjust="spacing">Dezvoltă fiecare idee, concentrându-te pe conținutul textului, pe detalierea experienței pe care o prezinți.</text>
<rect x="62.0" y="665.2" width="776.0" height="136.5" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="78.0" y="693.2" font-size="16" fill="#9a7433" font-weight="700" textLength="144.0" lengthAdjust="spacing">Etapa 3. Revizuirea</text>
<text x="78.0" y="716.5" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="716.5" font-size="14.5" fill="#3a3226" textLength="717.0" lengthAdjust="spacing">Verifică dacă ideile sunt clare, dacă exprimarea este corectă, dacă paragrafele sunt semnalate prin alineat și</text>
<text x="91.8" y="737.5" font-size="14.5" fill="#3a3226" textLength="178.0" lengthAdjust="spacing">dacă scrisul tău este lizibil.</text>
<text x="78.0" y="761.4" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="761.4" font-size="14.5" fill="#3a3226" textLength="213.6" lengthAdjust="spacing">Șterge ceea ce nu este relevant.</text>
<text x="78.0" y="785.3" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="785.3" font-size="14.5" fill="#3a3226" textLength="153.2" lengthAdjust="spacing">Îmbunătățește-ți textul.</text>
<rect x="40" y="839.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="862.7" font-size="16" font-weight="700" fill="#ffffff">3. ETAPELE 4 ȘI 5</text>
<rect x="40" y="873.7" width="820" height="298.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="891.7" width="776.0" height="136.5" rx="12" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
<text x="78.0" y="919.7" font-size="16" fill="#10233f" font-weight="700" textLength="127.3" lengthAdjust="spacing">Etapa 4. Editarea</text>
<text x="78.0" y="943.0" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="943.0" font-size="14.5" fill="#3a3226" textLength="714.7" lengthAdjust="spacing">Așază textul în pagină, astfel încât titlul și paragrafele să fie clar evidențiate. Titlul se scrie în partea de sus a</text>
<text x="91.8" y="964.0" font-size="14.5" fill="#3a3226" textLength="350.5" lengthAdjust="spacing">paginii, la mijloc; fiecare paragraf începe prin alineat.</text>
<text x="78.0" y="987.9" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="987.9" font-size="14.5" fill="#3a3226" textLength="387.2" lengthAdjust="spacing">Rescrie textul pentru a fi lizibil. Verifică punctuația textului.</text>
<text x="78.0" y="1011.8" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="1011.8" font-size="14.5" fill="#3a3226" textLength="162.3" lengthAdjust="spacing">Recitește varianta finală.</text>
<rect x="62.0" y="1044.2" width="776.0" height="109.7" rx="12" fill="#ffffff" stroke="#2f7d4f" stroke-width="2"/>
<text x="78.0" y="1072.2" font-size="16" fill="#2f7d4f" font-weight="700" textLength="144.9" lengthAdjust="spacing">Etapa 5. Publicarea</text>
<text x="78.0" y="1095.5" font-size="14.5" fill="#3a3226" textLength="705.5" lengthAdjust="spacing">Împărtășește celorlalți textul tău (afișează lucrarea pe un panou din clasă, fotocopiază textul pentru colegi,</text>
<text x="78.0" y="1116.5" font-size="14.5" fill="#3a3226" textLength="185.4" lengthAdjust="spacing">citește-l cu voce tare, de pe</text>
<text x="267.4" y="1116.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="114.7" lengthAdjust="spacing">scaunul autorului</text>
<text x="382.1" y="1116.5" font-size="14.5" fill="#3a3226" textLength="382.2" lengthAdjust="spacing">, publică-l în revista școlii sau pe un blog, înregistrează-te</text>
<text x="78.0" y="1137.5" font-size="14.5" fill="#3a3226" textLength="91.6" lengthAdjust="spacing">citindu-l etc.).</text>
<rect x="40" y="1191.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1214.9" font-size="16" font-weight="700" fill="#ffffff">4. CELE ȘASE ÎNTREBĂRI ESENȚIALE</text>
<rect x="40" y="1225.9" width="820" height="220.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1258.9" font-size="15" fill="#3a3226" textLength="317.1" lengthAdjust="spacing">Subiectul ales: ……………………………………………</text>
<rect x="62.0" y="1277.4" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="1305.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="43.1" lengthAdjust="spacing">Cine?</text>
<text x="78.0" y="1328.7" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<rect x="326.0" y="1277.4" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="342.0" y="1305.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="29.3" lengthAdjust="spacing">Ce?</text>
<text x="342.0" y="1328.7" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<rect x="590.0" y="1277.4" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="606.0" y="1305.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="48.5" lengthAdjust="spacing">Când?</text>
<text x="606.0" y="1328.7" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<rect x="62.0" y="1361.0" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="1389.0" font-size="16" fill="#6f5ea8" font-weight="700" textLength="48.6" lengthAdjust="spacing">Unde?</text>
<text x="78.0" y="1412.3" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<rect x="326.0" y="1361.0" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="1389.0" font-size="16" fill="#6f5ea8" font-weight="700" textLength="51.0" lengthAdjust="spacing">De ce?</text>
<text x="342.0" y="1412.3" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<rect x="590.0" y="1361.0" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="606.0" y="1389.0" font-size="16" fill="#6f5ea8" font-weight="700" textLength="43.9" lengthAdjust="spacing">Cum?</text>
<text x="606.0" y="1412.3" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<rect x="40" y="1466.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1489.7" font-size="16" font-weight="700" fill="#ffffff">5. SCOPUL ȘI PUBLICUL</text>
<rect x="40" y="1500.7" width="820" height="148.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="1518.7" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="1546.7" font-size="16" fill="#0d9c92" font-weight="700" textLength="128.6" lengthAdjust="spacing">Cu ce scop scrii?</text>
<text x="78.0" y="1570.0" font-size="14.5" fill="#3a3226" textLength="337.9" lengthAdjust="spacing">Vrei ca textul să producă amuzament, să convingă,</text>
<text x="78.0" y="1591.0" font-size="14.5" fill="#3a3226" textLength="120.1" lengthAdjust="spacing">să informeze etc.?</text>
<text x="78.0" y="1614.9" font-size="14.5" fill="#3a3226" textLength="195.4" lengthAdjust="spacing">Scopul meu: ………………………</text>
<rect x="458.0" y="1518.7" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="1546.7" font-size="16" fill="#6f5ea8" font-weight="700" textLength="212.7" lengthAdjust="spacing">Cui se adresează textul tău?</text>
<text x="474.0" y="1570.0" font-size="14.5" fill="#3a3226" textLength="286.7" lengthAdjust="spacing">Unor copii de vârsta ta, unor copii mai mici,</text>
<text x="474.0" y="1591.0" font-size="14.5" fill="#3a3226" textLength="177.3" lengthAdjust="spacing">părinților, profesorilor etc.?</text>
<text x="474.0" y="1614.9" font-size="14.5" fill="#3a3226" textLength="202.1" lengthAdjust="spacing">Publicul meu: ………………………</text>
<text x="137.4" y="1680.8" font-size="11.5" fill="#5b6b83" textLength="625.2" lengthAdjust="spacing">Sursa: Manual Art 5, p. 36 (rubrica Repere și Explorare, ex. 1-2). Ora a doua și relatarea (p. 37) sunt în notițele lecției 16.</text>
</svg>
