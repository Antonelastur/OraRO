<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1185" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1185" fill="#faf7f0"/>
<text x="270.7" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="355.1" lengthAdjust="spacing">Trăsături ale textului literar</text>
<text x="221.8" y="74.4" font-size="14" fill="#5b6b83" textLength="456.4" lengthAdjust="spacing">Clasa a V-a · Unitatea I, Lecția 2 · Manual, pp. 13-14 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL LITERAR</text>
<rect x="40" y="128.6" width="820" height="80.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="94.9" lengthAdjust="spacing">Textul literar</text>
<text x="161.2" y="162.6" font-size="16" fill="#10233f" textLength="659.6" lengthAdjust="spacing">prezintă o lume imaginară și transmite idei, dar mai ales emoții și sentimente, într-un limbaj</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="739.6" lengthAdjust="spacing">expresiv. Lumea imaginară a textului literar poate fi mai apropiată sau mai îndepărtată de lumea reală.</text>
<rect x="40" y="228.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="251.6" font-size="16" font-weight="700" fill="#ffffff">2. CELE PATRU ÎNTREBĂRI</text>
<rect x="40" y="262.6" width="820" height="233.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="295.6" font-size="15" fill="#3a3226" textLength="766.3" lengthAdjust="spacing">Pentru a înțelege un text literar în care se relatează o întâmplare, cititorul trebuie să răspundă la câteva întrebări:</text>
<rect x="62.0" y="314.1" width="182.0" height="88.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="342.1" font-size="16" fill="#0d9c92" font-weight="700" textLength="43.1" lengthAdjust="spacing">Cine?</text>
<text x="78.0" y="365.4" font-size="14.5" fill="#3a3226" textLength="62.6" lengthAdjust="spacing">Cine sunt</text>
<text x="78.0" y="386.4" font-size="14.5" fill="#3a3226" textLength="84.3" lengthAdjust="spacing">personajele?</text>
<rect x="260.0" y="314.1" width="182.0" height="88.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="276.0" y="342.1" font-size="16" fill="#6f5ea8" font-weight="700" textLength="29.3" lengthAdjust="spacing">Ce?</text>
<text x="276.0" y="365.4" font-size="14.5" fill="#3a3226" textLength="131.5" lengthAdjust="spacing">Ce fac personajele?</text>
<rect x="458.0" y="314.1" width="182.0" height="88.7" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="474.0" y="342.1" font-size="16" fill="#9a7433" font-weight="700" textLength="48.5" lengthAdjust="spacing">Când?</text>
<text x="474.0" y="365.4" font-size="14.5" fill="#3a3226" textLength="101.0" lengthAdjust="spacing">Când se petrec</text>
<text x="474.0" y="386.4" font-size="14.5" fill="#3a3226" textLength="95.5" lengthAdjust="spacing">evenimentele?</text>
<rect x="656.0" y="314.1" width="182.0" height="88.7" rx="12" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
<text x="672.0" y="342.1" font-size="16" fill="#10233f" font-weight="700" textLength="48.6" lengthAdjust="spacing">Unde?</text>
<text x="672.0" y="365.4" font-size="14.5" fill="#3a3226" textLength="101.5" lengthAdjust="spacing">Unde se petrec</text>
<text x="672.0" y="386.4" font-size="14.5" fill="#3a3226" textLength="95.5" lengthAdjust="spacing">evenimentele?</text>
<rect x="62.0" y="416.8" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="443.3" font-size="14.5" fill="#10233f" font-weight="700" textLength="54.5" lengthAdjust="spacing">În caiet:</text>
<text x="78.0" y="462.1" font-size="14.5" fill="#3a3226" textLength="274.9" lengthAdjust="spacing">scriu o propoziție despre ce este vorba în</text>
<text x="356.8" y="462.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="91.1" lengthAdjust="spacing">Prietenul meu</text>
<text x="447.9" y="462.1" font-size="14.5" fill="#3a3226" textLength="194.0" lengthAdjust="spacing">, folosind cele patru întrebări.</text>
<rect x="40" y="516.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="539.5" font-size="16" font-weight="700" fill="#ffffff">3. HARTA RELAȚIILOR</text>
<rect x="40" y="550.5" width="820" height="242.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="583.5" font-size="15" fill="#3a3226" textLength="215.9" lengthAdjust="spacing">Desenez în caiet harta relațiilor:</text>
<text x="282.0" y="583.5" font-size="15" fill="#3a3226" font-weight="700" textLength="54.3" lengthAdjust="spacing">Bogdan</text>
<text x="340.3" y="583.5" font-size="15" fill="#3a3226" textLength="496.1" lengthAdjust="spacing">într-un cerc la mijloc, celelalte personaje în cercuri în jurul lui, legate prin</text>
<text x="62.0" y="605.2" font-size="15" fill="#3a3226" textLength="451.8" lengthAdjust="spacing">săgeți. Pe fiecare săgeată scriu relația dintre cele două personaje.</text>
<rect x="62.0" y="623.7" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="651.7" font-size="16" fill="#0d9c92" font-weight="700" textLength="135.2" lengthAdjust="spacing">Bogdan și Claudia</text>
<text x="78.0" y="675.0" font-size="14.5" fill="#3a3226" textLength="157.4" lengthAdjust="spacing">relația: ………………………</text>
<rect x="326.0" y="623.7" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="342.0" y="651.7" font-size="16" fill="#0d9c92" font-weight="700" textLength="103.2" lengthAdjust="spacing">Bogdan și Adi</text>
<text x="342.0" y="675.0" font-size="14.5" fill="#3a3226" textLength="157.4" lengthAdjust="spacing">relația: ………………………</text>
<rect x="590.0" y="623.7" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="606.0" y="651.7" font-size="16" fill="#0d9c92" font-weight="700" textLength="100.8" lengthAdjust="spacing">Bogdan și Joi</text>
<text x="606.0" y="675.0" font-size="14.5" fill="#3a3226" textLength="157.4" lengthAdjust="spacing">relația: ………………………</text>
<rect x="62.0" y="707.4" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="735.4" font-size="16" fill="#6f5ea8" font-weight="700" textLength="128.2" lengthAdjust="spacing">Bogdan și colegii</text>
<text x="78.0" y="758.7" font-size="14.5" fill="#3a3226" textLength="157.4" lengthAdjust="spacing">relația: ………………………</text>
<rect x="326.0" y="707.4" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="734.4" font-size="15" fill="#6f5ea8" font-weight="700" textLength="211.3" lengthAdjust="spacing">Bogdan și doamna profesoară</text>
<text x="342.0" y="757.4" font-size="14.5" fill="#3a3226" textLength="157.4" lengthAdjust="spacing">relația: ………………………</text>
<rect x="590.0" y="707.4" width="248.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="606.0" y="735.4" font-size="16" fill="#6f5ea8" font-weight="700" textLength="107.5" lengthAdjust="spacing">Bogdan și tata</text>
<text x="606.0" y="758.7" font-size="14.5" fill="#3a3226" textLength="157.4" lengthAdjust="spacing">relația: ………………………</text>
<rect x="40" y="813.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="836.0" font-size="16" font-weight="700" fill="#ffffff">4. SENSUL OBIȘNUIT ȘI SENSUL DIN TEXT</text>
<rect x="40" y="847.0" width="820" height="287.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="880.0" font-size="15" fill="#3a3226" textLength="768.2" lengthAdjust="spacing">Verbul poate avea în text alt înțeles decât cel obișnuit. Sensul obișnuit îl verific în DEX, sensul din text îl stabilesc</text>
<text x="62.0" y="901.8" font-size="15" fill="#3a3226" textLength="105.2" lengthAdjust="spacing">după fragment.</text>
<rect x="62.0" y="920.3" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="941.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="84.7" lengthAdjust="spacing">Verbul în text</text>
<text x="368.9" y="941.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="98.2" lengthAdjust="spacing">Sensul obișnuit</text>
<text x="609.4" y="941.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="94.2" lengthAdjust="spacing">Sensul din text</text>
<line x1="62.0" y1="951.8" x2="838.0" y2="951.8" stroke="#e3dccb"/>
<text x="74.0" y="974.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="45.7" lengthAdjust="spacing">a foșni</text>
<text x="119.7" y="974.3" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">:</text>
<text x="127.7" y="974.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="98.7" lengthAdjust="spacing">„clasa foșnea”</text>
<text x="368.9" y="974.3" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<text x="609.4" y="974.3" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<line x1="62.0" y1="984.7" x2="838.0" y2="984.7" stroke="#e3dccb"/>
<text x="74.0" y="1007.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="65.0" lengthAdjust="spacing">a fremăta</text>
<text x="139.0" y="1007.2" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">:</text>
<text x="147.0" y="1007.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="149.7" lengthAdjust="spacing">„fremăta ca o pădure”</text>
<text x="368.9" y="1007.2" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<text x="609.4" y="1007.2" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<line x1="62.0" y1="1017.5" x2="838.0" y2="1017.5" stroke="#e3dccb"/>
<text x="74.0" y="1040.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="57.4" lengthAdjust="spacing">a zgâlțâi</text>
<text x="131.4" y="1040.0" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">:</text>
<text x="139.3" y="1040.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="133.5" lengthAdjust="spacing">„te zgâlțâie întruna”</text>
<text x="368.9" y="1040.0" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<text x="609.4" y="1040.0" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<line x1="62.0" y1="1050.4" x2="838.0" y2="1050.4" stroke="#e3dccb"/>
<text x="74.0" y="1072.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="46.8" lengthAdjust="spacing">a vorbi</text>
<text x="120.8" y="1072.9" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">:</text>
<text x="128.8" y="1072.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="132.1" lengthAdjust="spacing">„vorbește cu florile”</text>
<text x="368.9" y="1072.9" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<text x="609.4" y="1072.9" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<line x1="62.0" y1="1083.2" x2="838.0" y2="1083.2" stroke="#e3dccb"/>
<text x="74.0" y="1105.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="42.2" lengthAdjust="spacing">a lătra</text>
<text x="116.2" y="1105.7" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">:</text>
<text x="124.2" y="1105.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="200.9" lengthAdjust="spacing">„banca [...] a început să latre”</text>
<text x="368.9" y="1105.7" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<text x="609.4" y="1105.7" font-size="14.5" fill="#3a3226" textLength="72.7" lengthAdjust="spacing">………………</text>
<line x1="62.0" y1="1116.1" x2="838.0" y2="1116.1" stroke="#e3dccb"/>
<line x1="356.9" y1="920.3" x2="356.9" y2="1116.1" stroke="#e3dccb"/>
<line x1="597.4" y1="920.3" x2="597.4" y2="1116.1" stroke="#e3dccb"/>
<text x="56.7" y="1165.6" font-size="11.5" fill="#5b6b83" textLength="786.6" lengthAdjust="spacing">Sursa: Manual Art 5, p. 13, rubrica Repere și exercițiile 2-4; personajele sunt din textul de la pp. 10-12. Unele exemple sunt create pentru aceste notițe.</text>
</svg>
