<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 968" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="968" fill="#faf7f0"/>
<text x="92.4" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="716.5" lengthAdjust="spacing">Substantivul subiect. Acordul predicatului cu subiectul</text>
<text x="214.9" y="74.4" font-size="14" fill="#5b6b83" textLength="470.3" lengthAdjust="spacing">Clasa a V-a · Unitatea III, Lecția 14 · Manual, pp. 100-101 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. SUBIECTUL</text>
<rect x="40" y="128.6" width="820" height="201.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="69.9" lengthAdjust="spacing">Subiectul</text>
<text x="136.2" y="162.6" font-size="16" fill="#10233f" textLength="250.2" lengthAdjust="spacing">este partea de propoziție care arată</text>
<text x="390.8" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="30.6" lengthAdjust="spacing">cine</text>
<text x="425.7" y="162.6" font-size="16" fill="#10233f" textLength="324.5" lengthAdjust="spacing">face acțiunea exprimată de un predicat verbal.</text>
<text x="62.0" y="196.4" font-size="15" fill="#3a3226" textLength="146.7" lengthAdjust="spacing">Întrebarea subiectului:</text>
<text x="212.7" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="35.2" lengthAdjust="spacing">cine?</text>
<text x="252.0" y="196.4" font-size="15" fill="#3a3226" textLength="318.0" lengthAdjust="spacing">Subiectul și predicatul sunt într-o strânsă relație.</text>
<rect x="62.0" y="214.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="236.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="66.1" lengthAdjust="spacing">Întrebarea</text>
<text x="306.8" y="236.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="246.4" x2="838.0" y2="246.4" stroke="#e3dccb"/>
<text x="74.0" y="268.9" font-size="14.5" fill="#3a3226" textLength="83.2" lengthAdjust="spacing">cine aleargă?</text>
<text x="306.8" y="268.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="42.8" lengthAdjust="spacing">Pisicile</text>
<line x1="306.8" y1="272.4" x2="349.6" y2="272.4" stroke="#10233f" stroke-width="1.4"/>
<line x1="306.8" y1="275.9" x2="349.6" y2="275.9" stroke="#10233f" stroke-width="1.4"/>
<text x="353.5" y="268.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="47.4" lengthAdjust="spacing">aleargă</text>
<line x1="353.5" y1="272.4" x2="400.9" y2="272.4" stroke="#10233f" stroke-width="1.4"/>
<text x="400.9" y="268.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="3.2" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="279.3" x2="838.0" y2="279.3" stroke="#e3dccb"/>
<text x="74.0" y="301.8" font-size="14.5" fill="#3a3226" textLength="89.3" lengthAdjust="spacing">cine a apărut?</text>
<text x="306.8" y="301.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="46.1" lengthAdjust="spacing">Soarele</text>
<line x1="306.8" y1="305.3" x2="352.9" y2="305.3" stroke="#10233f" stroke-width="1.4"/>
<line x1="306.8" y1="308.8" x2="352.9" y2="308.8" stroke="#10233f" stroke-width="1.4"/>
<text x="356.8" y="301.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="53.2" lengthAdjust="spacing">a apărut</text>
<line x1="356.8" y1="305.3" x2="410.0" y2="305.3" stroke="#10233f" stroke-width="1.4"/>
<text x="414.0" y="301.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="61.5" lengthAdjust="spacing">iar pe cer.</text>
<line x1="62.0" y1="312.1" x2="838.0" y2="312.1" stroke="#e3dccb"/>
<line x1="294.8" y1="214.9" x2="294.8" y2="312.1" stroke="#e3dccb"/>
<rect x="40" y="350.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="373.1" font-size="16" font-weight="700" fill="#ffffff">2. SUBIECTUL SIMPLU ȘI MULTIPLU</text>
<rect x="40" y="384.1" width="820" height="182.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="402.1" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="430.1" font-size="16" fill="#0d9c92" font-weight="700" textLength="50.4" lengthAdjust="spacing">simplu</text>
<text x="78.0" y="453.4" font-size="14.5" fill="#3a3226" textLength="109.9" lengthAdjust="spacing">un singur termen</text>
<text x="78.0" y="477.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="47.4" lengthAdjust="spacing">Zăpada</text>
<line x1="78.0" y1="480.9" x2="125.4" y2="480.9" stroke="#10233f" stroke-width="1.4"/>
<line x1="78.0" y1="484.4" x2="125.4" y2="484.4" stroke="#10233f" stroke-width="1.4"/>
<text x="129.3" y="477.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="101.8" lengthAdjust="spacing">cădea neîncetat.</text>
<rect x="458.0" y="402.1" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="430.1" font-size="16" fill="#6f5ea8" font-weight="700" textLength="63.8" lengthAdjust="spacing">multiplu</text>
<text x="474.0" y="453.4" font-size="14.5" fill="#3a3226" textLength="337.1" lengthAdjust="spacing">doi sau mai mulți termeni, legați prin virgulă sau prin</text>
<text x="474.0" y="474.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="9.6" lengthAdjust="spacing">și</text>
<text x="474.0" y="498.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="36.8" lengthAdjust="spacing">Fetele</text>
<line x1="474.0" y1="501.9" x2="510.8" y2="501.9" stroke="#10233f" stroke-width="1.4"/>
<line x1="474.0" y1="505.4" x2="510.8" y2="505.4" stroke="#10233f" stroke-width="1.4"/>
<text x="514.7" y="498.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="9.6" lengthAdjust="spacing">și</text>
<text x="528.2" y="498.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="38.7" lengthAdjust="spacing">băieții</text>
<line x1="528.2" y1="501.9" x2="566.9" y2="501.9" stroke="#10233f" stroke-width="1.4"/>
<line x1="528.2" y1="505.4" x2="566.9" y2="505.4" stroke="#10233f" stroke-width="1.4"/>
<text x="570.9" y="498.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="32.6" lengthAdjust="spacing">merg</text>
<line x1="570.9" y1="501.9" x2="603.5" y2="501.9" stroke="#10233f" stroke-width="1.4"/>
<text x="607.4" y="498.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="52.1" lengthAdjust="spacing">la joacă.</text>
<text x="62.0" y="543.8" font-size="15" fill="#3a3226" textLength="658.5" lengthAdjust="spacing">Termenii subiectului multiplu pot sta unul lângă altul sau pot fi despărțiți de alte părți de propoziție.</text>
<rect x="40" y="586.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="609.2" font-size="16" font-weight="700" fill="#ffffff">3. ACORDUL PREDICATULUI CU SUBIECTUL</text>
<rect x="40" y="620.2" width="820" height="297.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="653.8" font-size="15.5" fill="#3a3226" textLength="191.1" lengthAdjust="spacing">Verbul predicat se acordă în</text>
<text x="257.3" y="653.8" font-size="15.5" fill="#3a3226" font-weight="700" textLength="66.7" lengthAdjust="spacing">persoană</text>
<text x="328.1" y="653.8" font-size="15.5" fill="#3a3226" textLength="10.2" lengthAdjust="spacing">și</text>
<text x="342.5" y="653.8" font-size="15.5" fill="#3a3226" font-weight="700" textLength="47.7" lengthAdjust="spacing">număr</text>
<text x="394.5" y="653.8" font-size="15.5" fill="#3a3226" textLength="158.4" lengthAdjust="spacing">cu substantivul subiect.</text>
<rect x="62.0" y="672.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="693.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="59.0" lengthAdjust="spacing">Subiectul</text>
<text x="462.0" y="693.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="64.1" lengthAdjust="spacing">Predicatul</text>
<line x1="62.0" y1="703.9" x2="838.0" y2="703.9" stroke="#e3dccb"/>
<text x="74.0" y="726.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="78.0" lengthAdjust="spacing">Vecinul meu</text>
<text x="155.9" y="726.4" font-size="14.5" fill="#3a3226" textLength="59.3" lengthAdjust="spacing">(singular)</text>
<text x="462.0" y="726.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="49.3" lengthAdjust="spacing">a plecat</text>
<text x="515.2" y="726.4" font-size="14.5" fill="#3a3226" textLength="59.3" lengthAdjust="spacing">(singular)</text>
<line x1="62.0" y1="736.8" x2="838.0" y2="736.8" stroke="#e3dccb"/>
<text x="74.0" y="759.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="71.5" lengthAdjust="spacing">Prietenii lui</text>
<text x="149.4" y="759.3" font-size="14.5" fill="#3a3226" textLength="45.0" lengthAdjust="spacing">(plural)</text>
<text x="462.0" y="759.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="68.0" lengthAdjust="spacing">l-au însoțit</text>
<text x="533.9" y="759.3" font-size="14.5" fill="#3a3226" textLength="45.0" lengthAdjust="spacing">(plural)</text>
<line x1="62.0" y1="769.6" x2="838.0" y2="769.6" stroke="#e3dccb"/>
<text x="74.0" y="792.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="104.5" lengthAdjust="spacing">Bunicii și părinții</text>
<text x="182.5" y="792.1" font-size="14.5" fill="#3a3226" textLength="61.6" lengthAdjust="spacing">(multiplu)</text>
<text x="462.0" y="792.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="61.9" lengthAdjust="spacing">au stabilit</text>
<text x="527.8" y="792.1" font-size="14.5" fill="#3a3226" textLength="126.4" lengthAdjust="spacing">(întotdeauna plural)</text>
<line x1="62.0" y1="802.5" x2="838.0" y2="802.5" stroke="#e3dccb"/>
<line x1="450.0" y1="672.4" x2="450.0" y2="802.5" stroke="#e3dccb"/>
<rect x="62.0" y="816.5" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="816.5" width="6" height="82.7" rx="3" fill="#b4432c"/><text x="84.0" y="843.0" font-size="14.5" fill="#b4432c" font-weight="700" textLength="54.8" lengthAdjust="spacing">Atenție!</text>
<text x="84.0" y="861.9" font-size="14.5" fill="#3a3226" textLength="97.6" lengthAdjust="spacing">Acordul se face</text>
<text x="185.5" y="861.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="191.5" lengthAdjust="spacing">doar cu substantivul subiect</text>
<text x="377.0" y="861.9" font-size="14.5" fill="#3a3226" textLength="216.3" lengthAdjust="spacing">, nu cu alte cuvinte din propoziție:</text>
<text x="597.3" y="861.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="92.4" lengthAdjust="spacing">Grupul elevilor</text>
<text x="693.6" y="861.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="53.2" lengthAdjust="spacing">a plecat</text>
<text x="750.7" y="861.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="66.0" lengthAdjust="spacing">în excursie</text>
<text x="84.0" y="882.9" font-size="14.5" fill="#3a3226" textLength="20.9" lengthAdjust="spacing">(nu</text>
<text x="108.8" y="882.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="57.4" lengthAdjust="spacing">au plecat</text>
<text x="166.2" y="882.9" font-size="14.5" fill="#3a3226" textLength="7.5" lengthAdjust="spacing">).</text>
<text x="170.7" y="948.7" font-size="11.5" fill="#5b6b83" textLength="558.7" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 100-101, rubricile Repere și modelele. Unele exemple sunt create pentru aceste notițe.</text>
</svg>
