<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Substantivul subiect. Acordul cu predicatul</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 11</text>
  <g>
    <rect x="90" y="100" width="330" height="130" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="255" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">Subiect simplu</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle"><tspan x="255" y="154" font-style="italic">Vecina cântă frumos.</tspan><tspan x="255" y="176">predicat la singular</tspan></text>
  </g>
  <g>
    <rect x="480" y="100" width="330" height="130" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="645" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">Subiect multiplu</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle"><tspan x="645" y="154" font-style="italic">Vecina și fiul ei cântă.</tspan><tspan x="645" y="176">predicat la plural</tspan></text>
  </g>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 11, p. 100</text>
</svg>
