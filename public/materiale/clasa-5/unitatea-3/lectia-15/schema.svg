<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="980" height="420" fill="#faf7f0"/>
  <text x="490" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Cum descriu un obiect</text>
  <text x="490" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 15 · Descrierea unui obiect, pregătire</text>
  <rect x="36" y="104" width="212" height="132" rx="16" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="56" y="134" font-size="14" font-weight="700" fill="#10233f">De departe</text>
  <text x="56" y="160" font-size="12" fill="#3d4a5f">Ce e, la ce folosește,</text>
  <text x="56" y="180" font-size="12" fill="#3d4a5f">ce formă are</text>
  <rect x="272" y="104" width="212" height="132" rx="16" fill="#ffffff" stroke="#a1417e" stroke-width="2.5"/>
  <text x="292" y="134" font-size="14" font-weight="700" fill="#10233f">De aproape</text>
  <text x="292" y="160" font-size="12" fill="#3d4a5f">Culoare, mărime,</text>
  <text x="292" y="180" font-size="12" fill="#3d4a5f">material, detalii</text>
  <rect x="508" y="104" width="212" height="132" rx="16" fill="#ffffff" stroke="#1c7f5e" stroke-width="2.5"/>
  <text x="528" y="134" font-size="14" font-weight="700" fill="#10233f">Cu toate simțurile</text>
  <text x="528" y="160" font-size="12" fill="#3d4a5f">Cum se simte la atingere,</text>
  <text x="528" y="180" font-size="12" fill="#3d4a5f">ce miros, ce sunet scoate</text>
  <rect x="744" y="104" width="212" height="132" rx="16" fill="#fef8e9" stroke="#b8944f" stroke-width="2.5"/>
  <text x="764" y="134" font-size="14" font-weight="700" fill="#10233f">Ce înseamnă pentru mine</text>
  <text x="764" y="160" font-size="12" fill="#3d4a5f">De unde îl am,</text>
  <text x="764" y="180" font-size="12" fill="#3d4a5f">ce amintire poartă</text>
  <rect x="36" y="258" width="908" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="58" y="283" font-size="13" font-weight="700" fill="#10233f">Ordinea contează</text>
  <text x="58" y="303" font-size="12" fill="#3d4a5f">de la general la detaliu. Dacă începi cu o zgârietură de pe mâner, cititorul nu știe încă la ce se uită.</text>
  <rect x="36" y="326" width="908" height="56" rx="14" fill="#ffffff" stroke="#e2d9c4" stroke-width="2"/>
  <text x="58" y="351" font-size="13" font-weight="700" fill="#10233f">Ce face descrierea literară</text>
  <text x="58" y="371" font-size="12" fill="#3d4a5f">adaugă personificarea și comparația. Ceasul nu doar merge, ci se grăbește. Fereastra nu doar e mare, ci privește strada.</text>
  <text x="490" y="404" text-anchor="middle" font-size="12" font-style="italic" fill="#5b6b83">Alege un obiect pe care îl ai lângă tine. Descrierea iese mereu mai bine când chiar îl vezi.</text>
</svg>
