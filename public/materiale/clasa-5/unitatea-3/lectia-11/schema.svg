<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1157" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1157" fill="#faf7f0"/>
<text x="393.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="112.9" lengthAdjust="spacing">Articolul</text>
<text x="222.4" y="74.4" font-size="14" fill="#5b6b83" textLength="455.1" lengthAdjust="spacing">Clasa a V-a · Unitatea III, Lecția 11 · Manual, pp. 96-97 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE ARTICOLUL</text>
<rect x="40" y="128.6" width="820" height="139.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="64.5" lengthAdjust="spacing">Articolul</text>
<text x="130.8" y="162.6" font-size="16" fill="#10233f" textLength="306.6" lengthAdjust="spacing">însoțește întotdeauna un substantiv și arată</text>
<text x="441.7" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="94.7" lengthAdjust="spacing">în ce măsură</text>
<text x="540.7" y="162.6" font-size="16" fill="#10233f" textLength="261.4" lengthAdjust="spacing">obiectul le este cunoscut vorbitorilor.</text>
<text x="62.0" y="196.4" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="196.4" font-size="15" fill="#3a3226" textLength="145.1" lengthAdjust="spacing">Articolul se analizează</text>
<text x="223.3" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="269.1" lengthAdjust="spacing">întotdeauna împreună cu substantivul</text>
<text x="492.4" y="196.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="221.1" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="221.1" font-size="15" fill="#3a3226" textLength="127.2" lengthAdjust="spacing">Substantivele pot fi</text>
<text x="205.4" y="221.1" font-size="15" fill="#3a3226" font-weight="700" textLength="66.8" lengthAdjust="spacing">articulate</text>
<text x="276.3" y="221.1" font-size="15" fill="#3a3226" textLength="4.5" lengthAdjust="spacing">(</text>
<text x="280.8" y="221.1" font-size="15" fill="#10233f" font-style="italic" textLength="145.2" lengthAdjust="spacing">semaforul, un semafor</text>
<text x="426.0" y="221.1" font-size="15" fill="#3a3226" textLength="31.1" lengthAdjust="spacing">) sau</text>
<text x="461.1" y="221.1" font-size="15" fill="#3a3226" font-weight="700" textLength="84.0" lengthAdjust="spacing">nearticulate</text>
<text x="549.1" y="221.1" font-size="15" fill="#3a3226" textLength="4.5" lengthAdjust="spacing">(</text>
<text x="553.6" y="221.1" font-size="15" fill="#10233f" font-style="italic" textLength="52.3" lengthAdjust="spacing">semafor</text>
<text x="606.0" y="221.1" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">).</text>
<text x="62.0" y="245.9" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="245.9" font-size="15" fill="#3a3226" textLength="202.2" lengthAdjust="spacing">În dicționar, substantivele apar</text>
<text x="280.4" y="245.9" font-size="15" fill="#3a3226" font-weight="700" textLength="84.0" lengthAdjust="spacing">nearticulate</text>
<text x="364.4" y="245.9" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="288.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="311.4" font-size="16" font-weight="700" fill="#ffffff">2. ARTICOLUL HOTĂRÂT</text>
<rect x="40" y="322.4" width="820" height="188.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="355.4" font-size="15" fill="#3a3226" textLength="123.2" lengthAdjust="spacing">Arată că obiectul e</text>
<text x="189.2" y="355.4" font-size="15" fill="#3a3226" font-weight="700" textLength="63.5" lengthAdjust="spacing">cunoscut</text>
<text x="256.7" y="355.4" font-size="15" fill="#3a3226" textLength="253.6" lengthAdjust="spacing">de vorbitor și de ascultător. Se adaugă</text>
<text x="514.4" y="355.4" font-size="15" fill="#3a3226" font-weight="700" textLength="72.9" lengthAdjust="spacing">la sfârșitul</text>
<text x="591.3" y="355.4" font-size="15" fill="#3a3226" textLength="240.9" lengthAdjust="spacing">substantivului, într-un singur cuvânt.</text>
<text x="62.0" y="377.1" font-size="15" fill="#3a3226" textLength="283.1" lengthAdjust="spacing">La masculin și neutru singular se leagă prin</text>
<text x="349.1" y="377.1" font-size="15" fill="#3a3226" font-weight="700" textLength="21.1" lengthAdjust="spacing">-u-</text>
<text x="370.2" y="377.1" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="377.6" y="377.1" font-size="15" fill="#10233f" font-style="italic" textLength="57.3" lengthAdjust="spacing">băiat-u-l</text>
<text x="434.9" y="377.1" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="395.6" width="776.0" height="31.6" fill="#efeaf8"/>

<text x="286.1" y="417.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="56.2" lengthAdjust="spacing">masculin</text>
<text x="499.3" y="417.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="48.9" lengthAdjust="spacing">feminin</text>
<text x="711.9" y="417.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="42.7" lengthAdjust="spacing">neutru</text>
<line x1="62.0" y1="427.2" x2="838.0" y2="427.2" stroke="#e3dccb"/>
<text x="74.0" y="449.7" font-size="14.5" fill="#3a3226" textLength="50.6" lengthAdjust="spacing">singular</text>
<text x="273.4" y="449.7" font-size="14.5" fill="#3a3226" textLength="81.6" lengthAdjust="spacing">-l, -le, -a, -lui</text>
<text x="508.9" y="449.7" font-size="14.5" fill="#3a3226" textLength="29.6" lengthAdjust="spacing">-a, -i</text>
<text x="714.5" y="449.7" font-size="14.5" fill="#3a3226" textLength="37.4" lengthAdjust="spacing">-l, -lui</text>
<line x1="62.0" y1="460.1" x2="838.0" y2="460.1" stroke="#e3dccb"/>
<text x="74.0" y="482.5" font-size="14.5" fill="#3a3226" textLength="36.2" lengthAdjust="spacing">plural</text>
<text x="294.6" y="482.5" font-size="14.5" fill="#3a3226" textLength="39.3" lengthAdjust="spacing">-i, -lor</text>
<text x="500.3" y="482.5" font-size="14.5" fill="#3a3226" textLength="46.8" lengthAdjust="spacing">-le, -lor</text>
<text x="709.8" y="482.5" font-size="14.5" fill="#3a3226" textLength="46.8" lengthAdjust="spacing">-le, -lor</text>
<line x1="62.0" y1="492.9" x2="838.0" y2="492.9" stroke="#e3dccb"/>
<line x1="209.4" y1="395.6" x2="209.4" y2="492.9" stroke="#e3dccb"/>
<line x1="419.0" y1="395.6" x2="419.0" y2="492.9" stroke="#e3dccb"/>
