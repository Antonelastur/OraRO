<rect x="40" y="530.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="553.9" font-size="16" font-weight="700" fill="#ffffff">3. ARTICOLUL NEHOTĂRÂT</text>
<rect x="40" y="564.9" width="820" height="278.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="597.9" font-size="15" fill="#3a3226" textLength="123.2" lengthAdjust="spacing">Arată că obiectul e</text>
<text x="189.2" y="597.9" font-size="15" fill="#3a3226" font-weight="700" textLength="135.6" lengthAdjust="spacing">mai puțin cunoscut</text>
<text x="324.8" y="597.9" font-size="15" fill="#3a3226" textLength="63.1" lengthAdjust="spacing">. Se așază</text>
<text x="392.0" y="597.9" font-size="15" fill="#3a3226" font-weight="700" textLength="56.9" lengthAdjust="spacing">înaintea</text>
<text x="452.9" y="597.9" font-size="15" fill="#3a3226" textLength="238.5" lengthAdjust="spacing">substantivului, ca un cuvânt separat.</text>
<rect x="62.0" y="616.4" width="776.0" height="31.6" fill="#efeaf8"/>

<text x="286.1" y="637.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="56.2" lengthAdjust="spacing">masculin</text>
<text x="499.3" y="637.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="48.9" lengthAdjust="spacing">feminin</text>
<text x="711.9" y="637.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="42.7" lengthAdjust="spacing">neutru</text>
<line x1="62.0" y1="647.9" x2="838.0" y2="647.9" stroke="#e3dccb"/>
<text x="74.0" y="670.4" font-size="14.5" fill="#3a3226" textLength="50.6" lengthAdjust="spacing">singular</text>
<text x="288.2" y="670.4" font-size="14.5" fill="#3a3226" textLength="51.9" lengthAdjust="spacing">un, unui</text>
<text x="502.1" y="670.4" font-size="14.5" fill="#3a3226" textLength="43.2" lengthAdjust="spacing">o, unei</text>
<text x="707.3" y="670.4" font-size="14.5" fill="#3a3226" textLength="51.9" lengthAdjust="spacing">un, unui</text>
<line x1="62.0" y1="680.8" x2="838.0" y2="680.8" stroke="#e3dccb"/>
<text x="74.0" y="703.3" font-size="14.5" fill="#3a3226" textLength="36.2" lengthAdjust="spacing">plural</text>
