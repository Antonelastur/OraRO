<text x="286.0" y="936.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="134.3" lengthAdjust="spacing">face parte din cuvânt</text>
<text x="516.2" y="936.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="61.7" lengthAdjust="spacing">desinența</text>
<text x="689.6" y="936.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="102.9" lengthAdjust="spacing">articolul hotărât</text>
