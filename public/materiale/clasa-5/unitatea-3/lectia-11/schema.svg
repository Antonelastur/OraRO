<text x="84.0" y="1071.5" font-size="14.5" fill="#3a3226" textLength="103.4" lengthAdjust="spacing">De aceea scriem</text>
<text x="191.3" y="1071.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="59.3" lengthAdjust="spacing">exercițiile</text>
<text x="254.5" y="1071.5" font-size="14.5" fill="#3a3226" textLength="150.8" lengthAdjust="spacing">(exerciți- + -i- + -le), nu</text>
<text x="409.2" y="1071.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="55.5" lengthAdjust="spacing">exercițile</text>
<text x="464.8" y="1071.5" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<text x="276.4" y="1137.3" font-size="11.5" fill="#5b6b83" textLength="347.3" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 96-97, rubricile Repere, tabelele și modelele.</text>
