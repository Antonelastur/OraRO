<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Textul descriptiv literar. Personificarea</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 2 · O stradă cu sentimente de Ana Blandiana</text>
  <rect x="150" y="95" width="600" height="90" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="450" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Personificarea</text>
  <text font-size="12" fill="#3a3226" text-anchor="middle"><tspan x="450" y="147">Dă însușiri și sentimente omenești unor obiecte sau locuri.</tspan><tspan x="450" y="164">Aici, strada „simte”, ca o ființă vie.</tspan></text>
  <rect x="180" y="205" width="540" height="50" rx="12" fill="#f1ecfa"/>
  <text x="450" y="235" text-anchor="middle" font-size="12.5" fill="#3a3226" font-style="italic">o stradă cu sentimente — casele „privesc”, strada „își amintește”</text>
  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 2, pp. 82-83</text>
</svg>
