<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 736" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="736" fill="#faf7f0"/>
<text x="124.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="653.5" lengthAdjust="spacing">Recapitulare. Lectură și comunicare în Unitatea III</text>
<text x="193.5" y="74.4" font-size="14" fill="#5b6b83" textLength="513.0" lengthAdjust="spacing">Clasa a V-a · Unitatea III, Lecția 17 · Manual, pp. 80-93, 104-105 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL DESCRIPTIV</text>
<rect x="40" y="128.6" width="820" height="241.0" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="59.0" lengthAdjust="spacing">Noțiunea</text>
<text x="306.8" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="49.4" lengthAdjust="spacing">Ce rețin</text>
<line x1="62.0" y1="178.2" x2="838.0" y2="178.2" stroke="#e3dccb"/>
<text x="74.0" y="200.7" font-size="14.5" fill="#3a3226" textLength="101.1" lengthAdjust="spacing">textul descriptiv</text>
<text x="306.8" y="200.7" font-size="14.5" fill="#3a3226" textLength="407.2" lengthAdjust="spacing">prezintă un obiect, o ființă, un cadru din natură, un fenomen, cu</text>
<text x="717.9" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="44.2" lengthAdjust="spacing">părțile</text>
<text x="766.0" y="200.7" font-size="14.5" fill="#3a3226" textLength="9.6" lengthAdjust="spacing">și</text>
<text x="306.8" y="221.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="69.7" lengthAdjust="spacing">trăsăturile</text>
<text x="380.5" y="221.7" font-size="14.5" fill="#3a3226" textLength="17.1" lengthAdjust="spacing">lor</text>
<line x1="62.0" y1="232.0" x2="838.0" y2="232.0" stroke="#e3dccb"/>
<text x="74.0" y="254.5" font-size="14.5" fill="#3a3226" textLength="142.0" lengthAdjust="spacing">textul descriptiv literar</text>
<text x="306.8" y="254.5" font-size="14.5" fill="#3a3226" textLength="123.4" lengthAdjust="spacing">impresii și percepții</text>
<text x="434.1" y="254.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="68.4" lengthAdjust="spacing">subiective</text>
<text x="502.5" y="254.5" font-size="14.5" fill="#3a3226" textLength="150.9" lengthAdjust="spacing">, limbaj creativ, sugestiv</text>
<line x1="62.0" y1="264.9" x2="838.0" y2="264.9" stroke="#e3dccb"/>
<text x="74.0" y="287.4" font-size="14.5" fill="#3a3226" textLength="93.2" lengthAdjust="spacing">tema descrierii</text>
<text x="306.8" y="287.4" font-size="14.5" fill="#3a3226" textLength="210.1" lengthAdjust="spacing">obiectul sau ființa care se descrie</text>
<line x1="62.0" y1="297.7" x2="838.0" y2="297.7" stroke="#e3dccb"/>
<text x="74.0" y="320.2" font-size="14.5" fill="#3a3226" textLength="89.6" lengthAdjust="spacing">personificarea</text>
<text x="306.8" y="320.2" font-size="14.5" fill="#3a3226" textLength="129.6" lengthAdjust="spacing">figură de stil care dă</text>
<text x="440.3" y="320.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="115.3" lengthAdjust="spacing">însușiri omenești</text>
<text x="559.5" y="320.2" font-size="14.5" fill="#3a3226" textLength="226.9" lengthAdjust="spacing">unor ființe necuvântătoare, obiecte,</text>
<text x="306.8" y="341.2" font-size="14.5" fill="#3a3226" textLength="64.7" lengthAdjust="spacing">fenomene</text>
<line x1="62.0" y1="351.6" x2="838.0" y2="351.6" stroke="#e3dccb"/>
<line x1="294.8" y1="146.6" x2="294.8" y2="351.6" stroke="#e3dccb"/>
<rect x="40" y="389.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="412.6" font-size="16" font-weight="700" fill="#ffffff">2. CUM ANALIZEZ O DESCRIERE</text>
<rect x="40" y="423.6" width="820" height="129.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="456.6" font-size="15" fill="#3a3226" font-weight="700">1.</text>
<text x="81.0" y="456.6" font-size="15" fill="#3a3226" textLength="53.2" lengthAdjust="spacing">Precizez</text>
<text x="138.2" y="456.6" font-size="15" fill="#3a3226" font-weight="700" textLength="35.9" lengthAdjust="spacing">tema</text>
<text x="178.1" y="456.6" font-size="15" fill="#3a3226" textLength="62.2" lengthAdjust="spacing">descrierii.</text>
<text x="62.0" y="481.4" font-size="15" fill="#3a3226" font-weight="700">2.</text>
<text x="81.0" y="481.4" font-size="15" fill="#3a3226" textLength="45.3" lengthAdjust="spacing">Găsesc</text>
<text x="130.3" y="481.4" font-size="15" fill="#3a3226" font-weight="700" textLength="45.7" lengthAdjust="spacing">părțile</text>
<text x="180.1" y="481.4" font-size="15" fill="#3a3226" textLength="215.2" lengthAdjust="spacing">obiectului descris și le asociez cu</text>
<text x="399.4" y="481.4" font-size="15" fill="#3a3226" font-weight="700" textLength="72.2" lengthAdjust="spacing">trăsăturile</text>
<text x="475.6" y="481.4" font-size="15" fill="#3a3226" textLength="53.2" lengthAdjust="spacing">din text.</text>
<text x="62.0" y="506.1" font-size="15" fill="#3a3226" font-weight="700">3.</text>
<text x="81.0" y="506.1" font-size="15" fill="#3a3226" textLength="30.6" lengthAdjust="spacing">Caut</text>
<text x="115.6" y="506.1" font-size="15" fill="#3a3226" font-weight="700" textLength="97.5" lengthAdjust="spacing">figurile de stil</text>
<text x="213.1" y="506.1" font-size="15" fill="#3a3226" textLength="184.5" lengthAdjust="spacing">, de exemplu personificarea.</text>
<text x="62.0" y="530.9" font-size="15" fill="#3a3226" font-weight="700">4.</text>
<text x="81.0" y="530.9" font-size="15" fill="#3a3226" textLength="219.3" lengthAdjust="spacing">Observ dacă descrierea transmite</text>
<text x="304.3" y="530.9" font-size="15" fill="#3a3226" font-weight="700" textLength="56.4" lengthAdjust="spacing">impresii</text>
<text x="364.8" y="530.9" font-size="15" fill="#3a3226" textLength="139.0" lengthAdjust="spacing">(literară) sau mai ales</text>
<text x="507.9" y="530.9" font-size="15" fill="#3a3226" font-weight="700" textLength="70.3" lengthAdjust="spacing">informații</text>
<text x="582.3" y="530.9" font-size="15" fill="#3a3226" textLength="246.4" lengthAdjust="spacing">(de exemplu, termeni de specialitate).</text>
<rect x="40" y="573.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="596.4" font-size="16" font-weight="700" fill="#ffffff">3. ASCULTAREA ACTIVĂ</text>
<rect x="40" y="607.4" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="640.4" font-size="15" fill="#3a3226" textLength="774.1" lengthAdjust="spacing">Aud clar mesajul, mă concentrez, nu întrerup, păstrez contactul vizual, încurajez vorbitorul, pun întrebări și reformulez</text>
<text x="62.0" y="662.1" font-size="15" fill="#3a3226" textLength="185.4" lengthAdjust="spacing">ca să verific dacă am înțeles.</text>
<text x="212.1" y="716.1" font-size="11.5" fill="#5b6b83" textLength="475.9" lengthAdjust="spacing">Sursa: Manual Art 5, rubricile Repere ale lecțiilor 1-7 și cerințele recapitulării de la pp. 104-105.</text>
</svg>
