<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1276" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1276" fill="#faf7f0"/>
<text x="266.2" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="363.9" lengthAdjust="spacing">Tradiții: sărbătorile de iarnă</text>
<text x="231.3" y="74.4" font-size="14" fill="#5b6b83" textLength="437.4" lengthAdjust="spacing">Clasa a V-a · Unitatea III, Lecția 7 · Manual, p. 90 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TRADIȚII ȘI OBICEIURI</text>
<rect x="40" y="128.6" width="820" height="112.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="165.7" lengthAdjust="spacing">Tradițiile și obiceiurile</text>
<text x="232.1" y="162.6" font-size="16" fill="#10233f" textLength="569.0" lengthAdjust="spacing">fac parte din cultura unui popor sau din cultura unor comunități mai restrânse.</text>
<text x="62.0" y="196.4" font-size="15" fill="#3a3226" textLength="704.9" lengthAdjust="spacing">Acestea se transmit din generație în generație, de la o regiune la alta, uneori de la o cultură la alta, fiind</text>
<text x="62.0" y="218.1" font-size="15" fill="#3a3226" textLength="268.4" lengthAdjust="spacing">reconsiderate și îmbogățite permanent.</text>
<rect x="40" y="260.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="283.6" font-size="16" font-weight="700" fill="#ffffff">2. SĂRBĂTORILE DE IARNĂ</text>
<rect x="40" y="294.6" width="820" height="120.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="312.6" width="776.0" height="84.9" rx="12" fill="#f3efe4"/><text x="78.0" y="339.1" font-size="14.5" fill="#3a3226" textLength="720.1" lengthAdjust="spacing">Sărbătorile de iarnă sunt petrecute diferit, în funcție de tradițiile și obiceiurile fiecărei comunități, dar există și</text>
<text x="78.0" y="360.2" font-size="14.5" fill="#3a3226" textLength="649.2" lengthAdjust="spacing">aspecte comune, care pot crea punți de comunicare între oameni care aparțin unor culturi diferite.</text>
<text x="731.1" y="360.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="69.9" lengthAdjust="spacing">Colindatul</text>
<text x="78.0" y="381.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="203.5" lengthAdjust="spacing">este una dintre aceste tradiții.</text>
<rect x="40" y="435.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="458.5" font-size="16" font-weight="700" fill="#ffffff">3. COLINDE</text>
<rect x="40" y="469.5" width="820" height="294.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="502.5" font-size="15" fill="#3a3226" textLength="569.4" lengthAdjust="spacing">Colindatul este un obicei străvechi, transmis din generație în generație. Din manual:</text>
<text x="635.5" y="502.5" font-size="15" fill="#10233f" font-style="italic" textLength="125.2" lengthAdjust="spacing">Steaua sus răsare</text>
<text x="760.7" y="502.5" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">,</text>
<text x="769.0" y="502.5" font-size="15" fill="#10233f" font-style="italic" textLength="63.8" lengthAdjust="spacing">Trei magi</text>
<text x="62.0" y="524.3" font-size="15" fill="#10233f" font-style="italic" textLength="86.5" lengthAdjust="spacing">de la Răsărit</text>
<text x="148.5" y="524.3" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">,</text>
<text x="156.8" y="524.3" font-size="15" fill="#10233f" font-style="italic" textLength="144.9" lengthAdjust="spacing">O, ce veste minunată</text>
<text x="301.7" y="524.3" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">,</text>
<text x="310.0" y="524.3" font-size="15" fill="#10233f" font-style="italic" textLength="103.2" lengthAdjust="spacing">O, brad frumos</text>
<text x="413.2" y="524.3" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">,</text>
<text x="421.4" y="524.3" font-size="15" fill="#10233f" font-style="italic" textLength="84.5" lengthAdjust="spacing">Florile dalbe</text>
<text x="505.9" y="524.3" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">,</text>
<text x="514.2" y="524.3" font-size="15" fill="#10233f" font-style="italic" textLength="61.6" lengthAdjust="spacing">Leru-i ler</text>
<text x="575.8" y="524.3" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">,</text>
<text x="584.1" y="524.3" font-size="15" fill="#10233f" font-style="italic" textLength="162.5" lengthAdjust="spacing">Domn-Domn să-nălțăm</text>
<text x="746.6" y="524.3" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">.</text>
<text x="62.0" y="549.0" font-size="15" fill="#3a3226" textLength="529.7" lengthAdjust="spacing">De Crăciun se cântă colinde românești, dar și colinde preluate din alte culturi.</text>
<rect x="62.0" y="567.5" width="380.0" height="178.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="595.5" font-size="16" fill="#0d9c92" font-weight="700" textLength="157.8" lengthAdjust="spacing">O, ce veste minunată</text>
<text x="78.0" y="618.8" font-size="14.5" fill="#3a3226" textLength="304.7" lengthAdjust="spacing">un vechi colind românesc, cunoscut în diferite</text>
<text x="78.0" y="639.9" font-size="14.5" fill="#3a3226" textLength="303.1" lengthAdjust="spacing">variante, în funcție de regiunea unde se cântă</text>
<text x="78.0" y="663.8" font-size="14.5" fill="#3a3226" textLength="328.1" lengthAdjust="spacing">adaptat de compozitori în muzica ușoară și în cea</text>
<text x="78.0" y="684.8" font-size="14.5" fill="#3a3226" textLength="32.4" lengthAdjust="spacing">cultă</text>
<text x="78.0" y="708.7" font-size="14.5" fill="#3a3226" textLength="96.5" lengthAdjust="spacing">partitura cultă:</text>
<text x="178.5" y="708.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="177.9" lengthAdjust="spacing">Dimitrie Georgescu-Kiriac</text>
<text x="356.3" y="708.7" font-size="14.5" fill="#3a3226" textLength="19.3" lengthAdjust="spacing">, la</text>
<text x="78.0" y="729.8" font-size="14.5" fill="#3a3226" textLength="187.6" lengthAdjust="spacing">începutul secolului al XX-lea</text>
<rect x="458.0" y="567.5" width="380.0" height="178.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="595.5" font-size="16" fill="#6f5ea8" font-weight="700" textLength="112.2" lengthAdjust="spacing">O, brad frumos</text>
<text x="474.0" y="613.8" font-size="13.5" fill="#5b6b83" textLength="69.1" lengthAdjust="spacing">în germană</text>
<text x="546.8" y="613.8" font-size="13.5" fill="#5b6b83" font-style="italic" textLength="94.9" lengthAdjust="spacing">O Tannenbaum</text>
<text x="474.0" y="636.4" font-size="14.5" fill="#3a3226" textLength="138.9" lengthAdjust="spacing">melodie populară din</text>
<text x="616.8" y="636.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="44.8" lengthAdjust="spacing">Silezia</text>
<text x="661.6" y="636.4" font-size="14.5" fill="#3a3226" textLength="147.5" lengthAdjust="spacing">, din secolul al XVI-lea</text>
<text x="474.0" y="660.3" font-size="14.5" fill="#3a3226" textLength="215.7" lengthAdjust="spacing">versurile, compuse mai târziu de</text>
<text x="693.7" y="660.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="105.3" lengthAdjust="spacing">Ernst Anschütz</text>
<text x="474.0" y="681.3" font-size="14.5" fill="#3a3226" textLength="76.4" lengthAdjust="spacing">(1780-1861)</text>
<text x="474.0" y="705.3" font-size="14.5" fill="#3a3226" textLength="191.5" lengthAdjust="spacing">tradus în multe limbi ale lumii</text>
<rect x="40" y="784.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="807.1" font-size="16" font-weight="700" fill="#ffffff">4. COLINDATUL MEU</text>
<rect x="40" y="818.1" width="820" height="198.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="836.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="857.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.8" lengthAdjust="spacing">Întrebarea</text>
<text x="384.4" y="857.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="97.8" lengthAdjust="spacing">Răspunsul meu</text>
<line x1="62.0" y1="867.7" x2="838.0" y2="867.7" stroke="#e3dccb"/>
<text x="74.0" y="890.2" font-size="14.5" fill="#3a3226" textLength="220.1" lengthAdjust="spacing">a. De câte ori am fost la colindat?</text>
<text x="384.4" y="890.2" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="900.5" x2="838.0" y2="900.5" stroke="#e3dccb"/>
<text x="74.0" y="923.0" font-size="14.5" fill="#3a3226" textLength="139.8" lengthAdjust="spacing">b. Unde am colindat?</text>
<text x="384.4" y="923.0" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="933.4" x2="838.0" y2="933.4" stroke="#e3dccb"/>
<text x="74.0" y="955.9" font-size="14.5" fill="#3a3226" textLength="163.2" lengthAdjust="spacing">c. Ce colinde am cântat?</text>
<text x="384.4" y="955.9" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="966.2" x2="838.0" y2="966.2" stroke="#e3dccb"/>
<text x="74.0" y="988.7" font-size="14.5" fill="#3a3226" textLength="164.7" lengthAdjust="spacing">d. Cum am fost răsplătit?</text>
<text x="384.4" y="988.7" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="999.1" x2="838.0" y2="999.1" stroke="#e3dccb"/>
<line x1="372.4" y1="836.1" x2="372.4" y2="999.1" stroke="#e3dccb"/>
<rect x="40" y="1037.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1060.1" font-size="16" font-weight="700" fill="#ffffff">5. POEZIA ȘI PICTURA</text>
<rect x="40" y="1071.1" width="820" height="137.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="1089.1" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="78.0" y="1117.1" font-size="16" fill="#9a7433" font-weight="700" textLength="50.2" lengthAdjust="spacing">poezia</text>
<text x="78.0" y="1140.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="87.7" lengthAdjust="spacing">Iarna pe uliță</text>
<text x="169.6" y="1140.4" font-size="14.5" fill="#3a3226" textLength="16.8" lengthAdjust="spacing">de</text>
<text x="190.3" y="1140.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="106.0" lengthAdjust="spacing">George Coșbuc</text>
<rect x="458.0" y="1089.1" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
<text x="474.0" y="1117.1" font-size="16" fill="#10233f" font-weight="700" textLength="53.4" lengthAdjust="spacing">pictura</text>
<text x="474.0" y="1140.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="82.8" lengthAdjust="spacing">De sărbători</text>
<text x="560.7" y="1140.4" font-size="14.5" fill="#3a3226" textLength="62.0" lengthAdjust="spacing">(2017) de</text>
<text x="626.6" y="1140.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="128.2" lengthAdjust="spacing">Gheorghe Ciobanu</text>
<text x="62.0" y="1185.7" font-size="15" fill="#3a3226" textLength="677.1" lengthAdjust="spacing">Ce au acestea în comun? Ce emoții sau amintiri îmi trezesc? ………………………………………………………</text>
<text x="51.0" y="1239.7" font-size="11.5" fill="#5b6b83" textLength="797.9" lengthAdjust="spacing">Sursa: Manual Art 5, p. 90 (rubrica Repere cuvânt cu cuvânt, Pentru început, Explorare ex. 1-2, Aplicații ex. 1-2). Spațiile de completat sunt create pentru</text>
<text x="414.6" y="1256.4" font-size="11.5" fill="#5b6b83" textLength="70.9" lengthAdjust="spacing">aceste notițe.</text>
</svg>
