<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Tradiții: sărbătorile de iarnă</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III, Lecția 6</text>
  <g>
    <rect x="60" y="95" width="240" height="180" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="180" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">Colindele</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="180" y="150">Cântece tradiționale,</tspan><tspan x="180" y="166">urări de bine, cântate</tspan><tspan x="180" y="182">din casă în casă.</tspan></text>
  </g>
  <g>
    <rect x="330" y="95" width="240" height="180" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">Obiceiuri</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="450" y="150">Împodobitul bradului,</tspan><tspan x="450" y="166">Moș Crăciun, cadouri,</tspan><tspan x="450" y="182">mese festive.</tspan></text>
  </g>
  <g>
    <rect x="600" y="95" width="240" height="180" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="720" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">Arte plastice</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="720" y="150">Pictura naivă, scenele</tspan><tspan x="720" y="166">de iarnă, portretele</tspan><tspan x="720" y="182">de familie de sărbători.</tspan></text>
  </g>
  <text x="450" y="320" text-anchor="middle" font-size="11.5" fill="#3a3226">Multe culturi au tradiții asemănătoare de sărbătorire a iernii.</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 6, p. 90</text>
</svg>
