<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1591" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1591" fill="#faf7f0"/>
<text x="305.8" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="287.1" lengthAdjust="spacing">Semnificațiile textului</text>
<text x="230.7" y="74.4" font-size="14" fill="#5b6b83" textLength="438.7" lengthAdjust="spacing">Clasa a V-a · Unitatea III, Lecția 4 · Manual, p. 84 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CUM INTERPRETEZ POEZIA</text>
<rect x="40" y="128.6" width="820" height="392.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="766.7" lengthAdjust="spacing">Întrebările din manual sunt piste pentru gândit și pentru caiet. Răspund cu cuvintele mele și îmi motivez ideile cu</text>
<text x="62.0" y="183.3" font-size="15" fill="#3a3226" textLength="136.8" lengthAdjust="spacing">exemple din poezie.</text>
<rect x="62.0" y="201.8" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="223.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="138.7" lengthAdjust="spacing">Întrebarea din manual</text>
<text x="555.1" y="223.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="62.2" lengthAdjust="spacing">Pista mea</text>
<line x1="62.0" y1="233.4" x2="838.0" y2="233.4" stroke="#e3dccb"/>
<text x="74.0" y="255.9" font-size="14.5" fill="#3a3226" font-weight="700">1.</text>
<text x="89.6" y="255.9" font-size="14.5" fill="#3a3226" textLength="438.1" lengthAdjust="spacing">Care este, în opinia mea, ideea sau imaginea cea mai importantă a</text>
<text x="89.6" y="276.9" font-size="14.5" fill="#3a3226" textLength="54.8" lengthAdjust="spacing">poeziei?</text>
<text x="555.1" y="255.9" font-size="14.5" fill="#3a3226" textLength="109.1" lengthAdjust="spacing">………………………</text>
<line x1="62.0" y1="287.3" x2="838.0" y2="287.3" stroke="#e3dccb"/>
<text x="74.0" y="309.8" font-size="14.5" fill="#3a3226" font-weight="700">2.</text>
<text x="92.4" y="309.8" font-size="14.5" fill="#3a3226" textLength="410.6" lengthAdjust="spacing">Care este tema poeziei? Pot alege: strada, casa, sentimentele,</text>
<text x="92.4" y="330.8" font-size="14.5" fill="#3a3226" textLength="167.0" lengthAdjust="spacing">maidanezii sau altă temă.</text>
<text x="555.1" y="309.8" font-size="14.5" fill="#3a3226" textLength="109.1" lengthAdjust="spacing">………………………</text>
<line x1="62.0" y1="341.1" x2="838.0" y2="341.1" stroke="#e3dccb"/>
<text x="74.0" y="363.6" font-size="14.5" fill="#3a3226" font-weight="700">3.</text>
<text x="92.3" y="363.6" font-size="14.5" fill="#3a3226" textLength="429.7" lengthAdjust="spacing">Prin ce este deosebită poezia: ideile, felul în care sunt exprimate,</text>
<text x="92.3" y="384.7" font-size="14.5" fill="#3a3226" textLength="148.4" lengthAdjust="spacing">sonoritatea versurilor?</text>
<text x="555.1" y="363.6" font-size="14.5" fill="#3a3226" textLength="109.1" lengthAdjust="spacing">………………………</text>
<line x1="62.0" y1="395.0" x2="838.0" y2="395.0" stroke="#e3dccb"/>
<text x="74.0" y="417.5" font-size="14.5" fill="#3a3226" font-weight="700">4.</text>
<text x="92.6" y="417.5" font-size="14.5" fill="#3a3226" textLength="405.1" lengthAdjust="spacing">De ce cred că autoarea percepe strada într-un mod deosebit,</text>
<text x="92.6" y="438.5" font-size="14.5" fill="#3a3226" textLength="56.0" lengthAdjust="spacing">original?</text>
<text x="555.1" y="417.5" font-size="14.5" fill="#3a3226" textLength="109.1" lengthAdjust="spacing">………………………</text>
<line x1="62.0" y1="448.9" x2="838.0" y2="448.9" stroke="#e3dccb"/>
<text x="74.0" y="471.4" font-size="14.5" fill="#3a3226" font-weight="700">5.</text>
<text x="92.2" y="471.4" font-size="14.5" fill="#3a3226" textLength="406.8" lengthAdjust="spacing">Dacă aș fi scris eu poezia, ce aș fi vrut să spun despre strada</text>
<text x="92.2" y="492.4" font-size="14.5" fill="#3a3226" textLength="35.6" lengthAdjust="spacing">mea?</text>
<text x="555.1" y="471.4" font-size="14.5" fill="#3a3226" textLength="109.1" lengthAdjust="spacing">………………………</text>
<line x1="62.0" y1="502.8" x2="838.0" y2="502.8" stroke="#e3dccb"/>
<line x1="543.1" y1="201.8" x2="543.1" y2="502.8" stroke="#e3dccb"/>
<rect x="40" y="540.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="563.8" font-size="16" font-weight="700" fill="#ffffff">2. POEZIA CITITĂ PRIN INTELIGENȚE DIFERITE</text>
<rect x="40" y="574.8" width="820" height="586.4" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="608.8" font-size="16" fill="#10233f" textLength="699.7" lengthAdjust="spacing">Un text poate fi interpretat prin prisma diferitelor inteligențe pe care le stăpânește fiecare cititor.</text>
<text x="62.0" y="642.6" font-size="15" fill="#3a3226" textLength="743.2" lengthAdjust="spacing">Aleg, dintre sarcinile de mai jos, pe aceea care mi se potrivește și o rezolv. Prezint apoi soluția mea colegilor.</text>
<rect x="62.0" y="661.1" width="776.0" height="51.1" fill="#efeaf8"/>
<text x="74.0" y="682.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="67.9" lengthAdjust="spacing">Inteligența</text>
<text x="268.0" y="682.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="107.7" lengthAdjust="spacing">Sarcina, pe scurt</text>
<text x="755.8" y="682.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="48.1" lengthAdjust="spacing">Sarcina</text>
<text x="759.1" y="702.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="41.5" lengthAdjust="spacing">aleasă</text>
<line x1="62.0" y1="712.2" x2="838.0" y2="712.2" stroke="#e3dccb"/>
<text x="74.0" y="734.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="70.7" lengthAdjust="spacing">lingvistică</text>
<text x="268.0" y="734.7" font-size="14.5" fill="#3a3226" textLength="427.9" lengthAdjust="spacing">Recitește textul și prezintă oral ce ai înțeles, ce ți-a plăcut sau ce</text>
<text x="268.0" y="755.7" font-size="14.5" fill="#3a3226" textLength="102.2" lengthAdjust="spacing">te-a nedumerit.</text>
<text x="775.2" y="734.7" font-size="14.5" fill="#3a3226" textLength="9.2" lengthAdjust="spacing">☐</text>
<line x1="62.0" y1="766.1" x2="838.0" y2="766.1" stroke="#e3dccb"/>
<text x="74.0" y="788.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="129.2" lengthAdjust="spacing">logico-matematică</text>
<text x="268.0" y="788.6" font-size="14.5" fill="#3a3226" textLength="414.8" lengthAdjust="spacing">Găsește pentru fiecare casă o formă geometrică sau o formulă</text>
<text x="268.0" y="809.6" font-size="14.5" fill="#3a3226" textLength="278.8" lengthAdjust="spacing">care i se potrivește. Explică cum ai gândit.</text>
<text x="775.2" y="788.6" font-size="14.5" fill="#3a3226" textLength="9.2" lengthAdjust="spacing">☐</text>
<line x1="62.0" y1="819.9" x2="838.0" y2="819.9" stroke="#e3dccb"/>
<text x="74.0" y="842.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="101.5" lengthAdjust="spacing">spațial-vizuală</text>
<text x="268.0" y="842.4" font-size="14.5" fill="#3a3226" textLength="430.4" lengthAdjust="spacing">Desenează strada cu sentimente, așa cum ți-o reprezinți pe baza</text>
<text x="268.0" y="863.5" font-size="14.5" fill="#3a3226" textLength="136.0" lengthAdjust="spacing">informațiilor din text.</text>
<text x="775.2" y="842.4" font-size="14.5" fill="#3a3226" textLength="9.2" lengthAdjust="spacing">☐</text>
<line x1="62.0" y1="873.8" x2="838.0" y2="873.8" stroke="#e3dccb"/>
<text x="74.0" y="896.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="61.8" lengthAdjust="spacing">muzicală</text>
<text x="268.0" y="896.3" font-size="14.5" fill="#3a3226" textLength="411.2" lengthAdjust="spacing">Gândește-te ce tip de muzică s-ar potrivi pentru fiecare dintre</text>
<text x="268.0" y="917.3" font-size="14.5" fill="#3a3226" textLength="251.9" lengthAdjust="spacing">cele șapte case. Explică alegerile tale.</text>
<text x="775.2" y="896.3" font-size="14.5" fill="#3a3226" textLength="9.2" lengthAdjust="spacing">☐</text>
<line x1="62.0" y1="927.7" x2="838.0" y2="927.7" stroke="#e3dccb"/>
<text x="74.0" y="950.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="151.3" lengthAdjust="spacing">corporal-chinestezică</text>
<text x="268.0" y="950.2" font-size="14.5" fill="#3a3226" textLength="424.0" lengthAdjust="spacing">Mimează emoțiile pe care ți le transmite fiecare casă descrisă în</text>
<text x="268.0" y="971.2" font-size="14.5" fill="#3a3226" textLength="48.3" lengthAdjust="spacing">poezie.</text>
<text x="775.2" y="950.2" font-size="14.5" fill="#3a3226" textLength="9.2" lengthAdjust="spacing">☐</text>
<line x1="62.0" y1="981.6" x2="838.0" y2="981.6" stroke="#e3dccb"/>
<text x="74.0" y="1004.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="73.2" lengthAdjust="spacing">naturalistă</text>
<text x="268.0" y="1004.1" font-size="14.5" fill="#3a3226" textLength="419.8" lengthAdjust="spacing">Grupează casele în câteva categorii. Precizează pe ce criterii ai</text>
<text x="268.0" y="1025.1" font-size="14.5" fill="#3a3226" textLength="117.6" lengthAdjust="spacing">făcut clasificarea.</text>
<text x="775.2" y="1004.1" font-size="14.5" fill="#3a3226" textLength="9.2" lengthAdjust="spacing">☐</text>
<line x1="62.0" y1="1035.4" x2="838.0" y2="1035.4" stroke="#e3dccb"/>
<text x="74.0" y="1057.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="99.9" lengthAdjust="spacing">interpersonală</text>
<text x="268.0" y="1057.9" font-size="14.5" fill="#3a3226" textLength="433.0" lengthAdjust="spacing">Realizează un joc de rol cu un coleg sau o colegă: un scurt dialog</text>
<text x="268.0" y="1079.0" font-size="14.5" fill="#3a3226" textLength="243.4" lengthAdjust="spacing">între casele din poezie și un trecător.</text>
<text x="775.2" y="1057.9" font-size="14.5" fill="#3a3226" textLength="9.2" lengthAdjust="spacing">☐</text>
<line x1="62.0" y1="1089.3" x2="838.0" y2="1089.3" stroke="#e3dccb"/>
<text x="74.0" y="1111.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="99.5" lengthAdjust="spacing">intrapersonală</text>
<text x="268.0" y="1111.8" font-size="14.5" fill="#3a3226" textLength="419.8" lengthAdjust="spacing">Scrie un pasaj, în jurnalul tău, despre emoțiile pe care le-ai avut</text>
<text x="268.0" y="1132.8" font-size="14.5" fill="#3a3226" textLength="172.0" lengthAdjust="spacing">citind și discutând poezia.</text>
<text x="775.2" y="1111.8" font-size="14.5" fill="#3a3226" textLength="9.2" lengthAdjust="spacing">☐</text>
<line x1="62.0" y1="1143.2" x2="838.0" y2="1143.2" stroke="#e3dccb"/>
<line x1="256.0" y1="661.1" x2="256.0" y2="1143.2" stroke="#e3dccb"/>
<line x1="721.6" y1="661.1" x2="721.6" y2="1143.2" stroke="#e3dccb"/>
<rect x="40" y="1181.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1204.2" font-size="16" font-weight="700" fill="#ffffff">3. PORTOFOLIU ȘI PROVOCĂRI</text>
<rect x="40" y="1215.2" width="820" height="308.4" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="1233.2" width="380.0" height="196.7" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="78.0" y="1261.2" font-size="16" fill="#9a7433" font-weight="700" textLength="99.3" lengthAdjust="spacing">PORTOFOLIU</text>
<text x="78.0" y="1284.5" font-size="14.5" fill="#3a3226" font-weight="700">1.</text>
<text x="93.6" y="1284.5" font-size="14.5" fill="#3a3226" textLength="297.8" lengthAdjust="spacing">Crezi că toate străzile din lume ar putea avea</text>
<text x="93.6" y="1305.5" font-size="14.5" fill="#3a3226" textLength="327.0" lengthAdjust="spacing">sentimente? Sau că noi, oamenii, suntem cei care</text>
<text x="93.6" y="1326.5" font-size="14.5" fill="#3a3226" textLength="307.0" lengthAdjust="spacing">pot da viață unei străzi, unei case, unui obiect,</text>
<text x="93.6" y="1347.6" font-size="14.5" fill="#3a3226" textLength="104.7" lengthAdjust="spacing">prin imaginație?</text>
<text x="202.3" y="1347.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="211.7" lengthAdjust="spacing">Notează răspunsul tău în caiet.</text>
<text x="78.0" y="1371.5" font-size="14.5" fill="#3a3226" font-weight="700">2.</text>
<text x="96.4" y="1371.5" font-size="14.5" fill="#3a3226" textLength="312.5" lengthAdjust="spacing">Descrie cât mai plastic strada pe care locuiești,</text>
<text x="96.4" y="1392.5" font-size="14.5" fill="#3a3226" textLength="323.7" lengthAdjust="spacing">folosind cel puțin o personificare. Poți adăuga un</text>
<text x="96.4" y="1413.5" font-size="14.5" fill="#3a3226" textLength="153.0" lengthAdjust="spacing">desen sau o fotografie.</text>
<rect x="458.0" y="1233.2" width="380.0" height="196.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="1261.2" font-size="16" fill="#6f5ea8" font-weight="700" textLength="91.4" lengthAdjust="spacing">PROVOCĂRI</text>
<text x="474.0" y="1284.5" font-size="14.5" fill="#3a3226" font-weight="700">1.</text>
<text x="489.6" y="1284.5" font-size="14.5" fill="#3a3226" textLength="300.6" lengthAdjust="spacing">Identifică, pentru fiecare tip de inteligență din</text>
<text x="489.6" y="1305.5" font-size="14.5" fill="#3a3226" textLength="255.2" lengthAdjust="spacing">tabel, trei elemente care o pot descrie.</text>
<text x="474.0" y="1329.4" font-size="14.5" fill="#3a3226" font-weight="700">2.</text>
<text x="492.4" y="1329.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="110.1" lengthAdjust="spacing">Notează în caiet</text>
<text x="606.4" y="1329.4" font-size="14.5" fill="#3a3226" textLength="174.1" lengthAdjust="spacing">care sunt inteligențele tale</text>
<text x="492.4" y="1350.5" font-size="14.5" fill="#3a3226" textLength="73.8" lengthAdjust="spacing">dominante.</text>
<rect x="62.0" y="1443.9" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="1470.4" font-size="14.5" fill="#10233f" font-weight="700" textLength="198.0" lengthAdjust="spacing">Inteligențele mele dominante</text>
<text x="78.0" y="1489.2" font-size="14.5" fill="#3a3226" font-weight="700">1.</text>
<text x="93.6" y="1489.2" font-size="14.5" fill="#3a3226" textLength="477.0" lengthAdjust="spacing">……………………………… 2. ……………………………… 3. ………………………………</text>
<text x="60.2" y="1555.1" font-size="11.5" fill="#5b6b83" textLength="779.6" lengthAdjust="spacing">Sursa: Manual Art 5, p. 84 (Interpretare ex. 1-6, Portofoliu, Provocări); sarcinile din tabel sunt prescurtate din ex. 6. Lecția nu are rubrica Repere, deci</text>
<text x="238.8" y="1571.8" font-size="11.5" fill="#5b6b83" textLength="422.4" lengthAdjust="spacing">notițele nu conțin definiții. Spațiile de completat sunt create pentru aceste notițe.</text>
</svg>
