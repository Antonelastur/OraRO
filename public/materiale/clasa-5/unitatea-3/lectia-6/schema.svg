<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1623" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1623" fill="#faf7f0"/>
<text x="68.8" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="751.1" lengthAdjust="spacing">Textul descriptiv nonliterar. Persana, un ghem pufos cu o</text>
<text x="275.1" y="85.0" font-size="28" fill="#10233f" font-weight="700" textLength="348.7" lengthAdjust="spacing">personalitate încântătoare</text>
<text x="215.7" y="109.4" font-size="14" fill="#5b6b83" textLength="468.5" lengthAdjust="spacing">Clasa a V-a · Unitatea III, Lecția 6 · Manual, pp. 87-89 · notițe pentru caiet</text>
<rect x="40" y="129.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="152.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL DESCRIPTIV NONLITERAR</text>
<rect x="40" y="163.6" width="820" height="199.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="197.6" font-size="16" fill="#10233f" font-weight="700" textLength="203.5" lengthAdjust="spacing">Textul descriptiv nonliterar</text>
<text x="269.9" y="197.6" font-size="16" fill="#10233f" textLength="551.1" lengthAdjust="spacing">prezintă în detaliu un obiect, o ființă, un peisaj din natură sau un fenomen al</text>
<text x="62.0" y="220.8" font-size="16" fill="#10233f" textLength="549.6" lengthAdjust="spacing">naturii, evidențiind părțile sale componente și trăsăturile specifice acestuia.</text>
<rect x="62.0" y="239.6" width="776.0" height="105.9" rx="12" fill="#f3efe4"/><text x="78.0" y="266.1" font-size="14.5" fill="#3a3226" textLength="735.2" lengthAdjust="spacing">Spre deosebire de textul descriptiv literar, care prezintă impresii, percepții subiective sau chiar descrieri bazate</text>
<text x="78.0" y="287.1" font-size="14.5" fill="#3a3226" textLength="691.0" lengthAdjust="spacing">pe imaginație, în textul descriptiv nonliterar sunt prezentate informații, date concrete și reale privitoare la</text>
<text x="78.0" y="308.2" font-size="14.5" fill="#3a3226" textLength="717.6" lengthAdjust="spacing">obiectul descris. Tonul folosit este unul neutru, iar limbajul este precis, cu multe cuvinte aparținând câmpului</text>
<text x="78.0" y="329.2" font-size="14.5" fill="#3a3226" textLength="293.4" lengthAdjust="spacing">lexical în care se încadrează tema descrierii.</text>
<rect x="40" y="383.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="406.5" font-size="16" font-weight="700" fill="#ffffff">2. CITESC CU METODA SINELG</text>
<rect x="40" y="417.5" width="820" height="176.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="450.5" font-size="15" fill="#3a3226" textLength="548.7" lengthAdjust="spacing">Pe măsură ce parcurg textul, notez pe margine, cu creionul, următoarele semne:</text>
<text x="62.0" y="475.3" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="475.3" font-size="15" fill="#3a3226" textLength="47.8" lengthAdjust="spacing">o bifă (</text>
<text x="124.1" y="475.3" font-size="15" fill="#2f7d4f" font-weight="700" textLength="12.8" lengthAdjust="spacing">✓</text>
<text x="136.9" y="475.3" font-size="15" fill="#3a3226" textLength="412.1" lengthAdjust="spacing">) pentru o situație în care textul îți confirmă ceva ce știi deja;</text>
<text x="62.0" y="500.0" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="500.0" font-size="15" fill="#3a3226" textLength="71.6" lengthAdjust="spacing">un minus (</text>
<text x="147.9" y="500.0" font-size="15" fill="#b4432c" font-weight="700" textLength="7.3" lengthAdjust="spacing">–</text>
<text x="155.1" y="500.0" font-size="15" fill="#3a3226" textLength="597.9" lengthAdjust="spacing">) pentru o informație care contrazice ceea ce știi sau e ușor diferită față de ceea ce știi;</text>
<text x="62.0" y="524.8" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="524.8" font-size="15" fill="#3a3226" textLength="59.2" lengthAdjust="spacing">un plus (</text>
<text x="135.5" y="524.8" font-size="15" fill="#0d9c92" font-weight="700" textLength="9.8" lengthAdjust="spacing">+</text>
<text x="145.3" y="524.8" font-size="15" fill="#3a3226" textLength="236.8" lengthAdjust="spacing">) dacă întâlnești o informație nouă;</text>
<text x="62.0" y="549.5" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="549.5" font-size="15" fill="#3a3226" textLength="154.8" lengthAdjust="spacing">un semn de întrebare (</text>
<text x="231.1" y="549.5" font-size="15" fill="#6f5ea8" font-weight="700" textLength="8.1" lengthAdjust="spacing">?</text>
<text x="239.2" y="549.5" font-size="15" fill="#3a3226" textLength="547.5" lengthAdjust="spacing">) în dreptul ideilor care ți se par neclare sau în cazul în care vrei să știi mai multe</text>
<text x="76.2" y="571.3" font-size="15" fill="#3a3226" textLength="173.5" lengthAdjust="spacing">despre un anumit aspect.</text>
<rect x="40" y="613.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="636.8" font-size="16" font-weight="700" fill="#ffffff">3. ARTICOLUL DESPRE PERSANĂ</text>
<rect x="40" y="647.8" width="820" height="383.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="680.8" font-size="15" fill="#3a3226" font-weight="700" textLength="40.7" lengthAdjust="spacing">Titlul:</text>
<text x="106.8" y="680.8" font-size="15" fill="#10233f" font-style="italic" textLength="387.5" lengthAdjust="spacing">Persana, un ghem pufos cu o personalitate încântătoare</text>
<text x="498.3" y="680.8" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">·</text>
<text x="506.6" y="680.8" font-size="15" fill="#3a3226" font-weight="700" textLength="45.8" lengthAdjust="spacing">Sursa:</text>
<text x="62.0" y="702.5" font-size="15" fill="#3a3226" textLength="340.9" lengthAdjust="spacing">www.animalutze.com/articole/pisica-persana.php</text>
<rect x="62.0" y="721.0" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="742.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.0" lengthAdjust="spacing">Aspectul</text>
<text x="229.2" y="742.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="135.4" lengthAdjust="spacing">Unde îl găsesc în text</text>
<text x="555.1" y="742.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="51.6" lengthAdjust="spacing">Detaliile</text>
<line x1="62.0" y1="752.6" x2="838.0" y2="752.6" stroke="#e3dccb"/>
<text x="74.0" y="775.1" font-size="14.5" fill="#3a3226" textLength="42.2" lengthAdjust="spacing">corpul</text>
<text x="229.2" y="775.1" font-size="14.5" fill="#3a3226" textLength="76.0" lengthAdjust="spacing">paragrafele</text>
<text x="309.2" y="775.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="219.8" lengthAdjust="spacing">Sub aparențele de animal greoi…</text>
<text x="229.2" y="796.1" font-size="14.5" fill="#3a3226" textLength="10.8" lengthAdjust="spacing">și</text>
<text x="243.9" y="796.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="157.0" lengthAdjust="spacing">Musculatura persanei…</text>
<text x="555.1" y="775.1" font-size="14.5" fill="#3a3226" textLength="109.1" lengthAdjust="spacing">………………………</text>
<line x1="62.0" y1="806.4" x2="838.0" y2="806.4" stroke="#e3dccb"/>
<text x="74.0" y="828.9" font-size="14.5" fill="#3a3226" textLength="36.0" lengthAdjust="spacing">blana</text>
<text x="229.2" y="828.9" font-size="14.5" fill="#3a3226" textLength="68.4" lengthAdjust="spacing">paragraful</text>
<text x="301.5" y="828.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="101.2" lengthAdjust="spacing">Blana persanei</text>
<text x="555.1" y="828.9" font-size="14.5" fill="#3a3226" textLength="109.1" lengthAdjust="spacing">………………………</text>
<line x1="62.0" y1="839.3" x2="838.0" y2="839.3" stroke="#e3dccb"/>
<text x="74.0" y="861.8" font-size="14.5" fill="#3a3226" textLength="36.3" lengthAdjust="spacing">capul</text>
<text x="229.2" y="861.8" font-size="14.5" fill="#3a3226" textLength="68.4" lengthAdjust="spacing">paragraful</text>
<text x="301.5" y="861.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="103.0" lengthAdjust="spacing">Capul persanei</text>
<text x="555.1" y="861.8" font-size="14.5" fill="#3a3226" textLength="109.1" lengthAdjust="spacing">………………………</text>
<line x1="62.0" y1="872.1" x2="838.0" y2="872.1" stroke="#e3dccb"/>
<text x="74.0" y="894.6" font-size="14.5" fill="#3a3226" textLength="52.8" lengthAdjust="spacing">urechile</text>
<text x="229.2" y="894.6" font-size="14.5" fill="#3a3226" textLength="68.4" lengthAdjust="spacing">paragraful</text>
<text x="301.5" y="894.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="120.0" lengthAdjust="spacing">Urechile persanei</text>
<text x="555.1" y="894.6" font-size="14.5" fill="#3a3226" textLength="109.1" lengthAdjust="spacing">………………………</text>
<line x1="62.0" y1="905.0" x2="838.0" y2="905.0" stroke="#e3dccb"/>
<text x="74.0" y="927.5" font-size="14.5" fill="#3a3226" textLength="31.5" lengthAdjust="spacing">ochii</text>
<text x="229.2" y="927.5" font-size="14.5" fill="#3a3226" textLength="183.1" lengthAdjust="spacing">în paragraful despre urechi:</text>
<text x="416.2" y="927.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="98.9" lengthAdjust="spacing">Ochii, în ton cu</text>
<text x="229.2" y="948.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="110.2" lengthAdjust="spacing">culoarea blănii…</text>
<text x="555.1" y="927.5" font-size="14.5" fill="#3a3226" textLength="109.1" lengthAdjust="spacing">………………………</text>
<line x1="62.0" y1="958.9" x2="838.0" y2="958.9" stroke="#e3dccb"/>
<text x="74.0" y="981.4" font-size="14.5" fill="#3a3226" textLength="99.8" lengthAdjust="spacing">temperamentul</text>
<text x="229.2" y="981.4" font-size="14.5" fill="#3a3226" textLength="108.5" lengthAdjust="spacing">ultimul paragraf:</text>
<text x="341.7" y="981.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="161.2" lengthAdjust="spacing">Din punctul de vedere al</text>
<text x="229.2" y="1002.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="123.9" lengthAdjust="spacing">temperamentului…</text>
<text x="555.1" y="981.4" font-size="14.5" fill="#3a3226" textLength="109.1" lengthAdjust="spacing">………………………</text>
<line x1="62.0" y1="1012.8" x2="838.0" y2="1012.8" stroke="#e3dccb"/>
<line x1="217.2" y1="721.0" x2="217.2" y2="1012.8" stroke="#e3dccb"/>
<line x1="543.1" y1="721.0" x2="543.1" y2="1012.8" stroke="#e3dccb"/>
<rect x="40" y="1050.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1073.8" font-size="16" font-weight="700" fill="#ffffff">4. LITERAR ȘI NONLITERAR</text>
<rect x="40" y="1084.8" width="820" height="287.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1117.8" font-size="15" fill="#3a3226" textLength="75.5" lengthAdjust="spacing">Comparăm</text>
<text x="141.6" y="1117.8" font-size="15" fill="#10233f" font-style="italic" textLength="57.0" lengthAdjust="spacing">Persana</text>
<text x="202.7" y="1117.8" font-size="15" fill="#3a3226" textLength="101.9" lengthAdjust="spacing">cu textul literar</text>
<text x="308.7" y="1117.8" font-size="15" fill="#10233f" font-style="italic" textLength="56.1" lengthAdjust="spacing">O pisică</text>
<text x="368.9" y="1117.8" font-size="15" fill="#3a3226" textLength="122.1" lengthAdjust="spacing">de Tudor Arghezi.</text>
<text x="495.0" y="1117.8" font-size="15" fill="#3a3226" font-weight="700" textLength="286.5" lengthAdjust="spacing">Copiez în caiet tabelul și bifez trăsăturile</text>
<text x="785.6" y="1117.8" font-size="15" fill="#3a3226" textLength="17.3" lengthAdjust="spacing">pe</text>
<text x="62.0" y="1139.5" font-size="15" fill="#3a3226" textLength="265.9" lengthAdjust="spacing">care le consider specifice fiecărui text.</text>
<rect x="62.0" y="1158.0" width="776.0" height="31.6" fill="#efeaf8"/>

<text x="437.8" y="1179.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="147.5" lengthAdjust="spacing">Textul descriptiv literar</text>
<text x="642.9" y="1179.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="171.7" lengthAdjust="spacing">Textul descriptiv nonliterar</text>
<line x1="62.0" y1="1189.5" x2="838.0" y2="1189.5" stroke="#e3dccb"/>
<text x="74.0" y="1212.0" font-size="14.5" fill="#3a3226" textLength="196.6" lengthAdjust="spacing">Se referă la ceva din realitate.</text>


<line x1="62.0" y1="1222.4" x2="838.0" y2="1222.4" stroke="#e3dccb"/>
<text x="74.0" y="1244.9" font-size="14.5" fill="#3a3226" textLength="251.1" lengthAdjust="spacing">Prezintă impresii, percepții subiective.</text>


<line x1="62.0" y1="1255.2" x2="838.0" y2="1255.2" stroke="#e3dccb"/>
<text x="74.0" y="1277.8" font-size="14.5" fill="#3a3226" textLength="260.9" lengthAdjust="spacing">Prezintă informații care pot fi verificate.</text>


<line x1="62.0" y1="1288.1" x2="838.0" y2="1288.1" stroke="#e3dccb"/>
<text x="74.0" y="1310.6" font-size="14.5" fill="#3a3226" textLength="136.0" lengthAdjust="spacing">Limbajul este precis.</text>


<line x1="62.0" y1="1320.9" x2="838.0" y2="1320.9" stroke="#e3dccb"/>
<text x="74.0" y="1343.5" font-size="14.5" fill="#3a3226" textLength="119.4" lengthAdjust="spacing">Tonul este neutru.</text>


<line x1="62.0" y1="1353.8" x2="838.0" y2="1353.8" stroke="#e3dccb"/>
<line x1="403.4" y1="1158.0" x2="403.4" y2="1353.8" stroke="#e3dccb"/>
<line x1="620.7" y1="1158.0" x2="620.7" y2="1353.8" stroke="#e3dccb"/>
<rect x="40" y="1391.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1414.8" font-size="16" font-weight="700" fill="#ffffff">5. AUTOEVALUARE L1-L5</text>
<rect x="40" y="1425.8" width="820" height="129.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1458.8" font-size="15" fill="#3a3226" font-weight="700" textLength="296.9" lengthAdjust="spacing">Completez, în caiet, următoarele afirmații:</text>
<text x="62.0" y="1483.5" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="1483.5" font-size="15" fill="#3a3226" textLength="382.8" lengthAdjust="spacing">Din ceea ce am învățat, cel mai important mi se pare … .</text>
<text x="62.0" y="1508.3" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="1508.3" font-size="15" fill="#3a3226" textLength="265.8" lengthAdjust="spacing">Cel mai mult mi-a plăcut activitatea … .</text>
<text x="62.0" y="1533.0" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="1533.0" font-size="15" fill="#3a3226" textLength="203.4" lengthAdjust="spacing">Cel mai dificil mi s-a părut … .</text>
<text x="40.7" y="1587.0" font-size="11.5" fill="#5b6b83" textLength="818.7" lengthAdjust="spacing">Sursa: Manual Art 5, p. 88, rubrica Repere (cuvânt cu cuvânt); p. 87, ex. 3, metoda SINELG; articolul de la pp. 87-88; p. 89, Interpretare ex. 9 și Autoevaluare</text>
<text x="287.9" y="1603.7" font-size="11.5" fill="#5b6b83" textLength="324.1" lengthAdjust="spacing">L1-L5. Tabelele de completat sunt create pentru aceste notițe.</text>
</svg>
