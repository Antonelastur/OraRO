<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1002" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1002" fill="#faf7f0"/>
<text x="367.8" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="164.4" lengthAdjust="spacing">Substantivul</text>
<text x="222.4" y="74.4" font-size="14" fill="#5b6b83" textLength="455.1" lengthAdjust="spacing">Clasa a V-a · Unitatea III, Lecția 10 · Manual, pp. 94-95 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE SUBSTANTIVUL</text>
<rect x="40" y="128.6" width="820" height="113.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="93.9" lengthAdjust="spacing">Substantivul</text>
<text x="160.2" y="162.6" font-size="16" fill="#10233f" textLength="665.6" lengthAdjust="spacing">este partea de vorbire care denumește ființe, lucruri, fenomene ale naturii, însușiri, acțiuni, stări</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="236.2" lengthAdjust="spacing">sufletești, considerate în sens larg</text>
<text x="302.5" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="55.4" lengthAdjust="spacing">obiecte</text>
<text x="357.8" y="185.8" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<text x="62.0" y="219.6" font-size="15" fill="#10233f" font-style="italic" textLength="304.6" lengthAdjust="spacing">copil, casă, ninsoare, răutate, plimbare, bucurie</text>
<rect x="40" y="262.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="285.1" font-size="16" font-weight="700" fill="#ffffff">2. SUBSTANTIVE COMUNE ȘI PROPRII</text>
<rect x="40" y="296.1" width="820" height="182.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="314.1" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="342.1" font-size="16" fill="#0d9c92" font-weight="700" textLength="60.3" lengthAdjust="spacing">comune</text>
<text x="78.0" y="365.4" font-size="14.5" fill="#3a3226" textLength="77.9" lengthAdjust="spacing">denumesc o</text>
<text x="159.8" y="365.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="33.1" lengthAdjust="spacing">clasă</text>
<text x="196.8" y="365.4" font-size="14.5" fill="#3a3226" textLength="152.7" lengthAdjust="spacing">de obiecte de același fel</text>
<text x="78.0" y="389.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="116.1" lengthAdjust="spacing">stradă, oraș, floare</text>
<rect x="458.0" y="314.1" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="342.1" font-size="16" fill="#6f5ea8" font-weight="700" textLength="51.4" lengthAdjust="spacing">proprii</text>
<text x="474.0" y="365.4" font-size="14.5" fill="#3a3226" textLength="65.4" lengthAdjust="spacing">denumesc</text>
<text x="543.3" y="365.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="94.8" lengthAdjust="spacing">individualități</text>
<text x="638.1" y="365.4" font-size="14.5" fill="#3a3226" textLength="157.8" lengthAdjust="spacing">: nume de persoane, țări,</text>
<text x="474.0" y="386.4" font-size="14.5" fill="#3a3226" textLength="221.1" lengthAdjust="spacing">localități, ape, sărbători; se scriu cu</text>
<text x="699.0" y="386.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="74.1" lengthAdjust="spacing">literă mare</text>
<text x="474.0" y="410.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="189.5" lengthAdjust="spacing">Ana, România, Mureș, Crăciun</text>
<text x="62.0" y="455.7" font-size="15" fill="#3a3226" textLength="390.0" lengthAdjust="spacing">Există substantive proprii obținute din substantive comune:</text>
<text x="456.0" y="455.7" font-size="15" fill="#10233f" font-style="italic" textLength="106.7" lengthAdjust="spacing">floare → Floarea</text>
<text x="562.7" y="455.7" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="498.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="521.2" font-size="16" font-weight="700" fill="#ffffff">3. GENUL ȘI NUMĂRUL</text>
<rect x="40" y="532.2" width="820" height="246.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="550.2" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="571.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="37.1" lengthAdjust="spacing">Genul</text>
<text x="322.3" y="571.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="100.4" lengthAdjust="spacing">Cum îl recunosc</text>
<text x="539.6" y="571.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="581.8" x2="838.0" y2="581.8" stroke="#e3dccb"/>
<text x="74.0" y="604.2" font-size="14.5" fill="#3a3226" textLength="56.1" lengthAdjust="spacing">masculin</text>
<text x="346.3" y="604.2" font-size="14.5" fill="#3a3226" textLength="52.2" lengthAdjust="spacing">un – doi</text>
<text x="539.6" y="604.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="109.8" lengthAdjust="spacing">un copil, doi copii</text>
<line x1="62.0" y1="614.6" x2="838.0" y2="614.6" stroke="#e3dccb"/>
<text x="74.0" y="637.1" font-size="14.5" fill="#3a3226" textLength="48.0" lengthAdjust="spacing">feminin</text>
<text x="344.2" y="637.1" font-size="14.5" fill="#3a3226" textLength="56.4" lengthAdjust="spacing">o – două</text>
<text x="539.6" y="637.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="102.2" lengthAdjust="spacing">o fată, două fete</text>
<line x1="62.0" y1="647.5" x2="838.0" y2="647.5" stroke="#e3dccb"/>
<text x="74.0" y="670.0" font-size="14.5" fill="#3a3226" textLength="42.3" lengthAdjust="spacing">neutru</text>
<text x="340.2" y="670.0" font-size="14.5" fill="#3a3226" textLength="64.4" lengthAdjust="spacing">un – două</text>
<text x="539.6" y="670.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="129.3" lengthAdjust="spacing">un caiet, două caiete</text>
<line x1="62.0" y1="680.3" x2="838.0" y2="680.3" stroke="#e3dccb"/>
<line x1="217.2" y1="550.2" x2="217.2" y2="680.3" stroke="#e3dccb"/>
<line x1="527.6" y1="550.2" x2="527.6" y2="680.3" stroke="#e3dccb"/>
<text x="62.0" y="709.3" font-size="15" fill="#3a3226" font-weight="700" textLength="66.3" lengthAdjust="spacing">Numărul:</text>
<text x="132.4" y="709.3" font-size="15" fill="#3a3226" textLength="428.2" lengthAdjust="spacing">singular (un singur obiect) și plural (două sau mai multe obiecte).</text>
<text x="62.0" y="734.1" font-size="15" fill="#3a3226" font-weight="700" textLength="82.7" lengthAdjust="spacing">Desinențele</text>
<text x="148.7" y="734.1" font-size="15" fill="#3a3226" textLength="461.4" lengthAdjust="spacing">sunt sunetele de la sfârșitul substantivului care arată genul și numărul:</text>
<text x="614.1" y="734.1" font-size="15" fill="#10233f" font-style="italic" textLength="156.4" lengthAdjust="spacing">maidanez∅ – maidanezi</text>
<text x="770.6" y="734.1" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="777.9" y="734.1" font-size="15" fill="#10233f" font-style="italic" textLength="46.4" lengthAdjust="spacing">cas-ă –</text>
<text x="62.0" y="755.8" font-size="15" fill="#10233f" font-style="italic" textLength="34.0" lengthAdjust="spacing">cas-e</text>
<text x="96.0" y="755.8" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="103.4" y="755.8" font-size="15" fill="#10233f" font-style="italic" textLength="102.5" lengthAdjust="spacing">bloc∅ – bloc-uri</text>
<text x="205.8" y="755.8" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="798.3" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="821.3" font-size="16" font-weight="700" fill="#ffffff">4. ATENȚIE</text>
<rect x="40" y="832.3" width="820" height="118.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="850.3" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="850.3" width="6" height="82.7" rx="3" fill="#b4432c"/><text x="84.0" y="876.8" font-size="14.5" fill="#b4432c" font-weight="700" textLength="54.8" lengthAdjust="spacing">Atenție!</text>
<text x="84.0" y="895.7" font-size="14.5" fill="#3a3226" textLength="273.0" lengthAdjust="spacing">Același cuvânt poate fi substantiv sau verb:</text>
<text x="360.9" y="895.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="75.8" lengthAdjust="spacing">un pahar de</text>
<text x="440.7" y="895.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="20.7" lengthAdjust="spacing">vin</text>
<text x="465.3" y="895.7" font-size="14.5" fill="#3a3226" textLength="83.2" lengthAdjust="spacing">(substantiv) /</text>
<text x="552.5" y="895.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="22.6" lengthAdjust="spacing">Vin</text>
<text x="579.0" y="895.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="38.9" lengthAdjust="spacing">acasă.</text>
<text x="621.8" y="895.7" font-size="14.5" fill="#3a3226" textLength="196.9" lengthAdjust="spacing">(verb). Verific formele de plural</text>
<text x="84.0" y="916.7" font-size="14.5" fill="#3a3226" textLength="11.7" lengthAdjust="spacing">în</text>
<text x="99.7" y="916.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="55.1" lengthAdjust="spacing">DOOM3</text>
<text x="154.8" y="916.7" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<text x="207.2" y="982.5" font-size="11.5" fill="#5b6b83" textLength="485.5" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 94-95, rubricile Repere. Unele exemple sunt create pentru aceste notițe.</text>
</svg>
