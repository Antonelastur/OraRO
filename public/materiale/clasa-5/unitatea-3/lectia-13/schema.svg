<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="575" fill="#faf7f0"/>
<text x="383.5" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="133.0" lengthAdjust="spacing">Prepoziția</text>
<text x="236.9" y="74.4" font-size="14" fill="#5b6b83" textLength="426.2" lengthAdjust="spacing">Clasa a V-a · Unitatea III, Lecția 13 · Manual, p. 99 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE PREPOZIȚIA</text>
<rect x="40" y="128.6" width="820" height="123.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="76.0" lengthAdjust="spacing">Prepoziția</text>
<text x="142.3" y="162.6" font-size="16" fill="#10233f" textLength="188.3" lengthAdjust="spacing">este partea de vorbire care</text>
<text x="335.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="120.5" lengthAdjust="spacing">leagă un atribut</text>
<text x="459.8" y="162.6" font-size="16" fill="#10233f" textLength="192.0" lengthAdjust="spacing">de substantivul determinat.</text>
<text x="62.0" y="196.4" font-size="15" fill="#3a3226" textLength="155.7" lengthAdjust="spacing">Prepoziția se analizează</text>
<text x="221.7" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="67.8" lengthAdjust="spacing">împreună</text>
<text x="293.6" y="196.4" font-size="15" fill="#3a3226" textLength="483.9" lengthAdjust="spacing">cu partea de vorbire pe care o precedă și intră în componența atributului.</text>
<text x="62.0" y="229.9" font-size="15" fill="#10233f" font-style="italic" textLength="31.8" lengthAdjust="spacing">Casa</text>
<text x="97.8" y="229.9" font-size="15" fill="#3a3226" font-weight="700" textLength="90.8" lengthAdjust="spacing">fără acoperiș</text>
<text x="192.6" y="229.9" font-size="15" fill="#10233f" font-style="italic" textLength="96.3" lengthAdjust="spacing">va fi demolată.</text>
<text x="293.0" y="229.9" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="300.3" y="229.9" font-size="15" fill="#10233f" font-style="italic" textLength="31.8" lengthAdjust="spacing">Casa</text>
<text x="336.2" y="229.9" font-size="15" fill="#3a3226" font-weight="700" textLength="143.6" lengthAdjust="spacing">de lângă blocul înalt</text>
<text x="483.8" y="229.9" font-size="15" fill="#10233f" font-style="italic" textLength="92.5" lengthAdjust="spacing">este încrezută.</text>
<rect x="40" y="272.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="295.4" font-size="16" font-weight="700" fill="#ffffff">2. FELURILE PREPOZIȚIILOR</text>
<rect x="40" y="306.4" width="820" height="217.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="324.4" width="380.0" height="106.2" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="352.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="49.3" lengthAdjust="spacing">simple</text>
<text x="78.0" y="370.7" font-size="13.5" fill="#5b6b83" textLength="102.3" lengthAdjust="spacing">un singur termen</text>
<text x="78.0" y="393.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="336.7" lengthAdjust="spacing">cu, de, după, fără, în, între, la, lângă, pe, pentru, peste,</text>
<text x="78.0" y="414.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="31.6" lengthAdjust="spacing">până</text>
<rect x="458.0" y="324.4" width="380.0" height="106.2" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="352.4" font-size="16" fill="#6f5ea8" font-weight="700" textLength="67.5" lengthAdjust="spacing">compuse</text>
<text x="474.0" y="370.7" font-size="13.5" fill="#5b6b83" textLength="152.0" lengthAdjust="spacing">doi sau mai mulți termeni</text>
<text x="474.0" y="393.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="311.8" lengthAdjust="spacing">de la, de lângă, de pe, de peste, de prin, de sub, pe</text>
<text x="474.0" y="414.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="320.0" lengthAdjust="spacing">după, pe la, pe sub, de pe la, de pe lângă, de pe sub</text>
<rect x="62.0" y="444.6" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="471.1" font-size="14.5" fill="#10233f" font-weight="700" textLength="257.5" lengthAdjust="spacing">Compuse scrise într-un singur cuvânt:</text>
<text x="78.0" y="490.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="40.9" lengthAdjust="spacing">despre</text>
<text x="122.8" y="490.0" font-size="14.5" fill="#3a3226" textLength="72.9" lengthAdjust="spacing">(de + spre),</text>
<text x="199.7" y="490.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="45.7" lengthAdjust="spacing">dinspre</text>
<text x="249.2" y="490.0" font-size="14.5" fill="#3a3226" textLength="77.1" lengthAdjust="spacing">(din + spre),</text>
<text x="330.3" y="490.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="37.8" lengthAdjust="spacing">înspre</text>
<text x="372.1" y="490.0" font-size="14.5" fill="#3a3226" textLength="65.4" lengthAdjust="spacing">(în + spre)</text>
<text x="264.9" y="555.8" font-size="11.5" fill="#5b6b83" textLength="370.2" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 98-99, rubrica Repere și exemplele din Explorare.</text>
</svg>
