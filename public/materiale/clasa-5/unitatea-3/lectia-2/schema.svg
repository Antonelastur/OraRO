<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1525" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1525" fill="#faf7f0"/>
<text x="83.0" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="723.6" lengthAdjust="spacing">Textul descriptiv literar. O stradă cu sentimente de Ana</text>
<text x="384.7" y="85.0" font-size="28" fill="#10233f" font-weight="700" textLength="130.5" lengthAdjust="spacing">Blandiana</text>
<text x="216.8" y="109.4" font-size="14" fill="#5b6b83" textLength="466.4" lengthAdjust="spacing">Clasa a V-a · Unitatea III, Lecția 2 · Manual, pp. 80-81 · notițe pentru caiet</text>
<rect x="40" y="129.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="152.6" font-size="16" font-weight="700" fill="#ffffff">1. AUTOAREA ȘI VOLUMUL</text>
<rect x="40" y="163.6" width="820" height="190.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="181.6" width="380.0" height="154.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="209.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="86.3" lengthAdjust="spacing">AUTOAREA</text>
<text x="78.0" y="232.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="98.3" lengthAdjust="spacing">Ana Blandiana</text>
<text x="180.2" y="232.9" font-size="14.5" fill="#3a3226" textLength="232.4" lengthAdjust="spacing">(n. 1942) este un pseudonim, adică</text>
<text x="78.0" y="253.9" font-size="14.5" fill="#3a3226" textLength="314.1" lengthAdjust="spacing">numele de artist pe care și l-a ales Otilia Valeria</text>
<text x="78.0" y="275.0" font-size="14.5" fill="#3a3226" textLength="51.1" lengthAdjust="spacing">Coman.</text>
<text x="78.0" y="298.9" font-size="14.5" fill="#3a3226" textLength="347.8" lengthAdjust="spacing">Este poetă, prozatoare și publicistă. Cărțile ei au fost</text>
<text x="78.0" y="319.9" font-size="14.5" fill="#3a3226" textLength="145.6" lengthAdjust="spacing">traduse în multe limbi.</text>
<rect x="458.0" y="181.6" width="380.0" height="154.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="474.0" y="209.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="77.4" lengthAdjust="spacing">VOLUMUL</text>
<text x="474.0" y="232.9" font-size="14.5" fill="#3a3226" textLength="233.2" lengthAdjust="spacing">Pentru copii, Ana Blandiana a scris:</text>
<text x="711.2" y="232.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="91.3" lengthAdjust="spacing">Întâmplări din</text>
<text x="474.0" y="253.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="84.3" lengthAdjust="spacing">grădina mea</text>
<text x="562.2" y="253.9" font-size="14.5" fill="#3a3226" textLength="45.3" lengthAdjust="spacing">(1987),</text>
<text x="611.4" y="253.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="188.0" lengthAdjust="spacing">Întâmplări de pe strada mea</text>
<text x="474.0" y="275.0" font-size="14.5" fill="#3a3226" textLength="46.0" lengthAdjust="spacing">(1988),</text>
<text x="524.0" y="275.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="166.7" lengthAdjust="spacing">Cartea albă a lui Arpagic</text>
<text x="694.6" y="275.0" font-size="14.5" fill="#3a3226" textLength="46.0" lengthAdjust="spacing">(1998).</text>
<text x="474.0" y="298.9" font-size="14.5" fill="#3a3226" textLength="44.3" lengthAdjust="spacing">Poezia</text>
<text x="522.2" y="298.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="154.7" lengthAdjust="spacing">O stradă cu sentimente</text>
<text x="680.8" y="298.9" font-size="14.5" fill="#3a3226" textLength="116.2" lengthAdjust="spacing">deschide volumul</text>
<text x="474.0" y="319.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="189.9" lengthAdjust="spacing">Întâmplări de pe strada mea</text>
<text x="663.9" y="319.9" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<rect x="40" y="374.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="397.2" font-size="16" font-weight="700" fill="#ffffff">2. FIȘA POEZIEI</text>
<rect x="40" y="408.2" width="820" height="352.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="441.2" font-size="15" fill="#3a3226" font-weight="700" textLength="40.7" lengthAdjust="spacing">Titlul:</text>
<text x="106.8" y="441.2" font-size="15" fill="#10233f" font-style="italic" textLength="160.0" lengthAdjust="spacing">O stradă cu sentimente</text>
<text x="270.8" y="441.2" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">·</text>
<text x="279.1" y="441.2" font-size="15" fill="#3a3226" font-weight="700" textLength="70.1" lengthAdjust="spacing">Autoarea:</text>
<text x="353.3" y="441.2" font-size="15" fill="#3a3226" textLength="106.0" lengthAdjust="spacing">Ana Blandiana ·</text>
<text x="463.4" y="441.2" font-size="15" fill="#3a3226" font-weight="700" textLength="62.8" lengthAdjust="spacing">Volumul:</text>
<text x="530.3" y="441.2" font-size="15" fill="#10233f" font-style="italic" textLength="194.5" lengthAdjust="spacing">Întâmplări de pe strada mea</text>
<rect x="62.0" y="459.8" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="481.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="113.0" lengthAdjust="spacing">Casa sau obiectul</text>
<text x="322.3" y="481.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="133.0" lengthAdjust="spacing">Un detaliu din poezie</text>
<text x="617.2" y="481.2" font-size="13.5" fill="#10233f" font-weight="700" textLength="109.3" lengthAdjust="spacing">Ce face, ce simte</text>
<line x1="62.0" y1="491.3" x2="838.0" y2="491.3" stroke="#e3dccb"/>
<text x="74.0" y="513.8" font-size="14.5" fill="#3a3226" textLength="162.3" lengthAdjust="spacing">casa cu pereții portocalii</text>
<text x="322.3" y="513.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="170.4" lengthAdjust="spacing">flori și perdele cu horbote</text>
<text x="492.8" y="513.8" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="500.7" y="513.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="65.8" lengthAdjust="spacing">glasuri de</text>
<text x="322.3" y="534.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="31.8" lengthAdjust="spacing">copii</text>
<text x="617.2" y="513.8" font-size="14.5" fill="#3a3226" textLength="84.8" lengthAdjust="spacing">…………………</text>
<line x1="62.0" y1="545.2" x2="838.0" y2="545.2" stroke="#e3dccb"/>
<text x="74.0" y="567.7" font-size="14.5" fill="#3a3226" textLength="86.2" lengthAdjust="spacing">gardul de zid</text>
<text x="322.3" y="567.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="105.6" lengthAdjust="spacing">cioburi de sticlă</text>
<text x="617.2" y="567.7" font-size="14.5" fill="#3a3226" textLength="84.8" lengthAdjust="spacing">…………………</text>
<line x1="62.0" y1="578.0" x2="838.0" y2="578.0" stroke="#e3dccb"/>
<text x="74.0" y="600.5" font-size="14.5" fill="#3a3226" textLength="22.5" lengthAdjust="spacing">vila</text>
<text x="322.3" y="600.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="165.3" lengthAdjust="spacing">iederă și obloane închise</text>
<text x="617.2" y="600.5" font-size="14.5" fill="#3a3226" textLength="84.8" lengthAdjust="spacing">…………………</text>
<line x1="62.0" y1="610.9" x2="838.0" y2="610.9" stroke="#e3dccb"/>
<text x="74.0" y="633.4" font-size="14.5" fill="#3a3226" textLength="126.4" lengthAdjust="spacing">căsuța mică și albă</text>
<text x="322.3" y="633.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="264.0" lengthAdjust="spacing">o bătrânică peltică, o pisică și o furnică</text>
<text x="617.2" y="633.4" font-size="14.5" fill="#3a3226" textLength="84.8" lengthAdjust="spacing">…………………</text>
<line x1="62.0" y1="643.7" x2="838.0" y2="643.7" stroke="#e3dccb"/>
<text x="74.0" y="666.2" font-size="14.5" fill="#3a3226" textLength="84.1" lengthAdjust="spacing">casa din colț</text>
<text x="322.3" y="666.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="88.5" lengthAdjust="spacing">etaj și balcon</text>
<text x="410.9" y="666.2" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="418.8" y="666.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="102.5" lengthAdjust="spacing">blocul de beton</text>
<text x="617.2" y="666.2" font-size="14.5" fill="#3a3226" textLength="84.8" lengthAdjust="spacing">…………………</text>
<line x1="62.0" y1="676.6" x2="838.0" y2="676.6" stroke="#e3dccb"/>
<text x="74.0" y="699.1" font-size="14.5" fill="#3a3226" textLength="109.0" lengthAdjust="spacing">cele două clădiri</text>
<text x="322.3" y="699.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="96.3" lengthAdjust="spacing">înalte și subțiri</text>
<text x="418.6" y="699.1" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="426.6" y="699.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="105.8" lengthAdjust="spacing">din oțel și granit</text>
<text x="617.2" y="699.1" font-size="14.5" fill="#3a3226" textLength="84.8" lengthAdjust="spacing">…………………</text>
<line x1="62.0" y1="709.4" x2="838.0" y2="709.4" stroke="#e3dccb"/>
<text x="74.0" y="731.9" font-size="14.5" fill="#3a3226" textLength="153.3" lengthAdjust="spacing">casa cu aleea de zgură</text>
<text x="322.3" y="731.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="217.7" lengthAdjust="spacing">piticul de ghips și cocoșul de fier</text>
<text x="617.2" y="731.9" font-size="14.5" fill="#3a3226" textLength="84.8" lengthAdjust="spacing">…………………</text>
<line x1="62.0" y1="742.3" x2="838.0" y2="742.3" stroke="#e3dccb"/>
<line x1="310.3" y1="459.8" x2="310.3" y2="742.3" stroke="#e3dccb"/>
<line x1="605.2" y1="459.8" x2="605.2" y2="742.3" stroke="#e3dccb"/>
<rect x="40" y="780.3" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="803.3" font-size="16" font-weight="700" fill="#ffffff">3. CUVINTE NOI DIN NOTELE DE SUBSOL</text>
<rect x="40" y="814.3" width="820" height="285.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="832.3" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="853.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">Cuvântul</text>
<text x="268.0" y="853.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="116.4" lengthAdjust="spacing">Sensul din manual</text>
<line x1="62.0" y1="863.8" x2="838.0" y2="863.8" stroke="#e3dccb"/>
<text x="74.0" y="886.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="46.4" lengthAdjust="spacing">țuguiat</text>
<text x="268.0" y="886.3" font-size="14.5" fill="#3a3226" textLength="230.7" lengthAdjust="spacing">ascuțit, prelungit, în formă de țugui</text>
<line x1="62.0" y1="896.7" x2="838.0" y2="896.7" stroke="#e3dccb"/>
<text x="74.0" y="919.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="40.6" lengthAdjust="spacing">dibaci</text>
<text x="268.0" y="919.2" font-size="14.5" fill="#3a3226" textLength="175.1" lengthAdjust="spacing">îndemânatic, abil, priceput</text>
<line x1="62.0" y1="929.5" x2="838.0" y2="929.5" stroke="#e3dccb"/>
<text x="74.0" y="952.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="75.1" lengthAdjust="spacing">impertinent</text>
<text x="268.0" y="952.0" font-size="14.5" fill="#3a3226" textLength="57.6" lengthAdjust="spacing">obraznic</text>
<line x1="62.0" y1="962.4" x2="838.0" y2="962.4" stroke="#e3dccb"/>
<text x="74.0" y="984.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="52.5" lengthAdjust="spacing">horbotă</text>
<text x="130.4" y="984.9" font-size="14.5" fill="#3a3226" textLength="63.4" lengthAdjust="spacing">(regional)</text>
<text x="268.0" y="984.9" font-size="14.5" fill="#3a3226" textLength="48.6" lengthAdjust="spacing">dantelă</text>
<line x1="62.0" y1="995.2" x2="838.0" y2="995.2" stroke="#e3dccb"/>
<text x="74.0" y="1017.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="39.4" lengthAdjust="spacing">perfid</text>
<text x="268.0" y="1017.7" font-size="14.5" fill="#3a3226" textLength="552.9" lengthAdjust="spacing">(despre oameni) care, deși pare binevoitor sau indiferent, ascunde răutate, viclenie;</text>
<text x="268.0" y="1038.8" font-size="14.5" fill="#3a3226" textLength="55.5" lengthAdjust="spacing">prefăcut</text>
<line x1="62.0" y1="1049.1" x2="838.0" y2="1049.1" stroke="#e3dccb"/>
<text x="74.0" y="1071.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="32.6" lengthAdjust="spacing">infim</text>
<text x="268.0" y="1071.6" font-size="14.5" fill="#3a3226" textLength="179.1" lengthAdjust="spacing">extrem de mic; neînsemnat</text>
<line x1="62.0" y1="1081.9" x2="838.0" y2="1081.9" stroke="#e3dccb"/>
<line x1="256.0" y1="832.3" x2="256.0" y2="1082.0" stroke="#e3dccb"/>
<rect x="40" y="1119.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1142.9" font-size="16" font-weight="700" fill="#ffffff">4. ÎNAINTE ȘI DUPĂ PRIMA LECTURĂ</text>
<rect x="40" y="1153.9" width="820" height="303.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1186.9" font-size="15" fill="#3a3226" font-weight="700" textLength="122.5" lengthAdjust="spacing">Înainte de lectură</text>
<text x="188.6" y="1186.9" font-size="15" fill="#3a3226" textLength="625.2" lengthAdjust="spacing">(ex. 1): notez o culoare și o emoție pe care le asociez cu strada mea, apoi schimb caietul cu</text>
<text x="62.0" y="1208.7" font-size="15" fill="#3a3226" textLength="741.1" lengthAdjust="spacing">colegul sau cu colega de bancă, ca să ne comparăm răspunsurile. Apoi ascult poezia în lectura profesorului.</text>
<rect x="62.0" y="1227.2" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="1255.2" font-size="16" fill="#0d9c92" font-weight="700" textLength="156.6" lengthAdjust="spacing">culoarea străzii mele</text>
<text x="78.0" y="1278.5" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<rect x="458.0" y="1227.2" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="1255.2" font-size="16" fill="#6f5ea8" font-weight="700" textLength="87.8" lengthAdjust="spacing">emoția mea</text>
<text x="474.0" y="1278.5" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<rect x="62.0" y="1308.8" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1330.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="173.8" lengthAdjust="spacing">Impresii după prima lectură</text>
<text x="462.0" y="1330.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="97.8" lengthAdjust="spacing">Răspunsul meu</text>
<line x1="62.0" y1="1340.4" x2="838.0" y2="1340.4" stroke="#e3dccb"/>
<text x="74.0" y="1362.9" font-size="14.5" fill="#3a3226" textLength="310.8" lengthAdjust="spacing">Ce mi-a atras atenția în poezia Anei Blandiana?</text>
<text x="462.0" y="1362.9" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="1373.2" x2="838.0" y2="1373.2" stroke="#e3dccb"/>
<text x="74.0" y="1395.8" font-size="14.5" fill="#3a3226" textLength="294.9" lengthAdjust="spacing">La ce m-am gândit citind sau auzind poezia?</text>
<text x="462.0" y="1395.8" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="1406.1" x2="838.0" y2="1406.1" stroke="#e3dccb"/>
<text x="74.0" y="1428.6" font-size="14.5" fill="#3a3226" textLength="335.9" lengthAdjust="spacing">O întrebare pe care aș vrea să i-o adresez autoarei</text>
<text x="462.0" y="1428.6" font-size="14.5" fill="#3a3226" textLength="133.3" lengthAdjust="spacing">……………………………</text>
<line x1="62.0" y1="1438.9" x2="838.0" y2="1438.9" stroke="#e3dccb"/>
<line x1="450.0" y1="1308.8" x2="450.0" y2="1438.9" stroke="#e3dccb"/>
<text x="53.0" y="1488.4" font-size="11.5" fill="#5b6b83" textLength="794.1" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 80-81 (caseta autoarei, textul poeziei, notele de subsol, „Pentru început” ex. 1 și 3, „Impresii după prima lectură”). Lecția nu are</text>
<text x="181.2" y="1505.1" font-size="11.5" fill="#5b6b83" textLength="537.6" lengthAdjust="spacing">rubrica Repere, deci notițele nu conțin definiții. Tabelele de completat sunt create pentru aceste notițe.</text>
</svg>
