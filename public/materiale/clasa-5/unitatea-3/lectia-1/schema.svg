<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 837" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="837" fill="#faf7f0"/>
<text x="176.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="548.2" lengthAdjust="spacing">Proiect de grup. În așteptarea Crăciunului</text>
<text x="240.7" y="74.4" font-size="14" fill="#5b6b83" textLength="418.6" lengthAdjust="spacing">Clasa a V-a · Unitatea III, Lecția 1 · Manual, p. 91 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. SARCINA</text>
<rect x="40" y="128.6" width="820" height="158.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" textLength="81.8" lengthAdjust="spacing">În grupe de</text>
<text x="148.1" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="64.3" lengthAdjust="spacing">4-5 elevi</text>
<text x="212.4" y="162.6" font-size="16" fill="#10233f" textLength="332.9" lengthAdjust="spacing">, pregătim înainte de vacanță un proiect despre</text>
<text x="549.7" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="56.6" lengthAdjust="spacing">Crăciun</text>
<text x="606.3" y="162.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<text x="62.0" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="102.1" lengthAdjust="spacing">Teme posibile:</text>
<text x="168.2" y="196.4" font-size="15" fill="#3a3226" textLength="622.9" lengthAdjust="spacing">o scenetă despre nașterea lui Isus; colindele preferate; sărbătorirea Crăciunului în lume; o carte</text>
<text x="62.0" y="218.1" font-size="15" fill="#3a3226" textLength="737.1" lengthAdjust="spacing">despre Crăciun; povestea lui Moș Crăciun; tradițiile de iarnă din comunitatea noastră; decorațiuni pentru brad; o</text>
<text x="62.0" y="239.9" font-size="15" fill="#3a3226" textLength="184.5" lengthAdjust="spacing">scrisoare către Moș Crăciun.</text>
<text x="62.0" y="264.6" font-size="15" fill="#3a3226" font-weight="700" textLength="40.2" lengthAdjust="spacing">Timp:</text>
<text x="106.2" y="264.6" font-size="15" fill="#3a3226" textLength="109.5" lengthAdjust="spacing">două săptămâni.</text>
<text x="219.8" y="264.6" font-size="15" fill="#3a3226" font-weight="700" textLength="87.9" lengthAdjust="spacing">Prezentarea:</text>
<text x="311.8" y="264.6" font-size="15" fill="#3a3226" textLength="366.3" lengthAdjust="spacing">3-5 minute, în ultima oră de română dinaintea vacanței.</text>
<rect x="40" y="307.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="330.1" font-size="16" font-weight="700" fill="#ffffff">2. PAȘII</text>
<rect x="40" y="341.1" width="820" height="154.3" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="359.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="380.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="71.0" lengthAdjust="spacing">Săptămâna</text>
<text x="229.2" y="380.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="58.0" lengthAdjust="spacing">Ce facem</text>
<line x1="62.0" y1="390.7" x2="838.0" y2="390.7" stroke="#e3dccb"/>
<text x="74.0" y="413.2" font-size="14.5" fill="#3a3226" textLength="3.9" lengthAdjust="spacing">I</text>
<text x="229.2" y="413.2" font-size="14.5" fill="#3a3226" textLength="210.7" lengthAdjust="spacing">Alegem tema și ne documentăm.</text>
<line x1="62.0" y1="423.6" x2="838.0" y2="423.6" stroke="#e3dccb"/>
<text x="74.0" y="446.0" font-size="14.5" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">II</text>
<text x="229.2" y="446.0" font-size="14.5" fill="#3a3226" textLength="588.9" lengthAdjust="spacing">Alegem produsul (scenetă, colinde, poster, PowerPoint, decorațiuni, prezentarea unei cărți, o</text>
<text x="229.2" y="467.1" font-size="14.5" fill="#3a3226" textLength="448.6" lengthAdjust="spacing">rețetă), ne împărțim sarcinile și repetăm prezentarea, cu toată recuzita.</text>
<line x1="62.0" y1="477.4" x2="838.0" y2="477.4" stroke="#e3dccb"/>
<line x1="217.2" y1="359.1" x2="217.2" y2="477.4" stroke="#e3dccb"/>
<rect x="40" y="515.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="538.4" font-size="16" font-weight="700" fill="#ffffff">3. DOCUMENTAREA</text>
<rect x="40" y="549.4" width="820" height="105.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="582.4" font-size="15" fill="#3a3226" font-weight="700">1.</text>
<text x="81.0" y="582.4" font-size="15" fill="#3a3226" textLength="251.5" lengthAdjust="spacing">Stabilim sursele: cărți, reviste, internet.</text>
<text x="62.0" y="607.2" font-size="15" fill="#3a3226" font-weight="700">2.</text>
<text x="81.0" y="607.2" font-size="15" fill="#3a3226" textLength="293.6" lengthAdjust="spacing">Fiecare consultă cel puțin o sursă, ia notițe și</text>
<text x="378.6" y="607.2" font-size="15" fill="#3a3226" font-weight="700" textLength="96.3" lengthAdjust="spacing">notează sursa</text>
<text x="474.9" y="607.2" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="631.9" font-size="15" fill="#3a3226" font-weight="700">3.</text>
<text x="81.0" y="631.9" font-size="15" fill="#3a3226" textLength="475.3" lengthAdjust="spacing">Prezentăm în grupă ce am aflat și alegem informațiile pe care le folosim.</text>
<rect x="40" y="674.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="697.4" font-size="16" font-weight="700" fill="#ffffff">4. CUM MĂ AUTOEVALUEZ</text>
<rect x="40" y="708.4" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="741.4" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="741.4" font-size="15" fill="#3a3226" textLength="713.2" lengthAdjust="spacing">am folosit sursele de informare · • m-am raportat la temă · • am colaborat în echipă și mi-am asumat rolul · •</text>
<text x="74.2" y="763.2" font-size="15" fill="#3a3226" textLength="363.9" lengthAdjust="spacing">produsul e de calitate · • prezentarea e clară și atractivă</text>
<text x="251.5" y="817.2" font-size="11.5" fill="#5b6b83" textLength="397.1" lengthAdjust="spacing">Sursa: Manual Art 5, p. 91 (sarcina, pașii, sugestiile și criteriile de autoevaluare).</text>
</svg>
