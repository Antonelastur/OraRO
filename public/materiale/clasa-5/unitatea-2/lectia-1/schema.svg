<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1688" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1688" fill="#faf7f0"/>
<text x="245.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="404.3" lengthAdjust="spacing">Textul narativ literar. „Vizită…”</text>
<text x="218.2" y="74.4" font-size="14" fill="#5b6b83" textLength="463.7" lengthAdjust="spacing">Clasa a V-a · Unitatea II, Lecția 1 · Manual, pp. 42-44 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. AUTORUL ȘI SCHIȚA</text>
<rect x="40" y="128.6" width="820" height="259.5" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="380.0" height="223.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="174.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="74.6" lengthAdjust="spacing">AUTORUL</text>
<text x="78.0" y="197.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="89.2" lengthAdjust="spacing">I.L. Caragiale</text>
<text x="171.2" y="197.9" font-size="14.5" fill="#3a3226" textLength="76.8" lengthAdjust="spacing">(1852-1912)</text>
<text x="78.0" y="221.8" font-size="14.5" fill="#3a3226" textLength="343.3" lengthAdjust="spacing">Este unul dintre cei mai importanți scriitori români; a</text>
<text x="78.0" y="242.8" font-size="14.5" fill="#3a3226" textLength="333.8" lengthAdjust="spacing">fost contemporan cu Mihai Eminescu, Ion Creangă</text>
<text x="78.0" y="263.9" font-size="14.5" fill="#3a3226" textLength="93.9" lengthAdjust="spacing">și Ioan Slavici.</text>
<text x="78.0" y="287.8" font-size="14.5" fill="#3a3226" textLength="262.8" lengthAdjust="spacing">A scris piese de teatru, nuvele și schițe.</text>
<text x="78.0" y="311.7" font-size="14.5" fill="#3a3226" textLength="347.0" lengthAdjust="spacing">Teatrul Național din București, al cărui director a fost</text>
<text x="78.0" y="332.7" font-size="14.5" fill="#3a3226" textLength="309.5" lengthAdjust="spacing">pentru o scurtă perioadă (1888-1889), îi poartă</text>
<text x="78.0" y="353.8" font-size="14.5" fill="#3a3226" textLength="52.6" lengthAdjust="spacing">numele.</text>
<rect x="458.0" y="146.6" width="380.0" height="223.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="474.0" y="174.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="58.0" lengthAdjust="spacing">SCHIȚA</text>
<text x="474.0" y="197.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="49.6" lengthAdjust="spacing">Vizită…</text>
<text x="527.5" y="197.9" font-size="14.5" fill="#3a3226" textLength="199.2" lengthAdjust="spacing">este o schiță de I.L. Caragiale.</text>
<text x="474.0" y="221.8" font-size="14.5" fill="#3a3226" textLength="347.0" lengthAdjust="spacing">Textele preferate ale copiilor sunt schițele, între care</text>
<text x="474.0" y="242.8" font-size="14.5" fill="#3a3226" textLength="84.1" lengthAdjust="spacing">se numără și</text>
<text x="562.1" y="242.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="49.6" lengthAdjust="spacing">Vizită…</text>
<text x="611.7" y="242.8" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<rect x="40" y="408.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="431.1" font-size="16" font-weight="700" fill="#ffffff">2. FIȘA TEXTULUI</text>
<rect x="40" y="442.1" width="820" height="414.5" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="460.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="481.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.8" lengthAdjust="spacing">Întrebarea</text>
<text x="283.5" y="481.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="109.0" lengthAdjust="spacing">Ce găsesc în text</text>
<line x1="62.0" y1="491.7" x2="838.0" y2="491.7" stroke="#e3dccb"/>
<text x="74.0" y="514.2" font-size="14.5" fill="#3a3226" textLength="113.8" lengthAdjust="spacing">Cine povestește?</text>
<text x="283.5" y="514.2" font-size="14.5" fill="#3a3226" textLength="18.7" lengthAdjust="spacing">Un</text>
<text x="306.2" y="514.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="52.7" lengthAdjust="spacing">musafir</text>
<text x="358.9" y="514.2" font-size="14.5" fill="#3a3226" textLength="304.4" lengthAdjust="spacing">, care nu este numit. Povestește la persoana I:</text>
<text x="667.3" y="514.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="141.4" lengthAdjust="spacing">„M-am dus de Sf. Ion</text>
<text x="283.5" y="535.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="99.8" lengthAdjust="spacing">să fac o vizită”</text>
<text x="387.3" y="535.2" font-size="14.5" fill="#3a3226" textLength="48.4" lengthAdjust="spacing">(p. 42).</text>
<line x1="62.0" y1="545.5" x2="838.0" y2="545.5" stroke="#e3dccb"/>
<text x="74.0" y="568.0" font-size="14.5" fill="#3a3226" textLength="140.4" lengthAdjust="spacing">Care e ocazia vizitei?</text>
<text x="283.5" y="568.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="82.4" lengthAdjust="spacing">Onomastica</text>
<text x="369.8" y="568.0" font-size="14.5" fill="#3a3226" textLength="116.8" lengthAdjust="spacing">lui Ionel Popescu,</text>
<text x="490.6" y="568.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="302.1" lengthAdjust="spacing">„un copilaș foarte drăguț de vreo opt anișori”</text>
<text x="796.6" y="568.0" font-size="14.5" fill="#3a3226" textLength="17.7" lengthAdjust="spacing">(p.</text>
<text x="283.5" y="589.1" font-size="14.5" fill="#3a3226" textLength="26.8" lengthAdjust="spacing">42).</text>
<line x1="62.0" y1="599.4" x2="838.0" y2="599.4" stroke="#e3dccb"/>
<text x="74.0" y="621.9" font-size="14.5" fill="#3a3226" textLength="118.6" lengthAdjust="spacing">Pe cine vizitează?</text>
<text x="283.5" y="621.9" font-size="14.5" fill="#3a3226" textLength="74.4" lengthAdjust="spacing">Pe doamna</text>
<text x="361.9" y="621.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="101.9" lengthAdjust="spacing">Maria Popescu</text>
<text x="463.8" y="621.9" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="471.8" y="621.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="124.5" lengthAdjust="spacing">„o veche prietenă”</text>
<text x="596.3" y="621.9" font-size="14.5" fill="#3a3226" textLength="85.0" lengthAdjust="spacing">, numită apoi</text>
<text x="685.2" y="621.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="112.0" lengthAdjust="spacing">madam Popescu</text>
<text x="801.2" y="621.9" font-size="14.5" fill="#3a3226" textLength="17.7" lengthAdjust="spacing">(p.</text>
<text x="283.5" y="642.9" font-size="14.5" fill="#3a3226" textLength="26.8" lengthAdjust="spacing">42).</text>
<line x1="62.0" y1="653.3" x2="838.0" y2="653.3" stroke="#e3dccb"/>
<text x="74.0" y="675.8" font-size="14.5" fill="#3a3226" textLength="115.7" lengthAdjust="spacing">Ce cadou aduce?</text>
<text x="283.5" y="675.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="339.9" lengthAdjust="spacing">„o minge foarte mare de cauciuc și foarte elastică”</text>
<text x="627.4" y="675.8" font-size="14.5" fill="#3a3226" textLength="48.4" lengthAdjust="spacing">(p. 42).</text>
<line x1="62.0" y1="686.1" x2="838.0" y2="686.1" stroke="#e3dccb"/>
<text x="74.0" y="708.6" font-size="14.5" fill="#3a3226" textLength="148.0" lengthAdjust="spacing">Cum e îmbrăcat Ionel?</text>
<text x="283.5" y="708.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="317.5" lengthAdjust="spacing">„ca maior de roșiori în uniformă de mare ținută”</text>
<text x="604.9" y="708.6" font-size="14.5" fill="#3a3226" textLength="48.4" lengthAdjust="spacing">(p. 42).</text>
<line x1="62.0" y1="719.0" x2="838.0" y2="719.0" stroke="#e3dccb"/>
<text x="74.0" y="741.5" font-size="14.5" fill="#3a3226" textLength="116.9" lengthAdjust="spacing">Unde se petrece?</text>
<text x="283.5" y="741.5" font-size="14.5" fill="#3a3226" textLength="12.0" lengthAdjust="spacing">În</text>
<text x="299.5" y="741.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="37.1" lengthAdjust="spacing">salon</text>
<text x="340.6" y="741.5" font-size="14.5" fill="#3a3226" textLength="303.3" lengthAdjust="spacing">(p. 43). Spre sfârșit, Ionel iese cu cheseaua în</text>
<text x="647.8" y="741.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="54.7" lengthAdjust="spacing">vestibul</text>
<text x="706.4" y="741.5" font-size="14.5" fill="#3a3226" textLength="49.0" lengthAdjust="spacing">(p. 44).</text>
<line x1="62.0" y1="751.9" x2="838.0" y2="751.9" stroke="#e3dccb"/>
<text x="74.0" y="774.4" font-size="14.5" fill="#3a3226" textLength="116.4" lengthAdjust="spacing">Când se petrece?</text>
<text x="283.5" y="774.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="75.7" lengthAdjust="spacing">„de Sf. Ion”</text>
<text x="363.1" y="774.4" font-size="14.5" fill="#3a3226" textLength="98.6" lengthAdjust="spacing">(p. 42); afară e</text>
<text x="465.6" y="774.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="138.6" lengthAdjust="spacing">„gerul așa de aspru”</text>
<text x="608.2" y="774.4" font-size="14.5" fill="#3a3226" textLength="48.6" lengthAdjust="spacing">(p. 43).</text>
<line x1="62.0" y1="784.7" x2="838.0" y2="784.7" stroke="#e3dccb"/>
<text x="74.0" y="807.2" font-size="14.5" fill="#3a3226" textLength="109.2" lengthAdjust="spacing">Cum se încheie?</text>
<text x="283.5" y="807.2" font-size="14.5" fill="#3a3226" textLength="540.8" lengthAdjust="spacing">Musafirul pleacă. Ajuns acasă, înțelege de ce Ionel ieșise cu cheseaua în vestibul.</text>
<text x="283.5" y="828.2" font-size="14.5" fill="#3a3226" textLength="231.0" lengthAdjust="spacing">Răspunsul e în ultima frază (p. 44).</text>
<line x1="62.0" y1="838.6" x2="838.0" y2="838.6" stroke="#e3dccb"/>
<line x1="271.5" y1="460.1" x2="271.5" y2="838.6" stroke="#e3dccb"/>
<rect x="40" y="876.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="899.6" font-size="16" font-weight="700" fill="#ffffff">3. CUVINTE NOI DIN NOTELE DE SUBSOL</text>
<rect x="40" y="910.6" width="820" height="471.0" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="928.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="950.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">Cuvântul</text>
<text x="337.8" y="950.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="135.0" lengthAdjust="spacing">Explicația din manual</text>
<line x1="62.0" y1="960.1" x2="838.0" y2="960.1" stroke="#e3dccb"/>
<text x="74.0" y="982.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="78.2" lengthAdjust="spacing">onomastică</text>
<text x="156.1" y="982.6" font-size="14.5" fill="#3a3226" textLength="76.2" lengthAdjust="spacing">(s. f.), p. 42</text>
<text x="337.8" y="982.6" font-size="14.5" fill="#3a3226" textLength="334.8" lengthAdjust="spacing">zi în care cineva își serbează numele; ziua numelui</text>
<line x1="62.0" y1="993.0" x2="838.0" y2="993.0" stroke="#e3dccb"/>
<text x="74.0" y="1015.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="38.0" lengthAdjust="spacing">roșior</text>
<text x="115.9" y="1015.5" font-size="14.5" fill="#3a3226" textLength="84.1" lengthAdjust="spacing">(s. m.), p. 42</text>
<text x="337.8" y="1015.5" font-size="14.5" fill="#3a3226" textLength="247.0" lengthAdjust="spacing">soldat călăreț, îmbrăcat în haină roșie</text>
<line x1="62.0" y1="1025.8" x2="838.0" y2="1025.8" stroke="#e3dccb"/>
<text x="74.0" y="1048.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="72.0" lengthAdjust="spacing">formalitate</text>
<text x="150.0" y="1048.3" font-size="14.5" fill="#3a3226" textLength="76.2" lengthAdjust="spacing">(s. f.), p. 42</text>
<text x="337.8" y="1048.3" font-size="14.5" fill="#3a3226" textLength="292.9" lengthAdjust="spacing">în text, cerință impusă de regulile de politețe</text>
<line x1="62.0" y1="1058.7" x2="838.0" y2="1058.7" stroke="#e3dccb"/>
<text x="74.0" y="1081.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="68.3" lengthAdjust="spacing">de rigoare</text>
<text x="146.2" y="1081.2" font-size="14.5" fill="#3a3226" textLength="84.8" lengthAdjust="spacing">(expr.), p. 42</text>
<text x="337.8" y="1081.2" font-size="14.5" fill="#3a3226" textLength="401.7" lengthAdjust="spacing">care este cerut de o anumită împrejurare, potrivit împrejurării</text>
<line x1="62.0" y1="1091.5" x2="838.0" y2="1091.5" stroke="#e3dccb"/>
<text x="74.0" y="1114.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="46.4" lengthAdjust="spacing">marțial</text>
<text x="124.3" y="1114.0" font-size="14.5" fill="#3a3226" textLength="76.4" lengthAdjust="spacing">(adj.), p. 43</text>
<text x="337.8" y="1114.0" font-size="14.5" fill="#3a3226" textLength="106.5" lengthAdjust="spacing">cu aer războinic</text>
<line x1="62.0" y1="1124.4" x2="838.0" y2="1124.4" stroke="#e3dccb"/>
<text x="74.0" y="1146.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="89.5" lengthAdjust="spacing">a se reculege</text>
<text x="167.5" y="1146.9" font-size="14.5" fill="#3a3226" textLength="73.1" lengthAdjust="spacing">(vb.), p. 43</text>
<text x="337.8" y="1146.9" font-size="14.5" fill="#3a3226" textLength="350.4" lengthAdjust="spacing">în text, a-și veni în fire după o spaimă, după o emoție</text>
<line x1="62.0" y1="1157.2" x2="838.0" y2="1157.2" stroke="#e3dccb"/>
<text x="74.0" y="1179.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="75.3" lengthAdjust="spacing">neutralitate</text>
<text x="153.3" y="1179.7" font-size="14.5" fill="#3a3226" textLength="76.3" lengthAdjust="spacing">(s. f.), p. 43</text>
<text x="337.8" y="1179.7" font-size="14.5" fill="#3a3226" textLength="445.0" lengthAdjust="spacing">atitudine pasivă; în text, neamestecul unei persoane într-un conflict</text>
<line x1="62.0" y1="1190.1" x2="838.0" y2="1190.1" stroke="#e3dccb"/>
<text x="74.0" y="1212.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="48.4" lengthAdjust="spacing">chesea</text>
<text x="126.4" y="1212.6" font-size="14.5" fill="#3a3226" textLength="97.7" lengthAdjust="spacing">(forma literară:</text>
<text x="228.0" y="1212.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="43.8" lengthAdjust="spacing">chisea</text>
<text x="271.8" y="1212.6" font-size="14.5" fill="#3a3226" textLength="25.6" lengthAdjust="spacing">) (s.</text>
<text x="74.0" y="1233.6" font-size="14.5" fill="#3a3226" textLength="56.2" lengthAdjust="spacing">f.), p. 44</text>
<text x="337.8" y="1212.6" font-size="14.5" fill="#3a3226" textLength="438.0" lengthAdjust="spacing">vas mic din sticlă, din cristal sau din porțelan, în care se păstrează</text>
<text x="337.8" y="1233.6" font-size="14.5" fill="#3a3226" textLength="57.0" lengthAdjust="spacing">dulceața</text>
<line x1="62.0" y1="1244.0" x2="838.0" y2="1244.0" stroke="#e3dccb"/>
<text x="74.0" y="1266.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="51.4" lengthAdjust="spacing">vestibul</text>
<text x="129.3" y="1266.5" font-size="14.5" fill="#3a3226" textLength="80.6" lengthAdjust="spacing">(s. n.), p. 44</text>
<text x="337.8" y="1266.5" font-size="14.5" fill="#3a3226" textLength="415.5" lengthAdjust="spacing">prima încăpere a unei locuințe, în care se intră venind din afară</text>
<line x1="62.0" y1="1276.8" x2="838.0" y2="1276.8" stroke="#e3dccb"/>
<text x="74.0" y="1299.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="46.3" lengthAdjust="spacing">mondir</text>
<text x="124.2" y="1299.3" font-size="14.5" fill="#3a3226" textLength="97.7" lengthAdjust="spacing">(forma literară:</text>
<text x="225.8" y="1299.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="46.2" lengthAdjust="spacing">mundir</text>
<text x="272.0" y="1299.3" font-size="14.5" fill="#3a3226" textLength="25.6" lengthAdjust="spacing">) (s.</text>
<text x="74.0" y="1320.3" font-size="14.5" fill="#3a3226" textLength="60.1" lengthAdjust="spacing">n.), p. 44</text>
<text x="337.8" y="1299.3" font-size="14.5" fill="#3a3226" textLength="186.5" lengthAdjust="spacing">haina de la uniforma militară</text>
<line x1="62.0" y1="1330.7" x2="838.0" y2="1330.7" stroke="#e3dccb"/>
<text x="74.0" y="1353.2" font-size="14.5" fill="#3a3226" textLength="238.7" lengthAdjust="spacing">un cuvânt necunoscut, ales de mine</text>
<text x="337.8" y="1353.2" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<line x1="62.0" y1="1363.5" x2="838.0" y2="1363.5" stroke="#e3dccb"/>
<line x1="325.8" y1="928.6" x2="325.8" y2="1363.5" stroke="#e3dccb"/>
<rect x="40" y="1401.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1424.5" font-size="16" font-weight="700" fill="#ffffff">4. IMPRESII DUPĂ PRIMA LECTURĂ</text>
<rect x="40" y="1435.5" width="820" height="185.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1468.5" font-size="15" fill="#3a3226" textLength="245.4" lengthAdjust="spacing">Ce mi-a atras atenția cel mai mult în</text>
<text x="311.5" y="1468.5" font-size="15" fill="#10233f" font-style="italic" textLength="51.3" lengthAdjust="spacing">Vizită…</text>
<text x="362.8" y="1468.5" font-size="15" fill="#3a3226" textLength="235.7" lengthAdjust="spacing">? Notez în caiet răspunsurile mele.</text>
<rect x="62.0" y="1487.0" width="380.0" height="115.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="1515.0" font-size="16" fill="#0d9c92" font-weight="700" textLength="142.1" lengthAdjust="spacing">Ce m-a amuzat ... .</text>
<text x="78.0" y="1538.3" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
<text x="78.0" y="1562.2" font-size="14.5" fill="#3a3226" textLength="206.0" lengthAdjust="spacing">……………………………………………</text>
