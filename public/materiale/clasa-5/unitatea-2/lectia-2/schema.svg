<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Timp, spațiu și acțiune</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 2 · Vizită... de I.L. Caragiale</text>
  <g>
    <rect x="60" y="100" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="180" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Timpul</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle"><tspan x="180" y="154">Momentul în care</tspan><tspan x="180" y="170">se petrece vizita.</tspan></text>
  </g>
  <g>
    <rect x="330" y="100" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Spațiul</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle"><tspan x="450" y="154">Locul unde stau</tspan><tspan x="450" y="170">gazdele și musafirii.</tspan></text>
  </g>
  <g>
    <rect x="600" y="100" width="240" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="720" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Acțiunea</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle"><tspan x="720" y="154">Succesiunea de</tspan><tspan x="720" y="170">întâmplări din vizită.</tspan></text>
  </g>
  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 2, p. 45</text>
</svg>
