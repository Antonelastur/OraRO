<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1141" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1141" fill="#faf7f0"/>
<text x="203.5" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="494.4" lengthAdjust="spacing">Timp, spațiu și acțiune. Textul narativ</text>
<text x="228.1" y="74.4" font-size="14" fill="#5b6b83" textLength="443.8" lengthAdjust="spacing">Clasa a V-a · Unitatea II, Lecția 2 · Manual, pp. 45-46 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. ACȚIUNEA</text>
<rect x="40" y="128.6" width="820" height="135.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="66.4" lengthAdjust="spacing">Acțiunea</text>
<text x="132.7" y="162.6" font-size="16" fill="#10233f" textLength="694.2" lengthAdjust="spacing">dintr-un text narativ constă în evenimentele despre care se povestește și care se desfășoară într-un</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="49.4" lengthAdjust="spacing">anumit</text>
<text x="115.8" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="35.4" lengthAdjust="spacing">timp</text>
<text x="155.4" y="185.8" font-size="16" fill="#10233f" textLength="10.6" lengthAdjust="spacing">și</text>
<text x="170.3" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="46.1" lengthAdjust="spacing">spațiu</text>
<text x="216.4" y="185.8" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<text x="62.0" y="219.6" font-size="15" fill="#3a3226" textLength="242.8" lengthAdjust="spacing">Coordonatele de timp și spațiu pot fi</text>
<text x="308.9" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="50.2" lengthAdjust="spacing">numite</text>
<text x="363.2" y="219.6" font-size="15" fill="#3a3226" textLength="106.8" lengthAdjust="spacing">în text sau pot fi</text>
<text x="474.0" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="50.5" lengthAdjust="spacing">deduse</text>
<text x="528.6" y="219.6" font-size="15" fill="#3a3226" textLength="290.2" lengthAdjust="spacing">de cititor, din informațiile textului sau din ce</text>
<text x="62.0" y="241.3" font-size="15" fill="#3a3226" textLength="179.8" lengthAdjust="spacing">știe despre o epocă, un loc.</text>
<rect x="40" y="283.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="306.9" font-size="16" font-weight="700" fill="#ffffff">2. INDICII DE TIMP ȘI DE SPAȚIU</text>
<rect x="40" y="317.9" width="820" height="148.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="335.9" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="363.9" font-size="16" fill="#0d9c92" font-weight="700" textLength="108.2" lengthAdjust="spacing">indicii de timp</text>
<text x="78.0" y="387.2" font-size="14.5" fill="#3a3226" textLength="49.2" lengthAdjust="spacing">trimit la</text>
<text x="131.1" y="387.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="223.4" lengthAdjust="spacing">epoca, anul, ziua, momentul zilei</text>
<text x="358.4" y="387.2" font-size="14.5" fill="#3a3226" textLength="59.9" lengthAdjust="spacing">în care se</text>
<text x="78.0" y="408.2" font-size="14.5" fill="#3a3226" textLength="141.5" lengthAdjust="spacing">petrece acțiunea ori la</text>
<text x="223.4" y="408.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="45.0" lengthAdjust="spacing">durata</text>
<text x="272.3" y="408.2" font-size="14.5" fill="#3a3226" textLength="11.0" lengthAdjust="spacing">ei</text>
<text x="78.0" y="432.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="156.6" lengthAdjust="spacing">ziua onomasticii lui Ionel</text>
<rect x="458.0" y="335.9" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="363.9" font-size="16" fill="#6f5ea8" font-weight="700" textLength="118.9" lengthAdjust="spacing">indicii de spațiu</text>
<text x="474.0" y="387.2" font-size="14.5" fill="#3a3226" textLength="49.2" lengthAdjust="spacing">trimit la</text>
<text x="527.1" y="387.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="275.9" lengthAdjust="spacing">continentul, țara, regiunea, orașul, satul,</text>
<text x="474.0" y="408.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="79.5" lengthAdjust="spacing">strada, casa</text>
<text x="557.4" y="408.2" font-size="14.5" fill="#3a3226" textLength="169.5" lengthAdjust="spacing">în care se petrece acțiunea</text>
<text x="474.0" y="432.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="226.3" lengthAdjust="spacing">salonul doamnei Popescu, vestibulul</text>
<rect x="40" y="486.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="509.5" font-size="16" font-weight="700" fill="#ffffff">3. TEXTUL NARATIV</text>
<rect x="40" y="520.5" width="820" height="210.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="554.5" font-size="16" fill="#10233f" font-weight="700" textLength="104.6" lengthAdjust="spacing">Textul narativ</text>
<text x="170.9" y="554.5" font-size="16" fill="#10233f" textLength="529.1" lengthAdjust="spacing">prezintă o succesiune de întâmplări petrecute în ordine logică și temporală.</text>
<rect x="62.0" y="573.2" width="248.0" height="106.2" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="601.2" font-size="16" fill="#0d9c92" font-weight="700" textLength="113.1" lengthAdjust="spacing">Situația inițială</text>
<text x="78.0" y="619.5" font-size="13.5" fill="#5b6b83" textLength="55.4" lengthAdjust="spacing">începutul</text>
<text x="78.0" y="642.1" font-size="14.5" fill="#3a3226" textLength="63.5" lengthAdjust="spacing">o stare de</text>
<text x="145.4" y="642.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="59.3" lengthAdjust="spacing">echilibru</text>
<rect x="326.0" y="573.2" width="248.0" height="106.2" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="601.2" font-size="16" fill="#6f5ea8" font-weight="700" textLength="196.3" lengthAdjust="spacing">Succesiunea de întâmplări</text>
<text x="342.0" y="619.5" font-size="13.5" fill="#5b6b83" textLength="46.4" lengthAdjust="spacing">mijlocul</text>
<text x="342.0" y="642.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="165.7" lengthAdjust="spacing">complicație → acțiune →</text>
<text x="342.0" y="663.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="62.8" lengthAdjust="spacing">rezolvare</text>
<rect x="590.0" y="573.2" width="248.0" height="106.2" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="606.0" y="601.2" font-size="16" fill="#9a7433" font-weight="700" textLength="104.0" lengthAdjust="spacing">Situația finală</text>
<text x="606.0" y="619.5" font-size="13.5" fill="#5b6b83" textLength="60.7" lengthAdjust="spacing">încheierea</text>
<text x="606.0" y="642.1" font-size="14.5" fill="#3a3226" textLength="16.5" lengthAdjust="spacing">un</text>
<text x="626.4" y="642.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="89.9" lengthAdjust="spacing">nou echilibru</text>
<text x="62.0" y="708.5" font-size="15" fill="#3a3226" font-weight="700" textLength="144.7" lengthAdjust="spacing">Textul narativ literar</text>
<text x="210.8" y="708.5" font-size="15" fill="#3a3226" textLength="124.3" lengthAdjust="spacing">prezintă întâmplări</text>
<text x="339.2" y="708.5" font-size="15" fill="#3a3226" font-weight="700" textLength="71.0" lengthAdjust="spacing">imaginare</text>
<text x="410.1" y="708.5" font-size="15" fill="#3a3226" textLength="111.8" lengthAdjust="spacing">, la care participă</text>
<text x="525.9" y="708.5" font-size="15" fill="#3a3226" font-weight="700" textLength="68.7" lengthAdjust="spacing">personaje</text>
<text x="594.6" y="708.5" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="751.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="774.0" font-size="16" font-weight="700" fill="#ffffff">4. SECVENȚELE, PE LARG</text>
<rect x="40" y="785.0" width="820" height="304.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="803.0" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="824.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="56.7" lengthAdjust="spacing">Secvența</text>
<text x="306.8" y="824.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="92.9" lengthAdjust="spacing">Ce se întâmplă</text>
<line x1="62.0" y1="834.5" x2="838.0" y2="834.5" stroke="#e3dccb"/>
<text x="74.0" y="857.0" font-size="14.5" fill="#3a3226" textLength="91.8" lengthAdjust="spacing">situația inițială</text>
<text x="306.8" y="857.0" font-size="14.5" fill="#3a3226" textLength="122.2" lengthAdjust="spacing">o stare de echilibru</text>
<line x1="62.0" y1="867.4" x2="838.0" y2="867.4" stroke="#e3dccb"/>
<text x="74.0" y="889.9" font-size="14.5" fill="#3a3226" textLength="164.7" lengthAdjust="spacing">succesiunea de întâmplări</text>
<text x="306.8" y="889.9" font-size="14.5" fill="#3a3226" textLength="494.3" lengthAdjust="spacing">echilibrul se modifică (din cauza unui gest, a unei stări, a unei afirmații, a unor</text>
<text x="306.8" y="910.9" font-size="14.5" fill="#3a3226" textLength="172.3" lengthAdjust="spacing">evenimente nedorite); apar</text>
<text x="483.0" y="910.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="74.8" lengthAdjust="spacing">complicații</text>
<text x="557.8" y="910.9" font-size="14.5" fill="#3a3226" textLength="255.5" lengthAdjust="spacing">; complicațiile sunt depășite prin găsirea</text>
<text x="306.8" y="931.9" font-size="14.5" fill="#3a3226" textLength="27.6" lengthAdjust="spacing">unei</text>
<text x="338.3" y="931.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="59.0" lengthAdjust="spacing">rezolvări</text>
<line x1="62.0" y1="942.3" x2="838.0" y2="942.3" stroke="#e3dccb"/>
<text x="74.0" y="964.8" font-size="14.5" fill="#3a3226" textLength="84.4" lengthAdjust="spacing">situația finală</text>
<text x="306.8" y="964.8" font-size="14.5" fill="#3a3226" textLength="104.3" lengthAdjust="spacing">un nou echilibru</text>
<line x1="62.0" y1="975.1" x2="838.0" y2="975.1" stroke="#e3dccb"/>
<line x1="294.8" y1="803.0" x2="294.8" y2="975.1" stroke="#e3dccb"/>
<rect x="62.0" y="989.1" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="1015.6" font-size="14.5" fill="#10233f" font-weight="700" textLength="156.9" lengthAdjust="spacing">Altă imagine a acțiunii:</text>
<text x="78.0" y="1034.5" font-size="14.5" fill="#3a3226" textLength="194.6" lengthAdjust="spacing">acțiunea crește treptat spre un</text>
<text x="276.5" y="1034.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="130.4" lengthAdjust="spacing">moment culminant</text>
<text x="406.9" y="1034.5" font-size="14.5" fill="#3a3226" textLength="295.9" lengthAdjust="spacing">, apoi descrește spre o nouă stare de echilibru:</text>
<text x="706.7" y="1034.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="110.2" lengthAdjust="spacing">situația inițială →</text>
<text x="78.0" y="1055.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="512.7" lengthAdjust="spacing">creșterea acțiunii → momentul culminant → descreșterea acțiunii → situația finală</text>
<text x="590.7" y="1055.5" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<text x="213.7" y="1121.3" font-size="11.5" fill="#5b6b83" textLength="472.6" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 45-46, rubricile Repere; exemplele sunt din „Vizită…” de I.L. Caragiale.</text>
</svg>
