<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="960" height="390" fill="#faf7f0"/>
  <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Ce am învățat despre lectură în Unitatea II</text>
  <text x="480" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 21 · Recapitulare, lectură și comunicare</text>
  <rect x="36" y="100" width="290" height="150" rx="16" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="56" y="130" font-size="14" font-weight="700" fill="#10233f">Textul narativ</text>
  <text x="56" y="156" font-size="12" fill="#3d4a5f">timp, spațiu, acțiune</text>
  <text x="56" y="176" font-size="12" fill="#3d4a5f">personaje</text>
  <text x="56" y="196" font-size="12" fill="#3d4a5f">cine povestește</text>
  <rect x="340" y="100" width="290" height="150" rx="16" fill="#ffffff" stroke="#a1417e" stroke-width="2.5"/>
  <text x="360" y="130" font-size="14" font-weight="700" fill="#10233f">Planul de idei</text>
  <text x="360" y="156" font-size="12" fill="#3d4a5f">simplu: doar ideile</text>
  <text x="360" y="176" font-size="12" fill="#3d4a5f">principale</text>
  <text x="360" y="196" font-size="12" fill="#3d4a5f"></text>
  <text x="360" y="216" font-size="12" fill="#3d4a5f">dezvoltat: și cele</text>
  <text x="360" y="236" font-size="12" fill="#3d4a5f">secundare</text>
  <rect x="644" y="100" width="280" height="150" rx="16" fill="#ffffff" stroke="#1c7f5e" stroke-width="2.5"/>
  <text x="664" y="130" font-size="14" font-weight="700" fill="#10233f">Comunicarea</text>
  <text x="664" y="156" font-size="12" fill="#3d4a5f">invitație, reproș,</text>
  <text x="664" y="176" font-size="12" fill="#3d4a5f">compliment</text>
  <text x="664" y="196" font-size="12" fill="#3d4a5f"></text>
  <text x="664" y="216" font-size="12" fill="#3d4a5f">regulile de acces</text>
  <text x="664" y="236" font-size="12" fill="#3d4a5f">la cuvânt</text>
  <rect x="36" y="272" width="888" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="58" y="297" font-size="13" font-weight="700" fill="#10233f">Personajul</text>
  <text x="58" y="317" font-size="12" fill="#3d4a5f">îl cunoști din ce face, ce spune, cum arată și ce spun alții despre el. Mereu cu dovada din text.</text>
  <rect x="36" y="336" width="888" height="56" rx="14" fill="#ffffff" stroke="#e2d9c4" stroke-width="2"/>
  <text x="58" y="361" font-size="13" font-weight="700" fill="#10233f">Jurnalul cu dublă intrare</text>
  <text x="58" y="381" font-size="12" fill="#3d4a5f">într-o coloană citatul, în cealaltă ce gândesc eu despre el.</text>
</svg>
