<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Jocuri de ieri și de azi</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 7 · diversitate culturală</text>
  <g>
    <rect x="60" y="95" width="360" height="200" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="240" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Jocuri de altădată</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="240" y="150">Jocuri de curte, cu obiecte</tspan>
      <tspan x="240" y="166">simple: mingea, sfoara,</tspan>
      <tspan x="240" y="182">cretă, nasturi.</tspan>
      <tspan x="240" y="212">Se jucau afară, în grup,</tspan>
      <tspan x="240" y="228">cu reguli transmise oral,</tspan>
      <tspan x="240" y="244">de la copil la copil.</tspan>
    </text>
  </g>
  <g>
    <rect x="480" y="95" width="360" height="200" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="660" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Jocuri de azi</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="660" y="150">Jocuri digitale, pe telefon</tspan>
      <tspan x="660" y="166">sau calculator, adesea</tspan>
      <tspan x="660" y="182">jucate individual.</tspan>
      <tspan x="660" y="212">Regulile vin scrise, de la</tspan>
      <tspan x="660" y="228">dezvoltatorul jocului, nu</tspan>
      <tspan x="660" y="244">transmise oral.</tspan>
    </text>
  </g>
  <rect x="150" y="310" width="600" height="44" rx="12" fill="#fff3da" stroke="#b8944f" stroke-width="1.5"/>
  <text x="450" y="336" text-anchor="middle" font-size="11.5" fill="#3a3226">Cuvântul „joc” diferă de la o limbă la alta, dar nevoia de joc rămâne comună tuturor culturilor.</text>
</svg>
