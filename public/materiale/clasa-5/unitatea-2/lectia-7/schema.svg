<text x="291.3" y="910.6" font-size="14.5" fill="#3a3226" textLength="48.3" lengthAdjust="spacing">daneză</text>

<line x1="62.0" y1="921.0" x2="838.0" y2="921.0" stroke="#e3dccb"/>
<line x1="279.3" y1="462.4" x2="279.3" y2="921.0" stroke="#e3dccb"/>
<line x1="527.6" y1="462.4" x2="527.6" y2="921.0" stroke="#e3dccb"/>
<rect x="40" y="959.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="982.0" font-size="16" font-weight="700" fill="#ffffff">3. JOCURI DE IERI</text>
<rect x="40" y="993.0" width="820" height="423.7" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1026.0" font-size="15" fill="#3a3226" textLength="762.1" lengthAdjust="spacing">Lista lui Costin Moisil are cinci categorii de jocuri. Pentru fiecare, caut în listă și notez un joc tradițional de la noi</text>
<text x="62.0" y="1047.7" font-size="15" fill="#3a3226" textLength="170.8" lengthAdjust="spacing">și un joc dintr-o altă țară.</text>
<rect x="62.0" y="1066.2" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1087.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="115.3" lengthAdjust="spacing">Categoria din listă</text>
<text x="353.4" y="1087.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="164.0" lengthAdjust="spacing">Un joc tradițional de la noi</text>
<text x="601.7" y="1087.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="141.8" lengthAdjust="spacing">Un joc dintr-o altă țară</text>
<line x1="62.0" y1="1097.8" x2="838.0" y2="1097.8" stroke="#e3dccb"/>
<text x="74.0" y="1120.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="94.6" lengthAdjust="spacing">De jucat afară</text>
<text x="172.5" y="1120.3" font-size="14.5" fill="#3a3226" textLength="51.5" lengthAdjust="spacing">(în listă:</text>
<text x="227.9" y="1120.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="49.2" lengthAdjust="spacing">Leapșa</text>
<text x="277.1" y="1120.3" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="74.0" y="1141.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="43.8" lengthAdjust="spacing">Șotron</text>
<text x="117.8" y="1141.3" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="125.7" y="1141.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="49.5" lengthAdjust="spacing">Coarda</text>
<text x="175.3" y="1141.3" font-size="14.5" fill="#3a3226" textLength="5.1" lengthAdjust="spacing">)</text>


<line x1="62.0" y1="1151.6" x2="838.0" y2="1151.6" stroke="#e3dccb"/>
<text x="74.0" y="1174.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="198.4" lengthAdjust="spacing">Jocuri cu mingea și alte cele,</text>
<text x="74.0" y="1195.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="112.5" lengthAdjust="spacing">obligatoriu afară</text>
<text x="190.5" y="1195.2" font-size="14.5" fill="#3a3226" textLength="51.5" lengthAdjust="spacing">(în listă:</text>
<text x="245.9" y="1195.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="37.0" lengthAdjust="spacing">Țările</text>
<text x="282.9" y="1195.2" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="74.0" y="1216.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="118.6" lengthAdjust="spacing">Rațele și vânătorii</text>
<text x="192.6" y="1216.2" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="200.6" y="1216.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="53.9" lengthAdjust="spacing">Castelul</text>
<text x="254.5" y="1216.2" font-size="14.5" fill="#3a3226" textLength="5.1" lengthAdjust="spacing">)</text>


<line x1="62.0" y1="1226.5" x2="838.0" y2="1226.5" stroke="#e3dccb"/>
<text x="74.0" y="1249.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="167.3" lengthAdjust="spacing">De jucat în casă, în clasă</text>
<text x="245.2" y="1249.0" font-size="14.5" fill="#3a3226" textLength="51.5" lengthAdjust="spacing">(în listă:</text>
<text x="74.0" y="1270.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="60.3" lengthAdjust="spacing">Bambilici</text>
<text x="134.3" y="1270.1" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="142.3" y="1270.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="69.6" lengthAdjust="spacing">Ping-pong</text>
<text x="211.9" y="1270.1" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="219.8" y="1270.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="37.1" lengthAdjust="spacing">X și 0</text>
<text x="256.9" y="1270.1" font-size="14.5" fill="#3a3226" textLength="5.1" lengthAdjust="spacing">)</text>


<line x1="62.0" y1="1280.4" x2="838.0" y2="1280.4" stroke="#e3dccb"/>
<text x="74.0" y="1302.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="191.9" lengthAdjust="spacing">De jucat în casă sau oriunde</text>
<text x="269.9" y="1302.9" font-size="14.5" fill="#3a3226" textLength="51.5" lengthAdjust="spacing">(în listă:</text>
<text x="74.0" y="1323.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="110.0" lengthAdjust="spacing">Telefonul fără fir</text>
<text x="184.0" y="1323.9" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="192.0" y="1323.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="37.0" lengthAdjust="spacing">Mima</text>
<text x="229.0" y="1323.9" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="237.0" y="1323.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="41.8" lengthAdjust="spacing">Arșice</text>
<text x="278.8" y="1323.9" font-size="14.5" fill="#3a3226" textLength="5.1" lengthAdjust="spacing">)</text>


<line x1="62.0" y1="1334.3" x2="838.0" y2="1334.3" stroke="#e3dccb"/>
<text x="74.0" y="1356.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="70.1" lengthAdjust="spacing">Alte jocuri</text>
<text x="148.1" y="1356.8" font-size="14.5" fill="#3a3226" textLength="51.5" lengthAdjust="spacing">(în listă:</text>
<text x="203.5" y="1356.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="25.9" lengthAdjust="spacing">Șah</text>
<text x="229.4" y="1356.8" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="237.4" y="1356.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="36.6" lengthAdjust="spacing">Table</text>
<text x="274.0" y="1356.8" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">,</text>
<text x="282.0" y="1356.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="39.1" lengthAdjust="spacing">Dame</text>
<text x="321.1" y="1356.8" font-size="14.5" fill="#3a3226" textLength="5.1" lengthAdjust="spacing">)</text>


<line x1="62.0" y1="1367.1" x2="838.0" y2="1367.1" stroke="#e3dccb"/>
<line x1="341.4" y1="1066.2" x2="341.4" y2="1367.1" stroke="#e3dccb"/>
<line x1="589.7" y1="1066.2" x2="589.7" y2="1367.1" stroke="#e3dccb"/>
<text x="62.0" y="1394.6" font-size="13.5" fill="#5b6b83" textLength="601.4" lengthAdjust="spacing">Exemplele din coloana întâi sunt luate din lista de la p. 53; jocurile din celelalte coloane le aleg eu.</text>
<rect x="40" y="1436.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1459.7" font-size="16" font-weight="700" fill="#ffffff">4. JOCURI DE AZI</text>
<rect x="40" y="1470.7" width="820" height="395.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="1488.7" width="776.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="1516.7" font-size="16" fill="#6f5ea8" font-weight="700" textLength="117.3" lengthAdjust="spacing">Johan Huizinga</text>
<text x="78.0" y="1540.0" font-size="14.5" fill="#3a3226" textLength="366.3" lengthAdjust="spacing">Istoricul olandez Johan Huizinga a pornit de la ideea că</text>
<text x="448.2" y="1540.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="319.7" lengthAdjust="spacing">„jocul este punctul de origine al culturii noastre”</text>
<text x="767.8" y="1540.0" font-size="14.5" fill="#3a3226" textLength="4.0" lengthAdjust="spacing">.</text>
<rect x="62.0" y="1572.3" width="776.0" height="88.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="1600.3" font-size="16" fill="#0d9c92" font-weight="700" textLength="110.7" lengthAdjust="spacing">serious games</text>
<text x="78.0" y="1623.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="99.0" lengthAdjust="spacing">Serious games</text>
<text x="180.9" y="1623.6" font-size="14.5" fill="#3a3226" textLength="632.7" lengthAdjust="spacing">(termenul în engleză pentru „jocuri serioase”) se folosesc de structura motivantă și distractivă a</text>
<text x="78.0" y="1644.7" font-size="14.5" fill="#3a3226" textLength="428.4" lengthAdjust="spacing">jocurilor digitale pentru a transmite cunoștințe și a forma abilități.</text>
<rect x="62.0" y="1677.0" width="776.0" height="112.6" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="78.0" y="1705.0" font-size="16" fill="#9a7433" font-weight="700" textLength="157.1" lengthAdjust="spacing">senzația de eficiență</text>
<text x="78.0" y="1728.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="143.7" lengthAdjust="spacing">Senzația de eficiență</text>
<text x="225.6" y="1728.3" font-size="14.5" fill="#3a3226" textLength="589.3" lengthAdjust="spacing">este o convingere personală cu privire la performanța pe care o poate realiza acel individ</text>
<text x="78.0" y="1749.3" font-size="14.5" fill="#3a3226" textLength="140.4" lengthAdjust="spacing">într-o anume situație.</text>
<text x="78.0" y="1773.3" font-size="14.5" fill="#3a3226" textLength="563.8" lengthAdjust="spacing">Definiția este dată de Christoph Klimmt, cercetător în domeniul jocurilor pe computer.</text>
<text x="62.0" y="1818.6" font-size="15" fill="#3a3226" textLength="565.7" lengthAdjust="spacing">Completez lista de jocuri cu cele digitale pe care le cunosc (p. 53, Aplicații ex. 1 b):</text>
<text x="62.0" y="1843.4" font-size="15" fill="#3a3226" textLength="727.1" lengthAdjust="spacing">…………………………………………………………………………………………………………………………………………………………</text>
<text x="61.1" y="1897.4" font-size="11.5" fill="#5b6b83" textLength="777.8" lengthAdjust="spacing">Sursa: Manual Art 5, p. 53 (Repere, Pentru început ex. 1-2, Lista lui Costin Moisil din volumul Piua!, Muzeul Țăranului Român) și p. 54 (textul „Jocurile</text>
<text x="294.2" y="1914.0" font-size="11.5" fill="#5b6b83" textLength="311.7" lengthAdjust="spacing">digitale”). Coloanele libere sunt create pentru aceste notițe.</text>
</svg>
