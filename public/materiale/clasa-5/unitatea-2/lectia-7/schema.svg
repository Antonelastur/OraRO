<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1933" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1933" fill="#faf7f0"/>
<text x="166.2" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="559.3" lengthAdjust="spacing">Diversitate culturală: jocuri de ieri și de azi</text>
<text x="217.5" y="74.4" font-size="14" fill="#5b6b83" textLength="464.9" lengthAdjust="spacing">Clasa a V-a · Unitatea II, Lecția 7 · Manual, pp. 53-54 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE JOCUL</text>
<rect x="40" y="128.6" width="820" height="206.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="41.5" lengthAdjust="spacing">Jocul</text>
<text x="107.8" y="162.6" font-size="16" fill="#10233f" textLength="666.9" lengthAdjust="spacing">este o activitate fizică sau mentală care nu urmărește un scop practic, ci divertismentul sau</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="705.6" lengthAdjust="spacing">alungarea plictiselii. Reprezintă o dimensiune proprie tuturor oamenilor, de oricând și de oriunde.</text>
<text x="62.0" y="219.6" font-size="15" fill="#3a3226" textLength="740.6" lengthAdjust="spacing">Pe de o parte, jocul înseamnă distracție, libertate, fantezie dezlănțuită, imaginație și creativitate, din care pot</text>
<text x="62.0" y="241.3" font-size="15" fill="#3a3226" textLength="305.3" lengthAdjust="spacing">rezulta uneori soluții noi sau creații originale.</text>
<text x="62.0" y="266.1" font-size="15" fill="#3a3226" textLength="742.2" lengthAdjust="spacing">Pe de altă parte, jocul înseamnă și reguli, cunoașterea și respectarea acestora, ceea ce presupune respectul</text>
<text x="62.0" y="287.9" font-size="15" fill="#3a3226" textLength="233.9" lengthAdjust="spacing">reciproc și colaborarea jucătorilor.</text>
<text x="62.0" y="312.6" font-size="15" fill="#3a3226" textLength="378.1" lengthAdjust="spacing">Jocul poate apropia oameni din spații culturale diverse.</text>
<rect x="40" y="355.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="378.1" font-size="16" font-weight="700" fill="#ffffff">2. CUVÂNTUL JOC ÎN LIMBI DIFERITE</text>
<rect x="40" y="389.1" width="820" height="549.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="422.1" font-size="15" fill="#3a3226" textLength="284.3" lengthAdjust="spacing">Observ în ce limbi echivalentul cuvântului</text>
<text x="350.4" y="422.1" font-size="15" fill="#10233f" font-style="italic" textLength="20.5" lengthAdjust="spacing">joc</text>
<text x="375.0" y="422.1" font-size="15" fill="#3a3226" textLength="438.6" lengthAdjust="spacing">are o formă apropiată de cea din limba română și notez în ultima</text>
<text x="62.0" y="443.9" font-size="15" fill="#3a3226" textLength="58.4" lengthAdjust="spacing">coloană.</text>
<rect x="62.0" y="462.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="483.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">Cuvântul</text>
<text x="291.3" y="483.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="38.8" lengthAdjust="spacing">Limba</text>
<text x="539.6" y="483.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="136.7" lengthAdjust="spacing">Seamănă cu româna?</text>
<line x1="62.0" y1="493.9" x2="838.0" y2="493.9" stroke="#e3dccb"/>
<text x="74.0" y="516.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="19.8" lengthAdjust="spacing">joc</text>
<text x="291.3" y="516.4" font-size="14.5" fill="#3a3226" textLength="49.8" lengthAdjust="spacing">română</text>

<line x1="62.0" y1="526.8" x2="838.0" y2="526.8" stroke="#e3dccb"/>
<text x="74.0" y="549.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="37.6" lengthAdjust="spacing">game</text>
<text x="291.3" y="549.2" font-size="14.5" fill="#3a3226" textLength="52.0" lengthAdjust="spacing">engleză</text>

