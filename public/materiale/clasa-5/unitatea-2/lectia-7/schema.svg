<line x1="62.0" y1="691.0" x2="838.0" y2="691.0" stroke="#e3dccb"/>
<text x="74.0" y="713.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="22.3" lengthAdjust="spacing">gra</text>
<text x="291.3" y="713.5" font-size="14.5" fill="#3a3226" textLength="60.7" lengthAdjust="spacing">poloneză</text>

<line x1="62.0" y1="723.9" x2="838.0" y2="723.9" stroke="#e3dccb"/>
<text x="74.0" y="746.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="26.2" lengthAdjust="spacing">spill</text>
<text x="291.3" y="746.4" font-size="14.5" fill="#3a3226" textLength="74.0" lengthAdjust="spacing">norvegiană</text>

<line x1="62.0" y1="756.7" x2="838.0" y2="756.7" stroke="#e3dccb"/>
<text x="74.0" y="779.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="28.8" lengthAdjust="spacing">jogo</text>
<text x="291.3" y="779.2" font-size="14.5" fill="#3a3226" textLength="75.8" lengthAdjust="spacing">portugheză</text>

