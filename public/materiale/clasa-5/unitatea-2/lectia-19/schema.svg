<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1498" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1498" fill="#faf7f0"/>
<text x="204.0" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="486.3" lengthAdjust="spacing">Textul narativ ficțional (II). Redactare</text>
<text x="230.6" y="74.4" font-size="14" fill="#5b6b83" textLength="438.8" lengthAdjust="spacing">Clasa a V-a · Unitatea II, Lecția 19 · Manual, p. 75 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. PLANUL POVESTIRII MELE</text>
<rect x="40" y="128.6" width="820" height="652.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="488.2" lengthAdjust="spacing">Concepe planul pentru un text narativ ficțional, pornind de la întrebarea</text>
<text x="554.2" y="161.6" font-size="15" fill="#10233f" font-style="italic" textLength="256.8" lengthAdjust="spacing">Ce s-ar întâmpla dacă într-o zi ți s-ar</text>
<text x="62.0" y="183.3" font-size="15" fill="#10233f" font-style="italic" textLength="216.1" lengthAdjust="spacing">îndeplini cea mai mare dorință?</text>
<text x="278.1" y="183.3" font-size="15" fill="#3a3226" textLength="209.9" lengthAdjust="spacing">. Folosește schema de mai jos.</text>
<rect x="62.0" y="201.8" width="776.0" height="184.4" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="229.8" font-size="16" fill="#0d9c92" font-weight="700" textLength="111.1" lengthAdjust="spacing">Situația inițială</text>
<text x="78.0" y="253.1" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="253.1" font-size="14.5" fill="#3a3226" textLength="446.0" lengthAdjust="spacing">Prezintă cadrul în care se desfășoară acțiunea, introdu personajele.</text>
<text x="78.0" y="277.1" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="277.1" font-size="14.5" fill="#3a3226" textLength="682.7" lengthAdjust="spacing">Din acest paragraf trebuie să reiasă care este situația de echilibru din momentul inițial (înainte de a ți se</text>
<text x="91.8" y="298.1" font-size="14.5" fill="#3a3226" textLength="208.2" lengthAdjust="spacing">îndeplini cea mai mare dorință).</text>
<text x="78.0" y="322.0" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="322.0" font-size="14.5" fill="#3a3226" textLength="440.3" lengthAdjust="spacing">Folosește cel puțin un verb la timpul imperfect al modului indicativ.</text>
<text x="78.0" y="345.9" font-size="14.5" fill="#3a3226" textLength="702.8" lengthAdjust="spacing">…………………………………………………………………………………………………………………………………………………………</text>
<text x="78.0" y="369.9" font-size="14.5" fill="#3a3226" textLength="702.8" lengthAdjust="spacing">…………………………………………………………………………………………………………………………………………………………</text>
<rect x="62.0" y="402.2" width="776.0" height="205.4" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="430.2" font-size="16" fill="#6f5ea8" font-weight="700" textLength="200.2" lengthAdjust="spacing">Succesiunea de întâmplări</text>
<text x="78.0" y="453.5" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="453.5" font-size="14.5" fill="#3a3226" textLength="706.9" lengthAdjust="spacing">Indică problema/cauza care modifică echilibrul inițial și declanșează acțiunea. Poți introduce problema prin</text>
<text x="91.8" y="474.6" font-size="14.5" fill="#3a3226" textLength="106.9" lengthAdjust="spacing">cuvinte precum:</text>
<text x="202.6" y="474.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="104.3" lengthAdjust="spacing">Deodată/Brusc,</text>
<text x="310.9" y="474.6" font-size="14.5" fill="#3a3226" textLength="12.1" lengthAdjust="spacing">…</text>
<text x="78.0" y="498.5" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="498.5" font-size="14.5" fill="#3a3226" textLength="659.0" lengthAdjust="spacing">Prezintă urmările declanșate de ruperea echilibrului: adică acțiunile, în ordinea în care se derulează.</text>
<text x="78.0" y="522.4" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="522.4" font-size="14.5" fill="#3a3226" textLength="720.1" lengthAdjust="spacing">Folosește mai ales verbe la timpul perfect compus sau prezent. Pentru a reda acțiuni anterioare, poți utiliza și</text>
<text x="91.8" y="543.4" font-size="14.5" fill="#3a3226" textLength="150.9" lengthAdjust="spacing">mai-mult-ca-perfectul.</text>
<text x="78.0" y="567.4" font-size="14.5" fill="#3a3226" textLength="702.8" lengthAdjust="spacing">…………………………………………………………………………………………………………………………………………………………</text>
<text x="78.0" y="591.3" font-size="14.5" fill="#3a3226" textLength="702.8" lengthAdjust="spacing">…………………………………………………………………………………………………………………………………………………………</text>
<rect x="62.0" y="623.6" width="776.0" height="139.4" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="78.0" y="651.6" font-size="16" fill="#9a7433" font-weight="700" textLength="103.4" lengthAdjust="spacing">Situația finală</text>
<text x="78.0" y="674.9" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="674.9" font-size="14.5" fill="#3a3226" textLength="432.3" lengthAdjust="spacing">Precizează modul în care se revine la o nouă situație de echilibru.</text>
<text x="78.0" y="698.8" font-size="14.5" fill="#3a3226">•</text>
<text x="91.8" y="698.8" font-size="14.5" fill="#3a3226" textLength="467.4" lengthAdjust="spacing">Folosește verbe la modul indicativ, timpul perfect compus sau prezent.</text>
<text x="78.0" y="722.8" font-size="14.5" fill="#3a3226" textLength="702.8" lengthAdjust="spacing">…………………………………………………………………………………………………………………………………………………………</text>
<text x="78.0" y="746.7" font-size="14.5" fill="#3a3226" textLength="702.8" lengthAdjust="spacing">…………………………………………………………………………………………………………………………………………………………</text>
<rect x="40" y="801.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="824.1" font-size="16" font-weight="700" fill="#ffffff">2. AȘEZAREA ÎN PAGINĂ</text>
<rect x="40" y="835.1" width="820" height="189.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="868.1" font-size="15" fill="#3a3226" textLength="661.6" lengthAdjust="spacing">În etapa rescrierii textului în variantă finală, o atenție deosebită este acordată prezentării textului.</text>
<text x="62.0" y="892.8" font-size="15" fill="#3a3226" textLength="745.6" lengthAdjust="spacing">Pentru a obține o prezentare clară și îngrijită, trebuie acordată atenție așezării în pagină a textului, astfel încât</text>
<text x="62.0" y="914.6" font-size="15" fill="#3a3226" textLength="280.8" lengthAdjust="spacing">titlul și paragrafele să fie clar evidențiate.</text>
<text x="62.0" y="949.1" font-size="16" fill="#10233f">•</text>
<text x="77.1" y="949.1" font-size="16" fill="#10233f" textLength="357.1" lengthAdjust="spacing">Titlul se scrie în partea de sus a paginii, la mijloc.</text>
<text x="62.0" y="975.5" font-size="16" fill="#10233f">•</text>
<text x="77.1" y="975.5" font-size="16" fill="#10233f" textLength="254.1" lengthAdjust="spacing">Fiecare paragraf începe cu alineat.</text>
<text x="62.0" y="1001.9" font-size="16" fill="#10233f">•</text>
<text x="77.1" y="1001.9" font-size="16" fill="#10233f" textLength="693.1" lengthAdjust="spacing">Scrisul trebuie să fie lizibil (să poată fi citit cu ușurință) și ordonat, pe cât posibil fără ștersături.</text>
<rect x="40" y="1044.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1067.7" font-size="16" font-weight="700" fill="#ffffff">3. GRILA DE AUTOEVALUARE</text>
<rect x="40" y="1078.7" width="820" height="352.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1111.7" font-size="15" fill="#3a3226" textLength="329.2" lengthAdjust="spacing">Evaluează-ți textul pe baza următoarelor criterii:</text>
<rect x="62.0" y="1130.2" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1151.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="51.6" lengthAdjust="spacing">Criteriul</text>
<text x="713.1" y="1151.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="17.0" lengthAdjust="spacing">Da</text>
<text x="790.2" y="1151.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="18.1" lengthAdjust="spacing">Nu</text>
<line x1="62.0" y1="1161.7" x2="838.0" y2="1161.7" stroke="#e3dccb"/>
<text x="74.0" y="1184.2" font-size="14.5" fill="#3a3226" font-weight="700">1.</text>
<text x="89.6" y="1184.2" font-size="14.5" fill="#3a3226" textLength="578.5" lengthAdjust="spacing">Din textul meu rezultă clar următoarele: • cine face acțiunea • ce se întâmplă, care este</text>
<text x="89.6" y="1205.2" font-size="14.5" fill="#3a3226" textLength="409.2" lengthAdjust="spacing">succesiunea întâmplărilor • unde și când se petrece acțiunea.</text>


<line x1="62.0" y1="1215.6" x2="838.0" y2="1215.6" stroke="#e3dccb"/>
<text x="74.0" y="1238.1" font-size="14.5" fill="#3a3226" font-weight="700">2.</text>
<text x="92.4" y="1238.1" font-size="14.5" fill="#3a3226" textLength="560.2" lengthAdjust="spacing">Textul este coerent (acțiunile se înlănțuie logic și între secvențe există legături clare).</text>


<line x1="62.0" y1="1248.4" x2="838.0" y2="1248.4" stroke="#e3dccb"/>
<text x="74.0" y="1270.9" font-size="14.5" fill="#3a3226" font-weight="700">3.</text>
<text x="92.3" y="1270.9" font-size="14.5" fill="#3a3226" textLength="485.6" lengthAdjust="spacing">Am folosit timpurile modului indicativ în mod adecvat secvențelor acțiunii.</text>


<line x1="62.0" y1="1281.3" x2="838.0" y2="1281.3" stroke="#e3dccb"/>
<text x="74.0" y="1303.8" font-size="14.5" fill="#3a3226" font-weight="700">4.</text>
<text x="92.6" y="1303.8" font-size="14.5" fill="#3a3226" textLength="306.2" lengthAdjust="spacing">Titlul corespunde conținutului și este sugestiv.</text>


<line x1="62.0" y1="1314.1" x2="838.0" y2="1314.1" stroke="#e3dccb"/>
<text x="74.0" y="1336.6" font-size="14.5" fill="#3a3226" font-weight="700">5.</text>
<text x="92.2" y="1336.6" font-size="14.5" fill="#3a3226" textLength="216.8" lengthAdjust="spacing">Textul este surprinzător, original.</text>


<line x1="62.0" y1="1347.0" x2="838.0" y2="1347.0" stroke="#e3dccb"/>
<text x="74.0" y="1369.5" font-size="14.5" fill="#3a3226" font-weight="700">6.</text>
<text x="92.3" y="1369.5" font-size="14.5" fill="#3a3226" textLength="514.8" lengthAdjust="spacing">Textul este așezat corect în pagină, iar scrisul e lizibil și îngrijit, fără ștersături.</text>


<line x1="62.0" y1="1379.8" x2="838.0" y2="1379.8" stroke="#e3dccb"/>
<text x="74.0" y="1402.3" font-size="14.5" fill="#3a3226" font-weight="700">7.</text>
<text x="90.0" y="1402.3" font-size="14.5" fill="#3a3226" textLength="344.3" lengthAdjust="spacing">Am respectat regulile de ortografie și de punctuație.</text>


<line x1="62.0" y1="1412.7" x2="838.0" y2="1412.7" stroke="#e3dccb"/>
<line x1="682.8" y1="1130.2" x2="682.8" y2="1412.7" stroke="#e3dccb"/>
<line x1="760.4" y1="1130.2" x2="760.4" y2="1412.7" stroke="#e3dccb"/>
<text x="44.2" y="1462.2" font-size="11.5" fill="#5b6b83" textLength="811.6" lengthAdjust="spacing">Sursa: Manual Art 5, p. 75, Aplicații ex. 1 (schema planului) și 3 (criteriile) și regulile de așezare în pagină din rubrica Repere. Definiția și pașii scrierii sunt în</text>
<text x="258.2" y="1478.9" font-size="11.5" fill="#5b6b83" textLength="383.5" lengthAdjust="spacing">schema Lecției 18. Spațiile de completat sunt create pentru aceste notițe.</text>
</svg>
