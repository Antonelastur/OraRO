<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="430" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Timpurile verbului, toate la un loc</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 22 · Recapitulare, gramatică</text>
  <line x1="60" y1="196" x2="940" y2="196" stroke="#e2d9c4" stroke-width="3"/>
  <text x="60" y="228" font-size="12" font-weight="700" fill="#5b6b83">TRECUT</text>
  <text x="700" y="228" font-size="12" font-weight="700" fill="#5b6b83">PREZENT</text>
  <text x="866" y="228" font-size="12" font-weight="700" fill="#5b6b83">VIITOR</text>
  <rect x="60" y="104" width="158" height="76" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2.5"/>
  <text x="139" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#6f5ea8">mai-mult-ca-perfectul</text>
  <text x="139" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#10233f">plecase</text>
  <text x="139" y="170" text-anchor="middle" font-size="9.5" fill="#5b6b83">înaintea altei acțiuni trecute</text>
  <circle cx="139" cy="196" r="6" fill="#6f5ea8"/>
  <rect x="232" y="104" width="158" height="76" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2.5"/>
  <text x="311" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#a1417e">perfectul simplu</text>
  <text x="311" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#10233f">plecă</text>
  <text x="311" y="170" text-anchor="middle" font-size="9.5" fill="#5b6b83">terminat, în povestire</text>
  <circle cx="311" cy="196" r="6" fill="#a1417e"/>
  <rect x="404" y="104" width="158" height="76" rx="12" fill="#ffffff" stroke="#b0512f" stroke-width="2.5"/>
  <text x="483" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#b0512f">perfectul compus</text>
  <text x="483" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#10233f">a plecat</text>
  <text x="483" y="170" text-anchor="middle" font-size="9.5" fill="#5b6b83">terminat, în vorbirea de zi cu zi</text>
  <circle cx="483" cy="196" r="6" fill="#b0512f"/>
  <rect x="576" y="104" width="158" height="76" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="655" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#3b5fa8">imperfectul</text>
  <text x="655" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#10233f">pleca</text>
  <text x="655" y="170" text-anchor="middle" font-size="9.5" fill="#5b6b83">ținea sau se repeta</text>
  <circle cx="655" cy="196" r="6" fill="#3b5fa8"/>
  <rect x="720" y="104" width="124" height="76" rx="12" fill="#ffffff" stroke="#1c7f5e" stroke-width="2.5"/>
  <text x="782" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1c7f5e">prezentul</text>
  <text x="782" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#10233f">pleacă</text>
  <text x="782" y="170" text-anchor="middle" font-size="9.5" fill="#5b6b83">acum, sau mereu</text>
  <circle cx="782" cy="196" r="6" fill="#1c7f5e"/>
  <rect x="864" y="104" width="124" height="76" rx="12" fill="#ffffff" stroke="#846b36" stroke-width="2.5"/>
  <text x="926" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#846b36">viitorul</text>
  <text x="926" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#10233f">va pleca</text>
  <text x="926" y="170" text-anchor="middle" font-size="9.5" fill="#5b6b83">ce urmează</text>
  <circle cx="926" cy="196" r="6" fill="#846b36"/>
  <rect x="60" y="252" width="880" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="82" y="277" font-size="13" font-weight="700" fill="#10233f">Toate sunt la modul indicativ</text>
  <text x="82" y="297" font-size="12" fill="#3d4a5f">adică arată acțiuni prezentate ca sigure, reale. Imperativul e alt mod: el cere, nu constată.</text>
  <rect x="60" y="320" width="880" height="56" rx="14" fill="#ffffff" stroke="#e2d9c4" stroke-width="2"/>
  <text x="82" y="345" font-size="13" font-weight="700" fill="#10233f">Timpuri compuse</text>
  <text x="82" y="365" font-size="12" fill="#3d4a5f">perfectul compus și viitorul se scriu din două cuvinte. Auxiliarul nu se leagă niciodată cu cratimă de verb.</text>
  <rect x="60" y="384" width="880" height="56" rx="14" fill="#ffffff" stroke="#c1503a" stroke-width="2"/>
  <text x="82" y="409" font-size="13" font-weight="700" fill="#10233f">Capcana cea mai frecventă</text>
  <text x="82" y="429" font-size="12" fill="#3d4a5f">nu face, nu spune, nu zice la imperativ negativ. Niciodată nu fă, nu spuneți greșit.</text>
</svg>
