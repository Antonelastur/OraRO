<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1133" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1133" fill="#faf7f0"/>
<text x="137.7" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="626.3" lengthAdjust="spacing">Recapitulare. Timpurile verbului, toate la un loc</text>
<text x="224.3" y="74.4" font-size="14" fill="#5b6b83" textLength="451.4" lengthAdjust="spacing">Clasa a V-a · Unitatea II, Lecția 22 · Manual, pp. 60-73 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. MODUL INDICATIV: ACȚIUNE SIGURĂ, REALĂ</text>
<rect x="40" y="128.6" width="820" height="318.5" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="44.5" lengthAdjust="spacing">Timpul</text>
<text x="260.2" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="71.4" lengthAdjust="spacing">Ce exprimă</text>
<text x="663.8" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="78.6" lengthAdjust="spacing">(a) cânta, eu</text>
<line x1="62.0" y1="178.2" x2="838.0" y2="178.2" stroke="#e3dccb"/>
<text x="74.0" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.9" lengthAdjust="spacing">prezent</text>
<text x="260.2" y="200.7" font-size="14.5" fill="#3a3226" textLength="188.1" lengthAdjust="spacing">acțiunea în momentul vorbirii</text>
<text x="663.8" y="200.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="27.0" lengthAdjust="spacing">cânt</text>
<line x1="62.0" y1="211.0" x2="838.0" y2="211.0" stroke="#e3dccb"/>
<text x="74.0" y="233.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="66.0" lengthAdjust="spacing">imperfect</text>
<text x="260.2" y="233.5" font-size="14.5" fill="#3a3226" textLength="341.8" lengthAdjust="spacing">acțiune trecută, în același timp cu altă acțiune trecută;</text>
<text x="260.2" y="254.5" font-size="14.5" fill="#3a3226" textLength="88.3" lengthAdjust="spacing">descrie cadrul</text>
<text x="663.8" y="233.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="47.3" lengthAdjust="spacing">cântam</text>
<line x1="62.0" y1="264.9" x2="838.0" y2="264.9" stroke="#e3dccb"/>
<text x="74.0" y="287.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="106.0" lengthAdjust="spacing">perfect compus</text>
<text x="260.2" y="287.4" font-size="14.5" fill="#3a3226" textLength="325.8" lengthAdjust="spacing">acțiune trecută și terminată; timpul povestirii de azi</text>
<text x="663.8" y="287.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="63.7" lengthAdjust="spacing">am cântat</text>
<line x1="62.0" y1="297.7" x2="838.0" y2="297.7" stroke="#e3dccb"/>
<text x="74.0" y="320.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="98.3" lengthAdjust="spacing">perfect simplu</text>
<text x="260.2" y="320.2" font-size="14.5" fill="#3a3226" textLength="352.1" lengthAdjust="spacing">acțiune trecută și terminată; timpul povestirii imaginare</text>
<text x="663.8" y="320.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="38.6" lengthAdjust="spacing">cântai</text>
<line x1="62.0" y1="330.6" x2="838.0" y2="330.6" stroke="#e3dccb"/>
<text x="74.0" y="353.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="137.9" lengthAdjust="spacing">mai-mult-ca-perfect</text>
<text x="260.2" y="353.1" font-size="14.5" fill="#3a3226" textLength="292.6" lengthAdjust="spacing">acțiune terminată înaintea altei acțiuni trecute</text>
<text x="663.8" y="353.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="60.2" lengthAdjust="spacing">cântasem</text>
<line x1="62.0" y1="363.4" x2="838.0" y2="363.4" stroke="#e3dccb"/>
<text x="74.0" y="385.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="36.2" lengthAdjust="spacing">viitor</text>
<text x="260.2" y="385.9" font-size="14.5" fill="#3a3226" textLength="201.7" lengthAdjust="spacing">acțiune după momentul vorbirii</text>
<text x="663.8" y="385.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="57.1" lengthAdjust="spacing">voi cânta</text>
<line x1="62.0" y1="396.3" x2="838.0" y2="396.3" stroke="#e3dccb"/>
<text x="74.0" y="418.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="95.0" lengthAdjust="spacing">viitor anterior</text>
<text x="260.2" y="418.8" font-size="14.5" fill="#3a3226" textLength="307.4" lengthAdjust="spacing">acțiune viitoare terminată înaintea alteia viitoare</text>
<text x="663.8" y="418.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="73.8" lengthAdjust="spacing">voi fi cântat</text>
<line x1="62.0" y1="429.1" x2="838.0" y2="429.1" stroke="#e3dccb"/>
<line x1="248.2" y1="146.6" x2="248.2" y2="429.1" stroke="#e3dccb"/>
<line x1="651.8" y1="146.6" x2="651.8" y2="429.1" stroke="#e3dccb"/>
<rect x="40" y="467.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="490.1" font-size="16" font-weight="700" fill="#ffffff">2. CUM SE FORMEAZĂ TIMPURILE COMPUSE</text>
<rect x="40" y="501.1" width="820" height="166.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="519.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="540.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="44.5" lengthAdjust="spacing">Timpul</text>
<text x="291.3" y="540.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="52.4" lengthAdjust="spacing">Formula</text>
<text x="632.7" y="540.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="550.7" x2="838.0" y2="550.7" stroke="#e3dccb"/>
<text x="74.0" y="573.2" font-size="14.5" fill="#3a3226" textLength="99.3" lengthAdjust="spacing">perfect compus</text>
<text x="291.3" y="573.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="41.3" lengthAdjust="spacing">a avea</text>
<text x="336.5" y="573.2" font-size="14.5" fill="#3a3226" textLength="122.8" lengthAdjust="spacing">auxiliar + participiu</text>
<text x="632.7" y="573.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="54.8" lengthAdjust="spacing">am mers</text>
<line x1="62.0" y1="583.5" x2="838.0" y2="583.5" stroke="#e3dccb"/>
<text x="74.0" y="606.0" font-size="14.5" fill="#3a3226" textLength="32.5" lengthAdjust="spacing">viitor</text>
<text x="291.3" y="606.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="38.7" lengthAdjust="spacing">a vrea</text>
<text x="333.9" y="606.0" font-size="14.5" fill="#3a3226" textLength="109.8" lengthAdjust="spacing">auxiliar + infinitiv</text>
<text x="632.7" y="606.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="70.8" lengthAdjust="spacing">vom merge</text>
<line x1="62.0" y1="616.4" x2="838.0" y2="616.4" stroke="#e3dccb"/>
<text x="74.0" y="638.9" font-size="14.5" fill="#3a3226" textLength="86.7" lengthAdjust="spacing">viitor anterior</text>
<text x="291.3" y="638.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="38.7" lengthAdjust="spacing">a vrea</text>
<text x="333.9" y="638.9" font-size="14.5" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">+</text>
<text x="347.7" y="638.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="19.9" lengthAdjust="spacing">a fi</text>
<text x="371.5" y="638.9" font-size="14.5" fill="#3a3226" textLength="73.7" lengthAdjust="spacing">+ participiu</text>
<text x="632.7" y="638.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="73.7" lengthAdjust="spacing">vom fi mers</text>
<line x1="62.0" y1="649.2" x2="838.0" y2="649.2" stroke="#e3dccb"/>
<line x1="279.3" y1="519.1" x2="279.3" y2="649.2" stroke="#e3dccb"/>
<line x1="620.7" y1="519.1" x2="620.7" y2="649.2" stroke="#e3dccb"/>
<rect x="40" y="687.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="710.2" font-size="16" font-weight="700" fill="#ffffff">3. MODUL IMPERATIV: ORDIN, ÎNDEMN, SFAT</text>
<rect x="40" y="721.2" width="820" height="55.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="754.2" font-size="15" fill="#3a3226" textLength="222.4" lengthAdjust="spacing">Doar persoana a II-a, fără timpuri:</text>
<text x="288.5" y="754.2" font-size="15" fill="#10233f" font-style="italic" textLength="100.3" lengthAdjust="spacing">Cântă! Cântați!</text>
<text x="392.9" y="754.2" font-size="15" fill="#3a3226" textLength="59.4" lengthAdjust="spacing">· negativ:</text>
<text x="456.3" y="754.2" font-size="15" fill="#10233f" font-style="italic" textLength="141.8" lengthAdjust="spacing">Nu cânta! Nu cântați!</text>
<text x="602.1" y="754.2" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="609.5" y="754.2" font-size="15" fill="#10233f" font-style="italic" textLength="19.9" lengthAdjust="spacing">Fii!</text>
<text x="633.5" y="754.2" font-size="15" fill="#3a3226" textLength="5.8" lengthAdjust="spacing">/</text>
<text x="643.4" y="754.2" font-size="15" fill="#10233f" font-style="italic" textLength="36.9" lengthAdjust="spacing">Nu fi!</text>
<rect x="40" y="796.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="819.7" font-size="16" font-weight="700" fill="#ffffff">4. GREȘELI DE EVITAT</text>
<rect x="40" y="830.7" width="820" height="97.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="848.7" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="848.7" width="6" height="61.7" rx="3" fill="#b4432c"/><text x="84.0" y="875.2" font-size="14.5" fill="#b4432c" font-weight="700" textLength="54.8" lengthAdjust="spacing">Atenție!</text>
<text x="84.0" y="894.1" font-size="14.5" fill="#3a3226">•</text>
<text x="95.9" y="894.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="38.7" lengthAdjust="spacing">voiam</text>
<text x="138.5" y="894.1" font-size="14.5" fill="#3a3226" textLength="20.9" lengthAdjust="spacing">(nu</text>
<text x="163.3" y="894.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="43.9" lengthAdjust="spacing">vroiam</text>
<text x="207.2" y="894.1" font-size="14.5" fill="#3a3226" textLength="21.3" lengthAdjust="spacing">) · •</text>
<text x="232.4" y="894.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="63.8" lengthAdjust="spacing">începuseși</text>
<text x="300.2" y="894.1" font-size="14.5" fill="#3a3226" textLength="20.9" lengthAdjust="spacing">(nu</text>
<text x="325.0" y="894.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="58.0" lengthAdjust="spacing">începusei</text>
<text x="383.0" y="894.1" font-size="14.5" fill="#3a3226" textLength="21.3" lengthAdjust="spacing">) · •</text>
<text x="408.2" y="894.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="55.2" lengthAdjust="spacing">va vedea</text>
<text x="467.3" y="894.1" font-size="14.5" fill="#3a3226" textLength="20.9" lengthAdjust="spacing">(nu</text>
<text x="492.1" y="894.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="47.4" lengthAdjust="spacing">va vede</text>
<text x="539.6" y="894.1" font-size="14.5" fill="#3a3226" textLength="21.3" lengthAdjust="spacing">) · •</text>
<text x="564.8" y="894.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="58.9" lengthAdjust="spacing">Fii acasă!</text>
<text x="627.6" y="894.1" font-size="14.5" fill="#3a3226" textLength="20.9" lengthAdjust="spacing">(nu</text>
<text x="652.4" y="894.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="55.1" lengthAdjust="spacing">Fi acasă!</text>
<text x="707.5" y="894.1" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">)</text>
<rect x="40" y="948.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="971.4" font-size="16" font-weight="700" fill="#ffffff">5. MODELUL DE ANALIZĂ A VERBULUI</text>
<rect x="40" y="982.4" width="820" height="99.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="1000.4" width="776.0" height="63.9" rx="12" fill="#f3efe4"/><text x="78.0" y="1026.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="65.8" lengthAdjust="spacing">„am auzit”</text>
<text x="147.7" y="1026.9" font-size="14.5" fill="#3a3226" textLength="655.2" lengthAdjust="spacing">– verb predicativ, modul indicativ, timpul perfect compus, persoana I, numărul plural, în propoziție este</text>
<text x="78.0" y="1048.0" font-size="14.5" fill="#3a3226" textLength="98.3" lengthAdjust="spacing">predicat verbal.</text>
<text x="284.3" y="1113.8" font-size="11.5" fill="#5b6b83" textLength="331.3" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 60-73, rubricile Repere ale lecțiilor 10-16.</text>
</svg>
