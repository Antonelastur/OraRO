<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="320" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Modul indicativ. Prezentul</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 11</text>
  <rect x="150" y="95" width="600" height="90" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="450" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Ce arată</text>
  <text font-size="12" fill="#3a3226" text-anchor="middle"><tspan x="450" y="147">O acțiune care se petrece chiar în momentul vorbirii,</tspan><tspan x="450" y="164">sau una obișnuită, general valabilă.</tspan></text>
  <rect x="180" y="205" width="540" height="50" rx="12" fill="#eaf6f4"/>
  <text x="450" y="235" text-anchor="middle" font-size="13" fill="#3a3226" font-style="italic">eu joc, tu joci, el joacă, noi jucăm, voi jucați, ei joacă</text>
  <text x="450" y="284" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 11, p. 62</text>
</svg>
