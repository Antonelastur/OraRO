<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 899" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="899" fill="#faf7f0"/>
<text x="214.0" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="473.2" lengthAdjust="spacing">Proiect individual. Jocuri fără vârstă</text>
<text x="227.5" y="74.4" font-size="14" fill="#5b6b83" textLength="445.1" lengthAdjust="spacing">Clasa a V-a · Unitatea II, Lecția 8 · Manual, pp. 53, 55 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. SARCINA</text>
<rect x="40" y="128.6" width="820" height="113.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" textLength="261.6" lengthAdjust="spacing">Prezint un joc pe care l-am aflat de la</text>
<text x="327.9" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="104.8" lengthAdjust="spacing">părinți, bunici</text>
<text x="437.0" y="162.6" font-size="16" fill="#10233f" textLength="331.0" lengthAdjust="spacing">sau de la cineva din comunitate. Poate fi un joc</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="209.9" lengthAdjust="spacing">românesc sau din altă cultură.</text>
<text x="62.0" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="101.7" lengthAdjust="spacing">Timp de lucru:</text>
<text x="167.8" y="219.6" font-size="15" fill="#3a3226" textLength="97.3" lengthAdjust="spacing">trei săptămâni.</text>
<text x="269.1" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="87.9" lengthAdjust="spacing">Prezentarea:</text>
<text x="361.1" y="219.6" font-size="15" fill="#3a3226" textLength="132.1" lengthAdjust="spacing">cel mult trei minute.</text>
<rect x="40" y="262.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="285.1" font-size="16" font-weight="700" fill="#ffffff">2. PAȘII</text>
<rect x="40" y="296.1" width="820" height="187.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="314.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="335.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="71.0" lengthAdjust="spacing">Săptămâna</text>
<text x="229.2" y="335.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="38.3" lengthAdjust="spacing">Ce fac</text>
<line x1="62.0" y1="345.7" x2="838.0" y2="345.7" stroke="#e3dccb"/>
<text x="74.0" y="368.2" font-size="14.5" fill="#3a3226" textLength="3.9" lengthAdjust="spacing">I</text>
<text x="229.2" y="368.2" font-size="14.5" fill="#3a3226" textLength="588.7" lengthAdjust="spacing">Întreb pe cineva mai în vârstă ce jocuri erau populare în copilăria sa. Aleg un joc care ar avea</text>
<text x="229.2" y="389.2" font-size="14.5" fill="#3a3226" textLength="433.1" lengthAdjust="spacing">succes și azi, cer o descriere detaliată și mă documentez pe internet.</text>
<line x1="62.0" y1="399.5" x2="838.0" y2="399.5" stroke="#e3dccb"/>
<text x="74.0" y="422.0" font-size="14.5" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">II</text>
<text x="229.2" y="422.0" font-size="14.5" fill="#3a3226" textLength="41.6" lengthAdjust="spacing">Fac un</text>
<text x="274.7" y="422.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="43.5" lengthAdjust="spacing">poster</text>
<text x="322.1" y="422.0" font-size="14.5" fill="#3a3226" textLength="485.9" lengthAdjust="spacing">cu prezentarea jocului, cu desene sau fotografii. Notez sursele orale și scrise.</text>
<line x1="62.0" y1="432.4" x2="838.0" y2="432.4" stroke="#e3dccb"/>
<text x="74.0" y="454.9" font-size="14.5" fill="#3a3226" textLength="11.7" lengthAdjust="spacing">III</text>
<text x="229.2" y="454.9" font-size="14.5" fill="#3a3226" textLength="457.2" lengthAdjust="spacing">Exersez prezentarea orală, eventual în fața celui care mi-a povestit jocul.</text>
<line x1="62.0" y1="465.2" x2="838.0" y2="465.2" stroke="#e3dccb"/>
<line x1="217.2" y1="314.1" x2="217.2" y2="465.2" stroke="#e3dccb"/>
<rect x="40" y="503.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="526.2" font-size="16" font-weight="700" fill="#ffffff">3. LA PREZENTARE</text>
<rect x="40" y="537.2" width="820" height="154.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="570.2" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="570.2" font-size="15" fill="#3a3226" textLength="134.5" lengthAdjust="spacing">Mă încadrez în timp.</text>
<text x="62.0" y="595.0" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="595.0" font-size="15" fill="#3a3226" textLength="389.4" lengthAdjust="spacing">Folosesc ce am scris pe poster, dar dau și informații în plus.</text>
<text x="62.0" y="619.7" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="619.7" font-size="15" fill="#3a3226" textLength="206.4" lengthAdjust="spacing">Explic desenele sau fotografiile.</text>
<text x="62.0" y="644.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="644.5" font-size="15" fill="#3a3226" textLength="619.6" lengthAdjust="spacing">Vorbesc clar, în enunțuri simple și corecte, într-un limbaj nici prea familiar, nici prea complicat.</text>
<text x="62.0" y="669.2" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="669.2" font-size="15" fill="#3a3226" textLength="313.5" lengthAdjust="spacing">Sunt pregătit să răspund la întrebările colegilor.</text>
<rect x="40" y="711.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="734.7" font-size="16" font-weight="700" fill="#ffffff">4. CE ESTE JOCUL</text>
<rect x="40" y="745.7" width="820" height="102.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="778.7" font-size="15" fill="#3a3226" font-weight="700" textLength="36.5" lengthAdjust="spacing">Jocul</text>
<text x="102.5" y="778.7" font-size="15" fill="#3a3226" textLength="728.7" lengthAdjust="spacing">este o activitate fizică sau mentală care nu urmărește un scop practic, ci divertismentul sau alungarea plictiselii.</text>
<text x="62.0" y="803.5" font-size="15" fill="#3a3226" textLength="437.1" lengthAdjust="spacing">Jocul înseamnă distracție, libertate, imaginație și creativitate, dar și</text>
<text x="503.2" y="803.5" font-size="15" fill="#3a3226" font-weight="700" textLength="41.0" lengthAdjust="spacing">reguli</text>
<text x="544.1" y="803.5" font-size="15" fill="#3a3226" textLength="270.7" lengthAdjust="spacing">, pe care jucătorii le cunosc și le respectă.</text>
<text x="62.0" y="825.2" font-size="15" fill="#3a3226" textLength="308.4" lengthAdjust="spacing">Jocul poate apropia oameni din culturi diferite.</text>
<text x="286.8" y="879.2" font-size="11.5" fill="#5b6b83" textLength="326.4" lengthAdjust="spacing">Sursa: Manual Art 5, p. 55 (proiectul) și p. 53 (Repere despre joc).</text>
</svg>
