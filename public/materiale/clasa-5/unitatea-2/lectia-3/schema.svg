<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 935" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="935" fill="#faf7f0"/>
<text x="295.9" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="309.1" lengthAdjust="spacing">Planul dezvoltat de idei</text>
<text x="242.6" y="74.4" font-size="14" fill="#5b6b83" textLength="414.8" lengthAdjust="spacing">Clasa a V-a · Unitatea II, Lecția 3 · Manual, p. 47 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. IDEILE SECUNDARE</text>
<rect x="40" y="128.6" width="820" height="56.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="122.2" lengthAdjust="spacing">Ideile secundare</text>
<text x="188.6" y="162.6" font-size="16" fill="#10233f" textLength="429.6" lengthAdjust="spacing">prezintă amănunte legate de ideea principală, completând-o.</text>
<rect x="40" y="205.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="228.4" font-size="16" font-weight="700" fill="#ffffff">2. PLANUL DEZVOLTAT DE IDEI</text>
<rect x="40" y="239.4" width="820" height="232.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="273.4" font-size="16" fill="#10233f" font-weight="700" textLength="176.6" lengthAdjust="spacing">Planul dezvoltat de idei</text>
<text x="243.0" y="273.4" font-size="16" fill="#10233f" textLength="592.3" lengthAdjust="spacing">cuprinde ideile principale și ideile secundare corespunzătoare acestora, în ordinea în</text>
<text x="62.0" y="296.6" font-size="16" fill="#10233f" textLength="116.8" lengthAdjust="spacing">care apar în text.</text>
<rect x="62.0" y="315.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="336.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="132.3" lengthAdjust="spacing">Planul simplu de idei</text>
<text x="399.9" y="336.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="149.0" lengthAdjust="spacing">Planul dezvoltat de idei</text>
<line x1="62.0" y1="346.9" x2="838.0" y2="346.9" stroke="#e3dccb"/>
<text x="74.0" y="369.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="286.2" lengthAdjust="spacing">Un domn vine în vizită la doamna Popescu cu</text>
<text x="74.0" y="390.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="170.1" lengthAdjust="spacing">ocazia onomasticii fiului ei.</text>
<text x="399.9" y="369.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="406.4" lengthAdjust="spacing">Un domn vine în vizită la doamna Popescu cu ocazia onomasticii</text>
<text x="399.9" y="390.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="49.9" lengthAdjust="spacing">fiului ei.</text>
<text x="453.7" y="390.5" font-size="14.5" fill="#0d9c92" font-style="italic" textLength="357.0" lengthAdjust="spacing">Musafirul îi oferă lui Ionel o minge și începe să discute cu</text>
<text x="399.9" y="411.5" font-size="14.5" fill="#0d9c92" font-style="italic" textLength="41.0" lengthAdjust="spacing">gazda.</text>
<line x1="62.0" y1="421.9" x2="838.0" y2="421.9" stroke="#e3dccb"/>
<line x1="387.9" y1="315.4" x2="387.9" y2="421.8" stroke="#e3dccb"/>
<text x="62.0" y="449.3" font-size="13.5" fill="#5b6b83" textLength="218.4" lengthAdjust="spacing">Cu verde: ideea secundară adăugată.</text>
<rect x="40" y="491.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="514.4" font-size="16" font-weight="700" fill="#ffffff">3. CUM ÎL ALCĂTUIESC</text>
<rect x="40" y="525.4" width="820" height="199.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="543.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="564.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="56.7" lengthAdjust="spacing">Secvența</text>
<text x="306.8" y="564.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.9" lengthAdjust="spacing">Ce notez</text>
<line x1="62.0" y1="574.9" x2="838.0" y2="574.9" stroke="#e3dccb"/>
<text x="74.0" y="597.4" font-size="14.5" fill="#3a3226" textLength="91.8" lengthAdjust="spacing">situația inițială</text>
<text x="306.8" y="597.4" font-size="14.5" fill="#3a3226" textLength="134.4" lengthAdjust="spacing">cum începe acțiunea:</text>
<text x="445.1" y="597.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="177.0" lengthAdjust="spacing">Cine? Ce face? Unde? Când?</text>
<line x1="62.0" y1="607.8" x2="838.0" y2="607.8" stroke="#e3dccb"/>
<text x="74.0" y="630.3" font-size="14.5" fill="#3a3226" textLength="164.7" lengthAdjust="spacing">succesiunea de întâmplări</text>
<text x="306.8" y="630.3" font-size="14.5" fill="#3a3226" textLength="516.2" lengthAdjust="spacing">cum se declanșează acțiunea, cum se desfășoară, cum sunt depășite complicațiile</text>
<line x1="62.0" y1="640.6" x2="838.0" y2="640.6" stroke="#e3dccb"/>
<text x="74.0" y="663.1" font-size="14.5" fill="#3a3226" textLength="84.4" lengthAdjust="spacing">situația finală</text>
<text x="306.8" y="663.1" font-size="14.5" fill="#3a3226" textLength="110.8" lengthAdjust="spacing">finalul întâmplării</text>
<line x1="62.0" y1="673.5" x2="838.0" y2="673.5" stroke="#e3dccb"/>
<line x1="294.8" y1="543.4" x2="294.8" y2="673.5" stroke="#e3dccb"/>
<text x="62.0" y="702.5" font-size="15" fill="#3a3226" textLength="614.4" lengthAdjust="spacing">Pornesc de la planul simplu și adaug, sub fiecare idee principală, detaliile care o completează.</text>
<rect x="40" y="745.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="768.0" font-size="16" font-weight="700" fill="#ffffff">4. LISTA DE CONTROL</text>
<rect x="40" y="779.0" width="820" height="105.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="812.0" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="812.0" font-size="15" fill="#3a3226" textLength="394.8" lengthAdjust="spacing">A fost dezvoltată fiecare idee principală, cu detalii relevante.</text>
<text x="62.0" y="836.8" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="836.8" font-size="15" fill="#3a3226" textLength="489.1" lengthAdjust="spacing">A fost respectată ordinea în care apar în text ideile principale și secundare.</text>
<text x="62.0" y="861.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="861.5" font-size="15" fill="#3a3226" textLength="586.0" lengthAdjust="spacing">Exprimarea este clară și corectă, fără greșeli gramaticale, de ortografie sau de punctuație.</text>
<text x="252.4" y="915.5" font-size="11.5" fill="#5b6b83" textLength="395.3" lengthAdjust="spacing">Sursa: Manual Art 5, p. 47, rubrica Repere, modelul din tabel și lista de control.</text>
</svg>
