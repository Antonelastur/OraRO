<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Verbul. Predicatul verbal</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 10</text>

  <rect x="180" y="95" width="540" height="80" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="450" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Verbul</text>
  <text font-size="12" fill="#3a3226" text-anchor="middle">
    <tspan x="450" y="147">Partea de vorbire care arată o acțiune, o stare sau o existență.</tspan>
    <tspan x="450" y="164">Are categorii gramaticale: mod, timp, persoană, număr.</tspan>
  </text>

  <g>
    <rect x="80" y="200" width="340" height="120" rx="14" fill="#eaf6f4"/>
    <text x="250" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Predicatul verbal</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="250" y="250">Un verb la mod personal,</tspan>
      <tspan x="250" y="266">care arată ce face subiectul.</tspan>
      <tspan x="250" y="292" font-style="italic">Copiii se joacă în curte.</tspan>
    </text>
  </g>

  <g>
    <rect x="480" y="200" width="340" height="120" rx="14" fill="#f1ecfa"/>
    <text x="650" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Forme verbale nepersonale</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="650" y="250">Infinitivul (a juca) nu arată</tspan>
      <tspan x="650" y="266">persoană și număr, nu poate</tspan>
      <tspan x="650" y="282">fi singur predicat verbal.</tspan>
    </text>
  </g>

  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: manual Art 5, Lecția 10, p. 60</text>
</svg>
