<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1319" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1319" fill="#faf7f0"/>
<text x="287.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="325.3" lengthAdjust="spacing">Verbul. Predicatul verbal</text>
<text x="224.3" y="74.4" font-size="14" fill="#5b6b83" textLength="451.4" lengthAdjust="spacing">Clasa a V-a · Unitatea II, Lecția 11 · Manual, pp. 60-61 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. VERBUL</text>
<rect x="40" y="128.6" width="820" height="90.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="49.9" lengthAdjust="spacing">Verbul</text>
<text x="116.2" y="162.6" font-size="16" fill="#10233f" textLength="228.2" lengthAdjust="spacing">este partea de vorbire care arată</text>
<text x="348.7" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="63.8" lengthAdjust="spacing">acțiunea</text>
<text x="412.5" y="162.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">,</text>
<text x="420.4" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="45.6" lengthAdjust="spacing">starea</text>
<text x="470.3" y="162.6" font-size="16" fill="#10233f" textLength="24.0" lengthAdjust="spacing">sau</text>
<text x="498.6" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="68.5" lengthAdjust="spacing">existența</text>
<text x="567.1" y="162.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<text x="62.0" y="196.4" font-size="15" fill="#3a3226" textLength="156.3" lengthAdjust="spacing">Își modifică forma după</text>
<text x="222.3" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="33.1" lengthAdjust="spacing">timp</text>
<text x="255.5" y="196.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="262.8" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="64.5" lengthAdjust="spacing">persoană</text>
<text x="331.4" y="196.4" font-size="15" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="345.3" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="46.2" lengthAdjust="spacing">număr</text>
<text x="391.5" y="196.4" font-size="15" fill="#3a3226" textLength="188.7" lengthAdjust="spacing">, deci este o parte de vorbire</text>
<text x="584.3" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="56.2" lengthAdjust="spacing">flexibilă</text>
<text x="640.5" y="196.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="238.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="261.9" font-size="16" font-weight="700" fill="#ffffff">2. CATEGORIILE VERBULUI</text>
<rect x="40" y="272.9" width="820" height="248.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="290.9" width="248.0" height="136.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="318.9" font-size="16" fill="#0d9c92" font-weight="700" textLength="49.6" lengthAdjust="spacing">timpul</text>
<text x="78.0" y="342.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="40.7" lengthAdjust="spacing">trecut</text>
<text x="118.7" y="342.2" font-size="14.5" fill="#3a3226" textLength="140.4" lengthAdjust="spacing">: înainte de momentul</text>
<text x="78.0" y="363.2" font-size="14.5" fill="#3a3226" textLength="44.7" lengthAdjust="spacing">vorbirii</text>
<text x="78.0" y="387.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.9" lengthAdjust="spacing">prezent</text>
<text x="129.9" y="387.1" font-size="14.5" fill="#3a3226" textLength="137.3" lengthAdjust="spacing">: în momentul vorbirii</text>
<text x="78.0" y="411.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="36.2" lengthAdjust="spacing">viitor</text>
<text x="114.2" y="411.1" font-size="14.5" fill="#3a3226" textLength="158.3" lengthAdjust="spacing">: după momentul vorbirii</text>
<rect x="326.0" y="290.9" width="248.0" height="136.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="318.9" font-size="16" fill="#6f5ea8" font-weight="700" textLength="68.8" lengthAdjust="spacing">persoana</text>
<text x="342.0" y="342.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="4.6" lengthAdjust="spacing">I</text>
<text x="346.6" y="342.2" font-size="14.5" fill="#3a3226" textLength="70.0" lengthAdjust="spacing">: vorbitorul</text>
<text x="342.0" y="366.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="34.8" lengthAdjust="spacing">a II-a</text>
<text x="376.8" y="366.1" font-size="14.5" fill="#3a3226" textLength="81.6" lengthAdjust="spacing">: ascultătorul</text>
<text x="342.0" y="390.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="39.4" lengthAdjust="spacing">a III-a</text>
<text x="381.4" y="390.1" font-size="14.5" fill="#3a3226" textLength="154.6" lengthAdjust="spacing">: cel despre care e vorba</text>
<rect x="590.0" y="290.9" width="248.0" height="136.5" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="606.0" y="318.9" font-size="16" fill="#9a7433" font-weight="700" textLength="63.5" lengthAdjust="spacing">numărul</text>
<text x="606.0" y="342.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="54.8" lengthAdjust="spacing">singular</text>
<text x="660.8" y="342.2" font-size="14.5" fill="#3a3226" textLength="154.6" lengthAdjust="spacing">: face acțiunea o singură</text>
<text x="606.0" y="363.2" font-size="14.5" fill="#3a3226" textLength="58.9" lengthAdjust="spacing">persoană</text>
<text x="606.0" y="387.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="39.6" lengthAdjust="spacing">plural</text>
<text x="645.6" y="387.1" font-size="14.5" fill="#3a3226" textLength="133.4" lengthAdjust="spacing">: două sau mai multe</text>
<text x="606.0" y="408.2" font-size="14.5" fill="#3a3226" textLength="59.0" lengthAdjust="spacing">persoane</text>
<rect x="62.0" y="441.4" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="467.9" font-size="14.5" fill="#10233f" font-weight="700" textLength="240.0" lengthAdjust="spacing">Forma afirmativă și forma negativă</text>
<text x="78.0" y="486.8" font-size="14.5" fill="#3a3226" textLength="216.8" lengthAdjust="spacing">Forma negativă se construiește cu</text>
<text x="298.7" y="486.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="17.7" lengthAdjust="spacing">nu</text>
<text x="316.4" y="486.8" font-size="14.5" fill="#3a3226" textLength="251.4" lengthAdjust="spacing">, care se analizează împreună cu verbul:</text>
<text x="571.7" y="486.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="145.1" lengthAdjust="spacing">vorbește → nu vorbește</text>
<text x="716.9" y="486.8" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<rect x="40" y="541.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="564.1" font-size="16" font-weight="700" fill="#ffffff">3. PREDICATUL VERBAL</text>
<rect x="40" y="575.1" width="820" height="92.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="609.1" font-size="16" fill="#10233f" textLength="191.7" lengthAdjust="spacing">Când predicatul se exprimă</text>
<text x="258.0" y="609.1" font-size="16" fill="#10233f" font-weight="700" textLength="146.4" lengthAdjust="spacing">doar printr-un verb</text>
<text x="404.4" y="609.1" font-size="16" fill="#10233f" textLength="88.0" lengthAdjust="spacing">, se numește</text>
<text x="496.7" y="609.1" font-size="16" fill="#10233f" font-weight="700" textLength="113.1" lengthAdjust="spacing">predicat verbal</text>
<text x="609.8" y="609.1" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<text x="62.0" y="644.9" font-size="17" fill="#10233f" font-style="italic" textLength="36.0" lengthAdjust="spacing">Ionel</text>
<line x1="62.0" y1="648.4" x2="98.0" y2="648.4" stroke="#10233f" stroke-width="1.4"/>
<line x1="62.0" y1="651.9" x2="98.0" y2="651.9" stroke="#10233f" stroke-width="1.4"/>
<text x="102.6" y="644.9" font-size="17" fill="#10233f" font-style="italic" textLength="40.5" lengthAdjust="spacing">atacă</text>
<line x1="102.6" y1="648.4" x2="143.1" y2="648.4" stroke="#10233f" stroke-width="1.4"/>
<text x="147.7" y="644.9" font-size="17" fill="#10233f" font-style="italic" textLength="78.7" lengthAdjust="spacing">jupâneasa.</text>
<rect x="40" y="688.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="711.0" font-size="16" font-weight="700" fill="#ffffff">4. INFINITIVUL, O FORMĂ VERBALĂ NEPERSONALĂ</text>
<rect x="40" y="722.0" width="820" height="293.4" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="740.0" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="768.0" font-size="16" fill="#0d9c92" font-weight="700" textLength="123.4" lengthAdjust="spacing">forme personale</text>
<text x="78.0" y="791.3" font-size="14.5" fill="#3a3226" textLength="256.2" lengthAdjust="spacing">își schimbă forma după persoană și sunt</text>
<text x="338.1" y="791.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="63.9" lengthAdjust="spacing">predicate</text>
<text x="78.0" y="812.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="50.2" lengthAdjust="spacing">verbale</text>
<text x="78.0" y="836.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="95.7" lengthAdjust="spacing">încep, nu poate</text>
<rect x="458.0" y="740.0" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="768.0" font-size="16" fill="#6f5ea8" font-weight="700" textLength="141.8" lengthAdjust="spacing">forme nepersonale</text>
<text x="474.0" y="791.3" font-size="14.5" fill="#3a3226" textLength="245.2" lengthAdjust="spacing">nu își schimbă forma după persoană și</text>
<text x="723.1" y="791.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.5" lengthAdjust="spacing">nu sunt</text>
<text x="474.0" y="812.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="63.9" lengthAdjust="spacing">predicate</text>
<text x="474.0" y="836.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="94.8" lengthAdjust="spacing">a alerga, a opri</text>
<text x="62.0" y="881.6" font-size="15" fill="#3a3226" font-weight="700" textLength="68.7" lengthAdjust="spacing">Infinitivul</text>
<text x="134.8" y="881.6" font-size="15" fill="#3a3226" textLength="230.2" lengthAdjust="spacing">este forma din dicționar a verbului:</text>
<text x="369.0" y="881.6" font-size="15" fill="#10233f" font-style="italic" textLength="170.5" lengthAdjust="spacing">a alerga, a putea, a începe</text>
<text x="539.6" y="881.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="900.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="921.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="48.5" lengthAdjust="spacing">Situația</text>
<text x="462.0" y="921.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="931.7" x2="838.0" y2="931.7" stroke="#e3dccb"/>
<text x="74.0" y="954.2" font-size="14.5" fill="#3a3226" textLength="76.6" lengthAdjust="spacing">după verbul</text>
<text x="154.5" y="954.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="47.3" lengthAdjust="spacing">a putea</text>
<text x="201.7" y="954.2" font-size="14.5" fill="#3a3226" textLength="77.1" lengthAdjust="spacing">, infinitivul e</text>
<text x="282.8" y="954.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="27.0" lengthAdjust="spacing">fără</text>
<text x="313.7" y="954.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="7.8" lengthAdjust="spacing">a</text>
<text x="462.0" y="954.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="62.8" lengthAdjust="spacing">Pot cânta.</text>
<line x1="62.0" y1="964.5" x2="838.0" y2="964.5" stroke="#e3dccb"/>
<text x="74.0" y="987.0" font-size="14.5" fill="#3a3226" textLength="176.7" lengthAdjust="spacing">după alte verbe, infinitivul e</text>
<text x="254.7" y="987.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="15.8" lengthAdjust="spacing">cu</text>
<text x="274.4" y="987.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="7.8" lengthAdjust="spacing">a</text>
<text x="462.0" y="987.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="105.3" lengthAdjust="spacing">Doresc a desena.</text>
<line x1="62.0" y1="997.4" x2="838.0" y2="997.4" stroke="#e3dccb"/>
<line x1="450.0" y1="900.1" x2="450.0" y2="997.4" stroke="#e3dccb"/>
<rect x="40" y="1035.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1058.4" font-size="16" font-weight="700" fill="#ffffff">5. PASTILA DE ORTOGRAFIE</text>
<rect x="40" y="1069.4" width="820" height="198.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="1087.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1108.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="42.9" lengthAdjust="spacing">Scriem</text>
<text x="190.4" y="1108.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="32.3" lengthAdjust="spacing">Când</text>
<text x="500.8" y="1108.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="1118.9" x2="838.0" y2="1118.9" stroke="#e3dccb"/>
<text x="74.0" y="1141.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="21.8" lengthAdjust="spacing">n-a</text>
<text x="190.4" y="1141.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="43.9" lengthAdjust="spacing">nu + a</text>
<text x="238.2" y="1141.4" font-size="14.5" fill="#3a3226" textLength="97.7" lengthAdjust="spacing">(verbul auxiliar)</text>
<text x="500.8" y="1141.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="112.5" lengthAdjust="spacing">Ionel n-a ascultat.</text>
<line x1="62.0" y1="1151.8" x2="838.0" y2="1151.8" stroke="#e3dccb"/>
<text x="74.0" y="1174.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="15.9" lengthAdjust="spacing">na</text>
<text x="190.4" y="1174.3" font-size="14.5" fill="#3a3226" textLength="165.7" lengthAdjust="spacing">interjecție, când dăm ceva</text>
<text x="500.8" y="1174.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="93.1" lengthAdjust="spacing">Na, ia mingea!</text>
<line x1="62.0" y1="1184.6" x2="838.0" y2="1184.6" stroke="#e3dccb"/>
<text x="74.0" y="1207.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="25.5" lengthAdjust="spacing">n-ai</text>
<text x="190.4" y="1207.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="48.0" lengthAdjust="spacing">nu + ai</text>
<text x="500.8" y="1207.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="123.2" lengthAdjust="spacing">N-ai timp de joacă?</text>
<line x1="62.0" y1="1217.5" x2="838.0" y2="1217.5" stroke="#e3dccb"/>
<text x="74.0" y="1240.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="19.7" lengthAdjust="spacing">nai</text>
<text x="190.4" y="1240.0" font-size="14.5" fill="#3a3226" textLength="121.5" lengthAdjust="spacing">instrument muzical</text>
<text x="500.8" y="1240.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="80.0" lengthAdjust="spacing">Cântă la nai.</text>
<line x1="62.0" y1="1250.3" x2="838.0" y2="1250.3" stroke="#e3dccb"/>
<line x1="178.4" y1="1087.4" x2="178.4" y2="1250.3" stroke="#e3dccb"/>
<line x1="488.8" y1="1087.4" x2="488.8" y2="1250.3" stroke="#e3dccb"/>
<text x="207.2" y="1299.8" font-size="11.5" fill="#5b6b83" textLength="485.5" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 60-61, rubricile Repere. Unele exemple sunt create pentru aceste notițe.</text>
</svg>
