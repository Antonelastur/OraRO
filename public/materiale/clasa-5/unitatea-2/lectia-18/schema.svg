<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="980" height="370" fill="#faf7f0"/>
  <text x="490" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Momentele unei povestiri</text>
  <text x="490" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 18 · Textul narativ ficțional, pregătire</text>
  <rect x="30" y="116" width="168" height="96" rx="14" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="114" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#10233f">Situația inițială</text>
  <text x="114" y="178" text-anchor="middle" font-size="11.5" fill="#3d4a5f">cine, unde, când</text>
  <path d="M200 164 L214 164" stroke="#b8944f" stroke-width="2.5"/>
  <rect x="216" y="116" width="168" height="96" rx="14" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="300" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#10233f">Momentul care schimbă tot</text>
  <text x="300" y="178" text-anchor="middle" font-size="11.5" fill="#3d4a5f">apare o problemă</text>
  <path d="M386 164 L400 164" stroke="#b8944f" stroke-width="2.5"/>
  <rect x="402" y="116" width="168" height="96" rx="14" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="486" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#10233f">Desfășurarea</text>
  <text x="486" y="178" text-anchor="middle" font-size="11.5" fill="#3d4a5f">ce face personajul</text>
  <path d="M572 164 L586 164" stroke="#b8944f" stroke-width="2.5"/>
  <rect x="588" y="108" width="168" height="112" rx="14" fill="#fef8e9" stroke="#b0512f" stroke-width="2.5"/>
  <text x="672" y="142" text-anchor="middle" font-size="12.5" font-weight="700" fill="#10233f">Punctul culminant</text>
  <text x="672" y="170" text-anchor="middle" font-size="11.5" fill="#3d4a5f">clipa cea mai tensionată</text>
  <path d="M758 164 L772 164" stroke="#b8944f" stroke-width="2.5"/>
  <rect x="774" y="116" width="168" height="96" rx="14" fill="#ffffff" stroke="#3b5fa8" stroke-width="2.5"/>
  <text x="858" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#10233f">Finalul</text>
  <text x="858" y="178" text-anchor="middle" font-size="11.5" fill="#3d4a5f">cum se rezolvă</text>
  <rect x="30" y="252" width="920" height="56" rx="14" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="52" y="277" font-size="13" font-weight="700" fill="#10233f">Înainte să scrii</text>
  <text x="52" y="297" font-size="12" fill="#3d4a5f">notează în trei rânduri cine e personajul, ce problemă are și cum scapă. Restul se construiește peste asta.</text>
  <rect x="30" y="316" width="920" height="56" rx="14" fill="#ffffff" stroke="#e2d9c4" stroke-width="2"/>
  <text x="52" y="341" font-size="13" font-weight="700" fill="#10233f">Ficțional înseamnă</text>
  <text x="52" y="361" font-size="12" fill="#3d4a5f">inventat de tine. Poate semăna cu realitatea, dar nu trebuie să se fi întâmplat.</text>
</svg>
