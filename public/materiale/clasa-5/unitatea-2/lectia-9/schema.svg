<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 798" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="798" fill="#faf7f0"/>
<text x="258.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="385.0" lengthAdjust="spacing">Schimburi de replici în dialog</text>
<text x="228.1" y="74.4" font-size="14" fill="#5b6b83" textLength="443.8" lengthAdjust="spacing">Clasa a V-a · Unitatea II, Lecția 9 · Manual, pp. 56-57 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. DIALOGUL</text>
<rect x="40" y="128.6" width="820" height="90.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="63.4" lengthAdjust="spacing">Dialogul</text>
<text x="129.7" y="162.6" font-size="16" fill="#10233f" textLength="550.1" lengthAdjust="spacing">este o convorbire sau un schimb de replici între două sau mai multe persoane.</text>
<text x="62.0" y="196.4" font-size="15" fill="#3a3226" textLength="179.5" lengthAdjust="spacing">Participanții devin, pe rând,</text>
<text x="245.6" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="61.9" lengthAdjust="spacing">vorbitori</text>
<text x="311.6" y="196.4" font-size="15" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="325.5" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="74.4" lengthAdjust="spacing">ascultători</text>
<text x="399.9" y="196.4" font-size="15" fill="#3a3226" textLength="192.3" lengthAdjust="spacing">. Între replici trebuie să existe</text>
<text x="596.3" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="86.0" lengthAdjust="spacing">continuitate</text>
<text x="682.2" y="196.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="238.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="261.9" font-size="16" font-weight="700" fill="#ffffff">2. CE RĂSPUND LA O REPLICĂ</text>
<rect x="40" y="272.9" width="820" height="316.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="290.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="312.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="45.8" lengthAdjust="spacing">Replica</text>
<text x="229.2" y="312.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="116.0" lengthAdjust="spacing">Răspunsul potrivit</text>
<text x="462.0" y="312.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="84.5" lengthAdjust="spacing">Formule utile</text>
<line x1="62.0" y1="322.4" x2="838.0" y2="322.4" stroke="#e3dccb"/>
<text x="74.0" y="344.9" font-size="14.5" fill="#3a3226" textLength="8.6" lengthAdjust="spacing">o</text>
<text x="86.5" y="344.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="62.6" lengthAdjust="spacing">întrebare</text>
<text x="229.2" y="344.9" font-size="14.5" fill="#3a3226" textLength="203.7" lengthAdjust="spacing">răspund la întrebare; dacă n-am</text>
<text x="229.2" y="366.0" font-size="14.5" fill="#3a3226" textLength="120.3" lengthAdjust="spacing">înțeles, cer lămuriri</text>
<text x="462.0" y="344.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="261.3" lengthAdjust="spacing">Ce…? Cum…? Cu cine…? Unde…? De ce…?</text>
<line x1="62.0" y1="376.3" x2="838.0" y2="376.3" stroke="#e3dccb"/>
<text x="74.0" y="398.8" font-size="14.5" fill="#3a3226" textLength="8.6" lengthAdjust="spacing">o</text>
<text x="86.5" y="398.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="55.8" lengthAdjust="spacing">invitație</text>
<text x="229.2" y="398.8" font-size="14.5" fill="#3a3226" textLength="128.2" lengthAdjust="spacing">o accept sau o refuz</text>
<text x="462.0" y="398.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="172.4" lengthAdjust="spacing">Mulțumesc, vin cu plăcere…</text>
<text x="638.3" y="398.8" font-size="14.5" fill="#3a3226" textLength="5.7" lengthAdjust="spacing">/</text>
<text x="647.9" y="398.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="115.9" lengthAdjust="spacing">Îmi pare rău, dar…</text>
<line x1="62.0" y1="409.2" x2="838.0" y2="409.2" stroke="#e3dccb"/>
<text x="74.0" y="431.7" font-size="14.5" fill="#3a3226" textLength="16.5" lengthAdjust="spacing">un</text>
<text x="94.4" y="431.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="81.9" lengthAdjust="spacing">compliment</text>
<text x="229.2" y="431.7" font-size="14.5" fill="#3a3226" textLength="144.4" lengthAdjust="spacing">îmi exprim mulțumirea</text>
<text x="462.0" y="431.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="111.9" lengthAdjust="spacing">Mulțumesc mult…</text>
<line x1="62.0" y1="442.0" x2="838.0" y2="442.0" stroke="#e3dccb"/>
<text x="74.0" y="464.5" font-size="14.5" fill="#3a3226" textLength="16.5" lengthAdjust="spacing">un</text>
<text x="94.4" y="464.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="43.6" lengthAdjust="spacing">reproș</text>
<text x="229.2" y="464.5" font-size="14.5" fill="#3a3226" textLength="140.6" lengthAdjust="spacing">îl accept sau îl resping</text>
<text x="462.0" y="464.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="163.8" lengthAdjust="spacing">Am înțeles…, îmi pare rău.</text>
<text x="629.8" y="464.5" font-size="14.5" fill="#3a3226" textLength="5.7" lengthAdjust="spacing">/</text>
<text x="639.3" y="464.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="140.8" lengthAdjust="spacing">Îmi pare rău, dar nu ai</text>
<text x="462.0" y="485.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="55.4" lengthAdjust="spacing">dreptate.</text>
<line x1="62.0" y1="495.9" x2="838.0" y2="495.9" stroke="#e3dccb"/>
<line x1="217.2" y1="290.9" x2="217.2" y2="495.9" stroke="#e3dccb"/>
<line x1="450.0" y1="290.9" x2="450.0" y2="495.9" stroke="#e3dccb"/>
<rect x="62.0" y="509.9" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="536.4" font-size="14.5" fill="#10233f" font-weight="700" textLength="338.0" lengthAdjust="spacing">Cum fac eu o invitație, un compliment, un reproș:</text>
<text x="78.0" y="555.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="428.6" lengthAdjust="spacing">Vreau să te invit… · Ești extraordinară, pentru că… · Nu-mi place că…</text>
<rect x="40" y="609.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="632.6" font-size="16" font-weight="700" fill="#ffffff">3. ATITUDINEA ÎN DIALOG</text>
<rect x="40" y="643.6" width="820" height="103.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="661.6" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="689.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="67.0" lengthAdjust="spacing">politețea</text>
<text x="78.0" y="712.9" font-size="14.5" fill="#3a3226" textLength="48.6" lengthAdjust="spacing">impune</text>
<text x="130.5" y="712.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="49.4" lengthAdjust="spacing">respect</text>
<text x="183.8" y="712.9" font-size="14.5" fill="#3a3226" textLength="9.6" lengthAdjust="spacing">și</text>
<text x="197.3" y="712.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="67.9" lengthAdjust="spacing">încurajare</text>
<rect x="458.0" y="661.6" width="380.0" height="67.7" rx="12" fill="#ffffff" stroke="#b4432c" stroke-width="2"/>
<text x="474.0" y="689.6" font-size="16" fill="#b4432c" font-weight="700" textLength="191.5" lengthAdjust="spacing">obrăznicia, superioritatea</text>
<text x="474.0" y="712.9" font-size="14.5" fill="#3a3226" textLength="65.8" lengthAdjust="spacing">generează</text>
<text x="543.7" y="712.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="106.7" lengthAdjust="spacing">lipsă de confort</text>
<text x="654.4" y="712.9" font-size="14.5" fill="#3a3226" textLength="9.6" lengthAdjust="spacing">și</text>
<text x="667.9" y="712.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="72.4" lengthAdjust="spacing">respingere</text>
<text x="247.1" y="778.7" font-size="11.5" fill="#5b6b83" textLength="405.7" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 56-57, rubrica Repere și sugestiile pentru jocurile de rol.</text>
</svg>
