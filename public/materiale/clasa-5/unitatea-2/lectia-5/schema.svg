<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1601" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1601" fill="#faf7f0"/>
<text x="305.8" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="287.1" lengthAdjust="spacing">Semnificațiile textului</text>
<text x="232.9" y="74.4" font-size="14" fill="#5b6b83" textLength="434.2" lengthAdjust="spacing">Clasa a V-a · Unitatea II, Lecția 5 · Manual, p. 50 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. ÎNTREBĂRI PENTRU INTERPRETARE</text>
<rect x="40" y="128.6" width="820" height="433.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="180.7" lengthAdjust="spacing">Întrebările sunt din rubrica</text>
<text x="246.7" y="161.6" font-size="15" fill="#10233f" font-style="italic" textLength="80.7" lengthAdjust="spacing">Interpretare</text>
<text x="327.4" y="161.6" font-size="15" fill="#3a3226" textLength="397.5" lengthAdjust="spacing">, p. 50. Caut răspunsul în text și îl notez cu cuvintele mele.</text>
<rect x="62.0" y="180.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="201.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="138.7" lengthAdjust="spacing">Întrebarea din manual</text>
<text x="462.0" y="201.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="107.1" lengthAdjust="spacing">Ce notez din text</text>
<line x1="62.0" y1="211.7" x2="838.0" y2="211.7" stroke="#e3dccb"/>
<text x="74.0" y="234.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="34.7" lengthAdjust="spacing">Titlul</text>
<text x="112.6" y="234.2" font-size="14.5" fill="#3a3226" textLength="276.7" lengthAdjust="spacing">(ex. 8). Ce anume marchează punctele de</text>
<text x="74.0" y="255.2" font-size="14.5" fill="#3a3226" textLength="359.5" lengthAdjust="spacing">suspensie din titlu? Despre ce fel de vizită este vorba?</text>
<text x="462.0" y="234.2" font-size="14.5" fill="#3a3226" textLength="339.3" lengthAdjust="spacing">…………………………………………………………………………</text>
<text x="462.0" y="255.2" font-size="14.5" fill="#3a3226" textLength="339.3" lengthAdjust="spacing">…………………………………………………………………………</text>
<line x1="62.0" y1="265.5" x2="838.0" y2="265.5" stroke="#e3dccb"/>
<text x="74.0" y="288.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="172.5" lengthAdjust="spacing">Comportamentul lui Ionel</text>
<text x="250.4" y="288.0" font-size="14.5" fill="#3a3226" textLength="171.4" lengthAdjust="spacing">(ex. 4). Se comportă Ionel</text>
<text x="74.0" y="309.0" font-size="14.5" fill="#3a3226" textLength="335.8" lengthAdjust="spacing">pe măsura a ceea ce vrea să pară: un adult, și încă</text>
<text x="74.0" y="330.1" font-size="14.5" fill="#3a3226" textLength="42.1" lengthAdjust="spacing">ofițer?</text>
<text x="462.0" y="288.0" font-size="14.5" fill="#3a3226" textLength="339.3" lengthAdjust="spacing">…………………………………………………………………………</text>
<text x="462.0" y="309.0" font-size="14.5" fill="#3a3226" textLength="339.3" lengthAdjust="spacing">…………………………………………………………………………</text>
<line x1="62.0" y1="340.4" x2="838.0" y2="340.4" stroke="#e3dccb"/>
<text x="74.0" y="362.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="172.5" lengthAdjust="spacing">Comportamentul lui Ionel</text>
<text x="250.4" y="362.9" font-size="14.5" fill="#3a3226" textLength="156.9" lengthAdjust="spacing">(ex. 2). De ce crezi că o</text>
<text x="74.0" y="383.9" font-size="14.5" fill="#3a3226" textLength="172.2" lengthAdjust="spacing">atacă Ionel pe jupâneasă?</text>
<text x="462.0" y="362.9" font-size="14.5" fill="#3a3226" textLength="339.3" lengthAdjust="spacing">…………………………………………………………………………</text>
<text x="462.0" y="383.9" font-size="14.5" fill="#3a3226" textLength="339.3" lengthAdjust="spacing">…………………………………………………………………………</text>
<line x1="62.0" y1="394.3" x2="838.0" y2="394.3" stroke="#e3dccb"/>
<text x="74.0" y="416.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="223.7" lengthAdjust="spacing">Ce spune mama despre educație</text>
<text x="301.7" y="416.8" font-size="14.5" fill="#3a3226" textLength="48.4" lengthAdjust="spacing">(p. 42):</text>
<text x="354.1" y="416.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="72.8" lengthAdjust="spacing">„trebuie să</text>
<text x="74.0" y="437.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="292.5" lengthAdjust="spacing">mă ocup eu de el; trebuie să-i fac educația”</text>
<text x="462.0" y="416.8" font-size="14.5" fill="#3a3226" textLength="339.3" lengthAdjust="spacing">…………………………………………………………………………</text>
<text x="462.0" y="437.8" font-size="14.5" fill="#3a3226" textLength="339.3" lengthAdjust="spacing">…………………………………………………………………………</text>
<line x1="62.0" y1="448.2" x2="838.0" y2="448.2" stroke="#e3dccb"/>
<text x="74.0" y="470.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="93.9" lengthAdjust="spacing">Mama și Ionel</text>
<text x="171.8" y="470.7" font-size="14.5" fill="#3a3226" textLength="233.9" lengthAdjust="spacing">(ex. 3). Consideri că felul în care se</text>
<text x="74.0" y="491.7" font-size="14.5" fill="#3a3226" textLength="363.3" lengthAdjust="spacing">comportă Ionel reflectă „părerile sănătoase” ale mamei</text>
<text x="74.0" y="512.7" font-size="14.5" fill="#3a3226" textLength="338.5" lengthAdjust="spacing">în privința educației copiilor? Justifică-ți punctul de</text>
<text x="74.0" y="533.8" font-size="14.5" fill="#3a3226" textLength="49.8" lengthAdjust="spacing">vedere.</text>
<text x="462.0" y="470.7" font-size="14.5" fill="#3a3226" textLength="339.3" lengthAdjust="spacing">…………………………………………………………………………</text>
<text x="462.0" y="491.7" font-size="14.5" fill="#3a3226" textLength="339.3" lengthAdjust="spacing">…………………………………………………………………………</text>
<line x1="62.0" y1="544.1" x2="838.0" y2="544.1" stroke="#e3dccb"/>
<line x1="450.0" y1="180.1" x2="450.0" y2="544.1" stroke="#e3dccb"/>
<rect x="40" y="582.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="605.1" font-size="16" font-weight="700" fill="#ffffff">2. TEMA TEXTULUI</text>
<rect x="40" y="616.1" width="820" height="320.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="650.1" font-size="16" fill="#10233f" font-weight="700" textLength="41.4" lengthAdjust="spacing">Tema</text>
<text x="107.8" y="650.1" font-size="16" fill="#10233f" textLength="707.7" lengthAdjust="spacing">unui text oral sau scris este ideea centrală dezvoltată în cadrul acestuia. Pentru numirea temei se</text>
<text x="62.0" y="673.3" font-size="16" fill="#10233f" textLength="89.5" lengthAdjust="spacing">folosește un</text>
<text x="155.9" y="673.3" font-size="16" fill="#10233f" font-weight="700" textLength="80.2" lengthAdjust="spacing">substantiv</text>
<text x="236.1" y="673.3" font-size="16" fill="#10233f" textLength="4.5" lengthAdjust="spacing">.</text>
<text x="62.0" y="705.6" font-size="13.5" fill="#5b6b83" textLength="303.6" lengthAdjust="spacing">Definiția este din Unitatea I, p. 15, rubrica Repere.</text>
<text x="62.0" y="738.6" font-size="15" fill="#3a3226" textLength="157.6" lengthAdjust="spacing">Care este tema textului</text>
<text x="223.7" y="738.6" font-size="15" fill="#10233f" font-style="italic" textLength="51.3" lengthAdjust="spacing">Vizită…</text>
<text x="275.0" y="738.6" font-size="15" fill="#3a3226" textLength="465.5" lengthAdjust="spacing">? Pot alege dintre variantele din manual (ex. 7) sau pot propune alta:</text>
<rect x="62.0" y="757.1" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="784.1" font-size="15" fill="#0d9c92" font-weight="700" textLength="61.2" lengthAdjust="spacing">copilăria</text>
<rect x="326.0" y="757.1" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="784.1" font-size="15" fill="#6f5ea8" font-weight="700" textLength="118.2" lengthAdjust="spacing">educația copiilor</text>
<rect x="590.0" y="757.1" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="606.0" y="784.1" font-size="15" fill="#9a7433" font-weight="700" textLength="192.0" lengthAdjust="spacing">relația dintre copii și părinți</text>
<rect x="62.0" y="816.6" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
<text x="78.0" y="843.6" font-size="15" fill="#10233f" font-weight="700" textLength="52.9" lengthAdjust="spacing">jocurile</text>
<rect x="326.0" y="816.6" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="342.0" y="843.6" font-size="15" fill="#0d9c92" font-weight="700" textLength="47.4" lengthAdjust="spacing">familia</text>
<rect x="590.0" y="816.6" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="606.0" y="843.6" font-size="15" fill="#6f5ea8" font-weight="700" textLength="62.1" lengthAdjust="spacing">politețea</text>
<text x="62.0" y="889.2" font-size="15" fill="#3a3226" textLength="428.6" lengthAdjust="spacing">Tema aleasă de mine: …………………………………………………………</text>
<text x="62.0" y="913.9" font-size="15" fill="#3a3226" textLength="410.6" lengthAdjust="spacing">O justific astfel: ………………………………………………………………</text>
<rect x="40" y="956.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="979.4" font-size="16" font-weight="700" fill="#ffffff">3. CADRANELE (PROVOCĂRI, EX. 1)</text>
<rect x="40" y="990.4" width="820" height="184.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1023.4" font-size="15" fill="#3a3226" textLength="236.5" lengthAdjust="spacing">Completez cadranele pentru textul</text>
<text x="302.5" y="1023.4" font-size="15" fill="#10233f" font-style="italic" textLength="51.3" lengthAdjust="spacing">Vizită…</text>
<text x="353.8" y="1023.4" font-size="15" fill="#3a3226" textLength="4.2" lengthAdjust="spacing">.</text>
<rect x="62.0" y="1041.9" width="182.0" height="114.8" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="1069.9" font-size="16" fill="#0d9c92" font-weight="700" textLength="132.6" lengthAdjust="spacing">Mi-a plăcut textul</text>
<text x="78.0" y="1093.1" font-size="16" fill="#0d9c92" font-weight="700" textLength="99.6" lengthAdjust="spacing">pentru că ... .</text>
<text x="78.0" y="1116.4" font-size="14.5" fill="#3a3226" textLength="157.5" lengthAdjust="spacing">…………………………………</text>
<text x="78.0" y="1140.3" font-size="14.5" fill="#3a3226" textLength="157.5" lengthAdjust="spacing">…………………………………</text>
<rect x="260.0" y="1041.9" width="182.0" height="114.8" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="276.0" y="1069.9" font-size="16" fill="#6f5ea8" font-weight="700" textLength="128.1" lengthAdjust="spacing">Nu mi-a plăcut în</text>
<text x="276.0" y="1093.1" font-size="16" fill="#6f5ea8" font-weight="700" textLength="78.7" lengthAdjust="spacing">text că ... .</text>
<text x="276.0" y="1116.4" font-size="14.5" fill="#3a3226" textLength="157.5" lengthAdjust="spacing">…………………………………</text>
<text x="276.0" y="1140.3" font-size="14.5" fill="#3a3226" textLength="157.5" lengthAdjust="spacing">…………………………………</text>
<rect x="458.0" y="1041.9" width="182.0" height="114.8" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="474.0" y="1069.9" font-size="16" fill="#9a7433" font-weight="700" textLength="129.7" lengthAdjust="spacing">Nu am înțeles din</text>
<text x="474.0" y="1093.1" font-size="16" fill="#9a7433" font-weight="700" textLength="56.8" lengthAdjust="spacing">text ... .</text>
<text x="474.0" y="1116.4" font-size="14.5" fill="#3a3226" textLength="157.5" lengthAdjust="spacing">…………………………………</text>
<text x="474.0" y="1140.3" font-size="14.5" fill="#3a3226" textLength="157.5" lengthAdjust="spacing">…………………………………</text>
<rect x="656.0" y="1041.9" width="182.0" height="114.8" rx="12" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
<text x="672.0" y="1069.9" font-size="16" fill="#10233f" font-weight="700" textLength="141.0" lengthAdjust="spacing">Textul mi-a amintit</text>
<text x="672.0" y="1093.1" font-size="16" fill="#10233f" font-weight="700" textLength="46.5" lengthAdjust="spacing">de ... .</text>
<text x="672.0" y="1116.4" font-size="14.5" fill="#3a3226" textLength="157.5" lengthAdjust="spacing">…………………………………</text>
<text x="672.0" y="1140.3" font-size="14.5" fill="#3a3226" textLength="157.5" lengthAdjust="spacing">…………………………………</text>
<rect x="40" y="1194.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1217.7" font-size="16" font-weight="700" fill="#ffffff">4. AUTOEVALUARE L1 – L5</text>
<rect x="40" y="1228.7" width="820" height="304.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1261.7" font-size="15" fill="#3a3226" textLength="285.6" lengthAdjust="spacing">Completez, în caiet, următoarele afirmații:</text>
<rect x="62.0" y="1280.2" width="776.0" height="67.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="1308.2" font-size="16" fill="#0d9c92" font-weight="700" textLength="418.2" lengthAdjust="spacing">Din ceea ce am învățat, cel mai important mi se pare … .</text>
<text x="78.0" y="1331.5" font-size="14.5" fill="#3a3226" textLength="702.8" lengthAdjust="spacing">…………………………………………………………………………………………………………………………………………………………</text>
<rect x="62.0" y="1363.8" width="776.0" height="67.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="1391.8" font-size="16" fill="#6f5ea8" font-weight="700" textLength="293.7" lengthAdjust="spacing">Cel mai mult mi-a plăcut activitatea … .</text>
<text x="78.0" y="1415.1" font-size="14.5" fill="#3a3226" textLength="702.8" lengthAdjust="spacing">…………………………………………………………………………………………………………………………………………………………</text>
<rect x="62.0" y="1447.5" width="776.0" height="67.7" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="78.0" y="1475.5" font-size="16" fill="#9a7433" font-weight="700" textLength="223.6" lengthAdjust="spacing">Cel mai dificil mi s-a părut … .</text>
<text x="78.0" y="1498.8" font-size="14.5" fill="#3a3226" textLength="702.8" lengthAdjust="spacing">…………………………………………………………………………………………………………………………………………………………</text>
<text x="46.0" y="1564.6" font-size="11.5" fill="#5b6b83" textLength="807.9" lengthAdjust="spacing">Sursa: Manual Art 5, p. 50 (Interpretare ex. 2, 3, 4, 7, 8; Provocări ex. 1; Autoevaluare L1 – L5) și p. 15 (definiția temei, rubrica Repere). Lecția nu are rubrica</text>
<text x="280.8" y="1581.3" font-size="11.5" fill="#5b6b83" textLength="338.5" lengthAdjust="spacing">Repere. Rândurile de completat sunt create pentru aceste notițe.</text>
</svg>
