<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="320" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Verbul auxiliar a avea. Participiul. Perfectul compus</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, Lecția 13</text>
  <rect x="150" y="95" width="600" height="80" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="450" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Formare</text>
  <text font-size="12" fill="#3a3226" text-anchor="middle"><tspan x="450" y="147">verb auxiliar a avea (am, ai, a, am, ați, au) + participiul verbului</tspan></text>
  <rect x="180" y="195" width="540" height="50" rx="12" fill="#eaf6f4"/>
  <text x="450" y="225" text-anchor="middle" font-size="13" fill="#3a3226" font-style="italic">am jucat, ai jucat, a jucat...</text>
  <text x="450" y="284" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 13, p. 66</text>
</svg>
