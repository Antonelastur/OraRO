<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="640" fill="#faf7f0"/>
<text x="101.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="699.2" lengthAdjust="spacing">Prezentarea textului: conceperea unui material grafic</text>
<text x="232.6" y="74.4" font-size="14" fill="#5b6b83" textLength="434.8" lengthAdjust="spacing">Clasa a V-a · Unitatea VI, Lecția 14 · Manual, p. 188 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CUM FAC MATERIALUL GRAFIC</text>
<rect x="40" y="128.6" width="820" height="129.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" font-weight="700">1.</text>
<text x="81.0" y="161.6" font-size="15" fill="#3a3226" textLength="402.1" lengthAdjust="spacing">Aleg ce vreau să arăt: un loc, un drum, o clădire, un program.</text>
<text x="62.0" y="186.3" font-size="15" fill="#3a3226" font-weight="700">2.</text>
<text x="81.0" y="186.3" font-size="15" fill="#3a3226" textLength="499.9" lengthAdjust="spacing">Aleg forma potrivită: desen, hartă, schemă cu săgeți, plan văzut de sus, orar.</text>
<text x="62.0" y="211.1" font-size="15" fill="#3a3226" font-weight="700">3.</text>
<text x="81.0" y="211.1" font-size="15" fill="#3a3226" textLength="292.7" lengthAdjust="spacing">Îl fac clar: titlu, legendă, săgeți, culori puține.</text>
<text x="62.0" y="235.8" font-size="15" fill="#3a3226" font-weight="700">4.</text>
<text x="81.0" y="235.8" font-size="15" fill="#3a3226" textLength="263.4" lengthAdjust="spacing">Îl așez lângă paragraful la care se referă.</text>
<rect x="40" y="278.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="301.4" font-size="16" font-weight="700" fill="#ffffff">2. JURNALUL DE CĂLĂTORIE</text>
<rect x="40" y="312.4" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="345.4" font-size="15" fill="#3a3226" textLength="648.1" lengthAdjust="spacing">Într-un jurnal de călătorie pot lipi cărți poștale, bilete, hărți, fotografii, desene, și lângă fiecare scriu</text>
<text x="714.2" y="345.4" font-size="15" fill="#3a3226" font-weight="700" textLength="31.4" lengthAdjust="spacing">data</text>
<text x="745.5" y="345.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">,</text>
<text x="752.9" y="345.4" font-size="15" fill="#3a3226" font-weight="700" textLength="15.3" lengthAdjust="spacing">ce</text>
<text x="62.0" y="367.1" font-size="15" fill="#3a3226" font-weight="700" textLength="72.0" lengthAdjust="spacing">reprezintă</text>
<text x="138.1" y="367.1" font-size="15" fill="#3a3226" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="152.0" y="367.1" font-size="15" fill="#3a3226" font-weight="700" textLength="68.7" lengthAdjust="spacing">impresiile</text>
<text x="224.8" y="367.1" font-size="15" fill="#3a3226" textLength="35.4" lengthAdjust="spacing">mele.</text>
<rect x="40" y="409.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="432.6" font-size="16" font-weight="700" fill="#ffffff">3. O CERCETARE DESPRE LOCALITATEA MEA</text>
<rect x="40" y="443.6" width="820" height="145.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="461.6" width="380.0" height="109.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="489.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="121.6" lengthAdjust="spacing">de ce am nevoie</text>
<text x="78.0" y="512.9" font-size="14.5" fill="#3a3226" textLength="326.5" lengthAdjust="spacing">aparat foto sau telefon, computer, carnet de notițe,</text>
<text x="78.0" y="533.9" font-size="14.5" fill="#3a3226" textLength="320.4" lengthAdjust="spacing">creioane pentru schițe și hărți, atenție la ce e în jur</text>
<rect x="458.0" y="461.6" width="380.0" height="109.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="489.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="43.2" lengthAdjust="spacing">ce fac</text>
<text x="474.0" y="512.9" font-size="14.5" fill="#3a3226" textLength="317.3" lengthAdjust="spacing">observ un loc, vorbesc cu oamenii, fotografiez din</text>
<text x="474.0" y="533.9" font-size="14.5" fill="#3a3226" textLength="318.0" lengthAdjust="spacing">unghiuri diferite, aleg 4-6 imagini, le lipesc și scriu</text>
<text x="474.0" y="555.0" font-size="14.5" fill="#3a3226" textLength="122.7" lengthAdjust="spacing">lângă ele impresiile</text>
<text x="251.6" y="620.8" font-size="11.5" fill="#5b6b83" textLength="396.9" lengthAdjust="spacing">Sursa: Manual Art 5, p. 188 (sarcinile, rubrica Repere și proiectul de portofoliu).</text>
</svg>
