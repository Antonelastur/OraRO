<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="750" fill="#faf7f0"/>
<text x="83.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="735.3" lengthAdjust="spacing">Prezentarea textului: desene, grafice, fotografii, scheme</text>
<text x="214.3" y="74.4" font-size="14" fill="#5b6b83" textLength="471.4" lengthAdjust="spacing">Clasa a V-a · Unitatea VI, Lecția 13 · Manual, pp. 187-188 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL ÎNSOȚIT DE IMAGINI</text>
<rect x="40" y="128.6" width="820" height="112.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" textLength="432.1" lengthAdjust="spacing">Într-o compunere narativă sau descriptivă se pot integra, prin</text>
<text x="498.4" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="35.0" lengthAdjust="spacing">colaj</text>
<text x="533.5" y="162.6" font-size="16" fill="#10233f" textLength="251.5" lengthAdjust="spacing">, desene, fotografii, grafice, scheme.</text>
<text x="62.0" y="196.4" font-size="15" fill="#3a3226" textLength="91.8" lengthAdjust="spacing">Astfel cititorul</text>
<text x="157.8" y="196.4" font-size="15" fill="#3a3226" font-weight="700" textLength="33.6" lengthAdjust="spacing">vede</text>
<text x="195.5" y="196.4" font-size="15" fill="#3a3226" textLength="603.7" lengthAdjust="spacing">locurile, obiceiurile, peisajele, monumentele, oamenii despre care vorbește textul. Pagina dă</text>
<text x="62.0" y="218.1" font-size="15" fill="#3a3226" textLength="119.5" lengthAdjust="spacing">impresia unui fapt</text>
<text x="185.6" y="218.1" font-size="15" fill="#3a3226" font-weight="700" textLength="59.7" lengthAdjust="spacing">viu, trăit</text>
<text x="245.3" y="218.1" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="260.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="283.6" font-size="16" font-weight="700" fill="#ffffff">2. CE POT ADĂUGA</text>
<rect x="40" y="294.6" width="820" height="231.8" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="312.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="334.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="105.3" lengthAdjust="spacing">Materialul grafic</text>
<text x="345.6" y="334.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="99.9" lengthAdjust="spacing">Pentru ce e bun</text>
<line x1="62.0" y1="344.2" x2="838.0" y2="344.2" stroke="#e3dccb"/>
<text x="74.0" y="366.7" font-size="14.5" fill="#3a3226" textLength="119.8" lengthAdjust="spacing">fotografia, desenul</text>
<text x="345.6" y="366.7" font-size="14.5" fill="#3a3226" textLength="222.1" lengthAdjust="spacing">arată un peisaj, o clădire, un obiect</text>
<line x1="62.0" y1="377.1" x2="838.0" y2="377.1" stroke="#e3dccb"/>
<text x="74.0" y="399.5" font-size="14.5" fill="#3a3226" textLength="33.1" lengthAdjust="spacing">harta</text>
<text x="345.6" y="399.5" font-size="14.5" fill="#3a3226" textLength="181.7" lengthAdjust="spacing">arată unde se află localitățile</text>
<line x1="62.0" y1="409.9" x2="838.0" y2="409.9" stroke="#e3dccb"/>
<text x="74.0" y="432.4" font-size="14.5" fill="#3a3226" textLength="118.9" lengthAdjust="spacing">schema unui drum</text>
<text x="345.6" y="432.4" font-size="14.5" fill="#3a3226" textLength="142.8" lengthAdjust="spacing">arată traseul, cu săgeți</text>
<line x1="62.0" y1="442.8" x2="838.0" y2="442.8" stroke="#e3dccb"/>
<text x="74.0" y="465.2" font-size="14.5" fill="#3a3226" textLength="113.0" lengthAdjust="spacing">planul unei clădiri</text>
<text x="345.6" y="465.2" font-size="14.5" fill="#3a3226" textLength="304.8" lengthAdjust="spacing">arată cum sunt așezate încăperile, văzute de sus</text>
<line x1="62.0" y1="475.6" x2="838.0" y2="475.6" stroke="#e3dccb"/>
<text x="74.0" y="498.1" font-size="14.5" fill="#3a3226" textLength="37.8" lengthAdjust="spacing">orarul</text>
<text x="345.6" y="498.1" font-size="14.5" fill="#3a3226" textLength="146.2" lengthAdjust="spacing">arată ce se face și când</text>
<line x1="62.0" y1="508.4" x2="838.0" y2="508.4" stroke="#e3dccb"/>
<line x1="333.6" y1="312.6" x2="333.6" y2="508.4" stroke="#e3dccb"/>
<rect x="40" y="546.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="569.4" font-size="16" font-weight="700" fill="#ffffff">3. REGULA DE AUR</text>
<rect x="40" y="580.4" width="820" height="118.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="598.4" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="598.4" width="6" height="82.7" rx="3" fill="#b4432c"/><text x="84.0" y="624.9" font-size="14.5" fill="#b4432c" font-weight="700" textLength="54.8" lengthAdjust="spacing">Atenție!</text>
<text x="84.0" y="643.8" font-size="14.5" fill="#3a3226" textLength="38.4" lengthAdjust="spacing">Textul</text>
<text x="126.3" y="643.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="65.7" lengthAdjust="spacing">nu repetă</text>
<text x="195.9" y="643.8" font-size="14.5" fill="#3a3226" textLength="118.3" lengthAdjust="spacing">imaginea. Nu scriu</text>
<text x="318.2" y="643.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="194.7" lengthAdjust="spacing">„Acesta este un câmp cu maci.”</text>
<text x="512.8" y="643.8" font-size="14.5" fill="#3a3226" textLength="307.3" lengthAdjust="spacing">, ci spun ce nu se vede: ce am simțit, ce am aflat,</text>
<text x="84.0" y="664.8" font-size="14.5" fill="#3a3226" textLength="144.0" lengthAdjust="spacing">ce s-a întâmplat acolo.</text>
<text x="276.8" y="730.7" font-size="11.5" fill="#5b6b83" textLength="346.5" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 187-188, rubrica Repere și sarcinile de lucru.</text>
</svg>
