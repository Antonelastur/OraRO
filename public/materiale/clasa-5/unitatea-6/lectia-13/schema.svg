<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="596" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Textul și imaginea, împreună</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea VI · Redactare</text>
  <rect x="36" y="96" width="928" height="58" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="56" y="120" font-size="13" font-weight="700" fill="#10233f">Prin colaj, într-o compunere narativă sau descriptivă poți integra desene, fotografii, grafice, scheme</text>
  <text x="56" y="140" font-size="12" fill="#3d4a5f">Pagina astfel construită dă impresia faptului viu, trăit.</text>
  <rect x="36" y="166" width="458" height="34" rx="10" fill="#3b5fa8"/>
  <text x="265" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CE ADUC IMAGINILE</text>
  <rect x="36" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Cititorul vede singur</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">locurile, obiceiurile, peisajele, oamenii</text>
  <rect x="36" y="282" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="306" font-size="13" font-weight="700" fill="#10233f">Atmosfera și detaliile</text>
  <text x="56" y="326" font-size="12" fill="#3d4a5f">își închipuie mai bine ce trăiesc personajele</text>
  <rect x="36" y="352" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="376" font-size="13" font-weight="700" fill="#10233f">Faptul viu</text>
  <text x="56" y="396" font-size="12" fill="#3d4a5f">pagina pare trăită, nu doar povestită</text>
  <rect x="506" y="166" width="458" height="34" rx="10" fill="#a1417e"/>
  <text x="735" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CE MATERIAL GRAFIC ALEG</text>
  <rect x="506" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="236" font-size="13" font-weight="700" fill="#10233f">Desen</text>
  <text x="526" y="256" font-size="12" fill="#3d4a5f">un peisaj, un personaj, o copertă</text>
  <rect x="506" y="282" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="306" font-size="13" font-weight="700" fill="#10233f">Hartă sau schemă</text>
  <text x="526" y="326" font-size="12" fill="#3d4a5f">un traseu, cu săgeți și repere</text>
  <rect x="506" y="352" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="376" font-size="13" font-weight="700" fill="#10233f">Plan</text>
  <text x="526" y="396" font-size="12" fill="#3d4a5f">o clădire văzută de sus</text>
  <rect x="506" y="422" width="458" height="58" rx="12" fill="#ffffff" stroke="#a1417e" stroke-width="2"/>
  <text x="526" y="446" font-size="13" font-weight="700" fill="#10233f">Fotografie</text>
  <text x="526" y="466" font-size="12" fill="#3d4a5f">locul real, din mai multe unghiuri</text>
  <rect x="36" y="492" width="928" height="58" rx="12" fill="#ffffff" stroke="#c1503a" stroke-width="2"/>
  <text x="56" y="516" font-size="13" font-weight="700" fill="#10233f">Capcana</text>
  <text x="56" y="536" font-size="12" fill="#3d4a5f">Textul nu repetă imaginea. Nu scrii „Acesta este un câmp cu maci.”, ci ce nu se vede în poză: ce ai simțit, ce ai aflat.</text>
  <text x="500" y="582" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 9, pp. 187-188</text>
</svg>
