<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1006" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1006" fill="#faf7f0"/>
<text x="253.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="389.0" lengthAdjust="spacing">Jurnalul Monicăi: fișa de date</text>
<text x="210.7" y="74.4" font-size="14" fill="#5b6b83" textLength="478.7" lengthAdjust="spacing">Clasa a V-a · Unitatea VI, Lecția 1 · Manual, pp. 168-170 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CARTEA DE IDENTITATE A JURNALULUI</text>
<rect x="40" y="128.6" width="820" height="252.8" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.8" lengthAdjust="spacing">Întrebarea</text>
<text x="268.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="139.8" lengthAdjust="spacing">Răspunsul din manual</text>
<line x1="62.0" y1="178.2" x2="838.0" y2="178.2" stroke="#e3dccb"/>
<text x="74.0" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="76.5" lengthAdjust="spacing">Cine scrie?</text>
<text x="268.0" y="200.7" font-size="14.5" fill="#3a3226" textLength="424.9" lengthAdjust="spacing">Monica, elevă în clasa a V-a la o școală gimnazială din București</text>
<line x1="62.0" y1="211.0" x2="838.0" y2="211.0" stroke="#e3dccb"/>
<text x="74.0" y="233.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="132.1" lengthAdjust="spacing">Cui i se adresează?</text>
<text x="268.0" y="233.5" font-size="14.5" fill="#3a3226" textLength="84.3" lengthAdjust="spacing">Jurnalului ei:</text>
<text x="356.2" y="233.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="61.9" lengthAdjust="spacing">Jurnalule</text>
<text x="422.0" y="233.5" font-size="14.5" fill="#3a3226" textLength="53.9" lengthAdjust="spacing">(p. 168),</text>
<text x="479.9" y="233.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="102.2" lengthAdjust="spacing">Dragă jurnalule</text>
<text x="586.0" y="233.5" font-size="14.5" fill="#3a3226" textLength="53.9" lengthAdjust="spacing">(p. 169),</text>
<text x="643.9" y="233.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="131.2" lengthAdjust="spacing">Drăguțul meu jurnal</text>
<text x="779.0" y="233.5" font-size="14.5" fill="#3a3226" textLength="17.7" lengthAdjust="spacing">(p.</text>
<text x="268.0" y="254.5" font-size="14.5" fill="#3a3226" textLength="27.4" lengthAdjust="spacing">170)</text>
<line x1="62.0" y1="264.9" x2="838.0" y2="264.9" stroke="#e3dccb"/>
<text x="74.0" y="287.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="43.9" lengthAdjust="spacing">Când?</text>
<text x="268.0" y="287.4" font-size="14.5" fill="#3a3226" textLength="319.4" lengthAdjust="spacing">pe parcursul celor trei zile ale excursiei tematice</text>
<text x="591.3" y="287.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="149.3" lengthAdjust="spacing">Din carte spre departe</text>
<line x1="62.0" y1="297.7" x2="838.0" y2="297.7" stroke="#e3dccb"/>
<text x="74.0" y="320.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="44.0" lengthAdjust="spacing">Unde?</text>
<text x="268.0" y="320.2" font-size="14.5" fill="#3a3226" textLength="355.6" lengthAdjust="spacing">în excursie, în trei orașe: Alba Iulia, Brașov, Târgoviște</text>
<line x1="62.0" y1="330.6" x2="838.0" y2="330.6" stroke="#e3dccb"/>
<text x="74.0" y="353.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="46.3" lengthAdjust="spacing">De ce?</text>
<text x="268.0" y="353.1" font-size="14.5" fill="#3a3226" textLength="240.6" lengthAdjust="spacing">a scris la solicitarea profesoarei sale</text>
<line x1="62.0" y1="363.4" x2="838.0" y2="363.4" stroke="#e3dccb"/>
<line x1="256.0" y1="146.6" x2="256.0" y2="363.4" stroke="#e3dccb"/>
<rect x="40" y="401.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="424.4" font-size="16" font-weight="700" fill="#ffffff">2. TREI ZILE, TREI ORAȘE</text>
<rect x="40" y="435.4" width="820" height="240.3" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="453.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="474.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="27.9" lengthAdjust="spacing">Ziua</text>
<text x="229.2" y="474.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="41.7" lengthAdjust="spacing">Orașul</text>
<text x="361.1" y="474.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="168.7" lengthAdjust="spacing">Locurile pomenite în jurnal</text>
<line x1="62.0" y1="485.0" x2="838.0" y2="485.0" stroke="#e3dccb"/>
<text x="74.0" y="507.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="83.6" lengthAdjust="spacing">vineri, 6 mai</text>
<text x="229.2" y="507.5" font-size="14.5" fill="#3a3226" textLength="60.3" lengthAdjust="spacing">Alba Iulia</text>
<text x="361.1" y="507.5" font-size="14.5" fill="#3a3226" textLength="454.0" lengthAdjust="spacing">Via Principalis, Palatul Principilor, catedrala, Poarta a treia, Biblioteca</text>
<text x="361.1" y="528.5" font-size="14.5" fill="#3a3226" textLength="140.0" lengthAdjust="spacing">Batthyaneum, librăria</text>
<line x1="62.0" y1="538.8" x2="838.0" y2="538.8" stroke="#e3dccb"/>
<text x="74.0" y="561.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="103.0" lengthAdjust="spacing">sâmbătă, 7 mai</text>
<text x="229.2" y="561.3" font-size="14.5" fill="#3a3226" textLength="45.7" lengthAdjust="spacing">Brașov</text>
<text x="361.1" y="561.3" font-size="14.5" fill="#3a3226" textLength="437.8" lengthAdjust="spacing">pensiunea, Șcheii Brașovului, Muzeul „Prima Școală Românească”</text>
<line x1="62.0" y1="571.7" x2="838.0" y2="571.7" stroke="#e3dccb"/>
<text x="74.0" y="594.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="108.0" lengthAdjust="spacing">duminică, 8 mai</text>
<text x="229.2" y="594.2" font-size="14.5" fill="#3a3226" textLength="69.0" lengthAdjust="spacing">Târgoviște</text>
<text x="361.1" y="594.2" font-size="14.5" fill="#3a3226" textLength="462.4" lengthAdjust="spacing">Curtea Domnească, Turnul Chindiei, Muzeul Tiparului și al Cărții Vechi</text>
<text x="361.1" y="615.2" font-size="14.5" fill="#3a3226" textLength="69.2" lengthAdjust="spacing">Românești</text>
<line x1="62.0" y1="625.6" x2="838.0" y2="625.6" stroke="#e3dccb"/>
<line x1="217.2" y1="453.4" x2="217.2" y2="625.6" stroke="#e3dccb"/>
<line x1="349.1" y1="453.4" x2="349.1" y2="625.6" stroke="#e3dccb"/>
<text x="62.0" y="653.6" font-size="14" fill="#5b6b83" textLength="490.9" lengthAdjust="spacing">Fiecare zi are o intrare nouă, cu data în față. Textul dă ziua și luna, nu și anul.</text>
<rect x="40" y="695.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="718.8" font-size="16" font-weight="700" fill="#ffffff">3. CUVINTE LĂMURITE ÎN TEXT</text>
<rect x="40" y="729.8" width="820" height="208.2" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="747.8" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="769.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">Cuvântul</text>
<text x="229.2" y="769.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="121.7" lengthAdjust="spacing">Ce spune manualul</text>
<text x="725.8" y="769.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="33.7" lengthAdjust="spacing">Unde</text>
<line x1="62.0" y1="779.3" x2="838.0" y2="779.3" stroke="#e3dccb"/>
<text x="74.0" y="801.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="88.2" lengthAdjust="spacing">incunabulele</text>
<text x="229.2" y="801.8" font-size="14.5" fill="#3a3226" textLength="462.9" lengthAdjust="spacing">exemplare din cărțile tipărite în primii ani ai introducerii tiparului, adică</text>
<text x="229.2" y="822.8" font-size="14.5" fill="#3a3226" textLength="132.2" lengthAdjust="spacing">înainte de anul 1500</text>
<text x="725.8" y="801.8" font-size="14.5" fill="#3a3226" textLength="39.7" lengthAdjust="spacing">p. 169</text>
<text x="725.8" y="822.8" font-size="14.5" fill="#3a3226" textLength="59.0" lengthAdjust="spacing">(Monica)</text>
<line x1="62.0" y1="833.2" x2="838.0" y2="833.2" stroke="#e3dccb"/>
<text x="74.0" y="855.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="53.2" lengthAdjust="spacing">slavona</text>
<text x="229.2" y="855.7" font-size="14.5" fill="#3a3226" textLength="465.5" lengthAdjust="spacing">o limbă veche în care se foloseau caracterele chirilice în care s-a scris</text>
<text x="229.2" y="876.7" font-size="14.5" fill="#3a3226" textLength="50.0" lengthAdjust="spacing">și la noi</text>
<text x="725.8" y="855.7" font-size="14.5" fill="#3a3226" textLength="38.8" lengthAdjust="spacing">p. 170</text>
<text x="725.8" y="876.7" font-size="14.5" fill="#3a3226" textLength="59.0" lengthAdjust="spacing">(Monica)</text>
<line x1="62.0" y1="887.1" x2="838.0" y2="887.1" stroke="#e3dccb"/>
<text x="74.0" y="909.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="112.4" lengthAdjust="spacing">Neagoe Basarab</text>
<text x="229.2" y="909.6" font-size="14.5" fill="#3a3226" textLength="330.0" lengthAdjust="spacing">a fost domnitorul Țării Românești între 1512 și 1521</text>
<text x="725.8" y="909.6" font-size="14.5" fill="#3a3226" textLength="91.9" lengthAdjust="spacing">p. 170 (nota 1)</text>
<line x1="62.0" y1="919.9" x2="838.0" y2="919.9" stroke="#e3dccb"/>
<line x1="217.2" y1="747.8" x2="217.2" y2="919.9" stroke="#e3dccb"/>
<line x1="713.8" y1="747.8" x2="713.8" y2="919.9" stroke="#e3dccb"/>
<text x="60.9" y="969.4" font-size="11.5" fill="#5b6b83" textLength="778.2" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 168-170, jurnalul Monicăi (caseta de la p. 168, explicațiile Monicăi de la pp. 169-170, nota 1 de la p. 170). Manualul nu dă anul</text>
<text x="424.9" y="986.1" font-size="11.5" fill="#5b6b83" textLength="50.1" lengthAdjust="spacing">excursiei.</text>
</svg>
