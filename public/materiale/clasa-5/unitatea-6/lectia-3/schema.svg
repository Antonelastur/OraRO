<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1251" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1251" fill="#faf7f0"/>
<text x="96.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="696.0" lengthAdjust="spacing">Semnificațiile textului: jocul X și O și pagina de jurnal</text>
<text x="209.8" y="74.4" font-size="14" fill="#5b6b83" textLength="480.5" lengthAdjust="spacing">Clasa a V-a · Unitatea VI, Lecția 3 · Manual, pp. 172-173 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. JOCUL X ȘI O: GRILA DIN CAIET</text>
<rect x="40" y="128.6" width="820" height="372.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="733.7" lengthAdjust="spacing">Desenez pe pagina întreagă a caietului un tabel cu nouă căsuțe, trei rânduri și trei coloane, cu aceste titluri:</text>
<rect x="62.0" y="180.1" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="207.1" font-size="15" fill="#0d9c92" font-weight="700" textLength="151.0" lengthAdjust="spacing">FAPTE INTERESANTE</text>
<rect x="326.0" y="180.1" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="342.0" y="207.1" font-size="15" fill="#0d9c92" font-weight="700" textLength="85.2" lengthAdjust="spacing">INFORMAȚII</text>
<rect x="590.0" y="180.1" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="606.0" y="207.1" font-size="15" fill="#0d9c92" font-weight="700" textLength="43.8" lengthAdjust="spacing">OPINII</text>
<rect x="62.0" y="239.6" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="78.0" y="266.6" font-size="15" fill="#6f5ea8" font-weight="700" textLength="42.8" lengthAdjust="spacing">TEMA</text>
<rect x="326.0" y="239.6" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="342.0" y="266.6" font-size="15" fill="#6f5ea8" font-weight="700" textLength="91.4" lengthAdjust="spacing">VOCABULAR</text>
<rect x="590.0" y="239.6" width="248.0" height="43.5" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="606.0" y="266.6" font-size="15" fill="#6f5ea8" font-weight="700" textLength="54.9" lengthAdjust="spacing">DETALII</text>
<rect x="62.0" y="299.1" width="248.0" height="66.3" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="78.0" y="326.1" font-size="15" fill="#9a7433" font-weight="700" textLength="77.2" lengthAdjust="spacing">ÎNTREBĂRI</text>
<rect x="326.0" y="299.1" width="248.0" height="66.3" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="342.0" y="326.1" font-size="15" fill="#9a7433" font-weight="700" textLength="57.9" lengthAdjust="spacing">IMAGINI</text>
<rect x="590.0" y="299.1" width="248.0" height="66.3" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="606.0" y="326.1" font-size="15" fill="#9a7433" font-weight="700" textLength="54.0" lengthAdjust="spacing">SUMAR</text>
<text x="606.0" y="349.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="199.1" lengthAdjust="spacing">cine? ce? când? unde? de ce?</text>
<rect x="62.0" y="379.4" width="776.0" height="103.8" rx="12" fill="#f3efe4"/><text x="78.0" y="405.9" font-size="14.5" fill="#10233f" font-weight="700" textLength="212.1" lengthAdjust="spacing">Regula jocului (manual, p. 172):</text>
<text x="78.0" y="424.8" font-size="14.5" fill="#3a3226" textLength="682.5" lengthAdjust="spacing">Fiecare dintre voi marchează pe rând, în tabelul din caiet, câte o căsuță, răspunzând la cerința asociată</text>
<text x="78.0" y="445.8" font-size="14.5" fill="#3a3226" textLength="712.7" lengthAdjust="spacing">acesteia, notată în tabelul de mai jos. Câștigă cel care reușește primul să marcheze trei căsuțe adiacente pe</text>
<text x="78.0" y="466.9" font-size="14.5" fill="#3a3226" textLength="271.1" lengthAdjust="spacing">orizontală, pe verticală sau pe diagonală.</text>
<rect x="40" y="521.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="544.2" font-size="16" font-weight="700" fill="#ffffff">2. CUM SCRIU O PAGINĂ DE JURNAL</text>
<rect x="40" y="555.2" width="820" height="242.4" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="573.2" width="776.0" height="103.8" rx="12" fill="#f3efe4"/><text x="78.0" y="599.7" font-size="14.5" fill="#10233f" font-weight="700" textLength="183.5" lengthAdjust="spacing">Portofoliu (manual, p. 173):</text>
<text x="78.0" y="618.6" font-size="14.5" fill="#3a3226" textLength="739.7" lengthAdjust="spacing">Redactează o pagină de jurnal de cel mult 100 de cuvinte, în care să prezinți o experiență trăită de tine astăzi. Ai</text>
<text x="78.0" y="639.6" font-size="14.5" fill="#3a3226" textLength="651.9" lengthAdjust="spacing">în vedere că atunci când scrii un jurnal este important să notezi data, să utilizezi persoana I și să fii</text>
<text x="78.0" y="660.6" font-size="14.5" fill="#3a3226" textLength="97.6" lengthAdjust="spacing">sincer/sinceră.</text>
<rect x="62.0" y="691.0" width="182.0" height="88.7" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="719.0" font-size="16" fill="#0d9c92" font-weight="700" textLength="33.5" lengthAdjust="spacing">data</text>
<text x="78.0" y="742.2" font-size="14.5" fill="#3a3226" textLength="117.7" lengthAdjust="spacing">o notez la început</text>
<rect x="260.0" y="691.0" width="182.0" height="88.7" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="276.0" y="719.0" font-size="16" fill="#6f5ea8" font-weight="700" textLength="79.2" lengthAdjust="spacing">persoana I</text>
<text x="276.0" y="742.2" font-size="14.5" fill="#3a3226" textLength="118.6" lengthAdjust="spacing">scriu despre mine</text>
<rect x="458.0" y="691.0" width="182.0" height="88.7" rx="12" fill="#ffffff" stroke="#9a7433" stroke-width="2"/>
<text x="474.0" y="719.0" font-size="16" fill="#9a7433" font-weight="700" textLength="90.0" lengthAdjust="spacing">sinceritatea</text>
<text x="474.0" y="742.2" font-size="14.5" fill="#3a3226" textLength="104.5" lengthAdjust="spacing">spun ce simt cu</text>
<text x="474.0" y="763.3" font-size="14.5" fill="#3a3226" textLength="57.8" lengthAdjust="spacing">adevărat</text>
<rect x="656.0" y="691.0" width="182.0" height="88.7" rx="12" fill="#ffffff" stroke="#10233f" stroke-width="2"/>
<text x="672.0" y="719.0" font-size="16" fill="#10233f" font-weight="700" textLength="69.9" lengthAdjust="spacing">lungimea</text>
<text x="672.0" y="742.2" font-size="14.5" fill="#3a3226" textLength="100.3" lengthAdjust="spacing">cel mult 100 de</text>
<text x="672.0" y="763.3" font-size="14.5" fill="#3a3226" textLength="48.5" lengthAdjust="spacing">cuvinte</text>
<rect x="40" y="817.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="840.6" font-size="16" font-weight="700" fill="#ffffff">3. REALIZAREA-RECORD</text>
<rect x="40" y="851.6" width="820" height="332.1" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="883.6" font-size="14" fill="#5b6b83" textLength="763.4" lengthAdjust="spacing">Exercițiul 8: completez în caiet tabelul. Pe prima coloană scriu numele personalităților despre care Monica a aflat lucruri</text>
<text x="62.0" y="903.9" font-size="14" fill="#5b6b83" textLength="392.4" lengthAdjust="spacing">noi, pe a doua ce au înfăptuit și poate fi considerat un record.</text>
<rect x="62.0" y="922.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="943.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="135.9" lengthAdjust="spacing">Numele personalității</text>
<text x="384.4" y="943.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="114.3" lengthAdjust="spacing">Realizarea-record</text>
<line x1="62.0" y1="953.7" x2="838.0" y2="953.7" stroke="#e3dccb"/>
<text x="74.0" y="991.7" font-size="30" fill="#3a3226" textLength="8.2" lengthAdjust="spacing"> </text>
<text x="384.4" y="991.7" font-size="30" fill="#3a3226" textLength="8.2" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1006.7" x2="838.0" y2="1006.7" stroke="#e3dccb"/>
<text x="74.0" y="1044.7" font-size="30" fill="#3a3226" textLength="8.2" lengthAdjust="spacing"> </text>
<text x="384.4" y="1044.7" font-size="30" fill="#3a3226" textLength="8.2" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1059.7" x2="838.0" y2="1059.7" stroke="#e3dccb"/>
<text x="74.0" y="1097.7" font-size="30" fill="#3a3226" textLength="8.2" lengthAdjust="spacing"> </text>
<text x="384.4" y="1097.7" font-size="30" fill="#3a3226" textLength="8.2" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1112.7" x2="838.0" y2="1112.7" stroke="#e3dccb"/>
<text x="74.0" y="1150.7" font-size="30" fill="#3a3226" textLength="8.2" lengthAdjust="spacing"> </text>
<text x="384.4" y="1150.7" font-size="30" fill="#3a3226" textLength="8.2" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1165.7" x2="838.0" y2="1165.7" stroke="#e3dccb"/>
<line x1="372.4" y1="922.1" x2="372.4" y2="1165.7" stroke="#e3dccb"/>
<text x="49.5" y="1215.2" font-size="11.5" fill="#5b6b83" textLength="801.0" lengthAdjust="spacing">Sursa: Manual Art 5, p. 172 (Interpretare, ex. 1-2, regula jocului și cele nouă titluri) și p. 173 (ex. 8, Portofoliu). Tabelul de la secțiunea 3 rămâne gol pentru</text>
<text x="436.2" y="1231.8" font-size="11.5" fill="#5b6b83" textLength="27.6" lengthAdjust="spacing">elevi.</text>
</svg>
