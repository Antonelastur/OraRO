<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1271" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1271" fill="#faf7f0"/>
<text x="148.0" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="596.8" lengthAdjust="spacing">Scrisoarea III de Mihai Eminescu: fișa textului</text>
<text x="209.7" y="74.4" font-size="14" fill="#5b6b83" textLength="480.5" lengthAdjust="spacing">Clasa a V-a · Unitatea VI, Lecția 4 · Manual, pp. 174-175 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. FIȘA TEXTULUI</text>
<rect x="40" y="128.6" width="820" height="297.5" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="49.3" lengthAdjust="spacing">Rubrica</text>
<text x="268.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="56.3" lengthAdjust="spacing">Ce notez</text>
<line x1="62.0" y1="178.2" x2="838.0" y2="178.2" stroke="#e3dccb"/>
<text x="74.0" y="200.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.0" lengthAdjust="spacing">Autorul</text>
<text x="268.0" y="200.7" font-size="14.5" fill="#3a3226" textLength="351.7" lengthAdjust="spacing">Mihai Eminescu (1850-1889), „poetul nostru național”</text>
<line x1="62.0" y1="211.0" x2="838.0" y2="211.0" stroke="#e3dccb"/>
<text x="74.0" y="233.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="41.7" lengthAdjust="spacing">Opera</text>
<text x="268.0" y="233.5" font-size="14.5" fill="#3a3226" textLength="49.1" lengthAdjust="spacing">poemul</text>
<text x="321.1" y="233.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="87.3" lengthAdjust="spacing">Scrisoarea III</text>
<line x1="62.0" y1="243.8" x2="838.0" y2="243.8" stroke="#e3dccb"/>
<text x="74.0" y="266.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="78.0" lengthAdjust="spacing">Fragmentul</text>
<text x="268.0" y="266.4" font-size="14.5" fill="#3a3226" textLength="473.7" lengthAdjust="spacing">întâlnirea dintre Baiazid și Mircea cel Bătrân, înaintea luptei de la Rovine</text>
<line x1="62.0" y1="276.7" x2="838.0" y2="276.7" stroke="#e3dccb"/>
<text x="74.0" y="299.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="80.7" lengthAdjust="spacing">Personajele</text>
<text x="268.0" y="299.2" font-size="14.5" fill="#3a3226" textLength="221.4" lengthAdjust="spacing">Mircea cel Bătrân, Baiazid și solul</text>
<line x1="62.0" y1="309.6" x2="838.0" y2="309.6" stroke="#e3dccb"/>
<text x="74.0" y="332.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="50.0" lengthAdjust="spacing">Baiazid</text>
<text x="268.0" y="332.0" font-size="14.5" fill="#3a3226" textLength="332.7" lengthAdjust="spacing">sultan al Imperiului Otoman în perioada 1389-1402</text>
<line x1="62.0" y1="342.4" x2="838.0" y2="342.4" stroke="#e3dccb"/>
<text x="74.0" y="364.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="46.7" lengthAdjust="spacing">Rovine</text>
<text x="268.0" y="364.9" font-size="14.5" fill="#3a3226" textLength="442.1" lengthAdjust="spacing">lupta s-a petrecut în 1394 sau în 1395, după cum o datează istoricii</text>
<line x1="62.0" y1="375.2" x2="838.0" y2="375.2" stroke="#e3dccb"/>
<text x="74.0" y="397.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="132.7" lengthAdjust="spacing">Mircea la Eminescu</text>
<text x="268.0" y="397.8" font-size="14.5" fill="#3a3226" textLength="457.3" lengthAdjust="spacing">„un domnitor exemplar, al cărui singur scop este să-și slujească țara”</text>
<line x1="62.0" y1="408.1" x2="838.0" y2="408.1" stroke="#e3dccb"/>
<line x1="256.0" y1="146.6" x2="256.0" y2="408.1" stroke="#e3dccb"/>
<rect x="40" y="446.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="469.1" font-size="16" font-weight="700" fill="#ffffff">2. CUVINTE DIN NOTELE DE SUBSOL (p. 174)</text>
<rect x="40" y="480.1" width="820" height="166.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="498.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="519.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="57.6" lengthAdjust="spacing">Cuvântul</text>
<text x="384.4" y="519.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="98.1" lengthAdjust="spacing">Sensul din notă</text>
<line x1="62.0" y1="529.6" x2="838.0" y2="529.6" stroke="#e3dccb"/>
<text x="74.0" y="552.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="39.1" lengthAdjust="spacing">bănat</text>
<text x="117.1" y="552.1" font-size="14.5" fill="#3a3226" textLength="71.8" lengthAdjust="spacing">(s. n., reg.)</text>
<text x="384.4" y="552.1" font-size="14.5" fill="#3a3226" textLength="58.7" lengthAdjust="spacing">supărare</text>
<line x1="62.0" y1="562.5" x2="838.0" y2="562.5" stroke="#e3dccb"/>
<text x="74.0" y="585.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="61.5" lengthAdjust="spacing">Aliotman</text>
<text x="139.4" y="585.0" font-size="14.5" fill="#3a3226" textLength="64.3" lengthAdjust="spacing">(s. n., rar)</text>
<text x="384.4" y="585.0" font-size="14.5" fill="#3a3226" textLength="49.8" lengthAdjust="spacing">turcime</text>
<line x1="62.0" y1="595.4" x2="838.0" y2="595.4" stroke="#e3dccb"/>
<text x="74.0" y="617.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="43.7" lengthAdjust="spacing">pristol</text>
<text x="121.6" y="617.9" font-size="14.5" fill="#3a3226" textLength="37.9" lengthAdjust="spacing">(s. n.)</text>
<text x="384.4" y="617.9" font-size="14.5" fill="#3a3226" textLength="29.3" lengthAdjust="spacing">altar</text>
<line x1="62.0" y1="628.2" x2="838.0" y2="628.2" stroke="#e3dccb"/>
<line x1="372.4" y1="498.1" x2="372.4" y2="628.2" stroke="#e3dccb"/>
<rect x="40" y="666.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="689.2" font-size="16" font-weight="700" fill="#ffffff">3. TEXT LITERAR ȘI INFORMAȚIE ISTORICĂ</text>
<rect x="40" y="700.2" width="820" height="118.7" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="718.2" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><text x="78.0" y="744.7" font-size="14.5" fill="#10233f" font-weight="700" textLength="192.2" lengthAdjust="spacing">Exercițiul 3 (manual, p. 175):</text>
<text x="78.0" y="763.6" font-size="14.5" fill="#3a3226" textLength="742.6" lengthAdjust="spacing">Autorii textelor literare, chiar atunci când se inspiră din evenimente reale, precum cele istorice, nu sunt interesați</text>
<text x="78.0" y="784.6" font-size="14.5" fill="#3a3226" textLength="554.0" lengthAdjust="spacing">să redea exact informația istorică, ci să transmită anumite idei, atitudini, sentimente.</text>
<rect x="40" y="838.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="861.9" font-size="16" font-weight="700" fill="#ffffff">4. EXERCIȚIUL 4: IDEILE TEXTULUI</text>
<rect x="40" y="872.9" width="820" height="330.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="904.9" font-size="14" fill="#5b6b83" textLength="765.4" lengthAdjust="spacing">În perechi: împart textul în patru fragmente logice, aleg cuvântul-cheie al fiecăruia, formulez ideile principale, apoi ideile</text>
<text x="62.0" y="925.2" font-size="14" fill="#5b6b83" textLength="71.3" lengthAdjust="spacing">secundare.</text>
<rect x="62.0" y="943.4" width="776.0" height="51.1" fill="#efeaf8"/>
<text x="87.8" y="964.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="72.6" lengthAdjust="spacing">Fragmentul</text>
<text x="108.6" y="984.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="31.0" lengthAdjust="spacing">logic</text>
<text x="198.2" y="964.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="98.6" lengthAdjust="spacing">Cuvântul-cheie</text>
<text x="353.4" y="964.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="101.8" lengthAdjust="spacing">Ideea principală</text>
<text x="601.7" y="964.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="105.2" lengthAdjust="spacing">Ideile secundare</text>
<line x1="62.0" y1="994.6" x2="838.0" y2="994.6" stroke="#e3dccb"/>
<text x="118.7" y="1028.6" font-size="26" fill="#3a3226" font-weight="700" textLength="10.8" lengthAdjust="spacing">1</text>
<text x="198.2" y="1028.6" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<text x="353.4" y="1028.6" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<text x="601.7" y="1028.6" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1042.4" x2="838.0" y2="1042.4" stroke="#e3dccb"/>
<text x="116.2" y="1076.4" font-size="26" fill="#3a3226" font-weight="700" textLength="15.8" lengthAdjust="spacing">2</text>
<text x="198.2" y="1076.4" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<text x="353.4" y="1076.4" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<text x="601.7" y="1076.4" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1090.2" x2="838.0" y2="1090.2" stroke="#e3dccb"/>
<text x="116.0" y="1124.2" font-size="26" fill="#3a3226" font-weight="700" textLength="16.2" lengthAdjust="spacing">3</text>
<text x="198.2" y="1124.2" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<text x="353.4" y="1124.2" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<text x="601.7" y="1124.2" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1138.0" x2="838.0" y2="1138.0" stroke="#e3dccb"/>
<text x="115.6" y="1172.0" font-size="26" fill="#3a3226" font-weight="700" textLength="17.0" lengthAdjust="spacing">4</text>
<text x="198.2" y="1172.0" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<text x="353.4" y="1172.0" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<text x="601.7" y="1172.0" font-size="26" fill="#3a3226" textLength="7.1" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1185.8" x2="838.0" y2="1185.8" stroke="#e3dccb"/>
<line x1="186.2" y1="943.4" x2="186.2" y2="1185.8" stroke="#e3dccb"/>
<line x1="341.4" y1="943.4" x2="341.4" y2="1185.8" stroke="#e3dccb"/>
<line x1="589.7" y1="943.4" x2="589.7" y2="1185.8" stroke="#e3dccb"/>
<text x="48.6" y="1235.2" font-size="11.5" fill="#5b6b83" textLength="802.7" lengthAdjust="spacing">Sursa: Manual Art 5, p. 174 (textul de prezentare, notele 2, 3 și 6) și p. 175 (Discutarea textului, ex. 3, 4 și 5). Manualul dă pentru bătălia de la Rovine două</text>
<text x="230.6" y="1251.9" font-size="11.5" fill="#5b6b83" textLength="438.8" lengthAdjust="spacing">date; în schemă notăm doar anul. Tabelul de la secțiunea 4 rămâne gol pentru elevi.</text>
</svg>
