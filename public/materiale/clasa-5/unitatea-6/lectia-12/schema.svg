<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Tipuri de enunț</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea VI, Lecția 8</text>

  <g font-size="12" fill="#3a3226">
    <rect x="45" y="95" width="180" height="150" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="135" y="122" text-anchor="middle" font-weight="700" fill="#10233f">Asertiv</text>
    <text x="135" y="148" text-anchor="middle" font-size="11">transmite o</text>
    <text x="135" y="164" text-anchor="middle" font-size="11">informație</text>
    <text x="135" y="196" text-anchor="middle" font-style="italic">Trenul a ajuns.</text>
    <text x="135" y="216" text-anchor="middle" font-size="16" fill="#0d9c92">.</text>

    <rect x="255" y="95" width="180" height="150" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="345" y="122" text-anchor="middle" font-weight="700" fill="#10233f">Interogativ</text>
    <text x="345" y="148" text-anchor="middle" font-size="11">pune o</text>
    <text x="345" y="164" text-anchor="middle" font-size="11">întrebare</text>
    <text x="345" y="196" text-anchor="middle" font-style="italic">A ajuns trenul?</text>
    <text x="345" y="220" text-anchor="middle" font-size="18" fill="#0d9c92">?</text>

    <rect x="465" y="95" width="180" height="150" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="555" y="122" text-anchor="middle" font-weight="700" fill="#10233f">Imperativ</text>
    <text x="555" y="148" text-anchor="middle" font-size="11">dă o poruncă</text>
    <text x="555" y="164" text-anchor="middle" font-size="11">sau un îndemn</text>
    <text x="555" y="196" text-anchor="middle" font-style="italic">Urcă în tren!</text>
    <text x="555" y="220" text-anchor="middle" font-size="18" fill="#6f5ea8">!</text>

    <rect x="675" y="95" width="180" height="150" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="765" y="122" text-anchor="middle" font-weight="700" fill="#10233f">Exclamativ</text>
    <text x="765" y="148" text-anchor="middle" font-size="11">exprimă o</text>
    <text x="765" y="164" text-anchor="middle" font-size="11">emoție puternică</text>
    <text x="765" y="196" text-anchor="middle" font-style="italic">Ce călătorie!</text>
    <text x="765" y="220" text-anchor="middle" font-size="18" fill="#6f5ea8">!</text>
  </g>

  <text x="450" y="290" text-anchor="middle" font-size="12" fill="#3a3226">Semnul de punctuație de la final marchează tipul enunțului.</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 8, p. 186</text>
</svg>
