<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1192" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1192" fill="#faf7f0"/>
<text x="164.8" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="563.6" lengthAdjust="spacing">Formele cărții. Cum mă documentez online</text>
<text x="227.8" y="74.4" font-size="14" fill="#5b6b83" textLength="444.4" lengthAdjust="spacing">Clasa a V-a · Unitatea VI, Lecția 6 · Manual, p. 177 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. DE LA PAPIRUS LA ECRAN</text>
<rect x="40" y="128.6" width="820" height="376.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" textLength="750.4" lengthAdjust="spacing">papirus → pergament → hârtie → tiparul lui Gutenberg → culegerea automată → tiparul pe calculator →</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="54.4" lengthAdjust="spacing">ecranul</text>
<rect x="62.0" y="204.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="226.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="76.1" lengthAdjust="spacing">Forma cărții</text>
<text x="337.8" y="226.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="115.5" lengthAdjust="spacing">Ce spune articolul</text>
<line x1="62.0" y1="236.2" x2="838.0" y2="236.2" stroke="#e3dccb"/>
<text x="74.0" y="258.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="114.6" lengthAdjust="spacing">suluri de papirus</text>
<text x="337.8" y="258.6" font-size="14.5" fill="#3a3226" textLength="176.4" lengthAdjust="spacing">așa au fost cărțile mai întâi</text>
<line x1="62.0" y1="269.0" x2="838.0" y2="269.0" stroke="#e3dccb"/>
<text x="74.0" y="291.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="82.8" lengthAdjust="spacing">pergamente</text>
<text x="337.8" y="291.5" font-size="14.5" fill="#3a3226" textLength="482.6" lengthAdjust="spacing">din piele de vițel; au urmat după ce Imperiul Bizantin a pierdut Egiptul, de</text>
<text x="337.8" y="312.5" font-size="14.5" fill="#3a3226" textLength="168.1" lengthAdjust="spacing">unde veneau papirusurile</text>
<line x1="62.0" y1="322.9" x2="838.0" y2="322.9" stroke="#e3dccb"/>
<text x="74.0" y="345.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="40.1" lengthAdjust="spacing">hârtie</text>
<text x="337.8" y="345.4" font-size="14.5" fill="#3a3226" textLength="318.4" lengthAdjust="spacing">cărțile s-au mutat pe hârtie prin secolul al XI-lea</text>
<line x1="62.0" y1="355.7" x2="838.0" y2="355.7" stroke="#e3dccb"/>
<text x="74.0" y="378.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="140.0" lengthAdjust="spacing">tiparul lui Gutenberg</text>
<text x="337.8" y="378.2" font-size="14.5" fill="#3a3226" textLength="366.1" lengthAdjust="spacing">apoi au urmat Gutenberg și o mulțime de alte schimbări</text>
<line x1="62.0" y1="388.6" x2="838.0" y2="388.6" stroke="#e3dccb"/>
<text x="74.0" y="411.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="202.8" lengthAdjust="spacing">culegerea automată a textului</text>
<text x="337.8" y="411.1" font-size="14.5" fill="#3a3226" textLength="241.6" lengthAdjust="spacing">o altă schimbare de după Gutenberg</text>
<line x1="62.0" y1="421.4" x2="838.0" y2="421.4" stroke="#e3dccb"/>
<text x="74.0" y="443.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="136.7" lengthAdjust="spacing">tiparul pe calculator</text>
<text x="337.8" y="443.9" font-size="14.5" fill="#3a3226" textLength="241.6" lengthAdjust="spacing">o altă schimbare de după Gutenberg</text>
<line x1="62.0" y1="454.3" x2="838.0" y2="454.3" stroke="#e3dccb"/>
<text x="74.0" y="476.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.5" lengthAdjust="spacing">ecranul</text>
<text x="337.8" y="476.8" font-size="14.5" fill="#3a3226" textLength="395.0" lengthAdjust="spacing">mai nou, cărțile sunt scrise și citite pe ecranul calculatorului</text>
<line x1="62.0" y1="487.1" x2="838.0" y2="487.1" stroke="#e3dccb"/>
<line x1="325.8" y1="204.6" x2="325.8" y2="487.1" stroke="#e3dccb"/>
<rect x="40" y="525.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="548.1" font-size="16" font-weight="700" fill="#ffffff">2. CĂRȚILE NU MOR</text>
<rect x="40" y="559.1" width="820" height="249.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="577.1" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="603.6" font-size="14.5" fill="#10233f" font-weight="700" textLength="284.5" lengthAdjust="spacing">Teza autorului (Iulian Comănescu, p. 177):</text>
<text x="78.0" y="622.5" font-size="14.5" fill="#3a3226" textLength="533.9" lengthAdjust="spacing">Despre cărți: „nu vor muri, fiindcă au murit deja de nenumărate ori și au reînviat”.</text>
<rect x="62.0" y="652.8" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="679.3" font-size="14.5" fill="#10233f" font-weight="700" textLength="148.9" lengthAdjust="spacing">Încheierea articolului:</text>
<text x="78.0" y="698.2" font-size="14.5" fill="#3a3226" textLength="375.4" lengthAdjust="spacing">„Dar cărțile vor muri doar după ce va muri ultimul cititor.”</text>
<rect x="62.0" y="728.5" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="755.0" font-size="14.5" fill="#10233f" font-weight="700" textLength="164.8" lengthAdjust="spacing">Un argument din articol:</text>
<text x="78.0" y="773.9" font-size="14.5" fill="#3a3226" textLength="381.8" lengthAdjust="spacing">„Vânzările cresc […] și la cele clasice, de hârtie și carton.”</text>
<rect x="40" y="828.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="851.2" font-size="16" font-weight="700" fill="#ffffff">3. CUM MĂ DOCUMENTEZ ONLINE (creat pentru aceste notițe)</text>
<rect x="40" y="862.2" width="820" height="262.1" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="894.2" font-size="14" fill="#5b6b83" textLength="578.4" lengthAdjust="spacing">Cadru creat pentru aceste notițe. Exemplul din coloana din mijloc este articolul din manual.</text>
<rect x="62.0" y="912.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="933.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="56.3" lengthAdjust="spacing">Ce notez</text>
<text x="260.2" y="933.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="187.6" lengthAdjust="spacing">Exemplu: articolul din manual</text>
<text x="617.2" y="933.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="67.4" lengthAdjust="spacing">Sursa mea</text>
<line x1="62.0" y1="944.0" x2="838.0" y2="944.0" stroke="#e3dccb"/>
<text x="74.0" y="968.0" font-size="16" fill="#3a3226" font-weight="700" textLength="33.6" lengthAdjust="spacing">titlul</text>
<text x="260.2" y="968.0" font-size="16" fill="#10233f" font-style="italic" textLength="324.2" lengthAdjust="spacing">Tetraevanghel înghesuit într-un post de blog</text>
<text x="260.2" y="991.2" font-size="16" fill="#10233f" font-style="italic" textLength="152.7" lengthAdjust="spacing">înghesuit într-o rețea</text>
<text x="617.2" y="968.0" font-size="16" fill="#3a3226" textLength="4.4" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1002.0" x2="838.0" y2="1002.0" stroke="#e3dccb"/>
<text x="74.0" y="1026.0" font-size="16" fill="#3a3226" font-weight="700" textLength="53.7" lengthAdjust="spacing">autorul</text>
<text x="260.2" y="1026.0" font-size="16" fill="#3a3226" textLength="130.1" lengthAdjust="spacing">Iulian Comănescu</text>
<text x="617.2" y="1026.0" font-size="16" fill="#3a3226" textLength="4.4" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1036.8" x2="838.0" y2="1036.8" stroke="#e3dccb"/>
<text x="74.0" y="1060.8" font-size="16" fill="#3a3226" font-weight="700" textLength="51.5" lengthAdjust="spacing">adresa</text>
<text x="260.2" y="1060.8" font-size="16" fill="#3a3226" textLength="145.3" lengthAdjust="spacing">www.comanescu.ro</text>
<text x="617.2" y="1060.8" font-size="16" fill="#3a3226" textLength="4.4" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1071.6" x2="838.0" y2="1071.6" stroke="#e3dccb"/>
<text x="74.0" y="1095.6" font-size="16" fill="#3a3226" font-weight="700" textLength="117.6" lengthAdjust="spacing">data consultării</text>
<text x="260.2" y="1095.6" font-size="16" fill="#3a3226" textLength="199.9" lengthAdjust="spacing">ziua în care deschid pagina</text>
<text x="617.2" y="1095.6" font-size="16" fill="#3a3226" textLength="4.4" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1106.4" x2="838.0" y2="1106.4" stroke="#e3dccb"/>
<line x1="248.2" y1="912.4" x2="248.2" y2="1106.4" stroke="#e3dccb"/>
<line x1="605.2" y1="912.4" x2="605.2" y2="1106.4" stroke="#e3dccb"/>
<text x="52.4" y="1155.9" font-size="11.5" fill="#5b6b83" textLength="795.1" lengthAdjust="spacing">Sursa: Manual Art 5, p. 177, articolul lui Iulian Comănescu (secțiunile 1 și 2). Secțiunea 3, cadrul „Cum mă documentez online”, este creată pentru aceste</text>
<text x="376.9" y="1172.5" font-size="11.5" fill="#5b6b83" textLength="146.3" lengthAdjust="spacing">notițe și nu vine din manual.</text>
</svg>
