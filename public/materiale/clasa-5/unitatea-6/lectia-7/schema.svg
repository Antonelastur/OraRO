<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1915" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1915" fill="#faf7f0"/>
<text x="206.7" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="482.1" lengthAdjust="spacing">Identitate națională. Stema României</text>
<text x="210.1" y="74.4" font-size="14" fill="#5b6b83" textLength="479.8" lengthAdjust="spacing">Clasa a V-a · Unitatea VI, Lecția 7 · Manual, pp. 178-179 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. REPERE (p. 179)</text>
<rect x="40" y="128.6" width="820" height="261.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="84.9" rx="12" fill="#f3efe4"/><text x="78.0" y="173.1" font-size="14.5" fill="#3a3226" textLength="731.3" lengthAdjust="spacing">Identitatea națională este sentimentul de apartenență a unei persoane la o națiune. Națiunea este o comunitate</text>
<text x="78.0" y="194.1" font-size="14.5" fill="#3a3226" textLength="729.9" lengthAdjust="spacing">cu aceeași identitate istorică și culturală, nu neapărat etnică (deși cazul este frecvent), care și-a afirmat voința</text>
<text x="78.0" y="215.1" font-size="14.5" fill="#3a3226" textLength="221.2" lengthAdjust="spacing">de a trăi într-un stat independent.</text>
<rect x="62.0" y="245.5" width="776.0" height="126.9" rx="12" fill="#f3efe4"/><text x="78.0" y="272.0" font-size="14.5" fill="#3a3226" textLength="728.9" lengthAdjust="spacing">Sentimentul de identitate națională, manifestat prin patriotism, se sprijină pe un ansamblu de valori împărtășite</text>
<text x="78.0" y="293.0" font-size="14.5" fill="#3a3226" textLength="743.3" lengthAdjust="spacing">de toți membrii comunității: identificarea și valorizarea unuia sau a mai mulți strămoși fondatori; o istorie comună</text>
<text x="78.0" y="314.1" font-size="14.5" fill="#3a3226" textLength="698.2" lengthAdjust="spacing">cu eroi emblematici pentru calitățile pe care comunitatea le apreciază; limba vorbită, fixată de gramatici și</text>
<text x="78.0" y="335.1" font-size="14.5" fill="#3a3226" textLength="711.1" lengthAdjust="spacing">dicționare; o serie de monumente care reflectă continuitatea și geniul național; peisajele specifice; folclorul,</text>
<text x="78.0" y="356.1" font-size="14.5" fill="#3a3226" textLength="144.1" lengthAdjust="spacing">tradițiile și obiceiurile.</text>
<rect x="40" y="410.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="433.5" font-size="16" font-weight="700" fill="#ffffff">2. STEMA ROMÂNIEI: ELEMENTELE DE LA CENTRU (p. 178)</text>
<rect x="40" y="444.5" width="820" height="273.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="462.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="484.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="63.5" lengthAdjust="spacing">Elementul</text>
<text x="306.8" y="484.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="98.9" lengthAdjust="spacing">Ce știm din text</text>
<line x1="62.0" y1="494.0" x2="838.0" y2="494.0" stroke="#e3dccb"/>
<text x="74.0" y="516.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="162.6" lengthAdjust="spacing">vulturul de aur cu cruce</text>
<text x="306.8" y="516.5" font-size="14.5" fill="#3a3226" textLength="476.8" lengthAdjust="spacing">simbolizează dinastia întemeietoare a Basarabilor; întruchipează curajul,</text>
<text x="306.8" y="537.5" font-size="14.5" fill="#3a3226" textLength="425.6" lengthAdjust="spacing">hotărârea, zborul spre înălțimi, puterea; încă două sensuri: ………</text>
<line x1="62.0" y1="547.9" x2="838.0" y2="547.9" stroke="#e3dccb"/>
<text x="74.0" y="570.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="102.3" lengthAdjust="spacing">scutul albastru</text>
<text x="306.8" y="570.4" font-size="14.5" fill="#3a3226" textLength="130.5" lengthAdjust="spacing">simbolizează: ………</text>
<line x1="62.0" y1="580.7" x2="838.0" y2="580.7" stroke="#e3dccb"/>
<text x="74.0" y="603.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="56.7" lengthAdjust="spacing">sceptrul</text>
<text x="306.8" y="603.2" font-size="14.5" fill="#3a3226" textLength="181.8" lengthAdjust="spacing">amintește de Mihai Viteazul</text>
<line x1="62.0" y1="613.6" x2="838.0" y2="613.6" stroke="#e3dccb"/>
<text x="74.0" y="636.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="36.8" lengthAdjust="spacing">sabia</text>
<text x="306.8" y="636.1" font-size="14.5" fill="#3a3226" textLength="225.6" lengthAdjust="spacing">îl simbolizează pe Ștefan cel Mare</text>
<line x1="62.0" y1="646.4" x2="838.0" y2="646.4" stroke="#e3dccb"/>
<text x="74.0" y="668.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="105.6" lengthAdjust="spacing">coroana de oțel</text>
<text x="306.8" y="668.9" font-size="14.5" fill="#3a3226" textLength="472.5" lengthAdjust="spacing">coroana regală a României, adăugată în 2016, turnată din țeava unui tun</text>
<text x="306.8" y="690.0" font-size="14.5" fill="#3a3226" textLength="397.1" lengthAdjust="spacing">otoman capturat în Războiul de Independență din 1877-1878</text>
<line x1="62.0" y1="700.3" x2="838.0" y2="700.3" stroke="#e3dccb"/>
<line x1="294.8" y1="462.5" x2="294.8" y2="700.3" stroke="#e3dccb"/>
<rect x="40" y="738.3" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="761.3" font-size="16" font-weight="700" fill="#ffffff">3. STEMA ROMÂNIEI: BLAZONUL CU PROVINCIILE (p. 178)</text>
<rect x="40" y="772.3" width="820" height="358.0" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="790.3" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="811.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="59.5" lengthAdjust="spacing">Provincia</text>
<text x="244.7" y="811.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="139.4" lengthAdjust="spacing">Simbolul de pe blazon</text>
<text x="555.1" y="811.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="80.0" lengthAdjust="spacing">Semnificația</text>
<line x1="62.0" y1="821.9" x2="838.0" y2="821.9" stroke="#e3dccb"/>
<text x="74.0" y="844.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="121.8" lengthAdjust="spacing">Țara Românească</text>
<text x="244.7" y="844.4" font-size="14.5" fill="#3a3226" textLength="277.8" lengthAdjust="spacing">pe albastru, un vultur cu o cruce ortodoxă</text>
<text x="244.7" y="865.4" font-size="14.5" fill="#3a3226" textLength="214.0" lengthAdjust="spacing">în cioc, un soare și o lună de aur</text>
<text x="555.1" y="844.4" font-size="14.5" fill="#3a3226" textLength="238.1" lengthAdjust="spacing">provincie cu rol hotărâtor în destinul</text>
<text x="555.1" y="865.4" font-size="14.5" fill="#3a3226" textLength="120.3" lengthAdjust="spacing">istoric al României</text>
<line x1="62.0" y1="875.7" x2="838.0" y2="875.7" stroke="#e3dccb"/>
<text x="74.0" y="898.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="59.1" lengthAdjust="spacing">Moldova</text>
<text x="244.7" y="898.2" font-size="14.5" fill="#3a3226" textLength="285.8" lengthAdjust="spacing">bour negru cu o stea între coarne, trandafir</text>
<text x="244.7" y="919.2" font-size="14.5" fill="#3a3226" textLength="163.2" lengthAdjust="spacing">cu cinci petale, semilună</text>
<text x="555.1" y="898.2" font-size="14.5" fill="#3a3226" textLength="224.0" lengthAdjust="spacing">trandafirul: ………; semiluna: ………</text>
<line x1="62.0" y1="929.6" x2="838.0" y2="929.6" stroke="#e3dccb"/>
<text x="74.0" y="952.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="119.1" lengthAdjust="spacing">Banatul și Oltenia</text>
<text x="244.7" y="952.1" font-size="14.5" fill="#3a3226" textLength="271.1" lengthAdjust="spacing">pod galben cu două arce de boltă, leu de</text>
<text x="244.7" y="973.1" font-size="14.5" fill="#3a3226" textLength="21.4" lengthAdjust="spacing">aur</text>
<text x="555.1" y="952.1" font-size="14.5" fill="#3a3226" textLength="268.1" lengthAdjust="spacing">podul peste Dunăre al împăratului roman</text>
<text x="555.1" y="973.1" font-size="14.5" fill="#3a3226" textLength="179.5" lengthAdjust="spacing">Traian; leul: forța și măreția</text>
<line x1="62.0" y1="983.5" x2="838.0" y2="983.5" stroke="#e3dccb"/>
<text x="74.0" y="1006.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="83.6" lengthAdjust="spacing">Transilvania</text>
<text x="244.7" y="1006.0" font-size="14.5" fill="#3a3226" textLength="240.7" lengthAdjust="spacing">vultur negru cu gheare de aur, șapte</text>
<text x="244.7" y="1027.0" font-size="14.5" fill="#3a3226" textLength="109.4" lengthAdjust="spacing">turnuri crenelate</text>
<text x="555.1" y="1006.0" font-size="14.5" fill="#3a3226" textLength="220.8" lengthAdjust="spacing">turnurile: ………; cele șapte cetăți:</text>
<text x="555.1" y="1027.0" font-size="14.5" fill="#3a3226" textLength="247.9" lengthAdjust="spacing">Bistrița, Brașov, Cluj, Mediaș, Orăștie,</text>
<text x="555.1" y="1048.0" font-size="14.5" fill="#3a3226" textLength="110.3" lengthAdjust="spacing">Sibiu, Sighișoara</text>
<line x1="62.0" y1="1058.4" x2="838.0" y2="1058.4" stroke="#e3dccb"/>
<text x="74.0" y="1080.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="67.0" lengthAdjust="spacing">Dobrogea</text>
<text x="145.0" y="1080.9" font-size="14.5" fill="#3a3226" textLength="66.9" lengthAdjust="spacing">(Teritoriile</text>
<text x="74.0" y="1101.9" font-size="14.5" fill="#3a3226" textLength="82.3" lengthAdjust="spacing">Mării Negre)</text>
<text x="244.7" y="1080.9" font-size="14.5" fill="#3a3226" textLength="242.3" lengthAdjust="spacing">doi delfini față în față, cu capul în jos</text>
<text x="555.1" y="1080.9" font-size="14.5" fill="#3a3226" textLength="88.2" lengthAdjust="spacing">delfinii: ………</text>
<line x1="62.0" y1="1112.2" x2="838.0" y2="1112.2" stroke="#e3dccb"/>
<line x1="232.7" y1="790.3" x2="232.7" y2="1112.2" stroke="#e3dccb"/>
<line x1="543.1" y1="790.3" x2="543.1" y2="1112.2" stroke="#e3dccb"/>
<rect x="40" y="1150.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1173.2" font-size="16" font-weight="700" fill="#ffffff">4. STEMA JUDEȚULUI MEU (Explorare, ex. 4)</text>
<rect x="40" y="1184.2" width="820" height="198.6" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="1202.2" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1223.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="259.4" lengthAdjust="spacing">Desenez stema județului în care locuiesc</text>
<text x="462.0" y="1223.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="206.1" lengthAdjust="spacing">Notez semnificațiile elementelor</text>
<line x1="62.0" y1="1233.8" x2="838.0" y2="1233.8" stroke="#e3dccb"/>
<text x="74.0" y="1331.8" font-size="90" fill="#3a3226" textLength="24.5" lengthAdjust="spacing"> </text>
<text x="462.0" y="1331.8" font-size="90" fill="#3a3226" textLength="24.5" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1364.8" x2="838.0" y2="1364.8" stroke="#e3dccb"/>
<line x1="450.0" y1="1202.2" x2="450.0" y2="1364.8" stroke="#e3dccb"/>
<rect x="40" y="1402.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1425.8" font-size="16" font-weight="700" fill="#ffffff">5. O VALOARE, DOUĂ COMPORTAMENTE (Aplicații, ex. 3-4)</text>
<rect x="40" y="1436.8" width="820" height="411.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1468.8" font-size="14" fill="#5b6b83" textLength="238.2" lengthAdjust="spacing">Model din manual: GENEROZITATE →</text>
<text x="304.0" y="1468.8" font-size="14" fill="#5b6b83" font-style="italic" textLength="527.9" lengthAdjust="spacing">a-i împrumuta unui coleg niște cărți, a-i ajuta pe membrii familiei la treburi ușoare,</text>
<text x="62.0" y="1489.1" font-size="14" fill="#5b6b83" font-style="italic" textLength="177.4" lengthAdjust="spacing">a dărui altora din timpul tău</text>
<rect x="62.0" y="1507.3" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1528.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="153.8" lengthAdjust="spacing">Valoarea aleasă din listă</text>
<text x="345.6" y="1528.8" font-size="13.5" fill="#10233f" font-weight="700" textLength="195.5" lengthAdjust="spacing">Două comportamente asociate</text>
<line x1="62.0" y1="1538.8" x2="838.0" y2="1538.8" stroke="#e3dccb"/>
<text x="74.0" y="1580.8" font-size="34" fill="#3a3226" textLength="9.2" lengthAdjust="spacing"> </text>
<text x="345.6" y="1580.8" font-size="34" fill="#3a3226" textLength="9.2" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1597.0" x2="838.0" y2="1597.0" stroke="#e3dccb"/>
<text x="74.0" y="1639.0" font-size="34" fill="#3a3226" textLength="9.2" lengthAdjust="spacing"> </text>
<text x="345.6" y="1639.0" font-size="34" fill="#3a3226" textLength="9.2" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1655.2" x2="838.0" y2="1655.2" stroke="#e3dccb"/>
<text x="74.0" y="1697.2" font-size="34" fill="#3a3226" textLength="9.2" lengthAdjust="spacing"> </text>
<text x="345.6" y="1697.2" font-size="34" fill="#3a3226" textLength="9.2" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1713.5" x2="838.0" y2="1713.5" stroke="#e3dccb"/>
<text x="74.0" y="1755.4" font-size="34" fill="#3a3226" textLength="9.2" lengthAdjust="spacing"> </text>
<text x="345.6" y="1755.4" font-size="34" fill="#3a3226" textLength="9.2" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1771.6" x2="838.0" y2="1771.6" stroke="#e3dccb"/>
<text x="74.0" y="1813.6" font-size="34" fill="#3a3226" textLength="9.2" lengthAdjust="spacing"> </text>
<text x="345.6" y="1813.6" font-size="34" fill="#3a3226" textLength="9.2" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1829.8" x2="838.0" y2="1829.8" stroke="#e3dccb"/>
<line x1="333.6" y1="1507.3" x2="333.6" y2="1829.8" stroke="#e3dccb"/>
<text x="50.8" y="1879.3" font-size="11.5" fill="#5b6b83" textLength="798.4" lengthAdjust="spacing">Sursa: Manual Art 5, p. 179, rubrica Repere; p. 178, textul despre stemă (adaptare după edusoft.ro); p. 179, Explorare ex. 4 și Aplicații ex. 3-4. Locurile cu</text>
<text x="221.9" y="1896.0" font-size="11.5" fill="#5b6b83" textLength="456.2" lengthAdjust="spacing">puncte se completează după exercițiul 2 din Explorare; cadrele goale sunt pentru elevi.</text>
</svg>
