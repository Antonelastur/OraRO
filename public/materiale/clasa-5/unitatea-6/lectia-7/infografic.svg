<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="320" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Identitate națională</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea VI, Lecția 6</text>
  <g>
    <rect x="60" y="95" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="180" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Stema</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="180" y="150">Simbol heraldic,</tspan><tspan x="180" y="166">reprezintă regiunile</tspan><tspan x="180" y="182">istorice ale țării.</tspan></text>
  </g>
  <g>
    <rect x="330" y="95" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Sigiliul</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="450" y="150">Marca oficială,</tspan><tspan x="450" y="166">folosită pentru a</tspan><tspan x="450" y="182">autentifica documente.</tspan></text>
  </g>
  <g>
    <rect x="600" y="95" width="240" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="720" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Steagul</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="720" y="150">Culorile roșu, galben,</tspan><tspan x="720" y="166">albastru, simbol al</tspan><tspan x="720" y="182">unității naționale.</tspan></text>
  </g>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 6, pp. 178-179</text>
</svg>
