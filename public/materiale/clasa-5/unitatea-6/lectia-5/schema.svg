<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1241" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1241" fill="#faf7f0"/>
<text x="45.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="799.0" lengthAdjust="spacing">De la manuscris la cartea electronică: Repere și drumul cărții</text>
<text x="210.0" y="74.4" font-size="14" fill="#5b6b83" textLength="480.1" lengthAdjust="spacing">Clasa a V-a · Unitatea VI, Lecția 5 · Manual, pp. 176-177 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. REPERE (p. 177)</text>
<rect x="40" y="128.6" width="820" height="282.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="126.9" rx="12" fill="#f3efe4"/><text x="78.0" y="173.1" font-size="14.5" fill="#3a3226" textLength="689.4" lengthAdjust="spacing">În Evul Mediu, scrierea cărților – mai multe foi de pergament pliate și cusute împreună – cădea în sarcina</text>
<text x="78.0" y="194.1" font-size="14.5" fill="#3a3226" textLength="709.4" lengthAdjust="spacing">călugărilor copiști, care editau mai multe volume destinate nobilimii, mănăstirilor și universităților. Era însă o</text>
<text x="78.0" y="215.1" font-size="14.5" fill="#3a3226" textLength="688.4" lengthAdjust="spacing">muncă dificilă, iar copierea unui manuscris dura mult timp. Abia în 1440 și-a făcut apariția tiparul în sens</text>
<text x="78.0" y="236.2" font-size="14.5" fill="#3a3226" textLength="723.7" lengthAdjust="spacing">modern: Johannes Gutenberg a inventat presa tipografică, literele mobile dintr-un aliaj de plumb și o cerneală</text>
<text x="78.0" y="257.2" font-size="14.5" fill="#3a3226" textLength="726.4" lengthAdjust="spacing">pe bază de ulei. Prima carte tipărită cu ajutorul acestei invenții revoluționare a fost Biblia în limba latină (1455).</text>
<rect x="62.0" y="287.5" width="776.0" height="105.9" rx="12" fill="#f3efe4"/><text x="78.0" y="314.0" font-size="14.5" fill="#3a3226" textLength="702.6" lengthAdjust="spacing">La începutul mileniului al III-lea, odată cu dezvoltarea tehnologiei, au apărut suporturile electronice. Cărțile</text>
<text x="78.0" y="335.1" font-size="14.5" fill="#3a3226" textLength="722.4" lengthAdjust="spacing">arată, în mare, la fel cu cele tipărite: au coperte, pagină de titlu, cuprins, capitole. Folosind suportul electronic</text>
<text x="78.0" y="356.1" font-size="14.5" fill="#3a3226" textLength="712.9" lengthAdjust="spacing">oferit de dischete, apoi de CD-uri, de e-bookuri și de tablete multimedia, spațiul de stocare a informației s-a</text>
<text x="78.0" y="377.1" font-size="14.5" fill="#3a3226" textLength="682.5" lengthAdjust="spacing">micșorat enorm. Un alt avantaj este posibilitatea consultării pe internet a multor texte, imagini, hărți etc.</text>
<rect x="40" y="431.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="454.5" font-size="16" font-weight="700" fill="#ffffff">2. DRUMUL CĂRȚII</text>
<rect x="40" y="465.5" width="820" height="466.5" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="483.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="505.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="33.6" lengthAdjust="spacing">Când</text>
<text x="229.2" y="505.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="94.1" lengthAdjust="spacing">Ce se întâmplă</text>
<text x="656.0" y="505.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="83.2" lengthAdjust="spacing">De unde știm</text>
<line x1="62.0" y1="515.0" x2="838.0" y2="515.0" stroke="#e3dccb"/>
<text x="74.0" y="537.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="75.6" lengthAdjust="spacing">Evul Mediu</text>
<text x="229.2" y="537.5" font-size="14.5" fill="#3a3226" textLength="388.2" lengthAdjust="spacing">călugării copiști scriu cărțile de mână, pe foi de pergament</text>
<text x="656.0" y="537.5" font-size="14.5" fill="#3a3226" textLength="93.4" lengthAdjust="spacing">Repere, p. 177</text>
<line x1="62.0" y1="547.9" x2="838.0" y2="547.9" stroke="#e3dccb"/>
<text x="74.0" y="570.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="34.5" lengthAdjust="spacing">1440</text>
<text x="229.2" y="570.4" font-size="14.5" fill="#3a3226" textLength="384.0" lengthAdjust="spacing">apare tiparul în sens modern: Gutenberg inventează presa</text>
<text x="229.2" y="591.4" font-size="14.5" fill="#3a3226" textLength="182.4" lengthAdjust="spacing">tipografică și literele mobile</text>
<text x="656.0" y="570.4" font-size="14.5" fill="#3a3226" textLength="93.4" lengthAdjust="spacing">Repere, p. 177</text>
<line x1="62.0" y1="601.8" x2="838.0" y2="601.8" stroke="#e3dccb"/>
<text x="74.0" y="624.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="69.7" lengthAdjust="spacing">pe la 1450</text>
<text x="229.2" y="624.2" font-size="14.5" fill="#3a3226" textLength="363.7" lengthAdjust="spacing">Gutenberg tipărește vreo 150-180 de exemplare dintr-o</text>
<text x="229.2" y="645.3" font-size="14.5" fill="#3a3226" textLength="36.1" lengthAdjust="spacing">Biblie</text>
<text x="656.0" y="624.2" font-size="14.5" fill="#3a3226" textLength="99.5" lengthAdjust="spacing">articolul, p. 176</text>
<line x1="62.0" y1="655.6" x2="838.0" y2="655.6" stroke="#e3dccb"/>
<text x="74.0" y="678.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="33.5" lengthAdjust="spacing">1455</text>
<text x="229.2" y="678.1" font-size="14.5" fill="#3a3226" textLength="379.0" lengthAdjust="spacing">prima carte tipărită cu presa lui Gutenberg: Biblia în limba</text>
<text x="229.2" y="699.1" font-size="14.5" fill="#3a3226" textLength="35.4" lengthAdjust="spacing">latină</text>
<text x="656.0" y="678.1" font-size="14.5" fill="#3a3226" textLength="93.4" lengthAdjust="spacing">Repere, p. 177</text>
<line x1="62.0" y1="709.5" x2="838.0" y2="709.5" stroke="#e3dccb"/>
<text x="74.0" y="732.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="64.1" lengthAdjust="spacing">prin 1560</text>
<text x="229.2" y="732.0" font-size="14.5" fill="#3a3226" textLength="359.0" lengthAdjust="spacing">diaconul Coresi tipărește la Brașov Tetraevanghelul, în</text>
<text x="229.2" y="753.0" font-size="14.5" fill="#3a3226" textLength="49.8" lengthAdjust="spacing">română</text>
<text x="656.0" y="732.0" font-size="14.5" fill="#3a3226" textLength="99.5" lengthAdjust="spacing">articolul, p. 176</text>
<line x1="62.0" y1="763.4" x2="838.0" y2="763.4" stroke="#e3dccb"/>
<text x="74.0" y="785.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="64.4" lengthAdjust="spacing">începutul</text>
<text x="74.0" y="806.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="123.7" lengthAdjust="spacing">mileniului al III-lea</text>
<text x="229.2" y="785.9" font-size="14.5" fill="#3a3226" textLength="376.2" lengthAdjust="spacing">apar suporturile electronice: dischete, CD-uri, e-bookuri,</text>
<text x="229.2" y="806.9" font-size="14.5" fill="#3a3226" textLength="45.3" lengthAdjust="spacing">tablete</text>
<text x="656.0" y="785.9" font-size="14.5" fill="#3a3226" textLength="93.4" lengthAdjust="spacing">Repere, p. 177</text>
<line x1="62.0" y1="817.2" x2="838.0" y2="817.2" stroke="#e3dccb"/>
<line x1="217.2" y1="483.5" x2="217.2" y2="817.2" stroke="#e3dccb"/>
<line x1="644.0" y1="483.5" x2="644.0" y2="817.2" stroke="#e3dccb"/>
<rect x="62.0" y="831.2" width="776.0" height="82.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="831.2" width="6" height="82.7" rx="3" fill="#b4432c"/><text x="84.0" y="857.8" font-size="14.5" fill="#b4432c" font-weight="700" textLength="208.2" lengthAdjust="spacing">Manualul dă date puțin diferite</text>
<text x="84.0" y="876.6" font-size="14.5" fill="#3a3226" textLength="721.0" lengthAdjust="spacing">Pentru Gutenberg găsim 1440 (tiparul în sens modern, în Repere), pe la 1450 (Biblia tipărită, în articol) și 1455</text>
<text x="84.0" y="897.6" font-size="14.5" fill="#3a3226" textLength="463.8" lengthAdjust="spacing">(Biblia în limba latină, în Repere). Le scriu pe toate, fiecare cu sursa ei.</text>
<rect x="40" y="952.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="975.0" font-size="16" font-weight="700" fill="#ffffff">3. TERMENI DIN SUBSOL</text>
<rect x="40" y="986.0" width="820" height="187.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="1004.0" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="1025.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="60.4" lengthAdjust="spacing">Termenul</text>
<text x="244.7" y="1025.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="98.1" lengthAdjust="spacing">Sensul din notă</text>
<text x="710.3" y="1025.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="33.7" lengthAdjust="spacing">Unde</text>
<line x1="62.0" y1="1035.5" x2="838.0" y2="1035.5" stroke="#e3dccb"/>
<text x="74.0" y="1058.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="95.1" lengthAdjust="spacing">tetraevanghel</text>
<text x="244.7" y="1058.0" font-size="14.5" fill="#3a3226" textLength="272.1" lengthAdjust="spacing">carte care cuprinde cele patru Evanghelii</text>
<text x="710.3" y="1058.0" font-size="14.5" fill="#3a3226" textLength="38.7" lengthAdjust="spacing">p. 176</text>
<line x1="62.0" y1="1068.4" x2="838.0" y2="1068.4" stroke="#e3dccb"/>
<text x="74.0" y="1090.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="49.1" lengthAdjust="spacing">e-book</text>
<text x="244.7" y="1090.9" font-size="14.5" fill="#3a3226" textLength="433.1" lengthAdjust="spacing">carte electronică în care sunt cuprinse textul și/sau imaginile unei</text>
<text x="244.7" y="1111.9" font-size="14.5" fill="#3a3226" textLength="79.5" lengthAdjust="spacing">cărți tipărite</text>
<text x="710.3" y="1090.9" font-size="14.5" fill="#3a3226" textLength="38.4" lengthAdjust="spacing">p. 177</text>
<line x1="62.0" y1="1122.2" x2="838.0" y2="1122.2" stroke="#e3dccb"/>
<text x="74.0" y="1144.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="24.5" lengthAdjust="spacing">link</text>
<text x="244.7" y="1144.8" font-size="14.5" fill="#3a3226" textLength="120.4" lengthAdjust="spacing">adresă pe internet</text>
<text x="710.3" y="1144.8" font-size="14.5" fill="#3a3226" textLength="38.7" lengthAdjust="spacing">p. 176</text>
<line x1="62.0" y1="1155.1" x2="838.0" y2="1155.1" stroke="#e3dccb"/>
<line x1="232.7" y1="1004.0" x2="232.7" y2="1155.1" stroke="#e3dccb"/>
<line x1="698.3" y1="1004.0" x2="698.3" y2="1155.1" stroke="#e3dccb"/>
<text x="41.9" y="1204.6" font-size="11.5" fill="#5b6b83" textLength="816.2" lengthAdjust="spacing">Sursa: Manual Art 5, p. 177, rubrica Repere; p. 176, articolul lui Iulian Comănescu (anii 1450 și 1560); notele de subsol de la pp. 176-177. Fiecare an de pe axă</text>
<text x="407.9" y="1221.3" font-size="11.5" fill="#5b6b83" textLength="84.3" lengthAdjust="spacing">poartă sursa lui.</text>
</svg>
