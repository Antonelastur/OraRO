<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 526" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="1000" height="526" fill="#faf7f0"/>
  <text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Textul nonliterar și comunicarea, tot la un loc</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea VI · Recapitulare, lectură și comunicare</text>
  <rect x="36" y="96" width="458" height="34" rx="10" fill="#3b5fa8"/>
  <text x="265" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">TEXTUL NARATIV NONLITERAR</text>
  <rect x="36" y="142" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="166" font-size="13" font-weight="700" fill="#10233f">Ca textul literar</text>
  <text x="56" y="186" font-size="12" fill="#3d4a5f">întâmplări în ordine logică și temporală</text>
  <rect x="36" y="212" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="236" font-size="13" font-weight="700" fill="#10233f">Spre deosebire de el</text>
  <text x="56" y="256" font-size="12" fill="#3d4a5f">întâmplări reale, în timp și spațiu reale</text>
  <rect x="36" y="282" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="306" font-size="13" font-weight="700" fill="#10233f">Cine acționează</text>
  <text x="56" y="326" font-size="12" fill="#3d4a5f">participanți, persoane reale, nu personaje</text>
  <rect x="36" y="352" width="458" height="58" rx="12" fill="#ffffff" stroke="#3b5fa8" stroke-width="2"/>
  <text x="56" y="376" font-size="13" font-weight="700" fill="#10233f">Exemple</text>
  <text x="56" y="396" font-size="12" fill="#3d4a5f">jurnal, reportaj, articol, interviu, scrisoare</text>
  <rect x="506" y="96" width="458" height="34" rx="10" fill="#0d9c92"/>
  <text x="735" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">COMUNICARE ȘI INTERCULTURALITATE</text>
  <rect x="506" y="142" width="458" height="58" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="526" y="166" font-size="13" font-weight="700" fill="#10233f">A explica · a recomanda · a afirma</text>
  <text x="526" y="186" font-size="12" fill="#3d4a5f">lămurești · sfătuiești · susții că e adevărat</text>
  <rect x="506" y="212" width="458" height="77" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="526" y="236" font-size="13" font-weight="700" fill="#10233f">Cartea, de-a lungul timpului</text>
  <text x="526" y="256" font-size="12" fill="#3d4a5f">manuscris, tipar (Gutenberg, Coresi),</text>
  <text x="526" y="275" font-size="12" fill="#3d4a5f">carte digitală</text>
  <rect x="506" y="301" width="458" height="58" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="526" y="325" font-size="13" font-weight="700" fill="#10233f">Identitatea națională</text>
  <text x="526" y="345" font-size="12" fill="#3d4a5f">sentimentul de apartenență la o națiune</text>
  <rect x="36" y="422" width="928" height="58" rx="12" fill="#fef8e9" stroke="#b8944f" stroke-width="2"/>
  <text x="56" y="446" font-size="13" font-weight="700" fill="#10233f">Textele unității</text>
  <text x="56" y="466" font-size="12" fill="#3d4a5f">Jurnalul Monicăi · Scrisoarea III (Eminescu) · articolul lui Iulian Comănescu · stema României · Neagu Djuvara, despre Mircea</text>
  <text x="500" y="512" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, pp. 168-184</text>
</svg>
