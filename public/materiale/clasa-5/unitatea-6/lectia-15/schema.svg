<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 531" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="531" fill="#faf7f0"/>
<text x="123.7" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="654.4" lengthAdjust="spacing">Recapitulare. Lectură și comunicare în Unitatea VI</text>
<text x="185.4" y="74.4" font-size="14" fill="#5b6b83" textLength="529.2" lengthAdjust="spacing">Clasa a V-a · Unitatea VI, Lecția 15 · Manual, pp. 171-188, 189-190 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL NARATIV NONLITERAR</text>
<rect x="40" y="128.6" width="820" height="132.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="67.2" lengthAdjust="spacing">Întâmplări</text>
<text x="133.2" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="34.5" lengthAdjust="spacing">reale</text>
<text x="167.8" y="161.6" font-size="15" fill="#3a3226" textLength="225.6" lengthAdjust="spacing">, într-un timp și un spațiu reale, cu</text>
<text x="397.4" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="81.5" lengthAdjust="spacing">participanți</text>
<text x="478.8" y="161.6" font-size="15" fill="#3a3226" textLength="336.1" lengthAdjust="spacing">, persoane care există. Exemple: jurnalul, reportajul,</text>
<text x="62.0" y="183.3" font-size="15" fill="#3a3226" textLength="171.3" lengthAdjust="spacing">articolul, textul de istorie (</text>
<text x="233.3" y="183.3" font-size="15" fill="#10233f" font-style="italic" textLength="313.9" lengthAdjust="spacing">O scurtă istorie a românilor povestită celor tineri</text>
<text x="551.3" y="183.3" font-size="15" fill="#3a3226" textLength="127.0" lengthAdjust="spacing">de Neagu Djuvara).</text>
<text x="62.0" y="216.8" font-size="15" fill="#3a3226" textLength="30.6" lengthAdjust="spacing">Caut</text>
<text x="96.6" y="216.8" font-size="15" fill="#3a3226" font-weight="700" textLength="101.4" lengthAdjust="spacing">indicii de timp</text>
<text x="202.1" y="216.8" font-size="15" fill="#3a3226" textLength="205.2" lengthAdjust="spacing">(date, zile, momente ale zilei) și</text>
<text x="411.3" y="216.8" font-size="15" fill="#3a3226" font-weight="700" textLength="64.8" lengthAdjust="spacing">de spațiu</text>
<text x="480.2" y="216.8" font-size="15" fill="#3a3226" textLength="322.0" lengthAdjust="spacing">(localități, instituții, alte locuri) și verific dacă sunt</text>
<text x="62.0" y="238.6" font-size="15" fill="#3a3226" textLength="35.4" lengthAdjust="spacing">reale.</text>
<rect x="40" y="281.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="304.1" font-size="16" font-weight="700" fill="#ffffff">2. ACTE DE LIMBAJ</text>
<rect x="40" y="315.1" width="820" height="55.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="348.1" font-size="15" fill="#3a3226" textLength="346.8" lengthAdjust="spacing">a întreba · a solicita · a felicita · a promite · a declara ·</text>
<text x="412.8" y="348.1" font-size="15" fill="#3a3226" font-weight="700" textLength="61.6" lengthAdjust="spacing">a explica</text>
<text x="478.5" y="348.1" font-size="15" fill="#3a3226" textLength="97.7" lengthAdjust="spacing">(de ce? cum?) ·</text>
<text x="580.2" y="348.1" font-size="15" fill="#3a3226" font-weight="700" textLength="91.2" lengthAdjust="spacing">a recomanda</text>
<text x="675.5" y="348.1" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">·</text>
<text x="682.8" y="348.1" font-size="15" fill="#3a3226" font-weight="700" textLength="58.2" lengthAdjust="spacing">a afirma</text>
<rect x="40" y="390.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="413.6" font-size="16" font-weight="700" fill="#ffffff">3. TEXTUL ȘI IMAGINEA</text>
<rect x="40" y="424.6" width="820" height="55.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="457.6" font-size="15" fill="#3a3226" textLength="657.4" lengthAdjust="spacing">Fotografii, hărți, scheme, planuri, desene, integrate prin colaj; textul spune ce nu se vede în imagine.</text>
<text x="212.1" y="511.6" font-size="11.5" fill="#5b6b83" textLength="475.9" lengthAdjust="spacing">Sursa: Manual Art 5, rubricile Repere ale lecțiilor 2-9 și cerințele recapitulării de la pp. 189-190.</text>
</svg>
