<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1435" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1435" fill="#faf7f0"/>
<text x="74.9" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="739.7" lengthAdjust="spacing">Proiect de grup: Imagini ale domnitorului, fișa de pornire</text>
<text x="208.8" y="74.4" font-size="14" fill="#5b6b83" textLength="482.3" lengthAdjust="spacing">Clasa a V-a · Unitatea VI, Lecția 8 · Manual, pp. 180-182 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. SARCINA DE LUCRU (p. 180)</text>
<rect x="40" y="128.6" width="820" height="415.5" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="63.9" rx="12" fill="#f3efe4"/><text x="78.0" y="173.1" font-size="14.5" fill="#3a3226" textLength="717.2" lengthAdjust="spacing">Alcătuiți patru grupe. Fiecare grupă va prezenta imaginea unuia dintre domnitorii Ștefan cel Mare, Mircea cel</text>
<text x="78.0" y="194.1" font-size="14.5" fill="#3a3226" textLength="503.1" lengthAdjust="spacing">Bătrân, Mihai Viteazul sau Vlad Țepeș, pornind de la fragmentele de mai jos.</text>
<rect x="62.0" y="224.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="246.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="70.7" lengthAdjust="spacing">Domnitorul</text>
<text x="229.2" y="246.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="39.4" lengthAdjust="spacing">Textul</text>
<text x="555.1" y="246.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="58.6" lengthAdjust="spacing">Imaginea</text>
<line x1="62.0" y1="256.0" x2="838.0" y2="256.0" stroke="#e3dccb"/>
<text x="74.0" y="278.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="106.7" lengthAdjust="spacing">Ștefan cel Mare</text>
<text x="229.2" y="278.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="172.0" lengthAdjust="spacing">Cântecele lui Ștefan Vodă</text>
<text x="401.2" y="278.5" font-size="14.5" fill="#3a3226" textLength="114.5" lengthAdjust="spacing">, poezie populară</text>
<text x="229.2" y="299.5" font-size="14.5" fill="#3a3226" textLength="243.2" lengthAdjust="spacing">culeasă de Vasile Alecsandri (p. 180)</text>
<text x="555.1" y="278.5" font-size="14.5" fill="#3a3226" textLength="80.8" lengthAdjust="spacing">portretul din</text>
<text x="639.8" y="278.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="106.7" lengthAdjust="spacing">Tetraevanghelul</text>
<text x="750.4" y="278.5" font-size="14.5" fill="#3a3226" textLength="32.0" lengthAdjust="spacing">de la</text>
<text x="555.1" y="299.5" font-size="14.5" fill="#3a3226" textLength="90.0" lengthAdjust="spacing">Humor (1473)</text>
<line x1="62.0" y1="309.9" x2="838.0" y2="309.9" stroke="#e3dccb"/>
<text x="74.0" y="332.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="119.1" lengthAdjust="spacing">Mircea cel Bătrân</text>
<text x="229.2" y="332.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="152.3" lengthAdjust="spacing">Mircea cel Mare și solii</text>
<text x="385.4" y="332.4" font-size="14.5" fill="#3a3226" textLength="71.6" lengthAdjust="spacing">de Dimitrie</text>
<text x="229.2" y="353.4" font-size="14.5" fill="#3a3226" textLength="170.8" lengthAdjust="spacing">Bolintineanu (pp. 180-181)</text>
<text x="555.1" y="332.4" font-size="14.5" fill="#3a3226" textLength="261.9" lengthAdjust="spacing">pictură din biserica Episcopiei de Argeș</text>
<line x1="62.0" y1="363.8" x2="838.0" y2="363.8" stroke="#e3dccb"/>
<text x="74.0" y="386.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="97.3" lengthAdjust="spacing">Mihai Viteazul</text>
<text x="229.2" y="386.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="242.9" lengthAdjust="spacing">Românii supt Mihai-Voievod Viteazul</text>
<text x="476.0" y="386.3" font-size="14.5" fill="#3a3226" textLength="16.8" lengthAdjust="spacing">de</text>
<text x="229.2" y="407.3" font-size="14.5" fill="#3a3226" textLength="164.9" lengthAdjust="spacing">Nicolae Bălcescu (p. 181)</text>
<text x="555.1" y="386.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="94.0" lengthAdjust="spacing">Mihai Viteazul</text>
<text x="653.0" y="386.3" font-size="14.5" fill="#3a3226" textLength="142.8" lengthAdjust="spacing">de Mișu Popp, ulei pe</text>
<text x="555.1" y="407.3" font-size="14.5" fill="#3a3226" textLength="77.2" lengthAdjust="spacing">pânză, 1881</text>
<line x1="62.0" y1="417.6" x2="838.0" y2="417.6" stroke="#e3dccb"/>
<text x="74.0" y="440.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="76.2" lengthAdjust="spacing">Vlad Țepeș</text>
<text x="229.2" y="440.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="247.1" lengthAdjust="spacing">De la Vlad Țepeș la Dracula Vampirul</text>
<text x="480.3" y="440.1" font-size="14.5" fill="#3a3226" textLength="16.8" lengthAdjust="spacing">de</text>
<text x="229.2" y="461.2" font-size="14.5" fill="#3a3226" textLength="251.5" lengthAdjust="spacing">Neagu Djuvara și Radu Oltean (p. 182)</text>
<text x="555.1" y="440.1" font-size="14.5" fill="#3a3226" textLength="265.0" lengthAdjust="spacing">tablou din a doua jumătate a secolului al</text>
<text x="555.1" y="461.2" font-size="14.5" fill="#3a3226" textLength="241.9" lengthAdjust="spacing">XVI-lea, expus la Muzeul de Istorie a</text>
<text x="555.1" y="482.2" font-size="14.5" fill="#3a3226" textLength="96.7" lengthAdjust="spacing">Artei din Viena</text>
<line x1="62.0" y1="492.5" x2="838.0" y2="492.5" stroke="#e3dccb"/>
<line x1="217.2" y1="224.5" x2="217.2" y2="492.6" stroke="#e3dccb"/>
<line x1="543.1" y1="224.5" x2="543.1" y2="492.6" stroke="#e3dccb"/>
<text x="62.0" y="521.6" font-size="15" fill="#10233f" font-weight="700" textLength="127.0" lengthAdjust="spacing">Timp de realizare:</text>
<text x="193.1" y="521.6" font-size="15" fill="#10233f" textLength="88.0" lengthAdjust="spacing">o săptămână</text>
<rect x="40" y="564.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="587.1" font-size="16" font-weight="700" fill="#ffffff">2. CEI ȘASE PAȘI (p. 182)</text>
<rect x="40" y="598.1" width="820" height="222.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="631.1" font-size="15" fill="#3a3226" font-weight="700">1.</text>
<text x="78.1" y="631.1" font-size="15" fill="#3a3226" textLength="597.5" lengthAdjust="spacing">Notez în caiet ce m-a reținut în textul grupei: o idee, o trăsătură a personajului, limbajul.</text>
<text x="62.0" y="655.8" font-size="15" fill="#3a3226" font-weight="700">2.</text>
<text x="81.0" y="655.8" font-size="15" fill="#3a3226" textLength="702.1" lengthAdjust="spacing">Alegem produsul, poster sau produs cu editoare grafice, și ne împărțim rolurile: coordonatorul, editorul</text>
<text x="81.0" y="677.6" font-size="15" fill="#3a3226" textLength="210.0" lengthAdjust="spacing">textului, editorul imaginilor etc.</text>
<text x="62.0" y="702.3" font-size="15" fill="#3a3226" font-weight="700">3.</text>
<text x="80.9" y="702.3" font-size="15" fill="#3a3226" textLength="171.3" lengthAdjust="spacing">Facem planul proiectului.</text>
<text x="62.0" y="727.1" font-size="15" fill="#3a3226" font-weight="700">4.</text>
<text x="81.2" y="727.1" font-size="15" fill="#3a3226" textLength="714.1" lengthAdjust="spacing">Dezvoltăm planul: numele domnitorului, epoca, trăsăturile din text, valorile promovate, cum se reflectă în</text>
<text x="81.2" y="748.8" font-size="15" fill="#3a3226" textLength="579.0" lengthAdjust="spacing">imagine (trăsături fizice, ținută, elemente cromatice) și informații de la alte discipline.</text>
<text x="62.0" y="773.6" font-size="15" fill="#3a3226" font-weight="700">5.</text>
<text x="80.8" y="773.6" font-size="15" fill="#3a3226" textLength="340.3" lengthAdjust="spacing">Realizăm produsul, cu imagini, desene și scheme.</text>
<text x="62.0" y="798.3" font-size="15" fill="#3a3226" font-weight="700">6.</text>
<text x="80.8" y="798.3" font-size="15" fill="#3a3226" textLength="250.1" lengthAdjust="spacing">Prezentăm proiectul în fața colegilor.</text>
<rect x="40" y="840.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="863.8" font-size="16" font-weight="700" fill="#ffffff">3. FIȘA GRUPEI</text>
<rect x="40" y="874.8" width="820" height="284.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="892.8" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="914.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="89.8" lengthAdjust="spacing">Stabilim la oră</text>
<text x="384.4" y="914.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="67.7" lengthAdjust="spacing">Notăm aici</text>
<line x1="62.0" y1="924.4" x2="838.0" y2="924.4" stroke="#e3dccb"/>
<text x="74.0" y="949.4" font-size="17" fill="#3a3226" font-weight="700" textLength="144.8" lengthAdjust="spacing">Domnitorul grupei</text>
<text x="384.4" y="949.4" font-size="17" fill="#3a3226" textLength="4.6" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="960.5" x2="838.0" y2="960.5" stroke="#e3dccb"/>
<text x="74.0" y="985.5" font-size="17" fill="#3a3226" font-weight="700" textLength="108.4" lengthAdjust="spacing">Produsul ales</text>
<text x="384.4" y="985.5" font-size="17" fill="#3a3226" textLength="4.6" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="996.6" x2="838.0" y2="996.6" stroke="#e3dccb"/>
<text x="74.0" y="1021.6" font-size="17" fill="#3a3226" font-weight="700" textLength="116.2" lengthAdjust="spacing">Coordonatorul</text>
<text x="384.4" y="1021.6" font-size="17" fill="#3a3226" textLength="4.6" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1032.7" x2="838.0" y2="1032.7" stroke="#e3dccb"/>
<text x="74.0" y="1057.7" font-size="17" fill="#3a3226" font-weight="700" textLength="126.5" lengthAdjust="spacing">Editorul textului</text>
<text x="384.4" y="1057.7" font-size="17" fill="#3a3226" textLength="4.6" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1068.8" x2="838.0" y2="1068.8" stroke="#e3dccb"/>
<text x="74.0" y="1093.8" font-size="17" fill="#3a3226" font-weight="700" textLength="145.8" lengthAdjust="spacing">Editorul imaginilor</text>
<text x="384.4" y="1093.8" font-size="17" fill="#3a3226" textLength="4.6" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1104.8" x2="838.0" y2="1104.8" stroke="#e3dccb"/>
<text x="74.0" y="1129.9" font-size="17" fill="#3a3226" font-weight="700" textLength="127.6" lengthAdjust="spacing">Data prezentării</text>
<text x="384.4" y="1129.9" font-size="17" fill="#3a3226" textLength="4.6" lengthAdjust="spacing"> </text>
<line x1="62.0" y1="1141.0" x2="838.0" y2="1141.0" stroke="#e3dccb"/>
<line x1="372.4" y1="892.8" x2="372.4" y2="1141.0" stroke="#e3dccb"/>
<rect x="40" y="1179.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="1202.0" font-size="16" font-weight="700" fill="#ffffff">4. CRITERIILE DE AUTOEVALUARE (p. 182)</text>
<rect x="40" y="1213.0" width="820" height="154.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="1246.0" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="1246.0" font-size="15" fill="#3a3226" textLength="511.6" lengthAdjust="spacing">Prezentarea clară a temei, identificând elemente relevante pentru domnitor</text>
<text x="62.0" y="1270.7" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="1270.7" font-size="15" fill="#3a3226" textLength="636.0" lengthAdjust="spacing">Valorificarea textului, a imaginii asociate acestuia și a informațiilor dobândite la alte discipline</text>
<text x="62.0" y="1295.5" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="1295.5" font-size="15" fill="#3a3226" textLength="197.4" lengthAdjust="spacing">Redactarea unui text coerent</text>
<text x="62.0" y="1320.2" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="1320.2" font-size="15" fill="#3a3226" textLength="265.5" lengthAdjust="spacing">Integrarea de imagini, desene, scheme</text>
<text x="62.0" y="1345.0" font-size="15" fill="#3a3226">•</text>
<text x="76.2" y="1345.0" font-size="15" fill="#3a3226" textLength="306.0" lengthAdjust="spacing">Identificarea valorilor promovate în textul dat</text>
<text x="59.8" y="1399.0" font-size="11.5" fill="#5b6b83" textLength="780.4" lengthAdjust="spacing">Sursa: Manual Art 5, pp. 180-182 (sarcina de lucru, fragmentele și imaginile, timpul de realizare, pașii, lista de criterii). Pașii sunt rezumați din manual;</text>
<text x="351.7" y="1415.6" font-size="11.5" fill="#5b6b83" textLength="196.6" lengthAdjust="spacing">rubricile goale se completează la oră.</text>
</svg>
