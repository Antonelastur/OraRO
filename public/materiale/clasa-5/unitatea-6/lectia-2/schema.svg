<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 875" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="875" fill="#faf7f0"/>
<text x="194.7" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="511.8" lengthAdjust="spacing">Trăsături ale textului narativ nonliterar</text>
<text x="236.4" y="74.4" font-size="14" fill="#5b6b83" textLength="427.3" lengthAdjust="spacing">Clasa a V-a · Unitatea VI, Lecția 2 · Manual, p. 171 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. TEXTUL NARATIV NONLITERAR</text>
<rect x="40" y="128.6" width="820" height="135.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="183.7" lengthAdjust="spacing">Textul narativ nonliterar</text>
<text x="250.0" y="162.6" font-size="16" fill="#10233f" textLength="568.1" lengthAdjust="spacing">prezintă, ca și cel literar, o succesiune de întâmplări în ordine logică și temporală,</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="110.9" lengthAdjust="spacing">dar întâmplările</text>
<text x="177.2" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="185.4" lengthAdjust="spacing">s-au petrecut în realitate</text>
<text x="362.6" y="185.8" font-size="16" fill="#10233f" textLength="212.5" lengthAdjust="spacing">, într-un anumit timp și spațiu.</text>
<text x="62.0" y="219.6" font-size="15" fill="#3a3226" textLength="135.0" lengthAdjust="spacing">Acțiunea e făcută de</text>
<text x="201.1" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="129.4" lengthAdjust="spacing">persoane concrete</text>
<text x="330.5" y="219.6" font-size="15" fill="#3a3226" textLength="249.7" lengthAdjust="spacing">, care există în realitate. Ele se numesc</text>
<text x="584.3" y="219.6" font-size="15" fill="#3a3226" font-weight="700" textLength="81.5" lengthAdjust="spacing">participanți</text>
<text x="669.8" y="219.6" font-size="15" fill="#3a3226" textLength="161.5" lengthAdjust="spacing">și nu trebuie confundate</text>
<text x="62.0" y="241.3" font-size="15" fill="#3a3226" textLength="148.9" lengthAdjust="spacing">cu personajele literare.</text>
<rect x="40" y="283.9" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="306.9" font-size="16" font-weight="700" fill="#ffffff">2. LITERAR SAU NONLITERAR?</text>
<rect x="40" y="317.9" width="820" height="220.0" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="335.9" width="776.0" height="31.6" fill="#efeaf8"/>

<text x="244.7" y="357.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="89.0" lengthAdjust="spacing">Narativ literar</text>
<text x="547.4" y="357.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="113.7" lengthAdjust="spacing">Narativ nonliterar</text>
<line x1="62.0" y1="367.4" x2="838.0" y2="367.4" stroke="#e3dccb"/>
<text x="74.0" y="389.9" font-size="14.5" fill="#3a3226" textLength="75.5" lengthAdjust="spacing">întâmplările</text>
<text x="244.7" y="389.9" font-size="14.5" fill="#3a3226" textLength="121.7" lengthAdjust="spacing">imaginate de autor</text>
<text x="547.4" y="389.9" font-size="14.5" fill="#3a3226" textLength="132.4" lengthAdjust="spacing">petrecute în realitate</text>
<line x1="62.0" y1="400.3" x2="838.0" y2="400.3" stroke="#e3dccb"/>
<text x="74.0" y="422.8" font-size="14.5" fill="#3a3226" textLength="98.0" lengthAdjust="spacing">cine acționează</text>
<text x="244.7" y="422.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="66.4" lengthAdjust="spacing">personaje</text>
<text x="547.4" y="422.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="78.7" lengthAdjust="spacing">participanți</text>
<text x="626.1" y="422.8" font-size="14.5" fill="#3a3226" textLength="101.1" lengthAdjust="spacing">, persoane reale</text>
<line x1="62.0" y1="433.1" x2="838.0" y2="433.1" stroke="#e3dccb"/>
<text x="74.0" y="455.6" font-size="14.5" fill="#3a3226" textLength="89.0" lengthAdjust="spacing">timpul și locul</text>
<text x="244.7" y="455.6" font-size="14.5" fill="#3a3226" textLength="101.5" lengthAdjust="spacing">pot fi imaginare</text>
<text x="547.4" y="455.6" font-size="14.5" fill="#3a3226" textLength="133.5" lengthAdjust="spacing">reale, pot fi verificate</text>
<line x1="62.0" y1="466.0" x2="838.0" y2="466.0" stroke="#e3dccb"/>
<text x="74.0" y="488.5" font-size="14.5" fill="#3a3226" textLength="53.8" lengthAdjust="spacing">exemple</text>
<text x="244.7" y="488.5" font-size="14.5" fill="#3a3226" textLength="119.5" lengthAdjust="spacing">basmul, povestirea</text>
<text x="547.4" y="488.5" font-size="14.5" fill="#3a3226" textLength="237.4" lengthAdjust="spacing">jurnalul, reportajul, articolul, interviul,</text>
<text x="547.4" y="509.5" font-size="14.5" fill="#3a3226" textLength="217.9" lengthAdjust="spacing">scrisoarea, raportul, textul științific</text>
<line x1="62.0" y1="519.8" x2="838.0" y2="519.8" stroke="#e3dccb"/>
<line x1="232.7" y1="335.9" x2="232.7" y2="519.8" stroke="#e3dccb"/>
<line x1="535.4" y1="335.9" x2="535.4" y2="519.8" stroke="#e3dccb"/>
<rect x="40" y="557.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="580.8" font-size="16" font-weight="700" fill="#ffffff">3. INDICII DE TIMP ȘI DE SPAȚIU ÎNTR-UN JURNAL</text>
<rect x="40" y="591.8" width="820" height="232.0" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="609.8" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="144.1" y="631.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="29.8" lengthAdjust="spacing">Date</text>
<text x="293.8" y="631.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="118.7" lengthAdjust="spacing">Zile ale săptămânii</text>
<text x="490.8" y="631.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="112.7" lengthAdjust="spacing">Momente ale zilei</text>
<text x="684.4" y="631.3" font-size="13.5" fill="#10233f" font-weight="700" textLength="113.5" lengthAdjust="spacing">Alți indici de timp</text>
<line x1="62.0" y1="641.4" x2="838.0" y2="641.4" stroke="#e3dccb"/>
<text x="141.1" y="663.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="35.8" lengthAdjust="spacing">8 mai</text>
<text x="323.9" y="663.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="58.3" lengthAdjust="spacing">duminică</text>
<text x="515.3" y="663.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="63.4" lengthAdjust="spacing">dimineața</text>
<text x="707.1" y="663.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="67.9" lengthAdjust="spacing">anul trecut</text>
<line x1="62.0" y1="674.2" x2="838.0" y2="674.2" stroke="#e3dccb"/>
<line x1="256.0" y1="609.8" x2="256.0" y2="674.2" stroke="#e3dccb"/>
<line x1="450.0" y1="609.8" x2="450.0" y2="674.2" stroke="#e3dccb"/>
<line x1="644.0" y1="609.8" x2="644.0" y2="674.2" stroke="#e3dccb"/>
<rect x="62.0" y="688.2" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="162.3" y="709.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="58.0" lengthAdjust="spacing">Localități</text>
<text x="423.1" y="709.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="53.9" lengthAdjust="spacing">Instituții</text>
<text x="676.0" y="709.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="65.5" lengthAdjust="spacing">Alte locuri</text>
<line x1="62.0" y1="719.8" x2="838.0" y2="719.8" stroke="#e3dccb"/>
<text x="170.5" y="742.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="41.8" lengthAdjust="spacing">Brașov</text>
<text x="344.3" y="742.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="211.4" lengthAdjust="spacing">Muzeul Tiparului și al Cărții Vechi</text>
<text x="417.0" y="763.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="66.0" lengthAdjust="spacing">Românești</text>
<text x="660.3" y="742.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="96.7" lengthAdjust="spacing">Turnul Chindiei</text>
<line x1="62.0" y1="773.6" x2="838.0" y2="773.6" stroke="#e3dccb"/>
<line x1="320.7" y1="688.2" x2="320.7" y2="773.6" stroke="#e3dccb"/>
<line x1="579.3" y1="688.2" x2="579.3" y2="773.6" stroke="#e3dccb"/>
<text x="62.0" y="801.7" font-size="14" fill="#5b6b83" textLength="443.6" lengthAdjust="spacing">Locurile dintr-un text nonliterar pot fi verificate pe hartă sau pe internet.</text>
<text x="159.3" y="855.4" font-size="11.5" fill="#5b6b83" textLength="581.4" lengthAdjust="spacing">Sursa: Manual Art 5, p. 171, rubrica Repere și modelul de tabel; exemplele sunt din jurnalul de călătorie din manual.</text>
</svg>
