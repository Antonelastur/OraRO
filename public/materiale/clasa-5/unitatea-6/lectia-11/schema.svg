<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="320" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Enunțul</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea VI, Lecția 8, partea 1/2</text>
  <g>
    <rect x="90" y="100" width="330" height="130" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="255" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">Enunț simplu</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle"><tspan x="255" y="154" font-style="italic">O propoziție.</tspan><tspan x="255" y="176">Trenul a plecat.</tspan></text>
  </g>
  <g>
    <rect x="480" y="100" width="330" height="130" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="645" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">Enunț complex</text>
    <text font-size="12" fill="#3a3226" text-anchor="middle"><tspan x="645" y="154" font-style="italic">Mai multe propoziții.</tspan><tspan x="645" y="176">Trenul a plecat, deși era târziu.</tspan></text>
  </g>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 5, Lecția 8, p. 185</text>
</svg>
