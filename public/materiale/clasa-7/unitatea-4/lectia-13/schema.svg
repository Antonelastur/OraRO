<text x="345.8" y="299.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="37.8" lengthAdjust="spacing">m. sg.</text>
<text x="486.6" y="299.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="35.6" lengthAdjust="spacing">m. pl.</text>
<text x="624.9" y="299.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="30.5" lengthAdjust="spacing">f. sg.</text>
<text x="757.9" y="299.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="28.3" lengthAdjust="spacing">f. pl.</text>
<line x1="62.0" y1="309.4" x2="838.0" y2="309.4" stroke="#e3dccb"/>
