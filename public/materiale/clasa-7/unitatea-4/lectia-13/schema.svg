<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 999" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="999" fill="#faf7f0"/>
<text x="124.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="651.8" lengthAdjust="spacing">Pronumele și adjectivul pronominal demonstrativ</text>
<text x="198.7" y="74.4" font-size="14" fill="#5b6b83" textLength="502.6" lengthAdjust="spacing">Clasa a VII-a · Unitatea a IV-a, Lecția 13 · Manual, pp. 150-151 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ARATĂ</text>
<rect x="40" y="128.6" width="820" height="77.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="175.2" lengthAdjust="spacing">Pronumele demonstrativ</text>
<text x="241.2" y="161.6" font-size="15" fill="#3a3226" textLength="253.6" lengthAdjust="spacing">înlocuiește numele unui obiect și arată</text>
<text x="498.9" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="76.3" lengthAdjust="spacing">apropierea</text>
<text x="579.3" y="161.6" font-size="15" fill="#3a3226" textLength="22.5" lengthAdjust="spacing">sau</text>
<text x="605.9" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="77.0" lengthAdjust="spacing">depărtarea</text>
<text x="686.9" y="161.6" font-size="15" fill="#3a3226" textLength="149.4" lengthAdjust="spacing">lui (în spațiu sau timp),</text>
<text x="62.0" y="183.3" font-size="15" fill="#3a3226" font-weight="700" textLength="76.8" lengthAdjust="spacing">identitatea</text>
<text x="142.9" y="183.3" font-size="15" fill="#3a3226" textLength="22.5" lengthAdjust="spacing">sau</text>
<text x="169.4" y="183.3" font-size="15" fill="#3a3226" font-weight="700" textLength="90.9" lengthAdjust="spacing">diferențierea</text>
<text x="264.4" y="183.3" font-size="15" fill="#3a3226" textLength="247.0" lengthAdjust="spacing">față de alte obiecte. Nu are persoană.</text>
<rect x="40" y="225.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="248.8" font-size="16" font-weight="700" fill="#ffffff">2. FORMELE</text>
<rect x="40" y="259.9" width="820" height="346.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="277.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="299.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="30.1" lengthAdjust="spacing">Felul</text>
