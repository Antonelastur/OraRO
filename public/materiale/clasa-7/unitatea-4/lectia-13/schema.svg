<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Pronumele și adjectivul pronominal demonstrativ</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV · lecția 13 · arată apropierea, depărtarea, identitatea sau diferențierea</text>

  <g font-size="11" fill="#3a3226">
    <rect x="55" y="82" width="200" height="128" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="155" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#10233f">Apropiere</text>
    <text x="155" y="130" text-anchor="middle">obiect mai aproape</text>
    <text x="155" y="150" text-anchor="middle">de vorbitor</text>
    <text x="155" y="178" text-anchor="middle" font-style="italic">acesta, aceasta</text>
    <text x="155" y="196" text-anchor="middle" font-style="italic">(vorbit: ăsta, asta)</text>

    <rect x="265" y="82" width="200" height="128" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="365" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#10233f">Depărtare</text>
    <text x="365" y="130" text-anchor="middle">obiect mai departe</text>
    <text x="365" y="150" text-anchor="middle">de vorbitor</text>
    <text x="365" y="178" text-anchor="middle" font-style="italic">acela, aceea</text>
    <text x="365" y="196" text-anchor="middle" font-style="italic">(vorbit: ăla, aia)</text>

    <rect x="475" y="82" width="200" height="128" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="575" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#10233f">Identitate</text>
    <text x="575" y="130" text-anchor="middle">obiect identic</text>
    <text x="575" y="150" text-anchor="middle">cu altul</text>
    <text x="575" y="178" text-anchor="middle" font-style="italic">același, aceeași</text>

    <rect x="685" y="82" width="200" height="128" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="785" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#10233f">Diferențiere</text>
    <text x="785" y="130" text-anchor="middle">deosebire față</text>
    <text x="785" y="150" text-anchor="middle">de alt obiect</text>
    <text x="785" y="178" text-anchor="middle" font-style="italic">celălalt, cealaltă</text>
  </g>

  <rect x="55" y="224" width="830" height="88" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="75" y="248" font-size="13" font-weight="700" fill="#10233f">De reținut</text>
  <text font-size="11" fill="#3a3226"><tspan x="75" y="270">este lipsit de categoria persoanei; îndeplinește aceleași funcții sintactice ca substantivul</tspan><tspan x="75" y="290">cel, cea, cei, cele = demonstrative semiindependente (cea verde, cel care te-a chemat)</tspan></text>

  <text x="450" y="338" text-anchor="middle" font-size="11" fill="#5b6b83">Adjectivul pronominal demonstrativ: antepus, formă fără -a (acest băiat); postpus, formă cu -a (băiatul acesta). Funcția: atribut adjectival.</text>
  <text x="450" y="366" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 150-151</text>
</svg>
