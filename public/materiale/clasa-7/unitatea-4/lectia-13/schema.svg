<text x="237.4" y="330.4" font-size="13" fill="#3a3226" textLength="29.4" lengthAdjust="spacing">N-Ac</text>
<text x="329.5" y="330.4" font-size="13" fill="#3a3226" textLength="70.3" lengthAdjust="spacing">acesta (ăsta)</text>
<text x="466.0" y="330.4" font-size="13" fill="#3a3226" textLength="76.6" lengthAdjust="spacing">aceștia (ăștia)</text>
<text x="601.6" y="330.4" font-size="13" fill="#3a3226" textLength="77.0" lengthAdjust="spacing">aceasta (asta)</text>
<text x="730.1" y="330.4" font-size="13" fill="#3a3226" textLength="83.8" lengthAdjust="spacing">acestea (astea)</text>
<line x1="62.0" y1="340.3" x2="838.0" y2="340.3" stroke="#e3dccb"/>

