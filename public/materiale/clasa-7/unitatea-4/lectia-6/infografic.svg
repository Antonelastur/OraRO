<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Textul multimodal. Enciclopedia</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV · Porțelanul, după Stacey Pierson</text>
  <g>
    <rect x="60" y="95" width="360" height="180" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="240" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Text multimodal</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="240" y="150">Combină text, imagini,</tspan>
      <tspan x="240" y="166">grafice, hărți — informația</tspan>
      <tspan x="240" y="182">vine pe mai multe canale.</tspan>
    </text>
  </g>
  <g>
    <rect x="480" y="95" width="360" height="180" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="660" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Textul enciclopedic</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle">
      <tspan x="660" y="150">Obiectiv, organizat pe</tspan>
      <tspan x="660" y="166">subteme, cu informații</tspan>
      <tspan x="660" y="182">verificabile despre un subiect.</tspan>
    </text>
  </g>
  <text x="450" y="300" text-anchor="middle" font-size="11.5" fill="#3a3226">Colectezi informații din mai multe surse, apoi le organizezi coerent.</text>
  <text x="450" y="322" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 136-139</text>
</svg>
