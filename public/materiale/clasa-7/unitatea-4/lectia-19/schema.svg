<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1036" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1036" fill="#faf7f0"/>
<text x="177.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="546.5" lengthAdjust="spacing">Posibilitățile combinatorii ale pronumelui</text>
<text x="198.7" y="74.4" font-size="14" fill="#5b6b83" textLength="502.6" lengthAdjust="spacing">Clasa a VII-a · Unitatea a IV-a, Lecția 19 · Manual, pp. 158-159 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. PRONUMELE CENTRU</text>
<rect x="40" y="128.6" width="820" height="231.8" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="146.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="114.5" lengthAdjust="spacing">I se subordonează</text>
<text x="368.9" y="168.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="53.7" lengthAdjust="spacing">Exemple</text>
<line x1="62.0" y1="178.2" x2="838.0" y2="178.2" stroke="#e3dccb"/>
<text x="74.0" y="200.7" font-size="14.5" fill="#3a3226" textLength="118.2" lengthAdjust="spacing">atributul adjectival</text>
<text x="368.9" y="200.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="319.4" lengthAdjust="spacing">acela roșu, ceva frumos, nimic interesant, toți aceia</text>
<line x1="62.0" y1="211.0" x2="838.0" y2="211.0" stroke="#e3dccb"/>
<text x="74.0" y="233.5" font-size="14.5" fill="#3a3226" textLength="222.4" lengthAdjust="spacing">atributul substantival prepozițional</text>
<text x="368.9" y="233.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="217.5" lengthAdjust="spacing">tu din fotografie, niciunul din clasă</text>
<line x1="62.0" y1="243.8" x2="838.0" y2="243.8" stroke="#e3dccb"/>
<text x="74.0" y="266.4" font-size="14.5" fill="#3a3226" textLength="192.1" lengthAdjust="spacing">atributul substantival genitival</text>
<text x="368.9" y="266.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="93.5" lengthAdjust="spacing">nimic al Mariei</text>
<line x1="62.0" y1="276.7" x2="838.0" y2="276.7" stroke="#e3dccb"/>
<text x="74.0" y="299.2" font-size="14.5" fill="#3a3226" textLength="220.7" lengthAdjust="spacing">atributul pronominal prepozițional</text>
<text x="368.9" y="299.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="203.1" lengthAdjust="spacing">care dintre ei, unul ca dumneata</text>
<line x1="62.0" y1="309.6" x2="838.0" y2="309.6" stroke="#e3dccb"/>
<text x="74.0" y="332.0" font-size="14.5" fill="#3a3226" textLength="116.7" lengthAdjust="spacing">atributul adverbial</text>
<text x="368.9" y="332.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="197.3" lengthAdjust="spacing">acesta de alături, oricine de aici</text>
<line x1="62.0" y1="342.4" x2="838.0" y2="342.4" stroke="#e3dccb"/>
<line x1="356.9" y1="146.6" x2="356.9" y2="342.4" stroke="#e3dccb"/>
<rect x="40" y="380.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="403.4" font-size="16" font-weight="700" fill="#ffffff">2. PRONUMELE ADJUNCT</text>
<rect x="40" y="414.4" width="820" height="317.3" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="432.4" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="453.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="43.6" lengthAdjust="spacing">Grupul</text>
<text x="198.2" y="453.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="46.3" lengthAdjust="spacing">Funcția</text>
<text x="462.0" y="453.9" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="463.9" x2="838.0" y2="463.9" stroke="#e3dccb"/>
<text x="74.0" y="486.4" font-size="14.5" fill="#3a3226" textLength="51.9" lengthAdjust="spacing">nominal</text>
<text x="198.2" y="486.4" font-size="14.5" fill="#3a3226" textLength="223.7" lengthAdjust="spacing">atribut prepozițional / genitival / în</text>
<text x="198.2" y="507.5" font-size="14.5" fill="#3a3226" textLength="31.3" lengthAdjust="spacing">dativ</text>
<text x="462.0" y="486.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="358.9" lengthAdjust="spacing">felicitarea de la unii; casa acestora; gândurile-ți frumoase</text>
<line x1="62.0" y1="517.8" x2="838.0" y2="517.8" stroke="#e3dccb"/>
<text x="74.0" y="540.3" font-size="14.5" fill="#3a3226" textLength="39.0" lengthAdjust="spacing">verbal</text>
<text x="198.2" y="540.3" font-size="14.5" fill="#3a3226" textLength="191.7" lengthAdjust="spacing">complement direct / indirect /</text>
<text x="198.2" y="561.3" font-size="14.5" fill="#3a3226" textLength="84.4" lengthAdjust="spacing">prepozițional</text>
<text x="462.0" y="540.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="283.0" lengthAdjust="spacing">Scrie asta. Fiecăruia îi pasă. Se teme de ai tăi.</text>
<line x1="62.0" y1="571.7" x2="838.0" y2="571.7" stroke="#e3dccb"/>
<text x="74.0" y="594.2" font-size="14.5" fill="#3a3226" textLength="39.0" lengthAdjust="spacing">verbal</text>
<text x="198.2" y="594.2" font-size="14.5" fill="#3a3226" textLength="217.2" lengthAdjust="spacing">circumstanțial de loc / timp / mod</text>
<text x="462.0" y="594.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="351.0" lengthAdjust="spacing">Stă lângă oricine. Sosise înaintea lor. Atenția cu care mă</text>
<text x="462.0" y="615.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="49.9" lengthAdjust="spacing">asculți...</text>
<line x1="62.0" y1="625.6" x2="838.0" y2="625.6" stroke="#e3dccb"/>
<text x="74.0" y="648.1" font-size="14.5" fill="#3a3226" textLength="39.0" lengthAdjust="spacing">verbal</text>
<text x="198.2" y="648.1" font-size="14.5" fill="#3a3226" textLength="192.1" lengthAdjust="spacing">circumstanțial de cauză / scop</text>
<text x="462.0" y="648.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="337.4" lengthAdjust="spacing">Boala de care a suferit... Examenul pentru care înveți...</text>
<line x1="62.0" y1="658.4" x2="838.0" y2="658.4" stroke="#e3dccb"/>
<line x1="186.2" y1="432.4" x2="186.2" y2="658.4" stroke="#e3dccb"/>
<line x1="450.0" y1="432.4" x2="450.0" y2="658.4" stroke="#e3dccb"/>
<text x="62.0" y="687.4" font-size="15" fill="#3a3226" textLength="261.1" lengthAdjust="spacing">Două funcții deosebite în grupul verbal:</text>
<text x="327.2" y="687.4" font-size="15" fill="#3a3226" font-weight="700" textLength="63.8" lengthAdjust="spacing">subiectul</text>
<text x="395.0" y="687.4" font-size="15" fill="#3a3226" textLength="117.9" lengthAdjust="spacing">(interdependență:</text>
<text x="516.9" y="687.4" font-size="15" fill="#10233f" font-style="italic" textLength="138.4" lengthAdjust="spacing">Nimeni nu a răspuns.</text>
<text x="655.4" y="687.4" font-size="15" fill="#3a3226" textLength="18.4" lengthAdjust="spacing">) și</text>
<text x="677.9" y="687.4" font-size="15" fill="#3a3226" font-weight="700" textLength="127.0" lengthAdjust="spacing">numele predicativ</text>
<text x="62.0" y="709.2" font-size="15" fill="#3a3226" textLength="99.9" lengthAdjust="spacing">(relație ternară:</text>
<text x="165.9" y="709.2" font-size="15" fill="#10233f" font-style="italic" textLength="127.7" lengthAdjust="spacing">Caietul este al meu.</text>
<text x="293.6" y="709.2" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">).</text>
<rect x="40" y="751.7" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="774.7" font-size="16" font-weight="700" fill="#ffffff">3. ADJECTIVELE PRONOMINALE</text>
<rect x="40" y="785.7" width="820" height="199.5" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="803.7" width="776.0" height="63.9" rx="12" fill="#f3efe4"/><text x="78.0" y="830.2" font-size="14.5" fill="#3a3226" textLength="727.3" lengthAdjust="spacing">Toate adjectivele pronominale (posesive, demonstrative, nehotărâte, interogative, relative, negative, de întărire) au</text>
<text x="78.0" y="851.2" font-size="14.5" fill="#3a3226" textLength="63.5" lengthAdjust="spacing">funcția de</text>
<text x="145.4" y="851.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="116.0" lengthAdjust="spacing">atribut adjectival</text>
<text x="261.4" y="851.2" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<rect x="62.0" y="881.5" width="776.0" height="85.6" rx="12" fill="#f3efe4"/><text x="78.0" y="908.0" font-size="14.5" fill="#10233f" font-weight="700" textLength="127.7" lengthAdjust="spacing">Modele de analiză:</text>
<text x="78.0" y="926.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="468.6" lengthAdjust="spacing">„cine” – pronume interogativ, cazul nominativ, funcție sintactică de subiect.</text>
<text x="78.0" y="950.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="633.3" lengthAdjust="spacing">„acestui” – adjectiv pronominal demonstrativ de apropiere, neutru, singular, genitiv, atribut adjectival.</text>
<text x="224.7" y="1016.7" font-size="11.5" fill="#5b6b83" textLength="450.6" lengthAdjust="spacing">Sursa: Manual Art 7, pp. 158-159, rubrica Repere, tabelul funcțiilor și modelele de analiză.</text>
</svg>
