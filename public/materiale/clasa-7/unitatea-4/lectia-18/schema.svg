<rect x="40" y="588.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="611.1" font-size="16" font-weight="700" fill="#ffffff">3. MODEL DE ANALIZĂ</text>
<rect x="40" y="622.1" width="820" height="99.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="640.1" width="776.0" height="63.9" rx="12" fill="#f3efe4"/><text x="78.0" y="666.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="674.5" lengthAdjust="spacing">„însăși” – adjectiv pronominal de întărire, acordat în gen, număr și caz cu pronumele „ea” (feminin, singular,</text>
<text x="78.0" y="687.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="312.5" lengthAdjust="spacing">nominativ), funcția sintactică de atribut adjectival.</text>
<text x="243.0" y="753.4" font-size="11.5" fill="#5b6b83" textLength="414.0" lengthAdjust="spacing">Sursa: Manual Art 7, p. 157, rubrica Repere, tabelul formelor și modelul de analiză.</text>
</svg>
