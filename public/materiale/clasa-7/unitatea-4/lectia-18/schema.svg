<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 773" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="773" fill="#faf7f0"/>
<text x="231.5" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="437.9" lengthAdjust="spacing">Adjectivul pronominal de întărire</text>
<text x="217.0" y="74.4" font-size="14" fill="#5b6b83" textLength="466.1" lengthAdjust="spacing">Clasa a VII-a · Unitatea a IV-a, Lecția 18 · Manual, p. 157 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE</text>
<rect x="40" y="128.6" width="820" height="132.5" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="76.8" lengthAdjust="spacing">Pronumele</text>
<text x="142.9" y="161.6" font-size="15" fill="#3a3226" textLength="365.2" lengthAdjust="spacing">de întărire a dispărut din limba de azi; se folosește doar</text>
<text x="512.1" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="232.2" lengthAdjust="spacing">adjectivul pronominal de întărire</text>
<text x="744.3" y="161.6" font-size="15" fill="#3a3226" textLength="88.5" lengthAdjust="spacing">. Se acordă în</text>
<text x="62.0" y="183.3" font-size="15" fill="#3a3226" textLength="411.0" lengthAdjust="spacing">gen, număr și caz cu substantivul sau pronumele determinat și</text>
<text x="477.0" y="183.3" font-size="15" fill="#3a3226" font-weight="700" textLength="178.3" lengthAdjust="spacing">precizează prin insistență</text>
<text x="659.4" y="183.3" font-size="15" fill="#3a3226" textLength="64.2" lengthAdjust="spacing">persoana:</text>
<text x="727.7" y="183.3" font-size="15" fill="#10233f" font-style="italic" textLength="64.5" lengthAdjust="spacing">Directorul</text>
<text x="796.2" y="183.3" font-size="15" fill="#3a3226" font-weight="700" textLength="39.9" lengthAdjust="spacing">însuși</text>
<text x="62.0" y="205.1" font-size="15" fill="#10233f" font-style="italic" textLength="85.2" lengthAdjust="spacing">ne-a sprijinit.</text>
<text x="62.0" y="238.6" font-size="15" fill="#3a3226" textLength="51.0" lengthAdjust="spacing">Funcția:</text>
<text x="117.0" y="238.6" font-size="15" fill="#3a3226" font-weight="700" textLength="120.0" lengthAdjust="spacing">atribut adjectival</text>
<text x="237.0" y="238.6" font-size="15" fill="#3a3226" textLength="199.2" lengthAdjust="spacing">. Tendința de azi: înlocuirea cu</text>
<text x="440.3" y="238.6" font-size="15" fill="#3a3226" font-weight="700" textLength="34.5" lengthAdjust="spacing">chiar</text>
<text x="474.8" y="238.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="482.1" y="238.6" font-size="15" fill="#10233f" font-style="italic" textLength="100.0" lengthAdjust="spacing">A venit chiar el.</text>
<rect x="40" y="281.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="304.1" font-size="16" font-weight="700" fill="#ffffff">2. FORMELE</text>
<rect x="40" y="315.1" width="820" height="253.0" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="333.1" width="776.0" height="31.6" fill="#efeaf8"/>

<text x="215.6" y="354.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="34.2" lengthAdjust="spacing">Cazul</text>
<text x="330.3" y="354.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="37.8" lengthAdjust="spacing">m. sg.</text>
<text x="473.6" y="354.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="30.5" lengthAdjust="spacing">f. sg.</text>
<text x="610.7" y="354.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="35.6" lengthAdjust="spacing">m. pl.</text>
<text x="754.1" y="354.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="28.3" lengthAdjust="spacing">f. pl.</text>
