<text x="333.6" y="447.5" font-size="13" fill="#3a3226" textLength="30.9" lengthAdjust="spacing">însuți</text>
<text x="473.7" y="447.5" font-size="13" fill="#3a3226" textLength="30.2" lengthAdjust="spacing">însăți</text>
<text x="612.5" y="447.5" font-size="13" fill="#3a3226" textLength="32.0" lengthAdjust="spacing">înșivă</text>
<text x="750.4" y="447.5" font-size="13" fill="#3a3226" textLength="35.6" lengthAdjust="spacing">însevă</text>
<line x1="62.0" y1="457.4" x2="838.0" y2="457.4" stroke="#e3dccb"/>

