<text x="74.0" y="385.7" font-size="13" fill="#3a3226" textLength="59.8" lengthAdjust="spacing">persoana I</text>
<text x="218.0" y="385.7" font-size="13" fill="#3a3226" textLength="29.4" lengthAdjust="spacing">N-Ac</text>
<text x="330.3" y="385.7" font-size="13" fill="#3a3226" textLength="37.7" lengthAdjust="spacing">însumi</text>
<text x="470.3" y="385.7" font-size="13" fill="#3a3226" textLength="36.9" lengthAdjust="spacing">însămi</text>
<text x="611.8" y="385.7" font-size="13" fill="#3a3226" textLength="33.3" lengthAdjust="spacing">înșine</text>
<text x="749.7" y="385.7" font-size="13" fill="#3a3226" textLength="36.9" lengthAdjust="spacing">însene</text>
<line x1="62.0" y1="395.6" x2="838.0" y2="395.6" stroke="#e3dccb"/>

