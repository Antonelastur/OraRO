<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="350" fill="#faf7f0"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Adjectivul pronominal de întărire</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV · lecția 18 · precizează prin insistență persoana la care se referă</text>

  <rect x="60" y="82" width="780" height="66" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="80" y="106" font-size="13" font-weight="700" fill="#10233f">Situația în limba de azi</text>
  <text font-size="11" fill="#3a3226"><tspan x="80" y="128">pronumele de întărire a dispărut din limba română contemporană;</tspan><tspan x="80" y="146">se folosește numai adjectivul pronominal de întărire</tspan></text>

  <rect x="60" y="164" width="375" height="120" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="80" y="188" font-size="13" font-weight="700" fill="#10233f">Forme</text>
  <text font-size="11" fill="#3a3226"><tspan x="80" y="210" font-style="italic">însumi, însămi, însuți, însăți,</tspan><tspan x="80" y="228" font-style="italic">însuși, însăși</tspan><tspan x="80" y="252" font-style="italic">înșine, însene, înșivă, însevă,</tspan><tspan x="80" y="270" font-style="italic">înșiși, înseși / însele</tspan></text>

  <rect x="465" y="164" width="375" height="120" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="485" y="188" font-size="13" font-weight="700" fill="#10233f">Acord și funcție</text>
  <text font-size="11" fill="#3a3226"><tspan x="485" y="210">se acordă în gen, număr și caz cu</tspan><tspan x="485" y="228">substantivul sau pronumele determinat</tspan><tspan x="485" y="252">funcția sintactică: atribut adjectival</tspan><tspan x="485" y="272">tinde să fie înlocuit cu „chiar”: chiar el</tspan></text>

  <text x="450" y="326" text-anchor="middle" font-size="11" fill="#5b6b83">Exemplu: Directorul însuși ne-a sprijinit. · Dana vorbește despre ea însăși.</text>
  <text x="450" y="344" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, p. 157</text>
</svg>
