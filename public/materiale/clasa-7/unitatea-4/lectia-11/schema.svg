<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Pronumele personal, de politețe, reflexiv</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV · actualizare</text>
  <g>
    <rect x="60" y="95" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="180" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Personal</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="180" y="150">ține locul unui</tspan><tspan x="180" y="166">substantiv</tspan><tspan x="180" y="192" font-style="italic">eu, tu, el, ea...</tspan></text>
  </g>
  <g>
    <rect x="330" y="95" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">De politețe</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="450" y="150">arată respect față</tspan><tspan x="450" y="166">de interlocutor</tspan><tspan x="450" y="192" font-style="italic">dumneavoastră</tspan></text>
  </g>
  <g>
    <rect x="600" y="95" width="240" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="720" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Reflexiv</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="720" y="150">acțiunea se răsfrânge</tspan><tspan x="720" y="166">asupra subiectului</tspan><tspan x="720" y="192" font-style="italic">se spală, își dă</tspan></text>
  </g>
  <text x="450" y="290" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 146-147</text>
</svg>
