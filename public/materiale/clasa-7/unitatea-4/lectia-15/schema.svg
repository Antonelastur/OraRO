<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="360" fill="#faf7f0"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Pronumele și adjectivul pronominal interogativ</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV · lecția 15 · ține locul substantivului așteptat ca răspuns la o întrebare</text>

  <rect x="60" y="82" width="780" height="70" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="80" y="106" font-size="13" font-weight="700" fill="#10233f">Forme</text>
  <text font-size="13" fill="#3a3226"><tspan x="80" y="132" font-style="italic">care, cine, ce, cât, câtă, câți, câte</tspan></text>

  <rect x="60" y="168" width="375" height="120" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="80" y="192" font-size="13" font-weight="700" fill="#10233f">Unde apare</text>
  <text font-size="11" fill="#3a3226"><tspan x="80" y="214">numai în enunțuri interogative,</tspan><tspan x="80" y="232">de obicei la începutul lor</tspan><tspan x="80" y="258" font-style="italic">Cine vorbește? — Vorbește Ana.</tspan></text>

  <rect x="465" y="168" width="375" height="120" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="485" y="192" font-size="13" font-weight="700" fill="#10233f">Funcția sintactică</text>
  <text font-size="11" fill="#3a3226"><tspan x="485" y="214">este aceeași cu a cuvântului</tspan><tspan x="485" y="232">așteptat ca răspuns la întrebare</tspan><tspan x="485" y="258">(subiect, nume predicativ, complement,</tspan><tspan x="485" y="274">atribut pronominal genitival…)</tspan></text>

  <text x="450" y="322" text-anchor="middle" font-size="11" fill="#5b6b83">Când determină un substantiv cu care se acordă în gen, număr și caz, devine adjectiv pronominal interogativ: atribut adjectival.</text>
  <text x="450" y="346" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, p. 153</text>
</svg>
