<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="370" fill="#faf7f0"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Pronumele și adjectivul pronominal relativ</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea IV · lecția 16 · face legătura, în frază, între o secundară și propoziția de care depinde</text>

  <rect x="60" y="82" width="780" height="76" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="80" y="106" font-size="13" font-weight="700" fill="#10233f">Forme</text>
  <text font-size="12" fill="#3a3226"><tspan x="80" y="128" font-style="italic">care, cine, ce, cât, câtă, câți, câte</tspan><tspan x="80" y="146">omonime cu pronumele interogative; compus: ceea ce; popular, invariabil: de</tspan></text>

  <rect x="60" y="174" width="375" height="118" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="80" y="198" font-size="13" font-weight="700" fill="#10233f">Funcția sintactică</text>
  <text font-size="11" fill="#3a3226"><tspan x="80" y="222">o îndeplinește chiar în propoziția</tspan><tspan x="80" y="242">pe care o introduce: subiect, nume</tspan><tspan x="80" y="262">predicativ, complement, atribut</tspan><tspan x="80" y="282">pronominal genitival, circumstanțial…</tspan></text>

  <rect x="465" y="174" width="375" height="118" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="485" y="198" font-size="13" font-weight="700" fill="#10233f">De reținut</text>
  <text font-size="11" fill="#3a3226"><tspan x="485" y="220">„care” complement direct primește</tspan><tspan x="485" y="238">obligatoriu prepoziția „pe”</tspan><tspan x="485" y="264">la genitiv, se acordă în gen și număr</tspan><tspan x="485" y="282">cu substantivul înlocuit: a cărui, a cărei</tspan></text>

  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#5b6b83">Când determină un substantiv nearticulat înaintea căruia stă și se acordă cu el, devine adjectiv pronominal relativ: atribut adjectival.</text>
  <text x="450" y="356" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 154-155</text>
</svg>
