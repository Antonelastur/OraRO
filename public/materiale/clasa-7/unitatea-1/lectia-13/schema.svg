<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Compunerea. Familia lexicală</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 12</text>
  <g>
    <rect x="90" y="95" width="330" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="255" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">Compunerea</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle"><tspan x="255" y="150">Unește doi sau mai mulți</tspan><tspan x="255" y="166">termeni într-un cuvânt nou.</tspan><tspan x="255" y="192" font-style="italic">bună + stare → bunăstare</tspan></text>
  </g>
  <g>
    <rect x="480" y="95" width="330" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="645" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10233f">Familia lexicală</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle"><tspan x="645" y="150">Toate cuvintele formate</tspan><tspan x="645" y="166">de la aceeași rădăcină.</tspan><tspan x="645" y="192" font-style="italic">carte → cărticică, cărturar</tspan></text>
  </g>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 34-35</text>
</svg>
