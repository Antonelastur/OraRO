<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Derivarea</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 11</text>
  <g>
    <rect x="60" y="95" width="240" height="170" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="180" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Cu prefix/sufix</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="180" y="150">cuvânt de bază +</tspan><tspan x="180" y="166">prefix sau sufix</tspan><tspan x="180" y="192" font-style="italic">citi → citi-tor</tspan></text>
  </g>
  <g>
    <rect x="330" y="95" width="240" height="170" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Parasintetic</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="450" y="150">prefix + rădăcină</tspan><tspan x="450" y="166">+ sufix, deodată</tspan><tspan x="450" y="192" font-style="italic">în-frumuseț-are</tspan></text>
  </g>
  <g>
    <rect x="600" y="95" width="240" height="170" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="720" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Diminutival</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="720" y="150">sufix care arată</tspan><tspan x="720" y="166">mărime mai mică</tspan><tspan x="720" y="192" font-style="italic">carte → cărticică</tspan></text>
  </g>
  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 32-33</text>
</svg>
