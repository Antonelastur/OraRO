<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Conjuncția</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 10 · coordonatoare</text>
  <g>
    <rect x="60" y="100" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="180" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Copulativă</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="180" y="154">adaugă</tspan><tspan x="180" y="178" font-style="italic">și, nici</tspan></text>
  </g>
  <g>
    <rect x="330" y="100" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Adversativă</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="450" y="154">opune</tspan><tspan x="450" y="178" font-style="italic">dar, însă, iar</tspan></text>
  </g>
  <g>
    <rect x="600" y="100" width="240" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="720" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Disjunctivă</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="720" y="154">exclude</tspan><tspan x="720" y="178" font-style="italic">sau, ori</tspan></text>
  </g>
  <text x="450" y="290" text-anchor="middle" font-size="11.5" fill="#3a3226">Leagă părți de propoziție (intrapropozițional) sau propoziții întregi (interpropozițional).</text>
  <text x="450" y="316" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 30-31</text>
</svg>
