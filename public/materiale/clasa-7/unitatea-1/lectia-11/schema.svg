<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 887" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="887" fill="#faf7f0"/>
<text x="379.6" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="140.8" lengthAdjust="spacing">Conjuncția</text>
<text x="222.4" y="74.4" font-size="14" fill="#5b6b83" textLength="455.1" lengthAdjust="spacing">Clasa a VII-a · Unitatea I, Lecția 11 · Manual, pp. 30-31 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. CE ESTE</text>
<rect x="40" y="128.6" width="820" height="185.6" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="80.5" lengthAdjust="spacing">Conjuncția</text>
<text x="146.8" y="162.6" font-size="16" fill="#10233f" textLength="160.2" lengthAdjust="spacing">este o parte de vorbire</text>
<text x="311.3" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="78.4" lengthAdjust="spacing">neflexibilă</text>
<text x="394.0" y="162.6" font-size="16" fill="#10233f" textLength="172.3" lengthAdjust="spacing">care leagă: în propoziție,</text>
<text x="570.6" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="260.2" lengthAdjust="spacing">două părți de propoziție de același</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="19.2" lengthAdjust="spacing">fel</text>
<text x="81.2" y="185.8" font-size="16" fill="#10233f" textLength="62.7" lengthAdjust="spacing">; în frază,</text>
<text x="148.2" y="185.8" font-size="16" fill="#10233f" font-weight="700" textLength="115.7" lengthAdjust="spacing">două propoziții</text>
<text x="268.2" y="185.8" font-size="16" fill="#10233f" textLength="185.4" lengthAdjust="spacing">(de același fel sau diferite).</text>
<rect x="62.0" y="204.6" width="380.0" height="91.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="232.6" font-size="16" fill="#0d9c92" font-weight="700" textLength="49.3" lengthAdjust="spacing">simple</text>
<text x="78.0" y="255.9" font-size="14.5" fill="#3a3226" textLength="66.3" lengthAdjust="spacing">un termen</text>
<text x="78.0" y="279.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="186.4" lengthAdjust="spacing">ci, dar, fie, iar, însă, ori, sau, și</text>
<rect x="458.0" y="204.6" width="380.0" height="91.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="232.6" font-size="16" fill="#6f5ea8" font-weight="700" textLength="67.5" lengthAdjust="spacing">compuse</text>
<text x="474.0" y="255.9" font-size="14.5" fill="#3a3226" textLength="163.3" lengthAdjust="spacing">doi sau mai mulți termeni</text>
<text x="474.0" y="279.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="31.8" lengthAdjust="spacing">ca să</text>
<rect x="40" y="334.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="357.2" font-size="16" font-weight="700" fill="#ffffff">2. CONJUNCȚIILE COORDONATOARE</text>
<rect x="40" y="368.2" width="820" height="283.1" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="386.2" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="407.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="30.1" lengthAdjust="spacing">Felul</text>
<text x="205.9" y="407.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="51.8" lengthAdjust="spacing">Exprimă</text>
<text x="361.1" y="407.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="64.4" lengthAdjust="spacing">Conjuncții</text>
<text x="524.1" y="407.7" font-size="13.5" fill="#10233f" font-weight="700" textLength="45.9" lengthAdjust="spacing">Virgula</text>
<line x1="62.0" y1="417.7" x2="838.0" y2="417.7" stroke="#e3dccb"/>
<text x="74.0" y="440.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="70.9" lengthAdjust="spacing">copulative</text>
<text x="205.9" y="440.2" font-size="14.5" fill="#3a3226" textLength="59.7" lengthAdjust="spacing">asocierea</text>
<text x="361.1" y="440.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="38.7" lengthAdjust="spacing">și, nici</text>

<line x1="62.0" y1="450.6" x2="838.0" y2="450.6" stroke="#e3dccb"/>
<text x="74.0" y="473.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="73.5" lengthAdjust="spacing">disjunctive</text>
<text x="205.9" y="473.1" font-size="14.5" fill="#3a3226" textLength="71.9" lengthAdjust="spacing">excluderea,</text>
<text x="205.9" y="494.1" font-size="14.5" fill="#3a3226" textLength="66.8" lengthAdjust="spacing">alternativa</text>
<text x="361.1" y="473.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="90.8" lengthAdjust="spacing">sau, ori, fie, ba</text>
<text x="524.1" y="473.1" font-size="14.5" fill="#3a3226" textLength="66.0" lengthAdjust="spacing">în perechi,</text>
<text x="594.0" y="473.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="47.4" lengthAdjust="spacing">virgulă</text>
<text x="645.3" y="473.1" font-size="14.5" fill="#3a3226" textLength="166.9" lengthAdjust="spacing">înaintea celui de-al doilea:</text>
<text x="524.1" y="494.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="106.3" lengthAdjust="spacing">Sau vii, sau pleci.</text>
<line x1="62.0" y1="504.4" x2="838.0" y2="504.4" stroke="#e3dccb"/>
<text x="74.0" y="526.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="77.9" lengthAdjust="spacing">adversative</text>
<text x="205.9" y="526.9" font-size="14.5" fill="#3a3226" textLength="51.5" lengthAdjust="spacing">opoziția</text>
<text x="361.1" y="526.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="114.8" lengthAdjust="spacing">dar, iar, ci, însă, or</text>
<text x="524.1" y="526.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="121.8" lengthAdjust="spacing">totdeauna virgulă</text>
<text x="649.8" y="526.9" font-size="14.5" fill="#3a3226" textLength="46.5" lengthAdjust="spacing">înainte;</text>
<text x="700.3" y="526.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="25.5" lengthAdjust="spacing">însă</text>
<text x="729.7" y="526.9" font-size="14.5" fill="#3a3226" textLength="65.5" lengthAdjust="spacing">în mijlocul</text>
<text x="524.1" y="548.0" font-size="14.5" fill="#3a3226" textLength="164.7" lengthAdjust="spacing">propoziției nu se izolează:</text>
<text x="692.7" y="548.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="118.9" lengthAdjust="spacing">Colegul tău a sosit,</text>
<text x="524.1" y="569.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="126.7" lengthAdjust="spacing">al meu însă întârzie.</text>
<line x1="62.0" y1="579.3" x2="838.0" y2="579.3" stroke="#e3dccb"/>
<text x="74.0" y="601.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="71.2" lengthAdjust="spacing">concluzive</text>
<text x="205.9" y="601.8" font-size="14.5" fill="#3a3226" textLength="59.3" lengthAdjust="spacing">concluzia</text>
<text x="361.1" y="601.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="25.1" lengthAdjust="spacing">deci</text>
<text x="524.1" y="601.8" font-size="14.5" fill="#3a3226" textLength="247.2" lengthAdjust="spacing">în interiorul propoziției nu se desparte:</text>
<text x="775.2" y="601.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="21.6" lengthAdjust="spacing">Am</text>
<text x="524.1" y="622.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="115.6" lengthAdjust="spacing">început deci lecția.</text>
<line x1="62.0" y1="633.2" x2="838.0" y2="633.2" stroke="#e3dccb"/>
<line x1="193.9" y1="386.2" x2="193.9" y2="633.2" stroke="#e3dccb"/>
<line x1="349.1" y1="386.2" x2="349.1" y2="633.2" stroke="#e3dccb"/>
<line x1="512.1" y1="386.2" x2="512.1" y2="633.2" stroke="#e3dccb"/>
<rect x="40" y="671.2" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="694.2" font-size="16" font-weight="700" fill="#ffffff">3. CONJUNCȚIILE SUBORDONATOARE</text>
<rect x="40" y="705.2" width="820" height="131.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="738.2" font-size="15" fill="#3a3226" textLength="106.3" lengthAdjust="spacing">Leagă propoziții</text>
<text x="172.4" y="738.2" font-size="15" fill="#3a3226" font-weight="700" textLength="181.3" lengthAdjust="spacing">care nu sunt de același fel</text>
<text x="353.7" y="738.2" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="361.1" y="738.2" font-size="15" fill="#10233f" font-style="italic" textLength="197.1" lengthAdjust="spacing">că, să, dacă, fiindcă, deși, încât</text>
<text x="558.2" y="738.2" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="756.7" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="783.2" font-size="14.5" fill="#10233f" font-weight="700" textLength="119.9" lengthAdjust="spacing">Model de analiză:</text>
<text x="78.0" y="802.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="312.0" lengthAdjust="spacing">„și” – conjuncție simplă coordonatoare copulativă.</text>
<text x="277.8" y="867.9" font-size="11.5" fill="#5b6b83" textLength="344.4" lengthAdjust="spacing">Sursa: Manual Art 7, pp. 30-31, rubrica Repere și modelul de analiză.</text>
</svg>
