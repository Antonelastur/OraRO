<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1004" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1004" fill="#faf7f0"/>
<text x="201.1" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="499.0" lengthAdjust="spacing">Fraza. Coordonarea. Punctul și virgula</text>
<text x="222.4" y="74.4" font-size="14" fill="#5b6b83" textLength="455.1" lengthAdjust="spacing">Clasa a VII-a · Unitatea I, Lecția 10 · Manual, pp. 28-29 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. FRAZA</text>
<rect x="40" y="128.6" width="820" height="195.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="39.7" lengthAdjust="spacing">Fraza</text>
<text x="106.0" y="162.6" font-size="16" fill="#10233f" textLength="179.2" lengthAdjust="spacing">este un enunț alcătuit din</text>
<text x="289.5" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="226.2" lengthAdjust="spacing">două sau mai multe propoziții</text>
<text x="515.8" y="162.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">.</text>
<rect x="62.0" y="181.4" width="380.0" height="91.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="209.4" font-size="16" fill="#0d9c92" font-weight="700" textLength="156.2" lengthAdjust="spacing">propoziția principală</text>
<text x="78.0" y="232.7" font-size="14.5" fill="#3a3226" textLength="20.0" lengthAdjust="spacing">are</text>
<text x="101.9" y="232.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="139.2" lengthAdjust="spacing">sens de sine stătător</text>
<text x="78.0" y="256.6" font-size="14.5" fill="#3a3226" textLength="67.3" lengthAdjust="spacing">o frază are</text>
<text x="149.2" y="256.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="72.2" lengthAdjust="spacing">cel puțin o</text>
<text x="225.3" y="256.6" font-size="14.5" fill="#3a3226" textLength="62.3" lengthAdjust="spacing">principală</text>
<rect x="458.0" y="181.4" width="380.0" height="91.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="209.4" font-size="16" fill="#6f5ea8" font-weight="700" textLength="158.2" lengthAdjust="spacing">propoziția secundară</text>
<text x="474.0" y="232.7" font-size="14.5" fill="#3a3226" font-weight="700" textLength="107.9" lengthAdjust="spacing">depinde ca sens</text>
<text x="585.8" y="232.7" font-size="14.5" fill="#3a3226" textLength="43.2" lengthAdjust="spacing">de alta</text>
<text x="62.0" y="302.0" font-size="15" fill="#10233f" font-style="italic" textLength="344.1" lengthAdjust="spacing">Tânărul aude 1/ că bate vântul 2/ și că tigrul rage. 3/</text>
<text x="410.1" y="302.0" font-size="15" fill="#3a3226" textLength="321.1" lengthAdjust="spacing">→ 1 principală; 2 și 3 secundare, coordonate prin</text>
<text x="735.3" y="302.0" font-size="15" fill="#10233f" font-style="italic" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="745.2" y="302.0" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="344.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="367.5" font-size="16" font-weight="700" fill="#ffffff">2. COORDONAREA</text>
<rect x="40" y="378.5" width="820" height="237.3" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="411.5" font-size="15" fill="#3a3226" font-weight="700" textLength="91.5" lengthAdjust="spacing">Coordonarea</text>
<text x="157.6" y="411.5" font-size="15" fill="#3a3226" textLength="194.7" lengthAdjust="spacing">este raportul dintre propoziții</text>
<text x="356.3" y="411.5" font-size="15" fill="#3a3226" font-weight="700" textLength="90.3" lengthAdjust="spacing">de același fel</text>
<text x="450.7" y="411.5" font-size="15" fill="#3a3226" textLength="290.4" lengthAdjust="spacing">(principale între ele sau secundare între ele).</text>
<rect x="62.0" y="430.0" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
<text x="78.0" y="458.0" font-size="16" fill="#0d9c92" font-weight="700" textLength="105.6" lengthAdjust="spacing">prin joncțiune</text>
<text x="78.0" y="481.3" font-size="14.5" fill="#3a3226" textLength="14.9" lengthAdjust="spacing">cu</text>
<text x="96.9" y="481.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="63.8" lengthAdjust="spacing">conectori</text>
<text x="160.7" y="481.3" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">:</text>
<text x="167.8" y="481.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="163.7" lengthAdjust="spacing">ci, dar, deci, și, iar, ori, sau</text>
<text x="78.0" y="505.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="106.9" lengthAdjust="spacing">Tigrul este fioros,</text>
<text x="188.8" y="505.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="22.6" lengthAdjust="spacing">dar</text>
<text x="215.3" y="505.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="93.1" lengthAdjust="spacing">Pi nu se sperie.</text>
<rect x="458.0" y="430.0" width="380.0" height="112.6" rx="12" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
<text x="474.0" y="458.0" font-size="16" fill="#6f5ea8" font-weight="700" textLength="126.1" lengthAdjust="spacing">prin juxtapunere</text>
<text x="474.0" y="481.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="27.0" lengthAdjust="spacing">fără</text>
<text x="504.9" y="481.3" font-size="14.5" fill="#3a3226" textLength="287.4" lengthAdjust="spacing">cuvinte de legătură; pauza se marchează prin</text>
<text x="474.0" y="502.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="47.4" lengthAdjust="spacing">virgulă</text>
<text x="525.3" y="502.3" font-size="14.5" fill="#3a3226" textLength="21.8" lengthAdjust="spacing">sau</text>
<text x="551.0" y="502.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="105.3" lengthAdjust="spacing">punct și virgulă</text>
<text x="474.0" y="526.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="297.0" lengthAdjust="spacing">Pi doarme, tigrul doarme, oceanul doarme și el.</text>
<text x="62.0" y="571.6" font-size="15" fill="#3a3226" textLength="241.9" lengthAdjust="spacing">În frazele mai lungi, cele două se pot</text>
<text x="308.0" y="571.6" font-size="15" fill="#3a3226" font-weight="700" textLength="60.9" lengthAdjust="spacing">combina</text>
<text x="368.9" y="571.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="376.2" y="571.6" font-size="15" fill="#10233f" font-style="italic" textLength="441.1" lengthAdjust="spacing">Pi se trezește, 1/ tigrul se trezește 2/ și oceanul se află în jurul lor. 3/</text>
<text x="62.0" y="593.3" font-size="15" fill="#3a3226" textLength="234.7" lengthAdjust="spacing">(1-2 juxtapunere, 2-3 joncțiune prin</text>
<text x="300.8" y="593.3" font-size="15" fill="#10233f" font-style="italic" textLength="9.9" lengthAdjust="spacing">și</text>
<text x="310.7" y="593.3" font-size="15" fill="#3a3226" textLength="273.0" lengthAdjust="spacing">). În schemă, propozițiile coordonate stau</text>
<text x="587.7" y="593.3" font-size="15" fill="#3a3226" font-weight="700" textLength="106.0" lengthAdjust="spacing">pe același nivel</text>
<text x="693.8" y="593.3" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="635.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="658.8" font-size="16" font-weight="700" fill="#ffffff">3. PAȘII ANALIZEI</text>
<rect x="40" y="669.8" width="820" height="129.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="702.8" font-size="15" fill="#3a3226" font-weight="700">1.</text>
<text x="81.0" y="702.8" font-size="15" fill="#3a3226" textLength="43.8" lengthAdjust="spacing">găsesc</text>
<text x="128.8" y="702.8" font-size="15" fill="#3a3226" font-weight="700" textLength="78.5" lengthAdjust="spacing">predicatele</text>
<text x="207.2" y="702.8" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="727.6" font-size="15" fill="#3a3226" font-weight="700">2.</text>
<text x="81.0" y="727.6" font-size="15" fill="#3a3226" textLength="43.8" lengthAdjust="spacing">găsesc</text>
<text x="128.8" y="727.6" font-size="15" fill="#3a3226" font-weight="700" textLength="148.1" lengthAdjust="spacing">elementele de relație</text>
<text x="280.9" y="727.6" font-size="15" fill="#3a3226" textLength="285.3" lengthAdjust="spacing">(cuvinte de legătură, semne de punctuație);</text>
<text x="62.0" y="752.3" font-size="15" fill="#3a3226" font-weight="700">3.</text>
<text x="81.0" y="752.3" font-size="15" fill="#3a3226" textLength="192.3" lengthAdjust="spacing">împart fraza în propoziții și le</text>
<text x="277.3" y="752.3" font-size="15" fill="#3a3226" font-weight="700" textLength="76.5" lengthAdjust="spacing">numerotez</text>
<text x="353.8" y="752.3" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="777.1" font-size="15" fill="#3a3226" font-weight="700">4.</text>
<text x="81.0" y="777.1" font-size="15" fill="#3a3226" textLength="56.1" lengthAdjust="spacing">stabilesc</text>
<text x="141.1" y="777.1" font-size="15" fill="#3a3226" font-weight="700" textLength="53.0" lengthAdjust="spacing">relațiile</text>
<text x="198.1" y="777.1" font-size="15" fill="#3a3226" textLength="65.7" lengthAdjust="spacing">dintre ele.</text>
<rect x="40" y="819.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="842.6" font-size="16" font-weight="700" fill="#ffffff">4. PUNCTUL ȘI VIRGULA</text>
<rect x="40" y="853.6" width="820" height="99.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="871.6" width="776.0" height="63.9" rx="12" fill="#f3efe4"/><text x="78.0" y="898.1" font-size="14.5" fill="#3a3226" textLength="108.7" lengthAdjust="spacing">Separă propoziții</text>
<text x="190.7" y="898.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="155.0" lengthAdjust="spacing">independente sintactic</text>
<text x="345.7" y="898.1" font-size="14.5" fill="#3a3226" textLength="28.1" lengthAdjust="spacing">, dar</text>
<text x="377.7" y="898.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="94.5" lengthAdjust="spacing">legate ca sens</text>
<text x="472.3" y="898.1" font-size="14.5" fill="#3a3226" textLength="130.9" lengthAdjust="spacing">. Marchează o pauză</text>
<text x="607.1" y="898.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="156.9" lengthAdjust="spacing">mai mare decât virgula</text>
<text x="764.0" y="898.1" font-size="14.5" fill="#3a3226" textLength="55.1" lengthAdjust="spacing">. Autorul</text>
<text x="78.0" y="919.1" font-size="14.5" fill="#3a3226" textLength="349.0" lengthAdjust="spacing">alege dacă îl folosește în locul punctului sau al virgulei:</text>
<text x="430.9" y="919.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="356.6" lengthAdjust="spacing">Oceanul se întinde nesfârșit; gândurile lui Pi sunt infinite.</text>
<text x="278.4" y="985.0" font-size="11.5" fill="#5b6b83" textLength="343.3" lengthAdjust="spacing">Sursa: Manual Art 7, pp. 28-29, rubricile Repere și schemele frazelor.</text>
</svg>
