<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">Fraza. Norme de punctuație</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I, Lecția 9</text>
  <g>
    <rect x="90" y="100" width="330" height="140" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="255" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Propoziția</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle"><tspan x="255" y="154">Un singur predicat.</tspan><tspan x="255" y="178" font-style="italic">Copiii citesc.</tspan></text>
  </g>
  <g>
    <rect x="480" y="100" width="330" height="140" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="645" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Fraza</text>
    <text font-size="11.5" fill="#3a3226" text-anchor="middle"><tspan x="645" y="154">Două sau mai multe propoziții,</tspan><tspan x="645" y="170">principale sau secundare,</tspan><tspan x="645" y="186">legate prin coordonare sau subordonare.</tspan></text>
  </g>
  <text x="450" y="280" text-anchor="middle" font-size="12" fill="#3a3226" font-style="italic">Copiii citesc, iar părinții ascultă. — două propoziții principale, coordonate</text>
  <text x="450" y="304" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 28-29</text>
</svg>
