<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="400" fill="#faf7f0"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Textul nonliterar, textul discontinuu. Anunțul</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea I · lecția 5</text>

  <rect x="55" y="82" width="380" height="120" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="75" y="106" font-size="13" font-weight="700" fill="#10233f">Text nonliterar</text>
  <text font-size="11.5" fill="#3a3226"><tspan x="75" y="128">se referă la aspecte ale realității</tspan><tspan x="75" y="146">scop: a informa, a convinge, a amuza</tspan><tspan x="75" y="164">afiș, anunț, articol, bilet, etichetă,</tspan><tspan x="75" y="182">interviu, invitație, reportaj…</tspan></text>

  <rect x="465" y="82" width="380" height="120" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="485" y="106" font-size="13" font-weight="700" fill="#10233f">Continuu sau discontinuu</text>
  <text font-size="11.5" fill="#3a3226"><tspan x="485" y="128">continuu: doar enunțuri și paragrafe</tspan><tspan x="485" y="146">discontinuu: secvențe separate vizual,</tspan><tspan x="485" y="164">liste, grafice, diagrame</tspan><tspan x="485" y="182">(anunț, calendar, infografic, tabel, schemă)</tspan></text>

  <rect x="55" y="218" width="790" height="130" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="75" y="242" font-size="13" font-weight="700" fill="#10233f">Anunțul</text>
  <text font-size="11.5" fill="#3a3226"><tspan x="75" y="264">text nonliterar din locuri publice, ziare, reviste, internet; prezintă informații despre un produs</tspan><tspan x="75" y="282">sau un serviciu. Titlul atrage atenția; descrierea e clară, succintă, cu ce e mai important.</tspan></text>
  <text font-size="12" font-weight="700" fill="#6f5ea8"><tspan x="75" y="312">Ce?</tspan><tspan x="235" y="312">Cum?</tspan><tspan x="420" y="312">Unde?</tspan><tspan x="610" y="312">Când?</tspan></text>
  <text font-size="10.5" fill="#5b6b83"><tspan x="75" y="330">obiectul,</tspan><tspan x="235" y="330">cum poți</tspan><tspan x="420" y="330">locul unde e</tspan><tspan x="610" y="330">în ce perioadă</tspan></text>
  <text font-size="10.5" fill="#5b6b83"><tspan x="75" y="344">produsul, serviciul</tspan><tspan x="235" y="344">beneficia</tspan><tspan x="420" y="344">disponibil</tspan><tspan x="610" y="344">e disponibil</tspan></text>

  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 20-21</text>
</svg>
