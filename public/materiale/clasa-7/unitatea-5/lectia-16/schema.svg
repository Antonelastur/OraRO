<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 811" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="811" fill="#faf7f0"/>
<text x="126.9" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="647.1" lengthAdjust="spacing">Interjecția. Onomatopeele. Interjecția predicativă</text>
<text x="200.6" y="74.4" font-size="14" fill="#5b6b83" textLength="498.8" lengthAdjust="spacing">Clasa a VII-a · Unitatea a V-a, Lecția 16 · Manual, pp. 192-193 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. INTERJECȚIA</text>
<rect x="40" y="128.6" width="820" height="343.7" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="162.6" font-size="16" fill="#10233f" textLength="112.8" lengthAdjust="spacing">Parte de vorbire</text>
<text x="179.1" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="78.4" lengthAdjust="spacing">neflexibilă</text>
<text x="261.8" y="162.6" font-size="16" fill="#10233f" textLength="90.2" lengthAdjust="spacing">care exprimă</text>
<text x="356.4" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="105.9" lengthAdjust="spacing">stări sufletești</text>
<text x="462.3" y="162.6" font-size="16" fill="#10233f" textLength="3.5" lengthAdjust="spacing">,</text>
<text x="470.2" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="46.6" lengthAdjust="spacing">reacții</text>
<text x="521.0" y="162.6" font-size="16" fill="#10233f" textLength="72.5" lengthAdjust="spacing">la senzații,</text>
<text x="597.8" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="77.9" lengthAdjust="spacing">îndemnuri</text>
<text x="680.1" y="162.6" font-size="16" fill="#10233f" textLength="24.0" lengthAdjust="spacing">sau</text>
<text x="708.4" y="162.6" font-size="16" fill="#10233f" font-weight="700" textLength="93.1" lengthAdjust="spacing">imită sunete</text>
<text x="805.8" y="162.6" font-size="16" fill="#10233f" textLength="22.4" lengthAdjust="spacing">din</text>
<text x="62.0" y="185.8" font-size="16" fill="#10233f" textLength="49.1" lengthAdjust="spacing">natură.</text>
<rect x="62.0" y="204.6" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="226.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="30.1" lengthAdjust="spacing">Felul</text>
<text x="345.6" y="226.1" font-size="13.5" fill="#10233f" font-weight="700" textLength="53.7" lengthAdjust="spacing">Exemple</text>
<line x1="62.0" y1="236.2" x2="838.0" y2="236.2" stroke="#e3dccb"/>
<text x="74.0" y="258.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="82.4" lengthAdjust="spacing">propriu-zise</text>
<text x="160.3" y="258.6" font-size="14.5" fill="#3a3226" textLength="153.8" lengthAdjust="spacing">(stări, reacții, îndemnuri)</text>
<text x="345.6" y="258.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="109.9" lengthAdjust="spacing">au, ei, of, uau, vai</text>
<line x1="62.0" y1="269.0" x2="838.0" y2="269.0" stroke="#e3dccb"/>
<text x="74.0" y="291.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="86.9" lengthAdjust="spacing">onomatopee</text>
<text x="164.8" y="291.5" font-size="14.5" fill="#3a3226" textLength="108.3" lengthAdjust="spacing">(imită sunete sau</text>
<text x="74.0" y="312.5" font-size="14.5" fill="#3a3226" textLength="49.0" lengthAdjust="spacing">mișcări)</text>
<text x="345.6" y="291.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="167.2" lengthAdjust="spacing">miau, hapciu, gâl-gâl, țuști</text>
<line x1="62.0" y1="322.9" x2="838.0" y2="322.9" stroke="#e3dccb"/>
<text x="74.0" y="345.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="44.7" lengthAdjust="spacing">simple</text>
<text x="122.6" y="345.4" font-size="14.5" fill="#3a3226" textLength="75.7" lengthAdjust="spacing">(și repetate)</text>
<text x="345.6" y="345.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="231.3" lengthAdjust="spacing">au, miau, pleosc; cioc-cioc, nani-nani</text>
<line x1="62.0" y1="355.7" x2="838.0" y2="355.7" stroke="#e3dccb"/>
<text x="74.0" y="378.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="61.2" lengthAdjust="spacing">compuse</text>
<text x="139.1" y="378.2" font-size="14.5" fill="#3a3226" textLength="139.1" lengthAdjust="spacing">(componente diferite)</text>
<text x="345.6" y="378.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="189.9" lengthAdjust="spacing">hodoronc-tronc, ia uite, tic-tac</text>
<line x1="62.0" y1="388.6" x2="838.0" y2="388.6" stroke="#e3dccb"/>
<text x="74.0" y="411.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="162.4" lengthAdjust="spacing">locuțiuni interjecționale</text>
<text x="345.6" y="411.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="357.9" lengthAdjust="spacing">ei bine, ia te uită, măi să fie, vai de mine, Doamne ferește</text>
<line x1="62.0" y1="421.4" x2="838.0" y2="421.4" stroke="#e3dccb"/>
<text x="74.0" y="443.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="79.2" lengthAdjust="spacing">de adresare</text>
<text x="157.1" y="443.9" font-size="14.5" fill="#3a3226" textLength="66.0" lengthAdjust="spacing">(apelative)</text>
<text x="345.6" y="443.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="179.5" lengthAdjust="spacing">bă, bre, mă, măi; alo, hei, pst</text>
<line x1="62.0" y1="454.3" x2="838.0" y2="454.3" stroke="#e3dccb"/>
<line x1="333.6" y1="204.6" x2="333.6" y2="454.3" stroke="#e3dccb"/>
<rect x="40" y="492.3" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="515.3" font-size="16" font-weight="700" fill="#ffffff">2. INTERJECȚIA PREDICATIVĂ</text>
<rect x="40" y="526.3" width="820" height="99.9" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="544.3" width="776.0" height="63.9" rx="12" fill="#f3efe4"/><text x="78.0" y="570.8" font-size="14.5" fill="#3a3226" textLength="354.2" lengthAdjust="spacing">Unele interjecții se comportă ca un verb și au funcția de</text>
<text x="436.2" y="570.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="102.5" lengthAdjust="spacing">predicat verbal</text>
<text x="538.7" y="570.8" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">:</text>
<text x="545.8" y="570.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="23.1" lengthAdjust="spacing">Hai</text>
<text x="572.7" y="570.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="40.3" lengthAdjust="spacing">acasă!</text>
<text x="617.0" y="570.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="28.0" lengthAdjust="spacing">Uite</text>
<text x="644.9" y="570.8" font-size="14.5" fill="#3a3226" textLength="5.8" lengthAdjust="spacing">-</text>
<text x="650.7" y="570.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="105.0" lengthAdjust="spacing">l pe Radu! Piatra</text>
<text x="759.6" y="570.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="43.1" lengthAdjust="spacing">pleosc</text>
<text x="806.6" y="570.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="11.9" lengthAdjust="spacing">în</text>
<text x="78.0" y="591.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="21.2" lengthAdjust="spacing">lac.</text>
<rect x="40" y="646.1" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="669.1" font-size="16" font-weight="700" fill="#ffffff">3. PUNCTUAȚIA</text>
<rect x="40" y="680.1" width="820" height="80.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="713.1" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="713.1" font-size="15" fill="#3a3226" textLength="175.1" lengthAdjust="spacing">Interjecțiile se despart prin</text>
<text x="253.3" y="713.1" font-size="15" fill="#3a3226" font-weight="700" textLength="49.0" lengthAdjust="spacing">virgulă</text>
<text x="306.4" y="713.1" font-size="15" fill="#3a3226" textLength="52.8" lengthAdjust="spacing">sau prin</text>
<text x="363.3" y="713.1" font-size="15" fill="#3a3226" font-weight="700" textLength="127.3" lengthAdjust="spacing">semnul exclamării</text>
<text x="490.6" y="713.1" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="497.9" y="713.1" font-size="15" fill="#10233f" font-style="italic" textLength="244.3" lengthAdjust="spacing">Ei, asta e o veste bună! Ei! Să vedem...</text>
<text x="62.0" y="737.9" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="737.9" font-size="15" fill="#3a3226" textLength="325.8" lengthAdjust="spacing">Interjecție + substantiv în vocativ: virgula se pune</text>
<text x="404.0" y="737.9" font-size="15" fill="#3a3226" font-weight="700" textLength="112.2" lengthAdjust="spacing">după tot grupul</text>
<text x="516.2" y="737.9" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="523.6" y="737.9" font-size="15" fill="#10233f" font-style="italic" textLength="151.2" lengthAdjust="spacing">Măi Radu, unde ai fost?</text>
<text x="326.1" y="791.9" font-size="11.5" fill="#5b6b83" textLength="247.7" lengthAdjust="spacing">Sursa: Manual Art 7, pp. 192-193, rubrica Repere.</text>
</svg>
