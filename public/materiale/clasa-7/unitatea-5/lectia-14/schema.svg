<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 968" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="968" fill="#faf7f0"/>
<text x="97.2" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="706.7" lengthAdjust="spacing">Numeralul. Posibilitățile combinatorii ale numeralului</text>
<text x="200.6" y="74.4" font-size="14" fill="#5b6b83" textLength="498.8" lengthAdjust="spacing">Clasa a VII-a · Unitatea a V-a, Lecția 14 · Manual, pp. 188-189 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. NUMERALUL</text>
<rect x="40" y="128.6" width="820" height="301.4" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="74.0" lengthAdjust="spacing">Exprimă un</text>
<text x="140.0" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="46.2" lengthAdjust="spacing">număr</text>
<text x="190.2" y="161.6" font-size="15" fill="#3a3226" textLength="87.6" lengthAdjust="spacing">(cardinal) sau</text>
<text x="281.9" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="54.0" lengthAdjust="spacing">ordinea</text>
<text x="339.9" y="161.6" font-size="15" fill="#3a3226" textLength="156.6" lengthAdjust="spacing">prin numărare (ordinal).</text>
<text x="62.0" y="195.1" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="195.1" font-size="15" fill="#3a3226" textLength="197.2" lengthAdjust="spacing">Cardinalele (simple, compuse)</text>
<text x="275.5" y="195.1" font-size="15" fill="#3a3226" font-weight="700" textLength="70.5" lengthAdjust="spacing">nu au gen</text>
<text x="346.0" y="195.1" font-size="15" fill="#3a3226" textLength="77.1" lengthAdjust="spacing">, în afară de</text>
<text x="427.1" y="195.1" font-size="15" fill="#10233f" font-style="italic" textLength="122.2" lengthAdjust="spacing">unu/una, doi/două</text>
<text x="553.4" y="195.1" font-size="15" fill="#3a3226" textLength="110.6" lengthAdjust="spacing">și compusele lor:</text>
<text x="668.1" y="195.1" font-size="15" fill="#10233f" font-style="italic" textLength="110.5" lengthAdjust="spacing">douăzeci și unu /</text>
<text x="74.2" y="216.8" font-size="15" fill="#10233f" font-style="italic" textLength="100.2" lengthAdjust="spacing">douăzeci și una</text>
<text x="174.4" y="216.8" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="241.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="241.6" font-size="15" fill="#3a3226" textLength="202.2" lengthAdjust="spacing">Ordinalele au forme după gen:</text>
<text x="280.4" y="241.6" font-size="15" fill="#10233f" font-style="italic" textLength="557.5" lengthAdjust="spacing">primul/prima, întâiul/întâia, al doilea/a doua, al douăzeci și unulea/a douăzeci și una,</text>
<text x="74.2" y="263.4" font-size="15" fill="#10233f" font-style="italic" textLength="173.1" lengthAdjust="spacing">al cincizecilea/a cincizecea</text>
<text x="247.3" y="263.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="281.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="303.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="55.6" lengthAdjust="spacing">Valoarea</text>
<text x="268.0" y="303.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="53.7" lengthAdjust="spacing">Exemple</text>
<line x1="62.0" y1="313.4" x2="838.0" y2="313.4" stroke="#e3dccb"/>
<text x="74.0" y="335.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="72.9" lengthAdjust="spacing">adjectivală</text>
<text x="268.0" y="335.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="258.7" lengthAdjust="spacing">trei copii, a doua scenă, douăzeci de copii</text>
<line x1="62.0" y1="346.3" x2="838.0" y2="346.3" stroke="#e3dccb"/>
<text x="74.0" y="368.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="87.3" lengthAdjust="spacing">pronominală</text>
<text x="268.0" y="368.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="298.1" lengthAdjust="spacing">Doi dintre actori au întârziat. A treia a întârziat.</text>
<line x1="62.0" y1="379.1" x2="838.0" y2="379.1" stroke="#e3dccb"/>
<text x="74.0" y="401.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="90.2" lengthAdjust="spacing">substantivală</text>
<text x="268.0" y="401.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="291.3" lengthAdjust="spacing">tramvaiul 36, anul 1918; Doi plus trei fac cinci.</text>
<line x1="62.0" y1="412.0" x2="838.0" y2="412.0" stroke="#e3dccb"/>
<line x1="256.0" y1="281.9" x2="256.0" y2="412.0" stroke="#e3dccb"/>
<rect x="40" y="450.0" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="473.0" font-size="16" font-weight="700" fill="#ffffff">2. NUMERALUL ADJUNCT</text>
<rect x="40" y="484.0" width="820" height="252.8" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="502.0" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="523.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="55.6" lengthAdjust="spacing">Valoarea</text>
<text x="205.9" y="523.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="67.0" lengthAdjust="spacing">Determină</text>
<text x="337.8" y="523.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="46.3" lengthAdjust="spacing">Funcția</text>
<text x="570.6" y="523.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="533.5" x2="838.0" y2="533.5" stroke="#e3dccb"/>
<text x="74.0" y="556.0" font-size="14.5" fill="#3a3226" textLength="67.3" lengthAdjust="spacing">adjectivală</text>
<text x="205.9" y="556.0" font-size="14.5" fill="#3a3226" textLength="85.4" lengthAdjust="spacing">un substantiv</text>
<text x="337.8" y="556.0" font-size="14.5" fill="#3a3226" font-weight="700" textLength="116.0" lengthAdjust="spacing">atribut adjectival</text>
<text x="570.6" y="556.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="136.4" lengthAdjust="spacing">doi copii, al doilea act</text>
<line x1="62.0" y1="566.4" x2="838.0" y2="566.4" stroke="#e3dccb"/>
<text x="74.0" y="588.9" font-size="14.5" fill="#3a3226" textLength="81.5" lengthAdjust="spacing">pronominală</text>
<text x="205.9" y="588.9" font-size="14.5" fill="#3a3226" textLength="85.4" lengthAdjust="spacing">un substantiv</text>
<text x="337.8" y="588.9" font-size="14.5" fill="#3a3226" textLength="198.5" lengthAdjust="spacing">atribut prepozițional / genitival</text>
<text x="570.6" y="588.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="196.6" lengthAdjust="spacing">florile de la doi; cartea primului</text>
<line x1="62.0" y1="599.2" x2="838.0" y2="599.2" stroke="#e3dccb"/>
<text x="74.0" y="621.7" font-size="14.5" fill="#3a3226" textLength="81.5" lengthAdjust="spacing">pronominală</text>
<text x="205.9" y="621.7" font-size="14.5" fill="#3a3226" textLength="48.6" lengthAdjust="spacing">un verb</text>
<text x="337.8" y="621.7" font-size="14.5" fill="#3a3226" textLength="178.9" lengthAdjust="spacing">complement direct, indirect,</text>
<text x="337.8" y="642.7" font-size="14.5" fill="#3a3226" textLength="180.1" lengthAdjust="spacing">prepozițional; circumstanțial</text>
<text x="570.6" y="621.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="250.0" lengthAdjust="spacing">Am citit trei dintre poezii. M-am adresat</text>
<text x="570.6" y="642.7" font-size="14.5" fill="#10233f" font-style="italic" textLength="56.3" lengthAdjust="spacing">primului.</text>
<line x1="62.0" y1="653.1" x2="838.0" y2="653.1" stroke="#e3dccb"/>
<text x="74.0" y="675.6" font-size="14.5" fill="#3a3226" textLength="83.2" lengthAdjust="spacing">substantivală</text>
<text x="205.9" y="675.6" font-size="14.5" fill="#3a3226" textLength="85.4" lengthAdjust="spacing">un substantiv</text>
<text x="337.8" y="675.6" font-size="14.5" fill="#3a3226" textLength="198.5" lengthAdjust="spacing">atribut genitival / prepozițional</text>
<text x="570.6" y="675.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="219.1" lengthAdjust="spacing">radicalul lui nouă; radical din nouă</text>
<line x1="62.0" y1="685.9" x2="838.0" y2="685.9" stroke="#e3dccb"/>
<text x="74.0" y="708.4" font-size="14.5" fill="#3a3226" textLength="83.2" lengthAdjust="spacing">substantivală</text>
<text x="205.9" y="708.4" font-size="14.5" fill="#3a3226" textLength="48.6" lengthAdjust="spacing">un verb</text>
<text x="337.8" y="708.4" font-size="14.5" fill="#3a3226" textLength="168.8" lengthAdjust="spacing">complement prepozițional</text>
<text x="570.6" y="708.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="137.6" lengthAdjust="spacing">Numără până la zece.</text>
<line x1="62.0" y1="718.8" x2="838.0" y2="718.8" stroke="#e3dccb"/>
<line x1="193.9" y1="502.0" x2="193.9" y2="718.8" stroke="#e3dccb"/>
<line x1="325.8" y1="502.0" x2="325.8" y2="718.8" stroke="#e3dccb"/>
<line x1="558.6" y1="502.0" x2="558.6" y2="718.8" stroke="#e3dccb"/>
<rect x="40" y="756.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="779.8" font-size="16" font-weight="700" fill="#ffffff">3. NUMERALUL CENTRU ȘI ALTE FUNCȚII</text>
<rect x="40" y="790.8" width="820" height="126.8" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="823.8" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="823.8" font-size="15" fill="#3a3226" font-weight="700" textLength="45.5" lengthAdjust="spacing">centru</text>
<text x="119.7" y="823.8" font-size="15" fill="#3a3226" textLength="413.8" lengthAdjust="spacing">, cu valoare pronominală, urmat de o construcție cu prepoziție:</text>
<text x="537.5" y="823.8" font-size="15" fill="#10233f" font-style="italic" textLength="241.3" lengthAdjust="spacing">doi dintre ei, primul dintre concurenți</text>
<text x="778.9" y="823.8" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="848.5" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="848.5" font-size="15" fill="#3a3226" font-weight="700" textLength="45.5" lengthAdjust="spacing">centru</text>
<text x="119.7" y="848.5" font-size="15" fill="#3a3226" textLength="408.0" lengthAdjust="spacing">, cu valoare substantivală, în matematică; după un substantiv (</text>
<text x="527.6" y="848.5" font-size="15" fill="#10233f" font-style="italic" textLength="126.0" lengthAdjust="spacing">ora 14, camera 123</text>
<text x="653.6" y="848.5" font-size="15" fill="#3a3226" textLength="99.0" lengthAdjust="spacing">) are funcția de</text>
<text x="756.7" y="848.5" font-size="15" fill="#3a3226" font-weight="700" textLength="66.0" lengthAdjust="spacing">atribut în</text>
<text x="74.2" y="870.3" font-size="15" fill="#3a3226" font-weight="700" textLength="71.7" lengthAdjust="spacing">nominativ</text>
<text x="145.9" y="870.3" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="895.0" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="895.0" font-size="15" fill="#3a3226" textLength="210.4" lengthAdjust="spacing">cu valoare pronominală poate fi</text>
<text x="288.7" y="895.0" font-size="15" fill="#3a3226" font-weight="700" textLength="50.4" lengthAdjust="spacing">subiect</text>
<text x="343.1" y="895.0" font-size="15" fill="#3a3226" textLength="4.5" lengthAdjust="spacing">(</text>
<text x="347.6" y="895.0" font-size="15" fill="#10233f" font-style="italic" textLength="159.3" lengthAdjust="spacing">Trei vor obține mențiuni.</text>
<text x="506.9" y="895.0" font-size="15" fill="#3a3226" textLength="31.1" lengthAdjust="spacing">) sau</text>
<text x="542.0" y="895.0" font-size="15" fill="#3a3226" font-weight="700" textLength="114.8" lengthAdjust="spacing">nume predicativ</text>
<text x="660.8" y="895.0" font-size="15" fill="#3a3226" textLength="4.5" lengthAdjust="spacing">(</text>
<text x="665.3" y="895.0" font-size="15" fill="#10233f" font-style="italic" textLength="112.8" lengthAdjust="spacing">Radu este primul.</text>
<text x="778.1" y="895.0" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">).</text>
<text x="323.3" y="949.0" font-size="11.5" fill="#5b6b83" textLength="253.3" lengthAdjust="spacing">Sursa: Manual Art 7, pp. 188-189, rubricile Repere.</text>
</svg>
