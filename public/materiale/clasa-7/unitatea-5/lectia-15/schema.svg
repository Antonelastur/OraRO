<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1017" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1017" fill="#faf7f0"/>
<text x="115.4" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="670.3" lengthAdjust="spacing">Adverbul. Posibilitățile combinatorii ale adverbului</text>
<text x="200.6" y="74.4" font-size="14" fill="#5b6b83" textLength="498.8" lengthAdjust="spacing">Clasa a VII-a · Unitatea a V-a, Lecția 15 · Manual, pp. 190-191 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. ADVERBUL</text>
<rect x="40" y="128.6" width="820" height="257.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="105.7" lengthAdjust="spacing">Parte de vorbire</text>
<text x="171.8" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="73.5" lengthAdjust="spacing">neflexibilă</text>
<text x="249.3" y="161.6" font-size="15" fill="#3a3226" textLength="219.9" lengthAdjust="spacing">care arată circumstanțele acțiunii.</text>
<rect x="62.0" y="180.1" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="201.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="79.2" lengthAdjust="spacing">După înțeles</text>
<text x="205.9" y="201.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="53.7" lengthAdjust="spacing">Exemple</text>
<text x="462.0" y="201.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="92.5" lengthAdjust="spacing">După alcătuire</text>
<text x="593.9" y="201.6" font-size="13.5" fill="#10233f" font-weight="700" textLength="53.7" lengthAdjust="spacing">Exemple</text>
<line x1="62.0" y1="211.7" x2="838.0" y2="211.7" stroke="#e3dccb"/>
<text x="74.0" y="234.2" font-size="14.5" fill="#3a3226" textLength="38.7" lengthAdjust="spacing">de loc</text>
<text x="205.9" y="234.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="122.5" lengthAdjust="spacing">acolo, deasupra, jos</text>
<text x="462.0" y="234.2" font-size="14.5" fill="#3a3226" textLength="41.6" lengthAdjust="spacing">simple</text>
<text x="593.9" y="234.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="73.5" lengthAdjust="spacing">așa, azi, sus</text>
<line x1="62.0" y1="244.5" x2="838.0" y2="244.5" stroke="#e3dccb"/>
<text x="74.0" y="267.0" font-size="14.5" fill="#3a3226" textLength="49.4" lengthAdjust="spacing">de timp</text>
<text x="205.9" y="267.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="112.4" lengthAdjust="spacing">acum, curând, ieri</text>
<text x="462.0" y="267.0" font-size="14.5" fill="#3a3226" textLength="58.1" lengthAdjust="spacing">compuse</text>
<text x="593.9" y="267.0" font-size="14.5" fill="#10233f" font-style="italic" textLength="207.8" lengthAdjust="spacing">acasă, altădată, deloc, astă-seară</text>
<line x1="62.0" y1="277.4" x2="838.0" y2="277.4" stroke="#e3dccb"/>
<text x="74.0" y="299.9" font-size="14.5" fill="#3a3226" textLength="49.6" lengthAdjust="spacing">de mod</text>
<text x="205.9" y="299.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="140.7" lengthAdjust="spacing">astfel, bine, românește</text>


<line x1="62.0" y1="310.2" x2="838.0" y2="310.2" stroke="#e3dccb"/>
<line x1="193.9" y1="180.1" x2="193.9" y2="310.2" stroke="#e3dccb"/>
<line x1="450.0" y1="180.1" x2="450.0" y2="310.2" stroke="#e3dccb"/>
<line x1="581.9" y1="180.1" x2="581.9" y2="310.2" stroke="#e3dccb"/>
<text x="62.0" y="339.2" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="339.2" font-size="15" fill="#3a3226" textLength="402.6" lengthAdjust="spacing">Gradele de comparație sunt ca la adjectiv; unele nu au grade:</text>
<text x="480.8" y="339.2" font-size="15" fill="#10233f" font-style="italic" textLength="226.9" lengthAdjust="spacing">acasă, aici, afară, împreună, mereu</text>
<text x="707.8" y="339.2" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<text x="62.0" y="363.9" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="363.9" font-size="15" fill="#3a3226" font-weight="700" textLength="155.4" lengthAdjust="spacing">Locuțiunea adverbială</text>
<text x="229.6" y="363.9" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="236.9" y="363.9" font-size="15" fill="#10233f" font-style="italic" textLength="309.7" lengthAdjust="spacing">an de an, la paștele cailor, cât ai bate din palme</text>
<text x="546.7" y="363.9" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="40" y="406.5" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="429.5" font-size="16" font-weight="700" fill="#ffffff">2. FUNCȚIILE</text>
<rect x="40" y="440.5" width="820" height="220.0" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="458.5" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="480.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="46.3" lengthAdjust="spacing">Funcția</text>
<text x="345.6" y="480.0" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="490.0" x2="838.0" y2="490.0" stroke="#e3dccb"/>
<text x="74.0" y="512.5" font-size="14.5" fill="#3a3226" textLength="142.1" lengthAdjust="spacing">circumstanțial de mod</text>
<text x="345.6" y="512.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="130.6" lengthAdjust="spacing">Actorii au interpretat</text>
<text x="480.2" y="512.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="29.7" lengthAdjust="spacing">bine</text>
<text x="513.8" y="512.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="50.2" lengthAdjust="spacing">scena 1.</text>
<line x1="62.0" y1="522.9" x2="838.0" y2="522.9" stroke="#e3dccb"/>
<text x="74.0" y="545.4" font-size="14.5" fill="#3a3226" textLength="142.0" lengthAdjust="spacing">circumstanțial de timp</text>
<text x="345.6" y="545.4" font-size="14.5" fill="#10233f" font-style="italic" textLength="121.8" lengthAdjust="spacing">Selecția va avea loc</text>
<text x="471.3" y="545.4" font-size="14.5" fill="#3a3226" font-weight="700" textLength="41.9" lengthAdjust="spacing">mâine</text>
<text x="513.2" y="545.4" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="555.7" x2="838.0" y2="555.7" stroke="#e3dccb"/>
<text x="74.0" y="578.2" font-size="14.5" fill="#3a3226" textLength="131.2" lengthAdjust="spacing">circumstanțial de loc</text>
<text x="345.6" y="578.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="126.4" lengthAdjust="spacing">Anunțul a fost afișat</text>
<text x="476.0" y="578.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="36.5" lengthAdjust="spacing">acolo</text>
<text x="512.5" y="578.2" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="588.6" x2="838.0" y2="588.6" stroke="#e3dccb"/>
<text x="74.0" y="611.1" font-size="14.5" fill="#3a3226" textLength="238.1" lengthAdjust="spacing">atribut adverbial (după substantiv, de</text>
<text x="74.0" y="632.1" font-size="14.5" fill="#3a3226" textLength="57.1" lengthAdjust="spacing">obicei cu</text>
<text x="135.0" y="632.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="14.9" lengthAdjust="spacing">de</text>
<text x="150.0" y="632.1" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">)</text>
<text x="345.6" y="611.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="50.5" lengthAdjust="spacing">emoțiile</text>
<text x="400.0" y="611.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="63.1" lengthAdjust="spacing">de atunci</text>
<line x1="62.0" y1="642.4" x2="838.0" y2="642.4" stroke="#e3dccb"/>
<line x1="333.6" y1="458.5" x2="333.6" y2="642.4" stroke="#e3dccb"/>
<rect x="40" y="680.4" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="703.4" font-size="16" font-weight="700" fill="#ffffff">3. SEMIADVERBELE</text>
<rect x="40" y="714.4" width="820" height="251.9" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="747.4" font-size="15" fill="#3a3226" font-weight="700" textLength="154.2" lengthAdjust="spacing">Fără funcție sintactică</text>
<text x="216.2" y="747.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="223.6" y="747.4" font-size="15" fill="#10233f" font-style="italic" textLength="307.9" lengthAdjust="spacing">chiar, doar, decât, mai, măcar, nu, numai, tot, și</text>
<text x="531.4" y="747.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="765.9" width="776.0" height="106.7" rx="12" fill="#f3efe4"/><rect x="62.0" y="765.9" width="6" height="106.7" rx="3" fill="#b4432c"/><text x="84.0" y="792.4" font-size="14.5" fill="#b4432c" font-weight="700" textLength="54.8" lengthAdjust="spacing">Atenție!</text>
<text x="84.0" y="811.3" font-size="14.5" fill="#3a3226">•</text>
<text x="95.9" y="811.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="76.1" lengthAdjust="spacing">numai, doar</text>
<text x="175.9" y="811.3" font-size="14.5" fill="#3a3226" textLength="80.9" lengthAdjust="spacing">– în enunțuri</text>
<text x="260.7" y="811.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="69.7" lengthAdjust="spacing">afirmative</text>
<text x="334.4" y="811.3" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">(</text>
<text x="338.7" y="811.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="142.1" lengthAdjust="spacing">Numai tu ai participat.</text>
<text x="480.8" y="811.3" font-size="14.5" fill="#3a3226" textLength="7.5" lengthAdjust="spacing">);</text>
<text x="492.3" y="811.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="33.8" lengthAdjust="spacing">decât</text>
<text x="530.0" y="811.3" font-size="14.5" fill="#3a3226" textLength="114.4" lengthAdjust="spacing">– doar în enunțuri</text>
<text x="648.3" y="811.3" font-size="14.5" fill="#3a3226" font-weight="700" textLength="58.9" lengthAdjust="spacing">negative</text>
<text x="711.1" y="811.3" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">(</text>
<text x="715.4" y="811.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="94.4" lengthAdjust="spacing">Nu a participat</text>
<text x="95.9" y="832.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="51.8" lengthAdjust="spacing">decât el.</text>
<text x="147.6" y="832.3" font-size="14.5" fill="#3a3226" textLength="7.5" lengthAdjust="spacing">).</text>
<text x="84.0" y="856.2" font-size="14.5" fill="#3a3226">•</text>
<text x="95.9" y="856.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="24.1" lengthAdjust="spacing">mai</text>
<text x="123.8" y="856.2" font-size="14.5" fill="#3a3226" textLength="51.6" lengthAdjust="spacing">stă între</text>
<text x="179.4" y="856.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="134.3" lengthAdjust="spacing">auxiliar și participiu</text>
<text x="317.6" y="856.2" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">(</text>
<text x="321.9" y="856.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="164.0" lengthAdjust="spacing">Am mai văzut spectacolul.</text>
<text x="485.9" y="856.2" font-size="14.5" fill="#3a3226" textLength="51.0" lengthAdjust="spacing">) și între</text>
<text x="540.9" y="856.2" font-size="14.5" fill="#3a3226" font-weight="700" textLength="80.8" lengthAdjust="spacing">clitic și verb</text>
<text x="625.5" y="856.2" font-size="14.5" fill="#3a3226" textLength="4.3" lengthAdjust="spacing">(</text>
<text x="629.9" y="856.2" font-size="14.5" fill="#10233f" font-style="italic" textLength="124.6" lengthAdjust="spacing">Îmi mai dai o carte?</text>
<text x="754.5" y="856.2" font-size="14.5" fill="#3a3226" textLength="7.5" lengthAdjust="spacing">).</text>
<rect x="62.0" y="886.6" width="776.0" height="61.7" rx="12" fill="#f3efe4"/><text x="78.0" y="913.1" font-size="14.5" fill="#10233f" font-weight="700" textLength="119.9" lengthAdjust="spacing">Model de analiză:</text>
<text x="78.0" y="931.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="578.0" lengthAdjust="spacing">„ieri” – adverb de timp, fără grad de comparație, funcția sintactică de circumstanțial de timp.</text>
<text x="271.6" y="997.8" font-size="11.5" fill="#5b6b83" textLength="356.8" lengthAdjust="spacing">Sursa: Manual Art 7, pp. 190-191, rubrica Repere și modelul de analiză.</text>
</svg>
