<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="390" fill="#faf7f0"/>
  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#10233f">Posibilități combinatorii ale adjectivului</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III · lecția 18 · adjectivul ca adjunct și ca centru</text>

  <rect x="55" y="80" width="390" height="180" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="75" y="104" font-size="13" font-weight="700" fill="#10233f">Adjunct</text>
  <text font-size="11" fill="#3a3226"><tspan x="75" y="126">atribut adjectival, în grupul nominal:</tspan><tspan x="75" y="144">determină un substantiv, un pronume sau</tspan><tspan x="75" y="162">un numeral cu valoare pronominală</tspan><tspan x="75" y="184">exprimat prin: adjectiv propriu-zis, adjectiv</tspan><tspan x="75" y="202">din participiu, din gerunziu acordat,</tspan><tspan x="75" y="220">din adverb</tspan><tspan x="75" y="242">nume predicativ, în grupul verbal (relație</tspan><tspan x="75" y="256">ternară cu subiectul și verbul copulativ)</tspan></text>

  <rect x="465" y="80" width="380" height="180" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="485" y="104" font-size="13" font-weight="700" fill="#10233f">Centru</text>
  <text font-size="11" fill="#3a3226"><tspan x="485" y="126">determinat de:</tspan><tspan x="485" y="146">• complement prepozițional (plin de griji)</tspan><tspan x="485" y="164">• complement indirect (recunoscătoare lor)</tspan><tspan x="485" y="182">• circumstanțiale: de loc, de timp, de mod,</tspan><tspan x="485" y="200">  de cauză, de scop</tspan><tspan x="485" y="224">dublu rol: poate fi în același timp adjunct</tspan><tspan x="485" y="242">(pentru substantiv) și centru (pentru</tspan><tspan x="485" y="260">complementul lui)</tspan></text>

  <text x="450" y="360" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 116-117</text>
</svg>
