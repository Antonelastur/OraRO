<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="380" fill="#faf7f0"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Doina, mitul, ritualul</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea III · lecția 10 · tradiții și obiceiuri legate de sentimente și emoții (II)</text>

  <rect x="55" y="82" width="255" height="200" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="182" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Doina</text>
  <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="182" y="130">opera lirică a folclorului</tspan><tspan x="182" y="148">românesc: dor, dragoste,</tspan><tspan x="182" y="166">revoltă…</tspan><tspan x="182" y="188">sentiment individual cu</tspan><tspan x="182" y="206">valoare general-umană</tspan><tspan x="182" y="228">muzical: scară unitonală,</tspan><tspan x="182" y="246">ritm liber</tspan><tspan x="182" y="268">UNESCO, 2009</tspan></text>

  <rect x="322" y="82" width="255" height="200" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="450" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Mitul</text>
  <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="450" y="130">povestire fabuloasă cu</tspan><tspan x="450" y="148">credințele populare despre</tspan><tspan x="450" y="166">originea universului, a</tspan><tspan x="450" y="184">fenomenelor naturale,</tspan><tspan x="450" y="202">despre zei și eroi</tspan><tspan x="450" y="224">plasează întâmplările</tspan><tspan x="450" y="242">într-un timp al</tspan><tspan x="450" y="260">„începuturilor”</tspan></text>

  <rect x="589" y="82" width="256" height="200" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="717" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Ritualul</text>
  <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="717" y="130">ceremonial după reguli,</tspan><tspan x="717" y="148">în cadru solemn, la</tspan><tspan x="717" y="166">momente importante:</tspan><tspan x="717" y="184">naștere, căsătorie, moarte,</tspan><tspan x="717" y="202">munci tradiționale,</tspan><tspan x="717" y="220">trecerea anotimpurilor</tspan><tspan x="717" y="242">însoțit de cântece</tspan><tspan x="717" y="260">(plugușor, orații de nuntă)</tspan></text>

  <text x="450" y="322" text-anchor="middle" font-size="12" fill="#3a3226">Sentimentele și emoțiile din obiceiuri apar des în lirica și epica populară, surse pentru operele culte.</text>
  <text x="450" y="358" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 102-103</text>
</svg>
