<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1015" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
<rect width="900" height="1015" fill="#faf7f0"/>
<text x="320.8" y="50.0" font-size="28" fill="#10233f" font-weight="700" textLength="259.0" lengthAdjust="spacing">Gerunziul și supinul</text>
<text x="208.7" y="74.4" font-size="14" fill="#5b6b83" textLength="482.6" lengthAdjust="spacing">Clasa a VII-a · Unitatea a II-a, Lecția 17 · Manual, pp. 76-77 · notițe pentru caiet</text>
<rect x="40" y="94.6" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="117.6" font-size="16" font-weight="700" fill="#ffffff">1. GERUNZIUL</text>
<rect x="40" y="128.6" width="820" height="337.2" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="161.6" font-size="15" fill="#3a3226" textLength="140.4" lengthAdjust="spacing">Denumește o acțiune</text>
<text x="206.4" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="99.3" lengthAdjust="spacing">în desfășurare</text>
<text x="305.7" y="161.6" font-size="15" fill="#3a3226" textLength="333.6" lengthAdjust="spacing">, fără legătură precisă cu momentul vorbirii. Sufixe:</text>
<text x="643.4" y="161.6" font-size="15" fill="#3a3226" font-weight="700" textLength="32.5" lengthAdjust="spacing">-ând</text>
<text x="680.0" y="161.6" font-size="15" fill="#3a3226" textLength="4.5" lengthAdjust="spacing">(</text>
<text x="684.5" y="161.6" font-size="15" fill="#10233f" font-style="italic" textLength="114.6" lengthAdjust="spacing">lucrând, mergând</text>
<text x="799.1" y="161.6" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">),</text>
<text x="62.0" y="183.3" font-size="15" fill="#3a3226" font-weight="700" textLength="28.6" lengthAdjust="spacing">-ind</text>
<text x="94.7" y="183.3" font-size="15" fill="#3a3226" textLength="4.5" lengthAdjust="spacing">(</text>
<text x="99.2" y="183.3" font-size="15" fill="#10233f" font-style="italic" textLength="105.5" lengthAdjust="spacing">muncind, fugind</text>
<text x="204.7" y="183.3" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">).</text>
<text x="62.0" y="216.8" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="216.8" font-size="15" fill="#3a3226" textLength="68.2" lengthAdjust="spacing">negativ cu</text>
<text x="146.5" y="216.8" font-size="15" fill="#10233f" font-style="italic" textLength="21.8" lengthAdjust="spacing">ne-</text>
<text x="172.3" y="216.8" font-size="15" fill="#3a3226" textLength="4.5" lengthAdjust="spacing">(</text>
<text x="176.8" y="216.8" font-size="15" fill="#10233f" font-style="italic" textLength="59.4" lengthAdjust="spacing">neauzind</text>
<text x="236.2" y="216.8" font-size="15" fill="#3a3226" textLength="27.3" lengthAdjust="spacing">), cu</text>
<text x="267.6" y="216.8" font-size="15" fill="#10233f" font-style="italic" textLength="24.9" lengthAdjust="spacing">mai</text>
<text x="296.5" y="216.8" font-size="15" fill="#3a3226" textLength="69.7" lengthAdjust="spacing">intercalat (</text>
<text x="366.2" y="216.8" font-size="15" fill="#10233f" font-style="italic" textLength="84.3" lengthAdjust="spacing">nemaiauzind</text>
<text x="450.5" y="216.8" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">);</text>
<text x="62.0" y="241.6" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="241.6" font-size="15" fill="#3a3226" textLength="163.3" lengthAdjust="spacing">cliticele se leagă după el:</text>
<text x="241.6" y="241.6" font-size="15" fill="#10233f" font-style="italic" textLength="149.8" lengthAdjust="spacing">văzându-mă, văzând-o</text>
<text x="391.4" y="241.6" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">;</text>
<text x="62.0" y="266.4" font-size="15" fill="#3a3226">•</text>
<text x="74.2" y="266.4" font-size="15" fill="#3a3226" textLength="276.6" lengthAdjust="spacing">acordat cu un substantiv, devine adjectiv (</text>
<text x="350.8" y="266.4" font-size="15" fill="#3a3226" font-weight="700" textLength="120.2" lengthAdjust="spacing">gerunziu acordat</text>
<text x="470.9" y="266.4" font-size="15" fill="#3a3226" textLength="7.8" lengthAdjust="spacing">):</text>
<text x="482.8" y="266.4" font-size="15" fill="#10233f" font-style="italic" textLength="141.1" lengthAdjust="spacing">cu buzele tremurânde</text>
<text x="623.9" y="266.4" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="284.9" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="306.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="46.3" lengthAdjust="spacing">Funcția</text>
<text x="306.8" y="306.4" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="316.4" x2="838.0" y2="316.4" stroke="#e3dccb"/>
<text x="74.0" y="338.9" font-size="14.5" fill="#3a3226" textLength="142.1" lengthAdjust="spacing">circumstanțial de mod</text>
<text x="306.8" y="338.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="37.7" lengthAdjust="spacing">Cântă</text>
<text x="348.4" y="338.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="61.0" lengthAdjust="spacing">atingând</text>
<text x="413.4" y="338.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="105.7" lengthAdjust="spacing">clapele cu grație.</text>
<line x1="62.0" y1="349.3" x2="838.0" y2="349.3" stroke="#e3dccb"/>
<text x="74.0" y="371.8" font-size="14.5" fill="#3a3226" textLength="142.0" lengthAdjust="spacing">circumstanțial de timp</text>
<text x="306.8" y="371.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="54.8" lengthAdjust="spacing">Trecând</text>
<text x="365.5" y="371.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="185.0" lengthAdjust="spacing">prin parc, a văzut-o pe Maria.</text>
<line x1="62.0" y1="382.1" x2="838.0" y2="382.1" stroke="#e3dccb"/>
<text x="74.0" y="404.6" font-size="14.5" fill="#3a3226" textLength="85.5" lengthAdjust="spacing">atribut verbal</text>
<text x="306.8" y="404.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="67.1" lengthAdjust="spacing">Cu hainele</text>
<text x="377.8" y="404.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="64.4" lengthAdjust="spacing">fluturând</text>
<text x="442.2" y="404.6" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">,</text>
<text x="449.3" y="404.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="120.5" lengthAdjust="spacing">alerga spre pădure.</text>
<line x1="62.0" y1="415.0" x2="838.0" y2="415.0" stroke="#e3dccb"/>
<text x="74.0" y="437.5" font-size="14.5" fill="#3a3226" textLength="120.6" lengthAdjust="spacing">complement direct</text>
<text x="306.8" y="437.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="24.8" lengthAdjust="spacing">Văd</text>
<text x="335.5" y="437.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="66.7" lengthAdjust="spacing">fulgerând</text>
<text x="406.1" y="437.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="62.4" lengthAdjust="spacing">în noapte.</text>
<line x1="62.0" y1="447.8" x2="838.0" y2="447.8" stroke="#e3dccb"/>
<line x1="294.8" y1="284.9" x2="294.8" y2="447.8" stroke="#e3dccb"/>
<rect x="40" y="485.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="508.8" font-size="16" font-weight="700" fill="#ffffff">2. SUPINUL</text>
<rect x="40" y="519.8" width="820" height="287.0" fill="#ffffff" stroke="#e3dccb"/>
<text x="62.0" y="552.8" font-size="15" fill="#3a3226" textLength="335.4" lengthAdjust="spacing">Denumește acțiunea, ca infinitivul. Se formează din</text>
<text x="401.4" y="552.8" font-size="15" fill="#3a3226" font-weight="700" textLength="158.0" lengthAdjust="spacing">prepoziție + participiu</text>
<text x="559.4" y="552.8" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">:</text>
<text x="566.8" y="552.8" font-size="15" fill="#10233f" font-style="italic" textLength="152.4" lengthAdjust="spacing">de, din, după, la, pentru</text>
<text x="719.2" y="552.8" font-size="15" fill="#3a3226" textLength="62.1" lengthAdjust="spacing">. Negativ:</text>
<text x="785.3" y="552.8" font-size="15" fill="#10233f" font-style="italic" textLength="15.4" lengthAdjust="spacing">de</text>
<text x="62.0" y="574.5" font-size="15" fill="#10233f" font-style="italic" textLength="57.5" lengthAdjust="spacing">neînțeles</text>
<text x="119.5" y="574.5" font-size="15" fill="#3a3226" textLength="3.3" lengthAdjust="spacing">.</text>
<rect x="62.0" y="593.0" width="776.0" height="31.6" fill="#efeaf8"/>
<text x="74.0" y="614.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="46.3" lengthAdjust="spacing">Funcția</text>
<text x="306.8" y="614.5" font-size="13.5" fill="#10233f" font-weight="700" textLength="54.7" lengthAdjust="spacing">Exemplu</text>
<line x1="62.0" y1="624.6" x2="838.0" y2="624.6" stroke="#e3dccb"/>
<text x="74.0" y="647.1" font-size="14.5" fill="#3a3226" textLength="45.5" lengthAdjust="spacing">subiect</text>
<text x="306.8" y="647.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="53.2" lengthAdjust="spacing">De spus</text>
<text x="363.9" y="647.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="41.2" lengthAdjust="spacing">e ușor,</text>
<text x="409.0" y="647.1" font-size="14.5" fill="#3a3226" font-weight="700" textLength="55.7" lengthAdjust="spacing">de făcut</text>
<text x="468.6" y="647.1" font-size="14.5" fill="#10233f" font-style="italic" textLength="75.8" lengthAdjust="spacing">e mai dificil.</text>
<line x1="62.0" y1="657.4" x2="838.0" y2="657.4" stroke="#e3dccb"/>
<text x="74.0" y="679.9" font-size="14.5" fill="#3a3226" textLength="103.1" lengthAdjust="spacing">nume predicativ</text>
<text x="306.8" y="679.9" font-size="14.5" fill="#10233f" font-style="italic" textLength="107.6" lengthAdjust="spacing">Îndemnul lui este</text>
<text x="418.3" y="679.9" font-size="14.5" fill="#3a3226" font-weight="700" textLength="62.4" lengthAdjust="spacing">de urmat</text>
<text x="480.7" y="679.9" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="690.3" x2="838.0" y2="690.3" stroke="#e3dccb"/>
<text x="74.0" y="712.8" font-size="14.5" fill="#3a3226" textLength="85.5" lengthAdjust="spacing">atribut verbal</text>
<text x="306.8" y="712.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="40.0" lengthAdjust="spacing">cartofi</text>
<text x="350.7" y="712.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="51.3" lengthAdjust="spacing">de copt</text>
<text x="402.1" y="712.8" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">,</text>
<text x="409.2" y="712.8" font-size="14.5" fill="#10233f" font-style="italic" textLength="40.0" lengthAdjust="spacing">cartofi</text>
<text x="453.1" y="712.8" font-size="14.5" fill="#3a3226" font-weight="700" textLength="57.3" lengthAdjust="spacing">de prăjit</text>
<line x1="62.0" y1="723.1" x2="838.0" y2="723.1" stroke="#e3dccb"/>
<text x="74.0" y="745.6" font-size="14.5" fill="#3a3226" textLength="120.6" lengthAdjust="spacing">complement direct</text>
<text x="306.8" y="745.6" font-size="14.5" fill="#10233f" font-style="italic" textLength="79.3" lengthAdjust="spacing">Am terminat</text>
<text x="390.0" y="745.6" font-size="14.5" fill="#3a3226" font-weight="700" textLength="47.3" lengthAdjust="spacing">de citit</text>
<text x="437.3" y="745.6" font-size="14.5" fill="#3a3226" textLength="3.2" lengthAdjust="spacing">.</text>
<line x1="62.0" y1="756.0" x2="838.0" y2="756.0" stroke="#e3dccb"/>
<text x="74.0" y="778.5" font-size="14.5" fill="#3a3226" textLength="168.8" lengthAdjust="spacing">complement prepozițional</text>
<text x="306.8" y="778.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="86.3" lengthAdjust="spacing">M-am plictisit</text>
<text x="397.0" y="778.5" font-size="14.5" fill="#3a3226" font-weight="700" textLength="76.7" lengthAdjust="spacing">de așteptat</text>
<text x="477.6" y="778.5" font-size="14.5" fill="#10233f" font-style="italic" textLength="52.8" lengthAdjust="spacing">în stație.</text>
<line x1="62.0" y1="788.9" x2="838.0" y2="788.9" stroke="#e3dccb"/>
<line x1="294.8" y1="593.0" x2="294.8" y2="788.8" stroke="#e3dccb"/>
<rect x="40" y="826.8" width="820" height="34" rx="10" fill="#6f5ea8"/>
<text x="58" y="849.8" font-size="16" font-weight="700" fill="#ffffff">3. MODELE DE ANALIZĂ</text>
<rect x="40" y="860.8" width="820" height="102.8" fill="#ffffff" stroke="#e3dccb"/>
<rect x="62.0" y="878.8" width="776.0" height="66.8" rx="12" fill="#f3efe4"/><text x="78.0" y="905.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="633.1" lengthAdjust="spacing">„mergând” – verb predicativ, conjugarea a III-a, gerunziu, funcția sintactică de circumstanțial de mod.</text>
<text x="78.0" y="929.3" font-size="14.5" fill="#10233f" font-style="italic" textLength="582.6" lengthAdjust="spacing">„de făcut” – verb predicativ, conjugarea a III-a, supin, funcția sintactică de complement direct.</text>
<text x="249.4" y="995.1" font-size="11.5" fill="#5b6b83" textLength="401.1" lengthAdjust="spacing">Sursa: Manual Art 7, pp. 76-77, rubricile Repere, tabelele și modelele de analiză.</text>
</svg>
