<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="420" fill="#faf7f0"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Aisbergul cultural</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II · lecția 10 · despre limba și cultura țărilor vecine (II)</text>

  <text x="450" y="88" text-anchor="middle" font-size="12" fill="#3a3226">Cultura unei comunități e un mod de viață: comportamente, credințe, valori, limbă și tradiții împărtășite.</text>

  <rect x="150" y="104" width="600" height="120" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="450" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#0d9c92">Cultura de suprafață — vizibilă</text>
  <text font-size="11.5" fill="#3a3226" text-anchor="middle"><tspan x="450" y="152">mâncare · sărbători · drapel</tspan><tspan x="450" y="172">vestimentație · limbă · folclor</tspan><tspan x="450" y="198">ușor de observat, chiar și dintr-o vizită scurtă</tspan></text>

  <line x1="120" y1="238" x2="780" y2="238" stroke="#6f5ea8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="256" text-anchor="middle" font-size="10.5" fill="#6f5ea8" font-style="italic">linia apei</text>

  <rect x="110" y="266" width="680" height="120" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="450" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#6f5ea8">Cultura de adâncime — nevăzută</text>
  <text font-size="11.5" fill="#3a3226" text-anchor="middle"><tspan x="450" y="314">stil de comunicare · maniere · relații familiale · valori</tspan><tspan x="450" y="340">se descoperă trăind o vreme acolo,</tspan><tspan x="450" y="358">vizitând țările respective sau citind despre ele</tspan></text>

  <text x="450" y="406" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 63-64</text>
</svg>
