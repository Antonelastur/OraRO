<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="400" fill="#faf7f0"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Despre limba și cultura țărilor vecine (I)</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II · lecția 9</text>

  <rect x="55" y="82" width="380" height="128" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="75" y="106" font-size="13" font-weight="700" fill="#10233f">Cei cinci vecini ai României</text>
  <text font-size="11.5" fill="#3a3226"><tspan x="75" y="130">Ucraina, Republica Moldova, Bulgaria,</tspan><tspan x="75" y="148">Serbia, Ungaria</tspan><tspan x="75" y="172">contactele dintre locuitori au dus la</tspan><tspan x="75" y="190">cuvinte și obiceiuri comune</tspan></text>

  <rect x="465" y="82" width="380" height="128" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
  <text x="485" y="106" font-size="13" font-weight="700" fill="#10233f">Cuvinte împrumutate</text>
  <text font-size="11.5" fill="#3a3226"><tspan x="485" y="130">borcan (din bulgară)</tspan><tspan x="485" y="148">pahar (din maghiară, sârbă)</tspan><tspan x="485" y="166">pernă (din sârbă)</tspan><tspan x="485" y="184">polonic (din ucraineană)</tspan></text>

  <rect x="55" y="226" width="790" height="128" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="75" y="250" font-size="13" font-weight="700" fill="#10233f">Minorități și limbi oficiale</text>
  <text font-size="11.5" fill="#3a3226"><tspan x="75" y="274">în fiecare dintre aceste țări trăiesc minorități naționale; de cele mai multe ori, limbile lor materne</tspan><tspan x="75" y="292">sunt recunoscute ca limbi oficiale și pot fi folosite în administrație, justiție, învățământ.</tspan><tspan x="75" y="318">În Republica Moldova, limba română a fost decretată limbă oficială la 13 martie 2023, în locul</tspan><tspan x="75" y="336">denumirii improprii „limba moldovenească”; diferențele față de româna standard sunt minore.</tspan></text>

  <text x="450" y="384" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 63-64</text>
</svg>
