<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="340" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Verbul. Tipuri de verbe. Locuțiunea verbală</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, „Verbul” · actualizare</text>
  <g>
    <rect x="60" y="95" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="180" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Predicativ</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="180" y="150">sens complet, singur</tspan><tspan x="180" y="166">predicat</tspan><tspan x="180" y="192" font-style="italic">Elevul scrie.</tspan></text>
  </g>
  <g>
    <rect x="330" y="95" width="240" height="150" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
    <text x="450" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Copulativ</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="450" y="150">a fi, a deveni, a ajunge,</tspan><tspan x="450" y="166">a rămâne, a părea...</tspan><tspan x="450" y="192" font-style="italic">El a devenit medic.</tspan></text>
  </g>
  <g>
    <rect x="600" y="95" width="240" height="150" rx="14" fill="#ffffff" stroke="#6f5ea8" stroke-width="2"/>
    <text x="720" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#10233f">Locuțiune verbală</text>
    <text font-size="11" fill="#3a3226" text-anchor="middle"><tspan x="720" y="150">grup stabil de cuvinte,</tspan><tspan x="720" y="166">cu sens de verb</tspan><tspan x="720" y="192" font-style="italic">a-și da seama</tspan></text>
  </g>
  <text x="450" y="290" text-anchor="middle" font-size="11.5" fill="#3a3226">Verbul copulativ nu are sens complet singur — are nevoie de numele predicativ.</text>
  <text x="450" y="316" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 67-69</text>
</svg>
