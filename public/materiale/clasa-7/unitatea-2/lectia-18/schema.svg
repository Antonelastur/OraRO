<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'Plus Jakarta Sans', -apple-system, Roboto, sans-serif">
  <rect width="900" height="320" fill="#faf7f0"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#10233f">Circumstanțialul de cauză</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#5b6b83">Unitatea II, „Posibilități combinatorii ale verbului”</text>
  <rect x="150" y="95" width="600" height="90" rx="14" fill="#ffffff" stroke="#0d9c92" stroke-width="2"/>
  <text x="450" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Ce arată</text>
  <text font-size="12" fill="#3a3226" text-anchor="middle"><tspan x="450" y="147">Motivul, cauza pentru care se petrece acțiunea exprimată de verb.</tspan><tspan x="450" y="164" font-weight="700">Întrebări: din ce cauză? din ce pricină? de ce?</tspan></text>
  <text x="450" y="228" text-anchor="middle" font-size="13" fill="#3a3226" font-style="italic">A întârziat din cauza ploii.</text>
  <text x="450" y="270" text-anchor="middle" font-size="11" fill="#5b6b83">Sursă: Art 7, pp. 78-80</text>
</svg>
